<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운송수단 & 하역장</title>
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url('fonts/Pretendard-Medium.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('fonts/Pretendard-Bold.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url('fonts/Pretendard-ExtraBold.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Pretendard'; font-weight: 900; src: url('fonts/Pretendard-Black.woff2') format('woff2'); font-display: block; }
  :root { --bg: #05070b; --fg: #e9edf3; --dim: #7d8696; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'Pretendard', sans-serif; font-weight: 500; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
  #stage { width: min(100vw, calc((100vh - 48px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #0b0f17; cursor: pointer; }
  #bar { width: min(100vw - 32px, calc((100vh - 48px) * 16 / 9)); display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #bar input { flex: 1; accent-color: #f5b83d; }
  #bar button { font: inherit; background: transparent; color: var(--fg); border: 1px solid #2a3140; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
  body.capture { display: block; }
  body.capture #bar { display: none; }
  body.capture #stage { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="bar"><button id="play">일시정지</button><input id="seek" type="range" min="0" max="49" step="0.01" value="0"><span id="clock">0.0s</span></div>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────
// STSV 업데이트 "운송수단 & 하역장" · 1920×1080 · 49초 · 소리 없음
// render(t) 는 시간 t(초)만 보고 그린다. ?t=12.5 로 그 시점에 멈춤, ?capture=1 은 프레임 추출용.
// ─────────────────────────────────────────────────────────────
const W = 1920, H = 1080;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const C = {
  bg: '#0b0f17', ink: '#f2f4f7', dim: '#8a93a3', faint: 'rgba(255,255,255,.10)',
  gold: '#f5b83d', goldSoft: 'rgba(245,184,61,.16)', green: '#0e7a4f', lane: '#ffffff'
};

// ── 이징 ─────────────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, d) => clamp((t - a) / d);
const xOut = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const xIn = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const xInOut = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2;
const qOut = k => 1 - Math.pow(1 - k, 4);
const sOut = k => 1 - Math.pow(1 - k, 2);
const fmt = n => Math.round(n).toLocaleString('en-US');

// ── 에셋 ─────────────────────────────────────────────────────
const IMG = {};
const NAMES = ['jige', 'hand_cart', 'cargo_bike', 'ox_cart', 'scooter', 'tiller', 'light_truck', 'cargo_van', 'box_truck', 'tractor', 'boat', 'atv',
  'load0', 'load1', 'load2', 'load3', 'load4', 'terminal', 'dock_land', 'dock_port',
  'road_flat', 'road_bridge', 'road_tunnel', 'road_forest', 'road_overpass', 'road_junction', 'ruby', 'oak_barrel'];
function loadAll() {
  const imgs = NAMES.map(n => new Promise(res => { const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = () => { console.warn('missing', n); res(); }; im.src = `assets/${n}.png`; }));
  const fonts = [500, 700, 800, 900].map(w => document.fonts.load(`${w} 64px Pretendard`, '운송수단하역장0123456789'));
  return Promise.all([...imgs, ...fonts]).then(() => document.fonts.ready);
}

// ── 글자 ─────────────────────────────────────────────────────
function setFont(size, w = 700, ls = 0) {
  ctx.font = `${w} ${size}px Pretendard`;
  ctx.letterSpacing = `${ls}px`;
}
function tw(s, size, w = 700, ls = 0) { setFont(size, w, ls); return ctx.measureText(s).width; }
// y 는 글자 가운데. 마스크 안에서 아래→위로 탁 올라오는 등장 (k: 0→1)
function text(s, x, y, o = {}) {
  const size = o.size || 40, w = o.w || 700, ls = o.ls !== undefined ? o.ls : -size * 0.02;
  setFont(size, w, ls);
  const width = ctx.measureText(s).width;
  const x0 = o.align === 'center' ? x - width / 2 : o.align === 'right' ? x - width : x;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const a = o.alpha === undefined ? 1 : o.alpha;
  if (a <= 0) return width;
  ctx.save();
  ctx.globalAlpha *= a;
  if (o.k !== undefined) {
    const k = clamp(o.k);
    if (k <= 0) { ctx.restore(); return width; }
    ctx.beginPath(); ctx.rect(x0 - size, y - size * 0.68, width + size * 2, size * 1.36); ctx.clip();
    const dy = (1 - xOut(k)) * size * 1.15;
    ctx.fillStyle = o.color || C.ink; ctx.fillText(s, x0, y + dy + size * 0.04);
  } else {
    if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 40; }
    ctx.fillStyle = o.color || C.ink; ctx.fillText(s, x0, y + size * 0.04);
  }
  ctx.restore();
  return width;
}
// 여러 조각을 한 줄로 (색 다르게). parts: [[문자열, 색], ...]
function richLine(parts, x, y, o = {}) {
  const size = o.size || 40, w = o.w || 700, ls = o.ls !== undefined ? o.ls : -size * 0.02;
  const widths = parts.map(([s]) => tw(s, size, w, ls));
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  parts.forEach(([s, col, kk], i) => { text(s, cx, y, { ...o, align: 'left', color: col, k: kk !== undefined ? kk : o.k }); cx += widths[i]; });
  return total;
}
// 탭 숫자: 숫자마다 같은 폭 칸에 놓음 (카운트업 때 글자가 흔들리지 않게)
function tabular(s, x, y, o = {}) {
  const size = o.size || 80, w = o.w || 900;
  setFont(size, w, 0);
  const dw = Math.max(...'0123456789'.split('').map(d => ctx.measureText(d).width));
  const cw = ch => /[0-9]/.test(ch) ? dw : ctx.measureText(ch).width + (ch === ',' || ch === '.' ? -size * 0.02 : 0);
  const chars = [...s];
  const total = chars.reduce((a, ch) => a + cw(ch), 0) + (o.track || 0) * (chars.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 50; }
  ctx.fillStyle = o.color || C.ink;
  for (const ch of chars) { const c = cw(ch); ctx.fillText(ch, cx + c / 2, y + size * 0.04); cx += c + (o.track || 0); }
  ctx.restore();
  return total;
}

// ── 그리기 도우미 ───────────────────────────────────────────
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// 절제된 유리 카드: 반투명 + 얇은 테두리 + 위쪽 하이라이트
function glass(x, y, w, h, o = {}) {
  const r = o.r || 18;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.065)'); g.addColorStop(1, 'rgba(255,255,255,.02)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r, y + 0.5); ctx.lineTo(x + w - r, y + 0.5);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
  ctx.restore();
}
// 바닥 그림자: 흐린 타원 하나
function floorShadow(cx, cy, w, h, a = .55) {
  ctx.save();
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, w / 2);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.setTransform(1, 0, 0, h / w, 0, cy - cy * h / w);
  ctx.fillStyle = g; ctx.fillRect(cx - w / 2, cy - w / 2, w, w);
  ctx.restore();
}
// 투명 스프라이트를 상자 안에 맞춰 (확대는 nearest)
function sprite(name, cx, cy, bw, bh, s = 1, alpha = 1) {
  const im = IMG[name]; if (!im) return;
  const k = Math.min(bw / im.width, bh / im.height) * s;
  const w = im.width * k, h = im.height * k;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, Math.round(cx - w / 2), Math.round(cy - h / 2), Math.round(w), Math.round(h));
  ctx.restore();
}
// 사진(게임 장면)을 살짝 기울인 3D 카드로: 세로 띠로 나눠 원근을 흉내냄.
// src: 켄 번즈용 원본 영역 [sx,sy,sw,sh], tilt: 오른쪽 가장자리가 줄어드는 비율(음수면 왼쪽)
function tiltCard(name, src, x, y, w, h, tilt = 0.08, o = {}) {
  const im = IMG[name]; if (!im) return;
  const [sx, sy, sw, sh] = src;
  const N = 96;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  // 그림자
  floorShadow(x + w / 2, y + h + 26, w * 0.9, 70, 0.6);
  ctx.imageSmoothingEnabled = false;
  const hAt = u => h * (1 - tilt * (tilt > 0 ? u : (u - 1)));
  for (let i = 0; i < N; i++) {
    const u0 = i / N, u1 = (i + 1) / N;
    const hh = hAt((u0 + u1) / 2);
    const dx = x + w * u0, dw = Math.ceil(w / N) + 1;
    ctx.drawImage(im, sx + sw * u0, sy, sw / N, sh, dx, y + (h - hh) / 2, dw, hh);
  }
  // 가장자리 페이드 + 얇은 테두리
  const top = u => y + (h - hAt(u)) / 2;
  ctx.beginPath(); ctx.moveTo(x, top(0)); ctx.lineTo(x + w, top(1)); ctx.lineTo(x + w, y + h - (top(1) - y)); ctx.lineTo(x, y + h - (top(0) - y)); ctx.closePath();
  const fade = ctx.createLinearGradient(0, y, 0, y + h);
  fade.addColorStop(0, 'rgba(11,15,23,.35)'); fade.addColorStop(0.18, 'rgba(11,15,23,0)'); fade.addColorStop(0.72, 'rgba(11,15,23,0)'); fade.addColorStop(1, 'rgba(11,15,23,.75)');
  ctx.fillStyle = fade; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.stroke();
  ctx.restore();
}
// 화면 가득 사진 (켄 번즈: 시작·끝 배율과 이동)
function fullPhoto(name, k, z0 = 1.0, z1 = 1.08, px = 0, py = 0, dark = 0.35) {
  const im = IMG[name]; if (!im) return;
  const base = Math.max(W / im.width, H / im.height);
  const z = base * lerp(z0, z1, k);
  const w = im.width * z, h = im.height * z;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, W / 2 - w / 2 + px * k, H / 2 - h / 2 + py * k, w, h);
  ctx.restore();
  ctx.fillStyle = `rgba(11,15,23,${dark})`; ctx.fillRect(0, 0, W, H);
}

// ── 배경 ─────────────────────────────────────────────────────
let BG = null, VIG = null;
function makeBG() {
  BG = document.createElement('canvas'); BG.width = W; BG.height = H;
  let g = BG.getContext('2d');
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const r = g.createRadialGradient(W * 0.62, H * 0.28, 0, W * 0.62, H * 0.28, 1300);
  r.addColorStop(0, 'rgba(38,58,92,.42)'); r.addColorStop(0.55, 'rgba(20,30,50,.18)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
  VIG = document.createElement('canvas'); VIG.width = W; VIG.height = H;
  g = VIG.getContext('2d');
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.62)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
const bg = () => ctx.drawImage(BG, 0, 0);
const vignette = () => ctx.drawImage(VIG, 0, 0);
// 흰 차선 (점선이 흘러감)
function laneDashes(y, t, o = {}) {
  const dash = o.dash || 90, gap = o.gap || 70, speed = o.speed || 260, hgt = o.h || 4;
  ctx.save(); ctx.globalAlpha *= o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || 'rgba(255,255,255,.85)';
  const off = (t * speed) % (dash + gap);
  for (let x = -dash - off; x < W; x += dash + gap) ctx.fillRect(Math.round(x), y - hgt / 2, dash, hgt);
  ctx.restore();
}
function kicker(s, x, y, a = 1, align = 'left', color = C.gold) {
  text(s, x, y, { size: 26, w: 700, ls: 6, color, alpha: a, align });
}

// ═════════════════════════ 장면 ═════════════════════════════

// 0. 암전 → 차선 → 제목
function sIntro(l) {
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  const lit = xOut(prog(l, 1.1, 1.4));
  ctx.globalAlpha = lit; bg(); ctx.globalAlpha = 1;
  const ly = 700;
  // 흰 차선이 한 번에 그어짐
  const k = prog(l, 0.35, 0.55);
  if (k > 0) {
    const head = xOut(k) * (W + 200);
    const split = xInOut(prog(l, 1.0, 0.6));      // 실선이 점선으로 갈라짐
    const scroll = Math.max(0, l - 1.0);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, head, H); ctx.clip();
    if (split <= 0) { ctx.fillStyle = '#fff'; ctx.fillRect(0, ly - 3, W, 6); }
    else laneDashes(ly, scroll * (0.4 + split), { dash: 120, gap: 80 * split, h: 6, speed: 300, alpha: 1 - split * 0.35 });
    ctx.restore();
    // 머리 부분 빛
    if (k < 1) { const g = ctx.createLinearGradient(head - 260, 0, head, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.9)'); ctx.fillStyle = g; ctx.fillRect(head - 260, ly - 10, 260, 20); }
  }
  // 제목: 단어 단위로 탁
  const size = 190, cy = 500;
  const words = [['운송수단', C.ink, 1.25], ['&', C.gold, 1.5], ['하역장', C.ink, 1.72]];
  const gap = 46;
  const ws = words.map(([s]) => tw(s, size, 900, -size * 0.03));
  let x = W / 2 - (ws.reduce((a, b) => a + b, 0) + gap * 2) / 2;
  const push = 1 + 0.025 * sOut(prog(l, 1.6, 2.6));
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(push, push); ctx.translate(-W / 2, -cy);
  words.forEach(([s, col, at], i) => { text(s, x, cy, { size, w: 900, ls: -size * 0.03, color: col, k: prog(l, at, 0.6) }); x += ws[i] + gap; });
  ctx.restore();
  kicker('STSV 업데이트', W / 2, 340, xOut(prog(l, 1.05, 0.6)), 'center');
  vignette();
}

// 1. 세대별 운송수단
const GENS = [
  { n: '1', label: '세대', v: [['jige', '지게'], ['hand_cart', '리어카']] },
  { n: '2', label: '세대', v: [['cargo_bike', '짐자전거'], ['ox_cart', '소달구지']] },
  { n: '3', label: '세대', v: [['scooter', '배달 오토바이'], ['tiller', '경운기']] },
  { n: '4', label: '세대', v: [['light_truck', '1톤 트럭'], ['cargo_van', '소형 화물 밴']] },
  { n: '5', label: '세대', v: [['box_truck', '탑차'], ['tractor', '트랙터 + 트레일러']] },
  { n: '특수', label: '', v: [['boat', '통통배'], ['atv', '사륜 오토바이']] }
];
const GEN_T0 = 0.35, GEN_STEP = 1.45;
function sGens(l, dur) {
  bg();
  // 왼쪽 위 작은 설명
  kicker('세대별 운송수단', 140, 160, xOut(prog(l, 0.15, 0.6)));
  text('연료 없이, WASD로 운전', 140, 210, { size: 32, w: 500, color: C.dim, alpha: xOut(prog(l, 0.3, 0.6)) });
  let gi = Math.floor((l - GEN_T0) / GEN_STEP); gi = clamp(gi, 0, GENS.length - 1);
  // 큰 숫자 (위로 밀려나가고 아래에서 탁)
  const numY = 560, numX = 132;
  ctx.save(); ctx.beginPath(); ctx.rect(0, numY - 250, 800, 440); ctx.clip();
  const REEL = 600;
  for (let i = Math.max(0, gi - 1); i <= Math.min(GENS.length - 1, gi + 1); i++) {
    const kin = xOut(prog(l, GEN_T0 + i * GEN_STEP, 0.5));
    const kout = i < GENS.length - 1 ? xOut(prog(l, GEN_T0 + (i + 1) * GEN_STEP, 0.5)) : 0;
    if (kin <= 0 || kout >= 1) continue;
    const dy = (1 - kin) * REEL - kout * REEL;
    const g = GENS[i];
    const isNum = g.n.length === 1;
    const size = isNum ? 460 : 300;
    const nw = tabular(g.n, numX, numY + dy + (isNum ? 0 : 40), { size, w: 900, color: C.gold });
    if (g.label) text(g.label, numX + nw + 20, numY + dy + 138, { size: 76, w: 800, color: C.ink });
  }
  ctx.restore();
  // 진행 눈금
  for (let i = 0; i < GENS.length; i++) {
    const on = i <= gi && l >= GEN_T0;
    ctx.fillStyle = on ? C.gold : 'rgba(255,255,255,.14)';
    ctx.fillRect(140 + i * 74, 880, 60, 4);
  }
  // 탈것 카드 두 장
  const cw = 460, ch = 470, cy = 300;
  for (let i = Math.max(0, gi - 1); i <= gi; i++) {
    const s = GEN_T0 + i * GEN_STEP;
    const next = GEN_T0 + (i + 1) * GEN_STEP;
    GENS[i].v.forEach(([img, name], j) => {
      const kin = prog(l, s + 0.06 + j * 0.09, 0.62);
      const kout = i < GENS.length - 1 ? prog(l, next - 0.22 + j * 0.04, 0.26) : 0;
      if (kin <= 0 || kout >= 1) return;
      const x = 860 + j * (cw + 36) + (1 - xOut(kin)) * 1000 - xIn(kout) * 260;
      const a = 1 - xIn(kout);
      glass(x, cy, cw, ch, { alpha: a });
      ctx.save(); ctx.beginPath(); ctx.roundRect(x, cy, cw, ch, 18); ctx.clip();
      const kb = prog(l, s, GEN_STEP + 0.6);
      const sp = ctx.createRadialGradient(x + cw / 2, cy + 200, 0, x + cw / 2, cy + 200, 260);
      sp.addColorStop(0, `rgba(245,184,61,${0.10 * a})`); sp.addColorStop(1, 'rgba(245,184,61,0)');
      ctx.fillStyle = sp; ctx.fillRect(x, cy, cw, ch);
      floorShadow(x + cw / 2, cy + 318, 320, 44, 0.7 * a);
      sprite(img, x + cw / 2, cy + 200, cw - 70, 250, 1 + 0.06 * kb, a);
      ctx.restore();
      ctx.fillStyle = `rgba(255,255,255,${0.08 * a})`; ctx.fillRect(x + 32, cy + 372, cw - 64, 1);
      text(name, x + 32, cy + 420, { size: name.length > 7 ? 36 : 42, w: 800, color: C.ink, alpha: a });
    });
  }
  vignette();
}

// 2. 짐칸 클로즈업 + 무게 게이지
function sLoad(l) {
  bg();
  const ck = xOut(prog(l, 0.05, 0.7));
  const stageF = clamp((l - 0.6) / 2.6) * 4; // 0..4
  const si = Math.floor(stageF), sf = stageF - si;
  const x = 150, y = 210 + (1 - ck) * 120, w = 720, h = 668;
  const kb = prog(l, 0, 6.2);
  const z = 1 + 0.08 * kb;
  const src = (im) => { const sw = 320 / z, sh = 298 / z; return [ (320 - sw) * 0.55, (298 - sh) * 0.35, sw, sh ]; };
  ctx.save(); ctx.globalAlpha = ck;
  tiltCard(`load${si}`, src(), x, y, w, h, 0.07);
  if (si < 4 && sf > 0.78) { ctx.globalAlpha = ck * (sf - 0.78) / 0.22; tiltCard(`load${si + 1}`, src(), x, y, w, h, 0.07); }
  ctx.restore();
  // 무게 게이지 (얇은 금색)
  const gx = 930, gy0 = 236, gh = 616;
  const fill = clamp(stageF / 4);
  const ga = xOut(prog(l, 0.3, 0.5));
  ctx.globalAlpha = ga;
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(gx, gy0, 4, gh);
  const fy = gy0 + gh * (1 - fill);
  const gg = ctx.createLinearGradient(0, fy, 0, gy0 + gh);
  gg.addColorStop(0, '#ffd27a'); gg.addColorStop(1, C.gold);
  ctx.fillStyle = gg; ctx.fillRect(gx, fy, 4, gy0 + gh - fy);
  ctx.save(); ctx.shadowColor = 'rgba(245,184,61,.8)'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffe3a8'; ctx.fillRect(gx - 6, fy - 1, 16, 3); ctx.restore();
  for (let i = 0; i <= 4; i++) ctx.fillRect(gx + 12, gy0 + gh * i / 4, 10, 1);
  tabular(`${Math.round(fill * 100)}%`, gx + 34, fy, { size: 40, w: 800, color: C.ink });
  text('적재', gx + 34, gy0 + gh + 30, { size: 24, w: 500, color: C.dim, ls: 4 });
  ctx.globalAlpha = 1;
  // 오른쪽: 먼저 작은 설명, 그다음 큰 문구
  const tx = 1110;
  const pre = 1 - xIn(prog(l, 3.05, 0.3));
  kicker('적재 무게', tx, 360, xOut(prog(l, 0.5, 0.6)) * pre);
  text('실은 만큼,', tx, 450, { size: 64, w: 800, k: prog(l, 0.7, 0.6), alpha: pre });
  text('짐칸에 그대로 쌓인다', tx, 530, { size: 64, w: 800, k: prog(l, 0.85, 0.6), alpha: pre });
  // 큰 문구
  richLine([['보석은 ', C.ink], ['가볍게.', C.gold]], tx, 430, { size: 112, w: 900, k: prog(l, 3.3, 0.55) });
  richLine([['술통은 ', C.ink], ['무겁게.', C.gold]], tx, 570, { size: 112, w: 900, k: prog(l, 3.62, 0.55) });
  const fa = xOut(prog(l, 4.3, 0.6));
  text('원재료는 칸 수로, 완성품은 무게로 실어요', tx, 690, { size: 34, w: 500, color: C.dim, alpha: fa });
  // 작은 예시 줄
  const ea = xOut(prog(l, 4.6, 0.6));
  if (ea > 0) {
    ctx.globalAlpha = ea;
    sprite('ruby', tx + 24, 790, 48, 48);
    text('→  배달 오토바이', tx + 64, 790, { size: 30, w: 700, color: C.ink });
    sprite('oak_barrel', tx + 384, 790, 48, 48);
    text('→  탑차', tx + 424, 790, { size: 30, w: 700, color: C.ink });
    ctx.globalAlpha = 1;
  }
  vignette();
}

// 3. 화물 검사소: 체크 → 봉인 도장
const STAMP = 3.25;
function sInspect(l) {
  bg();
  // 배경 사진: 오른쪽에서 천천히
  const pk = prog(l, 0, 7);
  ctx.save(); ctx.globalAlpha = 0.9 * (1 - 0.6 * xOut(prog(l, STAMP - 0.05, 0.3)));
  const im = IMG.terminal;
  if (im) {
    const z = lerp(1.0, 1.07, pk), sw = im.width / z, sh = im.height / z;
    tiltCard('terminal', [(im.width - sw) * 0.5, (im.height - sh) * 0.4, sw, sh], 960, 170, 860, 612, -0.06, { alpha: xOut(prog(l, 0.05, 0.7)) });
  }
  ctx.restore();
  const dimAfter = 1 - 0.65 * xOut(prog(l, STAMP - 0.05, 0.3));
  ctx.save(); ctx.globalAlpha = dimAfter;
  kicker('출발 터미널', 140, 230, xOut(prog(l, 0.2, 0.6)));
  text('화물 검사소', 140, 330, { size: 120, w: 900, k: prog(l, 0.3, 0.6) });
  const items = ['짐 목록 확인', '목적지 · 서해 하역장', '짐칸 무게 확인'];
  items.forEach((s, i) => {
    const at = 1.0 + i * 0.55;
    const y = 520 + i * 92;
    const a = xOut(prog(l, at - 0.35, 0.4));
    const k = xOut(prog(l, at, 0.35));
    ctx.globalAlpha = dimAfter * a;
    ctx.lineWidth = 2; ctx.strokeStyle = k > 0 ? C.gold : 'rgba(255,255,255,.35)';
    rr(140, y - 20, 40, 40, 8); ctx.stroke();
    if (k > 0) { // 체크 표시가 그어짐
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = C.gold;
      const p1 = [151, y + 1], p2 = [158, y + 9], p3 = [171, y - 9];
      ctx.beginPath(); ctx.moveTo(...p1);
      const kk = k * 2;
      if (kk < 1) ctx.lineTo(lerp(p1[0], p2[0], kk), lerp(p1[1], p2[1], kk));
      else { ctx.lineTo(...p2); ctx.lineTo(lerp(p2[0], p3[0], kk - 1), lerp(p2[1], p3[1], kk - 1)); }
      ctx.stroke(); ctx.lineCap = 'butt';
    }
    text(s, 210, y, { size: 44, w: 700, color: k > 0.5 ? C.ink : C.dim });
    // 항목이 그어짐 (얇은 금색 줄)
    ctx.fillStyle = 'rgba(245,184,61,.75)'; ctx.fillRect(210, y + 34, tw(s, 44, 700, -0.88) * k, 2);
  });
  ctx.restore();
  // 봉인 도장
  const sk = prog(l, STAMP, 0.16);
  if (sk > 0) {
    const s = lerp(2.3, 1, xIn(sk));
    const a = clamp(sk * 3);
    ctx.save(); ctx.translate(W / 2, 540); ctx.rotate(-0.09); ctx.scale(s, s); ctx.globalAlpha = a;
    rr(-300, -170, 600, 340, 26); ctx.fillStyle = 'rgba(11,15,23,.92)'; ctx.fill();
    ctx.lineWidth = 10; ctx.strokeStyle = C.gold; rr(-300, -170, 600, 340, 26); ctx.stroke();
    ctx.lineWidth = 3; rr(-276, -146, 552, 292, 16); ctx.stroke();
    text('봉인', 0, -12, { size: 210, w: 900, color: C.gold, align: 'center', ls: 10 });
    text('검사 완료', 0, 110, { size: 34, w: 800, color: C.gold, align: 'center', ls: 12 });
    ctx.restore();
    // 충격 고리
    const rk = prog(l, STAMP + 0.16, 0.38);
    if (rk > 0 && rk < 1) { ctx.save(); ctx.globalAlpha = Math.pow(1 - rk, 2) * 0.5; ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(W / 2, 540, 330 + xOut(rk) * 500, 190 + xOut(rk) * 300, -0.09, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  }
  text('짐칸은 하역장에서만 열려요', W / 2, 830, { size: 40, w: 700, align: 'center', color: C.ink, alpha: xOut(prog(l, STAMP + 0.7, 0.5)) });
  vignette();
}
// 화면 흔들림 (도장 직후 0.35초)
function shakeFor(T) {
  const l = T - SC.inspect[0] - (STAMP + 0.16);
  if (l < 0 || l > 0.38) return [0, 0];
  const a = 16 * Math.pow(1 - l / 0.38, 2);
  return [Math.sin(l * 95) * a, Math.cos(l * 77) * a * 0.7];
}

// 4. 국도 몽타주
const SHOTS = [
  { img: 'road_junction', word: '교차로', z: [1.02, 1.16], p: [-60, 10] },
  { img: 'road_bridge', word: '다리', z: [1.05, 1.18], p: [80, -20] },
  { img: 'road_tunnel', word: '터널', z: [1.10, 1.30], p: [-40, 0], tunnel: true },
  { img: 'road_forest', word: '숲길', z: [1.04, 1.20], p: [-120, 40] },
  { img: 'road_overpass', word: '고가', z: [1.04, 1.16], p: [60, 0] }
];
const SHOT_T = [0, 2.1, 4.1, 6.0, 8.0, 10.2];
const DIST = [7.0, 5.5, 3.8, 2.1, 0.5];
function sRoad(l) {
  let si = SHOT_T.findIndex((t, i) => l >= t && l < SHOT_T[i + 1]); if (si < 0) si = SHOTS.length - 1;
  const sh = SHOTS[si];
  const k = prog(l, SHOT_T[si], SHOT_T[si + 1] - SHOT_T[si]);
  fullPhoto(sh.img, k, sh.z[0], sh.z[1], sh.p[0], sh.p[1], sh.tunnel ? 0.5 : 0.28);
  if (sh.tunnel) tunnelStreaks(l - SHOT_T[si]);
  // 아래쪽 어둡게
  const g = ctx.createLinearGradient(0, H * 0.45, 0, H);
  g.addColorStop(0, 'rgba(11,15,23,0)'); g.addColorStop(1, 'rgba(11,15,23,.85)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createLinearGradient(0, 0, 0, 260);
  g2.addColorStop(0, 'rgba(11,15,23,.7)'); g2.addColorStop(1, 'rgba(11,15,23,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, 260);
  // 컷 사이: 가는 틈으로 빠르게 넘어감 (첫 컷 제외)
  const cutK = prog(l, SHOT_T[si], 0.2);
  if (si > 0 && cutK < 1) {
    ctx.fillStyle = C.bg; const hh = H * (1 - xOut(cutK)); ctx.fillRect(0, H / 2 - hh / 2, W, hh);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(0, H / 2 - hh / 2 - 1, W, 2); ctx.fillRect(0, H / 2 + hh / 2 - 1, W, 2);
  }
  // 한 컷 한 단어 (크게)
  text(sh.word, 140, 840, { size: 200, w: 900, k: prog(l, SHOT_T[si] + 0.08, 0.5) });
  text('국도 약 7,000블록 · 편도 약 15분', 140, 120, { size: 30, w: 700, ls: 1, color: '#ffffff', alpha: xOut(prog(l, 0.2, 0.6)) });
  // 진행선
  const p = clamp(l / 10.2);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(140, 980, W - 280, 2);
  ctx.fillStyle = C.gold; ctx.fillRect(140, 980, (W - 280) * p, 2);
  ctx.save(); ctx.shadowColor = C.gold; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(140 + (W - 280) * p, 981, 7, 0, Math.PI * 2); ctx.fillStyle = '#ffe3a8'; ctx.fill(); ctx.restore();
  roadSign(l);
}
function tunnelStreaks(l) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const seed = Math.sin(i * 91.7) * 43758.5; const r = seed - Math.floor(seed);
    const yy = 120 + ((i * 137) % 840);
    const sp = 2600 + r * 1800;
    const x = ((l * sp + i * 400) % (W + 900)) - 450;
    const len = 280 + r * 420;
    const gr = ctx.createLinearGradient(x, 0, x + len, 0);
    gr.addColorStop(0, 'rgba(255,214,140,0)'); gr.addColorStop(1, `rgba(255,214,140,${0.25 + r * 0.35})`);
    ctx.fillStyle = gr; ctx.fillRect(x, yy, len, 2 + (i % 3));
  }
  ctx.restore();
}
// 초록 방향 표지판: 남은 거리 카운트다운
function roadSign(l) {
  const ek = xOut(prog(l, 0.25, 0.6));
  if (ek <= 0) return;
  const x = 1180, y = 110 - (1 - ek) * 260, w = 600, h = 300;
  // 거리: 컷마다 다음 값으로 감속하며 내려감
  let d = DIST[0];
  for (let i = 1; i < DIST.length; i++) { const kk = xOut(prog(l, SHOT_T[i] - 0.15, 0.7)); d = lerp(d, DIST[i], kk); }
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  rr(x, y, w, h, 16); ctx.fillStyle = C.green; ctx.fill();
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.92)'; rr(x + 12, y + 12, w - 24, h - 24, 10); ctx.stroke();
  // 화살표
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x + 76, y + 46); ctx.lineTo(x + 116, y + 96); ctx.lineTo(x + 88, y + 96); ctx.lineTo(x + 88, y + 156); ctx.lineTo(x + 64, y + 156); ctx.lineTo(x + 64, y + 96); ctx.lineTo(x + 36, y + 96); ctx.closePath(); ctx.fill();
  text('서해 하역장', x + 150, y + 82, { size: 50, w: 800, color: '#fff' });
  // 노선 방패
  rr(x + 40, y + 196, 46, 50, 8); ctx.fillStyle = '#1d4fa3'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  text('1', x + 63, y + 221, { size: 30, w: 900, color: '#fff', align: 'center', ls: 0 });
  text('국도 1호선', x + 100, y + 221, { size: 26, w: 700, color: 'rgba(255,255,255,.9)' });
  const ds = d.toFixed(1);
  const nw = tw('km', 44, 800, 0);
  tabular(ds, x + w - 48 - nw - 12, y + 196, { size: 128, w: 900, color: '#fff', align: 'right' });
  text('km', x + w - 48, y + 220, { size: 44, w: 800, color: '#fff', align: 'right', ls: 0 });
}

// 5. 하역장 도착: 금액 카운트업
function sDock(l) {
  bg();
  const pk = prog(l, 0, 7.4);
  fullPhoto('dock_land', pk, 1.0, 1.1, -80, 30, 0.72);
  const g = ctx.createRadialGradient(W / 2, 540, 100, W / 2, 540, 900);
  g.addColorStop(0, 'rgba(11,15,23,.25)'); g.addColorStop(1, 'rgba(11,15,23,.75)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  kicker('도착 · 하역장', W / 2, 330, xOut(prog(l, 0.25, 0.6)), 'center');
  const ck = prog(l, 0.55, 1.9);
  const v = 543448 * xOut(ck);
  const sa = xOut(prog(l, 0.5, 0.35));
  const settle = prog(l, 2.45, 0.9);
  const glow = settle > 0 ? `rgba(245,184,61,${0.55 * (1 - settle) + 0.15})` : null;
  ctx.save(); ctx.globalAlpha = sa;
  const s = 1 + 0.04 * (1 - xOut(prog(l, 2.45, 0.5))) * (settle > 0 ? 1 : 0);
  ctx.translate(W / 2, 520); ctx.scale(s, s);
  tabular(`+${fmt(v)}\u2009G`, 0, 0, { size: 230, w: 900, color: C.gold, align: 'center', glow, glowBlur: 60, track: -6 });
  ctx.restore();
  text('멀수록 더 받는다', W / 2, 720, { size: 64, w: 800, align: 'center', k: prog(l, 2.6, 0.55) });
  text('하역장마다 매입가가 다르고, 많이 팔아도 값이 떨어지지 않아요', W / 2, 810, { size: 32, w: 500, align: 'center', color: C.dim, alpha: xOut(prog(l, 3.3, 0.7)) });
  vignette();
}

// 6. 마무리
function sOutro(l) {
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.6; bg(); ctx.globalAlpha = 1;
  const up = xInOut(prog(l, 2.15, 0.7));
  const y1 = lerp(540, 380, up);
  const sz = lerp(96, 64, up);
  richLine([['많이 벌려면, ', C.ink, prog(l, 0.3, 0.6)], ['직접 실어 날라라.', C.ink, prog(l, 0.72, 0.6)]], W / 2, y1, { size: sz, w: 800, align: 'center', alpha: 1 - 0.35 * up });
  richLine([['지금 ', C.ink], ['STSV', C.gold], ['에서', C.ink]], W / 2, 560, { size: 150, w: 900, align: 'center', k: prog(l, 2.5, 0.6) });
  const bk = xOut(prog(l, 3.1, 0.6));
  if (bk > 0) {
    ctx.save(); ctx.globalAlpha = bk;
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.35)';
    const bw = 620 * (0.6 + 0.4 * bk);
    rr(W / 2 - bw / 2, 700, bw, 92, 46); ctx.stroke();
    ctx.restore();
  }
  // 차선으로 닫기
  const lk = prog(l, 3.3, 0.6);
  if (lk > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, xOut(lk) * W, H); ctx.clip(); laneDashes(930, l, { dash: 120, gap: 80, h: 4, speed: 200, alpha: 0.7 }); ctx.restore(); }
  vignette();
}

// ── 와이프 전환: 기울어진 판이 화면 전체를 쓸고 지나감 ─────
const WIPE_IN = 0.32, WIPE_OUT = 0.4;
function wipe(local, idx) {
  // local: -WIPE_IN..0 덮기, 0..WIPE_OUT 걷기
  const skew = 260;
  let a, b; // 판의 왼쪽·오른쪽 가장자리 x (위쪽 기준)
  if (local < 0) { const k = xIn(1 + local / WIPE_IN); a = -skew - 40; b = lerp(-skew - 40, W + skew, k); }
  else { const k = xOut(local / WIPE_OUT); a = lerp(-skew - 40, W + skew, k); b = W + skew + 40; }
  const dir = idx % 2 === 0 ? 1 : -1;
  ctx.save();
  if (dir < 0) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(b, 0); ctx.lineTo(b - skew, H); ctx.lineTo(a - skew, H); ctx.closePath();
  ctx.fillStyle = '#080b12'; ctx.fill();
  // 앞선 가장자리: 금색 선 하나
  const edge = local < 0 ? b : a;
  ctx.beginPath(); ctx.moveTo(edge, 0); ctx.lineTo(edge - skew, H); ctx.lineWidth = 6; ctx.strokeStyle = C.gold; ctx.stroke();
  ctx.restore();
}

// ── 시간표 ───────────────────────────────────────────────────
const SC = {
  intro: [0, 4.2], gens: [4.2, 13.6], load: [13.6, 19.8], inspect: [19.8, 26.6], road: [26.6, 36.8], dock: [36.8, 44.2], outro: [44.2, 49.2]
};
const ORDER = [['intro', sIntro], ['gens', sGens], ['load', sLoad], ['inspect', sInspect], ['road', sRoad], ['dock', sDock], ['outro', sOutro]];
const DURATION = SC.outro[1];
function render(T) {
  T = clamp(T, 0, DURATION);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
  const [sx, sy] = shakeFor(T);
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(sx, sy); if (sx || sy) { ctx.translate(W / 2, H / 2); ctx.scale(1.02, 1.02); ctx.translate(-W / 2, -H / 2); }
  let cur = ORDER.find(([k]) => T >= SC[k][0] && T < SC[k][1]) || ORDER[ORDER.length - 1];
  const [key, fn] = cur;
  fn(T - SC[key][0], SC[key][1] - SC[key][0]);
  ctx.restore();
  for (let i = 1; i < ORDER.length; i++) {
    const B = SC[ORDER[i][0]][0];
    if (T >= B - WIPE_IN && T < B + WIPE_OUT) wipe(T - B, i);
  }
  // 끝 0.5초 페이드 아웃
  if (T > DURATION - 0.5) { ctx.fillStyle = `rgba(5,7,11,${(T - DURATION + 0.5) / 0.5})`; ctx.fillRect(0, 0, W, H); }
}

// ── 재생 ─────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const capture = params.has('capture');
if (capture) document.body.classList.add('capture');
let playing = !capture && !params.has('t'), t0 = performance.now(), cur = parseFloat(params.get('t') || '0');
const seek = document.getElementById('seek'), clock = document.getElementById('clock'), btn = document.getElementById('play');
seek.max = DURATION;
function setT(v) { cur = v; t0 = performance.now() - v * 1000; }
function loop(now) {
  if (playing) { cur = (now - t0) / 1000; if (cur >= DURATION + 1.2) setT(0); }
  render(Math.min(cur, DURATION));
  seek.value = Math.min(cur, DURATION); clock.textContent = Math.min(cur, DURATION).toFixed(1) + 's';
  requestAnimationFrame(loop);
}
btn.onclick = () => { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; if (playing) setT(cur); };
cv.onclick = () => btn.onclick();
seek.oninput = () => setT(parseFloat(seek.value));
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
window.PROMO = { render, DURATION, ready: false };
loadAll().then(() => {
  makeBG();
  window.PROMO.ready = true;
  btn.textContent = playing ? '일시정지' : '재생';
  setT(cur);
  if (!capture) requestAnimationFrame(loop); else render(cur);
});
</script>
