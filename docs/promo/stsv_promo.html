<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STSV 소개 영상</title>
<style>
  @font-face { font-family: 'NeoDGM'; src: url('fonts/neodgm.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'GalmuriB'; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); font-display: block; }
  :root { --bg: #111216; --fg: #ece6d6; --dim: #8d8a83; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'NeoDGM', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
  #stage { width: min(100vw, calc((100vh - 48px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; image-rendering: pixelated; background: #1c1d22; cursor: pointer; }
  #bar { width: min(100vw - 32px, calc((100vh - 48px) * 16 / 9)); display: flex; gap: 12px; align-items: center; font-size: 16px; color: var(--dim); }
  #bar input { flex: 1; accent-color: #f2b134; }
  #bar button { font: inherit; background: #25272e; color: var(--fg); border: 2px solid #3a3d47; padding: 2px 10px; cursor: pointer; }
  body.capture { display: block; }
  body.capture #bar { display: none; }
  body.capture #stage { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="bar"><button id="play">일시정지</button><input id="seek" type="range" min="0" max="60" step="0.01" value="0"><span id="clock">0.0s</span></div>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────
// STSV 소개 모션그래픽 · 1920×1080 · 60초 · 화면 연출만 (소리 없음)
// render(t) 는 시간 t(초)만 보고 그리므로, 같은 t 는 언제나 같은 화면.
// ?t=12.5 로 특정 장면에서 멈춰 보기, ?capture=1 은 프레임 추출용.
// ─────────────────────────────────────────────────────────────
const W = 1920, H = 1080, DURATION = 60;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

const C = {
  bg: '#1c1d22', bg2: '#202128', panel: '#25272e', panel2: '#2d3038', line: '#3a3d47', edge: '#14151a',
  gold: '#f2b134', goldD: '#b97d17', goldL: '#ffd67a',
  wood: '#b8834f', woodD: '#7a5230', woodL: '#dcae74',
  green: '#7cc44a', greenD: '#3f7f2a', cream: '#f3e9d2', text: '#ece6d6', dim: '#9a978f',
  red: '#ef4b4b', blue: '#3f8cff', sky: '#6fa4e0', water: '#2b6c9c', purple: '#a974e0', pink: '#f07fae'
};

// ── 수학 ──────────────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function hash(n) { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');

// ── 에셋 ──────────────────────────────────────────────────────
const IMG = {};
const CROP_ITEMS = ['tomato','chili_pepper','strawberry','onion','garlic','napa_cabbage','paddy','soybean','corn','green_onion','radish','lettuce','cucumber','grapes','eggplant','zucchini','muskmelon'];
const CROP_STAGES = [5,5,4,4,4,4,5,4,5,4,4,4,5,5,5,5,5];
const ITEMS = ['kimchi','napa_cabbage','chili_powder','chili_pepper','rough_ruby','ruby','ruby_ring','jeweled_crown','vintage_wine','makgeolli','rice','wild_ginseng','golden_ear','red_coral','ambergris','meteoric_iron','meteor_sword','steel_ingot','mackerel','salted_mackerel','grapes','wine','ginseng_liquor','tomato','corn','radish','eggplant','muskmelon','flour','gold_ring','pearl_necklace','tuna_sushi','bluefin_tuna','marlin','clownfish','octopus','king_crab','golden_crucian','sunfish','whale_shark','oak_barrel','cut_diamond','sapphire','bibimbap','samgyetang','pearl','giant_squid','dragon_carp','sickle','homi','iron_pan','copper_pot','soju','strawberry_cake','golden_injeolmi','paddy','garlic','silk_cocoon','onion','strawberry','soybean','green_onion','lettuce','cucumber','zucchini','godeungeo_gui','kotatsu_icon','torii_icon','maneki_neko_icon','daruma_icon','wagasa_icon','chochin_icon','crown_voucher','cat_ears_voucher','angel_wings_voucher','heart_trail_voucher','cheque'];
function assetList() {
  const a = [];
  for (const m of ['gem','mill','fish','forge','cook','still']) for (let l = 0; l < 4; l++) a.push(`m_${m}${l}`);
  a.push('room','c_straw','c_wizard','c_crown','c_frog','c_gat');
  ITEMS.forEach(i => a.push('i_' + i));
  CROP_STAGES.forEach((n, r) => { for (let s = 0; s < n; s++) a.push(`crop_${r}_${s}`); });
  return a;
}
function loadAll() {
  const names = assetList();
  const imgs = names.map(n => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = () => { console.warn('missing', n); res(); }; im.src = `assets/${n}.png`;
  }));
  const fonts = [document.fonts.load('64px NeoDGM', '많이하면STSV0123'), document.fonts.load('48px GalmuriB', '0123456789,G')];
  return Promise.all([...imgs, ...fonts]).then(() => document.fonts.ready);
}

// ── 그리기 도우미 ────────────────────────────────────────────
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function img(name, x, y, w, h, smooth = false) {
  const im = IMG[name]; if (!im) return;
  ctx.imageSmoothingEnabled = smooth; if (smooth) ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  ctx.imageSmoothingEnabled = false;
}
// 이미지를 (cx,cy) 중심, 상자 bw×bh 안에 맞춰 그림
function imgFit(name, cx, cy, bw, bh, smooth = true, s = 1) {
  const im = IMG[name]; if (!im) return;
  const k = Math.min(bw / im.width, bh / im.height) * s; const w = im.width * k, h = im.height * k;
  img(name, cx - w / 2, cy - h / 2, w, h, smooth);
}
function icon(name, x, y, px = 4) { img('i_' + name, x, y, 16 * px, 16 * px, false); }
function iconC(name, cx, cy, px = 4) { icon(name, cx - 8 * px, cy - 8 * px, px); }

// 글자: 한글은 Neo둥근모, 숫자 묶음은 굵은 갈무리11 로 자동 전환. y 는 글줄의 가운데.
const NUM_RE = /([+\-−]?[0-9][0-9,.:]*(?:\s?[%G])?)/;
function runs(s) { return s.split(NUM_RE).filter(x => x !== '').map(x => ({ t: x, n: NUM_RE.test(x) && /^[+\-−]?[0-9]/.test(x) })); }
function numSize(size) { return Math.max(12, Math.round(size * 0.9 / 12) * 12); }
function fontFor(r, size) { return r.n ? `${numSize(size)}px GalmuriB` : `${size}px NeoDGM`; }
function measure(s, size) { let w = 0; for (const r of runs(s)) { ctx.font = fontFor(r, size); w += ctx.measureText(r.t).width; } return w; }
function text(s, x, y, o = {}) {
  const size = o.size || 32, align = o.align || 'left';
  const w = measure(s, size);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const sh = o.shadow === false ? 0 : Math.max(2, Math.round(size / 16) * 2);
  const parts = runs(s);
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  for (const pass of sh ? [0, 1] : [1]) {
    let px = cx;
    for (const r of parts) {
      ctx.font = fontFor(r, size);
      const yy = Math.round(y + (r.n ? size * 0.04 : 0));
      if (pass === 0) { ctx.fillStyle = o.shadowColor || 'rgba(0,0,0,.6)'; ctx.fillText(r.t, Math.round(px + sh / 2), yy + sh / 2); }
      else { ctx.fillStyle = (r.n && o.numColor) || o.color || C.text; ctx.fillText(r.t, Math.round(px), yy); }
      px += ctx.measureText(r.t).width;
    }
  }
  if (o.alpha !== undefined) ctx.globalAlpha /= o.alpha;
  return w;
}
// 글자에 가로 그라데이션 (닉네임용)
function gradText(s, x, y, size, c1, c2, align = 'center') {
  ctx.font = `${size}px NeoDGM`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const w = ctx.measureText(s).width; const x0 = align === 'center' ? x - w / 2 : x;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(s, Math.round(x0 + 3), Math.round(y + 3));
  const g = ctx.createLinearGradient(x0, 0, x0 + w, 0); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillText(s, Math.round(x0), Math.round(y));
}

// 픽셀 테두리 패널 (게임 메뉴와 같은 숯색 UI)
function panel(x, y, w, h, o = {}) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const b = o.b || 4;
  rect(x, y, w, h, o.edge || C.edge);
  rect(x + b, y + b, w - 2 * b, h - 2 * b, o.fill || C.panel);
  rect(x + b, y + b, w - 2 * b, b, o.hi || 'rgba(255,255,255,.06)');
  if (o.accent) rect(x + b, y + b, w - 2 * b, o.accentH || 4, o.accent);
}
function chip(s, x, y, o = {}) {
  const size = o.size || 32, padX = o.padX || 16, h = o.h || size + 20;
  const w = measure(s, size) + padX * 2 + (o.icon ? size + 12 : 0);
  const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  panel(x0, y - h / 2, w, h, { fill: o.fill || C.panel2, edge: o.edge || C.edge, b: 4 });
  if (o.border) { ctx.strokeStyle = o.border; ctx.lineWidth = 4; ctx.strokeRect(x0 + 2, y - h / 2 + 2, w - 4, h - 4); }
  let tx = x0 + padX;
  if (o.icon) { icon(o.icon, tx, y - size / 2, size / 16); tx += size + 12; }
  text(s, tx, y, { size, color: o.color || C.text, numColor: o.numColor, shadow: o.shadow });
  return w;
}

// 정육면체(복셀) 한 개: 앞면 s×s, 윗면·옆면은 깊이 d
function cube(x, y, s, d, base, alpha = 1) {
  const [r, g, b] = base;
  const sh = (k) => `rgba(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)},${alpha})`;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = sh(1.18);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d, y - d); ctx.lineTo(x + s + d, y - d); ctx.lineTo(x + s, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = sh(0.62);
  ctx.beginPath(); ctx.moveTo(x + s, y); ctx.lineTo(x + s + d, y - d); ctx.lineTo(x + s + d, y + s - d); ctx.lineTo(x + s, y + s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = sh(0.92); ctx.fillRect(x, y, s, s);
  const q = Math.max(2, Math.round(s / 10));
  ctx.fillStyle = `rgba(255,255,255,${0.22 * alpha})`; ctx.fillRect(x, y, s, q); ctx.fillRect(x, y, q, s);
  ctx.fillStyle = `rgba(0,0,0,${0.22 * alpha})`; ctx.fillRect(x, y + s - q, s, q); ctx.fillRect(x + s - q, y, q, s);
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// 픽셀 금화 (8×8 도트)
const COIN = ['..####..', '.#yyyy#.', '#yyhyyy#', '#yhyyyo#', '#yyyyoo#', '#yyyooo#', '.#oooo#.', '..####..'];
function coin(cx, cy, px = 5, spin = 0) {
  const sx = Math.max(0.15, Math.abs(Math.cos(spin)));
  const cols = { '#': '#6b4208', y: C.gold, h: '#fff0b8', o: C.goldD };
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const ch = COIN[r][c]; if (ch === '.') continue;
    ctx.fillStyle = cols[ch];
    ctx.fillRect(Math.round(cx + (c - 4) * px * sx), Math.round(cy + (r - 4) * px), Math.ceil(px * sx), px);
  }
}

// ── 배경 ─────────────────────────────────────────────────────
let VIGNETTE = null;
function makeVignette() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  VIGNETTE = c;
}
function background(t, tint) {
  rect(0, 0, W, H, C.bg);
  // 느리게 떠오르는 먼지 블록
  for (let i = 0; i < 46; i++) {
    const s = 6 + Math.floor(hash(i * 7 + 1) * 4) * 4;
    const x = hash(i * 13 + 2) * W;
    const sp = 14 + hash(i * 3 + 5) * 26;
    const y = H + 40 - ((hash(i * 17 + 9) * (H + 80) + t * sp) % (H + 80));
    ctx.fillStyle = i % 5 === 0 ? 'rgba(242,177,52,.10)' : 'rgba(255,255,255,.035)';
    ctx.fillRect(Math.round(x), Math.round(y), s, s);
  }
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
}
function vignette() { if (VIGNETTE) ctx.drawImage(VIGNETTE, 0, 0); }

// 장면 제목 (왼쪽 위): 금색 블록 + 제목 + 부제
function title(t, main, sub, o = {}) {
  const k = eOut(prog(t, 0.25, 0.6));
  const x = o.x || 90, y = o.y || 82;
  ctx.globalAlpha = k;
  const dx = Math.round((1 - k) * -40);
  cube(x + dx, y - 22, 40, 10, hex(C.gold));
  text(main, x + 70 + dx, y, { size: 64, color: C.cream });
  ctx.globalAlpha = eOut(prog(t, 0.55, 0.6));
  if (sub) text(sub, x + 72, y + 64, { size: 32, color: C.dim, numColor: C.goldL });
  ctx.globalAlpha = 1;
}

// ── 복셀 글자 (STSV) ─────────────────────────────────────────
const GLYPH = {
  S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],
  T: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
  V: ['#...#', '#...#', '#...#', '#...#', '.#.#.', '.#.#.', '..#..']
};
function wordCubes(word, s, gap) {
  const cubes = []; let col0 = 0;
  for (const ch of word) {
    const g = GLYPH[ch];
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (g[r][c] === '#') cubes.push({ r, c: col0 + c });
    col0 += 5 + gap;
  }
  const cols = col0 - gap;
  cubes.sort((a, b) => b.r - a.r || a.c - b.c); // 아래 줄 먼저, 왼쪽 먼저 (윗면·옆면 겹침 순서)
  return { cubes, cols, w: cols * s };
}
function drawVoxelWord(t, cx, top, s, o = {}) {
  const d = Math.round(s * 0.32);
  const { cubes, cols, w } = wordCubes('STSV', s, 1);
  const x0 = Math.round(cx - w / 2);
  const shine = o.shine !== undefined ? o.shine : -99;
  cubes.forEach((q, i) => {
    const rnd = hash(i * 31 + 7);
    const delay = o.instant ? -9 : 0.15 + (q.c / cols) * 1.1 + rnd * 0.22 + (6 - q.r) * 0.025;
    const k = prog(t, delay, 0.55);
    if (k <= 0) return;
    const tx = x0 + q.c * s, ty = top + q.r * s;
    let y = lerp(ty - 760 - rnd * 260, ty, eOut(Math.min(1, k * 1.15)));
    if (k > 0.85) y -= Math.sin((k - 0.85) / 0.15 * Math.PI) * s * 0.18;
    const x = lerp(tx + (rnd - .5) * 260, tx, eOut(k));
    const bob = o.bob ? Math.sin(t * 2 + q.c * 0.35) * 4 : 0;
    // 금빛이 왼쪽에서 오른쪽으로 쓸고 지나감
    const sh = clamp(1 - Math.abs((q.c - (shine * (cols + 8) - 4))) / 3);
    const base = [242 + 13 * sh, 177 + 60 * sh, 52 + 120 * sh].map(v => Math.min(255, v));
    cube(x, y + bob, s, d, base);
  });
}

// ── 화면 전환: 블록이 쌓였다가 부서짐 ────────────────────────
const TILE = {};
function makeTiles() {
  const defs = {
    grass: (x, y, r) => y < 4 + (r() < .3 ? 1 : 0) ? ['#6aa83f', '#5c9636', '#7dbb4c'][Math.floor(r() * 3)] : ['#8a5a3b', '#7a4f33', '#96643f', '#6b4429'][Math.floor(r() * 4)],
    dirt: (x, y, r) => ['#8a5a3b', '#7a4f33', '#96643f', '#6b4429'][Math.floor(r() * 4)],
    stone: (x, y, r) => ['#7b7d83', '#6d6f75', '#878990', '#62646a'][Math.floor(r() * 4)],
    plank: (x, y, r) => (y % 4 === 3) ? '#7a5230' : ((x + (Math.floor(y / 4) % 2) * 8) % 16 === 0 ? '#86592f' : ['#b8834f', '#ad7a48', '#c08c57'][Math.floor(r() * 3)]),
    gold: (x, y, r) => (x === 0 || y === 0) ? '#ffe39a' : (x === 15 || y === 15) ? '#b97d17' : ['#f2b134', '#f6c04f', '#e8a52a'][Math.floor(r() * 3)],
    leaf: (x, y, r) => ['#3f7f2a', '#4a9033', '#356f24', '#58a03a'][Math.floor(r() * 4)],
    ore: (x, y, r) => { const v = r(); return v < .12 ? '#f2b134' : ['#7b7d83', '#6d6f75', '#878990'][Math.floor(r() * 3)]; }
  };
  for (const [name, f] of Object.entries(defs)) {
    const c = document.createElement('canvas'); c.width = 16; c.height = 16; const g = c.getContext('2d');
    const r = rng(name.length * 977 + name.charCodeAt(0));
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = f(x, y, r); g.fillRect(x, y, 1, 1); }
    TILE[name] = c;
  }
}
const CELL = 64, GC = 30, GR = 17;
function tileAt(c, r, set) { return set[Math.floor(hash(c * 131 + r * 71 + set.length) * set.length)]; }
function drawTile(name, x, y, s, rot = 0, alpha = 1) {
  ctx.imageSmoothingEnabled = false;
  if (rot || alpha < 1) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x + s / 2, y + s / 2); ctx.rotate(rot);
    ctx.drawImage(TILE[name], -s / 2, -s / 2, s, s); ctx.restore();
  } else ctx.drawImage(TILE[name], Math.round(x), Math.round(y), s, s);
  if (!rot) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(Math.round(x), Math.round(y + s - 4), s, 4); }
}
// phase: -1..0 덮기(블록이 쌓임), 0..1 걷기(블록이 부서짐). style 은 전환마다 다름
const COVER = 0.75, REVEAL = 0.85;
function transition(local, idx) {
  const sets = [['grass', 'dirt'], ['plank', 'plank', 'gold'], ['grass', 'leaf', 'dirt'], ['stone', 'ore'], ['plank', 'grass'], ['gold', 'plank', 'gold']];
  const set = sets[idx % sets.length];
  if (local < 0) { // 덮기: 아래 줄부터 쌓이거나(짝수) 왼쪽부터 쏟아짐(홀수)
    const k = (local + COVER) / COVER;
    for (let r = GR - 1; r >= 0; r--) for (let c = 0; c < GC; c++) {
      const j = hash(c * 17 + r * 29 + idx * 5);
      const order = idx % 2 === 0 ? (GR - 1 - r) / GR * 0.62 : c / GC * 0.52 + (GR - 1 - r) / GR * 0.12;
      const d = order + j * 0.1;
      const kk = clamp((k - d * (1 - 0.3)) / 0.3);
      if (kk <= 0) continue;
      const ty = r * CELL, tx = c * CELL;
      const y = lerp(-CELL * 2 - j * 200, ty, eIn(kk));
      drawTile(tileAt(c, r, set), tx, y, CELL);
    }
  } else { // 걷기: 금이 가고 네 조각으로 흩어짐(짝수) 또는 아래로 무너짐(홀수)

    const cx = GC / 2, cy = GR / 2;
    for (let r = 0; r < GR; r++) for (let c = 0; c < GC; c++) {
      const j = hash(c * 23 + r * 41 + idx * 3);
      const dist = Math.hypot(c - cx, (r - cy) * 1.6) / Math.hypot(cx, cy * 1.6);
      const d = idx % 2 === 0 ? dist * 0.42 + j * 0.16 : (GR - 1 - r) / GR * 0.25 + j * 0.3;
      const kk = clamp((k - d) / 0.42);
      const tx = c * CELL, ty = r * CELL, name = tileAt(c, r, set);
      if (kk <= 0) { drawTile(name, tx, ty, CELL); continue; }
      if (kk >= 1) continue;
      if (idx % 2 === 0) {
        if (kk < 0.22) { // 금 가기
          drawTile(name, tx, ty, CELL);
          ctx.fillStyle = 'rgba(20,20,24,.85)';
          const n = Math.ceil(kk / 0.22 * 4);
          for (let s = 0; s < n; s++) { const a = hash(c * 7 + r * 3 + s); ctx.fillRect(tx + 8 + a * 44, ty + 8 + s * 12, 12, 4); ctx.fillRect(tx + 16 + a * 30, ty + 12 + s * 12, 4, 8); }
        } else { // 네 조각
          const q = (kk - 0.22) / 0.78;
          for (let p = 0; p < 4; p++) {
            const ox = (p % 2) * 32, oy = Math.floor(p / 2) * 32;
            const vx = ((p % 2) - 0.5) * (240 + j * 200), vy = -260 - hash(p + c * 9 + r) * 220;
            const x = tx + ox + vx * q, y = ty + oy + vy * q + 1700 * q * q;
            ctx.save(); ctx.globalAlpha = 1 - q * 0.6; ctx.translate(x + 16, y + 16); ctx.rotate((p - 1.5) * q * 2.4);
            ctx.drawImage(TILE[name], ox / 4, oy / 4, 8, 8, -16, -16, 32, 32); ctx.restore();
          }
        }
      } else {
        const y = ty + 1400 * kk * kk; const rot = (j - .5) * kk * 1.6;
        drawTile(name, tx, y, CELL, rot, 1);
      }
    }
  }
}

  ['주간 미션', '막걸리 빚기 2/3', 'makgeolli', C.green],
  ['상인 행렬', '떠돌이 상인이 광장에 도착', 'cheque', C.purple],
  ['레벨 업', '요리사 Lv 30 달성', 'iron_pan', C.gold]
];
function sceneProgress(t) {
  // 게임 화면 느낌: 하늘과 언덕
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6f9fe0'); g.addColorStop(0.5, '#9cc4ea'); g.addColorStop(0.5, '#5b8a44'); g.addColorStop(1, '#4b7a36');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) { const x = ((i * 211 + t * 12) % (W + 300)) - 150; rect(x, 120 + (i % 4) * 60, 160 + (i % 3) * 40, 24, 'rgba(255,255,255,.55)'); }
  for (let x = 0; x < W; x += 24) { const h = 30 + Math.sin(x * 0.006) * 24 + Math.sin(x * 0.017) * 10; rect(x, H / 2 - h, 24, h, '#628f49'); }
  ctx.fillStyle = 'rgba(16,17,22,.30)'; ctx.fillRect(0, 0, W, H);
  // 제목 띠
  panel(0, 20, 1060, 150, { fill: 'rgba(28,29,34,.92)', edge: 'rgba(20,21,26,.95)' });
  title(t, '성장과 목표', '업적 · 미션 · 도감 · 주간 순위 · 서버 사건', { y: 70 });
  // 알림 토스트
  TOASTS.forEach(([cat, msg, ic, col], i) => {
    const at = 0.5 + i * 0.5;
    const k = prog(t, at, 0.45);
    if (k <= 0) return;
    const x = 60 + (1 - eBack(k)) * -700, y = 196 + i * 104;
    panel(x, y, 760, 92, { fill: 'rgba(37,39,46,.96)' });
    rect(x + 4, y + 4, 10, 84, col);
    iconC(ic, x + 64, y + 46, 3);
    text(cat, x + 110, y + 28, { size: 24, color: col });
    text(msg, x + 110, y + 64, { size: 32, color: C.cream, numColor: C.goldL });
    if (k < 1) { ctx.globalAlpha = 1 - k; rect(x, y, 760, 92, '#fff'); ctx.globalAlpha = 1; }
  });
  // 주간 순위: 기념비
  const pk = eOut(prog(t, 1.4, 0.6));
  if (pk > 0) {
    const px = 900, py = 230;
    ctx.globalAlpha = pk;
    panel(px, py, 500, 640, { fill: 'rgba(37,39,46,.96)', accent: C.gold });
    text('주간 순위', px + 250, py + 52, { size: 48, align: 'center', color: C.cream });
    const pods = [[1, '바다사나이', 2, '#c9ccd3'], [0, '황금농부', 3, C.gold], [2, '망치왕', 1, '#c98a5a']];
    pods.forEach(([slot, nm, hgt, col], i) => {
      const k = eOut(prog(t, 1.8 + i * 0.25, 0.5));
      const order = [1, 0, 2][slot];
      const x = px + 60 + order * 135;
      for (let s = 0; s < hgt; s++) cube(x, py + 480 - s * 70 - (1 - k) * 200, 70, 22, hex(col), clamp(k * 2));
      text(`${slot + 1}`, x + 35, py + 516, { size: 48, align: 'center', color: '#1c1d22', shadow: false, alpha: clamp(k * 2) });
      text(nm, x + 35, py + 480 - hgt * 70 - 44, { size: 24, align: 'center', color: C.cream, alpha: clamp(k * 2) });
    });
    // 1위 왕관
    const ck = eBack(prog(t, 2.6, 0.5));
    if (ck > 0) { ctx.save(); ctx.translate(px + 60 + 135 + 35, py + 480 - 3 * 70 - 110); ctx.scale(ck, ck); iconC('jeweled_crown', 0, 0, 4); ctx.restore(); }
    text('1위 기념비 · 전설 치장', px + 250, py + 596, { size: 32, align: 'center', color: C.goldL, alpha: eOut(prog(t, 2.8, 0.4)) });
    ctx.globalAlpha = 1;
  }
  // 사이드바 지갑 HUD
  const hk = eOut(prog(t, 0.8, 0.5));
  if (hk > 0) {
    const x = 1450 + (1 - hk) * 420, y = 230;
    panel(x, y, 410, 330, { fill: 'rgba(37,39,46,.96)' });
    text('◆ STSV', x + 26, y + 40, { size: 32, color: C.gold });
    rect(x + 20, y + 66, 370, 4, C.goldD);
    const bal = 12345 + Math.floor(clamp((t - 1) / 5) * 4200 / 5) * 5;
    const rowsH = [['잔액', `${fmt(bal)} G`, C.gold], ['직업', '요리사 Lv30', C.green], ['미션', '2/3 · 주간 1/3', C.cream], ['사건', '광산 호황', C.red]];
    rowsH.forEach(([a, b, col], i) => {
      text(a, x + 26, y + 112 + i * 54, { size: 32, color: C.dim });
      text(b, x + 384, y + 112 + i * 54, { size: 32, align: 'right', color: col, numColor: col === C.green ? C.cream : col });
    });
    text('직접 만든 HUD', x + 205, y + 380, { size: 32, align: 'center', color: C.cream, alpha: eOut(prog(t, 3.2, 0.5)) });
  }
  // 체력·배고픔 바
  const bk = eOut(prog(t, 1.1, 0.5));
  if (bk > 0) {
    const x = 1450, y = 950 + (1 - bk) * 120;
    panel(x, y - 50, 410, 140, { fill: 'rgba(28,29,34,.9)' });
    const hp = 20, food = 17;
    text(`${hp}`, x + 26, y - 6, { size: 24, color: C.text });
    for (let i = 0; i < 10; i++) { rect(x + 70 + i * 32, y - 20, 28, 28, '#2a1416'); rect(x + 72 + i * 32, y - 18, 24, 24, i < hp / 2 ? '#e2443f' : '#3a2a2c'); rect(x + 72 + i * 32, y - 18, 24, 6, 'rgba(255,255,255,.25)'); }
    text(`${food}`, x + 26, y + 46, { size: 24, color: C.text });
    for (let i = 0; i < 10; i++) { rect(x + 70 + i * 32, y + 32, 28, 28, '#2a1d12'); rect(x + 72 + i * 32, y + 34, 24, 24, i < Math.round(food / 2) ? '#e08a3a' : '#3a2e24'); rect(x + 72 + i * 32, y + 34, 24, 6, 'rgba(255,255,255,.25)'); }
  }
}

// 6. 마무리
function sceneOutro(t) {
  background(t);
  const g = ctx.createRadialGradient(W / 2, 400, 40, W / 2, 400, 820);
  g.addColorStop(0, 'rgba(242,177,52,.16)'); g.addColorStop(1, 'rgba(242,177,52,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawVoxelWord(t * 1.4, W / 2 + 6, 170, 44, { bob: true, shine: prog(t, 1.4, 1.0) });
  const k = eBack(prog(t, 1.3, 0.6));
  ctx.save(); ctx.translate(W / 2, 640); ctx.scale(k, k);
  text('지금 STSV에서', 0, 0, { size: 112, align: 'center', color: C.gold });
  ctx.restore();
  ctx.globalAlpha = eOut(prog(t, 1.9, 0.6));
  text('많이 하면 많이 번다', W / 2, 772, { size: 64, align: 'center', color: C.cream });
  ctx.globalAlpha = eOut(prog(t, 2.4, 0.6));
  text('직업 · 생산 · 거래 · 땅 · 꾸미기 — 마인크래프트 한국어 경제·생활 서버', W / 2, 870, { size: 32, align: 'center', color: C.dim });
  ctx.globalAlpha = 1;
  coinRain(t, 1.0, 26, 7);
  vignette();
}

// ── 시간표 ───────────────────────────────────────────────────
const SCENES = [
  [0, 5.5, sceneIntro],
  [5.5, 16, sceneJobs],
  [16, 26.5, sceneEconomy],
  [26.5, 37, sceneTriple],
  [37, 46.5, sceneLand],
  [46.5, 55, sceneProgress],
  [55, 60, sceneOutro]
];
function render(T) {
  T = clamp(T, 0, DURATION);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false;
  let si = SCENES.findIndex(([a, b]) => T >= a && T < b); if (si < 0) si = SCENES.length - 1;
  const [a, , f] = SCENES[si];
  f(T - a);
  // 다음 장면 경계에서 덮기, 이 장면 시작에서 걷기
  for (let i = 1; i < SCENES.length; i++) {
    const B = SCENES[i][0];
    if (T >= B - COVER && T < B) transition(T - B, i - 1);
    else if (T >= B && T < B + REVEAL) transition(T - B, i - 1);
  }
  // 첫 0.4초 페이드 인
  if (T < 0.4) { ctx.fillStyle = `rgba(28,29,34,${1 - T / 0.4})`; ctx.fillRect(0, 0, W, H); }
}

// ── 재생 ─────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const capture = params.has('capture');
if (capture) document.body.classList.add('capture');
let playing = !capture && !params.has('t'), t0 = performance.now(), cur = parseFloat(params.get('t') || '0');
const seek = document.getElementById('seek'), clock = document.getElementById('clock'), btn = document.getElementById('play');
function setT(v) { cur = v; t0 = performance.now() - v * 1000; }
function loop(now) {
  if (playing) { cur = (now - t0) / 1000; if (cur >= DURATION + 1.5) setT(0); }
  render(Math.min(cur, DURATION));
  seek.value = Math.min(cur, DURATION); clock.textContent = Math.min(cur, DURATION).toFixed(1) + 's';
  requestAnimationFrame(loop);
}
btn.onclick = () => { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; if (playing) setT(cur); };
cv.onclick = () => btn.onclick();
seek.oninput = () => { setT(parseFloat(seek.value)); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
window.STSV = { render, DURATION, ready: false };
loadAll().then(() => {
  makeVignette(); makeTiles(); makeCandles();
  window.STSV.ready = true;
  btn.textContent = playing ? '일시정지' : '재생';
  setT(cur);
  if (!capture) requestAnimationFrame(loop); else render(cur);
});
</script>
