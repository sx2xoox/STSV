# STSV 경제 서버 설정 (서버 운영). 콘텐츠 수치(가격, 직업, 사건)는 plugins/STSV/contents/economy/ 의 YAML 에 있습니다.
# 시즌 없이 계속 운영합니다: 처음 켠 날이 1일차, 한 주는 월요일 05시에 바뀜 (/관리자 날짜).

time:
  # 하루가 바뀌는 시각과 시간대. 매일 이 시각에 시세 회복, 의뢰 갱신, 세금, 임대료, 보고서. 월요일엔 주간 순위 결산, 수요 고시
  zone: Asia/Seoul
  reset-hour: 5

pvp:
  # true = 언제 어디서나 PvP. false = PvP 끔
  always: false

villagers:
  # false = 주민·떠돌이 상인과 거래 불가 (에메랄드·책·도구로 상점 경제를 우회하지 못하게). true = 바닐라처럼 거래
  trading: false

hud:
  # 오른쪽 사이드바: 직업 레벨, 미션 (오늘·이번 주 완료 수), 진행 중인 사건
  job: true
  missions: true
  event: true

report:
  # 경제 보고서 (/관리자 보고서, 매일 05시): 만들어진 돈 중 다시 없어져야 할 비율 (소멸/생성 목표)
  sink-target: 0.45

rank:
  # 주간 순위 1위 보상: 기념비 건립권 + 전설 치장 하나. 주마다 목록에서 돌아가며 고르고, 이미 가진 것은 건너뜀.
  # 목록을 모두 가진 1위는 대신 골드를 받음
  # 목록에 없는 전설 치장(새로 추가된 것)도 목록 뒤에 붙여서 돌림
  weekly-legendary: [stsv:crown, stsv:angel_wings, stsv:demon_wings, stsv:halo, stsv:haetae, stsv:gumiho, stsv:phoenix]
  weekly-legendary-fallback-gold: 100000

docks:
  # 하역장 (README "하역장", "출발 터미널"): 출발 터미널에서 화물 검사를 받아 봉인한 완제품만, 정한 하역장에서 삼
  # (검사 뒤 달린 거리가 터미널→하역장 직선의 80% 이상). 이 값은 출발 터미널과 하역장 사이의 최소 거리(블록):
  # /관리자 출발지 설치 · /관리자 하역장 설치 때 이보다 가까우면 경고 (하역장은 터미널에서 약 7,000블록, 트럭으로 편도 15분쯤)
  min-distance: 6000
  # 기본 매입가 = 상점 기준가 × 이 비율 (고정: 수요 고시·사건·각자 판 양과 상관없고 판매 소득세도 없음. 상점 시세를 움직이지 않음).
  # 하역장마다 따로 정할 수 있음: /관리자 하역장 가격 <이름> <퍼센트|기본> (1~300%, DB 에 저장). 따로 정하지 않은 하역장은 이 비율.
  # 봉인된 운송은 봉인 때 그 하역장 매입가로 정한 값 그대로 (그 뒤 바꿔도 이미 봉인된 짐에는 영향 없음)
  price-ratio: 0.9
  # 하역장·출발 터미널을 지을 때 한 틱에 놓는 블록 수 (서버가 멈추지 않게 나눠서. 기초 기둥은 채운 칸마다 셈)
  build-blocks-per-tick: 1000
  # 후보지 살피기 (/관리자 하역장 후보): 몇 블록마다 지형을 볼지, 한 번에 불러오는 청크 수 (많을수록 빠르지만 무거움):
  # 접속한 사람이 없을 때 / 있을 때 (하역장을 지을 때 청크 불러오기도 같은 수)
  scout-step: 32
  scout-concurrent: 4
  scout-concurrent-online: 2
  # 서버가 바쁠 때 쉬기: 평균 틱 시간(MSPT, 밀리초)이 이 값 이상이면 하역장 짓기·후보지 살피기를 그 틱엔 쉬고,
  # 이 값의 80% 이상이면 청크 하나씩·블록 절반만. 0 = 늘 진행
  max-mspt: 35

roads:
  # 국도 (README "국도"): 길 바닥 블록, 가운데 선, 갓돌 (블록 id)
  surface: gray_concrete
  center-line: yellow_concrete
  kerb: smooth_stone
  # 양쪽 차선 가장자리의 흰 선 (반 칸 오르내림에는 그 블록의 반 블록, 없으면 바닥의 반 블록)
  edge-line: smooth_quartz
  # 길 바닥(surface, center-line) 위를 달리는 탈것의 최고 속도 배율 (1 = 없음, 최대 2). 서버 상한(코어 vehicles.max-speed)은 넘지 않음
  speed-bonus: 1.2
  # 가로등 간격, 방향 표지판(남은 거리) 간격 (블록, 길을 따라). 출발 뒤·입구 앞 표지판은 따로 하나씩
  light-every: 40
  marker-every: 1000
  # 길을 찾을 때 직선에서 양옆으로 살펴볼 청크 수 (넓을수록 돌아가는 길을 더 잘 찾지만 오래 걸림)
  corridor: 6
  # 길 둘레로 미리 만들어 둘 청크 (길에서 청크 수)
  pregen-radius: 2
  # 길을 지을 때 한 틱에 놓는 블록 수 (난간·울타리를 잇는 것과 표지판도 셈). 한 단면이 이보다 많으면 다음 틱들은 그만큼 쉼
  blocks-per-tick: 800
  # 한 번에 불러오는(없으면 새로 만드는) 청크 수: 접속한 사람이 없을 때 / 있을 때 (청크 만들기가 무거워서 사람이 있으면 줄임)
  concurrent: 4
  concurrent-online: 2
  # 서버가 바쁠 때 쉬기: 평균 틱 시간(MSPT, 밀리초)이 이 값 이상이면 길 살피기·청크 준비·짓기·표지판 다시세우기·난간고치기를
  # 그 틱엔 쉬고, 이 값의 80% 이상이면 청크 하나씩·블록 절반만. 0 = 늘 진행
  max-mspt: 35
  # 국도가 절대 건드리지 않는 곳 (README "국도", 보호). 개인 땅과 서버 땅(스폰 마을 등)은 늘 피하고(그 하역장과 출발한
  # 터미널의 청크만 예외), 여기에는 땅 없이 지은 지킬 건물을 상자로 적음: world 와 두 모서리 x1, z1, x2, z2 (블록, 높이는 전부).
  # 길 찾기는 상자가 닿는 청크를 통째로 피하고, 짓기는 상자 안 칸을 깎지도 메우지도 놓지도 않음. /관리자 리로드 로 적용
  # 예:
  # avoid:
  #   - world: world
  #     x1: 120
  #     z1: -40
  #     x2: 180
  #     z2: 10
  avoid: []
