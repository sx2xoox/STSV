# STSV 경제 서버 설정 (서버 운영). 콘텐츠 수치(가격, 직업, 일정)는 plugins/STSV/contents/economy/ 의 YAML 에 있습니다.

time:
  # 하루가 바뀌는 시각과 시간대. 매일 이 시각에 시세 회복, 의뢰 갱신, 세금, 임대료, 보고서
  zone: Asia/Seoul
  reset-hour: 5

pvp:
  # true = 언제 어디서나 PvP. false = 무법 지대 사건 안에서만
  always: false

hud:
  # 화면 아래 상태 줄: 오늘 손익, 직업 레벨
  today: true
  job: true
