# STSV 경제 서버 설정 (서버 운영). 콘텐츠 수치(가격, 직업, 사건)는 plugins/STSV/contents/economy/ 의 YAML 에 있습니다.
# 시즌 없이 계속 운영합니다: 처음 켠 날이 1일차, 한 주는 월요일 05시에 바뀜 (/관리자 날짜).

time:
  # 하루가 바뀌는 시각과 시간대. 매일 이 시각에 시세 회복, 의뢰 갱신, 세금, 임대료, 보고서. 월요일엔 주간 순위 결산, 수요 고시
  zone: Asia/Seoul
  reset-hour: 5

pvp:
  # true = 언제 어디서나 PvP. false = PvP 끔
  always: false

villagers:
  # false = 주민·떠돌이 상인과 거래 불가 (에메랄드·책·도구로 상점 경제를 우회하지 못하게). true = 바닐라처럼 거래
  trading: false

hud:
  # 오른쪽 사이드바: 직업 레벨, 미션 (오늘·이번 주 완료 수), 진행 중인 사건
  job: true
  missions: true
  event: true

report:
  # 경제 보고서 (/관리자 보고서, 매일 05시): 만들어진 돈 중 다시 없어져야 할 비율 (소멸/생성 목표)
  sink-target: 0.45

rank:
  # 주간 순위 1위 보상: 기념비 건립권 + 전설 치장 하나. 주마다 목록에서 돌아가며 고르고, 이미 가진 것은 건너뜀.
  # 목록을 모두 가진 1위는 대신 골드를 받음
  # 목록에 없는 전설 치장(새로 추가된 것)도 목록 뒤에 붙여서 돌림
  weekly-legendary: [stsv:crown, stsv:angel_wings, stsv:demon_wings, stsv:halo, stsv:haetae, stsv:gumiho, stsv:phoenix]
  weekly-legendary-fallback-gold: 100000

docks:
  # 하역장 (README "하역장", "출발 터미널"): 출발 터미널에서 화물 검사를 받아 봉인한 완제품만, 정한 하역장에서 삼
  # (검사 뒤 달린 거리가 터미널→하역장 직선의 80% 이상). 이 값은 출발 터미널과 하역장 사이의 최소 거리(블록):
  # /관리자 출발지 설치 · /관리자 하역장 설치 때 이보다 가까우면 경고 (하역장은 터미널에서 약 7,000블록, 트럭으로 편도 15분쯤)
  min-distance: 6000
  # 기본 매입가 = 상점 기준가 × 이 비율 (고정: 수요 고시·사건·각자 판 양과 상관없고 판매 소득세도 없음. 상점 시세를 움직이지 않음).
  # 하역장마다 따로 정할 수 있음: /관리자 하역장 가격 <이름> <퍼센트|기본> (1~300%, DB 에 저장). 따로 정하지 않은 하역장은 이 비율.
  # 봉인된 운송은 봉인 때 그 하역장 매입가로 정한 값 그대로 (그 뒤 바꿔도 이미 봉인된 짐에는 영향 없음)
  price-ratio: 0.9
  # 하역장·출발 터미널을 지을 때 한 틱에 놓는 블록 수 (서버가 멈추지 않게 나눠서. 기초 기둥은 채운 칸마다 셈)
  build-blocks-per-tick: 1000
  # 후보지 살피기 (/관리자 하역장 후보): 몇 블록마다 지형을 볼지, 한 번에 불러오는 청크 수 (많을수록 빠르지만 무거움):
  # 접속한 사람이 없을 때 / 있을 때 (하역장을 지을 때 청크 불러오기도 같은 수)
  scout-step: 32
  scout-concurrent: 4
  scout-concurrent-online: 2
  # 서버가 바쁠 때 쉬기: 평균 틱 시간(MSPT, 밀리초)이 이 값 이상이면 하역장 짓기·후보지 살피기를 그 틱엔 쉬고,
  # 이 값의 80% 이상이면 청크 하나씩·블록 절반만. 0 = 늘 진행
  max-mspt: 35

roads:
  # 국도 (README "국도"): 길 바닥 블록, 가운데 선, 갓돌 (블록 id)
  surface: gray_concrete
  center-line: yellow_concrete
  kerb: smooth_stone
  # 양쪽 차선 가장자리의 흰 선 (반 칸 오르내림에는 그 블록의 반 블록, 없으면 바닥의 반 블록)
  edge-line: smooth_quartz
  # 길 바닥(surface, center-line) 위를 달리는 탈것의 최고 속도 배율 (1 = 없음, 최대 2). 서버 상한(코어 vehicles.max-speed)은 넘지 않음
  speed-bonus: 1.2
  # 가로등 간격, 방향 표지판(남은 거리) 간격 (블록, 길을 따라). 출발 뒤·입구 앞 표지판은 따로 하나씩
  light-every: 40
  marker-every: 1000
  # 길을 찾을 때 직선에서 양옆으로 살펴볼 청크 수 (넓을수록 돌아가는 길을 더 잘 찾지만 오래 걸림)
  corridor: 6
  # 길 둘레로 미리 만들어 둘 청크 (길에서 청크 수)
  pregen-radius: 2
  # 길을 지을 때 한 틱에 놓는 블록 수 (난간·울타리를 잇는 것과 표지판도 셈). 한 단면이 이보다 많으면 다음 틱들은 그만큼 쉼
  blocks-per-tick: 800
  # 한 번에 불러오는(없으면 새로 만드는) 청크 수: 접속한 사람이 없을 때 / 있을 때 (청크 만들기가 무거워서 사람이 있으면 줄임)
  concurrent: 4
  concurrent-online: 2
  # 서버가 바쁠 때 쉬기: 평균 틱 시간(MSPT, 밀리초)이 이 값 이상이면 길 살피기·청크 준비·짓기·표지판 다시세우기·난간고치기를
  # 그 틱엔 쉬고, 이 값의 80% 이상이면 청크 하나씩·블록 절반만. 0 = 늘 진행
  max-mspt: 35
  # 국도가 절대 건드리지 않는 곳 (README "국도", 보호). 개인 땅과 서버 땅(스폰 마을 등)은 늘 피하고(그 하역장과 출발한
  # 터미널의 청크만 예외), 여기에는 땅 없이 지은 지킬 건물을 상자로 적음: world 와 두 모서리 x1, z1, x2, z2 (블록, 높이는 전부).
  # 길 찾기는 상자가 닿는 청크를 통째로 피하고, 짓기는 상자 안 칸을 깎지도 메우지도 놓지도 않음. /관리자 리로드 로 적용
  # 예:
  # avoid:
  #   - world: world
  #     x1: 120
  #     z1: -40
  #     x2: 180
  #     z2: 10
  avoid: []
  # 국도 성격 (README "국도", 성격): /관리자 국도 <하역장> [쉬운길|보통|어려운길]. 빠진 값은 아래 기본값. 바꾸면 새로 짓는 길부터
  # (이미 지은 길의 모양은 그대로, 속도·보상은 바로). 보통은 예전보다 어려움(경사 1:2.75, 땅을 더 따라감, 굽은 곳 여유 0.8):
  # 예전에 지은 보통 길(파일에 character= 줄 없음)은 이름표만 보통이고 예전 모양 그대로 고쳐짐 · 새 모양은 새로 지어야
  #   grade: 경사 (1칸 오르내림에 몇 칸, 2~8) · climb / steep / turn: 길 찾기 값(높이 1칸 / 경사 넘는 1칸 / 45도 꺾임)
  #   straighten: 곧게 펴기 여유 (1.02 = 2% 더 비싸도 곧게) · follow: 땅을 몇 칸 평균 내어 따라갈지 (작을수록 오르내림이 많음)
  #   bridge-gap / tunnel-cover / min-run: 이만큼 높으면 다리, 이만큼 덮이면 굴, 이보다 짧은 다리·굴은 메우거나 깎음
  #   shoulder: 갓길 폭 더하기 (-1~1) · light-factor: 가로등 간격 × · reflect-every: 반사 기둥 간격 (0 = 없음)
  #   rail-drop: 땅보다 이만큼 높은 갓길에 가드레일 · bend-room: 굽은 곳 여유 × (1 = 예전, 0.5 이상) · rough: 기운 자리·닳은 가장자리
  #   warnings: 급커브·경사·낙석 주의 표지판 · speed-bonus: speed-bonus 에 더함 · fare: 버스 운임 × (그 길의 정류장에서 타거나 내림)
  #   streak: 안전 운전 연속 보너스 × · outdoor-weight: 그 정류장의 등산객·캠핑족 비중 × · dock-pay: 그 길의 하역장 하역 값 ×
  characters:
    easy:
      grade: 5
      climb: 0.04
      steep: 1.2
      turn: 0.5
      straighten: 1.10
      follow: 6
      bridge-gap: 3
      tunnel-cover: 4
      min-run: 4
      shoulder: 1
      light-factor: 0.75
      reflect-every: 12
      rail-drop: 2
      bend-room: 1
      rough: false
      warnings: false
      speed-bonus: 0.15
      fare: 1
      streak: 1
      outdoor-weight: 1
      dock-pay: 1
    normal:
      grade: 2.75
      climb: 0.015
      steep: 0.45
      turn: 0
      straighten: 1.01
      follow: 3
      bridge-gap: 4
      tunnel-cover: 6
      min-run: 4
      shoulder: 0
      light-factor: 1.25
      reflect-every: 24
      rail-drop: 3
      bend-room: 0.8
      rough: false
      warnings: false
      speed-bonus: 0
      fare: 1
      streak: 1
      outdoor-weight: 1
      dock-pay: 1
    hard:
      grade: 2.25
      climb: 0.005
      steep: 0.3
      turn: 0
      straighten: 1.0
      follow: 0
      bridge-gap: 6
      tunnel-cover: 10
      min-run: 10
      shoulder: -1
      light-factor: 3
      reflect-every: 0
      rail-drop: 4
      bend-room: 0.5
      rough: true
      warnings: true
      speed-bonus: 0
      fare: 1.4
      streak: 2
      outdoor-weight: 2
      # 하역 값 보너스: 1 = 없음 (예: 1.2 = 어려운길 하역장 +20%)
      dock-pay: 1

# 땅 타임머신 (/땅 타임머신): 땅 주인이 관리자 없이 자기 땅의 청크를 백업 시각으로 되돌림 (README "땅 타임머신").
# 주인이 하면 블록만 돌아오고(상자는 빈 채로, 지금 물건이 든 상자는 그대로), 돈이 되는 블록은 그 값을 치름
# (가져간 뒤 되돌려 복사하는 꼼수 방지). 관리자(/관리자 타임머신)는 상자 안 물건 · 액자 · 갑옷 거치대까지 전부, 비용 없음.
# 임시 월드 · 미리보기 · 한 틱 블록 수는 코어 config.yml backup.time-machine
time-machine:
  enabled: true
  # 한 땅을 주인이 다시 되돌리려면 기다려야 하는 시간 (관리자는 없음)
  cooldown-hours: 3
  # 돌아오는 블록의 값(상점 판매가, 부수거나 녹이면 나오는 것까지) - 대신 사라지는 블록의 값, 에 곱하는 수 (0 = 무료)
  cost-multiplier: 1.0

land-log:
  # 땅 기록 · 테러 되돌리기 (README "테러 되돌리기"): 땅 안에서 주인 아닌 사람(구성원, 우회 권한의 관리자)이 한 것을 모두 기록.
  # 땅 주인은 /땅 기록 으로 누가 무엇을 했는지 보고, 그 사람이 한 것만 골라 되돌림 (미리보기 뒤 확정). 관리자는 /관리자 땅기록, /관리자 테러
  enabled: true
  # 기록을 남기는 기간(일). 지난 기록은 지워져서 되돌릴 수 없음
  keep-days: 30
  # true = 땅 주인 자신이 한 것도 기록 (기록이 많이 늘어남. 주인 것은 되돌리기 대상이 아님)
  owner: false
  # 되돌리기 미리보기: 주인 화면에만 보이는 시간(초), 보여 줄 블록 수 (주인에게서 160블록 안)
  preview-seconds: 45
  preview-max-blocks: 4000
  # 되돌릴 때 한 틱에 처리하는 블록·물건 수 (서버가 멈추지 않게 나눠서)
  undo-blocks-per-tick: 400

# 길라잡이 (/길라잡이, README "길라잡이"): 따로 있는 체험관 월드에서 직접 해 보는 안내. 주제·단계·보상은 contents/economy/guide/topics/*.yml
guide:
  # 체험관 월드 이름 (없으면 빈 월드로 만들고 처음 켤 때 정거장을 지음. 다시 짓기: /관리자 길라잡이 체험관 짓기)
  world: stsv_guide
  # 처음 접속한 사람에게 한 번: 채팅 한 줄 + 길라잡이 책 (우클릭 = 고르기 화면)
  first-join-book: true
  # 모든 주제를 마치면 주는 칭호 (titles/titles.yml) + 아직 없는 '일반' 치장 하나 + 전체 공지
  title: economy:sprout
  # 체험용 탈것 (코어 탈것 아이템): 하역장·탈것 = 트럭, 버스 기사 = 렌트 버스와 같은 소형 버스
  truck: stsv:light_truck
  bus: stsv:mini_bus
  # 도우미 · 손님 · 안내원 마네킹 스킨 (리소스팩 스킨 키, slim = 팔 3픽셀)
  helper-skin: "economy:entity/bus/student_2 slim"
  passenger-skin: "economy:entity/bus/resident_1"
  npc-skin: "economy:entity/bus/resident_2 slim"
  # 도우미가 같은 단계의 말을 다시 하는 간격 (초)
  say-seconds: 25
  # 광산 정거장의 광석이 다시 생기는 시간 (초)
  ore-regrow-seconds: 4
  # 길라잡이 중에 막는 명령어 (체험용 인벤토리를 다른 곳에 저장하거나 진짜 탈것 · 가방을 꺼내는 것)
  blocked-commands: [서킷, 미니게임, 탈것, 지게, 원격기계, 가방, 튜닝]
