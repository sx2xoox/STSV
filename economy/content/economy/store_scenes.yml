# 편의점 장면 (README "편의점" 손님끼리 장면, docs/plans/편의점_기획안.md §6) — 버스 합승 대화 (bus_scenes.yml) 의 편의점판.
# 가게 안에 손님 종류 둘 · 셋이 같이 있으면 가끔 그들끼리 짧은 장면: 그 자리에 멈춰 서로를 보고 말풍선이 한 줄씩 (말하는 사람이 팔을 흔듦),
# 끝나면 effect 가 그 방문에 실제로 일어남. 처음 본 장면은 인물 도감에 남음 (버스 장면과 따로 셈).
#
# 언제: 근무 중 check 초마다 (안에 손님 둘 이상) chance 확률. 한 근무자는 cooldown 초에 한 번까지. 안 본 장면은 unseen 배로 잘 나옴.
#   장면에 나온 손님은 그 방문에 다시 안 나옴. 계산대에서 계산 중인 손님 · 진상 응대 중인 손님은 안 나옴.
#   (손님 약 32초에 한 명, 안에 평균 3~4명: 30초마다 약 12%, 10분 쿨타임 → 쉬지 않고 일해도 한 시간에 서너 번. StoreScenesTest 가 확인)
# 말풍선 하나: pause.base + 글자 수 × pause.per-char 초 (min ~ max).
#
# 장면 (scenes.<id>):
#   title: 근무자 채팅 · 도감에 보이는 제목
#   cast: [손님 종류 2~3] (역할 a, b, c). store.yml customers 에 있는 종류만.
#   when: hours [시작, 끝) 게임 시각 · months [달] · rain · market (장날) · weekend: true · below / above {역할: 기분} · seen: <장면 id>
#   lines: 차례대로 - a: "대사" (말만: 괄호 지문은 쓰지 않음. 화면에 안 보이는 동작을 글로 적지 않기). 둘이 오는 손님 (커플 · 신혼부부: 언제나 남자 한 명과 여자 한 명) 은 a 가 첫 사람, a2 가 짝
#     (커플: a 남자 · a2 여자, 신혼부부: a 신부 · a2 신랑)
#   weight: 고르는 비율 (기본 1)
#   effect: (적어도 하나) mood {역할|all|others: ±n} · tip {역할: 배수} (계산할 때) · leave: 역할 · [역할] (안 사고 나감, 놓친 손님으로 안 셈)
#           calm: n (가게 안 모두 기분 n 이상으로) · gift: {item, amount} 근무자에게
chance: 0.12
cooldown: 600
check: 30
unseen: 4
pause:
  base: 1.6
  per-char: 0.07
  min: 2.5
  max: 5.5

scenes:
  # ─────────────────────────────────────────────────────────────────────────────
  # 마지막 하나 · 자리 다툼
  last-dosirak:
    title: "마지막 도시락"
    cast: [student, office]
    lines:
      - a: "어! 마지막 도시락이다!"
      - b: "…아."
      - a: "아저씨가 먼저 잡으셨어요?"
      - b: "…학생 먹어. 한창 클 때잖아. 난 삼각김밥 먹지 뭐"
      - a: "헐 감사합니다! 아저씨 복 받으실 거예요!"
    effect: {mood: {a: 10, b: 6}, tip: {b: 1.5}}
  last-banana-milk:
    title: "바나나우유 하나 남았다"
    cast: [kid, tourist]
    lines:
      - b: "와, 바나나우유! 이거 마셔 보고 싶었어요~"
      - a: "어… 그거 내가 맨날 먹는 건데…"
      - b: "아, 동생 거구나?"
      - a: "…누나 먹어요. 나 내일 또 와요"
      - b: "아니야 아니야, 너 먹어! 나는 사진만 찍을게~ 찰칵!"
    effect: {mood: {a: 12, b: 6}}
  ramen-seat:
    title: "시식대 창가 자리"
    cast: [worker, univ]
    lines:
      - a: "학생, 거기 창가 자리 아저씨가 찜해 놨는디"
      - b: "아… 저 과제하면서 먹으려고…"
      - a: "과제? 허허, 그럼 학생이 앉어. 아저씨는 서서 먹는 게 체질이여"
      - b: "감사합니다… 컵라면 국물 한 입 드실래요?"
      - a: "됐어 됐어, 공부나 열심히 혀"
    effect: {mood: {a: 6, b: 10}}
  ice-cream-war:
    title: "냉동고 앞 결투"
    cast: [kid, prankster]
    lines:
      - b: "히히, 이 아이스크림 내 거다~"
      - a: "내가 먼저 봤거든?!"
      - b: "먼저 잡은 사람이 임자지롱~"
      - a: "…엄마가 오늘 아이스크림 사도 된다고 했단 말이야"
      - b: "…치, 너 해. 나는 젤리 살 거야"
    effect: {mood: {a: 8, others: 3}}
  # ─────────────────────────────────────────────────────────────────────────────
  # 커플 · 신혼부부 (언제나 남자 한 명과 여자 한 명)
  couple-anything:
    title: "아무거나"
    cast: [couple, uncle]
    lines:
      - a: "자기 뭐 먹을래?"
      - a2: "아무거나~"
      - a: "그럼 컵라면?"
      - a2: "라면은 좀…"
      - b: "총각, 아무거나는 세상에 없는 메뉴여"
      - a: "…자기야, 아저씨 말이 맞는 것 같아"
    effect: {mood: {b: 6, a: -3}}
  couple-split-bill:
    title: "누가 낼래"
    cast: [couple, chatty]
    lines:
      - a2: "오늘은 내가 낼게!"
      - a: "아니야, 내가 낼게"
      - a2: "아까 영화도 자기가 냈잖아~"
      - b: "어머 어머, 둘이 싸우는 거야 사랑하는 거야~?"
      - a: "사, 사랑하는 거요…"
      - b: "아유 좋을 때다~ 아줌마도 그랬지~"
    effect: {mood: {a: 6, b: 8}, tip: {a: 1.3}}
  couple-ice-cream:
    title: "한 입만"
    cast: [couple, student]
    lines:
      - a2: "자기야 아이스크림 한 입만~"
      - a: "아~"
      - a2: "맛있다♥"
      - a: "…반이 없어졌네"
      - b: "아 나도 연애하고 싶다…"
    effect: {mood: {a: 4, b: -3}}
  couple-proposal:
    title: "편의점 프러포즈"
    cast: [couple, gentleman]
    when: {hours: [18, 2]}
    weight: 0.6
    lines:
      - a: "저기… 지금은 이것밖에 없지만"
      - a2: "어?! 이게 뭐야~"
      - a: "다음엔 진짜 반지로… 나랑 결혼해 줄래?"
      - a2: "바보야… 좋아!"
      - b: "허허, 축하드립니다. 좋은 날이군요"
    effect: {mood: {all: 8}, tip: {a: 2}}
  newlyweds-tissue:
    title: "신혼집 장보기"
    cast: [bride, market]
    lines:
      - a: "여보, 휴지는 큰 걸로 사자~"
      - a2: "응, 근데 여기보다 시장이 싸지 않을까?"
      - b: "아유 새댁이네~ 휴지는 장날에 시장 와요, 내가 반값에 줄게~"
      - a: "어머 정말요? 감사합니다~"
      - b: "신혼 때는 아껴야 돼~ 아줌마가 다 알지~"
    effect: {mood: {a: 6, b: 6}}
  newlyweds-fight:
    title: "누가 설거지할래"
    cast: [bride, worker]
    lines:
      - a: "여보, 오늘 설거지는 여보 차례야~"
      - a2: "어제 내가 했잖아~"
      - a: "어제는 라면이라 냄비 하나였잖아!"
      - b: "허허, 우리 집사람이랑 나도 삼십 년째 그 얘기여"
      - a2: "…오늘은 제가 할게요"
    effect: {mood: {a: 8, b: 5}}
  # ─────────────────────────────────────────────────────────────────────────────
  # 혼나고 조용해지기
  phone-scolded:
    title: "여기 도서관 아니에요?"
    cast: [phone, univ]
    lines:
      - a: "어 그래서 내가 그 인간한테!! 하하하!!"
      - b: "…저기요"
      - a: "어?! 잠깐만!! …왜요?"
      - b: "여기 편의점인데 다 들려요. 시험 기간이라…"
      - a: "아… 어, 나중에 전화할게"
    effect: {mood: {b: 6, others: 4, a: -4}}
  phone-grandma:
    title: "할머니 귀"
    cast: [phone, grandma]
    lines:
      - a: "여보세요?! 여보세요!! 안 들려!!"
      - b: "아이고 총각, 내 보청기가 다 울리네"
      - a: "아, 죄송합니다! … 어, 이따 다시 걸게"
      - b: "그래 그래, 착하다. 전화는 조용히 하는 기라"
    effect: {mood: {b: 5, others: 5}}
  rude-police:
    title: "갑자기 공손"
    cast: [rude, police]
    lines:
      - a: "어이 알바, 줄이 왜 이래? 나부터 해"
      - b: "선생님, 줄 서 계신 분들 계십니다"
      - a: "…아, 예. 서야죠, 서야죠"
      - b: "협조 감사합니다"
    effect: {mood: {others: 6, a: -6}, calm: 50}
  thug-grandma:
    title: "우리 손주 닮았네"
    cast: [thug, grandma]
    lines:
      - a: "어이~ 할매, 줄 좀 비켜 봐"
      - b: "아이고 총각, 우리 손주랑 똑 닮았네. 밥은 묵었나?"
      - a: "…아뇨, 아직…"
      - b: "아이고, 여 삼각김밥 하나 더 사라. 굶으면 성질만 나빠지는 기라"
      - a: "…예. 할머니도 조심히 들어가세요"
    effect: {mood: {a: 10, b: 6}, tip: {a: 1.5}}
  thug-wrestler:
    title: "덩치 앞에서"
    cast: [thug, wrestler]
    lines:
      - a: "어이 덩치, 형님 앞에 좀 비켜 봐"
      - a: "……"
      - b: "먼저 계산하시겠습니까?"
      - a: "아, 아뇨! 형님은… 뒤에 서는 게 체질이라서요"
    effect: {mood: {others: 6}, calm: 45}
  prankster-gentleman:
    title: "종 치는 꼬마"
    cast: [prankster, gentleman]
    lines:
      - a: "딸랑딸랑~ 히히"
      - b: "허허, 꼬마 신사분. 그 종은 손님이 오셨다는 인사랍니다"
      - a: "인사요?"
      - b: "자꾸 울리면 알바생이 매번 고개를 들어야 하지요. 힘들지 않겠어요?"
      - a: "…그럼 이제 안 칠게요. 대신 할아버지가 사탕 사 줘요!"
    effect: {mood: {a: 8, b: 6, others: 4}}
  complainer-monk:
    title: "스님의 미소"
    cast: [complainer, monk]
    lines:
      - a: "아니 이 가게는 바닥이 왜 이래? 물건은 왜 이렇게 비싸고!"
      - b: "허허, 보살님. 오늘 많이 고단하셨나 봅니다"
      - a: "…말도 마세요. 아침부터 되는 일이 없어요"
      - b: "그럴 땐 따뜻한 물 한 잔이 약이지요. 나무아미타불"
      - a: "…그래요, 물이나 한 병 사야겠네"
    effect: {mood: {a: 15, all: 3}}
  complainer-kid:
    title: "아줌마 무서워요"
    cast: [complainer, kid]
    lines:
      - a: "이거 유통기한 언제까지야? 날짜가 안 보이잖아!"
      - b: "…"
      - a: "…아, 꼬마야, 아줌마가 너한테 그런 거 아니야"
      - b: "…진짜요?"
      - a: "그래. 아이스크림 하나 골라, 아줌마가 사 줄게"
    effect: {mood: {a: 10, b: 15}}
  youtuber-quiet:
    title: "촬영 금지"
    cast: [youtuber, nurse]
    lines:
      - a: "여러분~ 지금 편의점 라이브 중이에요~ 다들 손 흔들어 주세요~"
      - b: "…찍지 마세요. 나이트 끝나고 화장도 안 했어요"
      - a: "아, 죄송해요! 모자이크 할게요!"
      - b: "그냥 꺼 주세요… 부탁이에요"
      - a: "…네, 여러분 잠깐 끊을게요."
    effect: {mood: {b: 10, a: -5}}
  # ─────────────────────────────────────────────────────────────────────────────
  # 따뜻한
  grandma-drunk-water:
    title: "물 한 병"
    cast: [grandma, drunk]
    when: {hours: [20, 21]}
    lines:
      - b: "딸꾹… 여기가… 어디여…"
      - a: "아이고 이 사람아, 이 시간에 술을 이래 묵고"
      - b: "할매… 우리 엄니 같어… 딸꾹"
      - a: "이거 마시고 집에 퍼뜩 가라. 엄니 걱정한다"
      - b: "…고마워요, 할매. 진짜루…"
    effect: {mood: {b: 20, a: 6}, calm: 40}
  soldier-office:
    title: "휴가 나온 군인"
    cast: [soldier, office]
    lines:
      - a: "…사제 음식이 이렇게 많다니"
      - b: "휴가 나왔어요? 몇 박?"
      - a: "4박 5일입니다!"
      - b: "크… 나 때는 말이야… 아니다. 그거 다 아저씨가 계산할게"
      - a: "아닙니다! 괜찮습니다!"
      - b: "괜찮긴, 나라 지키는 사람한테. 충성!"
    effect: {mood: {a: 15, b: 8}, tip: {b: 1.5}}
  nurse-rider:
    title: "서로 수고했어요"
    cast: [nurse, rider]
    lines:
      - b: "휴, 오늘 콜 미쳤다…"
      - a: "…저도 오늘 열여섯 시간 섰어요"
      - b: "와… 간호사세요? 저 지난번에 넘어져서 응급실 갔었는데"
      - a: "혹시 무릎 꿰맨 분? …기억나요. 다 나았어요?"
      - b: "덕분에 다 나았어요! 이 커피는 제가 살게요"
    effect: {mood: {a: 12, b: 10}}
  courier-resident:
    title: "그 택배 제 거예요"
    cast: [courier, resident]
    lines:
      - b: "어머, 기사님! 어제 우리 집 택배 문 앞에 잘 두고 가셨더라고요"
      - a: "아, 302호요? 김치 냄새 나던?"
      - b: "호호, 친정엄마가 보낸 거예요. 기사님 드시라고 하나 남겨 놨는데"
      - a: "아이고, 괜찮아요! …근데 진짜 맛있어 보이긴 했어요"
      - b: "다음에 꼭 드릴게요~ 오늘은 이 캔커피라도"
    effect: {mood: {a: 12, b: 8}}
  hiker-fisher:
    title: "산 사람 바다 사람"
    cast: [hiker, fisher]
    lines:
      - a: "아저씨, 낚시 가세요? 저는 산 가요"
      - b: "산은 힘들잖아요. 낚시는 앉아만 있으면 돼요"
      - a: "바다는 지루하잖아요. 산은 정상이 있어요!"
      - b: "바다엔 대물이 있죠. …초콜릿 하나 드실래요?"
      - a: "그럼 저는 생수 하나 드릴게요. 둘 다 잘 다녀와요!"
    effect: {mood: {a: 8, b: 8}}
  farmer-traveler:
    title: "옥수수 할 줄 알아요?"
    cast: [farmer, traveler]
    lines:
      - b: "아저씨… 농부… 예요? 사진… 같이…"
      - a: "허허, 흙 묻은 사람이랑 뭘 찍어. 그려, 찍자"
      - b: "와! 한국 농부! 멋있어요!"
      - a: "우리 밭에 오면 옥수수 따게 해 줄게잉"
      - b: "옥수수! 좋아요! 꼭 갈게요!"
    effect: {mood: {a: 10, b: 12}}
  kid-grandma-candy:
    title: "사탕 하나"
    cast: [kid, grandma]
    lines:
      - a: "…모자라네"
      - b: "아이고 우리 강아지, 뭐가 모자라노?"
      - a: "사탕… 동생 거까지 사려고 했는데…"
      - b: "할미가 보태 주께. 동생 거 꼭 챙기는 거 보니 착하다"
      - a: "감사합니다아! 할머니 최고!"
    effect: {mood: {a: 15, b: 10, others: 3}}
  gentleman-soldier:
    title: "늙은 군인"
    cast: [gentleman, soldier]
    lines:
      - a: "젊은이, 어느 부대인가요?"
      - b: "…이병입니다! 휴가 나왔습니다!"
      - a: "허허, 나도 오십 년 전에 그 자리에 있었지요. 춥지요?"
      - b: "네! 아니 괜찮습니다!"
