      - a: "…그 집이 어느 집인데요?"
      - b: "아 저기 감나무 집~ 맨날 군청에 전화하는~"
      - a: "그 감나무 집이 우리 집이에요"
      - b: "……(창밖을 본다) 어머 하늘 예쁘다"
