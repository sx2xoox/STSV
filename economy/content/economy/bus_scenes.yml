# 합승 대화 (README "마을버스" 합승 대화, docs/plans/리뉴얼_기획안_2026-11.md §6-4)
# 손님 종류 둘 · 셋이 같은 버스에 타 있으면 가끔 그들끼리 짧은 장면이 펼쳐짐: 말풍선이 한 줄씩 차례로 (버스 안 누구에게나 보임,
# 기사 화면에는 얼굴 옆 말풍선), 끝나면 effect 가 그 탑승에 실제로 일어남. 처음 본 장면은 인물 도감의 그 사람들 칸에 "장면" 으로 남음.
#
# 언제: 정류장을 떠나 settle 초 뒤 (구간마다 한 번) 장면을 할 손님들이 다 타 있으면 chance 확률. 한 기사는 cooldown 초에 한 번까지.
#   말풍선이 떠 있으면 조금 뒤로 미룸. 기사가 아직 안 본 장면은 unseen 배로 잘 나옴. 장면에 나온 손님은 그 탑승에 다시 안 나옴.
#   (정류장 사이 약 2분 · 손님 8명 꽉 찬 버스로 어림: 장면을 할 손님들은 거의 늘 있어 구간마다 약 11%, 10분 쿨타임까지 더하면
#    손님 한 명이 타는 정류장 세 곳(약 6분)을 한 번 운행으로 치면 다섯 번에 한 번꼴, 쉬지 않고 몰아도 한 시간에 두어 번.
#    손님이 적으면 더 드묾. BusScenesTest 가 100번 운행으로 확인)
# 말풍선 하나가 떠 있는 시간: pause.base + 글자 수 × pause.per-char 초 (min ~ max), 그다음 줄.
#
# 장면 (scenes.<id>):
#   title: 도감 · 기사 채팅에 보이는 제목
#   cast: [손님 종류 2~3] (역할 a, b, c 차례). 같은 종류 둘이면 그 종류 손님 둘 (커플 · 유치원생 · 신혼부부는 둘이 같이 탐)
#   when: (모두 없어도 됨) hours [시작, 끝) 한국 시각 · months [달] · rain: true 비 오는 날 · market: true 장날 · weekend: true 주말
#         below / above: {역할: 기분} 기분 미만 / 이상 · loud: [역할] 아직 시끄러움 (버릇이 안 멈춤) · dozing: [역할] 졸고 있음
#         seen: <장면 id> 그 기사가 그 장면을 본 적이 있어야 (이어지는 이야기)
#   lines: 차례대로 - a: "대사" (또는 - {who: a, line: "대사"})
#   weight: 고르는 비율 (기본 1)
#   effect: 장면이 끝나면 (적어도 하나):
#     quiet: 역할 · [역할]   그 탑승 동안 버릇이 멈춤: 수다 · 통화 · 쩍벌 (chatter), 벨 장난, 과자 부스러기, 건달의 위협 (그 손님만 가능)
#     pay: 역할 · [역할]     운임을 다 냄: 무임승차 · 운임 깎기 · 건달의 공짜가 안 됨 (그 버릇이 있는 손님만)
#     mood: {역할|all|others: ±n}   기분 (all 모두, others 장면에 안 나온 손님들)
#     leave: 역할 · [역할]   다음에 서는 정류장에서 내림 (탄 만큼만 운임)
#     doze / wake: 역할 · [역할]   꾸벅꾸벅 졸기 시작 (내릴 곳을 지나칠 수 있음) / 잠이 깸 (지나치지 않음)
#     tip / fare: {역할: 배수}   내릴 때 팁 · 운임 × (fare 0 = 다른 손님이 대신 냄)
#     calm: n   버스 안 모두 기분 n 이상으로
#     gift: {item: 아이템, amount: n}   기사에게 선물
chance: 0.12
cooldown: 600
settle: 12
unseen: 4
pause:
  base: 1.6
  per-char: 0.07
  min: 2.5
  max: 5.5

scenes:
  # ─────────────────────────────────────────────────────────────────────────────
  # 건달 (thug) 이야기: 기가 죽고, 얌전해지고, 가끔은 사람 냄새
  thug-wrestler:
    title: "덩치 앞에서"
    cast: [thug, wrestler]
    lines:
      - a: "어이 덩치, 형님 앉게 좀 비켜 봐"
      - b: "(천천히 일어선다. 버스가 살짝 기운다)"
      - a: "……"
      - b: "앉으시겠습니까?"
      - a: "아, 아뇨! 형님은… 서서 가는 게 체질이라서요"
    effect: {quiet: a, pay: a, mood: {others: 4}}
  thug-police:
    title: "갑자기 공손"
    cast: [thug, police]
    lines:
      - a: "형님은 공짜지? 기사 양반 장부에 달아 놔~"
      - b: "(모자를 고쳐 쓰며 돌아본다) 선생님, 방금 뭐라고 하셨죠?"
      - a: "…요, 요금 내겠다고 했습니다. 카드 찍겠습니다"
      - b: "협조 감사합니다"
      - a: "(목걸이를 셔츠 안으로 쓱 넣는다)"
    effect: {quiet: a, pay: a, mood: {others: 5}}
  thug-grandma:
    title: "우리 손주 닮았네"
    cast: [thug, grandma]
    lines:
      - a: "어이 할매, 자리 좀…"
      - b: "아이고 총각, 우리 손주랑 똑 닮았네. 밥은 묵었나?"
      - a: "…아뇨, 아직…"
      - b: "아이고 이거 묵어라, 떡이다 떡. 굶고 다니면 성질만 나빠지는 기라"
      - a: "(떡을 받아 든다) …잘 먹겠습니다, 할머니"
    effect: {quiet: a, pay: a, mood: {b: 6}}
  thug-chicken:
    title: "닭이 건달을 쫀다"
    cast: [chicken, thug]
    lines:
      - b: "할매, 닭은 짐칸에 실어야지 왜 안고 타"
      - a: "우리 꼬꼬는 사람이여. 꼬꼬야, 저 아저씨가 니 짐이라 카네"
      - b: "아야! 야, 이 닭이 지금 형님을 쪼았어?!"
      - a: "꼬꼬가 사람 볼 줄 안다 아이가. 허허"
      - b: "(손등을 문지르며 구석으로 간다) …무서운 닭이네"
    effect: {quiet: b, mood: {a: 5, others: 4}}
  thug-prankster:
    title: "아저씨 팔에 용 있다!"
    cast: [prankster, thug]
    lines:
      - a: "(띵동!) 히히, 내리는 사람 없지롱~"
      - b: "어이 꼬마, 형님 앞에서 벨 장난이야?"
      - a: "우와! 아저씨 팔에 용 있다! 진짜 용이야?"
      - b: "…어? 어, 이거 진짜 용이지. 형님이 용띠거든"
      - a: "멋있다! 나 이제 벨 안 누를게! 대신 용 또 보여 줘!"
      - b: "(소매를 걷어 준다) …딱 한 번이다"
    effect: {quiet: [a, b], mood: {a: 8, others: 3}}
  thug-soldier:
    title: "형님이 쏜다"
    cast: [thug, soldier]
    lines:
      - a: "어이 군인, 휴가냐?"
      - b: "네! 그렇습니다!"
      - a: "크… 형님도 왕년에 각 잡고 그랬지. 기사 양반, 이 친구 차비는 형님이 낸다"
      - b: "아닙니다! 괜찮습니다!"
      - a: "괜찮긴, 나라 지키는 사람한테. 충성이다, 충성!"
    effect: {pay: a, fare: {a: 2, b: 0}, mood: {b: 8, a: 5}}
  thug-monk:
    title: "스님의 미소"
    cast: [thug, monk]
    lines:
      - a: "(어깨를 들썩) 뭘 봐요, 스님?"
      - b: "허허, 어깨가 많이 무거워 보여서요"
      - a: "…형님 어깨는 원래 넓어서 그래요"
      - b: "짐을 내려놓으면 더 넓어지지요. 나무아미타불"
      - a: "(한참 말이 없다) …스님, 그거 어떻게 내려놓는 건데요"
    effect: {quiet: a, mood: {all: 3}}
  thug-magician:
    title: "목걸이가 사라졌다"
    cast: [thug, magician]
    lines:
      - b: "자, 손님! 목에 건 그 목걸이, 잘 보세요~ 하나, 둘, 셋!"
      - a: "어? 어?! 내 목걸이 어디 갔어?!"
      - b: "버스 요금을 내시면 돌아옵니다~"
      - a: "(허겁지겁 카드를 찍는다) 냈어! 냈다고!"
      - b: "짠! 손님 주머니 속에 있습니다~"
    effect: {quiet: a, pay: a, mood: {others: 6}}
  thug-shaman:
    title: "관재수가 끼었네"
    cast: [thug, shaman]
    lines:
      - b: "(방울을 딸랑) …총각, 올해 관재수가 들었구먼"
      - a: "과, 관재수? 그게 뭔데요"
      - b: "나쁜 짓 하면 바로 걸린다는 기여. 차비 같은 거 떼먹으면 특히"
      - a: "…기사님, 저 요금 냈죠? 안 냈으면 지금 낼게요"
    effect: {pay: a, mood: {a: -6, b: 4}}
  thug-gentleman:
    title: "신사의 품격"
    cast: [thug, gentleman]
    lines:
      - a: "어이 영감님, 그 모자 좀 비싸 보이네?"
      - b: "허허, 오래된 것이지요. 젊은이 목걸이도 근사합니다"
      - a: "…그, 그렇죠? 이거 형님이 직접 고른 거예요"
      - b: "물건을 볼 줄 아는 분은 사람도 볼 줄 알지요. 잘 부탁합니다"
      - a: "(괜히 넥타이 없는 목을 만진다) …네. 저도 잘 부탁합니다"
    effect: {quiet: a, mood: {a: 5, b: 3}}
  thug-kid:
    title: "형아 그거 진짜 문신이야?"
    cast: [kid, thug]
    lines:
      - a: "형아! 그 팔에 그림 진짜 문신이야?"
      - b: "당연하지, 형님 문신은 진짜…"
      - a: "근데 왜 귀퉁이가 벗겨졌어?"
      - b: "……스티커다. 엄마한테 말하지 마라"
      - a: "헐! 나도 갖고 싶어!"
    effect: {quiet: b, mood: {a: 8, others: 4}}
  thug-ghost:
    title: "새벽 버스의 손님"
    cast: [ghost, thug]
    lines:
      - b: "(어두운 버스 안을 둘러본다) …어이, 거기 뒤에 누구 있어?"
      - a: "……여기… 제 자리인데요……"
      - b: "어? 방금 거기 아무도 없었는데?"
      - a: "……삼십 년째… 이 자리예요……"
      - b: "기, 기사님! 저 다음에 내릴게요! 꼭 내릴게요!"
    effect: {leave: b, mood: {others: 4}}
  thug-drunk:
    title: "동생아~"
    cast: [drunk, thug]
    lines:
      - a: "어이~ 동생! 오랜만이다~ (덥석 어깨동무)"
      - b: "아저씨 누구세요? 이거 놔요"
      - a: "우리 동생이 이렇게 컸네~ 형이 노래 한 곡 해 줄까~"
      - b: "아니 됐다니까요… 아 머리 기대지 마요…"
      - a: "드르렁~ 쿨~"
      - b: "(꼼짝도 못 하고 굳어 있다) …형님 체면이…"
    effect: {doze: a, quiet: b}
  thug-complainer:
    title: "민원 넣을 거예요"
    cast: [thug, complainer]
    lines:
      - a: "형님은 공짜지? 기사 양반 알지?"
      - b: "알긴 뭘 알아요? 학생, 이름이 뭐예요? 어느 동네 살아요?"
      - a: "아니 아줌마, 학생 아니고 형님…"
      - b: "형님이고 뭐고 다 적을 거예요. 군청에, 경찰서에, 엄마한테!"
      - a: "엄마한테는 왜요! …내요, 낼게요"
    effect: {pay: a, quiet: a, mood: {b: 8}}
  thug-mom:
    title: "아기가 자요"
    cast: [thug, mom]
    lines:
      - a: "(큰 소리로) 내가 왕년에 말이야~!"
      - b: "쉿! 아기 방금 잠들었어요"
      - a: "어… 어, 미안. (속삭이며) …몇 개월이에요?"
      - b: "칠 개월이요"
      - a: "(아기를 보고 씩 웃는다) …형님보다 인물 좋네"
    effect: {quiet: a, mood: {b: 6, all: 2}}
  thug-santa:
    title: "착한 아이 명단"
    cast: [thug, santa]
    when: {months: [12]}
    lines:
      - b: "호호호~ 자네, 올해 착한 아이 명단에 이름이 없더군"
      - a: "에이, 산타가 어디 있어요. 형님은 그런 거 안 믿어"
      - b: "그래도 차비를 내면 명단에 올려 주지. 아직 늦지 않았어, 호호"
      - a: "…진짜요? (주섬주섬 카드를 꺼낸다) 올해 선물 뭐 줘요?"
    effect: {pay: a, quiet: a, mood: {a: 5, others: 3}}
  thug-hangover:
    title: "요즘 되는 일이 없어"
    cast: [thug, uncle]
    when: {seen: thug-police}
    lines:
      - a: "아저씨… 요즘 형님 되는 일이 하나도 없어요"
      - b: "왜? 무슨 일 있었어?"
      - a: "버스만 타면 경찰 있고, 씨름 선수 있고, 닭이 쪼고…"
      - b: "허허, 그건 착하게 살라는 거야. 일자리 찾나? 우리 공장에 사람 구해"
      - a: "…진짜요? 형님… 아니 저, 내일 가 봐도 돼요?"
    effect: {quiet: a, pay: a, mood: {a: 12, b: 5}}
  thug-univ-wrestler:
    title: "든든한 뒷자리"
    cast: [thug, univ, wrestler]
    lines:
      - a: "어이 학생, 그 가방 좀 치워 봐. 형님 다리 놓게"
      - b: "아… 네, 네…"
      - c: "(뒷자리에서 일어나며) 학생, 그냥 앉아 있어요"
      - a: "…아 네, 앉아 계세요. 형님이 서서 가죠, 뭐"
      - b: "(작게) 감사합니다…"
    effect: {quiet: a, pay: a, mood: {b: 10, c: 3}}
  thug-phone-police:
    title: "조용한 버스"
    cast: [phone, thug, police]
    lines:
      - a: "아 뭐라고?! 안 들려!! 크게 말해!!"
      - b: "어이, 형씨! 목소리 좀 줄여! 형님 귀 아파!"
      - a: "뭐요?! 당신이 뭔데!!"
      - c: "두 분 다 조용히 해 주시겠습니까? 다른 승객분들도 계십니다"
      - b: "…네"
      - a: "(전화에 대고 속삭인다) 엄마 나중에 전화할게…"
    effect: {quiet: [a, b], pay: b, mood: {others: 6}}
  thug-mailman:
    title: "형님 앞으로 온 편지"
    cast: [thug, mailman]
    lines:
      - b: "어? 혹시 고개 너머 사는 분 아니세요? 마침 편지가 있는데"
      - a: "형님한테 편지? 누가?"
      - b: "보내는 사람… 어머님이시네요"
      - a: "(편지를 받아 들고 한참 본다) …엄니 글씨네"
      - a: "(창밖을 보며 코를 훌쩍인다) …기사님, 오늘은 조용히 갈게요"
    effect: {quiet: a, mood: {a: 15}}

  # ─────────────────────────────────────────────────────────────────────────────
  # 다툼: 누가 누구랑 싸운다
  rude-complainer:
    title: "깐깐함 대 막무가내"
    cast: [rude, complainer]
    lines:
      - a: "어이 아줌마, 그 가방 좀 치워"
      - b: "아줌마? 지금 저한테 반말하셨어요?"
      - a: "반말이 아니라 원래 말투가 이래"
      - b: "그럼 저도 원래 민원을 잘 넣어요. 성함이 어떻게 되세요?"
      - a: "…허, 참. 됐어, 됐어"
    effect: {mood: {a: -8, b: -6, others: -3}}
  rude-complainer-gentleman:
    title: "모자를 벗은 신사"
    cast: [gentleman, rude, complainer]
    lines:
      - b: "아 거 좀 비켜!"
      - c: "어머, 왜 밀어요?! 사과하세요!"
      - b: "내가 언제 밀었어!"
      - a: "(모자를 벗어 들며) 두 분, 오늘 날씨가 참 좋지 않습니까"
      - a: "이 좋은 날 언성을 높이기엔 아깝지요. 제가 두 분께 사탕을 하나씩 드려도 되겠습니까"
      - c: "…어머, 고마워요"
      - b: "…흠, 받지 뭐"
    effect: {calm: 70, pay: [b, c]}
  rude-vip:
    title: "자리 다툼"
    cast: [vip, rude]
    lines:
