      - a: "자네, 얼마나 급한가"
      - b: "네? 아… 오십만 원이요…"
      - a: "(명함을 건넨다) 내 회사에 내일 오게. 일자리가 있네. 대신 지금은 조용히"
      - b: "(전화를 끊는다) …네! 네! 감사합니다!"
