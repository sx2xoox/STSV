      - b: "나? 허허, 내가 말이야, 이 동네에 처음 왔을 때…"
      - b: "그때 이 길이 다 논이었어. 그러고 우리 아들이…"
      - a: "(삼십 분째) …아저씨, 저 배터리가…"
