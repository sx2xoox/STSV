  mom-spread:
    title: "애 업은 엄마에게 자리를"
    cast: [mom, spread]
    lines:
      - a: "(아기를 업고 손잡이를 잡는다) 휴…"
      - b: "(다리를 벌린 채 휴대폰을 본다)"
      - a: "아가야 조금만 참자, 곧 내려"
      - b: "(고개를 든다) …어? 여기 앉으세요! (다리를 모으고 일어선다)"
      - a: "어머, 고맙습니다"
