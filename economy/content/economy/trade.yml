# 거래 수단(거래소, 경매, 직거래)의 수수료와 제한
market:            # 거래소 /거래소
  fee: 0.07        # 팔릴 때 7% (돈이 빠지는 곳)
  max-listings: 10
  hours: 48        # 지나면 우편함으로 돌아옴
auction:           # 경매 /경매
  fee: 0.10        # 낙찰가의 10% (돈이 빠지는 곳)
  deposit: 100     # 보증금: 팔리면 돌려받고, 입찰이 없으면 잃음
  minutes: 30
  extend-seconds: 60   # 끝나기 전 이 시간 안의 입찰은 마감을 이만큼 뒤로 (스나이핑 방지)
  min-raise: 0.05      # 다음 입찰은 현재가 +5% 이상
  max-running: 3       # 서버 전체 동시 진행 (플레이어 경매)
  rare-weekly-wins: 2  # 서버 경매(희귀품) 1인 주간 낙찰 제한
  min-start: 10
trade:             # 직거래 /거래
  distance: 10
credit:            # 업적·미션에 세는 거래 (market_sold 거래소 판매, auctions_won 경매 낙찰): 짜고 치는 거래 방지
  min-price: 100   # 이 값 이상에 팔린 것만 셈
  shop-ratio: 1.0  # 그리고 상점이 같은 물건에 주는 값(기준가 × 개수)의 이 배수 이상 (상점이 안 사는 물건은 min-price 만)
  pair-hours: 24   # 같은 두 사람 사이의 거래는 이 시간에 한 번만 셈 (거래 자체는 언제나 됨)
