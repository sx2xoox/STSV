# 동방해운 — 숨은 비밀 (운영자 문서: docs/admin/숨은_비밀/동방해운.md · README 에는 적지 않음)
# 1987년, 선상 주주총회를 하던 화물선 「동방호」가 남해에서 사라졌다. 주주 12명은 "실종", 회사는 상장 폐지.
# 남은 1주의 주인 — 열세 번째 주주 — 가 오면 총회는 다시 열린다. 그런데 열두 명 가운데 한 명은 처음부터 배에 타지 않았다.
# 왜 회의가 끝나지 못했나: 주주명부의 13명 중 한 명은 명부에만 있고 배에 오르지 않아 살아남았다. 평생 그 배를 놓지 못한
# 그 사람의 미련이 의자 하나를 차지하고 있어서 정족수가 맞지 않는다. 주가가 플레이어를 따라 움직이는 건, 남은 이들이
# 비어 있는 열세 번째 자리 (= 플레이어) 를 지켜보고 있기 때문. 미련을 가려내면 열하나 + 열세 번째 주주로 정족수가 차고 회사는 해산한다.
# 시간: "하루" 는 한국 시간 날짜 (자정 = 한국 시간 0시). 테스트 모드 (/관리자 비밀 테스트) 에서는 하루 = common.yml 의
# test-day-seconds (기본 60초), 10분 봉 = 하루의 1/24 (60초면 2.5초). 문구는 모두 MiniMessage.
enabled: true

# 돈은 주지 않는다 (예전의 300,000 G · 매일 청산 배당 5,000 G 는 없앰). 보상은 하나뿐인 것들:
# 칭호, 마지막 주주 증서, 그리고 모두의 /주식 목록 맨 아래에 영원히 남는 기념 줄 (아래 memorial)
rewards:
  money: 0
  title: economy:last_shareholder
  # 마지막 주주 증서 (economy:dongbang_certificate) 는 코드가 이름 · 설명을 붙여서 직접 줌 (아래 certificate). 더 줄 것만 여기에
  items: []

solved-line: "<dark_gray>어느 남쪽 바다에서, 열한 번의 물소리가 차례로 났다. 동방해운이 해산했다."
too-late: "<dark_gray>…회의실은 비어 있다. 의자마다 물만 고여 있다. 누군가 먼저 표를 던졌다."

# 푼 뒤: 모든 사람의 /주식 목록 ("전체" 탭) 맨 아래에 회색 기념 줄 하나 (거래 안 됨). 누르면 click 한 줄.
# 테스트로 푼 사람에게는 본인에게만 보인다. {player} = 청산인 (푼 사람), {date} = 푼 날 (한국 시간)
memorial:
  name: "<gray>동방해운 <dark_gray>(청산 완료)</dark_gray> · 청산인 {player}"
  lore:
    - "<dark_gray>해운 · 1987년 상장 폐지"
    - "<dark_gray>{date} 청산 완료 · 주주 전원 하선"
    - ""
    - "<gray>마지막 주주 <white>{player}"
    - ""
    - "<dark_gray>거래할 수 없습니다"
  click: "<#6f8a96>…{date}, 마지막 주주 {player}. 동방해운은 이제 아무것도 거래하지 않습니다."

# /주식 목록 맨 아래에 뜨는 줄 (아직 안 산 사람에게만). 아주 드물다: 한국 날짜로 하루에 한 번, 사람마다 chance 확률로
# "오늘이 그날" 이 되고, 그날 접속해 있던 시간이 online-minutes 사이의 (사람 · 날짜로 정해진) 분에 이르면 minutes 분 동안 뜬다.
# 뜨는 순간 그 사람 채팅에만 cue 한 줄 (뉴스 모양) + 먼 뱃고동. 테스트 모드: 늘 뜸
offer:
  chance: 0.03                 # 하루에 그날이 될 확률 (사람마다). 0.03 = 한 달에 한 번쯤
  online-minutes: [5, 120]     # 그날 접속한 지 몇 분째에 뜰지 (이 사이에서 사람 · 날짜로 정해짐, 다시 들어와도 이어서 셈)
  minutes: 1                   # 뜨는 시간 (분)
  grace-minutes: 5             # 목록에서 본 뒤 이만큼은 창을 열어 둔 채로 살 수 있음
  cue: "<#8c826d>[1987.11.29] 동방해운, 매매 거래 재개 공고… 「1주 남았습니다」"
  icon-name: "<gray>동방해운 <dark_gray>(거래정지)"
  icon-lore:
    - "<dark_gray>해운 · 1987년 상장 폐지"
    - "<dark_gray>마지막 거래가 {price}"
    - ""
    - "<gray>클릭: 자세히"
  left: "<gray>…1주 남았습니다."

share:
  price: 1987                  # 그 1주의 값 (G). 살 때 내는 돈이자 첫 주가
  name: "<gray>동방해운"
  icon-lore:
    - "<dark_gray>해운 · 1987년 상장 폐지"
    - "<gray>현재가 <white>{price}</white> {change}"
    - "<gray>내 주식 <white>1주</white> <dark_gray>· 평가 손익 {pl}"
    - "{halted}"
    - "<gray>클릭: 자세히"
  bought: "<gray>동방해운 <white>1주</white>를 샀습니다. <dark_gray>({price})"
  bought-whisper: "<#9fb8c7>…어서 오십시오. 열세 번째 분."
  not-enough: "<red>잔액이 부족합니다."
  too-late: "<dark_gray>…목록에서 사라졌다. 다시는 안 보일지도 모른다."
  no-more: "<dark_gray>남은 주식이 없습니다."
  sell-confirm: "<gray>…정말 내리시겠습니까? <dark_gray>(5초 안에 한 번 더 누르면 팝니다)"
  sold: "<gray>동방해운 <white>1주</white>를 팔았습니다 → <white>{amount}"
  # 창 (회사 화면) 의 값
  industry: "<#6f8a96>해운"
  risk: "<dark_gray>측정 불가"
  shares: "13"
  dividend-line: "<dark_gray>배당: 주주총회에서 정함"
  fee: "수수료 없음"
  offer-fee: "1주 남았습니다"
  # 회사 화면의 "최근 뉴스" 줄 (단계마다)
  news:
    offer: "<gray>[1987.11.29] 선상 주주총회 중이던 「동방호」, 남해에서 연락 두절. 주주 12명 실종, 거래정지"
    held: "<gray>[1987.12.30] 동방해운 상장 폐지. 1주는 끝내 주인을 찾지 못함"
    notice: "<gray>[공시] 제38기 주주총회 소집. 본사 소재지는 마지막 교신으로 갈음함"
    convened: "<gray>[공시] 주주총회 속개. 안건: 열세 번째 주주의 확정 (출석 12 중 승선 11)"

# /주식 뉴스가 그 사람에게만 이상하게 보인다 (그 사람 화면의 사본만 바뀜. 진짜 뉴스 · 주가 · 다른 사람은 그대로).
# 이 news 칸을 통째로 지우면 뉴스는 늘 진짜대로 나옴. 한 줄짜리를 "" 로 비우면 그것만 빠짐.
# 문구는 진짜 뉴스 (news.yml format) 와 같은 모양으로: <gray>[머리말]</gray> <white>회사</white><gray>, 원인… 결과</gray>
news:
  echo-delay-seconds: 3        # 진짜 뉴스가 채팅에 뜬 뒤, 그 사람에게만 가는 한 줄이 이만큼 뒤에 따라옴
  # 1분짜리 줄을 본 동안 (목록에서 본 뒤 offer.grace-minutes 까지): /주식 뉴스 10줄이 통째로 다른 곳에서 온 것처럼
  offer:
    # 맨 위 (= 가장 오래된 뉴스) 에 옛날 형식 헤드라인 하나
    head: "<#8c826d>[1987.11.29] 동방해운, 창립 기념 선상 주주총회 개최… 화물선 「동방호」 출항"
    # 진짜 뉴스 줄마다 앞에 붙는 시각 (진짜 뉴스에는 시각이 없다. 전부 같은 시각)
    stamp: "<#5d6b73>03:33</#5d6b73> "
    # 이만큼의 진짜 줄에서 낱말 하나가 word 로 바뀜 (회사 이름은 안 건드림. "침수로" → "물로", 조사는 맞춰 줌)
    word: "물"
    soaked: 2
    # 이만큼의 진짜 줄에서 변동률이 13.0% 로 읽힘 (화살표 · 색은 그대로)
    thirteen: 1
    # 진짜 줄들 사이 어딘가에 끼는 한 줄 (같은 말이 되풀이되다 끊김)
    fragment: "<#6f8a96>…13번째 주주를 찾습니다… …13번째 주주를 찾습니다… …13번째 주주를"
    # 그 동안 진짜 뉴스가 채팅에 뜨면, 그 사람에게만 한 줄 더 ("[뉴스]" 모양). 한 번의 1분에 한 번까지
    echo: "<#8c826d>[1987.11.29] 동방호, 남해 해역서 교신 두절… 「출석 12, 재적 13. 한 분을 더 기다립니다」"
  # 들고 있는 동안 (1~3단계): /주식 뉴스를 열 때마다 chance 로, 진짜 줄들 사이에 그 단계의 헤드라인 하나 (테스트: 매번).
  # 진짜 뉴스가 채팅에 뜰 때 echo-chance 로 그 사람에게만 한 줄 더 (하루 한 번까지)
  held:
    chance: 0.15
    echo-chance: 0.1
    stage-1:
      - "<gray>[사회]</gray> <white>남해 해역</white><gray>, 정체불명 뱃고동 신고 잇따라… 해경 \"주변에 선박 없음\"</gray>"
      - "<gray>[지역]</gray> <white>남해안 어민들</white><gray>, \"새벽마다 안개 속에서 기적 소리\"… 출어 미뤄</gray>"
    stage-2:
      - "<gray>[정정]</gray> <white>동방해운</white><gray> 주주명부 13명 → 12명 → 13명</gray>"
      - "<gray>[공시]</gray> <white>동방해운</white><gray>, 제38기 정기 주주총회 소집… 장소 \"마지막 교신으로 공고\"</gray>"
      - "<gray>[속보]</gray> <white>동방호</white><gray> 마지막 교신 녹음 일부 공개… \"새벽 3시 33분, 안개 속\"</gray>"
    stage-3:
      - "<gray>[정정]</gray> <white>동방호</white><gray> 승선 주주 12명 → 11명… \"한 명은 부두에서 배웅만\"</gray>"
      - "<gray>[현장]</gray> <white>동방해운 본사</white><gray> 터에 물웅덩이… \"의자가 하나 비어 있었다\"</gray>"
      - "<gray>[해설]</gray> <white>동방호 생존자 없음</white><gray>… \"배에 탔던 이들은 거짓을 말하지 않는다\"</gray>"
      - "<gray>[인물]</gray> <white>동방호 승선을 취소했던 주주</white><gray>, 끝내 별세… 유족 \"평생 그 배 이야기만 했다\"</gray>"
  # 푼 뒤 처음 /주식 뉴스를 열 때 한 번, 맨 아래 (= 가장 새 뉴스) 에
  solved: "<#9fb8c7>[공시] 동방해운 청산 완료. 주주 전원 하선."
  # 판 뒤 처음 /주식 뉴스를 열 때 한 번, 맨 아래에
  sold: "<gray>[공시]</gray> <white>동방해운</white><gray>, 마지막 주주 매도… 거래 영구 정지</gray>"

# 주가: 들고 있는 사람만 따라 움직인다 (10분 봉 = 그 사람의 10분)
price:
  online: 0.005                # 접속해 있으면 10분마다 이만큼 (로그) 오름
  offline: 0.003               # 나가 있으면 10분마다 이만큼 내림
  noise: 0.004                 # 10분마다 흔들림
  water: 0.05                  # 물가 (반경 2칸 안에 물, 또는 물속) 에 있으면 10분마다 이만큼 크게 출렁임
  min: 100
  max: 20000

# 본사 (최종 주주총회) 좌표: 사람마다 정해짐 (UUID), 가운데가 청크 한가운데. 평평한 땅을 고름
headquarters:
  world: ""                    # 비우면 건축(본) 월드
  min: 300                     # |X|, |Z| 범위 (마지막 교신이 불러 주는 값)
  max: 1500
  tries: 12                    # 평평한 땅을 찾으려 보는 후보 수 (청크를 읽거나 만듦)

# 산 뒤 접속해 있던 시간이 after-minutes 가 되면 우편함에 오는 통지서 (economy:dongbang_notice). 테스트: test-after-seconds
notice:
  after-minutes: 30
  test-after-seconds: 20
  name: "<#b9c4c9>주주총회 소집 통지서"
  arrived: "<gray>우편함에서 젖은 종이 냄새가 난다. <white>/우편함"
  # {fragment} = 마지막 교신 1번째 줄 (이 사람의 동서 방향)
  lore:
    - "<#9fb8c7>동방해운 주식회사"
    - "<gray>제38기 정기 주주총회 소집 통지"
    - ""
    - "<gray>주주 귀하."
    - "<gray>본사 사옥은 사정상 주소를 잃었습니다."
    - "<white>본사 주소는 동방호의 마지막 교신 그대로입니다."
    - "<gray>교신은 여섯 줄. 나머지 다섯 줄은"
    - "<gray>주식 뉴스와 회사 창으로 흘러 들어갔습니다."
    - ""
    - "{fragment}"
    - ""
    - "<gray>안건: 열세 번째 주주의 확정."
    - "<gray>의석은 열셋. 한 자리가 비어 있습니다."
    - "<gray>주가가 당신을 따라 움직이는 것은"
    - "<gray>우리가 그 빈자리를 보고 있기 때문입니다."
    - "<dark_gray>(종이가 젖어 글씨가 번져 있다)"
    - ""
    - "<#6f8a96><i>우리는 아직 배에서 내리지 못했습니다"

# 동방호의 마지막 교신 (본사 좌표). 여섯 줄이 흩어져 있다:
#   1 통지서 · 2 뉴스 · 3 회사 창 정보 칸 · 4 뉴스 · 5 회사 창 "어제" 값 (= 차트의 종가 자리) · 6 뉴스
# 숫자는 한 자리씩 (공 하나 둘 셋 넷 다섯 여섯 일곱 여덟 아홉). 자리표시: {dir-x} 동서 방향, {x-head} |X| 의 끝 두 자리를 뺀
# 앞자리, {x-tail} |X| 의 끝 두 자리, {dir-z} 남북 방향, {z} |Z| (쉼표 붙은 가격 모양). 줄 순서 · 자리표시를 바꾸면 수수께끼가 바뀜
radio:
  east: "해 뜨는 쪽"           # +X
  west: "해 지는 쪽"           # −X
  south: "남"                  # +Z
  north: "북"                  # −Z
  title: "<#6f8a96>— 동방호 마지막 교신 —"
  lines:
    - "<#6f8a96>[교신 1/6] 여기는 동방호, 남해 상. 안개 짙음. 본사 위치 불러 드림. 먼저 동서(東西). {dir-x}으로…"
    - "<#6f8a96>[교신 2/6] …{x-head}…"
    - "<#6f8a96>[교신 3/6] …{x-tail}. 이상 동서. 다음 남북(南北)…"
    - "<#6f8a96>[교신 4/6] …남북 숫자는 물에 젖어 받아 적지 못함. 주가에 맡김. 어제 종가 그대로…"
    - "<white>{z} G</white> <#6f8a96>[교신 5/6]"
    - "<#6f8a96>[교신 6/6] …{dir-z}쪽으로. 현재 03시 33분. 이상. 반복 없음."

# 판 사람: 이만큼 뒤 우편함에 오는 편지 하나. 그 사람은 다시 못 함
sold:
  delay-seconds: 60
  test-delay-seconds: 5
  name: "<#b9c4c9>젖은 편지"
  lore:
    - "<gray>…또 혼자 남았군요."
    - ""
    - "<dark_gray>괜찮습니다. 늘 그랬으니까요."
    - "<dark_gray>— 동방해운 주주 일동 (12명)"

# 들고 있는 동안 (1~3단계): 1분마다 이 확률로 액션바 속삭임 (테스트: 매분). 물가면 water 에서도 고름
haunt:
  whisper-chance: 0.08
  whispers:
    - "<#6f8a96>…13번째 분…"
    - "<#6f8a96>…자리를 비워 두었어요…"
    - "<#6f8a96>…누가 회사를 닫아 줘요…"
    - "<#6f8a96>…아직 회의 중입니다…"
    - "<#6f8a96>…당신 자리를 보고 있어요…"
    - "<#6f8a96>…내리고 싶어요…"
    - "<#6f8a96>…지금 몇 년도예요…"
  water:
    - "<#6f8a96>…물이 차가워요…"
    - "<#6f8a96>…여기 바닥이 젖었어요…"
    - "<#6f8a96>…발밑이 흔들려요…"

# 최종 주주총회 (본사 좌표 근처, 2 · 3단계). 처음 걸어 들어오면 3단계
meeting:
  radius: 16                   # 이 안에 들어오면 그 사람에게만 보이는 회의실이 생김 (48칸 밖으로 나가면 사라짐)
  test-retry-minutes: 10       # 틀린 뒤 회의실이 닫혀 있는 시간 (테스트 모드). 테스트가 아니면 다음 날 (한국 시간 0시) 까지
  # 마네킹: 스킨 (null/빈칸 = 기본, "economy:entity/... [slim]"), 머리에 씌우는 블록 (얼굴을 가림), 양복 색
  skin: ""
  head: "minecraft:tinted_glass"
  suit-color: "#1d2026"
  seat-height: 0.6             # 의자 (계단) 블록 위로 앉는 높이 (마네킹 · 플레이어)
  tag: "<gray>{name}"          # 마네킹 위 이름표 (최근 접속한 진짜 플레이어 12명, 한 판 동안 고정)
  tag-line: "<#9fb8c7>«{line}»"   # 바라보는 동안 이름표 아래에 붙는 증언
  empty-name: "주주 {seat}번"   # 사람이 모자랄 때의 이름 (꾸밈 태그 없이)
  say: "<gray>{name}<dark_gray>: <#9fb8c7>«{line}»"   # 바라볼 때 채팅 (한 사람당 10초에 한 번)
  table-text: "<#6f8a96>동방해운 제38기 정기 주주총회\n<dark_gray>1987. 11. 29. 선상(船上)\n<gray>안건: 열세 번째 주주의 확정"
  enter: "<#6f8a96>…늦으셨군요. 앉으십시오."
  sit: "<#6f8a96>…열세 번째 자리가 찼습니다. 그런데 정족수가 맞지 않습니다."
  closed-today: "<#6f8a96>…오늘 총회는 끝났습니다."
  # 처음 들어올 때 채팅으로 한 줄씩 (1.5초 간격)
  agenda:
    - "<#9fb8c7>[동방해운] <gray>제38기 정기 주주총회를 속개합니다."
    - "<gray>안건 제1호: <white>열세 번째 주주를 확정한다."
    - "<gray>출석 열둘. 그러나 그날 배에 탔던 사람은 열하나뿐입니다."
    - "<gray>한 사람은 명부에만 이름이 있었고, 배에 오르지 않아 살아남았습니다. 그 미련이 의자 하나를 놓지 않아 정족수가 맞지 않습니다."
    - "<white>배에 타지 않았던 한 사람을 지목하십시오."
    - "<dark_gray>배에 탔던 이는 그날 밤을 겪었으니 거짓을 말하지 않습니다. 타지 않았던 이는 그 밤을 모르니, 그 말은 사실이 아닙니다."
    - "<dark_gray>(주주를 바라보면 말합니다. 지목하려면 그 사람을 우클릭)"
  # 지목 창 (상자 창)
  motion:
    title: "<dark_gray>제38기 정기 주주총회 · 지목"
    agenda-name: "<white>안건 제1호"
    agenda-lore:
      - "<gray>열세 번째 주주를 확정한다"
      - "<gray>배에 타지 않았던 한 사람을 지목하시오"
      - ""
      - "<dark_gray>틀리면 오늘 총회는 끝납니다"
    who-name: "<white>{name}"
    who-lore: ["<#9fb8c7>«{line}»"]
    yes-name: "<white>{name}<gray> 을(를) 지목한다"
    yes-lore: ["<dark_gray>검은 표"]
    no-name: "<gray>다시 생각한다"
    no-lore: ["<dark_gray>창을 닫습니다"]
  named: "<#6f8a96>…{name}."
  not-aboard: "<dark_gray>(승선 명단에 없음)"
  # 맞힌 순간, 연기처럼 사라지며 채팅에 한 줄 ({name} = 그 사람)
  faded: "<#6f8a96>{name}<dark_gray>: <#9fb8c7>«…저는 그날 배에 타지 않았어요. 살아남아서, 평생 이 자리만 생각했지요. 이제 놓을게요.» <dark_gray>— 배에 타지 않아 살아남은 사람의 미련"
  wrong: "<#6f8a96>…그 사람은 배에 있었습니다."
  # 증언 문구 (종류마다 여러 개, 판마다 그중 하나). {a} {b} = 다른 주주 이름. 바꿔도 되지만 뜻은 그대로 둘 것:
  #   aboard: {a} 는 배에 있었다 · aboard-across: 맞은편 사람은 배에 있었다 · aboard-door / aboard-chair: 문 쪽 / 빈 의자 쪽
  #   옆자리 사람은 배에 있었다 · either: {a} 와 {b} 중 한 명은 배에 없었다 · my-row-all / other-row-all: 우리 줄 / 건너편 줄
  #   여섯은 모두 배에 있었다 · my-row-some / other-row-some: 우리 줄 / 건너편 줄의 누군가는 배에 없었다 · self: 나는 배에 있었다
  #   fact-true: 그날 밤에 대한 맞는 기억 (03:33 · 안개 · 남해 · 11월 29일) · fact-false: 틀린 기억 (fact-true 와 맞부딪히게)
  testimony:
    aboard:
      - "{a}, 그 사람은 그날 밤 뱃멀미로 난간만 붙들고 있었어요."
      - "{a} 씨와 갑판에서 담배를 나눠 피웠지요. 마지막 담배였어요."
      - "{a} 씨가 구명조끼를 나눠 주던 게 기억납니다."
      - "{a} 씨는 식당에서 끝까지 장부를 붙들고 있었습니다."
    aboard-across:
      - "제 맞은편 분은 그날 내내 제 앞에 앉아 계셨어요."
      - "맞은편 사람이 물이 차오를 때 제 손을 잡아 줬습니다."
    aboard-door:
      - "문 쪽으로 제 옆자리 분과 같은 선실을 썼어요."
      - "문 쪽 옆자리 사람이 선실 문을 붙잡고 있었지요."
    aboard-chair:
      - "빈 의자 쪽 제 옆자리 분이 마지막까지 노래를 불렀어요."
      - "빈 의자 쪽 옆 사람과 같이 갑판 아래로 내려갔습니다."
    either:
      - "{a}, {b}… 둘 중 하나는 그날 배에서 못 봤어요."
      - "{a} 씨나 {b} 씨, 그중 한 사람은 승선표가 없었지요."
    my-row-all:
      - "우리 줄 여섯은 끝까지 다 배에 있었습니다. 제가 셌어요."
      - "이쪽 줄은 한 명도 빠짐없이 탔어요."
    other-row-all:
      - "건너편 줄 여섯은 모두 배에 있었어요."
      - "저쪽 줄 사람들은 전부 같이 탔습니다. 제가 봤어요."
    my-row-some:
      - "우리 줄에 하나, 배에 없던 사람이 앉아 있어요."
      - "이쪽 줄 누군가는 그날 부두에 남았지요."
    other-row-some:
      - "건너편 줄 누군가는 그 배에 없었어요."
      - "저쪽 줄에 하나, 처음 보는 얼굴이 있습니다."
    self:
      - "저는 출항부터 끝까지 배에 있었습니다."
      - "저는 그 배에서 한 번도 내린 적이 없어요."
    fact-true:
      - "시계가 세 시 삼십삼 분에서 멈췄어요."
      - "안개가 짙어서 뱃머리도 안 보였지요."
      - "남해였어요. 물이 그렇게 차가울 줄은…"
      - "11월 29일, 창립 기념일이었잖아요."
    fact-false:
      - "자정 종이 울릴 때 가라앉았지요. 똑똑히 들었어요."
      - "달이 밝은 밤이었어요. 별도 다 보였고요."
      - "서해였어요. 갯벌 냄새가 났지요."
      - "12월이었어요. 성탄 장식이 걸려 있었는데."
  # 맞음: 지목한 사람이 연기처럼 사라지고, 나머지 열한 명이 하나씩 물이 되어 무너지고 → 이 줄들이 2초 간격으로 → 풀림
  released:
    - "<#9fb8c7>…확정되었습니다. 열세 번째 주주는 당신입니다."
    - "<#9fb8c7>…승선 주주 열하나, 그리고 열세 번째 주주. 정족수가 찼습니다. 동방해운을 해산합니다."
    - "<#9fb8c7>…이제 내립니다. 고맙습니다."
    - "<dark_gray>(의자마다 물이 고여 있다. 이름표가 모두 비었다)"
  certificate:
    name: "<gradient:#9fb8c7:#3d5a6b>마지막 주주 증서"
    lore:
      - "<gray>동방해운 주식회사"
      - "<gray>주주명부 제13번 <white>{player}"
      - ""
      - "<gray>위 사람은 제38기 정기 주주총회에서"
      - "<gray>배에 타지 않았던 한 사람을 가려내고"
      - "<gray>회사의 해산과 주주 11명의 하선을 의결하였음."
      - ""
      - "<dark_gray>청산인 · 마지막 주주"
      - "<#6f8a96><i>모두 무사히 내렸습니다"
  # 틀림: 문이 잠기고 물이 차오름 (약 6초) → 암전 → 회의실은 다음 날까지 닫힘 (테스트: test-retry-minutes). 다음엔 증언이 새로 나옴
  flooded:
    - "<#6f8a96>…부결되었습니다. 회의를 계속합니다."
    - "<dark_gray>(정신을 차리니 아무것도 없다. 옷이 젖어 있다)"
    - "<dark_gray>…다음 날 다시 소집됩니다. 그때는 다른 이야기를 할 겁니다."

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 후속 임무 「청산인의 업무」 (푼 사람 한 명만, 한 주에 한 번 · docs/admin/숨은_비밀/동방해운.md "후속 임무")
# 회사는 해산했고 푼 사람은 청산인. 배에 탔던 주주 열한 명 앞으로 미지급 배당금이 남아 있다.
# 한 주에 한 번 우편함에 "미지급 배당금 명세서" 한 장 (열한 명 중 한 명 것). 명세서에는 주소 대신 유족이 사는 곳의 단서:
# 실제 버스 정류장의 특징 · 정류장 이름의 초성 · 스폰에서의 방향과 거리. 그 정류장 뒤에 청산인에게만 보이는 문이 서 있다.
# 문 앞에서 명세서를 손에 들고 우클릭 → 유족이 몇 마디 → 보상. 열한 주 (사람마다 정해진 순서) 뒤 마지막 편지,
# 그 뒤로는 같은 순서로 "기일 방문" (짧은 말) 이 되풀이됨. 놓친 주는 그냥 지나가고 순서는 밀리지 않음 (끝낸 횟수로 셈).
# 주주 이름 = 그 사람의 총회 의자 열두 개에서 배에 타지 않았던 한 명을 뺀 열한 명 (처음 한 번 정해 저장).
sequel:
  enabled: true
  reward:
    money: [80000, 150000]       # 보통 난이도. 1,000 G 단위로 내림 (테스트 모드에서는 지급 안 함)
  done: "<#6f8a96>…이번 주 청산 업무 1건, 종결. <gray>({reward})"
  after-online: 180              # 그 주에 처음 접속해 이만큼 (초) 지나면 명세서가 옴
  test-after-online: 3
  statement:
    name: "<#b9c4c9>미지급 배당금 명세서"
    name-again: "<#b9c4c9>기일 배당금 명세서"
    arrived: "<gray>우편함에서 젖은 종이 냄새가 난다. <white>/우편함"
    reissue: true                # 명세서 없이 문을 두드리면 (가방에 한 장도 없을 때, 한 주에 한 번) 사본을 줌
    reissued: "<#6f8a96>…문틈으로 종이 한 장이 밀려 나온다. 명세서의 사본이다."
    # 값이 없는 {tag} {initials} {where} {memo} 가 든 줄은 통째로 빠짐. {name} 주주 · {no} 명부 번호 · {relation} 수령인 · {amount} 금액
    lore:
      - "<gray>동방해운 주식회사 <dark_gray>(청산 중)"
      - "<gray>주주 <white>{name}</white> 귀하 <dark_gray>· 명부 {no}"
      - "<gray>제38기 미지급 배당금 <white>{amount}"
      - "<dark_gray>비고: {memo}"
      - ""
      - "<gray>수령인: <white>{relation}"
      - "<#6f8a96>송달지: {tag}의 정류장 뒤편"
      - "<#6f8a96>정류장 이름 「{initials}」"
      - "<#6f8a96>{where}"
      - ""
      - "<dark_gray>주소 불명. 청산인이 직접 전달할 것."
      - "<dark_gray>(문 앞에서 이 종이를 들고 우클릭)"
    lore-again:
      - "<gray>동방해운 주식회사 <dark_gray>(청산 완료)"
      - "<gray>고(故) 주주 <white>{name}</white> <dark_gray>· 명부 {no}"
      - "<gray>기일 배당금 <white>{amount}</white> <dark_gray>({round}회차)"
      - ""
      - "<gray>수령인: <white>{relation}"
      - "<#6f8a96>송달지: {tag}의 정류장 뒤편"
      - "<#6f8a96>정류장 이름 「{initials}」"
      - "<#6f8a96>{where}"
      - ""
      - "<dark_gray>지난번과 같은 문입니다."
  # 단서 문구. tags = 정류장의 특징 (버스 모듈이 주변 지형으로 붙이는 것) 을 이렇게 부름
  clues:
    tags:
      port: "부두"
      sea: "바닷가"
      mountain: "산자락"
      forest: "숲 가"
      village: "마을 안"
      field: "들판"
      none: "길가"
    where: "{world} 첫 자리에서 {dir} {paces}"
    spawn: "마을 어귀, 처음 발 딛는 자리"     # 정류장이 하나도 없을 때 (문은 스폰 근처에)
    copy: "(사본) 처음 받은 곳과 같음"
  door:
    block: "minecraft:spruce_door"
    show-radius: 40              # 그 자리에서 이 칸 안에 오면 문이 생김 (그 사람에게만). 이보다 16칸 더 멀어지면 사라짐
    behind-blocks: 3.5           # 정류장 대합실 뒤로 이만큼 떨어진 땅에
    spawn-blocks: 10             # 정류장이 없을 때: 스폰에서 이만큼
    line-ticks: 70               # 유족의 말 사이 간격 (틱)
    plate: "<gray>{name}"        # 문 위 문패 ({name} = 주주, {relation} 도 쓸 수 있음)
    say: "<gray>{relation}<dark_gray>: <#b9c4c9>«{line}»"
    near: "<#6f8a96>…정류장 뒤에, 아까는 없던 문이 하나 서 있다."
    need: "<#6f8a96>…문은 열리지 않는다. 명세서를 손에 들어야 한다."
    stale: "<#6f8a96>…지난 명세서다. 종이가 손에서 젖어 풀어진다."
  # 열한 번째를 전달한 뒤 우편함으로 오는 마지막 편지 (기념품, 기능 없음)
  final:
    after-seconds: 5
    arrived: "<#6f8a96>…열한 번째 문이 닫혔다. 우편함에 마지막 편지가 와 있다."
    name: "<#b9c4c9>청산 종결 보고"
    lore:
      - "<gray>동방해운 주식회사"
      - "<gray>청산인 <white>{player}</white> 귀하"
      - ""
      - "<gray>미지급 배당금 11건, 전부 전달됨."
      - "<gray>승선 주주 11명, 전원 하선 확인."
      - "<gray>남은 업무 없음. 장부를 덮습니다."
      - ""
      - "<dark_gray>다만 해마다 그날이 오면,"
      - "<dark_gray>문은 한 번씩 더 두드려 주십시오."
      - "<#6f8a96><i>모두 무사히 받았습니다"
  # 유족 열한 집 (순서 = 주주 자리 0~10, 누가 어느 집인지는 사람마다 다름). lines = 첫 방문, again = 기일 방문 (짧게)
  # memo = 명세서의 비고 (총회 증언과 이어지는 한 줄), amount = 명세서에 적히는 금액 (글자일 뿐, 실제 보상은 reward)
  families:
    - relation: "딸"
      amount: "152원"
