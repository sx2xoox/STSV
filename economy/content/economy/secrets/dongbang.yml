# 동방해운 — 숨은 비밀 (운영자 문서: docs/admin/숨은_비밀/동방해운.md · README 에는 적지 않음)
# 1987년, 선상 주주총회를 하던 화물선 「동방호」가 남해에서 사라졌다. 주주 12명은 "실종", 회사는 상장 폐지.
# 남은 1주의 주인 — 열세 번째 주주 — 가 오면 총회는 다시 열린다.
# 시간: "하루" 는 한국 시간 날짜 (자정 = 한국 시간 0시). 테스트 모드 (/관리자 비밀 테스트) 에서는 하루 = common.yml 의
# test-day-seconds (기본 60초), 10분 봉 = 하루의 1/24 (60초면 2.5초). 문구는 모두 MiniMessage.
enabled: true

rewards:
  money: 300000
  title: economy:last_shareholder
  # 마지막 주주 증서 (economy:dongbang_certificate) 는 코드가 이름 · 설명을 붙여서 직접 줌 (아래 certificate). 더 줄 것만 여기에
  items: []

solved-line: "<dark_gray>어느 남쪽 바다에서, 열두 번의 물소리가 차례로 났다. 동방해운이 해산했다."
too-late: "<dark_gray>…회의실은 비어 있다. 의자마다 물만 고여 있다. 누군가 먼저 표를 던졌다."

# 매일 받는 청산 배당 (푼 사람, 한국 시간 하루 한 번, 그날 처음 접속해 있을 때). 테스트로 푼 사람은 안 받음
dividend:
  amount: 5000
  message: "<#9fb8c7>동방해운 청산 배당 <white>{amount}</white> 가 들어왔습니다. <dark_gray>— 주주 일동"

# /주식 목록 맨 아래에 뜨는 줄 (아직 안 산 사람에게만, 하루 한 번)
offer:
  minutes: 1                   # 뜨는 시간 (분). 사람마다, 날마다 다른 시각
  hours: [0, 24]               # 그 시각을 고르는 범위 (한국 시간, [시작, 끝), 끝 < 시작이면 자정을 넘김). 테스트 모드: 늘 뜸
  grace-minutes: 5             # 목록에서 본 뒤 이만큼은 창을 열어 둔 채로 살 수 있음
  icon-name: "<gray>동방해운 <dark_gray>(거래정지)"
  icon-lore:
    - "<dark_gray>해운 · 1987년 상장 폐지"
    - "<dark_gray>마지막 거래가 {price}"
    - ""
    - "<gray>클릭: 자세히"
  left: "<gray>…1주 남았습니다."

share:
  price: 1987                  # 그 1주의 값 (G). 살 때 내는 돈이자 첫 주가
  name: "<gray>동방해운"
  halted-name: "<gray>동방해운 <dark_gray>(거래정지)"
  icon-lore:
    - "<dark_gray>해운 · 1987년 상장 폐지"
    - "<gray>현재가 <white>{price}</white> {change}"
    - "<gray>내 주식 <white>1주</white> <dark_gray>· 평가 손익 {pl}"
    - "{halted}"
    - "<gray>클릭: 자세히"
  bought: "<gray>동방해운 <white>1주</white>를 샀습니다. <dark_gray>({price})"
  bought-whisper: "<#9fb8c7>…어서 오십시오. 열세 번째 분."
  not-enough: "<red>잔액이 부족합니다."
  too-late: "<dark_gray>…목록에서 사라졌다. 다시는 안 보일지도 모른다."
  no-more: "<dark_gray>남은 주식이 없습니다."
  halted: "<dark_gray>거래정지 중에는 팔 수 없습니다."
  sell-confirm: "<gray>…정말 내리시겠습니까? <dark_gray>(5초 안에 한 번 더 누르면 팝니다)"
  sold: "<gray>동방해운 <white>1주</white>를 팔았습니다 → <white>{amount}"
  # 창 (회사 화면) 의 값
  industry: "<#6f8a96>해운"
  risk: "<dark_gray>측정 불가"
  shares: "13"
  dividend-line: "<dark_gray>배당: 주주총회에서 정함"
  fee: "수수료 없음"
  offer-fee: "1주 남았습니다"
  # 회사 화면의 "최근 뉴스" 줄 (단계마다)
  news:
    offer: "<gray>[1987.11.29] 선상 주주총회 중이던 「동방호」, 남해에서 연락 두절. 주주 12명 실종, 거래정지"
    held: "<gray>[1987.12.30] 동방해운 상장 폐지. 1주는 끝내 주인을 찾지 못함"
    notice: "<gray>[공시] 제38기 주주총회 소집. 본사 소재지는 자정의 주가로 갈음함"
    convened: "<gray>[공시] 주주총회 속개. 출석 12 / 재적 13. 정족수까지 1명"
  # 회사 화면 설명 칸에 붙는 자정 종가 기록
  closes-title: "<gray>자정 종가"
  close-line: "<dark_gray>{date} <{color}>{price} {arrow}"

# /주식 뉴스가 그 사람에게만 이상하게 보인다 (그 사람 화면의 사본만 바뀜. 진짜 뉴스 · 주가 · 다른 사람은 그대로).
# 이 news 칸을 통째로 지우면 뉴스는 늘 진짜대로 나옴. 한 줄짜리를 "" 로 비우면 그것만 빠짐.
# 문구는 진짜 뉴스 (news.yml format) 와 같은 모양으로: <gray>[머리말]</gray> <white>회사</white><gray>, 원인… 결과</gray>
news:
  echo-delay-seconds: 3        # 진짜 뉴스가 채팅에 뜬 뒤, 그 사람에게만 가는 한 줄이 이만큼 뒤에 따라옴
  # 1분짜리 줄을 본 동안 (목록에서 본 뒤 offer.grace-minutes 까지): /주식 뉴스 10줄이 통째로 다른 곳에서 온 것처럼
  offer:
    # 맨 위 (= 가장 오래된 뉴스) 에 옛날 형식 헤드라인 하나
    head: "<#8c826d>[1987.11.29] 동방해운, 창립 기념 선상 주주총회 개최… 화물선 「동방호」 출항"
    # 진짜 뉴스 줄마다 앞에 붙는 시각 (진짜 뉴스에는 시각이 없다. 전부 같은 시각)
    stamp: "<#5d6b73>03:33</#5d6b73> "
    # 이만큼의 진짜 줄에서 낱말 하나가 word 로 바뀜 (회사 이름은 안 건드림. "침수로" → "물로", 조사는 맞춰 줌)
    word: "물"
    soaked: 2
    # 이만큼의 진짜 줄에서 변동률이 13.0% 로 읽힘 (화살표 · 색은 그대로)
    thirteen: 1
    # 진짜 줄들 사이 어딘가에 끼는 한 줄 (같은 말이 되풀이되다 끊김)
    fragment: "<#6f8a96>…13번째 주주를 찾습니다… …13번째 주주를 찾습니다… …13번째 주주를"
    # 그 동안 진짜 뉴스가 채팅에 뜨면, 그 사람에게만 한 줄 더 ("[뉴스]" 모양). 한 번의 1분에 한 번까지
    echo: "<#8c826d>[1987.11.29] 동방호, 남해 해역서 교신 두절… 「출석 12, 재적 13. 한 분을 더 기다립니다」"
  # 들고 있는 동안 (1~3단계): /주식 뉴스를 열 때마다 chance 로, 진짜 줄들 사이에 그 단계의 헤드라인 하나 (테스트: 매번).
  # 진짜 뉴스가 채팅에 뜰 때 echo-chance 로 그 사람에게만 한 줄 더 (하루 한 번까지)
  held:
    chance: 0.15
    echo-chance: 0.1
    stage-1:
      - "<gray>[사회]</gray> <white>남해 해역</white><gray>, 정체불명 뱃고동 신고 잇따라… 해경 \"주변에 선박 없음\"</gray>"
      - "<gray>[지역]</gray> <white>남해안 어민들</white><gray>, \"새벽마다 안개 속에서 기적 소리\"… 출어 미뤄</gray>"
    stage-2:
      - "<gray>[정정]</gray> <white>동방해운</white><gray> 주주명부 13명 → 12명 → 13명</gray>"
      - "<gray>[공시]</gray> <white>동방해운</white><gray>, 제38기 정기 주주총회 소집… 장소 \"추후 주가로 공고\"</gray>"
    stage-3:
      - "<gray>[속보]</gray> <white>동방호</white><gray> 수색 재개… 「아직 배에서 내리지 못했다」 교신 녹음 공개</gray>"
      - "<gray>[현장]</gray> <white>동방해운 본사</white><gray> 터에 물웅덩이… \"의자가 하나 비어 있었다\"</gray>"
  # 푼 뒤 처음 /주식 뉴스를 열 때 한 번, 맨 아래 (= 가장 새 뉴스) 에
  solved: "<#9fb8c7>[공시] 동방해운 청산 완료. 주주 전원 하선."
  # 판 뒤 처음 /주식 뉴스를 열 때 한 번, 맨 아래에
  sold: "<gray>[공시]</gray> <white>동방해운</white><gray>, 마지막 주주 매도… 거래 영구 정지</gray>"

# 주가: 들고 있는 사람만 따라 움직인다 (10분 봉 = 그 사람의 10분)
price:
  online: 0.005                # 접속해 있으면 10분마다 이만큼 (로그) 오름
  offline: 0.003               # 나가 있으면 10분마다 이만큼 내림
  noise: 0.004                 # 10분마다 흔들림
  water: 0.05                  # 물가 (반경 2칸 안에 물, 또는 물속) 에 있으면 10분마다 이만큼 크게 출렁임
  min: 100
  max: 20000
  approach-hours: 3            # 열쇠 자정 전 이만큼은 주가가 좌표 값으로 끌려감 (그동안 봉이 한 방향으로 줄지어 감)
  last-candle: 0.04            # 열쇠 자정 직전 마지막 봉의 움직임 (붉으면 +, 푸르면 -)

# 본사 (최종 주주총회) 좌표: 사람마다 정해짐 (UUID), 가운데가 청크 한가운데. 평평한 땅을 고름
headquarters:
  world: ""                    # 비우면 건축(본) 월드
  min: 300                     # |X|, |Z| 범위 (= 두 자정의 주가)
  max: 1500
  tries: 12                    # 평평한 땅을 찾으려 보는 후보 수 (청크를 읽거나 만듦)

# 이틀째 우편함에 오는 통지서 (economy:dongbang_notice)
notice:
  name: "<#b9c4c9>주주총회 소집 통지서"
  date-format: "M월 d일 밤 12시"   # {first}/{second}: 그 자정이 끝내는 날 (한국 시간)
  test-date: "약 {seconds}초 뒤 자정"
  arrived: "<gray>우편함에서 젖은 종이 냄새가 난다. <white>/우편함"
  lore:
    - "<#9fb8c7>동방해운 주식회사"
    - "<gray>제38기 정기 주주총회 소집 통지"
    - ""
    - "<gray>주주 귀하."
    - "<gray>본사 사옥은 사정상 주소를 잃었습니다."
    - "<white>본사 주소는 자정의 주가로 대신합니다."
    - "<gray>동서(東西)는 <white>{first}</white>의 주가로,"
    - "<gray>남북(南北)은 <white>{second}</white>의 주가로."
    - "<gray>마지막 봉이 붉으면 해 뜨는 쪽과 남쪽,"
    - "<gray>푸르면 해 지는 쪽과 북쪽입니다."
    - ""
    - "<gray>의석은 열셋. 한 자리가 비어 있습니다."
    - "<dark_gray>(종이가 젖어 날짜가 번져 있다)"
    - ""
    - "<#6f8a96><i>우리는 아직 배에서 내리지 못했습니다"

# 판 사람: 이만큼 뒤 우편함에 오는 편지 하나. 그 사람은 다시 못 함
sold:
  delay-seconds: 60
  test-delay-seconds: 5
  name: "<#b9c4c9>젖은 편지"
  lore:
    - "<gray>…또 혼자 남았군요."
    - ""
    - "<dark_gray>괜찮습니다. 늘 그랬으니까요."
    - "<dark_gray>— 동방해운 주주 일동 (12명)"

# 들고 있는 동안 (1~3단계): 1분마다 이 확률로 액션바 속삭임 (테스트: 매분). 물가면 water 에서도 고름
haunt:
  whisper-chance: 0.08
  whispers:
    - "<#6f8a96>…13번째 분…"
    - "<#6f8a96>…자리를 비워 두었어요…"
    - "<#6f8a96>…누가 회사를 닫아 줘요…"
    - "<#6f8a96>…아직 회의 중입니다…"
    - "<#6f8a96>…내리고 싶어요…"
    - "<#6f8a96>…지금 몇 년도예요…"
  water:
    - "<#6f8a96>…물이 차가워요…"
    - "<#6f8a96>…여기 바닥이 젖었어요…"
    - "<#6f8a96>…발밑이 흔들려요…"
  midnight: "<#6f8a96>…자정입니다. 주가를 받아 적으십시오…"
  convene: "<#9fb8c7>[동방해운] <gray>정족수 미달로 미뤄진 제38기 주주총회를 속개합니다. <dark_gray>본사로 오십시오."

# 최종 주주총회 (3단계, 본사 좌표 근처)
meeting:
  radius: 16                   # 이 안에 들어오면 그 사람에게만 보이는 회의실이 생김 (48칸 밖으로 나가면 사라짐)
  # 마네킹: 스킨 (null/빈칸 = 기본, "economy:entity/... [slim]"), 머리에 씌우는 블록 (얼굴을 가림), 양복 색
  skin: ""
  head: "minecraft:tinted_glass"
  suit-color: "#1d2026"
  seat-height: 0.6             # 의자 (계단) 블록 위로 앉는 높이 (마네킹 · 플레이어)
  tag: "<gray>{name}"          # 마네킹 위 이름표 (최근 접속한 진짜 플레이어 12명, 모자라면 "—")
  empty-tag: "<dark_gray>—"
  table-text: "<#6f8a96>동방해운 제38기 정기 주주총회\n<dark_gray>1987. 11. 29. 선상(船上)"
  enter: "<#6f8a96>…늦으셨군요. 앉으십시오."
  sit: "<#6f8a96>…정족수가 찼습니다."
  vote-again: "<#6f8a96>…투표가 끝나지 않았습니다."
  closed-today: "<#6f8a96>…오늘 총회는 끝났습니다."
  ballot:
    title: "<dark_gray>제38기 정기 주주총회"
    agenda-name: "<white>안건 제1호"
    agenda-lore:
      - "<gray>회사를 해산하고"
      - "<gray>주주를 놓아준다"
      - ""
      - "<dark_gray>재적 13 · 출석 13"
      - "<dark_gray>찬성 6 · 반대 6"
      - "<dark_gray>마지막 한 표"
    yes-name: "<white>찬성"
    yes-lore: ["<dark_gray>흰 표"]
    no-name: "<white>반대"
    no-lore: ["<dark_gray>검은 표"]
  # 찬성: 마네킹이 하나씩 물이 되어 무너지고 → 이 줄들이 2초 간격으로 → 풀림
  yes:
    - "<#9fb8c7>…가결되었습니다."
    - "<#9fb8c7>…이제 내립니다. 고맙습니다."
    - "<dark_gray>(의자마다 물이 고여 있다. 이름표가 모두 비었다)"
  certificate:
    name: "<gradient:#9fb8c7:#3d5a6b>마지막 주주 증서"
    lore:
      - "<gray>동방해운 주식회사"
      - "<gray>주주명부 제13번 <white>{player}"
      - ""
      - "<gray>위 사람은 제38기 정기 주주총회에서"
      - "<gray>회사의 해산과 주주 12명의 하선을 의결하였음."
      - ""
      - "<dark_gray>매일 청산 배당 {dividend}"
      - "<#6f8a96><i>모두 무사히 내렸습니다"
  # 반대: 문이 잠기고 물이 차오름 (약 6초) → 암전 → 그날은 끝 (다음 자정 뒤 다시)
  no:
    - "<#6f8a96>…부결되었습니다. 회의를 계속합니다."
    - "<dark_gray>(정신을 차리니 아무것도 없다. 옷이 젖어 있다)"
    - "<dark_gray>…다음 자정이 지나면 다시 소집됩니다."
