# 숨은 비밀: 눈 없는 물고기 (운영자 문서: docs/admin/숨은_비밀/눈_없는_물고기.md · README 에는 적지 않음)
# 오래전 서버의 첫 낚시꾼이 깊은 물에 빠졌고, 몸은 끝내 올라오지 않았다. 그 뒤로 그 물에서 눈 없는 물고기가 낚인다.
# 물고기는 자기가 누구였는지 기억하려 한다. 일곱 물은 첫 낚시꾼이 마지막으로 기억하는 물들. 놓아줄 때마다 기억 한 조각
# (= 다음 물의 수수께끼), 그 물에서 다시 낚이면 조금 더 사람에 가깝다. 일곱 번째 물 "내가 빠진 곳" 에서 올라오는 것은
# 물고기가 아니라 내 이름이 적힌 젖은 이름표 — 그것이 기억해 낸 이름은 "다음에 빠질 사람" 의 이름이었다.
# 끝: 이름표를 물에 돌려주면, 내 이름 대신 첫 낚시꾼의 이름이 잠깐 물 위로 떠올랐다가 가라앉는다 (그가 이름을 되찾았다).
enabled: true

# 시작: 비가 오는 동안 (시간 조건 없음), 입질 뒤 perfect-ticks 안에 낚아 올린 "완벽한" 낚시 한 번마다 이 확률로
# 잡힌 것이 눈 없는 물고기로 바뀜. 한국 날짜로 하루 한 번까지. 낚시는 하루 수백 번이라 아주 낮게.
# 테스트 모드: 확률 100%, 비 필요 없음 (완벽한 타이밍은 그대로 필요 — 아니면 관리자 '시작')
start:
  chance: 0.0005
  perfect-ticks: 8          # 찌가 잠긴 순간(입질)부터 이 틱(20 = 1초) 안에 당겨야 "완벽"
  need-rain: true
  title: "<#9fb8c7>???"
  subtitle: "<dark_gray>눈이 있어야 할 자리가 매끈하다"

# 들고 있으면 (주 손 · 다른 손) 이 초마다 아주 작게
hold-whisper: "<dark_gray><i>…돌려보내 줘…"
hold-every: 9
# 남의 것을 들고 있으면
not-yours: "<dark_gray><i>…너 아니야."
# /도감 에서 눌렀을 때 (원래 "도감에 없는 물건입니다" 대신)
codex-line: "<gray>??? · 등록할 수 없음"

# 물고기 아이템. stages[n-1] = n단계에 들고 있는 물고기 (이름, 생김새). 아래에 지금까지 들은 기억이 쌓임
item:
  memory-color: "<#8fa9b8><i>"
  bound-line: "<dark_gray>{player} 에게서 떨어지지 않는다"
  stages:
    - name: "<#9fb8c7>눈 없는 물고기"
      lore: ["<gray>눈이 있어야 할 자리가 매끈하다.", "<gray>차갑다. 손 안에서 아주 천천히 숨을 쉰다."]
    - name: "<#9fb8c7>눈 없는 물고ㄱ"
      lore: ["<gray>비늘이 몇 장 빠져 있다. 그 아래가 희고 매끄럽다."]
    - name: "<#a7b8c2>눈 없는 ○○"
      lore: ["<gray>지느러미 끝이 다섯 갈래로 갈라져 있다."]
    - name: "<#aeb6bb>눈 없는 것"
      lore: ["<gray>비늘이 거의 없다. 누르면 사람 살갗처럼 물렁하다."]
    - name: "<#b5b3b0>눈 없는 아이"
      lore: ["<gray>입이 달싹인다. 소리는 나지 않는다."]
    - name: "<#bcb0a6>눈 없는 사람"
      lore: ["<gray>눈 자리에 눈꺼풀이 생겼다. 감겨 있다."]
    - name: "<#c4ab9b>물에 빠진 사람"
      lore: ["<gray>눈꺼풀이 가늘게 떨린다. 누군가를 보려는 것처럼."]

# 일곱 물. 놓아줄 때 (n번째로) memory n 을 말하고, 물고기는 water n 에서 다시 낚임.
# habitats = 낚시 도감의 서식지 (FishSpec.habitat: sea deep warm cold mangrove mushroom swamp jungle coldriver river cave)
# 첫 글자를 이으면 "처음 온 곳 깊은 물" (= 모두가 처음 이 세계에 온 곳, 스폰 가까이 가장 깊은 물: 마지막 물)
waters:
  - id: sea
    name: 바다
    habitats: [sea, deep, warm, cold, mangrove, mushroom]
    memory: "처음 짠물을 마신 날… 끝이 보이지 않는 물이었어."
  - id: frozen
    name: 얼어붙은 물
    habitats: [cold, coldriver]
    memory: "음… 얼음 밑은 조용했어. 하얀 땅을 지나던 차가운 물."
  - id: cave
    name: 땅 밑의 물
    habitats: [cave]
    memory: "온통 깜깜했어. 해가 들지 않는 곳, 땅 밑에 고인 물."
  - id: swamp
    name: 뿌리 내린 늪
    habitats: [mangrove, swamp]
    memory: "곳곳에 뿌리가 물속까지 내려와 있었어. 나무가 물에 서 있던 늪."
  - id: mushroom
    name: 버섯 섬
    habitats: [mushroom]
    memory: "깊은 바다 한가운데, 버섯이 자라는 섬이 있었어."
  - id: warm
    name: 산호 바다
    habitats: [warm]
    memory: "은은한 빛깔의 돌이 자라는 따뜻한 바다… 거기서 마지막으로 헤엄쳤어."
  - id: drowned
    name: 내가 빠진 곳
    memory: "물 밑에서 올려다본 하늘이 기억나. 모두가 처음 이 세계에 온 곳, 그 가까이 가장 깊은 물. 내가 빠진 곳."

# 놓아줄 때: 물이 받아 가는 소리 뒤에 기억이 채팅으로 (그 사람에게만), 마지막 기억 뒤에는 한 줄 더
release:
  memory-format: "<#8fa9b8><i>…{memory}"
  after-last: "<dark_gray><i>…거기서 줄을 던져 줘."
  # 놓아줄 수 없는 물고기 (이미 놓아준 것, 지난 것)
  stale: "<dark_gray><i>…이건 껍데기야."

# 다시 낚였을 때 (water n 에서, 아무 타이밍)
returned:
  title: "{name}"
  subtitle: "<dark_gray>또 너구나"

# 버림 (땅에 떨어뜨린 채 land-seconds, 타 버림, 사라짐, /쓰레기통): 그 사람에게만 물이 차오르고, 영영 실패
lose:
  land-seconds: 15
  land-whisper: "<dark_gray><i>…말라 가…"
  line: "<#5f7f8f><i>…너도 버렸구나."

# 마지막 물: "내가 빠진 곳" = 서버에 첫 낚시 위치 기록이 없어서, 월드 스폰에서 search-radius 안의 가장 깊은 물
# (처음 한 번 계산해서 eco.kv secret.fish.drowned 에 저장). place 를 "월드 x y z" 로 쓰면 그곳 (계산보다 우선)
final:
  place: ""
  search-radius: 300
  radius: 20               # 그 물기둥에서 이 칸 안 (가로) 에서 낚으면
  close: 64                # 이 안에서 낚으면 "…가까워"
  near: 300                # 이 안에서 낚으면 "…더 깊은 곳" (마지막 단계에서만)
  shortcut-from: 4         # 이 단계 이상에서 (놓아준 뒤) 바로 그곳에서 낚아도 끝으로 (첫 글자를 읽은 사람)
  dry-seconds: 60          # 이름표를 물에 주지 않고 가지고 있으면 이만큼 뒤 마름 → 오늘은 실패
  tag-name: "<#7fa0b0>젖은 이름표"
  tag-lore:
    - "<white>{player}"
    - "<gray>물이 뚝뚝 떨어진다. 글씨가 번지지 않았다."
    - "<dark_gray>…아직 젖어 있다."
  # 낚시줄 끝에 이름표가 걸려 올라온 뒤 (초, 귓속말)
  rise:
    - [2, "<#8fa9b8><i>…이제 기억났어."]
    - [5, "<#8fa9b8><i>…그건 내 이름이 아니었어."]
    - [8, "<#8fa9b8><i>…다음에 빠질 사람의 이름이야."]
    - [11, "<#5f7f8f><i>…{player}."]
  drying: "<dark_gray><i>…마르고 있어."
  dry: "<#5f7f8f><i>…다음엔 네 차례야."
  # 오늘 이미 말라 버렸으면 (그곳에서 낚아도)
  dried-today: "<dark_gray><i>…오늘은 물이 조용하다."
  # 첫 낚시꾼의 이름: 낚시 기록(도감의 낚은 기록)에서 가장 먼저 낚은 사람. 기록이 없으면 이것
  first-fisher: "이름 모를 낚시꾼"
  # 이름표를 물에 준 뒤 surface-delay 초에 그 자리 물 위로 떠올랐다가 가라앉는 글 ({first}; 그 사람에게만)
  surface-name: "<#c4ab9b>{first}"
  surface-delay: 2
  # 이름을 물에 줬을 때 (풀림) — {first} = 첫 낚시꾼의 이름
  given:
    - [0, "<#8fa9b8><i>…받았어."]
    - [3, "<#8fa9b8><i>…아. 이거였어."]
    - [5, "<#c4ab9b><i>…{first}. 내 이름."]
    - [8, "<#8fa9b8><i>…이제 아무도, 다시는."]
  # 낚을 때 거리 귓속말 (close · near)
  near-close: "<#8fa9b8><i>…가까워. 더 깊은 쪽으로."
  near-far: "<dark_gray><i>…여기보다 깊었어. 모두가 처음 온 곳 가까이."
  away: "<dark_gray><i>…여긴 너무 얕아."

# 놓아줄수록 하나씩 더 (그 사람에게만): 1 거품 · 2 무거운 줄 · 3 젖은 발자국 · 4 물속의 형체 · 5 이름 부르기
# 새로 생긴 것은 놓아주자마자 한 번, 그 뒤로는 낚시를 던질 때 · 입질 때 이 확률로 (cooldown 초에 한 번까지)
dread:
  cooldown: 90
  bubbles: 0.25            # 던질 때
  heavy: 0.15              # 입질 때 (찾는 물이 아닐 때만): 줄이 갑자기 무거워졌다가 끊어짐
  footprints: 0.004        # 매초, 걷는 중 (비가 오거나, 젖어 있을 때)
  figure: 0.10             # 던질 때, 18~34칸 떨어진 물에 허리까지 잠긴 형체 (12칸 안으로 가면 사라짐)
  name: 0.10               # 던질 때, 등 뒤에서 내 이름
  figure-seconds: 40
  figure-vanish: 12
  heavy-line: "<dark_gray><i>…"
  name-line: "<#5f7f8f><i>…{player}…"

# 푼 사람: 젖은 낚싯줄 (찌가 물에 닿을 때마다 검은 물결)
wet-line: true

# 풀린 뒤 /도감 낚시 탭 맨 뒤에 모두에게 보이는 한 칸 (수집 수에 들지 않음). {player} = 푼 사람, {first} = 첫 낚시꾼
codex:
  name: "<#c4ab9b>눈 없는 물고기 <dark_gray>— <gray>이름을 돌려준 자 <white>{player}"
  lore:
    - "<gray>일곱 물을 거슬러 이름 하나를 돌려주었다."
    - "<dark_gray>물 위로 잠깐 떠올랐던 이름: <#c4ab9b>{first}"
    - "<dark_gray>도감에 등록할 수 없음"

too-late: "<dark_gray>…물은 잔잔하다. 누군가 먼저 이름을 주었다."
solved-line: "<dark_gray>어딘가의 깊은 물이 이름을 얻었다…"

# 푼 사람 (서버에서 처음 한 명). 돈 대신 하나뿐인 것: 칭호, 젖은 낚싯줄, 도감의 한 칸
rewards:
  money: 0
  title: economy:water_name

# ------------------------------------------------------------------------------------------------
# 후속 임무 「물이 부르는 날」 (어려움) — 이름을 돌려준 한 사람에게만, 일주일(월요일 0시 기준)에 한 번.
# 비 오는 날 (비가 없는 주는 dry-from-day 요일부터 비 없이도) 그 사람이 낚싯대를 던지면, 찌가 조용히 한쪽으로 끌려간다:
# 조금 떨어진 곳의 물 (서 있을 마른 물가가 있는 진짜 연못 · 호수 · 바다. 폭포나 흐르는 물은 아님) 이 부르는 것.
# 좌표는 알려 주지 않는다. 던질 때마다 찌가 그쪽으로 끌리고, 멀다 / 가까워졌다 / 바로 근처다 한 줄뿐.
# 그 물에 찌를 띄우면 "…여기야." → window 초 안에, 입질 뒤 perfect-ticks 틱 안에 당긴 "깨끗한" 낚시를 연달아 need 번.
# (낚시 모듈에는 손댈 타이밍 미니게임이 없어서, 어려움은 이 연속 낚시와 제한 시간으로 만든다. 늦게 당기면 처음부터)
# 마지막 한 번에 물고기 대신 "이름을 잃은 것" 이 올라온다 (주마다 다른 것). 물에 던지거나 든 채 물을 우클릭해 돌려보내면
# 그것이 기억하던 한 줄 → 보상, 그리고 그 주가 끝날 때까지 희귀 입질 확률이 조금 오른다 (perk).
# 시간이 다 되면 그것은 가라앉는다 (실패, 잃는 것 없음. 다음 주에 다시). 운영자 문서: docs/admin/숨은_비밀/눈_없는_물고기.md "후속 임무"
sequel:
  enabled: true
  # 보상 (어려움: 150,000 ~ 300,000 G). 테스트 모드는 돈을 주지 않고 금액만 보여 줌
  reward:
    money: [150000, 300000]
  # 조건이 맞는 날 낚싯대를 던질 때마다 부를 확률 (1 = 그 주의 첫 던지기에 바로). 테스트 모드 = 100%, 비 필요 없음
  chance: 1.0
  # 비가 없어도 부르기 시작하는 요일 (1 = 월 … 7 = 일; 5 = 금요일부터는 맑아도. 8 이상 = 비 오는 날에만)
  dry-from-day: 5
  # 부르는 물 찾기: 던진 사람에게서 min ~ max 칸 떨어진 곳을 directions 방향으로 step 칸씩 살핌 (이미 만들어진 청크만, 새로 만들지 않음).
  # 못 찾으면 retry 초 뒤 다시 (그동안 그 주는 쓰이지 않음). 관리자 '시작' 은 못 찾으면 "내가 빠진 곳", 그것도 없으면 발밑의 물
  search:
    min: 120
    max: 360
    step: 24
    directions: 12
    retry: 300
  # 찌가 그 물에서 radius 칸 안이면 "여기". close · near 칸 안이면 "바로 근처" · "가까워졌다", 그 밖은 "멀다"
  radius: 12
  close: 48
  near: 160
  # 찌가 끌리는 세기 (틱당 속도) 와 횟수 (4틱마다 한 번)
  pull:
    strength: 0.07
    times: 10
  # 그 물에서: 입질 뒤 perfect-ticks 틱 (20 = 1초) 안에 당긴 낚시를 연달아 need 번, window 초 안에 (테스트 모드: test-window)
  need: 3
  perfect-ticks: 10
  window: 420
  test-window: 180
  # 이름을 잃은 것을 이만큼(초) 지니지 않으면 (상자에 넣는 등) 손으로 돌아옴. 땅에 떨어뜨린 것은 그대로 (주인만 주움)
  return-after: 30
  test-return-after: 10
  # 들고 있을 때 이 초마다 작게 hold
  hold-every: 12
  # 최근 이만큼의 주에 나온 것은 다시 나오지 않음
  no-repeat: 4
  # 그 주의 덤: 돌려보낸 주가 끝날 때까지, 그 사람이 낚을 때마다 이 확률로 그 입질이 희귀 등급이 된다 (낚시 모듈의 공개 기능만 씀).
  # enabled: false 면 덤 없음. 테스트 모드는 test-rare-chance
  perk:
    enabled: true
    rare-chance: 0.03
    test-rare-chance: 0.5
    line: "<dark_gray>이번 주에는, 물이 당신의 줄을 조금 더 알아본다."
    bite: "<dark_gray><i>…물이 하나 올려 보낸다."

  # 부를 때 (채팅 한 줄, 주마다 하나)
  call:
    - "<dark_gray><i>…찌가 당겨진다. 물고기가 아니다. 물이 부른다."
    - "<dark_gray><i>…줄이 한쪽으로 기운다. 저쪽 어딘가의 물이 당신을 안다."
    - "<dark_gray><i>…비 냄새 사이로 다른 물 냄새가 난다. 찌가 그쪽을 본다."
  # 던질 때마다, 얼마나 먼지 (화면 아래 작은 글씨)
  where:
    far: "<dark_gray><i>…멀다. 찌가 끌리는 쪽으로."
    near: "<dark_gray><i>…가까워졌다. 찌가 끌리는 쪽으로."
    close: "<dark_gray><i>…바로 근처다. 물소리가 다르다."
    elsewhere: "<dark_gray><i>…이 세계의 물이 아니다."
  here: "<#8fa9b8><i>…여기야. 세 번. 늦지 않게, 연달아 올려 줘."
  here-how: "<dark_gray>찌가 잠기는 순간 바로 당긴다. 연달아 {need}번, {minutes}분 안에."
  here-again: "<dark_gray><i>…여기야."
  # 깨끗하게 올릴 때마다 (1번째, 2번째 …; 마지막은 그것이 올라옴)
  count:
    - "<#8fa9b8><i>…하나."
    - "<#8fa9b8><i>…둘. 한 번만 더."
  slip: "<dark_gray><i>…늦었어. 처음부터."
  hurry: "<dark_gray><i>…물이 식어 간다. 얼마 남지 않았다."
  # 올라왔을 때 (제목은 그것의 이름)
  rise-subtitle: "<dark_gray>이름이 있어야 할 자리가 비어 있다"
  rise: "<dark_gray>…물고기가 아니다. 물로 돌려보내 달라는 것 같다. <gray>(물에 던지거나, 든 채 물을 우클릭)"
  hold: "<dark_gray><i>…이름이 없어. 물로 돌려보내 줘."
  back: "<dark_gray><i>…손이 젖어 있다. 그것이 다시 쥐여 있다."
  # 돌려보냈을 때 그것이 기억하던 한 줄 ({memory} = things 의 memory)
  memory-format: "<#8fa9b8><i>{memory}"
  done: "<dark_gray>…그것은 이름 없이 가라앉았다. 아까보다 가벼워 보였다. <gray>({reward})"
  # 실패: 시간이 다 됨
  sunk: "<dark_gray>…그것은 올라오다 말고 다시 가라앉았다. 다음 비에 또 부를 것이다."

  item:
    # 그것마다의 설명 (things.lore) 아래에 붙는 줄
    lore:
      - "<dark_gray>이름이 없다. 물로 돌려보내야 한다."

  # 이름을 잃은 것들 (주마다 하나, 최근 no-repeat 주와 겹치지 않게). 아이콘은 눈 없는 물고기. memory = 돌려보낼 때 말하는 한 줄
  things:
    - id: ring
      name: "<#9fb8c7>이름을 잃은 것"
      lore: ["<gray>지느러미 하나에 녹슨 반지가 끼워져 있다."]
      memory: "…반지를 끼워 준 사람이 있었어. 얼굴은 물에 풀렸는데, 손이 따뜻했던 건 남아 있어."
    - id: hooks
      name: "<#a7b8c2>이름을 잃은 것"
      lore: ["<gray>입가에 오래된 낚싯바늘이 세 개 박혀 있다."]
      memory: "…세 번 잡혔고, 세 번 놓여났어. 놓아준 건 매번 같은 사람이었어. 너처럼."
    - id: bell
      name: "<#aeb6bb>이름을 잃은 것"
      lore: ["<gray>흔들면 안에서 작은 방울 소리가 난다."]
      memory: "…저녁마다 누가 방울을 흔들어 나를 불렀어. 밥 먹으라고. 이름은 잊었는데 그 소리는 남았어."
    - id: thread
      name: "<#b5b3b0>이름을 잃은 것"
      lore: ["<gray>꼬리에 붉은 실이 묶여 있다. 끝은 끊어져 있다."]
      memory: "…실 저쪽 끝에 누가 있었어. 당기면 당겨 왔지. 어느 날부터 아무도 당기지 않았어."
    - id: moss
      name: "<#9db3a4>이름을 잃은 것"
      lore: ["<gray>등에 이끼가 자랐다. 아주 오래 가만히 있었던 것 같다."]
      memory: "…기다리고 있었어. 누구를 기다렸는지 잊을 만큼 오래. 기다렸다는 것만 남았어."
    - id: scar
      name: "<#bcb0a6>이름을 잃은 것"
      lore: ["<gray>옆구리에 글자 같은 흉터가 있다. 읽으려 하면 흐려진다."]
      memory: "…잊지 않으려고 이름을 몸에 새겨 뒀었어. 물은 그것부터 지우더라."
    - id: lamp
      name: "<#c4c0a0>이름을 잃은 것"
      lore: ["<gray>속이 비쳐 보인다. 안에서 작은 불빛 같은 것이 깜빡인다."]
      memory: "…등불을 들고 물가에 나갔었어. 누가 돌아오는지 보려고. 불은 아직 안 꺼졌어."
    - id: small
      name: "<#a9bccb>이름을 잃은 것"
      lore: ["<gray>손바닥보다 작다. 손가락을 대면 가만히 기댄다."]
      memory: "…누가 내 손을 잡고 물가를 걸었어. 손이 아주 컸어. 내가 작았던 거겠지."
    - id: twin
      name: "<#8f9fb0>이름을 잃은 것"
      lore: ["<gray>물에 비친 그림자가 둘이다."]
      memory: "…둘이서 왔었어. 하나는 돌아갔어. 내가 남은 쪽인지 돌아간 쪽인지는 모르겠어."
    - id: song
      name: "<#b0a8c0>이름을 잃은 것"
      lore: ["<gray>귀를 대면 아주 작게, 가락 없는 콧노래가 들린다."]
      memory: "…노래를 하나 알았어. 가사는 다 물에 줬고 가락만 남았어. 누가 불러 주던 건지도, 이제는."
