# 숨은 비밀: 눈 없는 물고기 (운영자 문서: docs/admin/숨은_비밀/눈_없는_물고기.md · README 에는 적지 않음)
# 오래전 서버의 첫 낚시꾼이 깊은 물에 빠졌고, 몸은 끝내 올라오지 않았다. 그 뒤로 그 물에서 눈 없는 물고기가 낚인다.
# 물고기는 자기가 누구였는지 기억하려 한다. 일곱 물은 첫 낚시꾼이 마지막으로 기억하는 물들. 놓아줄 때마다 기억 한 조각
# (= 다음 물의 수수께끼), 그 물에서 다시 낚이면 조금 더 사람에 가깝다. 일곱 번째 물 "내가 빠진 곳" 에서 올라오는 것은
# 물고기가 아니라 내 이름이 적힌 젖은 이름표 — 그것이 기억해 낸 이름은 "다음에 빠질 사람" 의 이름이었다.
# 끝: 이름표를 물에 돌려주면, 내 이름 대신 첫 낚시꾼의 이름이 잠깐 물 위로 떠올랐다가 가라앉는다 (그가 이름을 되찾았다).
enabled: true

# 시작: 비가 오는 동안 (시간 조건 없음), 입질 뒤 perfect-ticks 안에 낚아 올린 "완벽한" 낚시 한 번마다 이 확률로
# 잡힌 것이 눈 없는 물고기로 바뀜. 한국 날짜로 하루 한 번까지. 낚시는 하루 수백 번이라 아주 낮게.
# 테스트 모드: 확률 100%, 비 필요 없음 (완벽한 타이밍은 그대로 필요 — 아니면 관리자 '시작')
start:
  chance: 0.0005
  perfect-ticks: 8          # 찌가 잠긴 순간(입질)부터 이 틱(20 = 1초) 안에 당겨야 "완벽"
  need-rain: true
  title: "<#9fb8c7>???"
  subtitle: "<dark_gray>눈이 있어야 할 자리가 매끈하다"

# 들고 있으면 (주 손 · 다른 손) 이 초마다 아주 작게
hold-whisper: "<dark_gray><i>…돌려보내 줘…"
hold-every: 9
# 남의 것을 들고 있으면
not-yours: "<dark_gray><i>…너 아니야."
# /도감 에서 눌렀을 때 (원래 "도감에 없는 물건입니다" 대신)
codex-line: "<gray>??? · 등록할 수 없음"

# 물고기 아이템. stages[n-1] = n단계에 들고 있는 물고기 (이름, 생김새). 아래에 지금까지 들은 기억이 쌓임
item:
  memory-color: "<#8fa9b8><i>"
  bound-line: "<dark_gray>{player} 에게서 떨어지지 않는다"
  stages:
    - name: "<#9fb8c7>눈 없는 물고기"
      lore: ["<gray>눈이 있어야 할 자리가 매끈하다.", "<gray>차갑다. 손 안에서 아주 천천히 숨을 쉰다."]
    - name: "<#9fb8c7>눈 없는 물고ㄱ"
      lore: ["<gray>비늘이 몇 장 빠져 있다. 그 아래가 희고 매끄럽다."]
    - name: "<#a7b8c2>눈 없는 ○○"
      lore: ["<gray>지느러미 끝이 다섯 갈래로 갈라져 있다."]
    - name: "<#aeb6bb>눈 없는 것"
      lore: ["<gray>비늘이 거의 없다. 누르면 사람 살갗처럼 물렁하다."]
    - name: "<#b5b3b0>눈 없는 아이"
      lore: ["<gray>입이 달싹인다. 소리는 나지 않는다."]
    - name: "<#bcb0a6>눈 없는 사람"
      lore: ["<gray>눈 자리에 눈꺼풀이 생겼다. 감겨 있다."]
    - name: "<#c4ab9b>물에 빠진 사람"
      lore: ["<gray>눈꺼풀이 가늘게 떨린다. 누군가를 보려는 것처럼."]

# 일곱 물. 놓아줄 때 (n번째로) memory n 을 말하고, 물고기는 water n 에서 다시 낚임.
# habitats = 낚시 도감의 서식지 (FishSpec.habitat: sea deep warm cold mangrove mushroom swamp jungle coldriver river cave)
# 첫 글자를 이으면 "처음 온 곳 깊은 물" (= 모두가 처음 이 세계에 온 곳, 스폰 가까이 가장 깊은 물: 마지막 물)
waters:
  - id: sea
    name: 바다
    habitats: [sea, deep, warm, cold, mangrove, mushroom]
    memory: "처음 짠물을 마신 날… 끝이 보이지 않는 물이었어."
  - id: frozen
    name: 얼어붙은 물
    habitats: [cold, coldriver]
    memory: "음… 얼음 밑은 조용했어. 하얀 땅을 지나던 차가운 물."
  - id: cave
    name: 땅 밑의 물
    habitats: [cave]
    memory: "온통 깜깜했어. 해가 들지 않는 곳, 땅 밑에 고인 물."
  - id: swamp
    name: 뿌리 내린 늪
    habitats: [mangrove, swamp]
    memory: "곳곳에 뿌리가 물속까지 내려와 있었어. 나무가 물에 서 있던 늪."
  - id: mushroom
    name: 버섯 섬
    habitats: [mushroom]
    memory: "깊은 바다 한가운데, 버섯이 자라는 섬이 있었어."
  - id: warm
    name: 산호 바다
    habitats: [warm]
    memory: "은은한 빛깔의 돌이 자라는 따뜻한 바다… 거기서 마지막으로 헤엄쳤어."
  - id: drowned
    name: 내가 빠진 곳
    memory: "물 밑에서 올려다본 하늘이 기억나. 모두가 처음 이 세계에 온 곳, 그 가까이 가장 깊은 물. 내가 빠진 곳."

# 놓아줄 때: 물이 받아 가는 소리 뒤에 기억이 채팅으로 (그 사람에게만), 마지막 기억 뒤에는 한 줄 더
release:
  memory-format: "<#8fa9b8><i>…{memory}"
  after-last: "<dark_gray><i>…거기서 줄을 던져 줘."
  # 놓아줄 수 없는 물고기 (이미 놓아준 것, 지난 것)
  stale: "<dark_gray><i>…이건 껍데기야."

# 다시 낚였을 때 (water n 에서, 아무 타이밍)
returned:
  title: "{name}"
  subtitle: "<dark_gray>또 너구나"

# 버림 (땅에 떨어뜨린 채 land-seconds, 타 버림, 사라짐, /쓰레기통): 그 사람에게만 물이 차오르고, 영영 실패
lose:
  land-seconds: 15
  land-whisper: "<dark_gray><i>…말라 가…"
  line: "<#5f7f8f><i>…너도 버렸구나."

# 마지막 물: "내가 빠진 곳" = 서버에 첫 낚시 위치 기록이 없어서, 월드 스폰에서 search-radius 안의 가장 깊은 물
# (처음 한 번 계산해서 eco.kv secret.fish.drowned 에 저장). place 를 "월드 x y z" 로 쓰면 그곳 (계산보다 우선)
final:
  place: ""
  search-radius: 300
  radius: 20               # 그 물기둥에서 이 칸 안 (가로) 에서 낚으면
  close: 64                # 이 안에서 낚으면 "…가까워"
  near: 300                # 이 안에서 낚으면 "…더 깊은 곳" (마지막 단계에서만)
  shortcut-from: 4         # 이 단계 이상에서 (놓아준 뒤) 바로 그곳에서 낚아도 끝으로 (첫 글자를 읽은 사람)
  dry-seconds: 60          # 이름표를 물에 주지 않고 가지고 있으면 이만큼 뒤 마름 → 오늘은 실패
  tag-name: "<#7fa0b0>젖은 이름표"
  tag-lore:
    - "<white>{player}"
    - "<gray>물이 뚝뚝 떨어진다. 글씨가 번지지 않았다."
    - "<dark_gray>…아직 젖어 있다."
  # 낚시줄 끝에 이름표가 걸려 올라온 뒤 (초, 귓속말)
  rise:
    - [2, "<#8fa9b8><i>…이제 기억났어."]
    - [5, "<#8fa9b8><i>…그건 내 이름이 아니었어."]
    - [8, "<#8fa9b8><i>…다음에 빠질 사람의 이름이야."]
    - [11, "<#5f7f8f><i>…{player}."]
  drying: "<dark_gray><i>…마르고 있어."
  dry: "<#5f7f8f><i>…다음엔 네 차례야."
  # 오늘 이미 말라 버렸으면 (그곳에서 낚아도)
  dried-today: "<dark_gray><i>…오늘은 물이 조용하다."
  # 첫 낚시꾼의 이름: 낚시 기록(도감의 낚은 기록)에서 가장 먼저 낚은 사람. 기록이 없으면 이것
  first-fisher: "이름 모를 낚시꾼"
  # 이름표를 물에 준 뒤 surface-delay 초에 그 자리 물 위로 떠올랐다가 가라앉는 글 ({first}; 그 사람에게만)
  surface-name: "<#c4ab9b>{first}"
  surface-delay: 2
  # 이름을 물에 줬을 때 (풀림) — {first} = 첫 낚시꾼의 이름
  given:
    - [0, "<#8fa9b8><i>…받았어."]
    - [3, "<#8fa9b8><i>…아. 이거였어."]
    - [5, "<#c4ab9b><i>…{first}. 내 이름."]
    - [8, "<#8fa9b8><i>…이제 아무도, 다시는."]
  # 낚을 때 거리 귓속말 (close · near)
  near-close: "<#8fa9b8><i>…가까워. 더 깊은 쪽으로."
  near-far: "<dark_gray><i>…여기보다 깊었어. 모두가 처음 온 곳 가까이."
  away: "<dark_gray><i>…여긴 너무 얕아."

# 놓아줄수록 하나씩 더 (그 사람에게만): 1 거품 · 2 무거운 줄 · 3 젖은 발자국 · 4 물속의 형체 · 5 이름 부르기
# 새로 생긴 것은 놓아주자마자 한 번, 그 뒤로는 낚시를 던질 때 · 입질 때 이 확률로 (cooldown 초에 한 번까지)
dread:
  cooldown: 90
  bubbles: 0.25            # 던질 때
  heavy: 0.15              # 입질 때 (찾는 물이 아닐 때만): 줄이 갑자기 무거워졌다가 끊어짐
  footprints: 0.004        # 매초, 걷는 중 (비가 오거나, 젖어 있을 때)
  figure: 0.10             # 던질 때, 18~34칸 떨어진 물에 허리까지 잠긴 형체 (12칸 안으로 가면 사라짐)
  name: 0.10               # 던질 때, 등 뒤에서 내 이름
  figure-seconds: 40
  figure-vanish: 12
  heavy-line: "<dark_gray><i>…"
  name-line: "<#5f7f8f><i>…{player}…"

# 푼 사람: 젖은 낚싯줄 (찌가 물에 닿을 때마다 검은 물결)
wet-line: true

# 풀린 뒤 /도감 낚시 탭 맨 뒤에 모두에게 보이는 한 칸 (수집 수에 들지 않음). {player} = 푼 사람, {first} = 첫 낚시꾼
codex:
  name: "<#c4ab9b>눈 없는 물고기 <dark_gray>— <gray>이름을 돌려준 자 <white>{player}"
  lore:
    - "<gray>일곱 물을 거슬러 이름 하나를 돌려주었다."
    - "<dark_gray>물 위로 잠깐 떠올랐던 이름: <#c4ab9b>{first}"
    - "<dark_gray>도감에 등록할 수 없음"

too-late: "<dark_gray>…물은 잔잔하다. 누군가 먼저 이름을 주었다."
solved-line: "<dark_gray>어딘가의 깊은 물이 이름을 얻었다…"

# 푼 사람 (서버에서 처음 한 명). 돈 대신 하나뿐인 것: 칭호, 젖은 낚싯줄, 도감의 한 칸
rewards:
  money: 0
  title: economy:water_name
