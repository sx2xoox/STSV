# 그에게 귓속말 (/w · /msg · /tell <이름> <말>). 그가 한 번이라도 다녀간 뒤에만 닿는다 (그 전 · 꺼짐 · 풀린 뒤에는 게임이 평소처럼 "플레이어를 찾을 수 없습니다")
whisper:
  # 귓속말 명령어 (minecraft: 가 붙은 것도 같이 읽음). 서버에 한글 별칭 명령어가 생기면 여기에 추가
  commands: [w, msg, tell]
  # 한 사람에게 답 하나를 준 뒤 이만큼(초)은 무엇을 보내도 답이 없음. 답이 오기까지는 typing 의 치는 속도만큼 걸림
  cooldown-seconds: 20
  # 비석 앞이 아닐 때의 답: 위 chat.intents 와 같은 모양 (addressed · answer 는 쓰지 않음). 위에서부터 처음 맞는 하나, chance 를 넘지 못하면 답 없음.
  # 귓속말은 그 사람에게만 가므로 "?" 를 써도 된다. stone (비석 · 돌 이야기) 에는 절대 "맞다" 고 하지 않는다: 되묻거나, 모르는 척하거나, 말이 없다
  intents:
    stone:
      match: ["비석|기념비|돌|무덤|묘|열세|13번|이름 없"]
      chance: 0.6
      lines: ["…돌이요?", "…잘 모르겠어요."]
    bot:
      match: ["봇|bot|가짜|npc|엔피씨|귀신|유령|매크로|\\bai\\b|사람 맞|사람이야|사람이에요|살아|죽었"]
      chance: 1
      lines: ["ㅋㅋ 아니에요", "사람이에요 ㅠ", "저 봇 아니에요 ㅠㅠ", "…왜 다들 그렇게 물어보세요."]
    where:
      match: ["어디|좌표|위치|tpa|티피|텔포|같이|만나|찾아"]
      chance: 1
      lines: ["아 저 지금 좀 멀리 있어요", "여기가 어딘지 잘 모르겠어요 ㅠ", "나중에 같이해요 ㅎㅎ"]
    who:
      match: ["누구|뉴비|정체|이름|뭐하는|뭐해|뭐 해"]
      chance: 1
      lines: ["그냥 새로 온 사람이에요", "아 저 뉴비에요 ㅎㅎ", "저 들어온지 얼마 안됐어요"]
    greet:
      match: ["안녕|ㅎㅇ|하이|반가|hello|hi\\b"]
      chance: 1
      lines: ["아 안녕하세요", "앗 안녕하세요 ㅎㅎ", "…안녕하세요."]
    # 그 밖의 모든 말 ("." = 아무 글자)
    other:
      match: ["."]
      chance: 1
      lines: ["아 죄송해요 제가 아직 잘 몰라서요", "앗 네네", "음 잘 모르겠어요 ㅠ", "넵", "아 그렇구나", "ㅎㅎ", "…네."]
  # 여러 밤에 걸쳐 귓속말해 온 사람에게: after-nights 번째 밤부터 답의 chance 만큼이 이 중 하나로 바뀐다 (stone 의 답은 그대로). 조용히, 조금 이상하게
  strange:
    after-nights: 3
    chance: 0.15
    lines:
      - "…저 계속 여기 있었는데요."
      - "…어제도 물어보셨잖아요."
      - "…매일 오시네요."
      - "…저 아직 여기 있어요."
      - "…그 말 전에도 하셨어요."
  # 다른 (열세 번째가 아닌) 비석 앞일 때
  wrong-stone: "…그건 제 게 아니에요."

# ─── 삐짐: 욕을 들으면 한 줄 치고 그 밤에는 말이 없다 ───────────────────────────────────────────
# 공개 채팅: 그가 "접속해 있는" 동안 (방문 중 · 마지막 질문 뒤 chat.linger-seconds), 그를 향한 욕일 때만.
#   그를 향함 = 그의 이름이 있음, aim 중 하나가 있음, 또는 그가 무슨 말이든 (질문 · 잡담) 한 뒤 window-seconds 안.
# 귓속말: 그에게 보낸 욕은 언제든 (낮이어도) 삐짐. 답은 귓속말로 그 사람에게만 가고, 그 밤은 모두에게 끝 (공개 채팅에는 아무 말도 없음).
#   그의 비석 앞에서 보낸 귓속말도 욕이면 엔딩 대신 삐짐. 욕이 아니면 삐진 밤에도 비석 앞 귓속말로 엔딩은 그대로 된다.
# 삐진 뒤: 남은 질문 없음, 잡담 · 인사 없음, 귓속말은 보낸 사람의 말만 뜨고 답이 없다 (자리를 비운 사람에게 귓속말한 것처럼). 퇴장 줄은 없다.
#   재시작 · 접속자 부족으로 멈췄다 다시 차도 · 관리자 시작으로도 그 밤에는 돌아오지 않는다. 삐짐은 그 밤 창이 닫힌 뒤에도 다음 밤 창이 열릴 때까지 이어진다
#   (창 밖, 낮에 귓속말로 욕하면 그날 밤에 오지 않는다). 다음 밤에는 평소처럼 입장 줄과 함께 온다.
# 테스트 모드인 사람의 귓속말 · 그 사람에게만 보이는 방문에서의 욕은 그 사람에게만 삐진다.
sulk:
  window-seconds: 40
  # 욕처럼 보이지만 욕이 아닌 말 (욕을 찾기 전에 먼저 뺀다; 정규식, 느슨하게 읽은 줄에서)
  allow:
    - "시발점|시발역|시발택시|시발 ?자동차"
    - "병신년|병신 ?년도|병신 ?정변|병신 ?양요"
    - "새끼 ?(고양이|강아지|돼지|여우|늑대|거북|오리|양|소|말|곰|판다|닭|토끼|동물|몹|손가락|발가락|줄)"
    - "(고양이|강아지|돼지|여우|늑대|거북|오리|곰|판다|닭|토끼|동물|몹|새|물고기) ?새끼"
    - "새끼를 ?낳|새끼 ?낳|새끼 ?쳤|새끼 ?치"
    - "호박엿"
  # 그를 가리키는 말 (정규식; 줄을 소문자로, 글자 아닌 것은 띄어쓰기 하나로 바꾼 뒤 찾음). 그의 이름은 따로 늘 셈
  aim:
    - "뉴비"
    - "(^| )(너|넌|너가|네가|니|니가|얘|얘는|쟤|님|님아)( |$)"
    - "너 ?같|니 ?같|너 ?따위|니 ?따위"
  # 삐진 다음 밤 (입장 줄이 뜨는 밤), 이 확률로 첫 질문 전에 한 줄 ("?" 금지)
  sorry-chance: 0.3
  sorry: ["어제는 죄송했어요", "어제 그냥 가서 죄송해요", "아 어제는 제가 좀..", "어제 일은 신경 쓰지 마세요"]

# 비석 앞 = 그 돌에서 이만큼(칸) 안. 돌들이 촘촘히 서 있으므로, 그의 돌이 범위 안이고 가장 가까운 돌보다 slack 칸 넘게 멀지 않으면 그의 돌 앞으로 침
stone:
  range: 3.5
  slack: 0.4
  # 이름표로 이름을 새기는 것: 한 사람 하룻밤 이만큼까지 (틀리면 튕겨 나옴, 이름표는 그대로)
  name-tries: 3
  # 그의 비석 앞에서 처음 귓속말한 사람에게 (그 사람에게만), 그 뒤 다시 귓속말하면 그중 한 줄
  found-lines:
    - "…찾으셨네요."
    - "…비어 있죠. 원래는 제 이름이 있었어요."
    - "…그날 다 날아갔어요. 조각은 아직 어딘가 남아 있을 거예요."
  again-lines: ["…또 오셨네요.", "…아직 비어 있죠.", "…조각은 어딘가 남아 있을 거예요.", "…여기 있으면 좀 나아요."]

# 깨진 흔적과 조각. gate: player = 그 사람이 직접 비석 앞에서 귓속말한 뒤에만 그 사람에게 / server = 서버에서 처음 누가 한 뒤 모두에게
# (그의 한영키 오타 · 비석의 깨진 글씨는 gate 와 상관없이 서버에서 처음 누가 귓속말한 뒤부터 모두에게). 밤낮 무관.
clues:
  gate: player
  # 한 사람 하루 조각 수, 서버 하루 조각 수
  per-player-day: 1
  per-server-day: 4
  # 버스: 정류장에 설 때마다의 확률 / 편의점: 손님 한 명을 계산할 때마다 / 낚시: 입질마다 / 우편: 접속해 있는 한 시간마다
  bus:
    chance: 0.04
  store:
    chance: 0.03
  fishing:
    chance: 0.03
  mail:
    chance-per-hour: 0.15

# 그의 한영키 오타 (밤마다 한 번, 두 번째 질문 뒤): lines 의 한 줄 중간에 영어 글자 하나가 끼고, fix 의 한 줄로 고친다. "?" 금지
# 진짜 한영키 실수처럼: 영어 상태에서 그 낱말의 첫 자판을 누르고, 한글로 바꿔 낱말을 다시 친 꼴 ("r구경만", "a많네요").
# 그래서 그 글자의 자판으로 시작하는 낱말이 (ㄱ = r, ㅁ = a) 있는 줄을 먼저 고르고 그 낱말 앞에 끼운다 (없으면 아무 낱말 앞)
hanyoung:
  lines:
    - "아 오늘도 사람 많네요"
    - "저 아까부터 구경만 하고 있어요"
    - "여기 밤에는 조용하네요 ㅎㅎ"
    - "다들 뭐하고 계세요 저는 그냥 있어요"
    - "아 손이 시려워서 자꾸 틀려요"
    - "저 오늘은 좀 일찍 왔어요"
    - "근데 여기 밤에 몹 많아요 ㅠ"
    - "저 오늘도 그냥 구경 왔어요"
  fix: ["아 한영키", "한영키 ㅋㅋ", "아 한영키 또"]

# 비석에 뭔가 돌아왔을 때 그가 공개 채팅에 하는 말 (와 있는 밤이면 곧, 아니면 다음 밤 첫마디). "?" 금지. {player} = 이름을 새긴 사람
restored:
  back: ["어.. 방금 뭔가 돌아왔어요", "어 방금 뭐가 돌아온 것 같아요", "아.. 뭔가 생각났어요 방금"]
  date: "…그날 밤에 저 혼자였어요"
  what: "…등불 하나 켰어요. 그게 다예요. 근데 되게 좋았어요"
  name: "…{player}님, 방금 제 이름 부르셨죠. 들렸어요"
  two: "…저 사실 나가는 법이 없어요. 들어온 기록이 없어서요."

# 세 줄이 다 돌아온 다음 밤부터: 입장 줄 뒤 arrive 한 줄, 그리고 밤 창이 끝날 때까지 비석 앞에 서 있다 (모두에게 보임, 탭 목록에는 없음).
# 그의 곁 range 칸 안에서 맨손으로 비석을 두 번 (10초 안에) 우클릭하면 서명. lines = 서명한 사람에게 하는 귓속말 세 줄 ({player})
vigil:
  arrive: "…다 돌아왔어요. 거기 있을게요."
  range: 5
  out: 1.3
  confirm: "<gray>…증인 <dark_gray>▒▒▒"
  lines:
    - "…그 공지, 그날 보고 싶었어요."
    - "…고마워요, {player}님."
    - "…저는 이제 나가 볼게요. 처음으로."

# 서명 뒤 비석 옆에 남는 등불 (모델 economy:model/lantern_iron; 없으면 바닐라 랜턴). light = 그 자리의 밝기 (0 이면 빛 블록을 두지 않음)
lantern:
  enabled: true
  light: 12
  side: 0.55
  out: 0.75

# AI (공식 Anthropic Java SDK). 키는 서버 환경 변수 ANTHROPIC_API_KEY 로만 (이 파일 · 저장소에 적지 않는다). 키가 없거나 enabled: false 면
# 전부 대본 + 낱말 규칙으로 동작한다. 언제 대꾸할지는 늘 코드가 정하고 (chat.intents 의 확률 · 간격), AI 는 그 대꾸를 그의 말로 쓸 뿐이다.
ai:
  enabled: true
  model: claude-opus-5-5
  # 그의 대꾸 가운데 AI 가 쓰는 비율: 켠 날 ratio-start 에서 ratio-days 일에 걸쳐 1.0 까지 (나머지는 대본)
  ratio-start: 0.5
  ratio-days: 2
  # 하룻밤 대꾸 상한 (그 밤의 수는 날짜로 정해짐). 5번 전부터 졸린 티, 상한에서 "자러 갈게요" (다섯 질문이 남았으면 버팀). AI 가 꺼져 있으면 chat.max-per-night
  max-per-night: [30, 40]
  # 하루 API 호출 상한 (잡담 · 귓속말 · 조각 읽기 · 편지 모두 합쳐), 한 번의 호출을 기다리는 최대 초 (넘으면 대본), 응답 토큰 상한 (생각 포함)
  max-calls-per-day: 400
  # 한 사람에게 쓰는 하루 호출 상한 (귓속말 · 조각 읽기 · 잡담: 한 사람이 귓속말을 쏟아부어도 다른 사람 몫이 남게; 메모리에만, 재시작하면 다시 셈)
  max-calls-per-player-day: 40
  timeout-seconds: 8
  max-tokens: 16000
  # AI 가 쓰는 대꾸는 치는 시간에 이만큼(초) 더 걸림 (읽고 생각하는 시간; 호출은 이 안에 끝나야 함)
  think-seconds: [2, 5]
  # 다음 밤 편지를 AI 가 사람마다 쓰게 함 (false: 모두 대본 편지). 편지는 하루 호출 상한과 따로 셈: 통틀어 max-letter-calls 통까지 (넘으면 대본 편지)
  letters: true
  max-letter-calls: 300
  # 졸린 줄, 자러 가는 줄 ("?" 금지)
  sleepy: ["하암..", "아 좀 졸리네요", "눈이 좀 감겨요 ㅎㅎ", "네에.. 하암"]
  goodnight: ["저 이제 자러 갈게요", "저 이제 자러 갈게요 다들 좋은 밤 되세요", "저 먼저 자러 갈게요 ㅎㅎ"]

# ------------------------------------------------------------------------------------------------------------------
# 후속 임무 「다음 사람」 (난이도: 보통) — 운영자 문서 docs/admin/숨은_비밀/새로_온_사람.md "후속 임무"
# 그는 나갔다. 하지만 일주일에 한 번쯤, 같은 밤 시간대(visit.hours)에 또 다른 뉴비가 "들어온다": 다른 이름, 입장 줄, 초보 질문 몇 개,
# 잡담, 졸린 한 줄, 그리고 퇴장 줄은 끝내 없음. 모두가 보지만, 푼 사람만 열세 번째 돌에게서 한 번 귀띔을 받는다: "…또 한 명 왔어요."
# 그 방문자의 진짜 소원은 질문 속에 있다. 이번에는 첫 글자가 아니라 **각 질문의 첫 낱말**(첫 띄어쓰기 앞까지)을 차례로 읽는다.
# 푼 사람이 그 일을 해 주면 방문자는 공개 채팅에 고맙다는 한 줄을 남기고 다시는 말하지 않는다. 보상은 푼 사람에게만.
#
# !! 이 후속 임무는 매주 공개 채팅에 가짜 입장 줄과 가짜 채팅을 올립니다. 원하지 않으면:
#    sequel.enabled: false     → 후속 임무 자체를 끔 (아무도 오지 않음)
#    sequel.public-chat: false → 방문자는 오지만 푼 사람에게만 보임 (다른 사람 채팅에는 아무것도 안 뜸)
# 치는 속도 · 질문 간격 · 잡담 · 삐짐 · 귓속말 답은 위의 visit / typing / typo / chat / sulk / whisper 설정을 그대로 따른다.
sequel:
  enabled: true
  # true = 모두에게 보임 (기본). false = 푼 사람에게만 보임
  public-chat: true
  # 보통: 80,000~150,000 G (1,000 G 단위로 내림)
  reward:
    money: [80000, 150000]
  # 끝났을 때 그 사람에게만 ({reward} = 받은 것)
  done: "<dark_gray>…그 사람도 이제 묻지 않는다. <gray>({reward})"
  # (쓸 이름이 없어 시작하지 못했을 때: 아무 말도 하지 않음)
  none: ""

  # 그 주에 아직 아무도 안 왔고, 푼 사람이 접속해 있고, 밤 시간대(visit.hours) 안일 때 1초마다 이 확률 (0.003 = 평균 5~6분). 테스트 모드 = 100%
  chance: 0.003
  # 진짜 접속자가 이만큼은 있어야 옴 (푼 사람 포함). 질문도 이 수 아래로 내려가면 멈췄다가 이어 감
  min-online: 1
  # 입장 줄 뒤 이만큼(초) 지나 푼 사람에게만 귀띔 한 줄 (게임의 귓속말 모양, 보낸 이 = told-from)
  told-seconds: 12
  told-from: "열세 번째 돌"
  told: "…또 한 명 왔어요."
  # 최근에 쓴 이름 · 소원은 다시 고르지 않음 (그 주의 이름과 소원은 주와 사람으로 정해짐: 재시작해도 같은 것)
  avoid-recent-names: 8
  avoid-recent-wishes: 4

  # 방문자 이름 (평범한 계정 이름 꼴: 영문 · 숫자 · _ 3~16자). 이 서버에 들어온 적 있는 계정 이름, 누군가의 닉네임, 그의 이름(name)과
  # 같은 것은 고르지 않는다. 방문 중에 같은 이름(닉네임)의 진짜 플레이어가 접속하면 그동안 방문자는 말이 없고 귓속말도 가로채지 않는다
  names: [mandu_02, haneul0412, dotori__, bori_cha, ggomi99, noeul_, haru1004, byeol2, moongchi, kimbap_3, dalbit07, nabi_ya,
          podo_al, jjangu_0, baram_i, hodu_gwaja, minsu0309, yuna_k, gamja_tang, sogeum_]

  # 소원을 들어줬을 때 방문자가 공개 채팅에 남기는 마지막 한 줄 (뉴비 말투, 무엇을 고마워하는지는 말하지 않음, "?" 금지).
  # 소원마다 따로 두려면 그 소원에 thanks: [...] 를 적는다
  thanks:
    - "아 감사합니다 진짜로"
    - "봤어요.. 고마워요"
    - "와 진짜 해주셨네요 감사합니다"
    - "고맙습니다 이제 됐어요 ㅎㅎ"
    - "감사해요 덕분에 마음이 놓여요"
    - "아.. 고마워요 저 이제 괜찮아요"
    - "누군지 모르겠지만 감사합니다 ㅎㅎ"
    - "고마워요. 그거면 돼요"

  # 소원 목록 (8가지 이상 권장). 규칙 (안 맞으면 켤 때 콘솔에 경고가 뜨고 그 소원은 빼고 읽음):
  #   - says: 방문자가 정말 하고 싶은 말. 낱말 수 = 질문 수
  #   - questions: 차례대로, 각 질문의 첫 낱말이 says 의 낱말과 같아야 함. 두 낱말 이상, 끝에만 "?" (방문자의 말 중 "?" 가 있는 것은 이 질문들뿐)
  #   - task: 게임이 확인하는 일
  #       where: spawn (첫 월드 스폰) · stop (아무 버스 정류장) · monument (기념비) · stone (열세 번째 돌) · water (깊은 물: drop 전용) · high (높은 곳, 하늘이 트임) · any
  #       do:    drop (items 중 하나를 그 자리에서 버리기 Q — 아이템은 가져가지 않음) · hold (items 중 하나를 손에 들고 seconds 초) · stay (seconds 초 머물기)
  #       night: true 면 월드 시간이 밤(13000~23000)일 때만 · range: 그 자리에서 몇 칸 · depth: 물 깊이 · height: 높이(Y)
  #   - items 는 "poppy" · "economy:mackerel" 꼴, 끝에 * 를 붙이면 앞부분이 같은 것 모두
  # 정류장이 없는 서버에서는 stop 소원을, 기념비가 없으면 monument · stone 소원을 고르지 않는다
  wishes:
    flower:
      says: "혹시 스폰에 꽃 하나만 부탁"
      questions:
        - "혹시 여기 처음 오면 뭐부터 해야돼요?"
        - "스폰에 다시 가려면 어떻게 해요?"
        - "꽃 같은 것도 상점에 팔 수 있어요?"
        - "하나만 더 물어봐도 될까요?"
        - "부탁 같은 거 드려도 되는 서버에요?"
      task:
        where: spawn
        do: drop
        range: 12
        items: &flowers [dandelion, poppy, blue_orchid, allium, azure_bluet, red_tulip, orange_tulip, white_tulip, pink_tulip,
                         oxeye_daisy, cornflower, lily_of_the_valley, torchflower, sunflower, lilac, rose_bush, peony]
    stop:
      says: "밤에 정류장에서 기다려줄 사람"
      questions:
        - "밤에 몹 많이 나와요?"
        - "정류장에서 버스 타려면 돈 내야 돼요?"
        - "기다려줄 분 계시면 같이 가도 돼요?"
        - "사람 제일 많은 시간이 언제에요?"
      task:
        where: stop
        do: stay
        night: true
        seconds: 30
        range: 12
    fish:
      says: "물고기 한마리만 깊은 물에 놓아줄 사람"
      questions:
        - "물고기 잡으면 어디다 팔아요?"
        - "한마리만 잡아도 도감에 올라가요?"
        - "깊은 데서 낚시하면 더 좋은거 나와요?"
        - "물에 빠지면 아이템 다 잃어요?"
        - "놓아줄 수도 있어요 잡은 물고기?"
        - "사람 없는 낚시터 추천 좀 해주실분?"
      task:
        where: water
        do: drop
        depth: 4
        items: [cod, salmon, tropical_fish, pufferfish,
                "economy:mackerel", "economy:horse_mackerel", "economy:sardine", "economy:saury", "economy:rockfish", "economy:flatfish",
                "economy:greenling", "economy:filefish", "economy:yellowtail", "economy:hairtail", "economy:pollack", "economy:croaker",
                "economy:herring", "economy:sandfish", "economy:pale_chub", "economy:crucian_carp", "economy:carp", "economy:catfish",
                "economy:bitterling", "economy:mandarin_fish", "economy:smelt", "economy:dace", "economy:masu_salmon", "economy:trout",
                "economy:char", "economy:loach", "economy:eel", "economy:goby", "economy:mullet", "economy:guppy", "economy:tilapia",
                "economy:sweetfish", "economy:rainbow_trout", "economy:golden_crucian"]
    candle:
      says: "기념비에 촛불 하나 들고 와줄 사람"
      questions:
        - "기념비에 이름 적힌 분들은 뭐 하신 거에요?"
        - "촛불 같은 건 어떻게 만들어요?"
        - "하나 만들려면 재료 많이 들어요?"
        - "들고 있으면 밝아지는 아이템도 있어요?"
        - "와줄 분 있으면 구경시켜 주실래요?"
        - "사람 없을 때 가도 되는 곳이에요?"
      task:
        where: monument
        do: hold
        seconds: 15
        range: 10
        items: [lantern, soul_lantern, candle, torch]
    stars:
      says: "밤에 산꼭대기에서 하늘 봐줄 사람"
      questions:
        - "밤에 자면 아침 되는 거 맞아요?"
        - "산꼭대기에서 떨어지면 바로 죽어요?"
        - "하늘 날 수 있는 아이템도 있어요?"
        - "봐줄 분 있으면 제 집 평가 좀 해주실래요?"
        - "사람 얼굴 스킨은 어디서 바꿔요?"
      task:
        where: high
        do: stay
        night: true
        seconds: 20
        height: 150
    lamp:
      says: "바다에 등불 하나 띄워줄 사람"
      questions:
        - "바다에 가려면 어느 쪽으로 가야돼요?"
        - "등불 이랑 횃불이랑 뭐가 더 밝아요?"
        - "하나 만드는데 철 얼마나 들어요?"
        - "띄워줄 수 있는 배는 어떻게 만들어요?"
        - "사람 태우는 배도 있어요?"
      task:
        where: water
        do: drop
        depth: 4
        items: [lantern, soul_lantern, candle]
    bread:
      says: "스폰에 빵 한개만 두고갈 사람"
      questions:
        - "스폰에 상자 놓으면 안되죠?"
        - "빵 말고 배 채우기 좋은 거 뭐 있어요?"
        - "한개만 팔아도 상점에서 받아줘요?"
        - "두고갈 데 없으면 아이템 어디다 보관해요?"
        - "사람 많을 때는 렉 걸려요?"
      task:
        where: spawn
        do: drop
        range: 12
        items: [bread, "economy:corn_bread"]
    bench:
      says: "정류장에 꽃 한송이 두고갈 사람"
      questions:
        - "정류장에 서있으면 버스가 그냥 와요?"
        - "꽃 심으면 옆으로 번져요?"
        - "한송이 씩 파는 것보다 묶어서 파는게 나아요?"
        - "두고갈 물건은 땅에 버리면 사라지죠?"
        - "사람 이름 누르면 뭐 나와요?"
      task:
        where: stop
        do: drop
        range: 12
        items: *flowers
    dawn:
      says: "새벽에 스폰에서 같이 있어줄 사람"
      questions:
        - "새벽에 접속하시는 분들도 계세요?"
        - "스폰에서 멀리 가면 다시 못 돌아와요?"
        - "같이 하면 경험치 더 줘요?"
        - "있어줄 분 계시면 저 길 좀 알려주실래요?"
        - "사람 때려도 되는 서버에요?"
      task:
        where: spawn
        do: stay
        night: true
        seconds: 30
        range: 12
