      hush-seconds: 0
    # 그의 질문 바로 뒤에 누가 한 말 (글자가 하나라도 있으면; ㅋㅋ 만 있는 줄은 아래 laugh)
    answer:
      match: ["[가-힣a-z0-9]"]
      addressed: false
      answer: true
      chance: 0.6
      lines: ["아 감사합니다 ㅎㅎ", "오 그렇구나", "헐 몰랐어요", "ㅇㅋ 해볼게요", "아하", "오오 감사요", "아 그렇군요 ㅎㅎ",
              "넵 감사합니당", "아 그거였구나", "ㄳㄳ", "오 ㄱㅅㄱㅅ"]
      follow: ["지금 해봐야겠다", "아까부터 그거 찾고 있었어요 ㅋㅋ", "물어보길 잘했다", "메모해둠", "와 하나도 몰랐네"]
      follow-chance: 0.3
      slip: []
      slip-chance: 0
      hush-seconds: 0
    laugh:
      match: ["ㅋㅋㅋ|ㅎㅎㅎ|ㅋㅌㅋ|zzz|ㄱㅋㄱㅋ"]
      addressed: false
      answer: false
      chance: 0.15
      lines: ["ㅋㅋㅋ", "ㅋㅋㅋㅋ", "ㅋㅋ", "ㅎㅎ"]
      follow: []
