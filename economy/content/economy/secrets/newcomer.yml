# 숨은 비밀: 새로 온 사람 (운영자 문서: docs/admin/숨은_비밀/새로_온_사람.md · README 에는 일부러 적지 않음)
# 매일 밤 뉴비 한 명이 들어와 공개 채팅에 초보 질문을 한다. 모두가 본다. 하지만 탭 목록에 없고, 아무도 본 적이 없고,
# 서버는 그가 "나갔다" 고 말한 적이 한 번도 없다. 그는 오래전, 아무도 없을 때 이 서버의 비밀을 하나 푼 사람이다.
# 기념비의 열세 번째 돌 — "???" 조차 없는 맨돌 — 이 그의 것. 질문 다섯 개의 첫 글자를 이으면 그가 정말 묻고 싶은 말이 된다.
# 답은 채팅이 아니다: 그 맨돌 앞에 서서 그에게 귓속말을 하면 끝난다.
# 꼭 먼저 기념비를 세워 둘 것 (/관리자 비밀 비석 세우기). 기념비가 없으면 이 비밀은 끝낼 수 없다.
enabled: true

# 그의 이름 (채팅 · 입장 줄 · 귓속말 대상). 평범한 계정 이름처럼 보여야 함: 영문 · 숫자 · _ 3~16자. 십삼(sipsam) = 13
# 같은 이름(또는 닉네임)의 실제 플레이어가 접속해 있는 밤에는 이 비밀이 통째로 쉰다 → 겹치면 여기를 바꿀 것 (stone-name 도 같이)
name: sipsam_

# 질문들의 첫 글자가 이어져야 하는 말 (띄어쓰기는 세지 않음: "내 비석 어디"). 질문을 고쳐서 안 맞게 되면 서버 켤 때 경고가 뜸
acrostic: "내비석어디"

# 풀린 뒤 그 비석의 첫 줄 (그 아래에 푼 사람 이름과 날짜). 물려받은 돌처럼 읽히게: 원래 주인의 이름을 남김
stone-name: "열세 번째 · sipsam_"

# 서버에서 처음 푼 한 사람에게. 돈 대신 하나뿐인 것: 칭호와 비석, 그리고 "나갔다는 말이 뜨지 않는 사람" (아래 perk)
rewards:
  money: 0
  title: economy:thirteenth

solved-line: "<dark_gray>누군가 이름 없던 비석을 물려받았다."
# 그에게 귓속말을 해 본 적 있는 다른 사람들에게, 누가 먼저 풀고 나면 한 번
too-late: "<dark_gray>…그 사람은 이제 없어요. 누군가 먼저 찾아 줬어요."

# 밤마다 한 번 들어온다 (모두에게 보이는 가짜 입장 줄 → 질문 다섯 개). 나갔다는 줄은 없다. 다음 밤에 그냥 또 "들어온다".
# 입장 줄은 하룻밤에 딱 한 번만 뜬다: 방문 도중 서버가 다시 켜지거나 사람이 모두 나갔다 들어와도, 그는 (나간 적이 없으므로) 입장 줄 없이 남은 질문만 이어서 한다.
# /관리자 비밀 시작 새로온사람 (테스트 모드가 아닐 때) = 지금 열려 있는(또는 다음에 열릴) 밤의 방문을 앞당겨 하는 것 → 그 밤에는 또 오지 않는다.
visit:
  # [시작 시, 끝 시) 한국 시간. [22, 2] = 22:00 ~ 01:59. 이 안의 한 분(分)이 날짜로 정해짐 (같은 날짜면 늘 같은 분 → 재시작해도 두 번 오거나 건너뛰지 않음)
  hours: [22, 2]
  # 그 분을 정하는 씨앗 (바꾸면 매일의 시각이 달라짐)
  seed: 13
  # 접속자가 이만큼은 있어야 옴. 그 시각에 모자라면 같은 밤 안에서 사람이 생길 때까지 기다림 (질문 도중에 모자라지면 멈췄다가, 다시 차면 입장 줄 없이 이어서)
  min-online: 1
  # 진짜 플레이어가 막 들어온 직후(초)에는 들어오지 않음 (같이 들어온 것처럼 보이지 않게)
  after-join-seconds: 45
  # 입장 줄 → 첫 질문 [최소, 최대] 초
  first-gap-seconds: [40, 90]
  # 질문 사이 [최소, 최대] 초 (매번 무작위)
  gap-seconds: [70, 160]
  # 테스트 모드 · 장면에서의 간격(초)
  test-gap-seconds: 5
  # 늘 이 순서로. 첫 글자가 차례로 내 / 비 / 석 / 어 / 디 (MiniMessage 아님: 적힌 그대로 채팅에 나옴)
  questions:
    - "내일도 이 시간에 사람 많아요?"
    - "비 오면 물고기가 더 잘 잡힌다던데 진짜예요?"
    - "석탄은 어디 가야 많이 나와요?"
    - "어제도 다들 계셨어요? 저만 못 본 건가"
    - "디스코드 같은 건 따로 없죠? 그냥 여기서 물어봐도 되나"

# 그의 질문 뒤 window-seconds 안에 진짜 플레이어가 채팅을 하면, 한 번 방문에 한 번만, chance 확률로 짧게 대답 (살아 있는 듯, 그러나 어딘가 정해진 듯)
react:
  chance: 0.5
  window-seconds: 25
  delay-seconds: [3, 6]
  # 비우면 ([]) 대답하지 않음
  lines:
    - "아 감사합니다 ㅎㅎ"
    - "오 그렇구나"

# 그에게 귓속말 (/w · /msg · /tell <이름> <말>). 그가 한 번이라도 다녀간 뒤에만 닿는다 (그 전 · 꺼짐 · 풀린 뒤에는 게임이 평소처럼 "플레이어를 찾을 수 없습니다")
whisper:
  # 귓속말 명령어 (minecraft: 가 붙은 것도 같이 읽음). 서버에 한글 별칭 명령어가 생기면 여기에 추가
  commands: [w, msg, tell]
  # 그의 답이 오기까지 [최소, 최대] 초
  reply-delay-seconds: [2, 4]
  # 한 사람에게 답 하나를 준 뒤 이만큼(초)은 무엇을 보내도 답이 없음
  cooldown-seconds: 20
  # 비석 앞이 아닐 때: 차례로 하나씩 (끝나면 처음부터)
  evasive:
    - "…저 아세요?"
    - "…죄송해요, 제가 아직 잘 몰라서."
    - "…거기 아니에요."
    - "…저는 계속 여기 있었는데요."
  # 다른 (열세 번째가 아닌) 비석 앞일 때
  wrong-stone: "…그건 제 게 아니에요."

# 비석 앞 = 그 돌에서 이만큼(칸) 안. 돌들이 촘촘히 서 있으므로, 그의 돌이 범위 안이고 가장 가까운 돌보다 slack 칸 넘게 멀지 않으면 그의 돌 앞으로 침
stone:
  range: 3.5
  slack: 0.4

# 엔딩: 그 비석 앞에서 처음 귓속말한 사람에게만 (약 38초). 마지막 줄 뒤에야 모두에게 "…님이 나갔습니다" 가 뜬다 (처음이자 마지막)
ending:
  # 귓속말한 뒤 첫 답까지(초), 답 사이(초)
  lead-seconds: 3
  gap-seconds: 5
  # 도중에 비석에서 이만큼(칸) 넘게 멀어지거나, 다른 월드로 가거나, 죽거나, 나가면 엔딩이 멈춘다. 아무것도 저장되지 않고 (풀린 것 아님),
  # 그 비석 앞에서 다시 귓속말하면 처음부터. 멈출 때 그가 남기는 한마디 (비우면 "" 아무 말 없음; 나간 사람에게는 보내지 않음)
  leave-range: 12
  left: "…아, 가시네요."
  # 그동안 주변 소리를 끊음 / 맨돌에서 먼지가 떨어짐
  quiet: true
  dust: true
  # 시야 가장자리에, 비석 너머에 서 있는 사람 (그 사람에게만 보임, 똑바로 쳐다보면 없음). figure-line 번째 답과 함께 나타남
  figure: true
  figure-line: 3
  figure-look-degrees: 15
  # 머리 위에 그의 이름
  figure-name: true
  # 비우면 기본 스킨. 리소스팩 스킨을 쓰려면 "economy:entity/…" (팔이 가늘면 끝에 " slim")
  figure-skin: ""
  # {player} = 듣는 사람의 이름 (닉네임이 있으면 닉네임)
  lines:
    - "…찾았네요."
    - "…그거, 제 거 맞아요."
    - "…저 예전에 여기서 뭘 하나 풀었거든요. 아무도 없을 때. 공지도 안 떴고, 비석에 이름도 안 새겨졌어요."
    - "…그래서 매일 다시 들어왔어요. 누가 물어봐 줄까 봐."
    - "…질문은 제가 했는데, 답은 {player}님이 해 주셨네요."
    - "…이제 {player}님이 열세 번째예요."
    - "…저는 이제 나가 볼게요. 처음으로."

# 영구 특전: 푼 사람이 서버를 나갈 때 "…님이 나갔습니다" 줄이 뜨지 않는다 ("나가지 않는 사람" 을 물려받음). 입장 줄은 그대로 뜬다.
# 끄려면 false (이 비밀을 끄기 해도 이 특전은 남으므로, 없애려면 여기서 끌 것). 서버초기화 로 푼 사람 기록을 지우면 특전도 같이 사라진다.
# 숨긴 퇴장은 콘솔에 "[비밀] <이름> 이(가) 나갔습니다 (새로 온 사람 특전 …)" 으로 남는다 (게임의 "lost connection" 줄도 그대로).
perk:
  no-leave-line: true
  # 강퇴 · 밴으로 나가는 것은 "나간 것" 이 아니므로 그 줄은 평소처럼 모두에게 보인다 (관리가 가려지지 않게). false 면 그것도 숨김
  show-kick: true
