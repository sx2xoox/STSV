# 숨은 비밀: 새로 온 사람 (운영자 문서: docs/admin/숨은_비밀/새로_온_사람.md · README 에는 일부러 적지 않음)
# 매일 밤 뉴비 한 명이 들어와 공개 채팅에 초보 질문을 한다. 모두가 본다. 하지만 탭 목록에 없고, 아무도 본 적이 없고,
# 서버는 그가 "나갔다" 고 말한 적이 한 번도 없다. 오래전 어느 밤 혼자 비밀을 하나 풀었는데, 그날 서버가 되돌려져 기록이 다 날아갔다.
# 기념비의 열세 번째 돌 — "???" 조차 없는 맨돌 — 이 그의 것. 질문 다섯 개의 첫 글자를 이으면 그가 정말 묻고 싶은 말이 된다.
# 그 맨돌 앞에서 그에게 귓속말하면 시작이다: 비석에 깨진 글씨가 보이고, 서버 곳곳의 깨진 흔적에서 조각을 모아 세 줄 (이름 · 그날 · 푼 것) 을 되살린다.
# 다 돌아오면 그가 비석 앞에 서 있고, 누군가 증인으로 서명하면 그날 날짜의 공지와 함께 그는 처음으로 나간다.
# 꼭 먼저 기념비를 세워 둘 것 (/관리자 비밀 비석 세우기). 기념비가 없으면 이 비밀은 풀 수 없다.
enabled: true

# 그의 이름 (채팅 · 입장 줄 · 귓속말 대상). 평범한 계정 이름처럼 보여야 함: 영문 · 숫자 · _ 3~16자. 십삼(sipsam) = 13
# 같은 이름(또는 닉네임)의 실제 플레이어가 접속해 있는 밤에는 이 비밀이 통째로 쉰다 → 겹치면 여기를 바꿀 것 (stone-name 도 같이)
name: sipsam_

# 질문들의 첫 글자가 이어져야 하는 말 (띄어쓰기는 세지 않음: "내 비석 어디"). 글자마다 아래 questions 에 같은 글자의 목록이 있어야 함.
# 목록이 비었거나 규칙에 안 맞는 질문은 서버 켤 때 콘솔에 경고가 뜨고 빼고 읽는다 (단서가 사라지지 않게)
acrostic: "내비석어디"

# 날아간 기록 (비석의 세 줄). 이름은 조각이 아니라 이름표로 새긴다 (name 또는 alias 중 하나, 대소문자 무관).
# date: 그날 (yyyy-MM-dd). 비워 두면 서버에 기록된 가장 이른 첫 접속 날 + 12일 (13일째) 로 한 번 정해 저장한다 (eco.kv secret.newcomer.truth.date)
truth:
  name: rmama
  alias: ["그믐"]
  date: ""
  what: "꺼지지 않는 등불"

# 증인으로 서명한 한 사람에게: 숨은 칭호와, 비석 마지막 줄의 이름. 돈 없음
rewards:
  money: 0
  title: economy:witness

# 서명할 때 모두에게 뜨는 공지 ({date} = 그날, {name} = 그의 이름). 다른 비밀의 공지와 같은 모양, 다만 그날 날짜로
announce: "<dark_gray>〔{date}〕 {name}님이 숨은 비밀을 풀었습니다."

# 밤마다 한 번 들어온다 (모두에게 보이는 가짜 입장 줄 → 질문 다섯 개). 나갔다는 줄은 없다. 다음 밤에 그냥 또 "들어온다".
# 입장 줄은 하룻밤에 딱 한 번만 뜬다: 방문 도중 서버가 다시 켜지거나 사람이 모두 나갔다 들어와도, 그는 (나간 적이 없으므로) 입장 줄 없이 남은 질문만 이어서 한다.
# /관리자 비밀 시작 새로온사람 (테스트 모드가 아닐 때) = 지금 열려 있는(또는 다음에 열릴) 밤의 방문을 앞당겨 하는 것 → 그 밤에는 또 오지 않는다.
visit:
  # [시작 시, 끝 시) 한국 시간. [20, 2] = 20:00 ~ 01:59. 이 안의 한 분(分)이 날짜로 정해짐 (같은 날짜면 늘 같은 분 → 재시작해도 두 번 오거나 건너뛰지 않음)
  hours: [20, 2]
  # 그 분을 정하는 씨앗 (바꾸면 매일의 시각이 달라짐)
  seed: 13
  # 접속자가 이만큼은 있어야 옴. 그 시각에 모자라면 같은 밤 안에서 사람이 생길 때까지 기다림 (질문 도중에 모자라지면 멈췄다가, 다시 차면 입장 줄 없이 이어서)
  min-online: 1
  # 진짜 플레이어가 막 들어온 직후(초)에는 들어오지 않음 (같이 들어온 것처럼 보이지 않게)
  after-join-seconds: 45
  # 입장 줄 → 첫 질문 [최소, 최대] 초
  first-gap-seconds: [40, 90]
  # 질문 사이 [최소, 최대] 초 (매번 무작위)
  gap-seconds: [70, 160]
  # 테스트 모드 · 장면에서의 간격(초)
  test-gap-seconds: 5
  # 질문 속 {time} 자리에 들어가는 말: [새벽 0~4시, 밤 20~23시, 그 밖의 시간]
  time-words: ["이 새벽에", "이 밤에", "이 시간에"]

# ─── 그의 질문 ───────────────────────────────────────────────────────────────────────────
# 밤마다 글자(내 · 비 · 석 · 어 · 디)마다 목록에서 하나씩 골라, 그 순서로 다섯 번 묻는다. 고르는 것은 날짜로 정해진다
# (같은 밤이면 늘 같은 다섯 → 방문 도중 서버를 다시 켜도 같은 질문을 이어서 함). 앞의 사흘 밤에 한 질문은 고르지 않는다 (목록이 7줄 이상일 때).
# 규칙 (안 맞으면 켤 때 경고 + 빼고 읽음):
#   - 그 글자로 시작하고 "?" 로 끝난다 ("??" 도 됨). 그가 하는 말 중 "?" 로 끝나는 것은 이 다섯 줄뿐이다 — 잡담 · 오타 정정에는 "?" 를 쓰지 않는다.
#   - 비석 · 기념비 · 돌 · 열세 번째처럼 답을 알려 주는 말은 쓰지 않는다. 섬뜩함은 아주 가끔, 티 안 나게.
#   - 진짜 뉴비가 채팅 치듯: 반말 섞인 해요체, 마침표 없음, 띄어쓰기 조금 틀려도 됨, ㅋㅋ · ㅎㅎ · ㅠ 가끔. 서버에 있는 것(직업 · 상점 · 땅 · 낚시 · 마을버스 · 도감 …)에 대해.
#   - {online} = 지금 접속한 진짜 사람 수, {time} = 위 visit.time-words. 첫 글자 자리에는 쓰지 않는다.
#   - { text: "…", rain: "…" } 로 적으면 본 월드에 비가 오는 동안에는 rain 쪽을 말한다 (rain 도 같은 글자로 시작하고 "?" 로 끝날 것).
# 줄을 더하려면 그 글자 목록에 한 줄 넣고 /관리자 리로드. 글자마다 8~12줄을 권한다 (적으면 같은 질문이 자주 돌아옴).
questions:
  내:
    - "내일도 이 시간에 사람 있어요?"
    - "내일도 {time} 들어오시는 분 있어요?"
    - "내 땅 사려면 돈 얼마나 모아야돼요?"
    - "내구도 다 된 곡괭이 고칠수 있나요?"
    - "내 직업 레벨은 어디서 봐요?"
    - "내 닉네임 한글로 바꿀 수 있어요??"
    - "내가 캔 광석 그냥 상점에 팔면 되는거죠?"
    - "내려가는 엘레베이터 같은거 만들 수 있어요?"
    - "내일 아침에 뭐 초기화 되는거 있어요?"
    - "내 집 옆에 다른 사람이 땅 사면 어떻게 돼요?"
    - "내일 저녁엔 {online}명보다 많이 와요?"
  비:
    - { text: "비 오면 낚시 더 잘돼요?", rain: "비 오는데 지금 낚시하면 뭐 더 잘 잡혀요?" }
    - { text: "비 맞으면 작물 더 빨리 자라요?", rain: "비 오는데 밭에 물 안 줘도 되나요?" }
    - { text: "비 오면 몹 더 많이 나와요?", rain: "비 오니까 몹 갑자기 많아진거 같은데 원래 그래요?" }
    - "비싼 물고기는 어디서 잡혀요?"
    - "비료 같은거 따로 팔아요?"
    - "비행기 같은 것도 탈 수 있어요??"
    - "비싸게 팔리는 작물 뭐에요?"
    - "비추하는 직업 있어요?"
    - "비상금 땅 금고에 넣어놔도 돼요?"
    - "비슷한 물고기 많던데 도감엔 다 따로 들어가요?"
    - "비트 씨앗은 어디서 구해요?"
  석:
    - "석탄 왜케 안보이죠 ㅠ 어디서 캐요?"
    - "석탄 상점에 팔면 얼마 쳐줘요?"
    - "석궁 쓰는 사람 있어요?"
    - "석재 많이 필요한데 상점에서 팔아요?"
    - "석영은 지옥 가야만 나와요?"
    - "석탄 캘때 곡괭이 뭐 써야 빨라요?"
    - "석류 같은 과일도 키울 수 있어요?"
    - "석탄 블록으로 만들어서 팔면 더 비싸요?"
    - "석양 질때쯤부터 몹 나와요?"
    - "석탄 말고 철은 몇층에서 많이 나와요?"
    - "석상 같은 장식도 살 수 있어요?"
  어:
    - "어디서 돈 제일 많이 벌어요??"
    - "어떤 직업이 초보한테 제일 좋아요?"
    - "어부 레벨 올리기 많이 힘들어요?"
    - "어 근데 여기 밤에 몹 나와요?"
    - "어떻게 하면 마을버스 기사 할 수 있어요?"
    - "어디서 길라잡이 다시 볼 수 있어요?"
    - "어 메뉴 여는 키가 뭐였죠?"
    - "어느 정도 모아야 땅 살 수 있어요?"
    - "어항에 물고기 넣어서 키울 수 있어요?"
    - { text: "어부 하면 통발도 꼭 써야돼요?", rain: "어 비 오네 이럴때 낚시하면 좋아요?" }
    - "어디가 사람 제일 많이 모여요?"
    - "어제 들어오신 분들은 오늘 안 오세요?"
  디:
    - "디스코드 같은거 있나요?"
    - "디코 방 있으면 링크 받을 수 있어요?"
    - "디저트 같은 요리도 만들 수 있어요?"
    - "디버프 걸렸는데 이거 뭐에요??"
    - "디엠은 어떻게 보내요?"
    - "디펜스 같은 미니게임도 있어요?"
    - "디아블로처럼 장비 강화도 돼요?"
    - "디테일하게 집 지으려면 건축월드 가야돼요?"
    - "디자인 이쁜 집 구경할 만한 데 있어요?"
    - "디폴트 스킨이면 치장 안 보여요?"

# 치는 속도: 말을 정하고 나서 채팅에 뜨기까지 = 생각하는 시간 [최소, 최대] 초 + 글자 수 ÷ 초당 [최소, 최대] 글자 (띄어쓰기는 반 글자), 전체에 ±10%.
# 질문은 visit.gap-seconds 에 이 시간이 더해지고, 잡담 · 귓속말 답은 이 시간만큼 걸린다
typing:
  think-seconds: [1.5, 4]
  chars-per-second: [4, 7]

# 오타: 질문을 칠 때 chance 확률로 한 글자를 잘못 치고 (옆 자판 · 받침 빠짐 · 두 글자 바뀜, 첫 글자는 절대 안 건드림), 곧바로 아래 중 한 줄로 고친다.
# {word} = 원래 쓰려던 낱말 (예: "*캐요"). 이 줄들에는 "?" 를 쓰지 않는다
typo:
  chance: 0.08
  fix:
    - "*{word}"
    - "*{word}"
    - "{word}*"
    - "아 오타"
    - "오타 ㅋㅋ"
    - "*{word} 오타.."

# ─── 잡담: 그가 "접속해 있는" 동안 진짜 채팅에 가끔 대꾸한다 ─────────────────────────────────────
# 접속해 있는 동안 = 방문 중, 그리고 다섯 번째 질문 뒤 linger-seconds (30분) 동안 (끝날 때 졸린 한 줄 → 그 뒤로는 조용해진다. 나가지는 않는다).
# 모든 말에 대꾸하지 않는다: min-gap-seconds 에 한 번, 하룻밤 max-per-night 번까지. 같은 사람에게 same-player-seconds 안에 두 번 연달아는
# 대꾸하지 않는다 (그의 이름을 부르면 예외). 길라잡이 중인 사람의 채팅은 읽지 않는다. 최근에 한 말(recent 줄)은 되도록 다시 하지 않는다.
chat:
  linger-seconds: 1800
  # linger-seconds 가 끝날 때 (= 조용해지기 직전) 공개 채팅에 한 번 치는 졸린 한 줄. 그 밤 그의 마지막 말이다 (그 뒤로는 아무 대꾸도 없음; 나가지는 않으므로 퇴장 줄은 없다).
  # 삐진 밤 · 접속한 진짜 사람이 없을 때는 없음. 하룻밤 한 번 (저장됨: 재시작해도 두 번 안 함), 전날 밤에 한 줄은 피함. 치는 시간도 다른 말과 같다. "?" 금지
  tired:
    - "아 졸리다 ㅠ"
    - "오늘은 여기까지 해야겠다 피곤하네요"
    - "눈이 감기네요 ㅋㅋ"
    - "저 잠깐 쉬어야겠어요 너무 피곤해요"
    - "하암.. 오늘 수고하셨어요"
    - "졸려서 손가락이 안움직여요ㅋㅋ"
    - "아 벌써 시간이 이렇게 됐네"
    - "오늘 많이 배웠어요 감사합니다 ㅎㅎ"
    - "피곤하다.. 내일 또 물어볼게요"
    - "하품 계속 나와요 ㅋㅋ"
    - "다들 좋은 밤 되세요"
  # 그의 질문 뒤 이만큼(초) 안의 말 = 그에게 하는 대답 (answer). 그가 무슨 말이든 한 뒤 이만큼 안의 말 = 그에게 하는 말 (addressed)
  answer-window-seconds: 40
  min-gap-seconds: 15
  max-per-night: 6
  same-player-seconds: 40
  recent: 8
  # 진짜 플레이어가 들어오면 이 확률로 [최소, 최대] 초 뒤 인사 (greet 의 lines)
  join-chance: 0.5
  join-delay-seconds: [4, 10]
  # 테스트 모드 · 연출: 대꾸 사이 최소 초, 질문이 끝난 뒤 남아 있는 초 (하룻밤 횟수 제한은 없음, 확률은 늘 100%)
  test-min-gap-seconds: 5
  test-linger-seconds: 120
  # 의도: 위에서부터 차례로 보고 처음 맞는 하나. match = 정규식 목록 (대소문자 무시, 줄 안 어디든; {name} = 그의 이름에서 _ 를 뺀 것).
  #   addressed: true = 그에게 하는 말일 때만 (이름을 부름, 또는 그가 말한 뒤 answer-window-seconds 안)
  #   answer: true = 그의 질문 바로 뒤일 때만 (질문 하나에 한 번)
  #   chance = 맞았을 때 대꾸할 확률. lines 중 하나 (최근에 한 말은 피함).
  #   follow = follow-chance 확률로 조금 뒤 한 줄 더. slip = slip-chance 확률로 lines 대신 (아주 가끔, 살짝 이상한 말).
  #   hush-seconds = 대꾸한 뒤 이만큼 아무 말도 안 함
  # 여기의 모든 줄에는 "?" 를 쓰지 않는다 (있으면 빼고 읽음). 줄을 더하려면 lines 에 넣고 /관리자 리로드
  intents:
    # 욕 = 잡담이 아니라 "삐짐" (아래 sulk). match = 욕 목록, lines = 그가 치는 상처받은 한 줄 (공개 채팅이면 채팅으로, 귓속말이면 귓속말 답으로).
    # 그 뒤 그 밤에는 질문 · 잡담 · 귓속말 답이 없다. 퇴장 줄은 뜨지 않는다 (서버는 그가 나갔다고 말한 적이 없다 — 엔딩 때 단 한 번뿐).
    # match 는 "느슨하게 읽은 줄" 에서 찾는다: 소문자, 글자(한글 · 자모 · 영문)가 아닌 것(띄어쓰기 · 점 · 숫자 · 기호)은 모두 끊김,
    # 한 글자짜리 조각이 이어지면 붙여 읽음 ("시 발", "ㅅ.ㅂ", "ㅅ1ㅂ", "병1신" → 시발 · ㅅㅂ · ㅅㅂ · 병신; "다시 발견" 은 두 낱말 그대로).
    # 낱말 사이 띄어쓰기는 하나로 남으므로 띄어 쓸 수 있는 곳은 " ?" 로 적는다. 아래 sulk.allow 를 먼저 빼고 찾는다.
    # chance · addressed · hush 는 쓰지 않는다 (그를 향한 욕이면 늘 삐짐: 그를 향하는지는 sulk.aim · sulk.window-seconds)
    rude:
      match:
        - "시발|씨발|씨빨|시빨|시벌|씨벌|시팔|씨팔|씨바ㄹ|시바ㄹ|ㅅㅂ|ㅆㅂ|ㅅ발|ㅆ발|시ㅂ|씨ㅂ|tlqkf|ssibal|sibal"
        - "병신|븅신|빙신|ㅂㅅ|ㅄ|qudtls"
        - "꺼져(?! ?(있|서|버|도|야|요|가|ㅆ))|꺼지라고|꺼지세요|꺼질래|ㄲㅈ"
        - "닥쳐|닥치라고|닥치세요|닥칠래|ㄷㅊ"
        - "좆|ㅈ같|ㅈ까|조까"
        - "(존나|졸라|ㅈㄴ) ?(짜증|시끄|귀찮|못하|멍청|한심|답답|노잼|재미없|별로|이상)"
        - "미친 ?(놈|넘|새끼|년|것)"
        - "새끼|섀끼|쌔끼|색끼|ㅅㄲ|개새(?![로롭벽해우집])|개색"
        - "지랄|ㅈㄹ|염병"
        - "엿 ?먹"
        - "죽어(라|버려|버리|$)|죽을래|(뒤|디)져(라|버려|$)|(뒤|디)질래"
        - "짜증나게 ?(하|굴|좀|구|만)"
        - "저리 ?가(?!면|서|요|니|는|야)"
        - "^ㅗ+$|ㅗㅗ"
      addressed: true
      answer: false
      chance: 1
      lines: ["아.. 네", "…죄송해요 저 갈게요", "저 그냥 나갈게요", "아 네.. 알겠어요",
              "그렇게까지 말할 필요는", "아.. 저 갈게요", "넵.. 죄송해요", "…저 오늘은 그만 할게요"]
      follow: []
      follow-chance: 0
      slip: []
      slip-chance: 0
      hush-seconds: 0
    bot:
      match: ["봇|bot|가짜|npc|엔피씨|귀신|유령|매크로|인공지능|\\bai\\b|사람 맞|사람이야|사람임"]
      addressed: true
      answer: false
      chance: 0.9
      lines: ["ㅋㅋㅋ 아니에요", "사람이에요 ㅠ", "ㅋㅋㅋㅋ 봇 아님", "저 사람인데요 ㅠㅠ", "아닌데 ㅋㅋ", "ㅋㅋㅋ 왜요"]
      follow: []
      follow-chance: 0
      slip: ["ㅋㅋ 그 말 예전에도 들었어요", "그런 말 진짜 오랜만에 듣네요", "ㅋㅋ 저 여기 꽤 오래 있었는데", "저 예전엔 좀 이상했죠 ㅋㅋ"]
      slip-chance: 0.1
      hush-seconds: 0
    meet:
      match: ["좌표|어디야|어디세요|어디 ?계세요|어디 ?계신|어디심|어디임|어디에 ?있어|tpa|티피|텔포|같이 ?하|같이 ?놀|같이 ?갈|놀러|찾아 ?갈|만나요|만날래|데리러"]
      addressed: true
      answer: false
      chance: 0.9
      lines: ["아 저 지금 좀 멀리 있어요", "나중에 같이해요 ㅎㅎ", "저 길 잃어서 ㅋㅋ 여기가 어딘지 모르겠어요",
              "좀 이따가요 ㅠ 지금 뭐 하는중이라", "아 괜찮아요 혼자 해볼게요 ㅎㅎ", "저 아직 많이 헤매는 중이라 ㅠ"]
      follow: []
      follow-chance: 0
      slip: []
      slip-chance: 0
      hush-seconds: 0
    name:
      match: ["{name}", "십삼", "뉴비", "누구세요|누구야|누구지|누구임|누구심|누군데", "새로 ?오신|새로 ?온|처음 ?보는|처음 ?오셨"]
      addressed: false
      answer: false
      chance: 0.85
      lines: ["저 들어온지 얼마 안됐어요", "그냥 뉴비에요 ㅎㅎ", "아 저요 ㅋㅋ 그냥 구경중이에요", "아직 아무것도 몰라요 ㅠ",
              "새로 왔어요 잘 부탁드려요", "저 그냥 지나가다 들어왔어요 ㅎㅎ"]
      follow: []
      follow-chance: 0
      slip: []
      slip-chance: 0
      hush-seconds: 0
    greet:
      match: ["^(ㅎㅇ|ㅎㅇㅎㅇ|하이|하잉|안녕|안냐|ㅂㄱ|반가|hi\\b|hello)", "안녕하세요|반가워|반갑습니다|하이요"]
      addressed: false
