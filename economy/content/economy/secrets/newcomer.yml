# 그에게 귓속말 (/w · /msg · /tell <이름> <말>). 그가 한 번이라도 다녀간 뒤에만 닿는다 (그 전 · 꺼짐 · 풀린 뒤에는 게임이 평소처럼 "플레이어를 찾을 수 없습니다")
whisper:
  # 귓속말 명령어 (minecraft: 가 붙은 것도 같이 읽음). 서버에 한글 별칭 명령어가 생기면 여기에 추가
  commands: [w, msg, tell]
  # 한 사람에게 답 하나를 준 뒤 이만큼(초)은 무엇을 보내도 답이 없음. 답이 오기까지는 typing 의 치는 속도만큼 걸림
  cooldown-seconds: 20
  # 비석 앞이 아닐 때의 답: 위 chat.intents 와 같은 모양 (addressed · answer 는 쓰지 않음). 위에서부터 처음 맞는 하나, chance 를 넘지 못하면 답 없음.
  # 귓속말은 그 사람에게만 가므로 "?" 를 써도 된다. stone (비석 · 돌 이야기) 에는 절대 "맞다" 고 하지 않는다: 되묻거나, 모르는 척하거나, 말이 없다
  intents:
    stone:
      match: ["비석|기념비|돌|무덤|묘|열세|13번|이름 없"]
      chance: 0.6
      lines: ["…돌이요?", "…잘 모르겠어요."]
    bot:
      match: ["봇|bot|가짜|npc|엔피씨|귀신|유령|매크로|\\bai\\b|사람 맞|사람이야|사람이에요|살아|죽었"]
      chance: 1
      lines: ["ㅋㅋ 아니에요", "사람이에요 ㅠ", "저 봇 아니에요 ㅠㅠ", "…왜 다들 그렇게 물어보세요."]
    where:
      match: ["어디|좌표|위치|tpa|티피|텔포|같이|만나|찾아"]
      chance: 1
      lines: ["아 저 지금 좀 멀리 있어요", "여기가 어딘지 잘 모르겠어요 ㅠ", "나중에 같이해요 ㅎㅎ"]
    who:
      match: ["누구|뉴비|정체|이름|뭐하는|뭐해|뭐 해"]
      chance: 1
      lines: ["그냥 새로 온 사람이에요", "아 저 뉴비에요 ㅎㅎ", "저 들어온지 얼마 안됐어요"]
    greet:
      match: ["안녕|ㅎㅇ|하이|반가|hello|hi\\b"]
      chance: 1
      lines: ["아 안녕하세요", "앗 안녕하세요 ㅎㅎ", "…안녕하세요."]
    # 그 밖의 모든 말 ("." = 아무 글자)
    other:
      match: ["."]
      chance: 1
      lines: ["아 죄송해요 제가 아직 잘 몰라서요", "앗 네네", "음 잘 모르겠어요 ㅠ", "넵", "아 그렇구나", "ㅎㅎ", "…네."]
  # 여러 밤에 걸쳐 귓속말해 온 사람에게: after-nights 번째 밤부터 답의 chance 만큼이 이 중 하나로 바뀐다 (stone 의 답은 그대로). 조용히, 조금 이상하게
  strange:
    after-nights: 3
    chance: 0.15
    lines:
      - "…저 계속 여기 있었는데요."
      - "…어제도 물어보셨잖아요."
      - "…매일 오시네요."
      - "…저 아직 여기 있어요."
      - "…그 말 전에도 하셨어요."
  # 다른 (열세 번째가 아닌) 비석 앞일 때
  wrong-stone: "…그건 제 게 아니에요."

# ─── 삐짐: 욕을 들으면 한 줄 치고 그 밤에는 말이 없다 ───────────────────────────────────────────
# 공개 채팅: 그가 "접속해 있는" 동안 (방문 중 · 마지막 질문 뒤 chat.linger-seconds), 그를 향한 욕일 때만.
#   그를 향함 = 그의 이름이 있음, aim 중 하나가 있음, 또는 그가 무슨 말이든 (질문 · 잡담) 한 뒤 window-seconds 안.
# 귓속말: 그에게 보낸 욕은 언제든 (낮이어도) 삐짐. 답은 귓속말로 그 사람에게만 가고, 그 밤은 모두에게 끝 (공개 채팅에는 아무 말도 없음).
#   그의 비석 앞에서 보낸 귓속말도 욕이면 엔딩 대신 삐짐. 욕이 아니면 삐진 밤에도 비석 앞 귓속말로 엔딩은 그대로 된다.
# 삐진 뒤: 남은 질문 없음, 잡담 · 인사 없음, 귓속말은 보낸 사람의 말만 뜨고 답이 없다 (자리를 비운 사람에게 귓속말한 것처럼). 퇴장 줄은 없다.
#   재시작 · 접속자 부족으로 멈췄다 다시 차도 · 관리자 시작으로도 그 밤에는 돌아오지 않는다. 삐짐은 그 밤 창이 닫힌 뒤에도 다음 밤 창이 열릴 때까지 이어진다
#   (창 밖, 낮에 귓속말로 욕하면 그날 밤에 오지 않는다). 다음 밤에는 평소처럼 입장 줄과 함께 온다.
# 테스트 모드인 사람의 귓속말 · 그 사람에게만 보이는 방문에서의 욕은 그 사람에게만 삐진다.
sulk:
  window-seconds: 40
  # 욕처럼 보이지만 욕이 아닌 말 (욕을 찾기 전에 먼저 뺀다; 정규식, 느슨하게 읽은 줄에서)
  allow:
    - "시발점|시발역|시발택시|시발 ?자동차"
    - "병신년|병신 ?년도|병신 ?정변|병신 ?양요"
    - "새끼 ?(고양이|강아지|돼지|여우|늑대|거북|오리|양|소|말|곰|판다|닭|토끼|동물|몹|손가락|발가락|줄)"
    - "(고양이|강아지|돼지|여우|늑대|거북|오리|곰|판다|닭|토끼|동물|몹|새|물고기) ?새끼"
    - "새끼를 ?낳|새끼 ?낳|새끼 ?쳤|새끼 ?치"
    - "호박엿"
  # 그를 가리키는 말 (정규식; 줄을 소문자로, 글자 아닌 것은 띄어쓰기 하나로 바꾼 뒤 찾음). 그의 이름은 따로 늘 셈
  aim:
    - "뉴비"
    - "(^| )(너|넌|너가|네가|니|니가|얘|얘는|쟤|님|님아)( |$)"
    - "너 ?같|니 ?같|너 ?따위|니 ?따위"
  # 삐진 다음 밤 (입장 줄이 뜨는 밤), 이 확률로 첫 질문 전에 한 줄 ("?" 금지)
  sorry-chance: 0.3
  sorry: ["어제는 죄송했어요", "어제 그냥 가서 죄송해요", "아 어제는 제가 좀..", "어제 일은 신경 쓰지 마세요"]

# 비석 앞 = 그 돌에서 이만큼(칸) 안. 돌들이 촘촘히 서 있으므로, 그의 돌이 범위 안이고 가장 가까운 돌보다 slack 칸 넘게 멀지 않으면 그의 돌 앞으로 침
stone:
  range: 3.5
  slack: 0.4

# 엔딩: 그 비석 앞에서 처음 귓속말한 사람에게만 (약 38초). 마지막 줄 뒤에야 모두에게 "…님이 나갔습니다" 가 뜬다 (처음이자 마지막)
ending:
  # 귓속말한 뒤 첫 답까지(초), 답 사이(초)
  lead-seconds: 3
  gap-seconds: 5
  # 도중에 비석에서 이만큼(칸) 넘게 멀어지거나, 다른 월드로 가거나, 죽거나, 나가면 엔딩이 멈춘다. 아무것도 저장되지 않고 (풀린 것 아님),
  # 그 비석 앞에서 다시 귓속말하면 처음부터. 멈출 때 그가 남기는 한마디 (비우면 "" 아무 말 없음; 나간 사람에게는 보내지 않음)
  leave-range: 12
  left: "…아, 가시네요."
  # 그동안 주변 소리를 끊음 / 맨돌에서 먼지가 떨어짐
  quiet: true
  dust: true
  # 시야 가장자리에, 비석 너머에 서 있는 사람 (그 사람에게만 보임, 똑바로 쳐다보면 없음). figure-line 번째 답과 함께 나타남
  figure: true
  figure-line: 3
  figure-look-degrees: 15
  # 머리 위에 그의 이름
  figure-name: true
  # 비우면 기본 스킨. 리소스팩 스킨을 쓰려면 "economy:entity/…" (팔이 가늘면 끝에 " slim")
  figure-skin: ""
  # {player} = 듣는 사람의 이름 (닉네임이 있으면 닉네임)
  lines:
    - "…찾았네요."
    - "…그거, 제 거 맞아요."
    - "…저 예전에 여기서 뭘 하나 풀었거든요. 아무도 없을 때. 공지도 안 떴고, 비석에 이름도 안 새겨졌어요."
    - "…그래서 매일 다시 들어왔어요. 누가 물어봐 줄까 봐."
    - "…질문은 제가 했는데, 답은 {player}님이 해 주셨네요."
    - "…이제 {player}님이 열세 번째예요."
    - "…저는 이제 나가 볼게요. 처음으로."

# 영구 특전: 푼 사람이 서버를 나갈 때 "…님이 나갔습니다" 줄이 뜨지 않는다 ("나가지 않는 사람" 을 물려받음). 입장 줄은 그대로 뜬다.
# 끄려면 false (이 비밀을 끄기 해도 이 특전은 남으므로, 없애려면 여기서 끌 것). 서버초기화 로 푼 사람 기록을 지우면 특전도 같이 사라진다.
# 숨긴 퇴장은 콘솔에 "[비밀] <이름> 이(가) 나갔습니다 (새로 온 사람 특전 …)" 으로 남는다 (게임의 "lost connection" 줄도 그대로).
