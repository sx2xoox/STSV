# 숨은 비밀: 새벽 단골 (운영자 문서: docs/admin/숨은_비밀/새벽단골.md · README 에는 일부러 적지 않음)
# 편의점 야간 근무를 오래 한 사람에게만. 게임 시각 새벽에 조용한 아저씨가 들어와 바나나우유 하나를 동전으로 딱 맞춰 사 감 (하루에 한 번).
# 나가서는 바깥 파라솔 탁자에 빨대 꽂은 병을 두고 사라짐 (아무도 마시지 않음). 네 번 오는 동안 조금씩 말함:
# 오래전 이 가게의 야간 알바였고, 퇴근하면 파라솔에서 기다리던 딸에게 바나나우유 하나를 건넸다는 것.
# 네 번째 날 병을 계산대에 두고 "곧 올 사람한테 건네 달라" 하고 감 → 곧 밤샘 근무를 마친 간호사 (그 딸) 가 들어옴 → [건네기] 면 끝.
# 연출은 그 근무자에게만 의미가 있음 (손님은 가게의 다른 사람에게도 보이지만 말은 평범한 손님처럼 짧게).
# 테스트 모드 (/관리자 비밀 테스트): 시각 · 확률 · 밤 손님 수 · 하루 한 번 조건 없음 (야간 근무가 아니어도 됨).
enabled: true
# 기념비에 비석을 세우지 않음 (새로 온 사람이 열세 번째 비석으로 남도록)
stone: false

start:
  # 편의점에서 밤 (store.yml night.from ~ to) 에 받은 손님 수가 이만큼 넘어야 (평생 합)
  night-served: 150
  # 게임 시각 이 사이 (새벽)에만, 야간 근무 (밤에 출근한 근무) 중에만
  hours: {from: 3, to: 5}
  # 그때 30초마다 시작될 확률
  chance: 0.25
# 시작한 뒤 두 번째부터 네 번째 방문: 새벽에 30초마다 이 확률 (하루에 한 번까지)
visit-chance: 0.5

# 그 사람: 버스 손님 종류 (몸집 · 걸음), 스킨, 이름표, 사 가는 것 (store.yml 상품 id)
kind: worker
skin: "economy:entity/bus/night_regular"
name: "<#8a8f99>새벽 손님"
item: banana_milk

# 방문마다 대사 (enter 들어올 때 · browse 고를 때 · pay 계산대에서 · thanks 나갈 때), after = 나간 뒤 근무자에게만 한 줄
visits:
  1:
    enter: ["…"]
    browse: ["(냉장고 앞에 한참 서 있다)"]
    pay: ["(동전을 하나씩 센다) …천칠백 원."]
    thanks: ["…고맙습니다."]
    after: "<dark_gray><i>…창밖 파라솔 탁자에 바나나우유가 놓여 있다. 빨대가 꽂힌 채로."
  2:
    enter: ["…아직 문 열었네."]
    browse: ["(늘 같은 칸으로 손을 뻗는다)"]
    pay: ["이거 하나요. 늘, 이거 하나."]
    thanks: ["야간… 힘들죠. 나도 해 봐서 알아요."]
    after: "<dark_gray><i>…파라솔 탁자의 바나나우유는 이번에도 그대로다."
  3:
    enter: ["…오늘은 좀 늦었네."]
    browse: ["(냉장고 유리에 비친 자기 얼굴을 본다)"]
    pay: ["딸애가 이걸 좋아했어요. 저 밖 파라솔에서… 퇴근할 때까지 기다리곤 했지."]
    thanks: ["그 애가 기다릴 텐데. …아니, 이제는 안 기다리겠구나."]
    after: "<dark_gray><i>…그 아저씨가 입은 조끼, 어디서 본 것 같다. 이 가게의 옛날 조끼."
  4:
    enter: ["…오늘은 부탁이 있어서 왔어요."]
    browse: ["(바나나우유를 두 손으로 집는다)"]
    pay: ["이거… 곧 올 사람한테 좀 건네줄래요? 나는 못 기다릴 것 같아서."]
    thanks: ["…고마워요. 정말로."]
    after: "<dark_gray><i>…계산대 위에 바나나우유가 남아 있다. 아직 차갑다."

# 마지막에 오는 사람 (그 딸): 밤샘 근무를 마친 간호사. 계산대에 와서 버튼 둘 (건네기 · 그냥 인사)
daughter:
  kind: nurse
  name: "<#c9b8a6>새벽 손님"
  enter: ["(딸랑) …아, 안녕하세요."]
  pay: ["…여기, 아직 그대로네요."]
  buttons:
    give: "바나나우유 건네기"
    greet: "어서 오세요"
  # 건네면 (한 줄씩), 그 뒤 파라솔에 그 아저씨가 잠깐 보였다 사라짐
  give:
    - "…이거, 어떻게…"
    - "아빠가 야간 끝나면 늘 이거 하나 사 왔어요. 저 파라솔에서 기다렸거든요."
    - "오늘이 아빠 기일이라… 새벽에 한번 와 보고 싶었어요."
    - "…고맙습니다. 오늘 같은 날, 이게 있을 줄은 몰랐어요."
  # 그냥 인사하면: 그냥 나감 (다음 새벽에 그 아저씨가 다시 와서 네 번째 방문부터)
  greet: ["…아니에요. 그냥, 지나가다가.", "(냉장고 쪽을 한 번 보고 나간다)"]
ending: "<dark_gray><i>…창밖 파라솔에 누가 앉아 있었던 것 같다. 고개를 한 번 끄덕이고, 새벽 속으로."

# 서버에서 처음 푼 한 사람에게
rewards:
  money: 0
  title: economy:dawn_regular
  items: ["economy:store_food_banana_milk 1"]

solved-line: "<dark_gray>어느 편의점 파라솔 탁자에서, 오래 기다리던 바나나우유가 드디어 주인을 찾았다."
too-late: "<dark_gray>…파라솔 탁자는 비어 있다. 누군가 먼저 건넸다."
