# 숨은 비밀: 분실물센터 (운영자 문서: docs/admin/숨은_비밀/분실물센터.md · README 에는 일부러 적지 않음)
# 분실물센터에는 끝내 주인이 나타나지 않은 물건이 딱 하나 있다: 주인 이름이 지워진 열쇠.
# 그 주인은 기사 자신 — 오래전 잃어버린 "처음의 나". 정류장에서 열쇠가 딸랑일 때마다 기다리는 손님들이 그 사람 이야기를 수군거린다.
enabled: true

start:
  # 손님이 분실물을 두고 내릴 때마다 그것이 대신 이 열쇠일 확률 (bus.yml events.lost 의 확률을 먼저 통과한 뒤). 테스트 모드 = 100%
  chance: 0.05
  # 분실물을 이만큼 주인에게 돌려준 기사만 (eco.kv bus.lost.back.<uuid>). 테스트 모드에서는 무시
  returns: 30

# 서버에서 처음 푼 한 사람에게. 돈 대신 하나뿐인 것: 칭호, 이름이 돌아온 열쇠, 금색 명판, 내 버스의 열쇠 장식
rewards:
  money: 0
  title: economy:lost_finder

solved-line: "<dark_gray>누군가 분실물센터의 마지막 물건을 찾아갔다. 이제 그 선반은 비어 있다."
too-late: "<dark_gray>…보관함은 비어 있다. 누군가 먼저 찾아갔다."

# 4번째 단서 "종점에서 한참 서 있었대": 노선 끝 정류장 베이에 이만큼(초) 서 있어야 딸랑
stand-seconds: 15
# 열쇠를 이만큼(초) 지니지 않으면 (상자에 넣어 두는 등) 주머니로 돌아옴. 버리기(Q)는 처음부터 안 됨
return-after: 120

# 열쇠를 지닌 채 운전하는 동안 가끔 일어나는 일 (빈 버스의 하차 벨 · 목록의 이름 없는 손님 · 빈자리의 희미한 사람)
dread:
  # 다음 일까지 [최소, 최대] 초 (테스트 모드: test-every)
  every: [480, 960]
  test-every: [20, 40]
  # 아무 때나 /버스 를 볼 때 이름 없는 손님 줄이 섞일 확률, 그리고 "빈손님" 일 뒤에 그 줄이 보이는 시간(초)
  ghost-row: 0.06
  ghost-window: 40

# 마지막: 집(첫 땅 → 침대 · 리스폰 → 처음 온 곳 → 스폰)에 나타나는 보관함
locker:
  show-range: 48
  open-range: 5

# 정류장 특성 단서 (2번째): 위에서부터 이 순서로, 정류장을 가르는 특성 중 한 사람마다 하나.
# 열쇠 주인은 손님이 아니라 기사였다: 수군거림은 모두 운전석에서 본 말로 (탔대 · 내렸지 · 앉았대 같은 손님의 말은 쓰지 않음)
tags:
  sea: "…바다가 보이는 정류장에서는 늘 문을 늦게 닫았지."
  mountain: "…산이 바로 뒤에 있는 정류장에서는 늘 문을 늦게 닫았지."
  forest: "…나무가 빽빽한 정류장에서는 늘 문을 늦게 닫았지."
  field: "…들판 한가운데 정류장에서는 늘 문을 늦게 닫았지."
  village: "…집들이 모여 있는 정류장에서는 늘 문을 늦게 닫았지."
  port: "…배가 들어오는 정류장에서는 늘 문을 늦게 닫았지."
plain: "…아무것도 없는 정류장. 표지판뿐인 곳에서도 늘 문을 늦게 닫았지."

key:
  # 분실물처럼 보이는 설명 ({found} = 열쇠를 주운 정류장, {heard} = 마지막으로 들은 말)
  lore:
    - "<gray>누군가 두고 내린 열쇠"
    - "<white>???</white> <gray>정류장에 돌려주기"
    - "<gray>남은 시간 <white>???"
    - "<gray>주운 곳 <white>{found}"
    - "<dark_gray><i>“{heard}”"
    - "<dark_gray>팔 수 없음 · 주인을 찾을 때까지"
  # 푼 뒤: 이름이 돌아온 열쇠 (영구, 상점에 팔 수 없음)
  done-name: "<gradient:#efe2c0:#c9a26b>열쇠 <gray>— 주인: <white>{player}"
  done-lore:
    - "<gray>분실물센터의 마지막 물건."
    - "<gray>오래 기다렸지만, 주인이 찾아갔다."
    - "<dark_gray>{date}"

# 해결한 사람의 이름이 금색으로 남는 분실물 센터 (4번째 단서에서 딸랑인 종점 정류장 표지판)
plaque: "<gold>🔑 잃어버린 것을 찾는 자 <white>{player}"

# 푼 사람이 버스를 모는 동안 룸미러에 달랑거리는 작은 열쇠 (모두에게 보임). 운전석에서 [앞, 위, 오른쪽] 칸
charm:
  enabled: true
  offset: [0.8, 1.55, 0.45]
  scale: 0.32

lines:
  # 손님이 열쇠를 두고 내릴 때 (분실물 메시지를 흉내 냄)
  got: "<#c9a26b>👜</#c9a26b> {type}<gray>이(가) <white>열쇠</white>를 두고 내렸어요! <white>???</white>(탄 곳)에 <white>?</white>분 안에 세우면 돌려줘요"
  got-later: "<dark_gray>…열쇠 고리에 이름표가 달려 있다. 이름은 긁혀서 읽을 수 없다."
  rattle: "<#c9a26b>…딸랑."
  drop: "<dark_gray>…손에서 떨어지지 않는다."
  back: "<dark_gray>…주머니가 무겁다. 열쇠가 돌아와 있다."
  home: "<gray>…집에 가 봐."
  locked: "<gray>…잠겨 있다. 손에 든 열쇠가 아니면 안 될 것 같다."
  locker-tag: "<gray>보관함 <dark_gray>· 이름: <obfuscated>{name}</obfuscated>"
  end:
    - "<gray>…종이 한 장."
    - "<white>…찾아가셨네요."
  fade: "<dark_gray>보관함이 천천히 흐려진다. 열쇠 고리의 이름표에 글씨가 돌아와 있다."
  ghost-hint: "<dark_gray>…뒤에서 누가 자리에 앉는 소리."
  seat-hint: "<dark_gray>…방금, 저 자리에."

# 수군거림: 열쇠가 딸랑인 정류장에서 기다리는 손님들이 (그 사람에게만 들리게). 0 = 열쇠를 두고 내린 손님.
# {clue} = 다음 단서 줄, {jamo} {ro} = 이름 첫 글자와 조사 ("ㅅ" "으로"), {player} = 그 사람 이름
whispers:
  "0":
    - "…그 사람, 늘 첫차를 몰았대. 노선 맨 처음 정류장에서."
  "1":
    - "…들었어? 그 열쇠 주인."
    - "…이 노선 기사였대."
    - "{clue}"
  "2":
    - "…이름이 {jamo}{ro} 시작했대."
    - "…그래서 {jamo}{ro} 시작하는 정류장을 좋아했대."
  "3":
    - "…아무도 찾으러 오지 않았대."
    - "…종점에서 늘 한참 서 있었지. 분실물 센터 앞에."
  "4":
    - "…그 선반에 하나만 남았대."
    - "{clue}"
  "5":
    - "…그 사람은 지금도 운전 중이야."
    - "…지금, 이 버스를."
    - "…집에 가 봐."
# 5번째 단서 줄: 열쇠를 주운 정류장 / (그 정류장이 없어졌으면) 가장 먼저 생긴 정류장
found: "…이 열쇠가 떨어졌던 자리. 그 열쇠가 그 사람을 다시 찾아간 자리."
oldest: "…이 동네에서 제일 먼저 생긴 정류장."
# 정류장이 하나도 맞지 않을 때 (아무 정류장)
any: "…아무 데나. 어디든 그 사람이 서 있었어."

# 보관함 속 종이 (책 화면, 한 줄 = 한 줄). 모르는 기록이 든 줄은 빠짐.
# {joined} 처음 온 날 · {joined-time} 시각 · {place} 처음 온 곳 · {guess} 추정이면 "(아마)" · {sold} 처음 판 것과 개수 · {sold-date} · {player}
# {first-back} 처음으로 주인에게 돌려준 분실물과 그 손님 (기록이 생긴 뒤부터 남음; 그 전 것만 있으면 줄이 빠짐)
paper:
  title: "분실물 보관증"
  pages:
    - - "<dark_gray><b>분실물 보관증</b>"
      - ""
      - "<black>품목: 열쇠 1개"
      - "<black>주인: <obfuscated>{player}</obfuscated>"
      - ""
      - "<black>맡긴 날: {joined}"
      - "<dark_gray>  {joined-time}"
      - "<black>맡긴 곳: {place} {guess}"
      - "<black>처음 내놓은 것: {sold}"
      - "<dark_gray>  {sold-date}"
      - "<black>처음 돌려준 것: {first-back}"
    - - "<dark_gray>찾아가지 않은 물건은"
      - "<dark_gray>이것 하나뿐이었습니다."
      - ""
      - "<black>그날의 당신은"
      - "<black>아무것도 몰랐고,"
      - "<black>모든 게 처음이었죠."
      - ""
      - "<black>그동안 뒷자리에"
      - "<black>앉아 있던 것도,"
      - "<black>그날의 당신입니다."
      - ""
      - "<dark_gray>찾아간 사람: <black>{player}"
  never-sold: "아직 아무것도"
  sold: "{item} {count}개"
  guess: "<dark_gray>(아마)"
  first-back: "{owner}의 {thing}"
  first-back-plain: "누군가의 {thing}"

worlds:
  world: "마을"
  world_nether: "네더"
  world_the_end: "엔드"

# ------------------------------------------------------------------------------------------------
# 후속 임무 「주인 찾기」 (어려움) — 열쇠의 주인을 찾은 한 사람에게만, 일주일(월요일 0시 기준)에 한 번.
# 그 사람이 버스를 몰다 정류장 베이에 서면 (chance 확률) 이름이 지워진 분실물 하나가 버스에 남아 있다.
# 그 정류장에서 기다리던 손님들이 누구 것인지와 단서 두세 개를 수군거린다 (정류장 특성 · 이름 첫 글자 · 종점/첫 정류장).
# 단서에 모두 맞는 정류장 베이에 그 물건을 지닌 채 서면, 그 사람에게만 보이는 주인이 다가와 받아 가고 한마디를 남긴다 → 보상.
# 맞지 않는 정류장: 물건은 그대로, 단서 하나를 다시 들려줌. wrong-stops 곳을 틀리거나 주가 바뀌면 물건은 분실물센터 선반으로 (실패, 잃는 것 없음).
# 물건은 임무 전용 (팔 수 없음 · 버릴 수 없음 · 상자에 넣어 두면 return-after 초 뒤 다시 돌아옴), 끝나면 언제나 사라진다.
# 운영자 문서: docs/admin/숨은_비밀/분실물센터.md "후속 임무"
sequel:
  enabled: true
  # 보상 (어려움: 150,000 ~ 300,000 G). 테스트 모드는 돈을 주지 않고 금액만 보여 줌
  reward:
    money: [150000, 300000]
  # 이번 주에 아직 임무가 없을 때, 정류장 베이에 설 때마다 물건이 나타날 확률 (테스트 모드 = 100%)
  chance: 0.5
  # 틀린 정류장을 이만큼 서면 실패 (같은 정류장은 한 번만 셈; 물건이 나온 정류장은 세지 않음)
  wrong-stops: 3
  # 물건을 이만큼(초) 지니지 않으면 다시 돌아옴 (테스트 모드: test-return-after)
  return-after: 60
  test-return-after: 10
  # 최근 이만큼의 주에 나온 물건은 다시 나오지 않음
  no-repeat: 4
  # 주인을 찾아 준 뒤 이 확률로 작은 선물 하나: 그 주인(손님 종류)의 bus.yml types.<종류>.gifts 중 하나 1개,
  # 그 종류에 선물이 없으면 types 의 종류에서. 아무 데도 없으면 선물 없음. 테스트 모드 = 100%
  keepsake:
    chance: 0.2
    types: [grandma]
    line: "<dark_gray>…앉았던 자리에 무언가 놓여 있다. <gray>({item})"

  item:
    name: "<#c9a26b>이름이 지워진 {thing}"
    # 물건마다의 설명 (things.lore) 아래에 붙는 줄, 그 아래에 들은 단서 (heard, {line} = 단서 한 줄)
    lore:
      - "<gray>이름표의 이름이 문질러 지워져 있다."
      - "<dark_gray>주인이 기다리는 정류장에 싣고 가면 된다."
    heard: "<dark_gray>“{line}”"

  got: "<gray>뒷자리에 <white>{thing}</white> 하나가 남아 있다. 이름표의 이름이 문질러 지워져 있다."
  got-later: "<dark_gray>…주인이 기다리는 정류장에, 이걸 싣고 서면 된다."
  # 단서 (손님들의 수군거림). {jamo} {ro} = 정류장 이름 첫 글자와 조사 ("ㅅ" "으로")
  clues:
    tag:
      sea: "…바다가 보이는 정류장에서 기다린대."
      mountain: "…산이 바로 뒤에 있는 정류장에서 기다린대."
      forest: "…나무가 빽빽한 정류장에서 기다린대."
      field: "…들판 한가운데 정류장에서 기다린대."
      village: "…집들이 모여 있는 정류장에서 기다린대."
      port: "…배가 들어오는 정류장에서 기다린대."
    plain: "…아무것도 없는, 표지판뿐인 정류장에서 기다린대."
    initial: "…{jamo}{ro} 시작하는 정류장이래."
    first: "…노선 맨 처음 정류장이래. 첫차를 기다리나 봐."
    end: "…종점이래. 분실물센터가 있는 데."
    any: "…어디든. 어느 정류장에나 서 있대."
  # 맞지 않는 정류장에 섰을 때 ({n}/{max} = 틀린 횟수), 그리고 그곳 손님의 한마디 (뒤에 단서 하나가 다시 따라옴)
  wrong: "<dark_gray>…아무도 나서지 않는다. 여기가 아니다. <gray>({n}/{max})"
  wrong-murmur: "…그 사람은 여기서 안 기다려."
  again: "<dark_gray>…여기는 아까도 아니었다."
  drop: "<dark_gray>…남의 것이다. 버릴 수는 없다."
  back: "<dark_gray>…두고 온 줄 알았던 것이 조수석에 놓여 있다."
  # 인벤토리가 가득해서 물건을 넣어 줄 수 없을 때 (땅에 떨어뜨리지 않는다. 자리가 나면 들어옴)
  no-room: "<dark_gray>…주머니에 자리가 없다. 그것은 아직 뒷자리에 있다. <gray>(자리를 비우면 들어온다)"
  # 주인이 나타났을 때 (머리 위 이름, 받아 가는 순간)
  owner-name: "<gray>{owner}"
  taken: "<gray>{owner} — 말없이 다가와 그것을 받아 든다."
  done: "<dark_gray>…선반에 올라갈 뻔한 물건 하나가 주인에게 돌아갔다. <gray>({reward})"
  # 실패: 틀린 정류장이 wrong-stops 곳 / 주가 바뀜 (조용히)
  shelf: "<dark_gray>…세 번을 헛걸음했다. 그 물건은 분실물센터 선반으로 갔다. 다음 주에 또 누가 두고 내릴 것이다."
  shelf-quiet: "<dark_gray>…그 물건은 분실물센터 선반으로 갔다."

  # 주인의 모습을 물건마다 따로 정하려면 (리소스팩 스킨 키, 끝에 " slim"). 비우면 그 손님 종류(type)의 버스 스킨
  skins: {}

  # 물건들 (주마다 하나, 최근 no-repeat 주와 겹치지 않게). item = 모양만 빌려 올 아이템 (없으면 이름 지워진 열쇠 모양; 아이템 자체는 늘 비밀 아이템이라 팔 수 없음),
  # type = 주인의 손님 종류 (bus.yml types: 모습과 선물), owner = 주인 머리 위 이름, murmur = 처음 듣는 수군거림, thanks = 받아 가며 하는 말
  things:
    - id: umbrella
      name: 우산
      item: economy:lost_umbrella
