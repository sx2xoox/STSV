    - ""
    - "'설계자 —' 뒤의 빈자리는,"
    - "처음부터 네 이름 자리였다."

too-late: "<dark_gray>…기계는 조용하다. 누군가 먼저 심장을 넣었다."
solved-line: "<dark_gray>어딘가에서 열세 번째 기계가 숨을 쉬기 시작했다…"

# 푼 사람 (서버에서 처음 한 명). 돈은 없음: 보상은 서버에 하나뿐인 것 (칭호 · 13번째 기계 · 아래 후계 표시)
rewards:
  money: 0
  title: economy:designer_heir

# 후계 표시: 푼 사람의 기계에서 나오는 물건마다 제작자 줄이 이것으로 (그 사람만, 원래 줄 "<dark_gray>제작: {player}").
# 테스터가 풀었으면 테스트 모드가 켜져 있는 동안만. 초기화하면 원래 줄로. 비우면 없음
heir-line: "<dark_gray>제작: {player} · <#c9a46b>설계자의 후계"
# 풀고 나서 (13번째 기계가 선 뒤) 한 번
heir-whisper: "<dark_gray>…이제 네가 만드는 것마다, 내 이름이 같이 찍힌다."

# 13번째 기계 (블록 디스플레이 묶음, 서버에 하나). 위치는 eco.kv secret.designer.machine13 (.facing 방향 0~3, .owner 옮길 수 있는 사람)
thirteenth:
  look-range: 16        # 이 안의 가장 가까운 사람을 눈이 따라봄 (매초)
  breath-seconds: 3     # 들이쉬고 내쉬는 데 각각
  breath-scale: 1.07    # 들이쉴 때 몸통 크기
  sound-every: 4        # 숨소리 (몇 번 숨 쉴 때마다 한 번, 0 = 없음)
  # 푼 사람이 직접 옮기기: 기계를 웅크리고 우클릭 → 초록/빨강으로 빛나는 유령 기계(나만 보임)가 바라보는 블록 위를 따라옴
  # 우클릭 = 여기에 놓기, F(양손 바꾸기) 또는 좌클릭 = 90° 돌리기, 다시 웅크리고 우클릭 또는 시간 초과 = 취소
  # 놓을 수 있는 곳: 손이 닿는 블록(최대 6칸)의 윗면, 그 블록이 단단하고 위로 두 칸이 비어 있고, 내가 블록을 바꿀 수 있는 땅
  move:
    seconds: 30           # 옮기기 모드가 이만큼 지나면 취소
    max-distance: 32      # 원래 자리에서 이 칸 안으로만 (0 = 제한 없음, 다른 월드도)
    facings: [남쪽, 동쪽, 북쪽, 서쪽]
    tip: "<dark_gray>웅크리고 우클릭: 13번째 기계 옮기기"
    hint: "<#d8c9a3>13번째 기계 옮기기 <dark_gray>│</dark_gray> <white>우클릭</white> <gray>여기에 놓기 · </gray><white>F</white><gray>/</gray><white>좌클릭</white> <gray>돌리기 (앞: {facing}) · </gray><white>웅크리고 우클릭</white> <gray>취소</gray> <dark_gray>│ {seconds}초"
    bad: "<red>{reason}</red> <dark_gray>│</dark_gray> <white>F</white><gray>/</gray><white>좌클릭</white> <gray>돌리기 (앞: {facing}) · </gray><white>웅크리고 우클릭</white> <gray>취소</gray> <dark_gray>│ {seconds}초"
    reasons:
      aim: "손이 닿는 블록을 바라보세요"
      ground: "단단한 블록 위에만 놓을 수 있어요"
      room: "자리가 좁아요 (위로 두 칸이 비어야 해요)"
      land: "내가 지을 수 있는 땅이 아니에요"
      far: "원래 자리에서 {max}칸 안으로만 옮길 수 있어요"
    placed-bar: "<#d8c9a3>13번째 기계를 옮겼어요"
    placed: "<dark_gray>…여기도 따뜻해."
    cancelled: "<gray>13번째 기계 옮기기를 취소했어요"
    timeout: "<gray>시간이 지나 13번째 기계 옮기기를 취소했어요"
    gone: "<gray>13번째 기계가 다른 곳으로 가서 옮기기를 멈췄어요"

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 후속 임무 「설계도 의뢰」 (푼 사람 한 명만, 한 주에 한 번 · docs/admin/숨은_비밀/설계자.md "후속 임무")
# 13번째 기계는 살아 있고, 살아 있는 것은 닳는다. 한 주에 한 번, 후계가 가까이 오면 기계가 설계도 한 장을 내민다:
# 후계의 기계로 만들 수 있는 물건 N개를 수수께끼로 적은 주문. 만들어서 손에 들고 13번째 기계를 우클릭하면 받아 간다.
#   · 빈손으로 우클릭 = 설계도 읽기 (책 화면, 아이템 없음) · 주문과 다른 물건 / 상점에서 산 물건 / 남이 만든 물건 = 안 받음 (손에 그대로)
#   · 여러 번 나눠 넣어도 됨 (센 만큼만 가져감). 다 채우면 기계가 크게 숨을 쉬고 보상
#   · 못 채우고 주가 바뀌거나 초기화 · 끄기 → 기계가 받아 둔 것을 전부 돌려줌 (가방, 접속 중이 아니면 우편함)
# 기계 속도 보너스는 없음: MachineModule 에 비밀이 부를 수 있는 속도 훅이 없어서 넣지 않았음 (돈 보상만).
sequel:
  enabled: true
  reward:
    money: [80000, 150000]       # 보통 난이도. 1,000 G 단위로 내림 (테스트 모드에서는 지급 안 함)
  done: "<dark_gray>…이번 주의 설계도는 여기까지. <gray>({reward})"
  near: 10                       # 그 주에 13번째 기계의 이 칸 안에 처음 오면 설계도가 나옴
  tag-radius: 24                 # 이 칸 안에서 기계 위에 "설계도 n / N" 이 보임 (그 사람에게만)
  tag-height: 2.35
  remind-seconds: 90             # 설계도를 아직 안 읽었을 때, 기계 근처에서 이만큼마다 속삭임
  avoid-recent: 5                # 최근 이만큼의 의뢰는 (다른 게 있으면) 다시 안 나옴
  min-job-level: 1               # 그 기계의 직업 레벨이 이만큼은 돼야 그 기계의 의뢰가 나옴 (압착기는 직업 없음: 늘 가능). 0 = 안 따짐
  min-choices: 4                 # 위 조건으로 남는 의뢰가 이보다 적으면 조건 없이 전부에서 고름
  own-only: true                 # 자기 기계에서 자기 이름으로 나온 것만 받음 (false: 상점에서 산 것만 아니면 받음)
  out: "<dark_gray>…열세 번째 기계가 종이 한 장을 밀어냈다. <gray>(빈손으로 기계를 우클릭)"
  remind: "<dark_gray>…종이가 나와 있다."
  wrong: "<dark_gray>…그건 설계도에 없다."
  not-yours: "<dark_gray>…네 기계에서, 네 이름으로 나온 것만."
  progress: "<dark_gray>…{got} / {need}. 더."
  returned: "<dark_gray>…설계도가 바랬다. 기계가 받아 둔 것을 도로 내놓았다."
  tag: "<#8a8170>설계도 <white>{got}</white><gray> / {need}"
  book:
    title: "설계도"
    author: "설계자"
    # 마지막 쪽 ({lines} = 의뢰 문구, "---" 줄에서 쪽이 나뉨)
    page: "{lines}\n\n<#7a2e1f>{got} / {need}</#7a2e1f>\n\n<#8a8170>다 되면 손에 들고\n나를 눌러라."
  # 다 채웠을 때 한 줄 (끝낸 횟수대로 차례로)
  thanks:
    - "<dark_gray>…맞는다. 다시 돈다."
    - "<dark_gray>…네 손은 내 손보다 정확하다."
    - "<dark_gray>…따뜻하다. 방금 나온 것은 늘 따뜻하다."
    - "<dark_gray>…한 주는 더 버티겠다."
    - "<dark_gray>…닳는다는 건, 살아 있다는 거다. 고맙다."
