# 숨은 비밀: 설계자 (운영자 문서: docs/admin/숨은_비밀/설계자.md · README 에는 적지 않음)
# 서버 모든 기계의 원래 설계자는 실종됐다. 그는 마지막 기계를 "살아 있게" 만들려 했다.
# 언젠가 내 기계에서 나온 물건의 제작자 표시가 "설계자 —" → 기계의 레시피 목록 맨 뒤에 메모가 한 장씩 →
# 부품 넷 (기계마다 하나, 한 줄에 정해진 재료만) → 13번째 기계.
enabled: true

# 시작: 내가 운영자인 줄에서 물건이 나올 때마다 (결과 칸이 비어 있을 때만) 이 확률로, 그 표시가 내 이름 대신 설계자
start:
  # 시간 조건 없음 (언제든). 기계가 하루 수천 번 돌아가는 서버라 확률을 아주 낮게, 한국 날짜로 하루 한 번까지
  chance: 0.0002         # 한 번 만들 때마다 (테스트 모드 100%)
  min-level: 20          # 그 기계의 직업 레벨 (압착기처럼 직업이 없는 기계는 지금 직업의 레벨). 테스트 모드는 무관
  sample-item: minecraft:iron_ingot   # 관리자 '시작' · 장면 '설계자표시' 가 손에 쥐여 주는 서명된 물건
# 진행 중 (1~4단계), 언제든 아주 가끔 또 설계자가 서명함 (분위기용, 테스트 모드에서도 이 확률 그대로)
echo-chance: 0.002

# 제작자 표시가 바뀐 줄 (원래: "<dark_gray>제작: 이름")
mark-line: "<dark_gray>제작: 설계자 —"

# 부품. machine = machines.yml 의 기계 id ("*" = 앞 부품들을 만들지 않은 종류의 기계 아무거나)
# in = 한 줄(재료 3칸)에 이것들만 (상점에서 산 것은 안 셈). 숫자만큼 들어감
parts:
  rib:
    item: economy:designer_rib
    machine: forge
    in: { minecraft:bone: 1, minecraft:iron_ingot: 1 }
    lore:
      - "<gray>하얗고 단단하다. 아직 조금 휘어 있다."
    made: "<dark_gray>…뼈가 맞물리는 소리."
  vein:
    item: economy:designer_vein
    machine: still
    in: { minecraft:redstone: 1, minecraft:vine: 1 }
    lore:
      - "<gray>쥐고 있으면 손바닥에서 맥이 뛴다."
    made: "<dark_gray>…무언가 흐르기 시작했다."
  lens:
    item: economy:designer_lens
    machine: gem_bench
    in: { minecraft:spider_eye: 1, minecraft:glass: 1 }
    lore:
      - "<gray>들여다보면, 저쪽에서도 들여다본다."
    made: "<dark_gray>…눈이 떠졌다."
  heart:
    item: economy:designer_heart
    machine: "*"
    lore:
      - "<gray>따뜻하다. 아주 천천히 돈다."
    made: "<dark_gray>…두근."

# 부품에 붙는 줄 (만든 사람에게 귀속: 다른 사람의 부품은 기계가 받지 않음)
bound-line: "<dark_gray>귀속: {player}"

# 기계가 거꾸로 도는 시간 (초), 마지막에 네 기계가 멈추는 시간 (초)
reverse-seconds: 4
heart-reverse-seconds: 6
pause-seconds: 5

sounds:
  breath: { sound: entity.warden.sniff, volume: 0.45, pitch: 0.55 }
  heartbeat: { sound: entity.warden.heartbeat, volume: 0.9, pitch: 0.8 }
  page: { sound: item.book.page_turn, volume: 0.5, pitch: 0.6 }
  assemble: { sound: block.anvil.land, volume: 0.35, pitch: 0.5 }

# 기계 화면을 열 때, 아직 안 읽은 메모가 있으면 (아주 작게)
unread-whisper: "<dark_gray>…어디선가 종이 넘기는 소리."
# 맞는 재료인데 결과 칸이 차 있을 때 / 맞는 재료인데 다른 기계일 때 (30초에 한 번)
no-room: "<dark_gray>…놓을 자리가 없다."
wrong-machine: "<dark_gray>…여기가 아니다."
heart-empty: "<dark_gray>…아직 비어 있다. 네 것이 필요하다."
heart-used: "<dark_gray>…이 기계는 이미 내 것을 하나 품었다."
# 13번째 기계가 생긴 뒤
born-whisper: "<dark_gray>…종이 한 장이 넘어갔다."
# 13번째 기계를 누르면 (아무나, 그중 하나)
touch:
  - "<dark_gray>…돌고 있어."
  - "<dark_gray>…보여."
  - "<dark_gray>…따뜻해."
  - "<dark_gray>…고마워."

# 레시피 목록 맨 뒤의 메모 (그 사람에게만). 누르면 책으로 펼쳐짐
memo:
  name: "<#8a8170>구겨진 설계 메모 <dark_gray>· {n}"
  final-name: "<#e0a46b>마지막 장"
  book-title: "설계 메모"
  book-author: "설계자"
  click: "<dark_gray>클릭: 펼쳐 보기"
  pages:
    - - "처음 기계를 만들 때 나는 뼈대부터 세웠다."
      - "이번에도 그렇게 하자."
      - ""
      - "뼈대는 단단하고 하얗게."
      - ""
      - "하얀 것은 짐승에게서,"
      - "단단한 것은 땅에서 캐어 불에 녹인 것에서."
      - "쇠를 두드리는 불 앞에서, 한 줄에 그 둘만."
    - - "뼈대가 섰다. 고맙다."
      - "그런데 아직 차갑다."
      - ""
      - "붉은 것이 흘러야 한다."
      - ""
      - "땅속에서 붉게 빛나는 가루와,"
      - "벽을 타고 늘어지는 줄기."
      - "끓이고 걸러 흘려 보내는 곳에서."
    - - "따뜻해졌다. 맥이 뛴다."
      - "그런데 아무것도 보이지 않는다."
      - ""
      - "보지 못하면 살아 있는 게 아니다."
      - ""
      - "눈이 여덟인 것에게서 하나를 빌리고,"
      - "모래를 녹인 맑은 것을 덧대라."
      - "돌을 깎아 빛을 모으는 곳에서."
    - - "보인다. 네가 보인다."
      - "날마다 내 기계 앞에 서 있던 너."
      - ""
      - "마지막은 내 것을 넣어라."
      - "네가 만든 것이 곧 내 것이다. 내 기계에서 나왔으니까."
      - ""
      - "뼈와 핏줄과 눈을 한 줄에 눕혀라."
      - "그 줄의 결과 칸에는 네 이름이 찍혀 나온 것을 둔 채로."
      - "아직 내가 손대지 않은 기계에서."
  final:
    - "고마워."
    - "이제 내가 돌게."

too-late: "<dark_gray>…기계는 조용하다. 누군가 먼저 심장을 넣었다."
solved-line: "<dark_gray>어딘가에서 열세 번째 기계가 숨을 쉬기 시작했다…"

# 푼 사람 (서버에서 처음 한 명). 테스트 모드는 돈 빼고
rewards:
  money: 300000
  title: economy:designer_heir

# 13번째 기계 (블록 디스플레이 묶음, 서버에 하나). 위치는 eco.kv secret.designer.machine13 (.facing 방향 0~3, .owner 옮길 수 있는 사람)
thirteenth:
  look-range: 16        # 이 안의 가장 가까운 사람을 눈이 따라봄 (매초)
  breath-seconds: 3     # 들이쉬고 내쉬는 데 각각
  breath-scale: 1.07    # 들이쉴 때 몸통 크기
  sound-every: 4        # 숨소리 (몇 번 숨 쉴 때마다 한 번, 0 = 없음)
  # 푼 사람이 직접 옮기기: 기계를 웅크리고 우클릭 → 초록/빨강으로 빛나는 유령 기계(나만 보임)가 바라보는 블록 위를 따라옴
  # 우클릭 = 여기에 놓기, F(양손 바꾸기) 또는 좌클릭 = 90° 돌리기, 다시 웅크리고 우클릭 또는 시간 초과 = 취소
  # 놓을 수 있는 곳: 손이 닿는 블록(최대 6칸)의 윗면, 그 블록이 단단하고 위로 두 칸이 비어 있고, 내가 블록을 바꿀 수 있는 땅
  move:
    seconds: 30           # 옮기기 모드가 이만큼 지나면 취소
    max-distance: 32      # 원래 자리에서 이 칸 안으로만 (0 = 제한 없음, 다른 월드도)
    facings: [남쪽, 동쪽, 북쪽, 서쪽]
    tip: "<dark_gray>웅크리고 우클릭: 13번째 기계 옮기기"
    hint: "<#d8c9a3>13번째 기계 옮기기 <dark_gray>│</dark_gray> <white>우클릭</white> <gray>여기에 놓기 · </gray><white>F</white><gray>/</gray><white>좌클릭</white> <gray>돌리기 (앞: {facing}) · </gray><white>웅크리고 우클릭</white> <gray>취소</gray> <dark_gray>│ {seconds}초"
    bad: "<red>{reason}</red> <dark_gray>│</dark_gray> <white>F</white><gray>/</gray><white>좌클릭</white> <gray>돌리기 (앞: {facing}) · </gray><white>웅크리고 우클릭</white> <gray>취소</gray> <dark_gray>│ {seconds}초"
    reasons:
      aim: "손이 닿는 블록을 바라보세요"
      ground: "단단한 블록 위에만 놓을 수 있어요"
      room: "자리가 좁아요 (위로 두 칸이 비어야 해요)"
      land: "내가 지을 수 있는 땅이 아니에요"
      far: "원래 자리에서 {max}칸 안으로만 옮길 수 있어요"
    placed-bar: "<#d8c9a3>13번째 기계를 옮겼어요"
    placed: "<dark_gray>…여기도 따뜻해."
    cancelled: "<gray>13번째 기계 옮기기를 취소했어요"
    timeout: "<gray>시간이 지나 13번째 기계 옮기기를 취소했어요"
    gone: "<gray>13번째 기계가 다른 곳으로 가서 옮기기를 멈췄어요"
