# 숨은 비밀: 주인 없는 제사 (운영자 문서: docs/admin/숨은_비밀/주인_없는_제사.md · README 에는 일부러 적지 않음)
# 버스 기사가 할머니 손님의 혼잣말을 듣는다: "…내일이 영감 제산데… 차려 줄 사람이 없네."
# 할머니가 내린 정류장 근처에 그 기사에게만 보이는 초가 한 채와 빈 제기가 놓인 제사상. 이 서버에서 만든 음식을 제기에 진짜로 올리고 밤에 두 번 절한다.
# 답은 게임 안에 없다: 진짜 제사상 차리는 법이다. 맞게 차리면 죽은 이들이 와서 먹는다 — 지방은 처음부터 두 장이었다.
enabled: true

start:
  # 할머니 손님을 태운 채 정류장 베이에 설 때마다 굴리는 확률 (할머니가 탄 정류장 100번에 한 번꼴). 테스트 모드 = 100%
  chance: 0.01
  # 혼잣말을 하는 손님 종류 (bus.yml types 의 id)
  type: grandma

# 서버에서 처음 푼 한 사람에게. 돈 대신 하나뿐인 것: 칭호, 자기 이름이 적힌 족보, 조상님 음덕
rewards:
  money: 0
  title: economy:jesa_host

solved-line: "<dark_gray>누군가 주인 없는 제사를 대신 지냈다. 그 집에서는 이제 아무도 기다리지 않는다."
too-late: "<dark_gray>…상은 이미 물려져 있다. 누군가 먼저 차렸다."

# 집 (그 사람에게만 보임): 할머니가 내린 정류장에서 [min, max] 칸 떨어진 평평한 맨땅 (5×5). 사람마다 · 정류장마다 늘 같은 자리
# 물 위에는 절대 서지 않음: 5×5 어느 칸이든 땅과 그 바로 아래 · 위에 물 · 용암 · 얼음 · 다시마 · 해초 · 물에 잠긴 블록이 있으면 그 자리는 버림
# (예전에 그런 자리로 정해진 집은 보일 때 다시 고름 — 그 정류장 근처에 마른 땅이 없으면 다음 정류장에서. 관리자가 세운 집은 그대로 두고 로그만)
house:
  min: 14
  max: 30
  # 정류장을 지나는 도로의 중심선에서 이만큼(칸) 안쪽은 피함
  road-clear: 10
  # 정류장 높이와 이만큼(칸) 넘게 차이 나는 땅은 피함
  max-rise: 12
  # 자리를 찾을 때 살펴보는 후보 수 (못 찾으면 그 기사가 다음에 서는 정류장에서 다시 찾음)
  tries: 160
  # 집이 설 수 있는 땅 (맨 위 블록). 도로 · 건물 바닥은 여기 없으므로 저절로 피해짐. 누군가의 땅(플레이어 땅)도 피함
  ground: [GRASS_BLOCK, DIRT, COARSE_DIRT, PODZOL, ROOTED_DIRT, MOSS_BLOCK, MYCELIUM, SAND, RED_SAND, SNOW_BLOCK, MUD]
  # 이 거리(칸) 안에 오면 보이고, 8칸 더 멀어지면 사라짐
  show-range: 48

# 제사는 밤에만 (집이 있는 월드의 시각, 틱). 낮에는 상을 눌러도 "…아직 해가 있다." 테스트 모드에서는 무시
night:
  required: true
  time: [13000, 23000]

# 절: 상 앞(남쪽) 이 거리 안에서 웅크리기를 seconds 초 안에 두 번
bow:
  reach: 5
  seconds: 3

# 상이 틀렸을 때 향이 꺼져 있는 시간 (초). 그동안은 절해도 아무 일 없음 (상은 고칠 수 있음). 테스트 모드: test-retry-seconds
retry-seconds: 300
test-retry-seconds: 5

# 제사상 규칙. 상 위 제기는 다섯 줄 × 세 개 (1열이 병풍 앞 = 북). 줄마다 서 · 가운데 · 동 — 절하는 사람(남쪽)에게 서쪽이 왼손, 동쪽이 오른손.
# 가운데 제기는 어느 쪽도 아님: 거기 놓인 것은 옆의 것과의 순서로만 봄 (고기 가운데 · 생선 동 은 맞음). 1열 가운데는 잔: 술만, 술은 잔에만.
# 아이템 id 는 "economy:..." 또는 "minecraft:..." (없는 id 는 그냥 아무 일도 없음). 줄을 지우면 그 종류는 기본값을 씀.
table:
  # true: 서쪽 음식이 동쪽 제기에, 동쪽 음식이 서쪽 제기에 있으면 안 됨 + 서로의 순서. false: 서로의 순서만 봄
  halves: true
  # 1열 (병풍 바로 앞) 메 · 잔 · 갱: 밥은 서쪽 주발, 국은 동쪽 주발 (반서갱동 — 산 사람 밥상의 반대), 술은 가운데 잔. 셋 다 있어야 함
  rice: [economy:rice]
  soup: [economy:bogeo_jiri, economy:eomuktang, economy:pollack_stew, economy:doenjang_jjigae, economy:kalguksu]
  liquor: [economy:cheongju, economy:golden_cheongju, economy:century_yakju, economy:makgeolli, economy:soju]
  # 2열 적 · 전: 고기는 서, 생선은 동 (어동육서), 그 사이에 전이 하나 이상
  meat: [economy:bulgogi]
  fish: [economy:godeungeo_gui, economy:fish_platter, economy:red_seabream, economy:croaker, economy:pollack, economy:sunset_bream,
         economy:gulbi, economy:gulbi_dureum]
  jeon: [economy:saengseonjeon, economy:hobakjeon, economy:gamjajeon, economy:pajeon]
  # 3열 탕 (깊은 탕기 셋): soup 목록에서 하나 이상, 어느 탕기든. 1열의 국과 같은 것은 안 되고, 같은 탕을 둘 놓아도 안 됨
  # 4열 포 · 나물 · 혜: 포는 서, 식혜는 동 (좌포우혜), 나물은 그 사이 (없어도 됨)
  dried: [economy:dried_fish_stirfry, economy:dried_fish, economy:dried_pollack, economy:gulbi]
  sikhye: [economy:sikhye]
  namul: [economy:japchae, economy:gyeranmari]
  # 5열 과일: 흰 과일은 서, 붉은 과일은 동 (홍동백서), 떡 · 과자 · 그 밖의 과일은 그 사이 (없어도 됨)
  pale: [economy:muskmelon]
  red: [minecraft:apple, economy:strawberry]
  sweets: [economy:injeolmi, economy:golden_injeolmi, economy:ginseng_jeonggwa, economy:grapes]
  # 상 어디에 있든 안 되는 것: 고추 · 마늘이 들어간 것 (machines.yml 조합을 따라가며 모은 목록 — 새 조합을 넣으면 여기도), 붉은 팥 (고사떡)
  taboo:
    - economy:chili_pepper
    - economy:chili_seeds
    - economy:garlic
    - economy:chili_powder       # 고춧가루
    - economy:gochujang
    - economy:jang_set           # 고추장이 든 장 세트
    - economy:royal_jang_set
    - economy:kimchi
    - economy:kkakdugi
    - economy:oi_sobagi
    - economy:oi_muchim
    - economy:sundubu_jjigae
    - economy:kimchi_jjigae
    - economy:maeuntang
    - economy:dakbokkeumtang
    - economy:gamjatang
    - economy:miyeokguk          # 마늘
    - economy:samgyetang         # 마늘
    - economy:ginseng_samgyetang
    - economy:jeyuk
    - economy:bossam             # 김치
    - economy:bibimbap           # 고추장
    - economy:tteokbokki
    - economy:grilled_eel        # 생선 양념구이 (고추장)
    - economy:braised_mackerel   # 생선조림 (고춧가루)
    - economy:agujjim
    - economy:mulhoe
    - economy:steamed_crab       # 해물찜 (마늘)
    - economy:grilled_fish_set   # 생선구이 정식 (김치)
    - economy:eggplant_stirfry   # 마늘
    - economy:beoseot_bokkeum    # 마늘
    - economy:gamja_jorim        # 마늘
    - economy:gujeolpan          # 보쌈 · 고사떡
    - economy:hanjeongsik        # 비빔밥 · 생선구이 정식
    - economy:royal_eoran        # 장 세트
    - economy:royal_surasang     # 한정식 · 고사떡
    - economy:gosa_tteok         # 붉은 팥은 귀신을 쫓는다
  # 이름이 이 글자로 끝나는 물고기 (fish.yml 의 이름: 꽁치 · 쥐치 · 갈치 · 청새치 · 돛새치 · 개복치 · 가물치 …) 도 안 됨. 새 물고기도 저절로 포함
  taboo-name-suffix: "치"

# 병풍의 지방 두 장 (세로로 쓰임; 태그 없이 글자만). 둘째 장이 조용한 단서
tablets:
  father: "顯考學生府君神位"
  mother: "顯妣孺人達城徐氏神位"

# 제기에서 돌려받은 것이 가방에 다 안 들어가거나 (상을 물릴 때 · 초기화 · 누가 먼저 풀었을 때) 우편함으로 갈 때의 보낸 곳
mail-reason: "감나무 아래 그 집에서"

lines:
  # 버스 안, 할머니 머리 위 (그 기사에게만)
  overhear: "…내일이 영감 제산데… 차려 줄 사람이 없네."
  # 할머니가 내린 자리에서
  house: "…저기, 감나무 아래가 우리 집이우."
  # 액션바 (그 사람에게만)
  day: "<gray>…아직 해가 있다."
  incense-out: "<gray>…향이 꺼져 있다."
  relit: "<gray>…향이 다시 피어오른다."
  empty: "<gray>…빈 상에는 아무도 오지 않는다."
  # 제기에 하나 올렸을 때 · 도로 집었을 때 (비워 두면 소리만: 나무 · 사기 닿는 소리)
  placed: ""
  taken: ""
  bow-once: "<gray>…한 번으로는 모자라다."
  out: "<gray>…향이 꺼졌다."
  # 비밀 물건 · 길라잡이 체험 물건 · 무언가를 담은 것 (셜커 상자 · 꾸러미) 을 올리려 할 때
  not-this: "<gray>…이건 상에 올릴 수 없다."
  # 제사가 진행 중일 때 제기를 건드리면
  not-now: "<gray>…지금은 상에 손대지 않는다."
  gone: "<gray>…상이 비어 있다. 아무도 먹지 못했다."
  # 누가 먼저 풀어서 상에 있던 것을 돌려줄 때 (too-late 다음에)
  returned: "<gray>…상에 올렸던 것은 돌아왔다."
  # 음복: 상 위에서 들리는 말 (할머니 목소리). 1 · 2 는 먹는 동안, 3 · 4 는 지방이 흔들린 뒤
  meal-1: "…영감, 많이 드시우."
  meal-2: "…나도 한술 뜨고."
  meal-3: "…고맙수. 길에서 만난 사람한테 얻어먹는 제삿밥이 제일 달다더니."
  meal-4: "…차비는 냈수. 밥값은, 이걸로 받으우."
  dawn: "<gray>…날이 밝았다. 감나무 아래에는 풀만 자라 있다."

# 끝난 뒤 그 사람에게만 오는 새벽: 하늘이 이 시각(틱)까지 흘러가고, seconds 초 뒤 월드 시각으로 돌아옴
dawn:
  time: 500
  seconds: 90

# 보상: 족보 (economy:jesa_jokbo, 책). {player} 상을 차린 사람 · {date} 그날 (한국 시각). 한 줄 = 한 줄
jokbo:
  name: "<#e8dcc0>족보"
  title: "감골 김씨 세보"
  author: "감골 김씨 문중"
  lore:
    - "<gray>감나무골 어느 집안의 족보."
    - "<gray>마지막 줄의 먹이 아직 마르지 않았다."
    - "<dark_gray>{date}"
  pages:
    - - "<dark_gray><b>柿谷金氏世譜</b>"
      - "<dark_gray>감골 김씨 세보"
      - ""
      - "<dark_gray>끝 권"
      - ""
      - "<#6b6258>감나무골에 터를 잡은 지"
      - "<#6b6258>아홉 대."
      - "<#6b6258>대마다 감나무를 한 그루씩"
      - "<#6b6258>심었다."
    - - "<dark_gray><b>七世</b> <black>김만석 金萬石"
      - "<#6b6258>감골에서 나고 감골에서"
      - "<#6b6258>죽다. 논 여섯 마지기."
      - "<#6b6258>配 밀양 박씨."
      - ""
      - "<dark_gray><b>八世</b> <black>김영수 金永壽"
      - "<#6b6258>만석의 외아들. 평생"
      - "<#6b6258>논을 부치다."
      - "<#6b6258>忌 시월 열이레."
    - - "<#6b6258>配 달성 서씨 徐粉禮"
      - "<#6b6258>장날마다 첫 버스를 타다."
      - "<#6b6258>영감 제사를 서른 해"
      - "<#6b6258>혼자 차리다."
      - ""
      - "<#6b6258>忌 시월 열엿새."
      - "<#6b6258>영감 제사 전날 밤이었다."
      - "<#6b6258>이후 두 위를 한 상에"
      - "<#6b6258>모시다."
    - - "<dark_gray><b>九世</b> <#8a8073>(먹이 번져"
      - "<#8a8073>읽을 수 없다)"
      - "<#6b6258>도회로 나가 소식이"
      - "<#6b6258>끊기다."
      - ""
      - "<#6b6258>이후 제사를 받들 이 없음."
      - ""
      - "<black><b>…대신 상을 차린 이:</b>"
      - "<black><b>{player}</b>"
      - "<dark_gray>{date}"

# 푼 사람에게 영원히: 조상님 음덕. every 초마다 한 번쯤, 그 사람이 still-seconds 초 가만히 서 있을 때
# 노인 두 분이 등 뒤 두 칸에 seconds 초 서 있다가 사라짐. radius 칸 안의 다른 사람들에게만 보임 (본인은 못 봄; 볼 사람이 없으면 다음으로 미룸)
blessing:
  enabled: true
  every: [360, 720]
  test-every: [20, 40]
  still-seconds: 3
  seconds: 5
  radius: 24
  # 버스 손님 스킨: 할머니, 할아버지 (끝에 " slim" 이면 가는 팔)
  skins: ["economy:entity/bus/grandma_2 slim", "economy:entity/bus/dogwalker_1"]
