# 움직이는 허수아비 — 숨은 비밀 (운영자 문서: docs/admin/숨은_비밀/움직이는_허수아비.md · README 에는 적지 않음)
# 내 땅에 세운 허수아비가 어느 밤 나를 따라 고개를 돌린다. 배고프다고 한다. 일곱 가지를 달라고 한다 — 수수께끼로.
# 하나 줄 때마다 그것은 한 칸씩 내 집 쪽에서 발견된다. 일곱 번째 뒤의 밤, 무언가 내 문을 두드린다. 해가 뜰 때까지 열면 안 된다.
# 반전: 두드린 것은 허수아비가 아니었다. 새벽, 허수아비는 문에 등을 대고 서 있다 — 온몸이 긁힌 채. 일곱 가지는 밤새 나를
# 지킬 힘이었고, "문을 열면 안 돼" 는 그것의 경고였다. 문을 열면 얼굴 앞에 있는 것은 허수아비가 아니다.
# 모든 연출은 그 사람에게만 보이고 들림 (진짜 허수아비 · 작물 · 문은 그대로).
# 테스트 모드 (/관리자 비밀 테스트): 확률 100%, 밤이 아니어도 됨 (그 사람의 하늘만 밤), 아래 test-… 시간.
# 문구는 모두 MiniMessage. {me} = 그 사람 이름.
enabled: true

start:
  chance: 0.003                # 밤마다 (월드 시간 13000~23000) 한 번, 내 땅 허수아비 32칸 안에 처음 들어올 때 굴림
  radius: 32                   # 이 거리 안의 내 땅(소유 · 거주) 허수아비만
  turn-seconds: 20             # 처음 밤: 고개가 나를 따라 도는 시간, 그 뒤 발밑에 지푸라기
  test-turn-seconds: 8

# 돈 대신 하나뿐인 것: 칭호, 허수아비 지킴이 (아래 companion), 긁힌 자국과 지푸라기 왕관 (아래 marks)
rewards:
  money: 0
  title: economy:field_master

solved-line: "<dark_gray>누군가의 밭에서 허수아비가 고개를 돌렸다. 이제 그 밭은 밤에도 비어 있지 않다."
too-late: "<dark_gray>…허수아비는 움직이지 않는다. 누군가 먼저 해 뜨는 것을 보았다."

night:
  from: 13000                  # 밤 (월드 시간). 이 사이에만 허수아비가 움직임
  to: 23000
  near: 32                     # 시작된 사람이 이 거리 안으로 오면 (밤에) 이어서
  leave: 64                    # 부탁 사이에 이보다 멀어지면 그 밤은 조용히 멈춤 (다시 오면 이어서)
  first-ask-seconds: 15        # 이어서 시작될 때 첫 부탁까지
  test-first-ask-seconds: 4
  gap-seconds: 60              # 바친 뒤 다음 부탁까지
  test-gap-seconds: 10
  ask-seconds: 180             # 부탁마다 기한 (넘기면 "…다음에." 그 밤은 끝)
  test-ask-seconds: 60
  hurry-seconds: 30            # 기한이 이만큼 남으면 재촉
  wrongs: 3                    # 한 밤에 틀린 것 이만큼이면 "…다음에."
  step-edge: 5                 # 이만큼 바친 뒤부터는 밭 가장자리 (문 쪽 길의 edge 만큼)
  edge: 0.6
  keep: 3                      # 문에서 이만큼은 떨어져 있음 (마지막 밤 전까지)
  door-radius: 24              # 허수아비에서 이 거리 안의 내 땅 문 (가장 가까운 것)
  wither-radius: 5             # 다섯 번째 뒤: 이 반경의 작물이 그 사람에게만 시듦
  most-radius: 24              # "가장 많이 심은 것" 을 세는 반경

# 일곱 가지 부탁 (순서대로). say 첫 줄 = 수수께끼 (머리 위 · 채팅), 나머지 줄 = 더 흐리게.
# items = 정답 (커스텀 economy:… · 바닐라 minecraft:…). 한 번 바친 것은 다시 정답이 아님 ("…그건 이미 먹었어.").
# most: true = 그 사람이 허수아비 주변에 가장 많이 심은 작물 (직접 심은 커스텀 작물 + 내 땅의 바닐라 작물; 씨앗도 됨).
#   주변에 아무것도 없으면 fallback.
asks:
  - id: red
    say:
      - "…배고파. 빨간 걸 줘."
      - "피 같은 거."
    items: [economy:tomato, economy:chili_pepper, economy:strawberry, minecraft:beetroot, minecraft:sweet_berries]
  - id: under
    say:
      - "…땅 밑에서 자란 걸 줘."
      - "빛을 한 번도 못 보고 큰 거."
    items: [economy:onion, economy:garlic, economy:radish, minecraft:carrot, minecraft:potato, minecraft:beetroot]
  - id: water
    say:
      - "…발을 물에 담그고 자란 걸 줘."
      - "나는 한 번도 물을 마셔 본 적이 없어."
    items: [economy:paddy, economy:rice_seeds, minecraft:sugar_cane, minecraft:kelp]
  - id: slow
    say:
      - "…가장 오래 기다린 걸 줘. 가장 늦게 익는 거."
      - "나처럼."
    items: [economy:grapes]
  - id: vine
    say:
      - "…감고 올라가는 걸 줘. 덩굴에 매달려 있던 거."
      - "목에 감기는 거."
    items: [economy:cucumber, economy:muskmelon, economy:zucchini, economy:grapes, minecraft:melon_slice, minecraft:pumpkin]
  - id: thorn
    say:
      - "…찌르는 걸 줘. 가시가 있는 거."
      - "아파야 기억하니까."
    items: [economy:cucumber, economy:eggplant, minecraft:sweet_berries, minecraft:cactus]
  - id: most
    say:
      - "…마지막. 네가 가장 많이 묻은 걸 줘."
      - "<dark_gray>…그리고 오늘 밤, 문을 열면 안 돼. 누가 불러도. 해가 뜰 때까지."
    most: true
    fallback: [minecraft:wheat, minecraft:wheat_seeds]

lines:
  straw-name: "<#d9c27a>허수아비의 지푸라기"
  straw-lore:
    - "<dark_gray>발밑에 떨어져 있었다."
    - "<gray>…배고파."
  straw-whisper: "<dark_gray>…발밑에 뭔가 떨어져 있다."
  eat: "<dark_gray>…"                       # 바쳤을 때 머리 위 (잠깐)
  ate:                                       # 바친 뒤 속삭임 (n 번째)
    - "<dark_gray>…맛있어."
    - "<dark_gray>…조금만 더."
    - "<dark_gray>…가까이 와도 돼."
    - "<dark_gray>…네 집이 보여."
    - "<dark_gray>…이제 네 문이 보여."
    - "<dark_gray>…곧 가."
    - "<dark_gray>…"
  wrong:
    - "<dark_gray>…아니야."
    - "<dark_gray>…그게 아니야."
    - "<dark_gray>…나를 놀리지 마."
  again: "<dark_gray>…그건 이미 먹었어."
  hurry: "<dark_gray>…아직이야?"
  away: "<dark_gray>…다음에."
  pause: "<dark_gray>…해가 뜨네. 다음 밤에."
  locked: "<dark_gray>…열지 말랬잖아. 다음 밤에."
  thanks: "…고마워. 이제 네 밭이야."
  thanks-whisper: "<gray>…고마워. 이제 네 밭이야."

# 까마귀 · 지푸라기 소리 (소리 키). 까마귀 소리가 따로 없어서 앵무새를 낮게 냄.
sounds:
  crow: entity.parrot.ambient
  crow-pitch: [0.5, 0.62]
  wings: entity.parrot.fly
  rustle: block.azalea_leaves.step
  straw: block.grass.break
  eat: entity.generic.eat
  knock: entity.zombie.attack_wooden_door
  handle: block.wooden_door.close
  scratch: block.sweet_berry_bush.break
  scare: entity.elder_guardian.curse

# 마지막 밤: 일곱 번째를 바치면 gap-seconds 뒤 (또는 다음 밤, 내 땅에 있을 때) 문 앞에서 두드림.
# 길이 = 그 밤의 남은 시간 (실제 초) 을 min~max 로. 그 사람의 하늘은 그동안 새벽까지 흘러감 (진짜 월드 시간은 그대로).
final:
  min-seconds: 150
  max-seconds: 360
  test-seconds: 60
  no-door-distance: 6          # 문이 없으면 그 사람에게서 이만큼 떨어진 곳에 섬 (규칙은 "땅을 나가지 마" 만)
  leave-grace-seconds: 2       # 땅 밖에 이만큼 있으면 잡힘
  calls:                       # 친한 사람 목소리 (가장 오래 같이 있던 사람; 없으면 접속자, 그것도 없으면 생략)
    - "{me}, 나야. 문 좀 열어 줘."
    - "{me}? 밖에 뭐가 있어… 빨리…"
    - "{me}… 왜 안 열어 줘?"
  call-at: [0.25, 0.5, 0.72]   # 밤의 이만큼 지났을 때 부름
  rattle-at: [0.4, 0.62, 0.82] # 문고리
  hand-at: 0.55                # 창문에 지푸라기 손
  silent-from: 0.9             # 이때부터 아무 소리도 없음
  # 문을 열었을 때 (또는 땅을 나갔을 때) 얼굴 앞에 있는 것: 허수아비가 아니다. 창백한 얼굴 없는 형체
  # knocker-skin: 마네킹 스킨 (economy:entity/…, 비우면 기본 얼굴), knocker-head: 얼굴을 덮는 블록 (비우면 없음)
  knocker-skin: "economy:entity/bus/ghost_1"
  knocker-head: "minecraft:white_concrete"
  # 새벽: 허수아비는 문에 등을 대고 서 있다 (긁힌 채). 머리 위 · 속삭임으로 차례로 (dawn-gap-seconds 간격),
  # 그 뒤 제자리 밭으로 돌아가고 작물이 익고 lines.thanks
  dawn-gap-seconds: 3
  dawn:
    - "…해가 떴어. 문, 안 열었구나."
    - "…밤새 두드린 건 내가 아니야."
    - "…네가 준 일곱 개로, 밤새 여기 서 있었어."

# 푼 뒤: 그 사람의 허수아비들 (그 사람이 세운 것 전부) 이 가끔 땅 사람이 아닌 사람 쪽으로 고개를 돌리고 까마귀가 움.
companion:
  enabled: true
  every-seconds: 5             # 이만큼마다 확인
  radius: 16
  chance: 0.2                  # 확인마다 침입자 한 명당
  cooldown-seconds: 120        # 같은 침입자에게 다시 하기까지
  look-seconds: 6

# 푼 사람의 허수아비 (세운 것 전부) 에 남는 그 밤의 흔적: 가슴의 긁힌 자국 세 줄 + 뜯긴 지푸라기 + 머리 위 지푸라기 왕관.
# 가구 위에 덧붙인 디스플레이 (모두에게 보임, 가구 자체는 그대로). 위치는 발밑 블록 바닥에서의 높이 (칸)
marks:
  enabled: true
  body-y: 1.05                 # 긁힌 자국 높이
  front: 0.2                   # 몸 앞쪽으로 내민 거리
  crown-y: 1.9                 # 왕관 높이 (머리 꼭대기)
  crown-at-dawn: false         # 새벽 장면에서도 왕관을 씌울지 (기본: 긁힌 자국만, 왕관은 푼 뒤부터)

# ── 후속 임무 「밭의 부탁」 (운영자 문서의 "후속 임무") ──
# 그 밤을 넘긴 그 한 사람에게만, 일주일에 한 번쯤. 밤에 내 땅 허수아비 근처에 있으면 그것이 나를 향해 돌아서서 작물 "하나" 를 달라고 한다 (수수께끼).
# 손에 들고 우클릭하면 하나만 가져가 먹고, 한마디 (그것이 밤마다 무엇을 막고 서 있는지) 와 보상. 그리고 그 주가 끝날 때까지
# 그 허수아비가 선 청크의 작물이 조금 더 빨리 자란다. 틀린 것은 받지 않을 뿐 (불이익 없음). 못 해도 잃는 것 없음.
# 모든 연출은 그 사람에게만 보임 (본편과 같은 복사본). 테스트 모드: 확률 100%, 밤이 아니어도 됨.
sequel:
  enabled: true
  # 쉬움 단계: 30,000~80,000 G (common.yml 의 sequel.round 단위로 내림)
  reward:
    money: [30000, 80000]
  # 그 주에 아직 안 왔을 때, 밤 (위 night.from~to) 에 내 땅 (소유 · 거주) 의 일하는 허수아비 near 칸 안에 있으면 초마다 굴리는 확률
  chance: 0.02
  near: 24                     # 이 거리 안으로 오면 (밤에) 돌아서서 말함. 받은 뒤에도 그 주 안의 어느 밤이든 다시 오면 이어서
  leave: 48                    # 말하는 중에 이보다 멀어지면 조용히 제자리로 (다시 오면 다시 말함)
  turn-seconds: 4              # 처음: 돌아선 뒤 말하기까지
  recent: 5                    # 지난 이만큼의 주에 나온 부탁은 되도록 다시 안 나옴
  recent-thanks: 5
  # 그 주의 선물: 부탁을 들어준 허수아비가 선 청크의 덜 자란 작물이 every-seconds 초마다 chance 확률로 한 단계 더 자람.
  # 커스텀 작물은 작물 엔진의 공개 성장 (농부 직업의 것과 같은 것), 바닐라 작물은 블록으로. 그 청크가 불려 있을 때만 (일부러 불러오지 않음),
  # 허수아비가 그 사람 땅에 서 있는 동안만, 그 주가 끝나면 끝. 커스텀 작물은 청크 동 · 남쪽 바깥 한 줄까지 닿을 수 있음.
  # 0.04 / 60초 = 작물 하나가 25분에 한 단계쯤 덤으로. 끄려면 enabled: false
  perk:
    enabled: true
    every-seconds: 60
    chance: 0.04
    reach-y: 6                 # 허수아비 높이에서 위아래 이만큼
  # 부탁 (주마다 하나). say 첫 줄 = 수수께끼, 나머지 = 더 흐리게. items = 정답 (하나만 주면 됨). 위 asks 와 같은 꼴 (most 는 쓰지 않음)
  asks:
    - id: leaf
      say:
        - "…겹겹이 싸인 걸 줘."
        - "속을 감추는 건 나랑 닮았어."
      items: [economy:napa_cabbage, economy:lettuce]
    - id: tears
      say:
        - "…눈물 나는 걸 줘."
        - "나는 울 줄을 몰라서."
      items: [economy:onion, economy:green_onion]
    - id: teeth
      say:
        - "…이빨처럼 줄지어 박힌 걸 줘."
        - "웃는 얼굴을 한 번 해 보고 싶어."
      items: [economy:corn]
    - id: pod
      say:
        - "…꼬투리 속에 숨은 걸 줘. 작고 둥근 거."
        - "밤새 세고 있을게."
      items: [economy:soybean]
    - id: bruise
      say:
        - "…멍든 색을 줘."
        - "밤에 맞은 데가 그런 색이야."
      items: [economy:eggplant, economy:grapes]
    - id: sweet
      say:
        - "…단 걸 줘."
        - "한 번도 먹어 본 적이 없어."
      items: [economy:strawberry, economy:muskmelon, economy:grapes, minecraft:melon_slice, minecraft:sweet_berries, minecraft:sugar_cane]
    - id: bone
      say:
        - "…뽑으면 하얀 걸 줘."
        - "뼈 같은 거. 나는 뼈가 없어서."
      items: [economy:radish, economy:garlic]
    - id: bow
      say:
        - "…익으면 고개를 숙이는 걸 줘."
        - "나는 숙일 수가 없어서."
      items: [economy:paddy, minecraft:wheat]
    - id: burn
      say:
        - "…입이 타는 걸 줘."
        - "그게 싫어하는 맛이야."
      items: [economy:chili_pepper, economy:garlic]
    - id: hollow
      say:
        - "…속을 파낼 수 있는 둥근 걸 줘."
        - "내 얼굴은 누가 그려 줬을까."
      items: [minecraft:pumpkin, minecraft:carved_pumpkin, economy:zucchini]
    - id: crow-eye
      say:
        - "…작고 빨간 걸 줘."
        - "까마귀 눈 같은 거."
      items: [economy:tomato, economy:strawberry, minecraft:sweet_berries, minecraft:beetroot]
    - id: arm
      say:
        - "…길고 푸른 걸 줘."
        - "내 팔이 한쪽 뜯겼거든. 대신 들고 있을게."
      items: [economy:cucumber, economy:green_onion, economy:zucchini]
  # 먹은 뒤의 한마디 (주마다 하나). 그것이 밤마다 무엇을 막고 서 있는지를 조금씩
  thanks:
    - "…잘 먹었어. 이걸로 이레는 서 있을 수 있어. 밤은 내가 볼게."
    - "…고마워. 어젯밤에도 울타리 밖에 뭐가 서 있었어. 들어오지는 못했어."
    - "…문 두드리던 그거, 요즘은 멀리서만 봐. 내가 안 자는 걸 아니까."
    - "…그건 얼굴이 없어서 문을 못 찾아. 그래서 두드리는 거야."
    - "…그건 이름을 불러. 불러도 대답하지 마. 내가 듣고 있을게."
