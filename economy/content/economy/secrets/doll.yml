# 주인 없는 경매품 (낡은 인형) — 숨은 비밀 (운영자 문서: docs/admin/숨은_비밀/주인_없는_경매품.md · README 에는 적지 않음)
# 아주 드물게 경매장에 판매자 "—" 의 낡은 인형이 1 G 에 올라온다. 낙찰받은 사람이 "처음 주인". 인형은 혼자서는 집에 못 간다:
# 서로 다른 일곱 사람의 품을 거쳐 처음 주인에게 돌아가야 잠들 수 있다. (뒷이야기: 잃어버린 뒤 일곱 사람의 손을 거쳐 경매장에
# 왔다. 그 일곱 손을 거꾸로 되짚어야 잠들 수 있다 — 그래서 설명도 거꾸로 쓰여 있고, 마지막에 "안긴 순서" 를 묻는다) 다음 사람은 인형이 속삭이는 수수께끼 (서버의 진짜 기록) 로
# 정해지고, 처음 주인만 끝낼 수 있다. 시간은 한국 시간. 문구는 모두 MiniMessage.
enabled: true

rewards:
  money: 0
  title: economy:returned_one
  # 어깨 위의 "낡은 인형" 동반자는 코드가 직접 (아래 companion). 더 줄 것만 여기에
  items: []

solved-line: "<dark_gray>어딘가에서 아주 작은 발소리가 멈췄다. 낡은 인형이 잠들었다."
too-late: "<dark_gray>…인형은 벌써 누군가의 품에서 잠들었다."

# 우편함에 들어갈 때 (인벤토리가 꽉 찼을 때, 나가 있을 때) 보이는 보낸 곳
mail-reason: "보낸 사람 없음 · 아주 작은 손자국"

# 경매에 올라오는 때. 한국 날짜로 하루 한 번, 서버 전체에서 chance 로 "오늘" 이 되고, 그날 hours 사이의 아무 시각에
# 접속자가 min-players 명 이상이면 올라온다 (모자라면 그날 안에 모일 때까지 기다림). 인형이 돌고 있거나 누가 이미 풀었으면 안 올라옴
start:
  chance: 0.02                 # 0.02 = 50일에 한 번쯤
  hours: [12, 24]              # 한국 시각 (24 = 자정)
  min-players: 3
  owner-gone-days: 14          # 처음 주인이 이만큼 안 들어오면 인형이 떠나고, 언젠가 다시 경매에 올라올 수 있다

auction:
  minutes: 10
  start-price: 1
  seller: "—"
  name: "<#d8c4b0>낡은 인형"
  # 경매 목록에만 보이는 설명. 코드가 줄마다 글자를 거꾸로 뒤집는다 (여기는 바로 읽히게 쓸 것. 앞의 색 태그는 그대로 둠)
  lore:
    - "<#8a7a6a>누가 나 좀 데려가 줄래?"
    - "<#8a7a6a>나는 아직 따뜻해."
    - "<#5f544a>잃어버린 뒤로 일곱 손을 거쳐 여기 왔어."
    - "<#5f544a>거꾸로 돌아가야 잠들 수 있어."
  refuse: "<dark_gray>…또 팔려고? <gray>(인형은 경매에 올릴 수 없다)"
  unsold: "<dark_gray><i>…아무도 나를 원하지 않아."

chain:
  minutes: 30                  # 한 사람이 다음 사람에게 넘겨야 하는 시간 (실제 분, 나가 있어도 흐름). 넘기면 처음 주인에게 돌아감
  container-seconds: 60        # 상자 · 거래소 · 쓰레기통 … 인벤토리 밖에 이만큼 있으면 들고 있던 사람 주머니로 돌아옴

# 수수께끼: "다음에 안을 사람". 후보 = 지금 접속해 있고 이번 판에 아직 인형을 안아 보지 않은 사람 (들고 있는 사람 제외).
# 그 가운데 "가장 …" 한 사람 (같으면 모두 정답). 인형이 말한 순간의 정답과 건네는 순간의 정답 모두 맞음으로 친다.
# 뜻 (어떤 기록을 보는지) 은 문서의 표대로. 문구 손질은 자유, 뜻을 바꾸지는 말 것. 앞에 "…" 는 코드가 붙인다
riddles:
  land: "이 세상에서 땅을 가장 넓게 가진 사람. 거기라면 나를 묻을 데도 있겠지."
  late: "방금, 가장 마지막으로 문을 열고 들어온 사람. 아직 문 닫는 소리가 귀에 남아 있어."
  early: "오늘 가장 오래 여기 머문 사람. 그 사람은 지쳤을 거야. 내가 안아 줄래."
  friend: "나를 처음 산 사람 곁에 가장 오래 붙어 있던 사람. 그 냄새가 나."
  fish: "물속에서 가장 큰 것을 끌어 올린 사람. 비린내가 좋아. 물 밑은 조용하거든."
  long: "이름이 가장 긴 사람. 다 부르기도 전에 잠들어 버릴 것 같아."
  deep: "방금, 가장 깊은 곳에 있던 사람. 거기는 어두워서 좋아."
  high: "방금, 가장 높은 곳에 있던 사람. 떨어지는 꿈을 꿨거든."
  far: "방금 너에게서 가장 멀리 있던 사람. 멀리 있는 사람은 아직 나를 못 봤으니까."
  rich: "돈을 가장 많이 가진 사람. 나를 다시 사 줄 수 있겠지."
  poor: "가진 게 가장 적은 사람. 그 사람한테는 나라도 있어야 해."
  old: "이 세상에 가장 먼저 와 있던 사람. 나보다 먼저였을까."
  new: "이 세상에 가장 늦게 온 사람. 아직 아무것도 모르는 사람."
  stranger: "아직 나를 모르는 사람이면 누구든. 빨리."
  home: "이제 처음 주인에게 돌아갈래."

talk:
  # 낙찰받은 사람이 인형을 처음 손에 쥘 때
  first:
    - "<dark_gray><i>(인형의 단추 눈이 천천히 너를 향해 돌아간다)"
    - "<#c9b8a6>…새 주인."
    - "<#c9b8a6>…나는 길을 잃고 일곱 사람의 손을 거쳐 여기까지 왔어."
    - "<#c9b8a6>…잠들려면 그 길을 거꾸로 되짚어야 해. 일곱 사람이 나를 안아 줘야 해."
    - "<#c9b8a6>…한 번 안아 본 사람은 다시는 안 돼. 그리고 나는, 기다리는 게 싫어."
  whisper: "<dark_gray><i>(품 안의 인형이 아주 작게 속삭인다)"
  riddle: "<#c9b8a6>…{riddle} <dark_gray>({n}/7)"
  taken: "<dark_gray><i>(누군가 네 주머니 속에서 작게 웃었다)"
  bye: "<dark_gray><i>…안녕."
  giggle: "<#c9b8a6>…킥. 킥킥. 너 아니야."
  giggle-giver: "<dark_gray><i>(어디선가 아이 웃음소리가 들렸다)"
  warn: "<#c9b8a6>…서둘러. 집에 가고 싶어지기 시작했어."
  warn-last: "<#c9b8a6>…이제 곧 혼자 갈 거야. 혼자 가는 길은 무서운데."
  went-home: "<#c9b8a6>…늦었어. 나 집에 갈래. <dark_gray><i>(주머니가 가벼워졌다)"
  came-home:
    - "<dark_gray><i>(주머니가 갑자기 무거워진다. 인형의 옷자락이 젖어 있다)"
    - "<#c9b8a6>…다녀왔어. 처음부터 다시."
  pocket: "<#c9b8a6>…혼자 두지 마. 거기는 너무 어두웠어. <dark_gray><i>(인형이 주머니에 돌아와 있다)"
  no-drop: "<#c9b8a6>…놓지 마."
  dead: "<dark_gray><i>(쥐고 있던 인형이 바스러져 먼지가 되었다)"
  # 일곱 번째 품을 지나 처음 주인에게 돌아왔을 때 ({place} = final.place-hint)
  home:
    - "<#c9b8a6>…돌아왔어. 일곱 번 안겼어."
    - "<#c9b8a6>…나는 경매장에서 태어났어. {place}"
    - "<#c9b8a6>…거기서 재워 줘."
  # 경매장 자리에 서면 ({minutes} = final.minutes, {tries} = 남은 기회)
  ask:
    - "<dark_gray><i>(인형이 네 품에서 몸을 비틀어 주위를 둘러본다)"
    - "<#c9b8a6>…여기야. 여기서 나를 팔았어."
    - "<#c9b8a6>…일곱 품을 거꾸로 다 되짚었어. 이제 여기서 잠들 수 있어."
    - "<#c9b8a6>…나를 제대로 안아 준 일곱 사람. 안긴 순서대로, 이름의 첫 글자."
    - "<dark_gray>(채팅으로 말해 준다 · {minutes}분 · 남은 기회 {tries})"
  not-here: "<#c9b8a6>…여기가 아니야."
  wrong: "<#c9b8a6>…아니야."
  late: "<#c9b8a6>…대답이 없네. 다시 물어볼게."
  forgot:
    - "<#c9b8a6>…다 잊어버렸구나."
    - "<#c9b8a6>…그럼 처음부터 다시 안아 줘."
  lay: "<#c9b8a6>…여기."
  thanks: "<#c9b8a6>…고마워. 이제 잘 수 있어."

# 들고 있는 동안 (1분에 몇 번쯤인지)
haunt:
  steps-per-minute: 0.25       # 등 뒤의 아주 작은 발소리 세 걸음
  whisper-per-minute: 0.12     # 액션바 속삭임
  night-per-minute: 0.2        # 밤 (게임 시간 13000~23000, 오버월드): 32칸 안의 누군가의 이름을 부름
  turn-per-minute: 0.3         # 손에 들고 있으면: 고개가 돌아가는 소리와 한 줄
  whispers:
    - "<#c9b8a6>…발 시려."
    - "<#c9b8a6>…저번 주인은 나를 꼭 안고 잤어. 그러다 안 일어났어."
    - "<#c9b8a6>…너는 따뜻하다."
    - "<#c9b8a6>…뒤 돌아보지 마. 나 말고 아무도 없어."
    - "<#c9b8a6>…내 단추 하나 어디 갔는지 알아?"
    - "<#c9b8a6>…집은 멀지 않아. 아주 가까워. 너무 가까워."
  night:
    - "<#c9b8a6>…{name}도 나 좋아해?"
    - "<#c9b8a6>…{name}이(가) 아까부터 우리를 보고 있어."
    - "<#c9b8a6>…{name} 뒤에 누가 서 있어. 키가 아주 작아."
    - "<#c9b8a6>…{name}한테는 말하지 마."
  night-alone:
    - "<#c9b8a6>…아무도 없네. 그럼 이건 누구 발소리야?"
    - "<#c9b8a6>…쉿. 지금 누가 내 이름을 불렀어."
  turn: "<dark_gray><i>…끼릭. 인형의 고개가 너를 향해 돌아간다."

# 아이템 설명 (들고 있는 사람만 보임). 돌아온 뒤엔 처음 주인 말고는 이름이 번진다 (smudged)
lore:
  head:
    - "<dark_gray>단추 눈 하나가 실 한 가닥에 매달려 있다."
    - ""
  hands: "<gray>나를 안아 준 손"
  hand: "<#c9b8a6> {n}. {name}"
  smudged: "<#5f544a> {n}. ░░░"
  wrong: "<dark_gray>     <st>{name}</st>"
  riddle: "<dark_gray><i>“…{riddle}”"
  home:
    - "<dark_gray><i>“…경매장. 거기서 재워 줘.”"
  lost: "<dark_gray>놓친 손: {names}"

final:
  # 경매장 자리 "월드 x y z". 이 서버의 경매는 메뉴 (/경매) 라 정해진 건물이 없어서, 비우면 첫 월드의 스폰 (모두가 처음 내려서는 곳).
  # /관리자 비밀 연출 낡은인형 자리 <플레이어> 로 그 사람이 선 자리를 저장할 수도 있다 (그게 이것보다 우선). 바꾸면 place-hint 도 맞게
  place: ""
  place-hint: "모두가 처음 이 세상에 내려서는 그 자리. 거기가 경매장이었어."
  radius: 8                    # 그 자리에서 수평 이만큼 (높이 ±8) 안
  minutes: 5                   # 질문 뒤 대답할 시간 (분)
  tries: 3                     # 틀릴 수 있는 횟수. 다 쓰면 처음부터 (손 1/7)

companion:
  scale: 0.4
  flip: false                  # 인형이 등을 보이면 true
  look-chance: 0.06            # 반 초마다 이 확률로 근처 사람 쪽으로 고개를 돌림 (2.5~5초)
  look-range: 10
  given:
    - "<dark_gray><i>(어깨가 조금 무거워진다)"
    - "<#c9b8a6>…그래도 가끔은 깨어 있을게. 네 옆에서."
    - "<dark_gray>(재우거나 깨우려면: 웅크린 채 하늘을 똑바로 올려다보고, 빈손으로 허공을 두 번)"
  sleep: "<dark_gray><i>(인형이 눈을 감는다)"
  wake: "<dark_gray><i>(인형이 눈을 뜬다)"

# ── 후속 임무 「인형의 심부름」 (운영자 문서의 "후속 임무") ──
# 인형을 재운 그 한 사람에게만, 일주일에 한 번쯤. 어깨 위의 인형이 "보고 싶은 사람" 을 수수께끼로 속삭인다 (위 riddles 와 같은 기록을 봄:
# 그 순간 접속해 있는, 본인 말고 다른 사람들 가운데 "가장 …" 한 사람. 같으면 모두 정답). 그 사람을 찾아 곁에 잠깐 서 있으면
# 인형이 그쪽으로 고개를 돌리고 아주 조금 숙인 뒤, 그 사람에 대한 한마디를 나에게만 속삭이고 끝. 상대는 아무것도 할 필요가 없고 아무 말도 듣지 않는다.
# 주는 것도 받는 것도 없는 임무 (돌려줄 물건 없음). 못 해도 잃는 것 없음. 테스트 모드: 확률 100%, 아래 test-… 시간.
sequel:
  enabled: true
  # 쉬움 단계: 30,000~80,000 G (common.yml 의 sequel.round 단위로 내림)
  reward:
    money: [30000, 80000]
  # 그 주에 아직 안 왔을 때, 인형이 깨어 있고 다른 사람이 한 명이라도 접속해 있으면 초마다 굴리는 확률 (0.004 = 평균 4분쯤).
  # 아무도 없으면 올 때까지 기다린다. 인형을 재워 두면 (웅크리고 하늘 보고 빈손 두 번) 그동안은 오지 않고, 하던 것도 멈춘다
  chance: 0.004
  radius: 4                    # 그 사람에게서 수평 이만큼 (높이 ±3) 안에
  stay: 10                     # 이만큼 (초) 이어서 서 있으면 됨
  test-stay: 3
  look-range: 20               # 이 거리 안에 그 사람이 있으면 인형이 그쪽으로 고개를 돌림 (끼릭 소리 한 번) — 힌트 전의 유일한 길잡이
  hint-first: 240              # 수수께끼를 들은 뒤 이만큼 (초) 지나면 이름 첫 글자를 알려 줌
  test-hint-first: 20
  hint-name: 540               # 이만큼 지나면 이름을 그대로 알려 줌 (막히지 않게)
  test-hint-name: 40
  changed-gap-seconds: 30      # "달라졌어" 를 다시 말하기까지 (정답 자체는 바로 바뀜)
  recent: 4                    # 지난 이만큼의 주에 나온 수수께끼는 되도록 다시 안 나옴
  recent-remarks: 6            # 마지막 한마디도 이만큼은 겹치지 않게
  bow-degrees: 32              # 인사할 때 고개를 숙이는 각도
  # 인형이 묻는 말 (앞에 "…" 는 lines.riddle 이 붙임). 뜻은 위 riddles 와 같음 — 문구만 "보고 싶다" 로.
  # "방금 …" 인 것 (late · deep · high · far) 은 말한 순간의 그 사람이 정답으로 남고 (다가가는 동안 바뀌지 않게), 나머지는 지금 기록대로.
  riddles:
    land: "이 세상에서 땅을 가장 넓게 가진 사람. 그렇게 넓은 데서는 길을 안 잃을까."
    late: "방금, 가장 마지막으로 문을 열고 들어온 사람. 바깥 냄새가 아직 묻어 있을 거야."
    early: "오늘 가장 오래 여기 머문 사람. 졸린 얼굴이 보고 싶어."
    friend: "네 곁에 가장 오래 붙어 있던 사람. 너한테서 그 사람 냄새가 나."
