# 숨은 비밀 공통 설정 (운영자 문서: docs/admin/숨은_비밀.md · 플레이어용 README 에는 일부러 적지 않음)
# 비밀마다 파일 하나: dongbang.yml (동방해운), letter.yml (내일의 나), designer.yml (설계자), usher.yml (안내원),
# fish.yml (눈 없는 물고기), lostkey.yml (분실물센터), doll.yml (낡은 인형), scarecrow.yml (허수아비),
# jesa.yml (주인 없는 제사), garage.yml (폐차고), pager.yml (삐삐), newcomer.yml (새로 온 사람)
# 테스트 모드 (/관리자 비밀 테스트) 인 사람에게 "하루" 는 이 초만큼 (확률 100%, 시간 조건 없음, 풀어도 서버에 안 닫힘)
test-day-seconds: 60

# 비밀 아이템 (items/secrets.yml) 을 거래소 · 경매에 올리려 할 때
no-listing: "<dark_gray>…그건 내놓을 수 없는 물건이다."

# 후속 임무: 비밀을 푼 그 한 사람에게만, 일주일에 한 번쯤 그 비밀의 뒷이야기가 작은 임무로 찾아옴 (버스 비밀의 주간 비밀 의뢰처럼).
# 한 주 = 월요일 0시 (한국 시간) 부터 일요일까지 (ISO 주). 그 주에 못 끝내면 임무만 조용히 사라지고 잃는 것은 없음.
# 임무마다의 설정 (확률 · 시간 · 보상) 은 각 비밀 파일의 sequel: 아래에. 운영자 문서: docs/admin/숨은_비밀.md "후속 임무"
sequel:
  # false 면 모든 비밀의 후속 임무가 멈춤 (하나만 끄려면 그 비밀 파일의 sequel.enabled: false). 기록은 그대로
  enabled: true
  # 테스트 모드인 사람에게 "한 주" 는 이 초만큼 (최소 10)
  test-week-seconds: 120
  # 보상 돈 (각 비밀 파일 sequel.reward.money: [최소, 최대]) 을 이 단위로 내림 (최소보다 작아지지는 않음). 1 = 그대로
  round: 1000
  # 임무를 끝냈을 때 · 실패했을 때 그 사람에게만 보이는 줄 (각 비밀 파일의 sequel.done · sequel.failed 가 있으면 그것이 우선).
  # {reward} = 받은 것. 서버 공지는 없음
  done: "<dark_gray>…이번 주의 일은 끝났다. <gray>({reward})"
  failed: "<dark_gray>…이번 주는 여기까지다. 다음에 또 온다."

# 숨은 비밀 기념비 (/관리자 비밀 비석 세우기): 비밀마다 비석 하나 (버스까지 13개), 풀리면 이름 · 푼 사람 · 날짜가 새겨짐 (그 전엔 ???,
# 새로 온 사람의 비석만은 풀리기 전까지 아무 글도 없음)

# 소문: every-minutes 사이 아무 때 접속한 한 사람에게 아직 아무도 못 푼 비밀에 대한 한 줄 (풀린 · 꺼진 비밀은 안 나옴)
rumors:
  enabled: true
  every-minutes: [40, 90]
  format: "<dark_gray><i>…누가 그러던데, {line}"
  lines:
    bus: ["새벽 세 시 반쯤 정류장에 선글라스 낀 남자가 서 있더래.", "어떤 손님은 끝까지 아무 말도 안 하고 내린대.", "종점 터미널에서 경적 소리가 세 번 들렸대."]
    dongbang: ["주식 목록 맨 밑에 가끔 회색 회사가 하나 보인대.", "1987년에 가라앉은 배 얘기, 들어 봤어?", "주가가 꼭 사람처럼 숨을 쉰대."]
    letter: ["자기 이름으로 된 편지를 받은 사람이 있대. 날짜가 내일이었대.", "탭 목록에 자기 이름이 두 번 보였대."]
    designer: ["기계에서 나온 물건에 모르는 이름이 찍혀 있었대.", "기계가 거꾸로 도는 걸 봤다는 사람이 있어."]
    usher: ["체험관 안내원이 새벽엔 이상한 걸 묻는대.", "안내원 이름표가 거꾸로 걸려 있었대."]
    fish: ["비 오는 날, 눈이 없는 물고기가 잡혔대.", "물고기를 놓아줬더니 말을 했대."]
    lostkey: ["분실물 센터에 끝까지 주인이 안 나타난 열쇠가 하나 있대."]
    doll: ["경매에 판매자 없는 인형이 올라온 적이 있대.", "그 인형, 사람 손을 일곱 번 거쳐야 잠든대."]
    scarecrow: ["밤에 허수아비가 고개를 돌렸대.", "허수아비가 배고프다고 했대."]
    jesa: ["버스에 탄 할머니가 혼잣말을 하더래. 제사가 어쩌고.", "제사상에 올리면 안 되는 생선이 있대.", "아무도 안 사는 집에 밤마다 향 냄새가 난대."]
    garage: ["어려운 길 급커브에 누가 꽃을 놓고 간대.", "국도 끝에 셔터 내린 차고가 있다던데.", "밤에 국도에서 전조등만 달리는 걸 봤대."]
    pager: ["깊은 데서 캐는데 돌 속에서 삐삐 소리가 났대.", "8282가 무슨 뜻인지 알아?", "숫자로만 말을 걸던 시절이 있었대."]
    newcomer: ["밤에 들어오는 그 뉴비, 나가는 걸 본 사람이 없대.", "기념비에 물음표도 없는 비석이 하나 있대."]
