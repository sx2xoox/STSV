# 숨은 비밀: 폐차고의 주인 (운영자 문서: docs/admin/숨은_비밀/폐차고의_주인.md · README 에는 일부러 적지 않음)
# 어느 밤, 한 스트리트 레이서가 어려운 국도의 가장 급한 커브에서 죽었다. 길 끝의 자기 차고로 돌아가던 길이었다.
# 그는 그 길을 끝내지 못했다. 차는 견인되어 돌아와, 내려진 셔터 뒤에서 덮개를 쓴 채 그대로 서 있다.
# 그날 그대로 되돌려 놓으면 그가 마지막으로 한 번 달리러 온다 — 누군가 그 차를 몰고, 옆에서 같이 집까지 가 주어야 한다.
#
# 이 서버의 플레이어는 화물 탈것만 가진다 (스포츠카는 후원 · 이벤트). 그래서 자기 차를 튜닝하는 게 아니라
# "그의 차"를 그의 차고에서 복원하고, 그 차를 몬다. 탈것을 가지고 있지 않아도 풀 수 있다.
# 모든 연출은 그 사람에게만 보임 (기다리는 차 한 대만 진짜 임시 탈것이라 남에게도 보이지만, 주인 말고는 탈 수 없음).
# 테스트 모드 (/관리자 비밀 테스트): 밤이 아니어도 됨, 아래 test-… 시간, 풀어도 서버에 안 닫힘 (명판 없음, 보상 차도 주지 않음).
# 문구는 모두 MiniMessage.
enabled: true

# 서버에서 처음 끝까지 같이 달린 한 사람에게. 돈 대신 하나뿐인 것:
# 칭호, 그의 차 '미완의 질주' 한 대 (귀속 · 그날의 도색 · 휠 · 언더글로우 그대로), 차가 두 대 찍힌 사진, 추모 자리의 명판, 간판에 불이 들어온 차고
rewards:
  money: 0
  title: economy:last_drive

solved-line: "<dark_gray>어느 국도 끝, 오래 내려져 있던 셔터 위 간판에 불이 들어왔다. 누군가 그를 집까지 데려다주었다."
too-late: "<dark_gray>…셔터가 내려가 있다. 간판에는 불이 들어와 있다. 누군가 먼저 그를 집에 데려다주었다."

# 죽은 레이서의 이름 (사진 뒷면 {racer})
racer: "한도윤"

# 그의 차: 코어의 '미완의 질주' (stsv:racer_coupe · 이 비밀만을 위한 차: 어디서도 팔지 않음). 보상으로도 이 아이템을 한 대 줌 (귀속,
# 정답의 도색 · 휠 · 언더글로우를 입힌 채). 코어 0.123.0 이상 필요: 그보다 옛 코어면 경고 한 줄 남기고 stsv:tuner_car 로 대신하며,
# 임시 차는 도색만 · 보상은 순정으로 줌 (오류는 나지 않음).
# body · wheel 은 코어 아이템에서 읽지 못할 때만 쓰는 모델 이름, lamp 는 켜진 전조등 모델 (content/stsv/models).
car:
  item: stsv:racer_coupe
  body: racer_coupe
  wheel: wheel_racer
  lamp: racer_coupe_lamp_head

# 그 차의 진짜 모습은 서버마다 하나: 메인 월드의 UID 로 정해짐 (이 서버의 모두에게 같고, 서버마다 다름).
# 처음 정해진 값은 eco.kv secret.garage.answer 에 적어 두고 그 뒤로는 그것을 씀 (나중에 옵션이 늘어도 바뀌지 않음).
# 이미 장소가 정해져 있던 서버 (옵션이 늘기 전부터 이 비밀이 돌던 서버) 는 added: true 가 아닌 옵션만으로 정함 = 전과 같은 정답.
# 직접 정하려면 아래 주석을 풀 것 (셋 다 options 에 있는 id 여야 함). 지금 정답은 /관리자 비밀 연출 폐차고 정답
#answer: { paint: wine, wheel: gold, underglow: cyan }

# 고를 수 있는 것들. 코어 튜닝샵 (content/stsv/vehicle_tuning.yml) 의 racer_coupe 옵션을 그대로 옮김 (코어가 목록을 내주지 않아서):
# 이름 · 견본 색은 그 파일과 같게, id 는 리소스팩에 그 모델이 있는 것만
#   도색 stsv:model/racer_coupe_p_<id> (순정이 프라이머 회색이라 13색 전부) · 휠 stsv:model/wheel_racer_w_<id> · 언더글로우 stsv:model/underglow_<id>
# added: true = 이 비밀의 첫 버전 뒤에 더한 옵션 (이미 돌던 서버의 정답을 정할 때는 빼고 셈: 위 answer 설명)
# clue = 단서 문구. 휠은 사진 설명 ({wheel}), 도색은 페인트 조각 설명 ({paint}) 에 들어감: 옵션 이름을 말하지 않고 모양 · 색을 묘사.
# 일부러 이웃끼리 (레드/와인/오렌지 · 블루/네이비/퍼플 · 화이트/진주/실버) 헷갈릴 만하게 — 셔터가 알려 주는 "몇 개 맞았는지" 로 가려야 함.
# 언더글로우는 문구가 아니라 밤의 커브에 남은 빛 (color 그대로의 가루) 으로 알려 줌.
options:
  paints:
    white:  { name: "화이트", color: "#f1f3f6", clue: "새 종이 같은 색. 어느 쪽으로 기울여 봐도 차갑게 그대로다." }
    pearl:  { name: "진주",   color: "#f3e9d6", clue: "흰색인 줄 알았는데 기울이면 살구빛이 돈다." }
    silver: { name: "실버",   color: "#7e8890", clue: "희지도 검지도 않다. 비 온 뒤의 난간 같은 색." }
    black:  { name: "블랙",   color: "#2d333b", clue: "빛에 비춰도 아무 빛깔이 돌지 않는다. 긁어 봐도 속까지 같은 색이다." }
    red:    { name: "레드",   color: "#e21806", clue: "소방차 옆에 두면 구분이 안 될 것이다." }
    wine:   { name: "와인",   color: "#8a1423", clue: "붉은데 어둡다. 잘 익은 자두 껍질 같기도, 마른 피 같기도 하다." }
    orange: { name: "오렌지", color: "#f08020", clue: "빨강이라기엔 밝고 노랑이라기엔 익었다. 늦가을 감 같은 색." }
    yellow: { name: "옐로",   color: "#f9c228", clue: "어두운 데서도 눈에 띈다. 병아리보다는 진한 색." }
    green:  { name: "그린",   color: "#0f784c", clue: "솔잎을 짓이긴 색. 그늘에서는 거의 검게 보인다." }
    blue:   { name: "블루",   color: "#3b82e0", clue: "맑은 날 한낮의 하늘을 조금 진하게 탄 색." }
    navy:   { name: "네이비", color: "#24468c", clue: "해가 지고 한참 뒤의 바다 색. 파랗다고 하기엔 너무 깊다." }
    purple: { name: "퍼플",   color: "#7a3fc8", clue: "잘 익은 포도알을 문지른 색. 파랑도 빨강도 아닌데 둘 다 조금씩 들어 있다.", added: true }
    pink:   { name: "핑크",   color: "#ec869f", clue: "봄에 지는 꽃잎 색. 이런 색 차는 흔치 않다." }
  wheels:
    five:    { name: "실버 5스포크",  color: "#bbd1e0", clue: "바퀴살은 다섯. 밝은 쇠가 별 모양으로 뻗어 있다." }
    split:   { name: "스플릿 스포크", color: "#ddf3fe", clue: "바퀴살이 둘씩 짝지어 갈라져 있다. 세어 보니 열 가닥." }
    turbine: { name: "터빈",          color: "#677079", clue: "가는 날개가 열두 장. 어두운 바퀴가, 멈춰 있는데도 도는 것 같다." }
    black:   { name: "블랙 6스포크",  color: "#384352", clue: "바퀴살은 여섯. 테두리만 반짝이고 살은 구멍처럼 검다." }
    gold:    { name: "골드 6스포크",  color: "#f0c32e", clue: "바퀴살은 여섯. 흑백 사진인데도 바퀴만은 빛나 보인다." }
    white:   { name: "랠리 화이트",   color: "#f1f3f6", clue: "바퀴살은 다섯. 차체보다 바퀴가 더 희다. 흙길 차들이 끼우던 그런 바퀴." }
    disc:    { name: "폴리시 디스크", color: "#9db1c1", clue: "바퀴살이 없다. 접시 같은 원판에 하늘이 비친다." }
  underglows:
    cyan:   { name: "시안",   color: "#46e6ff" }
    blue:   { name: "블루",   color: "#4678ff" }
    purple: { name: "퍼플",   color: "#aa5aff" }
    pink:   { name: "핑크",   color: "#ff50c8" }
    red:    { name: "레드",   color: "#ff3c3c" }
    orange: { name: "오렌지", color: "#ff9628" }
    green:  { name: "그린",   color: "#50ff6e" }
    white:  { name: "화이트", color: "#f0f5ff" }

# 장소: 서버마다 한 번 정해 저장 (eco.kv secret.garage.place). 그 길이 없어지거나 바뀌면 다시 정함.
#   커브 = 어려운길 국도에서 window 칸에 걸쳐 방향이 가장 많이 꺾이는 점 (어려운길이 없으면 아무 국도. 국도가 없으면 비밀은 잠듦)
#   차고 = 같은 길의 끝 (하역장 쪽: 국도는 터미널에서 하역장으로 놓임) 에서 garage.back 칸 앞, 길가
places:
  window: 30                   # 커브를 재는 구간 (칸)
  min-run: 60                  # 커브에서 차고까지 적어도 이만큼 (칸). 이보다 짧은 길은 쓰지 않음
  recheck-seconds: 300         # 이 간격으로 그 길이 그대로인지 봄

# 추모 자리 (커브 바깥쪽 길가: 꽃 몇 송이, 다 탄 초, 기대어 둔 사진). 비밀이 켜져 있으면 가까이 온 누구에게나 보임
memorial:
  range: 48                    # 이 거리 안에서 보임
  side: 4.6                    # 가드레일이 없는 커브일 때 길 가운데에서 이만큼 바깥 (있으면 난간 바로 안쪽)
  flowers: [poppy, azure_bluet, oxeye_daisy, white_tulip, cornflower]

# 페인트 조각: 사진을 손에 들고 커브 20칸 안에 있을 때만 난간 위에 보임 (추모 자리에서 길 따라 along 칸)
chip:
  along: 3
  name: "<#b9b2a8>페인트 조각"
  lore:
    - "<gray>난간에 긁혀 묻어 있던 마른 페인트."
    - "<gray>{paint}"
    - "<dark_gray>팔 수 없음"

# 밤의 빛: 밤 (월드 시간 13000~23000) 에 커브 이 거리 안에 서 있으면 아스팔트에 언더글로우 색 가루가 한 줄
glow:
  range: 14

# 사진 ({wheel} = 정답 휠의 clue, {racer}, 푼 뒤 {player} {date})
photo:
  name: "<#cfc7b8>빛바랜 사진"
  lore:
    - "<gray>빛바랜 흑백 사진. 차 한 대가 액자 밖으로 반쯤 잘려 있다."
    - "<gray>{wheel}"
    - "<dark_gray><i>뒷면에 연필로: {racer}, 집에 가는 길"
    - "<dark_gray>팔 수 없음"
  done-name: "<gradient:#e8e8e8:#9fb2c8>사진 — 두 대"
  done-lore:
    - "<gray>이제 액자 안에 차가 두 대 있다. 나란히."
    - "<gray>한 대는 여전히 반쯤 잘려 있다. 운전석에는 아무도 없다."
    - "<dark_gray><i>뒷면에 연필로: {racer}, {player} — 집에 도착"
    - "<dark_gray>{date}"

# 차고 (길 끝 길가: 콘크리트 상자, 녹슨 셔터, 죽은 네온 간판). 사진을 가진 사람 (1단계 이상) 에게만 보임
garage:
  range: 64                    # 이 거리 안에서 보임
  near: 9                      # 사진을 지니고 이 거리 안으로 오면 셔터가 덜컹 올라감 (2단계)
  back: 24                     # 길 끝에서 이만큼 앞 (하역장 입구 · 횡단보도를 피함)
  side: 8                      # 길 가운데에서 셔터까지 (갓길 5.5칸 바깥). 어느 쪽 · 정확한 자리는 마른 땅(물 · 얼음 · 용암 위 아님) 중 가장 평평한 곳으로 맞춰 저장 (없으면 16칸까지 더 멀리, ±60칸 · 시작 쪽까지 찾음)
  open: 0.62                   # 셔터가 올라가는 높이 (0~1. 문 높이 3칸의 비율)
  sign: "도윤 모터스"
  sign-dead: "<#3b3b40>"       # 죽은 간판 색 · 풀린 뒤 불이 들어온 색
  sign-lit: "<#ff5fa8>"
  blocks:
    wall: light_gray_concrete
    trim: gray_concrete
    roof: stone
    floor: smooth_stone
    sign-board: black_concrete
    bench: smithing_table
    shelf: barrel
    tarp: light_gray_wool
    tarp-fold: gray_wool
    shutter: [iron_block, raw_iron_block, iron_block]   # 셔터 여섯 줄에 돌아가며 (녹슨 줄 = 철 원석 블록)

# 복원 (작업대): 셔터를 내리면 shut-seconds 뒤에 "셋 중 몇 개가 맞는지" 만 알려 줌. 다음 확인까지 check-seconds
check-seconds: 300
test-check-seconds: 5
shut-seconds: 4

# 마지막 드라이브에서 규칙을 어기면 (차에서 내림 · 부딪힘 · 옆을 벗어남 · 접속 종료) 다음 시도까지
retry-seconds: 300
test-retry-seconds: 10

# 마지막 드라이브: 밤에 커브 range 칸 안으로 오면, 커브 lead 칸 앞 (오른쪽 차로) 에 그의 차가 전조등을 켜고 기다림
drive:
  range: 40
  lead: 30
  lane: 1.3                    # 차로 가운데 (길 가운데에서. 내 차는 오른쪽, 유령은 왼쪽)
  wait-seconds: 180            # 이 안에 타지 않으면 차는 조용히 사라짐 (벌 없음. 1분 뒤부터 조건이 맞으면 또 나타남)
  start-sound: "stsv:vehicle.racer_coupe.engine_start"
  skid-sound: "stsv:vehicle.sports_car.skid"

# 유령의 운전 (블록/초). 그의 차는 13.5블록/초 (국도 위에서는 보너스로 15.5 안팎) 라 사람이 여유 있게 옆에 붙을 수 있는 속도.
# 직선에서 straight, sharp 도 이상 꺾이는 곳에서 bend 까지 줄임. 내가 뒤처지면 조금 늦추지만 (min 아래로는 안 감) 서지는 않음.
pace:
  straight: 11
  bend: 6.5
  sharp: 40                    # 앞 16칸이 이만큼 (도) 꺾이면 bend 속도
  min: 3
  accel: 3                     # 가속 · 감속 (블록/초²)
  brake: 5
  near: 14                     # "옆" = 유령에게서 이 거리 안. 벗어난 채 near-seconds 가 지나면 끝
  near-seconds: 10
  ahead: 18                    # 길을 따라 이보다 앞서거나
  behind: 22                   # 이보다 뒤처진 채 grace-seconds 가 지나면 끝
  grace-seconds: 4
  bumps-allowed: 0             # 부딪혀도 봐주는 횟수 (0 = 한 번이라도 부딪히면 끝)

# 작업대 화면
gui:
  title: "<dark_gray>작업대 — 그날 그대로"
  label-paint: "<white>도색"
  label-wheel: "<white>휠"
  label-glow: "<white>밑의 불빛"
  label-paint-lore: ["<gray>차체의 색"]
  label-wheel-lore: ["<gray>바퀴의 모양"]
  label-glow-lore: ["<gray>차 밑에 깔리던 네온"]
  choose: "<gray>누르면 이걸로 바꾼다"
  chosen: "<green>지금 이 모습이다"
  button: "<white>셔터 내리기"
  button-lore:
    - "<gray>셔터를 내리고 잠시 기다린다."
    - "<gray>그는 셋 중 몇 개가 맞는지만 말해 준다."
  now: "<gray>지금: <white>{look}"
  wait: "<dark_gray>…셔터 너머가 조용하다. ({seconds}초 뒤에)"
  notebook: "<dark_gray>— 지금까지 —"
  notebook-line: "<gray>{look} <dark_gray>→ <white>{n}"

lines:
  # 추모 자리
  photo-1: "<dark_gray>…꽃 사이에 기대어 있던 사진을 집어 들었다."
  photo-2: "<dark_gray>…차가 액자 밖으로 반쯤 잘려 있다. 뒷면에 연필 글씨가 있다."
  photo-back: "<dark_gray>…사진이 다시 그 자리에 놓여 있다."
  memorial-again: "<dark_gray>…누군가 꽃을 갈아 두었다."
  memorial-after: "<dark_gray>…꽃이 새것으로 바뀌어 있다."
  plaque: "<#e8d9a0>끝까지 같이 달린 사람: <white>{player}"
  # 단서
  chip-seen: "<dark_gray>…난간에 뭔가 긁혀 묻어 있다."
  chip: "<dark_gray>…난간에서 마른 페인트 조각이 떨어져 나왔다."
  glow: "<dark_gray>…아스팔트에 빛이 남아 있다."
  # 차고
  garage-1: "<#9fb2c8>…내 차."
  garage-2: "<#9fb2c8>…그날 그대로 해 줘."
  garage-bench: "<dark_gray>…안쪽에 작업대가 있다."
  bench-done: "<dark_gray>…더 손댈 데가 없다."
  pick-all: "<dark_gray>…아직 다 고르지 않았다. 도색, 휠, 그리고 밑의 불빛."
  check-wait: "<dark_gray>…셔터 너머가 조용하다. 조금 기다리자."
  right-0: "<#9fb2c8>…아니야. 하나도."
  right-1: "<#9fb2c8>…하나는 내 거야."
  right-2: "<#9fb2c8>…거의 다 왔어. 하나가 달라."
  right-3: "<#9fb2c8>…그래. 이 차야."
  come-at-night: "<#9fb2c8>…밤에, 그 커브로 와."
  # 마지막 드라이브
  not-tonight: "<#9fb2c8>…오늘은 아니야. 다음 밤에."
  car-waits: "<#9fb2c8>…타."
  together: "<#9fb2c8>…같이 가자. 그날 못 간 데까지."
  too-fast: "<#9fb2c8>…천천히. 옆에 있어 줘."
  too-slow: "<#9fb2c8>…거기 있지? 옆으로 와."
  bend: "<#9fb2c8>…여기야. 여기서 못 돌았어."
  fail: "<#9fb2c8>…괜찮아. 다음 밤에."
  home-1: "<#9fb2c8>…다 왔네."
  home-2: "<#9fb2c8>…그 차, 이제 네가 타."
  home-3: "<#9fb2c8>…천천히 다녀."
  car-given: "<gray>받은 것: {item} <dark_gray>— 열쇠가 조수석에 놓여 있었다."

# ------------------------------------------------------------------------------------------------------------------
# 후속 임무 「도윤 모터스」 (docs/admin/숨은_비밀/폐차고의_주인.md "후속 임무")
# 푼 사람 한 명에게만, 일주일에 한 번쯤. 밤에 차고 (셔터는 내려져 있고 간판에 불이 들어온) 가까이 오면 셔터 밑으로 쪽지가 한 장 밀려 나온다:
# 한도윤이 끝내 못 해 본 일 하나. 지어진 국도 위에서, 보상으로 받은 그 차 (미완의 질주) 로 대신 해 주고 차고로 돌아오면
# 셔터 너머에서 한마디, 보상, 그리고 "사진 — 두 대" 뒷면에 연필 글씨가 한 줄 는다. 규칙을 어기면 "…괜찮아. 다음 주에." — 잃는 것은 없다.
# 모든 것은 그 사람에게만 보이고 들린다 (빌린 차 한 대만 진짜 임시 탈것이라 남에게도 보이지만, 그 사람 말고는 탈 수 없음).
# 국도 · 차고 · 탈것 모듈이 없으면 잠든다 (/관리자 비밀 후속 폐차고 상태 에 이유가 나옴).
# 테스트 모드: 밤이 아니어도 됨 · 한 주 = common.yml sequel.test-week-seconds · test-… 시간 · 돈은 주지 않음 (금액만 보여 줌).
sequel:
  enabled: true
  # 난이도 HARD: 150,000 ~ 300,000 G (1,000 단위로 내림). 그 밖의 특전은 없음 (사진 뒷면의 한 줄뿐)
  reward:
    money: [150000, 300000]
  done: "<dark_gray>…셔터 밑에 봉투가 하나 놓여 있다. 기름 묻은 손자국이 찍혀 있다. <gray>({reward})"

  chance: 1.0                  # 조건이 맞는 순간 (밤 · 차고 near 칸 안 · 이번 주에 아직 없음) 초마다 이 확률로 쪽지가 나옴 (1 = 바로)
  near: 10                     # 차고 셔터에서 이 거리 안: 쪽지가 나오는 곳, 끝내고 돌아와야 하는 곳
  tries: 2                     # 주행 과제에서 규칙을 어겨도 되는 횟수 (2 = 한 번은 "한 번 더", 두 번째에 그 주는 끝)
  avoid-recent: 4              # 최근 이만큼의 과제는 다시 고르지 않음 (할 수 있는 과제가 모자라면 오래된 것부터 다시 나옴)
  min-length: 40               # 주행 구간이 이보다 짧게 잡히는 과제는 그 길에서는 고르지 않음 (칸)
  other-min: 150               # "다른 국도" 로 쓰는 길의 최소 길이 (칸). 그런 길이 없으면 road: other 과제는 차고의 길로 대신함
  offroad: 9                   # 주행 중 길 가운데에서 이보다 멀어진 채 3초가 지나면 끝 ("길 밖")
  stickers: 6                  # 사진 뒷면에 남기는 줄 수 (넘으면 오래된 것부터 지우고 "…그리고 n번 더.")

  # 차가 없는 사람 (보상 차를 잃었거나, 테스트 모드): 쪽지를 받은 뒤 셔터 앞 lend-near 칸 안에 탈것 없이 lend-after 초 서 있으면
  # 차고 앞 길에 그의 차를 한 대 내준다 (임시 탈것: 마지막 드라이브의 차와 같은 방식. 그 사람만 탈 수 있음).
  # 끝나거나 · 실패하거나 · 주가 바뀌거나 · 나가거나 · 타지 않은 채 lend-leash 칸 넘게 멀어지면 사라짐. 자기 차를 몰면 바로 거둠.
  lend-after: 20
  test-lend-after: 4
  lend-near: 12
  lend-leash: 120

  # 부품 (kind: part 과제의 임무 전용 아이템). 새 아이템을 만들지 않고 기존 비밀 아이템 (페인트 조각) 에 이름 · 설명만 바꿔 씀.
  # 팔 수 없고, 그 주가 지나면 그냥 종이. 잃어버리면 차고 앞에서 다시 줌 (전에 준 것은 통하지 않음).
  part:
    item: economy:paint_chip
    name: "<#b9b2a8>기름종이에 싼 부품"
    lore:
      - "<gray>기름종이에 싸여 있다. 손바닥만 한 쇳덩이."
      - "<dark_gray><i>꼬리표: 길가 상자 ({x}, {z})"
      - "<dark_gray>팔 수 없음"
  # 부품을 두고 오는 길가 상자 (그 사람에게만 보임. 마른 땅 위에만 섬)
  spot:
    range: 56                  # 이 거리 안에서 보임
    block: barrel
    light: soul_lantern

  # ---- 과제 ----------------------------------------------------------------------------------------------------
  # 그 주의 과제는 (플레이어, 주) 로 정해져 재시작해도 같고, 최근 avoid-recent 개와 겹치지 않게 고름. 지금 길에서 못 하는 것 (구간이 짧음) 은 빠짐.
  # 공통 키:
  #   kind: drive (기본) | part          enabled: false 로 끌 수 있음
  #   road: home (기본: 커브와 차고가 있는 그 국도) | other (이번 주의 다른 국도. 없으면 home 으로 대신하고 …-home 문구를 씀)
  #   from · to (home 일 때) / other-from · other-to (other 일 때): 구간의 시작 · 끝.
  #       start(길 처음) · end(길 끝) · bend(그 커브) · garage(차고 앞) 에 +N / -N 칸. to 가 from 보다 앞이면 거꾸로 달림
  #   max-length: 구간을 이 길이까지만 (0 = 끝까지)
  #   night: true = 밤에만 출발할 수 있음
  #   규칙 (여러 개를 함께 쓸 수 있음):
  #     bumps: 부딪혀도 되는 횟수 (0 = 한 번도 안 됨, -1 = 상관없음)
  #     speed: 이 평균 속도 (블록/초) 로 달린 시간 + slack 초 안에 도착 (0 = 시간 제한 없음). 미완의 질주는 국도에서 15.5 안팎까지 나감
  #     band: [낮게, 높게] 속도를 이 사이로 유지. grace 초 넘게 벗어나 있으면 끝 (처음 그 사이에 들어온 순간부터, 늦어도 출발 5초 뒤부터 셈)
  #     gates: 이 간격 (칸) 으로 그의 "라인" 불빛을 놓음 (그 사람에게만 보이는 불꽃; 길 가운데에서 lane 칸 왼쪽 · 오른쪽).
  #            불빛에서 radius 칸 안으로 지나가야 함 (lane 기본 1.6 · radius 기본 1.2: 길 한가운데로는 못 지나감). misses 개까지 놓쳐도 됨
  #     stop: true = 구간 끝의 흰 선 앞 box 칸 안에 완전히 서야 함 (오는 동안 reach 이상으로 달린 적이 있어야 하고, 선을 넘으면 끝)
  #   문구: note (쪽지의 글 몇 줄) · goal (할 일 한 줄: 쪽지 끝과 차고 앞 · 재접속 때 다시 보여 줌) · go (출발하는 순간) ·
  #         after (끝내고 돌아왔을 때 셔터 너머에서) · sticker (사진 뒷면에 남는 한 줄)
  #         {road} {seconds} {lo} {hi} {sx} {sz} (출발 좌표) {x} {z} (도착 좌표) {tries} {racer}
  #   kind: part 는 spot / other-spot (상자가 놓이는 곳), part-name · part-lore (없으면 위 part 의 것)
  tasks:
    clean-home:
      road: home
      from: start+4
      to: garage
      bumps: 0
      note:
        - "<#cfc7b8><i>…집에 가는 길을 한 번도 안 긁고 들어온 적이 없어."
        - "<#cfc7b8><i>…매번 어딘가 하나는 긁었지. 범퍼든, 자존심이든."
      goal: "<#cfc7b8><i>…길 처음부터 차고 앞까지. 한 번도 부딪히지 말고."
      go: "<#9fb2c8>…천천히 해도 돼. 긁지만 마."
      after: "<#9fb2c8>…흠집 하나 없네. 나보다 낫다."
      sticker: "한 번도 안 긁고 집까지"

    clean-out:
      road: other
      other-from: start+4
      other-to: end-6
      from: garage
      to: start+4
      bumps: 0
      note:
        - "<#cfc7b8><i>…세차하고 나간 날은 꼭 어디선가 긁혀서 돌아왔어."
        - "<#cfc7b8><i>…'{road}' 가는 길이었어. 그 길은 한 번도 깨끗하게 끝까지 못 가 봤다."
      note-home:
        - "<#cfc7b8><i>…세차하고 나간 날은 꼭 어디선가 긁혀서 돌아왔어."
        - "<#cfc7b8><i>…차고에서 나가는 길. 그 길을 한 번도 깨끗하게 끝까지 못 가 봤다."
      goal: "<#cfc7b8><i>…'{road}' 가는 길을 처음부터 끝까지. 흠집 없이."
      goal-home: "<#cfc7b8><i>…차고 앞에서 길 처음까지, 거꾸로. 흠집 없이."
      go: "<#9fb2c8>…세차한 날이라고 생각해."
      after: "<#9fb2c8>…깨끗하네. 비만 안 오면 되는데."
      sticker: "세차한 날, 깨끗하게 끝까지"

    flowers:
      road: home
      from: garage
      to: bend
      speed: 9.5
      slack: 5
      bumps: 1
      note:
        - "<#cfc7b8><i>…그 커브의 꽃은 늘 누가 갈아 주더라."
        - "<#cfc7b8><i>…나도 한 번은, 시들기 전에 가 보고 싶었어."
      goal: "<#cfc7b8><i>…차고 앞에서 그 커브까지. {seconds}초 안에."
      go: "<#9fb2c8>…시들기 전에."
      after: "<#9fb2c8>…아직 안 시들었지? 다행이다."
      sticker: "시들기 전에 꽃 보러 가기"

    curfew:
      road: home
      from: start+4
      to: garage
      speed: 10.5
      slack: 6
      bumps: 2
      note:
        - "<#cfc7b8><i>…어머니한테 열두 시 전에는 들어간다고 했었어."
        - "<#cfc7b8><i>…그날도 그렇게 말하고 나왔어."
      goal: "<#cfc7b8><i>…길 처음에서 차고 앞까지. {seconds}초 안에."
      go: "<#9fb2c8>…열두 시 전에."
      after: "<#9fb2c8>…열두 시 전이네. …다녀왔습니다."
      sticker: "약속한 시간 안에 집에 들어가기"

    cruise:
      road: home
      from: start+10
      to: bend-15
      night: true
      band: [8, 10.5]
      grace: 2.5
      bumps: -1
      note:
        - "<#cfc7b8><i>…기름값 아낀다고 바늘을 한 자리에 붙들고 다닌 적이 있어."
        - "<#cfc7b8><i>…사흘 갔나. 발이 가만있질 못해서."
      goal: "<#cfc7b8><i>…밤에, 길 처음부터 그 커브 앞까지. 속도계 바늘을 {lo}~{hi} 사이에 붙들고."
      go: "<#9fb2c8>…바늘만 봐. 가만히."
      after: "<#9fb2c8>…바늘이 안 떨렸네. 나는 사흘을 못 갔는데."
      sticker: "바늘을 한 자리에 붙들고 달리기"

    slow-bend:
      road: home
      from: bend-45
      to: bend+30
      band: [3.5, 7]
      grace: 1.5
      bumps: 0
      note:
        - "<#cfc7b8><i>…그 커브를 천천히 돌아 본 적이 없어. 한 번도."
        - "<#cfc7b8><i>…천천히 돌면 뭐가 보이는지 궁금해."
      goal: "<#cfc7b8><i>…그 커브를 지나가 줘. 들어가기 전부터 나올 때까지 {lo}~{hi} 사이로, 천천히. 부딪히지 말고."
      go: "<#9fb2c8>…천천히. 끝까지 천천히."
      after: "<#9fb2c8>…그렇게 도는 거였구나. 꽃이 보였겠다."
      sticker: "그 커브를 천천히 돌기"

    stop:
      road: home
      from: bend-75
      to: bend-12
      stop: true
      reach: 11
      box: 5
      bumps: 0
      note:
        - "<#cfc7b8><i>…브레이크를 조금만 일찍 밟았으면, 하고 아직도 생각해."
        - "<#cfc7b8><i>…커브 앞에 선을 하나 그어 놨어. 네 눈에만 보일 거야."
      goal: "<#cfc7b8><i>…커브 쪽으로 달려오다가, 그 흰 선 앞에 서 줘. 넘지 말고."
      go: "<#9fb2c8>…밟아. 그리고 제때 서."
      after: "<#9fb2c8>…섰네. 그게 그렇게 쉬운 거였네."
      sticker: "커브 앞에서 제때 서기"

    line:
      road: home
      from: bend-50
      to: bend+45
      night: true
      gates: 12
      radius: 1.2
      misses: 1
      bumps: 1
      note:
        - "<#cfc7b8><i>…그 커브에는 내가 밟던 자리가 있어. 들어가는 자리, 나오는 자리."
        - "<#cfc7b8><i>…밤이면 아직 남아 있을 거야. 불빛으로."
      goal: "<#cfc7b8><i>…밤에, 커브 앞뒤로 놓인 불빛을 하나씩 밟고 지나가 줘."
      go: "<#9fb2c8>…파란 불부터. 하나씩."
      after: "<#9fb2c8>…맞아. 거기야. 길이 아직 기억하네."
      sticker: "그가 밟던 자리를 따라 달리기"

    detour:
      road: other
      other-from: start+4
      other-to: end-6
      from: garage
      to: start+4
      max-length: 360
      gates: 18
      radius: 1.3
      misses: 2
      bumps: -1
      note:
        - "<#cfc7b8><i>…집에 바로 가기 싫은 날엔 '{road}' 쪽으로 돌아서 갔어."
        - "<#cfc7b8><i>…이유는 없었어. 그냥 그 길의 불빛이 좋았어."
      note-home:
        - "<#cfc7b8><i>…집에 바로 가기 싫은 날엔 왔던 길을 다시 나갔어."
        - "<#cfc7b8><i>…이유는 없었어. 그냥 그 길의 불빛이 좋았어."
      goal: "<#cfc7b8><i>…'{road}' 가는 길 처음에서부터, 불빛을 따라가 줘. 꺼질 때까지."
      goal-home: "<#cfc7b8><i>…차고 앞에서부터 왔던 길로, 불빛을 따라가 줘. 꺼질 때까지."
      go: "<#9fb2c8>…급할 거 없어. 돌아가는 길이니까."
      after: "<#9fb2c8>…좋았지? 이유는 나도 몰라."
      sticker: "이유 없이 돌아서 가던 길"

    part:
      kind: part
