# 숨은 비밀: 속삭이는 광맥 (운영자 문서: docs/admin/숨은_비밀/속삭이는_광맥.md · README 에는 적지 않음)
# 깊은 곳 광부들은 "광맥이 숨을 쉰다"고 했다. 그 광맥은 심장이었고, 아직 뛰고 있다.
# 깊은 곳 광석을 캐다 아주 드물게 돌 속에서 "…더 깊이…" → 그 사람에게만 보이는 "있을 수 없는 광석" 의 흔적
# (다음 광석의 심장 소리만 듣고 찾아감, 빛을 놓으면 사라짐) → 끝에서 뛰는 심장 원석을 박자에 맞춰 13번 → 멈춤.
enabled: true

# 시작: y 가 below-y 보다 낮은 곳에서 광석 블록을 캘 때마다 이 확률로 (한국 날짜로 하루 한 번까지)
start:
  # 장신구로 채굴이 아주 빠른 서버라 확률을 아주 낮게 (광석 2만 개에 한 번쯤)
  chance: 0.00005
  below-y: 0
  # 테스트 모드에서는 확률 100%, 이 높이 아래면 됨
  test-below-y: 40

# 흔적 (있을 수 없는 광석들, 그 사람에게만 보이는 가짜 블록. 실제로는 그 자리의 돌)
trail:
  length: [20, 30]        # 광석 수 (사람마다 씨앗으로 정해짐)
  test-length: 8          # 테스트 모드
  step: [4, 7]            # 다음 광석까지 (블록). 아래로 · 옆으로 꺾이며 단단한 돌 속으로
  floor-margin: 6         # 월드 바닥(기반암)에서 이만큼 위까지만 내려감
  resume-range: 40        # 흔적이 꺼진 뒤(접속 종료 · 서버 재시작) 시작점(심장이면 심장 자리) 이 칸 안에 오면 이어짐
  # 광석을 숨길 수 있는 돌 (주변 6칸에 물 · 용암이 없고, 내가 블록을 바꿀 수 있는 땅이어야 함)
  rock: [stone, deepslate, tuff, andesite, diorite, granite]
  deep-rock: [deepslate, tuff]   # 이 돌에는 deep 광석을, 나머지에는 stone 광석을
  # 가짜 광석 (차례로 돌아가며). 실제 돌보다 단단해 보여야 클라이언트가 빨리 캐지 않음
  ores:
    stone:
      - "minecraft:redstone_ore[lit=true]"
      - "minecraft:diamond_ore"
      - "minecraft:emerald_ore"
    deep:
      - "minecraft:deepslate_redstone_ore[lit=true]"
      - "minecraft:deepslate_diamond_ore"
      - "minecraft:deepslate_emerald_ore"

# 빛 규칙: 흔적 · 심장 중에 이 칸 안(그 사람 또는 지금 광석 · 심장에서)에 빛나는 블록을 놓으면 (누가 놓든) 흔적이 사라지고
# 시작점부터 다시 (하루 잠김 없음, 새 길). 빛 = 블록의 밝기가 1 이상 (횃불, 랜턴, 발광석, 용암 양동이 …)
light:
  radius: 24

# 심장 원석 (마지막 광석을 캐면 그 자리에 나타남)
heart:
  block: "minecraft:deepslate_redstone_ore[lit=true]"
  glow: "#7a0f0f"
  scale: 0.78             # 평소 크기 (블록 1 = 1.0)
  beat-scale: 0.95        # 뛸 때
  bpm: 60                 # 처음 빠르기
  window-ms: 120          # 박자 ± 이만큼 안에 때리면 맞음
  faster: 0.85            # 빗나가면 박자 간격 × 이만큼 (빨라짐)
  min-interval-ms: 450    # 아무리 빨라져도 이 간격보다는 느리게
  hits: 13                # 맞혀야 하는 수
  misses: 3               # 이만큼 빗나가면 무너짐
  listen-beats: 4         # 처음 몇 박자는 듣기만 (이때 때린 것은 안 셈)
  latency: true           # 그 사람의 핑만큼 판정을 당겨 줌 (소리가 늦게 닿고, 때린 것이 늦게 오니까)
  reach: 5                # 이 칸 안에서 심장을 바라보고 때려야 셈
  dark-every: 4           # 이 박자마다 어둠이 한 번 숨 쉼 (0 = 없음)

# 무너짐 (3번 빗나감): 가짜 낙석 · 어둠 · 뒤로 밀림 → 흔적을 처음부터 (같은 씨앗)
collapse:
  rewind: 0               # 0 = 시작점부터, n = 마지막 n 개 광석만 다시

# 공포 연출
dread:
  echo-chance: 0.3        # 흔적 중 블록을 캘 때, 곡괭이 소리가 한 박자 늦게 한 번 더 (최소 3초 간격)
  scrape-chance: 0.5      # 흔적 광석을 캔 뒤 벽 너머에서 긁는 소리
  figure-chance: 0.12     # 흔적 광석을 캘 때마다, 시야 가장자리에 광부 모자를 쓴 형체 (바라보면 사라짐)
  figure-from: 4          # 몇 번째 광석부터
  figure-skin: ""         # 마네킹 스킨 (economy:entity/..., 비우면 기본 얼굴)
  figure-hat: "#d9b227"   # 형체의 안전모 (가죽 모자 색)
  dark-last: 6            # 마지막 이만큼의 광석 동안 어둠이 맥박처럼

sounds:
  heartbeat: { sound: entity.warden.heartbeat, volume: 1.0, pitch: 1.0 }   # 흔적 · 심장 (흔적은 거리로 크기 · 높이가 바뀜)
  whisper: { sound: entity.warden.sniff, volume: 0.35, pitch: 0.5 }
  crumble: { sound: block.deepslate.break, volume: 0.5, pitch: 0.5 }       # 가짜 광석이 부서질 때
  scrape: { sound: entity.silverfish.step, volume: 0.7, pitch: 0.45 }      # 벽 너머 긁는 소리 (세 번)
  glare: { sound: entity.warden.listening_angry, volume: 0.8, pitch: 0.6 } # 빛
  strike: { sound: block.deepslate.hit, volume: 1.0, pitch: 0.5 }          # 심장을 맞혔을 때
  collapse: { sound: entity.generic.explode, volume: 0.7, pitch: 0.45 }
  falling: { sound: block.deepslate.break, volume: 1.0, pitch: 0.6 }

text:
  start: "<dark_gray>…더 깊이…"
  resume: "<dark_gray>…돌아왔구나."
  relocate: "<dark_gray>…여기도 이어져 있어."
  heart: "<dark_gray>…찾았구나."
  glare: "<dark_red>…눈부셔."
  again: "<dark_gray>…처음부터."
  collapse: "<dark_red>…무너진다."
  retry: "<dark_gray>…다시."
  end: "<dark_red>…이제 네가 뛰어."

# 보상 아이템: 광맥의 심장 (economy:vein_heart, 서버에 하나). 손(주 · 보조)에 들고 있으면 가까운 광석이 심장처럼 뛰며 벽 너머로 빛남 (나에게만)
relic:
  item: economy:vein_heart
  radius: 12              # 이 칸 안의 광석
  max: 60                 # 한 번에 보이는 광석 수
  rescan: 3               # 몇 박자마다 다시 찾기
  glow: "#c22a2a"
  lore:
    - "<gray>손바닥 위에서 아직 뛴다."
    - "<gray>쥐고 있으면, 가까운 광맥이 같은 박자로 뛴다."
    - ""
    - "<dark_gray>손에 들면 주변 {radius}칸의 광석이 벽 너머로 맥박치듯 빛남 (나에게만)"
  owner-line: "<dark_gray>멈춘 사람: {player}"
  test-line: "<yellow>[테스트]"

too-late: "<dark_gray>…심장은 이미 멈춰 있다. 누군가 먼저였다."
solved-line: "<dark_gray>깊은 곳 어딘가에서, 광맥이 숨을 멈췄다…"

# 푼 사람 (서버에서 처음 한 명). 테스트 모드는 돈 빼고. 광맥의 심장은 코드가 따로 줌
rewards:
  money: 300000
  title: economy:heart_miner
