# 숨은 비밀: 안내원 (운영자 문서: docs/admin/숨은_비밀/안내원.md · README 에는 일부러 적지 않음)
# 길라잡이를 모두 마친 사람이 새벽에 안내원에게 말을 걸면, 안내원이 조금 틀린 말을 한다 (질문). 숨은 한 마디를 채팅으로
# 맞히면 안내원이 그 사람의 진짜 기록을 말한다.
# 체험관 정거장 13곳을 길라잡이 번호의 거꾸로 돌며 "틀린 그림"을 찾고, 광장 아래 방에서 진짜 안내원을 고른다.
# 이야기: 새벽의 질문들은 안내원이 잃어버린 자기 조각이고, 13개의 틀린 그림은 그의 기억이 거꾸로 새어 나온 것이다.
# 가짜는 찾아온 사람들의 말을 따라 하며 안내를 배웠다 (그래서 당신 말을 따라 한다). 진짜를 찾으면 처음으로 자기 이름 (name) 을 말한다.
enabled: true

# 한국 시각 [from, to) 시. 1 ~ 4 = 새벽 1:00 ~ 3:59. 테스트 모드에서는 무시
# (확률은 없음: 이 시간에 말을 걸 때마다 질문을 한다)
hours:
  from: 1
  to: 4

# 질문: 대답을 기다리는 시간(초), 틀리거나 말이 없으면 다시 묻기까지(초)
question:
  seconds: 30
  cooldown: 60
# 새벽에 말을 걸 때마다 평소 화면 전에 하나씩 (사람마다 차례로 돌아감). 각 줄에 숨은 한 마디를 채팅으로 대답.
# 대답 확인: 띄어쓰기 · 문장부호 · 따옴표를 빼면 answers 중 하나 "그 자체" 여야 정답. 뒤에 붙어도 되는 건 셈말 (개 · 칸 · 번)
# 과 평범한 끝말 (요 · 이요 · 예요 · 이에요 · 입니다 · 죠 …) 뿐 ("원내안이요", "열세 개", "13개요" 정답 / "직업 아닌데요",
# "열세 개 아닌가요?" 오답). "…이 아니라 X" 처럼 고쳐 말하면 "아니라" 뒤만 본다. 대답한 채팅은 다른 사람에게 안 보임.
# 이 질문들은 안내원이 잃어버린 자기 자신의 조각이다 (이름 · 숫자 · 처음과 끝 · 이곳의 이름).
questions:
  # 자기 이름 거꾸로 (안내원 → 원내안)
  - line: "…제 이름표, 혹시 보셨어요? 거꾸로 걸려 있던데. 뭐라고 쓰여 있었어요?"
    answers: ["원내안"]
  # 길라잡이 주제는 13개 (메뉴 번호 1 ~ 13)
  - line: "…길라잡이는 열세 개였나요, 열네 개였나요?"
    answers: ["열세", "열셋", "13"]
  # 메뉴 1번 = 직업 고르기 (guide/topics/jobs.yml order 1)
  - line: "…다들 1번부터 하시잖아요. 그런데 1번이… 뭐였죠? 자꾸 끝에서부터 생각나요."
    answers: ["직업", "직업 고르기"]
  # 메뉴 마지막 13번 = 미션·업적·치장 (거꾸로 걷기가 시작되는 곳)
  - line: "…맨 끝 번호, 13번은 뭐였죠? 저는 거기서부터만 기억나요."
    answers: ["미션", "업적", "치장", "미션·업적·치장"]
  # 틀린 말 고치기: 땅은 16×16 (guide/topics/land.yml)
  - line: "…땅 한 칸은 열여섯 칸 곱하기 열다섯 칸이었죠? …어딘가 틀렸는데."
    answers: ["열여섯", "16"]
  # 이곳 이름 거꾸로 (관험체 이잡라길 → 길라잡이 체험관; 나중에 숨은 방 글씨와 같음)
  - line: "…여기 이름이 '관험체 이잡라길'이었나요? 똑바로 읽어 주실래요?"
    answers: ["길라잡이체험관"]
# 길라잡이 주제를 모두 마친 사람만 (eco.kv guide.all.<uuid>). 테스트 모드에서는 무시
require-guide: true

# 서버에서 처음 푼 한 사람에게 (테스트 모드는 돈 없음)
# 돈은 주지 않는다 (예전 300,000 G 는 없앰). 보상은 하나뿐인 것들: 칭호, 광장의 동상, 그리고 그 뒤로 안내원이 가끔
# 아무에게나 "○○님이 저를 찾아 주셨어요. 제 이름은 {name}예요." 라고 말해 주는 것 (아래 lines.remember)
rewards:
  money: 0
  title: economy:guide_of_guides

# 안내원이 잃어버렸던 자기 이름. 진짜를 고르면 처음으로 이 이름을 말하고, 그 뒤로도 쓴다
name: "윤해담"
# 풀린 뒤, 아무나 안내원을 우클릭할 때 이 확률로 (사람마다 하루 한 번까지) 평소 화면 전에 lines.remember 한 줄. 테스트 모드는 늘
remember-chance: 0.1

solved-line: "<dark_gray>누군가 체험관의 진짜 안내원을 알아보았다. 광장에 동상이 하나 늘었다."
too-late: "<dark_gray>…광장에는 이미 누군가의 동상이 서 있다."

# 안내원 마네킹 스킨 (비우면 config.yml guide.npc-skin 과 같은 얼굴). worker-skin: 하역장의 거꾸로 선 직원 (비우면 guide.passenger-skin)
skin: ""
worker-skin: ""
# 안내원이 말할 때 채팅 앞에 붙는 이름 (길라잡이 안내원 이름과 같게)
speaker: "<gold>길라잡이 안내원"
# "어제 ○○ 근처에서 나가셨죠" 의 월드 이름 (없으면 월드 폴더 이름 그대로)
worlds:
  world: "마을"
  world_nether: "네더"
  world_the_end: "엔드"

lines:
  # 질문에 틀리거나 30초 동안 말이 없으면 (그 뒤 평소 길라잡이 화면)
  forget: "…아니에요. 잊어 주세요."
  # 질문을 맞히면: 내 기록을 말한다 ({when} = 아까/어제/그저께/며칠 전에, {place} = 월드 x 10단위, z 10단위)
  open: "…아, 오셨네요."
  quit: "{when} {place} 근처에서 나가셨죠."
  friend: "{friend}님이랑 친하시죠. 늘 곁에 계시던데."
  sold: "{item}, 그걸 제일 많이 파시더라고요."
  none: "…처음 뵙는 것 같은데. 이상하네요. 다 아는 얼굴 같아요."
  after:
    - "저는 다 기억해요. 안내하는 사람이니까요."
    - "그런데 하나가 기억이 안 나요."
    - "제가… 누구였는지."
    - "아까 물어본 것들요. 그거, 제가 잃어버린 제 조각이에요."
  ask: "거꾸로 한 번만 더 봐 주세요. 제가 어디서 잘못됐는지."
  # 진행 중에 다시 말을 걸면
  resume:
    - "…거꾸로요."
    - "아직 다 안 보셨잖아요."
  busy: "<dark_gray>안내원이 당신 너머 어딘가를 본다. (지금은 체험관에 들어갈 수 없어요)"
  arrive: "<gray>체험관이… 조금 조용하다. 아무도 없다."
  arrive-again: "<gray>…다시 체험관이다."
  # 순서가 틀린 그림을 누르면 (그 그림은 다음 것을 찾을 때까지 사라짐)
  wrong: "<gray>…아니에요."
  # 하나 찾을 때마다 (1번째 ~ 13번째)
  found:
    - "<gray>…거기였구나. 제 기억이 거꾸로 새어 나온 거예요."
    - "<gray>그것도 원래 없던 거예요."
    - "<gray>저는 매일 그 앞에 서 있었는데."
    - "<gray>왜 몰랐을까요."
    - "<gray>조금씩 기억나요."
    - "<gray>제 발소리, 들리세요?"
    - "<gray>…주머니를 봐요. 그 다른 하나는, 여기 온 사람들 말을 따라 하면서 안내를 배웠어요."
    - "<gray>여기서부터는 저도 잘 몰라요."
    - "<gray>누가 여기 서 있었는데."
    - "<gray>제가 안내한 사람이었나, 저를 안내한 사람이었나."
    - "<gray>이제 둘."
    - "<gray>마지막이에요."
    - "<gray>…광장으로 와요. 아래로."
  note-given: "<gray>손에 구겨진 쪽지가 쥐어져 있다. 언제부터였는지 모르겠다."
  note-lore:
    - "<gray>삐뚤빼뚤한 글씨:"
    - "<gray>“틀린 그림은 내 기억이 거꾸로 새어 나온 것.”"
    - "<white>“진짜는 자기 말을 한다.”"
    - "<gray>“가짜는 손님들 말을 따라 하며 안내를 배웠다.”"
  opened: "<dark_gray>광장 쪽에서 돌이 끌리는 소리가 났다."
  # 광장 아래 방
  room-hint: "<dark_gray>하나는 따라 하며 배웠다. 둘 중 하나. 한 번만."
  room-sign: "<gold><b>관험체 이잡라길</b>\n<gray>요세보 라골 을것 은싶 고보 해"
  # 진짜 안내원의 자기 말 (3초마다 한 줄씩). 가짜는 그 사람이 오늘 채팅에 친 말을 한다 (없으면 이번 접속의 말, 그것도 없으면 진짜의 말을 한 박자 늦게)
  real:
    - "어서 오세요. 길라잡이 체험관이에요."
    - "해 보고 싶은 것을 골라 보세요."
    - "농사는 괭이로 흙을 가는 것부터예요."
    - "낚싯대는 연못 쪽으로 던지세요."
    - "땅 한 칸은 열여섯 칸 곱하기 열여섯 칸이에요."
    - "모르는 게 있으면 언제든 물어보세요."
    - "다 하셨어요? 잘하셨어요."
    - "저는 여기 있을게요. 늘 여기 있었어요."
    - "제 이름이… 거의 생각날 것 같아요."
  # 진짜를 골랐을 때. 처음으로 자기 이름을 말한다 ({name} = 위 name, {이에요} = 이름 끝에 맞춘 "이에요"/"예요")
  real-chosen:
    - "…아."
    - "찾았네요. 저를."
    - "제 이름은 {name}{이에요}. …이제야 생각났어요."
    - "이제 올라가셔도 돼요. 저는 여기서 안내할게요. 제 말로요."
  fake-chosen:
    - "후후."
    - "다들 그렇게 말하던데요. 그래서 따라 했어요."
    - "이제 제가 안내할게요."
  after-solve: "<gray>광장에 못 보던 동상이 서 있다. 낯익은 얼굴이다."
  goodbye: "<dark_gray>멀리서 {name} 씨가 손을 흔든다. 처음 보는 표정이다."
  # 풀린 뒤, 아무나 안내원에게 말을 걸 때 가끔 (remember-chance, 사람마다 하루 한 번). {player} = 푼 사람. 그 뒤 평소 화면
  remember: "…{player}님이 저를 찾아 주셨어요. 제 이름은 {name}{이에요}."
  after-fail: "<dark_gray>…안내원이 웃고 있다. 아까부터 계속."
  # 가짜를 고른 사람이 안내원에게 말을 걸면 ({words} = 그 사람이 한 말, {name} = 그 사람 이름). 말 뒤에 길라잡이 화면은 그대로 열림
  mask:
    - "이제 제가 안내할게요."
    - "{words}"
    - "어서 오세요, {name}님. 저예요."

# ------------------------------------------------------------------------------------------------
# 후속 임무 「윤해담의 부탁」 (쉬움) — 진짜 안내원을 찾아 준 한 사람에게만, 일주일(월요일 0시 기준)에 한 번.
# 그 사람이 안내원에게 말을 걸면 (아무 시간이나; 새벽 hours 에는 한 줄 더) "체험관 그림이 또 하나 틀어졌어요" 하고 부탁한다.
# 다시 말을 걸면 체험관으로 들어가고 (비밀과 같은 방법: 소지품은 길라잡이가 보관), 그 주의 틀린 그림 딱 하나가 그 사람에게만 보인다.
# 그 그림을 우클릭하면 안내원이 그 그림에 얽힌 자기 기억 한 줄을 말하고, 밖으로 내보낸 뒤 보상을 준다.
# 기억은 그림마다 하나 (13개). 다 들을 때까지 매주 새 그림, 다 들으면 처음부터 다시 돈다. 놓친 주는 아무 일도 없다.
# 임무 중에 평소 길라잡이 화면을 보려면 웅크린 채 안내원을 누른다. 운영자 문서: docs/admin/숨은_비밀/안내원.md "후속 임무"
sequel:
  enabled: true
  # 보상 (쉬움: 30,000 ~ 80,000 G). 체험관 밖으로 나온 뒤에 지급한다. 테스트 모드는 돈을 주지 않고 금액만 보여 줌
  reward:
    money: [30000, 80000]
  # 체험관 안에서 이만큼(초) 못 찾으면 안내원이 어느 쪽인지 한 번 귀띔한다 (0 = 안 함). 테스트 모드: test-hint-after
  hint-after: 300
  test-hint-after: 20
  hint: "<gray>…{station} 쪽이었던 것 같아요."
  # 부탁 (안내원의 말: 채팅 한 줄씩, 그 사람에게만). {name} = 위 name
  ask:
    - "…아, 오셨네요."
    - "…체험관 그림이 또 하나 틀어졌어요."
    - "제 기억이 또 거꾸로 샌 모양이에요. 이번엔 하나만요."
  # 새벽 (위 hours) 에 말을 걸었을 때만 덧붙는 줄
  ask-dawn:
    - "…이 시간에는 저도 조금 흐려져요. 그래서 그림이 더 잘 틀어지나 봐요."
  ask-end:
    - "찾아 주실래요? 다시 말을 걸어 주시면 데려다 드릴게요."
  # 다시 말을 걸었을 때 (그 뒤 체험관으로)
  go:
    - "…가요. 하나만 찾으면 돼요."
  arrive: "<gray>…체험관이다. 어딘가 하나가 틀어져 있다."
  # 그림을 찾았을 때 (화면 아래 작은 글씨) → 그 그림의 기억 한 줄 → thanks → 밖으로
  found: "<gray>…거기였네요."
  thanks:
    - "고마워요. 이번 주는 괜찮을 것 같아요."
  goodbye: "<dark_gray>멀리서 안내원이 손을 흔든다. 지난번보다 조금 덜 낯선 표정이다."
  done: "<dark_gray>…그림 하나가 제자리로 돌아갔다. <gray>({reward})"
  # 그림(정거장)마다 하나씩, 안내원 자신의 기억. 열쇠 = 길라잡이 정거장 id (틀린 그림 13개와 같음)
  memories:
    missions: "…이름표요. 제 것도 저렇게 허공에 걸려 있었어요. 누가 불러 주기 전까지는요."
    stocks: "…제 값이 얼마인지 세어 본 적이 있어요. 안내한 사람 수로요. 자꾸 떨어지길래 그만뒀어요."
    trade: "…저한테 소포를 부친 적이 있어요. 잊을까 봐요. 뭐가 들었는지는, 잊었어요."
    accessories: "…거울 앞에서 인사를 연습했어요. '어서 오세요.' 어느 날은 거울이 먼저 했어요."
    land: "…제 땅은 없었어요. 열여섯 칸 곱하기 열여섯 칸. 늘 남의 것만 재어 드렸죠."
    bus: "…처음 온 날, 정류장에 발자국이 먼저 나 있었어요. 따라 걸었더니 여기였어요."
    dock: "…하역장에 같이 일하던 사람이 있었어요. 이름이… 거꾸로는 기억나는데."
    shop: "…천막 아래 그 의자, 제가 쉬던 자리예요. 한 번도 앉아 본 적은 없지만요."
    fishing: "…낚싯대 던지는 법을 천 번쯤 알려 드렸어요. 저는 한 번도 던져 본 적이 없어요."
    mining: "…벽을 오래 보면 얼굴이 보여요. 예전에는 제 얼굴이었는데, 요즘은 손님 얼굴이에요."
    farming: "…그 허수아비는 제가 세웠어요. 여기 혼자 서 있는 게 저 하나면 안 될 것 같아서요."
    machines: "…시계가 멈춘 그 시각이요. 누가 저한테 처음 길을 물은 때예요. 저는 거기서 시작됐어요."
    jobs: "…직업은 여섯 개예요. 일곱 번째는 고르는 게 아니에요. 남는 거예요."
