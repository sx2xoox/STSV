# 숨은 비밀: 울리는 삐삐 (운영자 문서: docs/admin/숨은_비밀/울리는_삐삐.md · README 에는 일부러 적지 않음)
# 깊은 땅속, 돌 안에서 삐삐 소리가 난다. 1997년의 삐삐. 아직도 호출이 들어온다.
# 호출은 어린 딸이 아빠에게 보낸 것 — 1997년 11월 29일 갱도가 무너진 날 돌아오지 못한 광부에게. 스물몇 해 동안 닿지 못한
# 호출이 이제 하나씩 온다. 삐삐는 숫자만 보여 준다: 045(빵 사 와) · 10288(열이 펄펄) · 8282(빨리빨리) · 505(SOS) ·
# 100(돌아와) · 1004(천사) · 20000(이만). 게임은 숫자의 뜻을 한 번도 설명하지 않는다 (소리 내어 읽거나, 어른에게 묻는 것이 퍼즐).
# 플레이어는 숫자가 시키는 일을 한다. 마지막 부탁 100 의 답은 숫자가 아니라, 삐삐를 집에 돌려보내는 것.
# 모든 연출은 그 사람에게만 보이고 들림. 테스트 모드 (/관리자 비밀 테스트): 확률 100%, 아래 test-… 시간, 밤이 아니어도 됨.
# 문구는 모두 MiniMessage.
enabled: true

start:
  # 돌 · 심층암 · 응회암 · 안산암 등과 광석을 (서바이벌로) 캘 때마다, 한 블록당. 이 서버는 채굴이 아주 빠르니 아주 작게. 테스트 모드 = 100%
  chance: 0.00005
  # 이 높이(Y) 이하에서 캔 블록만
  max-y: 0
  # 삐삐 소리가 나는 블록: 캐던 곳에서 이만큼(칸) 떨어진, 사방이 막힌 자연 돌 (플레이어가 놓은 돌 · 광석은 제외)
  distance:
    min: 6
    max: 10
  # 이만큼(초) 울리다 조용히 멈춤. 한 사람에게 하루(한국 시간) 한 번까지만 울리기 시작함
  beep-seconds: 180
  # 소리 크기 (1 = 16칸까지 들림, 1.5 = 24칸)
  beep-volume: 1.5

# 삐삐 소리: 짧고 높은 음 셋 (3초마다 반복). 소리 이름은 마인크래프트 소리 키
beep:
  sound: block.note_block.bit
  pitch: 1.9
  gap-ticks: 3

# 서버에서 처음 푼 한 사람에게. 돈 대신 하나뿐인 것: 칭호, 딸의 편지, 살아 있는 삐삐 (아래 page)
rewards:
  money: 0
  title: economy:pager_reply

solved-line: "<dark_gray>어느 파란 대문 집 우체통에, 스물몇 해 만에 삐삐가 돌아왔다."
too-late: "<dark_gray>…파란 대문은 이제 어디에도 없다. 누군가 먼저 돌아갔다."

# 호출 숫자 (화면에 뜨는 그대로). 뜻은 어디에도 적지 않음
codes:
  bread: "045"      # 빵 사 와
  fever: "10288"    # 열이 펄펄
  hurry: "8282"     # 빨리빨리
  sos: "505"        # SOS
  thanks: "1004"    # 천사 (심부름을 해 주면 오는 답)
  late: "…"         # 8282 에 늦었을 때 화면에

# 심부름을 마친 뒤 다음 호출까지 [최소, 최대] 초 (테스트 모드: test-gap-seconds)
gap-seconds: [240, 480]
test-gap-seconds: 8
# 바구니에 넣은 뒤 답(1004)이 오기까지 (초)
reply-seconds: 6
test-reply-seconds: 3

pager:
  name: "<#c8d2c0>삐삐"
  screen:
    # 화면에 남는 호출 수와 색 (위 = 가장 새 것, 아래로 갈수록 흐리게)
    keep: 5
    colors: ["#b6f2a6", "#86bf88", "#648f6a", "#4c6e53", "#3a5541"]
    empty: "<#4c6e53>— — — —"
  # 화면 아래: 뒷면의 테이프 ({tape} = 아래 tape 문장)
  back:
    - ""
    - "<#8a8272>뒷면에 마스킹 테이프. 삐뚤빼뚤한 연필 글씨."
    - "<#e6dcc2>“{tape}”"
  # {stop} = 그 사람에게 정해진 정류장 이름의 초성 (등대 앞 → ㄷㄷ ㅇ). 정류장이 하나도 없는 서버는 tape-no-stop (스폰 근처)
  tape: "주우신 분은 {stop} 정류장 앞 파란 대문 집으로"
  tape-no-stop: "주우신 분은 마을 어귀 파란 대문 집으로"
  # 삐삐를 이만큼(초) 지니지 않으면 (상자에 넣어 두는 등) 주머니로 돌아옴. 버리기(Q)와 액자에 걸기는 처음부터 안 됨.
  # 그때 상자에 남은 것은 꺼진 껍데기: 아무 쓸모가 없고, 누구든 인벤토리에서 건드리는 순간 사라짐
  return-after: 120
  test-return-after: 20
  # 푼 뒤 편지와 함께 돌아오는 삐삐 ({player} = 푼 사람, {date} = 받은 날)
  live-name: "<gradient:#b6f2a6:#e6dcc2>삐삐</gradient> <gray>(살아 있음)"
  live-lore:
    - "<#b6f2a6>[오늘] 1004"
    - ""
    - "<gray>스물몇 해 만에 집에 돌아갔다가, 다시 길을 나선 삐삐."
    - "<gray>누군가를 위해 계속 울리라고 — <white>{player}</white>에게."
    - "<dark_gray>{date} · 우클릭: 호출"

house:
  # 삐삐를 주운 곳에서 이만큼(칸) 이상 떨어진 정류장 중에서 고름 (없으면 아무 정류장)
  min-from-found: 200
  # 정류장 뒤 이 거리 안에 오면 집 자리를 정함 (정류장 쉼터 뒤 10~24칸, 평평하고 빈 땅, 길 · 남의 땅이 아닌 곳)
  # 집이 덮는 모든 칸이 마른 땅이어야 함 (물 · 얼음 · 용암 · 물풀 위 아님). 없으면 42칸까지 더 넓게, 그래도 없으면 다음 정류장(테이프도 바뀜), 끝으로 스폰 둘레
  find-range: 64
  # 집이 보이는 거리, 삐삐를 지니고 대문 앞 이 거리 안에 서면 "도착"
  show-range: 48
  arrive-range: 6
  # 처음 도착한 뒤 첫 호출까지 (초)
  first-seconds: 20
  test-first-seconds: 5
  # 집을 이루는 블록 (블록 디스플레이). gate = 파란 대문
  blocks:
    wall: andesite
    cap: smooth_stone
    post: polished_andesite
    roof: deepslate_tiles
    gate: blue_concrete
    handle: iron_block
    frame: dark_oak_planks
    basket: composter
    mailbox: red_concrete
    mailbox-lid: red_terracotta
    slot: black_concrete
    flag: white_concrete
    house: white_terracotta
    window-lit: ochre_froglight
    window-warm: shroomlight
    window-dark: black_concrete

# 바구니가 받는 것 (손에 들고 바구니를 우클릭, 딱 하나만 가져감). 다른 것은 바구니가 흔들릴 뿐
errands:
  # 045
  bread:
    - bread
    - economy:corn_bread
  # 10288: 죽이나 순한 국
  warm:
    - economy:abalone_porridge
    - economy:samgyetang
    - economy:ginseng_samgyetang
    - economy:miyeokguk
    - economy:kalguksu
    - economy:eomuktang
    - economy:bogeo_jiri

# 8282: 집에서 min-distance 칸 이상 떨어져 있을 때만 옴. seconds 초 + (그보다 먼 거리 4칸마다 1초, 다 합쳐 max-seconds 까지) 안에
# 대문 앞에 서야 함. 그사이 게임을 나가면 (서버가 꺼져도) 시간은 멈췄다가 돌아오면 이어짐
rush:
  min-distance: 300
  seconds: 240
  max-seconds: 900
  test-min-distance: 30
  test-seconds: 40

# 505 → 두드림 → 100 이 해마다 → 20000
turn:
  # 505 는 밤(월드 시간 13000~23000)에 옴. 이만큼(초) 기다려도 밤이 아니면 그냥 옴
  max-wait-seconds: 900
  knock-seconds: 30
  test-knock-seconds: 12
  knock-sound: block.deepslate.hit
  # 100 한 줄마다 (초)
  scroll-seconds: 3
  test-scroll-seconds: 1

# 푼 뒤: 편지와 살아 있는 삐삐가 우편으로 (인벤토리에 자리가 있으면 바로, 없으면 /우편함)
after:
  letter-seconds: 600
  test-letter-seconds: 15

letter:
  title: "삐삐를 넣어 주신 분께"
  author: "파란 대문 집"
  mail-reason: "발신: 파란 대문 집"
  # {age} = 올해 - born-year (딸의 나이)
  born-year: 1991
  lore:
    - "<gray>파란 대문 집에서 온 편지"
    - "<dark_gray>{date}"
  # {date} = 오늘, {age}, {player}
  pages:
    - "<dark_gray>{date}</dark_gray>\n\n오늘 아침 우체통에서 아버지 삐삐를 찾았습니다.\n\n누구신지 저는 모릅니다. 어디서 주우셨는지도요.\n\n저는 올해 {age}살이 되었습니다."
    - "해마다 그날이면 이 번호로 호출을 넣었습니다. 받을 사람이 없는 줄 알면서요.\n\n어제는 처음으로 <dark_green>20000</dark_green>을 눌렀습니다.\n\n그런데 오늘, 삐삐가 집에 와 있네요."
    - "빵, 고맙습니다.\n\n…그날 빵은 결국 아무도 안 사 왔거든요.\n\n삐삐는 돌려드립니다. 서랍 속보다는, 누군가를 위해 계속 울리는 편이 좋겠어요.\n\n<dark_gray>— 파란 대문 집 딸"

# 살아 있는 삐삐 (푼 사람만): 들고 우클릭 → 채팅에 "받는 사람 숫자" 를 치면 호출이 됨 (채팅에는 안 나감).
# 받는 사람은 삐삐 소리와 숫자만 받음 (보낸 사람 없음, 답할 방법 없음). 숫자만, 12자리까지.
# 우클릭한 뒤 호출을 보내거나, "취소" 라고 치거나, timeout-seconds 가 지날 때까지만 채팅을 가로챔 (그동안 친 말은 어디에도 안 나가고,
# 호출이 아니면 그렇다고 알려 줌). 살아 있는 삐삐는 가장 마지막에 만들어진 하나만 작동하고, 죽어도 떨어지지 않음
page:
  enabled: true
  # 호출 한 번 뒤 다음 호출까지 (초)
  cooldown-seconds: 60
  timeout-seconds: 30
  # 받는 사람 채팅에도 한 줄 남김 (false = 화면 아래 글씨만)
  chat: true
  lines:
    prompt: "<#9fd8a0>받는 사람과 숫자를 채팅에 치세요 <gray>(예: 닉네임 8282 · 그만두려면 취소)"
    sent: "<dark_gray>…{digits}. 보냈다."
    receive: "<#9fd8a0>삐삐삐— <white>{digits}"
    bad: "<dark_gray>…삐삐는 숫자만 보낼 수 있다. 열두 자리까지."
    nobody: "<dark_gray>…신호가 가지 않는다. 그런 사람은 지금 없다."
    # 숫자가 아니거나 받는 사람이 없을 때, 위 한 줄 뒤에 (아직 다시 칠 수 있음)
    retry: "<gray>(방금 친 말은 채팅에 나가지 않았어요. 다시 치거나, 그만두려면 취소)"
    # "취소" 라고 쳤을 때 / 시간이 다 지났을 때 (이제부터 채팅은 평소대로 나감)
    cancel: "<dark_gray>…삐삐를 도로 넣었다."
    timeout: "<dark_gray>…삐삐의 화면이 어두워졌다. <gray>(호출하지 않았어요)"
    cooldown: "<dark_gray>…아직 화면이 식지 않았다. ({seconds}초)"

lines:
  # 호출이 올 때 화면 아래에 잠깐 (그 밖에는 아무 말도 없음)
  vibrate: "<#9fd8a0>삐삐삐— 삐삐삐—"
  # 8282 가 다시 올 때
  again: "<#9fd8a0>삐삐삐— <white>{code}"
  drop: "<dark_gray>…내려놓을 수가 없다. 아직 울리고 있다."
  back: "<dark_gray>…주머니에서 진동이 온다. 삐삐가 돌아와 있다."
  # 20000 뒤 (또는 505 뒤) 바구니에 무언가를 넣으려 할 때, 처음 한 번만
  refuse: "<dark_gray>…그게 아니야."
  # 엔딩: 안에서 들리는 한마디
  dad: "<#e8dcc0>…아빠?"
  letter: "<dark_gray>…편지가 와 있다."
  # 다른 사람이 먼저 풀었을 때 지니고 있던 삐삐
  crumble: "<dark_gray>…삐삐의 화면이 꺼졌다. 손안에서 부스러진다."

# ------------------------------------------------------------------------------------------------------------------
# 후속 임무 「호출」 (난이도: 쉬움) — 운영자 문서 docs/admin/숨은_비밀/울리는_삐삐.md "후속 임무"
# 삐삐는 집에 돌아갔다가 살아서 돌아왔다. 이제 어른이 된 딸은 누군가 아버지의 삐삐를 지니고 있다는 걸 안다.
# 일주일에 한 번쯤, 푼 사람이 지닌 살아 있는 삐삐(지금 작동하는 그 하나)에 숫자가 온다. 이번에도 뜻은 어디에도 적지 않는다.
# 심부름은 파란 대문이 서 있던 자리에서 끝난다: 그 주에는 거기에 대문 기둥 하나와 바구니가 그 사람에게만 보인다.
# 삐삐 아이템 자체는 건드리지 않는다 (설명 첫 줄 = 화면만 바뀜). 호출 능력(page)도 그대로.
sequel:
  enabled: true
  # 쉬움: 30,000~80,000 G (1,000 G 단위로 내림)
  reward:
    money: [30000, 80000]
  # 끝났을 때 그 사람에게만 ({reward} = 받은 것)
  done: "<dark_gray>…삐삐가 조용해졌다. <gray>({reward})"
  # 두 번 다 놓쳤을 때 (이번 주는 끝. 잃는 것은 없음)
  missed: "<dark_gray>…삐삐는 더 울리지 않는다. 이번 주는 늦었다."

  # 그 주에 아직 호출이 없고, 살아 있는 삐삐를 지니고 있는 동안 1초마다 이 확률 (0.002 = 평균 8분쯤). 테스트 모드 = 100%
  chance: 0.002
  # 접속하고 이만큼(초)은 오지 않음
  settle-seconds: 60
  # 최근 이만큼의 호출은 다시 고르지 않음 (그 주의 호출은 주와 사람으로 정해짐: 재시작해도 같은 것)
  avoid-recent: 4

  # 화면 (살아 있는 삐삐 설명의 첫 줄). {code} = 숫자
  screen: "<#b6f2a6>[오늘] {code}"
  screen-late: "<#648f6a>…"
  # 심부름을 마치면 오는 답 (숫자), 그때까지 (초)
  thanks: "1004"
  reply-seconds: 6
  test-reply-seconds: 3

  # 기둥이 보이는 거리, 그 앞 이 거리 안에 서면 "도착" (살아 있는 삐삐를 지니고)
  show-range: 40
  arrive-range: 4

  # rush (8282 · 981 · 8578): 기둥에서 rush-min-distance 칸 이상 떨어져 있을 때만 옴.
  # rush-seconds 초 + (그보다 먼 거리 4칸마다 1초, 다 합쳐 rush-max-seconds 까지) 안에 기둥 앞에 서야 함. 본편의 8282 와 달리 나가 있어도 시간은 흐름
  rush-min-distance: 300
  rush-seconds: 240
  rush-max-seconds: 900
  test-rush-min-distance: 30
  test-rush-seconds: 40
  # dusk (175): 그 월드의 시간이 이 틱보다 이를 때만 옴 (0 = 아침 6시, 6000 = 정오). 그날 해가 지기 전(13000)에 기둥 앞에 서야 함
  dusk-latest-tick: 6000
  # 시간 안에 못 가면 화면에 "…" 가 뜨고 retry-seconds 뒤 (조건이 맞을 때) 같은 호출이 다시 옴. retries 번까지; 그 뒤에는 그 주는 끝
  retries: 1
  retry-seconds: 900
  test-retry-seconds: 10

  # reply: 살아 있는 삐삐를 우클릭하고 "받는 사람 숫자" 를 칠 때, 딸을 가리키는 이름 (띄어쓰기는 무시).
  # 그 이름의 진짜 플레이어가 접속해 있으면 그 사람에게 간다 (진짜 사람이 먼저). 딸에게 닿는 것은 호출이 와 있는 동안뿐
  reply:
    names: ["파란대문", "파란대문집", "파란 대문 집 딸", "딸"]

  # 호출 목록 (10가지 이상 권장). code = 화면의 숫자, kind = 게임이 확인하는 일:
  #   basket = 기둥의 바구니에 items 중 하나 / rush = 멀리 있을 때 와서 시간 안에 기둥 앞 / dusk = 낮에 와서 해 지기 전에 기둥 앞
  #   visit = 그냥 기둥 앞 / reply = 삐삐로 answers 중 하나를 딸에게 호출
  # 뜻은 플레이어에게 절대 알려 주지 않음 (아래 주석은 운영자용)
  calls:
    bread:
      code: "045"        # 빵 사 와
      kind: basket
      items: [bread, "economy:corn_bread"]
    fever:
      code: "10288"      # 열이 펄펄
      kind: basket
      items: ["economy:abalone_porridge", "economy:samgyetang", "economy:ginseng_samgyetang", "economy:miyeokguk",
              "economy:kalguksu", "economy:eomuktang", "economy:bogeo_jiri", mushroom_stew, rabbit_stew, beetroot_soup]
    hurry:
      code: "8282"       # 빨리빨리
      kind: rush
    urgent:
      code: "981"        # 급한 일
      kind: rush
    depart:
      code: "8578"       # 바로 출발
      kind: rush
    early:
      code: "175"        # 일찍 와 (해 지기 전에)
      kind: dusk
    back:
      code: "100"        # 돌아와 (들러 달라는 말)
      kind: visit
    here:
      code: "1254"       # 이리 오소
      kind: visit
    friends:
      code: "7942"       # 친구 사이 → 같은 말로 답
      kind: reply
      answers: ["7942", "1004"]
    angel:
      code: "1004"       # 천사 (그냥 고맙다는 말) → 천사로 답
      kind: reply
      answers: ["1004"]
    bye:
      code: "20000"      # 이만 → 이만, 또는 천사
      kind: reply
      answers: ["20000", "1004"]

  # 답(1004)과 함께 우편으로 오는 딸의 쪽지 (economy:pager_letter 한 쪽짜리. 자리가 있으면 바로 인벤토리, 없으면 /우편함). false = 쪽지 없음
  note:
    enabled: true
    name: "<#d8d2c4>쪽지"
    title: "파란 대문 집에서"
    author: "파란 대문 집"
    lore:
      - "<gray>파란 대문 집에서 온 쪽지"
      - "<dark_gray>{date}"
    # {date} = 오늘, {text} = 아래 notes 에서 고른 글, {code} = 그 주의 숫자
    page: "<dark_gray>{date}</dark_gray>\n\n{text}\n\n<dark_gray>— 파란 대문 집 딸"
    avoid-recent: 5
  # 쪽지 글: 그 주 심부름의 종류(kind)별 목록 + any 에서 하나 (최근 것은 피함). 짧고 담담하게. 딸은 상대가 누구인지 모른다
  notes:
    basket:
      - "바구니에 든 것, 잘 받았습니다.\n\n아직 김이 나더군요.\n\n그날 못 받은 것을 이제 와서 자꾸 받네요."
      - "혼자 먹기엔 많아서 옆집 할머니와 나눴습니다.\n\n누가 보냈냐고 물으시길래, 아버지 친구분이라고 했어요.\n\n틀린 말은 아닌 것 같아서요."
      - "어릴 때는 숫자만 누르면 뭐든 오는 줄 알았어요.\n\n그게 정말로 오는 날이 있네요.\n\n잘 먹었습니다."
    rush:
      - "급한 일은 아니었습니다. 죄송해요.\n\n그냥, 누르면 누가 오는지 보고 싶었어요.\n\n오셨더라고요."
      - "창문으로 봤습니다. 뛰어오시는 거.\n\n아버지도 그렇게 오셨을 거예요. 오실 수 있었다면.\n\n고맙습니다."
      - "숨이 차셨을 텐데 물 한 잔 못 드렸네요.\n\n다음에는 천천히 오세요.\n\n그래도 또 그 숫자를 누를 것 같긴 합니다."
    dusk:
      - "해 지기 전에 오셨네요.\n\n어릴 때 제일 많이 보낸 숫자가 그거였어요. 한 번도 안 지켜졌지만요.\n\n오늘은 지켜졌습니다."
      - "저녁 짓는 냄새가 날 때쯤이면 골목을 내다보는 버릇이 아직 있습니다.\n\n오늘은 누가 서 있더군요.\n\n고맙습니다."
    visit:
      - "오셨다 가신 걸 압니다.\n\n기둥 옆 흙이 눌려 있었어요.\n\n그거면 됐습니다."
      - "들어오시라고는 못 했네요. 대문이 없어서요.\n\n그래도 누가 다녀가는 집이 되었습니다.\n\n고맙습니다."
      - "같은 숫자를 스물몇 해 눌렀는데,\n\n요즘은 누르면 누가 옵니다.\n\n같은 사람은 아니어도, 괜찮더라고요."
    reply:
      - "답이 왔을 때 한참 화면을 봤습니다.\n\n그 번호에서 답이 온 건 처음이라서요.\n\n고맙습니다."
      - "숫자 몇 개인데 편지보다 길게 읽었어요.\n\n아버지도 이렇게 답하고 싶으셨겠죠.\n\n대신 받았습니다."
      - "삐삐는 잘 울리고 있나요.\n\n서랍에 있을 때보다 목소리가 좋아진 것 같아요.\n\n또 누르겠습니다."
    any:
      - "오늘도 삐삐가 닿았네요.\n\n누구신지는 여전히 모릅니다. 묻지 않기로 했어요.\n\n고맙습니다."
      - "대문이 없는 자리에 기둥 하나를 남겨 두었습니다.\n\n바구니는 아버지가 달아 둔 것이에요.\n\n쓸 일이 생겨서 다행입니다."
      - "번호를 누를 때마다, 받을 사람이 있다는 게 아직도 이상합니다.\n\n좋은 쪽으로요."
      - "올해 그날에도 100 을 누를 생각입니다.\n\n다만 이제는 부탁이 아니라 인사로요.\n\n잘 지내세요."
