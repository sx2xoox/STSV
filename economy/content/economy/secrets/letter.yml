# 내일의 나 — 숨은 비밀 (운영자 문서: docs/admin/숨은_비밀/내일의_나.md · README 에는 적지 않음)
# 하루 뒤의 내가 편지를 보낸다. 다섯 통이 하룻밤에 온다. 편지가 올수록 "내일의 나" 는 내가 아니게 된다.
# 편지는 내 과거를 거꾸로 되짚는다: 내일의 나는 "내가 나이기 시작한 순간" 을 찾아 되감는 중이고, 찾으면 내 자리에 앉으려 한다.
# 버티면 자리를 못 찾은 그것은 영원히 내 1초 뒤에 붙어 다닌다 (그림자 분신).
# 편지마다 의식 하나 = 내 기록으로 만든 수수께끼 (좌표 대신 힌트). 해내면 몇 분 뒤 다음 편지.
# 테스트 모드 (/관리자 비밀 테스트) 에서는 아래의 test-… 값들을 씀 ("하루" = common.yml 의 test-day-seconds, 기본 60초).
# 문구는 모두 MiniMessage. 편지 문구에서 값이 없는 {자리} 가 든 줄은 통째로 빠짐.
enabled: true

start:
  chance: 0.05                 # 한국 날짜로 하루에 한 번, 접속한 사람마다 굴림 (테스트 모드 100%)
  after-online-minutes: 10     # 그날 이만큼 접속해 있어야 굴림 (테스트: 0)

rewards:
  money: 0                     # 돈은 없음: 보상은 서버에 하나뿐인 것 (칭호 + 그림자 분신)
  title: economy:yesterday_me

solved-line: "<dark_gray>누군가의 우편함에 더는 내일 날짜로 된 편지가 오지 않는다. 그 사람 1초 뒤에서, 무언가 따라 걷는다."
too-late: "<dark_gray>…우편함은 비어 있다. 누군가 먼저 문을 열었다."

# 편지가 오는 방식
delivery:
  gap-seconds: 180             # 의식을 해내고 이만큼 뒤에 다음 편지 (하룻밤에 다 할 수 있게)
  test-gap-seconds: 10
  login-seconds: 30            # 나갔다 들어왔을 때: 기다리던 편지가 접속 후 이만큼 뒤에 옴 (불이익 없음)
  test-login-seconds: 5
  lost-days: 3                 # 편지를 받고 의식을 안 한 채 이만큼 (한국 날짜, 테스트는 테스트 "하루") 지나면 편지가 끊김
  test-lost-days: 10           # 테스트: 테스트 "하루" (기본 60초) 단위 — 수수께끼를 풀 시간 10분
  notice: "<gray>우편함에 편지가 한 통 와 있습니다. <white>/우편함"
  title: "내일"                  # 책 제목 (손에 들면 보이는 이름은 아이템 이름 "편지")
  lore:
    - "<gray>보낸 사람: <white>{name}"
    - "<dark_gray>{date}"
  date-format: "yyyy년 M월 d일"   # 편지 맨 위 날짜 = 받는 날의 다음 날 (한국 시간)

# 의식 (편지마다 하나). 기한 없음 — 단, lost-days 동안 손대지 않으면 끊김
rituals:
  near-blocks: 40              # 편지 1 · 4: 수수께끼의 자리에서 이 칸 안이면 가끔 "가까웠다" 속삭임
  near-every-seconds: 25
  land:
    stay-seconds: 5            # 그 땅(청크) 안에 이만큼 서 있으면
  sell:
    poll-seconds: 10           # 이만큼마다 장부에서 새 판매를 찾음 (틀린 걸 팔면 "…그게 아니었다.")
  silence:
    minutes: 5                 # 편지를 읽은 뒤로 접속해 있는 동안 채팅 없이 이만큼 (명령어는 괜찮음). 말하면 처음부터
    test-seconds: 40
    call-every: [40, 60]       # 침묵이 시작될 때 이름 부르는 가짜 채팅 간격 (초, 최소~최대)
    call-every-end: [8, 14]    # 끝날 무렵의 간격 (그 사이는 점점 잦아짐)
    test-call-every: [6, 9]
    test-call-every-end: [2, 3]
  place:
    radius: 4                  # 처음 온 자리에서 이 칸 안에
    stay-seconds: 5
  wait:
    seconds: 30                # 편지 5를 읽고, 집(내 땅 · 사는 땅, 없으면 아무 데나) 안에서 이만큼 있으면 노크 (시간대 무관)
    test-seconds: 8

# 마지막 밤
chase:
  door-radius: 10              # 이 칸 안의 문에서 노크 (문이 없으면 벽 너머 어딘가에서)
  knock-rounds: 6              # 노크 묶음 수. 끝까지 문을 안 열면 조용해졌다가 집 안에 서 있음
  stare-seconds: 2             # 나타나서 따라오기 시작할 때까지 가만히 보는 시간
  seconds: 180                 # 이만큼 닿지 않고 버티면 끝
  test-seconds: 60
  scene-seconds: 40            # 관리자 연출 "도플갱어" 의 길이
  delay-start-ticks: 20        # 처음엔 1초 전의 나
  delay-end-ticks: 8           # 끝날 무렵엔 0.4초 전의 나
  catch-distance: 0.8
  grace-ticks: 20              # 따라오기 시작한 직후 이만큼은 안 잡힘
  retry-minutes: 10            # 잡힌 뒤 다시 노크할 수 있기까지
  test-retry-seconds: 20
  caught-whisper: "<dark_gray>…아직은 네가 너다. 조금 이따가."
  # 버텼을 때: 멈춰 서서 먼저 이 말 (비우면 없음), 잠시 뒤 last-words. 둘 다 말한 사람 = 내 이름
  before-words: "자리가 안 비네"
  last-words: "그럼 네가 계속 해"

# 점점 무너지는 것들 (그 사람에게만, 편지마다 하나씩 더). 하룻밤에 끝나는 이야기라 간격이 짧고, 편지마다 더 짧아짐
omens:
  pace: [1.0, 0.85, 0.7, 0.55, 0.45]   # 편지 1~5 일 때 아래 간격에 곱함
  first-after-seconds: 25      # 새 편지가 오면 그 편지의 새 징조가 이만큼 뒤에 처음 옴 (발소리 1 · 부름 3 · 시야의 나 4)
  test-first-after-seconds: 5
  footsteps:                   # 편지 1부터: 가만히 서 있으면 뒤에서 발소리
    still-seconds: 4
    every: [40, 90]
    test-every: [8, 14]
  tab:                         # 편지 2부터: 탭 목록 아래에 내 이름이 하나 더 (편지 4부터는 조금 틀린 이름)
    line: "<white>{name}"
  rename:                      # 편지 3, 5가 올 때: 내 물건 하나의 이름이 이렇게 바뀜 (진짜로, 해롭지 않은 것만)
    name: "<gray>내 것"
  glimpse:                     # 편지 4부터: 시야 가장자리에 내가 서 있다가 쳐다보면 사라짐
    every: [45, 100]
    test-every: [10, 16]
    distance: [10, 16]
    seconds: 8
  calls:                       # 편지 3 의 침묵 동안 점점 잦고 가까워짐 (그 뒤로는 가끔): 누군가 내 이름을 부름
    after-every: [60, 150]     # 침묵이 아닐 때 (편지 3 이후)
    test-after-every: [15, 25]
    lines:                     # 처음: 아무나 (접속자, 아니면 아는 이름)
      - "{name}"
      - "{name}?"
      - "{name} 어디야"
      - "야 {name}"
      - "방금 {name} 봤는데"
      - "{name} 아까 나갔다고 뜨던데"
    lines-near:                # 중간부터: 가장 오래 같이 있던 사람들
      - "{name} 거기 있지?"
      - "{name} 대답 좀 해봐"
      - "{name} 왜 두 명이야?"
      - "{name} 너 뒤에 누구야"
      - "{name} 왜 대답을 안 해"
      - "{name}… 방금 그거 너 아니었어?"
    lines-self:                # 끝 무렵: 내 이름이 나를 부름
      - "{name}"
      - "{name}…"
      - "대답해"
      - "나 여기 있어"
      - "대답하면 내가 갈게"
      - "뒤 돌아보지 마"
      - "거의 다 됐어"
  join-line-delay-seconds: 8   # 편지 5가 오고 나서, "(내 이름)님이 들어왔습니다" 가 채팅에 뜨기까지

# 그림자 분신 (푼 사람의 영구 보상): 가끔, 근처의 다른 사람들에게 1초 전의 그 사람이 잠깐 보임
shadow:
  enabled: true
  every: [180, 420]            # 초, 최소~최대
  seconds: 6
  radius: 32
  perk-line: "<dark_gray>…자리를 못 찾은 그것은, 이제 네 1초 뒤에 있다. 가끔 다른 사람들이 그걸 본다."

# 의식을 끝냈을 때 / 틀렸을 때 / 가까울 때 (그 사람에게만, 핫바 위 작은 글씨)
whispers:
  done:
    1: "<dark_gray>…여기였다."
    2: "<dark_gray>…늘 그랬던 것처럼."
    3: "<dark_gray>…아무도 부르지 않았다."
    4: "<dark_gray>…여기서 시작됐다."
  near:
    1: "<dark_gray>…흙 냄새가 익숙하다."
    4: "<dark_gray>…여기서 가까웠다."
  wrong:
    2: "<dark_gray>…그게 아니었다."
  silence-broken: "<dark_gray>…대답했구나. 처음부터."
  broken: "<dark_gray>…편지가 오지 않을 것 같다."

# 서명: 편지마다 조금씩 틀려짐. 이름은 코드가 비틂 (1통째는 그대로, 뒤로 갈수록 글자가 바뀌고 뒤섞임)
signature:
  format: "<gray>— {signame}</gray>\n<dark_gray>{sigline}</dark_gray>"
  lines:
    1: ""
    2: "…나는 나다."
    3: "나는 나, 다."
    4: "나느 ㄴ나"
    5: "<obf>ㄴ</obf>나"

# 편지들. 쪽마다 한 덩어리 (책 한 쪽에 14줄쯤). 자리: {date} {name} {sig} 그리고 편지마다 아래의 것.
# 한 줄에 든 {자리} 의 값이 없으면 그 줄은 빠짐 (예: 판 적이 없으면 "마지막으로 판 건…" 줄이 없음).
# 의식은 좌표가 아니라 수수께끼: 그 사람의 기록 (첫 땅, 가장 많이 판 것, 처음 접속) 에서 힌트를 만듦.
# {where} = where-far ({world} 의 스폰에서 {dir}(8방위) 으로 {steps}(약 N걸음)) 또는 스폰 24칸 안이면 where-near
letters:
  # 1통째: 어제 한 일 + 처음 흙을 내 것이라 부른 곳.
  # {quit} 마지막으로 나간 곳, {sold} 마지막으로 판 것, {friend} 가장 오래 같이 있던 사람
  # {claimed} 그 땅을 산 날, {biome} 그 청크의 생물 군계 (각자의 게임 언어로), {owner} 사는 땅 주인
  1:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.
        거꾸로 걷는 중이다.

        {quitline}
        마지막으로 판 건 {sold}였다.
        {friend}랑 같이 있었다.

        기억나지?
        나는 기억한다.
      - |-
        어제 나는
        {ritual}
      - |-
        그냥 거기 서 있었다.
        그래야 할 것 같았다.

        여기서부터
        하루씩 거슬러 간다.
        네가 너이기 시작한
        그 순간까지.

        {sig}
    quit-recent: "어제 나는 {quit} 근처에서 나갔다."
    quit-old: "지난번에 나는 {quit} 근처에서 나갔다."
    # 힌트 줄은 줄마다 색을 따로 (값이 없는 줄은 빠지므로)
    where-far: "<gray>{world}의 스폰에서</gray>\n<gray>{dir}으로, {steps}.</gray>"
    where-near: "<gray>{world}의 스폰</gray>\n<gray>바로 곁이었다.</gray>"
    ritual-first: "처음으로 흙을\n내 것이라 부른 곳에\n다시 섰다.\n\n<gray>{claimed}이었다.</gray>\n<gray>{biome}의 흙.</gray>\n{where}"
    ritual-home: "남의 흙 위에서\n잠들기로 한 곳에\n다시 섰다.\n\n<gray>{owner}의 이름이 붙은 땅.</gray>\n<gray>{biome}의 흙.</gray>\n{where}"
    ritual-town: "흙을 가진 적 없는 나는\n누구의 것도 아니고\n모두의 것인 흙 위에\n섰다.\n\n<gray>모르는 사람들 사이.</gray>\n{where}"
    ritual-spawn: "흙을 가진 적 없는 나는\n모두가 처음 눈을 뜨는\n그 자리에 섰다."
  # 2통째: 가장 많이 놓아준 것 (상점에 가장 많이 판 것) 을 하나 더. 무엇인지는 수수께끼.
  # {item} 이름, {count} 판 개수, {shelf} 상점 판매 칸 이름, {trait} 성질 (아래 traits, 커스텀 물건은 설명 첫 줄 또는 이름의 초성)
  2:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        {ritual}
      - |-
        {hints}
      - |-
        팔고 나니
        손이 조금 비어 보였다.

        그건 원래
        내 것이었을까.

        {sig}
    ritual-most: "어제 나는\n내가 가장 많이\n놓아준 것을\n하나 더 놓아주었다.\n\n무엇이었는지\n너는 알 거다."
    hints-most: "<gray>이름은 이렇게 생겼다:</gray>\n<obf>{item}</obf>\n\n<gray>상점의 '{shelf}' 칸.</gray>\n<gray>{trait}</gray>\n\n<gray>나는 그것을</gray>\n<gray>{count}개나 놓아주었다.</gray>"
    ritual-none: "어제 나는\n처음으로 무언가를\n놓아주었다."
    hints-none: "<gray>상점에.</gray>\n\n뭐였는지는\n중요하지 않았다."
    trait-lore: "'{lore}'"
    trait-initials: "이름의 소리: {initials}"
    traits:
      food: "입에 넣을 수 있었다."
      block: "땅 위에 놓을 수 있었다."
      single: "한 번에 하나밖에 들 수 없었다."
      sixteen: "열여섯 개까지만 겹쳐졌다."
      plain: "땅에 놓을 수도, 먹을 수도 없었다."
  # 3통째: 침묵. {silence} = rituals.silence 의 길이 (테스트 모드면 test-seconds)
  3:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        어제 나는
        내 이름을
        듣지 않으려고 했다.

        {silence} 동안
        아무 말도 하지 않았다.
      - |-
        누가 자꾸 불렀다.
        {name}. {name}.

        대답하지 않았다.
        그건 나를 부르는 게
        아니었으니까.

        {sig}
  # 4통째: 이 세계에 처음 눈을 뜬 자리. {joined} 처음 접속한 때 (한국 시간), {world} 그 월드, {where}
  4:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        어제 나는
        이 세계에
        처음 눈을 뜬 자리에
        섰다.
      - |-
        <gray>{joined}.</gray>
        <gray>{world}.</gray>
        {where}
        {guess}

        눈을 떴을 때
        누가 옆에 있었던 것 같다.
      - |-
        거기 서 있으니
        알 것 같았다.

        처음 여기 온 건
        나 하나가 아니었다.

        거의 다 왔다.

        {sig}
    where-far: "<gray>스폰에서</gray>\n<gray>{dir}으로, {steps}.</gray>"
    where-near: "<gray>스폰 바로 곁.</gray>"
    guess: "<gray>아마 거기였을 거다.</gray>"
  # 5통째: 문을 잠그고 기다림 (읽은 뒤 집에서 기다리면 노크, 시간대 무관 — 그 사람에게만 밤이 됨). {home} 땅이 있으면 home-land, 없으면 home-none. {chase} = chase.seconds 의 길이
  5:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        어제 나는
        문을 잠그고 기다렸다.

        밤이었다.
        {home}이었다.
      - |-
        다 거슬러 왔다.

        네가 너이기 시작한
        그 순간.

        거기엔 자리가
        하나뿐이다.
      - |-
        누가 문을 두드렸다.

        세 번.

        나는 그게 누군지
        알고 있었다.
      - |-
        문 밖의 나는
        언제나 나보다
        조금 늦다.

        그러니까 멈추지 마.
        멈추면 닿는다.

        {chase}만 버티면 된다.
      - |-
        닿으면
        나는 나가게 된다.

        그리고 남은 하나가
        {name}이 된다.

        {sig}
    home-land: "내 집"
    home-none: "내가 있던 곳"
  # 편지가 끊길 때 (편지를 받고 lost-days 동안 의식을 안 함)
  broken:
    pages:
      - |-
        <gray>{date}</gray>

        어제 나는
        아무것도 하지 않았다.

        그래서
        내일은 오지 않았다.
  # 다 끝난 뒤 (풀었을 때) — 이번엔 내가 보낸다. 날짜는 오늘. 자리를 못 찾은 그것이 이제 내 1초 뒤에 있다는 것
  epilogue:
    title: "어제의 나에게"
    pages:
      - |-
        <gray>{today}</gray>

        어제의 나에게.

        내일 너는
        우편함을 열 것이다.

        거기
        내 글씨가 있을 거다.
      - |-
        그건 거꾸로 온다.
        네가 너이기 시작한
        그 순간을 찾아서.

        찾으면
        네 자리에 앉으려고.

        멈추지 마.
      - |-
        그건 내 자리에
        들어오지 못했다.

        그래서 지금
        내 1초 뒤에 있다.
        영원히.

        가끔 남들이
        나를 두 번 본다.
      - |-
        그게 그랬다.
        그럼 네가 계속 하라고.

        그러니까
        계속 해.

        <gray>— {name}</gray>

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 후속 임무 「어제의 편지」 (푼 사람 한 명만, 한 주에 한 번 · docs/admin/숨은_비밀/내일의_나.md "후속 임무")
# 자리를 못 뺏은 그것은 이제 내 1초 뒤를 따라다닌다. 한 주에 한 번, 우편함에 "1초 뒤의 나" 가 쓴 편지가 온다.
# 편지에는 이번 주 내 기록으로 만든 수수께끼가 하나. 편지를 읽고 (손에 들고 우클릭) 해내면 보상 + 답장.
# 답장은 주가 쌓일수록 조금씩 따뜻해진다 (그것은 나를 보면서 사람이 되는 법을 배우는 중).
# 놓친 주는 그냥 지나감 (불이익 없음). 편지는 아무 기능 없는 책이라 가져가거나 돌려줄 것이 없음.
sequel:
  enabled: true
  reward:
    money: [80000, 150000]       # 보통 난이도. 1,000 G 단위로 내림 (테스트 모드에서는 지급 안 함)
  done: "<dark_gray>…이번 주의 어제는 여기까지. <gray>({reward})"
  after-online: 300              # 그 주에 처음 접속해 이만큼 (초) 지나면 편지가 옴
  test-after-online: 5
  avoid-recent: 4                # 최근 이만큼의 수수께끼 종류는 (다른 게 가능하면) 다시 안 나옴
  # 쓸 수수께끼 종류 (지우면 그 종류는 안 나옴). 그 사람 기록으로 가능한 것 중에서 주마다 하나 (주 · 사람으로 정해져 재시작해도 같음)
  #   quit: 마지막으로 나간 자리에 서기 · birth: 처음 들어온 자리에 서기 · land: 첫 땅 (청크) 에 서기
  #   friend: 가장 오래 곁에 있던 사람 옆에 서기 (그 사람이 접속해 있어야 함)
  #   carry-most-land: 가장 많이 판 것을 손에 들고 첫 땅에 · carry-week-birth: 이번 주 (7일) 가장 많이 판 것을 들고 처음 자리에
  #   carry-last-quit: 마지막으로 판 것을 들고 마지막으로 나간 자리에 (들기만 함, 가져가지 않음)
  #   sell-most: 가장 많이 판 것을 상점에 한 번 더 팔기 · sell-oldest: 장부 (최근 2000줄) 에서 가장 오래된 판매 품목을 다시 팔기
  #   walk: 마지막으로 나간 자리 → 처음 들어온 자리, 순서대로 (두 자리가 walk-apart 칸 이상 떨어져 있을 때만)
  kinds: [quit, birth, land, friend, carry-most-land, carry-week-birth, carry-last-quit, sell-most, sell-oldest, walk]
  radius: 5                      # 자리 수수께끼: 그 자리에서 이 칸 안 (첫 땅은 그 청크 전체)
  stay-seconds: 5                # 그 자리 (그 사람 옆) 에 이만큼 서 있으면 됨
  friend-radius: 4
  walk-apart: 48
  near-blocks: 40                # 자리에서 이 칸 안이면 가끔 "가깝다" 속삭임
  near-every-seconds: 25
  poll-seconds: 15               # 팔기 수수께끼: 이만큼마다 장부에서 편지를 읽은 뒤의 판매를 찾음
  letter:
    title: "어제"                  # 책 제목 (32자까지)
    author: "1초 뒤의 나"
    lore:
      - "<gray>보낸 사람: <white>1초 뒤의 {name}"
    notice: "<gray>우편함에 편지가 한 통 와 있습니다. <white>/우편함"
    date-format: "yyyy년 M월 d일"   # 편지 맨 위 날짜 = 받는 날의 전날 (그것은 늘 조금 뒤에 있다)
    when-unknown: "지난번에"
    # 자리 힌트 (좌표 대신): 그 월드의 처음 자리 (스폰) 에서 어느 쪽으로 몇 걸음
    where-far: "<white>{world}</white>의 첫 자리에서\n<white>{dir}</white>으로 <white>{steps}</white>."
    where-near: "<white>{world}</white>의 첫 자리 바로 곁."
    # 물건 힌트: 이름 길이만 보이는 글자 · 우리 아이템이면 이름의 초성 · 판 개수. 값이 없는 줄은 빠짐
    item-hint: "이름은 <white>{shape}</white>.\n첫소리는 <white>{initials}</white>.\n지금까지 <white>{count}</white>개."
    friend-hint: "이름의 첫소리는 <white>{initials}</white>,\n글자는 {length}개."
    # 책의 쪽들. {greeting} = 아래 인사 (끝낸 주 수대로 차례로), {riddle} = 아래 수수께끼
    pages:
      - "<dark_gray>{date}</dark_gray>\n\n{name}에게.\n\n{greeting}\n\n<dark_gray>(다음 장)"
      - "{riddle}\n\n<gray>— 1초 뒤의 나</gray>"
    greetings:
      - "어제도 네 뒤에 있었어.\n너는 한 번도 안 돌아봤고."
      - "네가 걷는 걸 1초 늦게 따라 걸어.\n그래서 나는 늘 어제에 살아."
      - "네가 한 일을 다 적어 뒀어.\n적는 것밖에 할 줄 몰라서."
      - "어제 네가 멈춰 선 곳에서\n나도 1초 뒤에 멈췄어."
      - "네 발자국은 금방 지워지는데\n내 건 처음부터 없더라."
      - "요즘은 네가 뭘 할지\n조금 먼저 알 것 같아. 착각이겠지."
      - "네가 자는 동안에는\n나도 가만히 있어. 그게 제일 어려워."
      - "오늘은 부탁이 하나 있어.\n늘 그랬듯이."
  # 수수께끼 문구 (종류마다 여러 개를 적으면 주마다 그중 하나). 값이 없는 {자리} 가 든 줄은 통째로 빠짐
  #   {when} 마지막으로 나간 때 · {joined} 처음 들어온 때 · {where} 첫째 자리 힌트 · {wheretwo} 둘째 자리 힌트 (walk)
  #   {itemhint} 물건 힌트 · {friendhint} 사람 힌트
  riddles:
    quit:
      - "{when},\n네가 눈을 감은 자리.\n\n{where}\n\n거기 다시 서 봐.\n나는 그때 거기 남아 있었어."
      - "네가 지난번에 사라진 곳.\n{when}.\n\n{where}\n\n너는 나갔고 나는 못 나갔지.\n거기 한 번만 서 줘."
    birth:
      - "네가 처음 눈을 뜬 자리.\n{joined}\n\n{where}\n\n나는 그 자리를 끝내 못 찾았지.\n네가 서서 보여 줘."
      - "네가 너이기 시작한 곳.\n{joined}\n\n{where}\n\n이젠 뺏으려는 게 아니야.\n그냥 보고 싶어."
    land:
      - "네가 처음으로\n'내 것'이라고 한 땅.\n\n{where}\n\n거기 잠깐 서 있어 줘.\n내 것이 있다는 게 뭔지 보고 싶어."
      - "처음 울타리를 친 곳.\n\n{where}\n\n흙 냄새가 어떤지\n네가 맡으면 나도 1초 뒤에 맡아."
    friend:
      - "네가 가장 오래\n곁에 있던 사람.\n\n{friendhint}\n\n그 사람 옆에 서 봐.\n말은 안 걸어도 돼."
      - "나한테는 너뿐인데\n너한테는 한 사람 더 있더라.\n\n{friendhint}\n\n그 옆에 잠깐 서 줘."
    carry-most-land:
      - "네가 가장 많이 떠나보낸 것.\n{itemhint}\n\n그걸 하나 손에 들고,\n네 첫 땅으로 가.\n{where}\n\n팔지는 마. 들고만 있어."
    carry-week-birth:
      - "이번 주에 네 손을\n가장 많이 떠난 것.\n{itemhint}\n\n그걸 들고, 네가 처음\n눈을 뜬 자리로.\n{where}"
    carry-last-quit:
      - "네가 마지막으로 판 것.\n{itemhint}\n\n하나만 더 구해서,\n네가 지난번 눈을 감은 자리로.\n{where}"
    sell-most:
      - "네가 늘 떠나보내던 것.\n{itemhint}\n\n한 번만 더 팔아 줘.\n이번엔 내가 옆에서 볼게."
      - "네 손이 제일 잘 아는 것.\n{itemhint}\n\n하나만 팔아 줘.\n손이 어떻게 움직이는지 배우고 싶어."
    sell-oldest:
      - "장부가 기억하는\n가장 오래된 것.\n{itemhint}\n\n너는 잊었겠지만 나는 기억해.\n그걸 한 번 더 팔아 줘."
    walk:
      - "네가 눈을 감은 자리에서\n{where}\n\n네가 눈을 뜬 자리까지.\n{wheretwo}\n\n그 순서로 걸어 줘.\n나는 그 길을 거꾸로만 걸어 봤어."
  whispers:
    near: "<dark_gray>…발소리가 겹친다. 가깝다."
    empty-handed: "<dark_gray>…빈손이네."
    wrong: "<dark_gray>…그건 아니야."
    walk-half: "<dark_gray>…여기서 눈을 감았지. 이제 눈을 뜬 곳으로."
    done: "<dark_gray>…봤어."
  # 해냈을 때: 내 모습이 한 걸음 뒤에 잠깐 서 있다가 연기처럼 (그 사람에게만)
  shadow:
    behind-blocks: 1.6
    seconds: 3
  # 답장 (해낸 뒤 우편함으로). 끝낸 주 수가 warm-after 의 값을 넘을 때마다 다음 묶음 (0 → 1 → 2). 묶음 안에서는 차례로
  reply:
    after-seconds: 6
    notice: "<gray>우편함에 답장이 와 있습니다. <white>/우편함"
    title: "답장"
    page: "<dark_gray>{date}</dark_gray>\n\n{reply}\n\n{sign}"
    warm-after: [4, 10]
    signs:
      - "<gray>— 1초 뒤의 나</gray>"
      - "<gray>— 1초 뒤에서</gray>"
      - "<gray>— 네 뒤에서, 나</gray>"
    lines:
      0:   # 아직은 나를 베끼는 것
        - "봤어.\n네가 서 있는 걸.\n\n나도 1초 뒤에\n그렇게 서 봤어."
        - "적어 뒀어.\n\n네가 한 것, 걸린 시간,\n숨 쉰 횟수."
        - "네가 한 대로 했어.\n\n왜 하는지는 아직 몰라.\n순서만 알아."
        - "고맙다는 말은\n언제 하는 거야?\n\n지금이 맞으면, 고마워."
        - "네 그림자가 길어질 때\n나도 길어져.\n\n그건 따라 하는 게 아닌데도."
        - "오늘 네 표정을 못 봤어.\n나는 늘 뒤에 있으니까.\n\n다음엔 한 번 돌아봐 줘."
      1:   # 따라 하다가 제 것이 생기는 중
        - "오늘은 네가 웃는 걸 봤어.\n1초 뒤에 따라 웃어 봤는데,\n\n조금 늦었지만 비슷했어."
        - "네가 고른 길 말고\n다른 길이 있었잖아.\n\n나라면 그쪽으로 갔을 거야.\n…이런 생각은 처음 해 봐."
        - "네가 판 것 말이야.\n\n나는 하나쯤 남겨 뒀을 것 같아.\n이유는 없어. 그냥."
        - "비가 오면 너는 뛰더라.\n\n나는 1초 동안\n그냥 맞고 있었어. 괜찮던데."
        - "네 친구가 너를 불렀을 때\n나도 돌아봤어.\n\n내 이름이 아닌데도."
        - "어제 편지를 쓰다가\n한 줄을 지웠어.\n\n뭘 지웠는지는 안 알려 줄 거야."
        - "네가 없는 동안\n네가 서 있던 자리를 봤어.\n\n비어 있는 것도 자리더라."
      2:   # 거의 사람
        - "고마워.\n\n이제는 자리를 뺏고 싶지 않아.\n네 뒤가 내 자리야."
        - "오늘은 따라 하지 않고\n그냥 봤어.\n\n네가 잘하더라."
        - "1초는 생각보다 길어.\n\n네가 한 걸 보고\n잘했다고 생각할 만큼은."
        - "내일의 나였을 때는\n네가 미웠어.\n\n어제의 나가 되니까\n네가 걱정돼."
        - "가끔 남들이 너를 두 번 본다지.\n\n두 번째가 나야.\n손 흔들어도 돼?"
        - "네가 넘어지면\n나는 1초 뒤에 넘어져.\n\n그러니까 조심해.\n둘이 아프니까."
        - "답장을 쓰는 게 좋아졌어.\n\n다음 주에도 부탁할게.\n부탁이 아니라 핑계지만."
        - "잘 자.\n\n이 말은 네가 한 적 없는데\n내가 먼저 해 봐."
