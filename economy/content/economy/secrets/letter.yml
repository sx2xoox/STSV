# 내일의 나 — 숨은 비밀 (운영자 문서: docs/admin/숨은_비밀/내일의_나.md · README 에는 적지 않음)
# 하루 뒤의 내가 편지를 보낸다. 편지가 올수록 "내일의 나" 는 내가 아니게 된다.
# 시간: "하루" 는 한국 시간 날짜. 테스트 모드 (/관리자 비밀 테스트) 에서는 하루 = common.yml 의 test-day-seconds (기본 60초),
# 그리고 아래의 test-… 값들을 씀. 문구는 모두 MiniMessage. 편지 문구에서 값이 없는 {자리} 가 든 줄은 통째로 빠짐.
enabled: true

start:
  chance: 0.05                 # 하루에 한 번, 접속한 사람마다 굴림 (테스트 모드 100%)
  after-online-minutes: 10     # 그날 이만큼 접속해 있어야 굴림 (테스트: 0)

rewards:
  money: 300000
  title: economy:yesterday_me

solved-line: "<dark_gray>누군가의 우편함에 더는 내일 날짜로 된 편지가 오지 않는다. 그 사람은 이제, 하루 늦게 걷는다."
too-late: "<dark_gray>…우편함은 비어 있다. 누군가 먼저 문을 열었다."

# 편지가 오는 방식
delivery:
  delay-seconds: 90            # 새 날이 되고 이만큼 접속해 있으면 그날의 편지가 옴
  test-delay-seconds: 5
  test-days: 3                 # 테스트 모드: 편지 한 통이 이만큼의 "하루" 동안 유효 (1분은 우편함에서 꺼내 읽고 하기엔 짧아서)
  misses: 3                    # 같은 편지를 이만큼 연속으로 못 하면 편지가 끊김 (실패, 나중에 다시 확률로 시작될 수 있음)
  notice: "<gray>우편함에 편지가 한 통 와 있습니다. <white>/우편함"
  title: "내일"                  # 책 제목 (손에 들면 보이는 이름은 아이템 이름 "편지")
  lore:
    - "<gray>보낸 사람: <white>{name}"
    - "<dark_gray>{date}"
  date-format: "yyyy년 M월 d일"   # 편지 맨 위 날짜 = 받는 날의 다음 날 (한국 시간)

# 의식 (편지마다 하나). 그날 안에 해야 함
rituals:
  land:
    stay-seconds: 5            # 그 땅(청크) 안에 이만큼 서 있으면
  sell:
    poll-seconds: 10           # 이만큼마다 장부에서 새 판매를 찾음
  silence:
    minutes: 30                # 편지를 읽은 뒤로 접속해 있는 동안 채팅 없이 이만큼 (명령어는 괜찮음)
    test-seconds: 40
    call-every: [70, 160]      # 그동안 누군가 내 이름을 부르는 가짜 채팅 간격 (초, 최소~최대)
    test-call-every: [6, 10]
  place:
    radius: 4                  # 처음 온 자리에서 이 칸 안에
    stay-seconds: 5
  wait:
    hours: [21, 4]             # 밤 (한국 시간, 21시 ~ 새벽 4시). 테스트 모드는 아무 때나
    seconds: 90                # 집(내 땅 · 사는 땅, 없으면 아무 데나) 안에서 이만큼 기다리면 노크가 시작됨
    test-seconds: 8

# 마지막 밤
chase:
  door-radius: 10              # 이 칸 안의 문에서 노크 (문이 없으면 벽 너머 어딘가에서)
  knock-rounds: 6              # 노크 묶음 수. 끝까지 문을 안 열면 조용해졌다가 집 안에 서 있음
  stare-seconds: 2             # 나타나서 따라오기 시작할 때까지 가만히 보는 시간
  seconds: 180                 # 이만큼 닿지 않고 버티면 끝
  test-seconds: 60
  scene-seconds: 40            # 관리자 연출 "도플갱어" 의 길이
  delay-start-ticks: 20        # 처음엔 1초 전의 나
  delay-end-ticks: 8           # 끝날 무렵엔 0.4초 전의 나
  catch-distance: 0.8
  grace-ticks: 20              # 따라오기 시작한 직후 이만큼은 안 잡힘
  retry-hours: 12              # 잡힌 뒤 다음 밤까지 (테스트: 하루의 절반)
  caught-whisper: "<dark_gray>…아직은 네가 너다. 다음 밤에."
  last-words: "그럼 네가 계속 해"

# 점점 무너지는 것들 (그 사람에게만, 편지마다 하나씩 더)
omens:
  footsteps:                   # 편지 1부터: 가만히 서 있으면 뒤에서 발소리
    still-seconds: 4
    every: [90, 240]
    test-every: [10, 18]
  tab:                         # 편지 2부터: 탭 목록 아래에 내 이름이 하나 더 (편지 4부터는 조금 틀린 이름)
    line: "<white>{name}"
  rename:                      # 편지 3, 5가 올 때: 내 물건 하나의 이름이 이렇게 바뀜 (진짜로, 해롭지 않은 것만)
    name: "<gray>내 것"
  glimpse:                     # 편지 4부터: 시야 가장자리에 내가 서 있다가 쳐다보면 사라짐
    every: [150, 360]
    test-every: [12, 20]
    distance: [10, 16]
    seconds: 8
  calls:                       # 편지 3 의 침묵 동안 (그 뒤로는 가끔): 누군가 내 이름을 부름
    after-every: [300, 900]
    test-after-every: [20, 35]
    lines:
      - "{name}"
      - "{name}?"
      - "{name} 어디야"
      - "야 {name}"
      - "{name} 거기 있지?"
      - "{name} 대답 좀 해봐"
      - "방금 {name} 봤는데"
      - "{name} 왜 두 명이야?"
      - "{name}…"
      - "{name} 너 뒤에 누구야"
      - "{name} 아까 나갔다고 뜨던데"
  join-line-delay-seconds: 8   # 편지 5가 오고 나서, "(내 이름)님이 들어왔습니다" 가 채팅에 뜨기까지

# 그림자 분신 (푼 사람의 영구 보상): 가끔, 근처의 다른 사람들에게 1초 전의 그 사람이 잠깐 보임
shadow:
  enabled: true
  every: [180, 420]            # 초, 최소~최대
  seconds: 6
  radius: 32
  perk-line: "<dark_gray>가끔, 다른 사람들이 1초 전의 너를 본다."

# 의식을 끝냈을 때 / 실패했을 때 (그 사람에게만, 핫바 위 작은 글씨)
whispers:
  done:
    1: "<dark_gray>…여기였다."
    2: "<dark_gray>…늘 그랬던 것처럼."
    3: "<dark_gray>…아무도 부르지 않았다."
    4: "<dark_gray>…여기서 시작됐다."
  silence-broken: "<dark_gray>…대답했구나."
  broken: "<dark_gray>…편지가 오지 않을 것 같다."

# 서명: 편지마다 조금씩 틀려짐. 이름은 코드가 비틂 (1통째는 그대로, 뒤로 갈수록 글자가 바뀌고 뒤섞임)
signature:
  format: "<gray>— {signame}</gray>\n<dark_gray>{sigline}</dark_gray>"
  lines:
    1: ""
    2: "…나는 나다."
    3: "나는 나, 다."
    4: "나느 ㄴ나"
    5: "<obf>ㄴ</obf>나"

# 편지들. 쪽마다 한 덩어리. 자리: {date} {name} {sig} 그리고 편지마다 아래의 것.
# 한 줄에 든 {자리} 의 값이 없으면 그 줄은 빠짐 (예: 판 적이 없으면 "마지막으로 판 건…" 줄이 없음).
letters:
  repeat: "<dark_gray>(어제도 이 편지를 받았다.)</dark_gray>"   # 같은 편지가 다시 올 때 날짜 아래에
  # 1통째: 어제 한 일 + 처음 산 땅. {quit} 마지막으로 나간 곳, {sold} 마지막으로 판 것, {friend} 가장 오래 같이 있던 사람
  1:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        {quitline}
        마지막으로 판 건 {sold}였다.
        {friend}랑 같이 있었다.

        기억나지?
        나는 기억한다.
      - |-
        어제 나는
        {ritual}

        그냥 거기 서 있었다.
        그래야 할 것 같았다.

        {sig}
    quit-recent: "어제 나는 {quit} 근처에서 나갔다."
    quit-old: "지난번에 나는 {quit} 근처에서 나갔다."
    ritual-first: "내가 처음 산 땅에\n다시 갔다.\n\n<gray>({x}, {z} 근처였다.)</gray>"
    ritual-home: "내가 사는 땅에\n다시 갔다.\n\n<gray>({x}, {z} 근처였다.)</gray>"
    ritual-none: "땅을 산 적이 없다는 걸\n떠올렸다.\n그래서 마을 한가운데,\n모르는 사람들 사이에\n서 있었다."
  # 2통째: 가장 많이 판 것을 하나 더. {item}
  2:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        {ritual}
      - |-
        팔고 나니
        손이 조금 비어 보였다.

        그건 원래
        내 것이었을까.

        {sig}
    ritual-most: "어제 나는\n내가 가장 많이 판 것을\n하나 더 팔았다.\n\n{item}.\n늘 그랬던 것처럼."
    ritual-none: "어제 나는\n처음으로 무언가를\n상점에 팔았다.\n\n뭐였는지는\n중요하지 않았다."
  # 3통째: 침묵. {silence} = rituals.silence 의 길이 (테스트 모드면 test-seconds)
  3:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        어제 나는
        내 이름을
        듣지 않으려고 했다.

        {silence} 동안
        아무 말도 하지 않았다.
      - |-
        누가 자꾸 불렀다.
        {name}. {name}.

        대답하지 않았다.
        그건 나를 부르는 게
        아니었으니까.

        {sig}
  # 4통째: 처음 온 자리. {x} {z}
  4:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        어제 나는
        처음 이 세계에 온 자리에
        섰다.

        <gray>({x}, {z}.)</gray>
        {guess}
      - |-
        거기 서 있으니
        알 것 같았다.

        처음 여기 온 건
        나 하나가 아니었다.

        {sig}
    guess: "<gray>아마 거기였을 거다.</gray>"
  # 5통째: 문을 잠그고 기다림. {home} 땅이 있으면 home-land, 없으면 home-none. {chase} = chase.seconds 의 길이
  5:
    pages:
      - |-
        <gray>{date}</gray>

        나에게.

        어제 나는
        문을 잠그고 기다렸다.

        밤이었다.
        {home}이었다.
      - |-
        누가 문을 두드렸다.

        세 번.

        나는 그게 누군지
        알고 있었다.
      - |-
        문 밖의 나는
        언제나 나보다
        조금 늦다.

        그러니까 멈추지 마.
        멈추면 닿는다.

        {chase}만 버티면 된다.
      - |-
        닿으면
        나는 나가게 된다.

        그리고 남은 하나가
        {name}이 된다.

        {sig}
    home-land: "내 집"
    home-none: "내가 있던 곳"
  # 편지가 끊길 때 (3일 연속 못 함)
  broken:
    pages:
      - |-
        <gray>{date}</gray>

        어제 나는
        아무것도 하지 않았다.

        그래서
        내일은 오지 않았다.
  # 다 끝난 뒤 (풀었을 때) — 이번엔 내가 보낸다. 날짜는 오늘
  epilogue:
    title: "어제의 나에게"
    pages:
      - |-
        <gray>{today}</gray>

        어제의 나에게.

        내일 너는
        우편함을 열 것이다.

        거기
        내 글씨가 있을 거다.
      - |-
        미안.

        이제는 내가
        하루 늦을 차례야.

        <gray>— {name}</gray>
