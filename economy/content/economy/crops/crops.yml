# 커스텀 작물 (STSV 작물 엔진). 씨앗을 경작지에 우클릭해서 심고, 물뿌리개로 물을 주면 자람.
# grow-minutes = 물이 있는 동안의 성장 시간. 물 한 번 = water-hours 시간. 말라서 wither-hours 지나면 시듦.
# 해충(pest-chance, 단계마다): 성장이 멈추고 pest-hours 안에 살충제를 안 쓰면 시듦.
# regrow = 수확 뒤 그 단계로 돌아가 다시 열림. quality: true = 품질 ★ 이 붙는 수확물.
# job / level = 이 레벨의 그 직업만 심을 수 있음 (경제 서버 규칙).
# 모델: models/<작물>_0 ~ <작물>_(stages-1), 시든 모습 models/withered_crop

golden_wheat:
  name: "황금 밀"
  seed: golden_wheat_seeds
  stages: 4
  grow-minutes: 180
  harvest:
    - { item: golden_wheat, min: 1, max: 2, quality: true }
    - { item: golden_wheat_seeds, min: 1, max: 2 }
  job: farmer
  level: 2

honey_potato:
  name: "꿀 감자"
  seed: honey_potato_seed
  stages: 4
  grow-minutes: 200
  harvest:
    - { item: honey_potato, min: 2, max: 3, quality: true }
  job: farmer
  level: 2

ruby_carrot:
  name: "루비 당근"
  seed: ruby_carrot_seed
  stages: 4
  grow-minutes: 200
  harvest:
    - { item: ruby_carrot, min: 2, max: 3, quality: true }
  job: farmer
  level: 2

tomato:
  name: "토마토"
  seed: tomato_seeds
  stages: 5
  grow-minutes: 120
  regrow: 3
  harvest:
    - { item: tomato, min: 2, max: 4, quality: true }
    - { item: tomato_seeds, min: 0, max: 1 }

chili:
  name: "고추"
  seed: chili_seeds
  stages: 5
  grow-minutes: 150
  regrow: 3
  harvest:
    - { item: chili_pepper, min: 3, max: 5, quality: true }
    - { item: chili_seeds, min: 0, max: 1 }

strawberry:
  name: "딸기"
  seed: strawberry_seeds
  stages: 4
  grow-minutes: 100
  regrow: 2
  pest-chance: 0.08
  harvest:
    - { item: strawberry, min: 2, max: 3, quality: true }
    - { item: strawberry_seeds, min: 0, max: 1 }

# 도구
tools:
  watering-cans:
    economy:watering_can: { capacity: 16, radius: 0 }
    economy:copper_watering_can: { capacity: 48, radius: 1 }   # 3×3 한 번에
  fertilizers:
    economy:compost: { speed: 1.0, quality: 0.15 }
    economy:fertilizer: { speed: 1.3, quality: 0.1 }
    economy:super_fertilizer: { speed: 1.6, quality: 0.3, yield: 1 }
  pesticides: [economy:pesticide]
  sprinklers:
    economy:sprinkler: { radius: 2 }   # 5×5
  pots: [economy:planter_pot]
