# 커스텀 작물 (STSV 작물 엔진). 씨앗을 경작지에 우클릭해서 심음. 자라는 방식은 바닐라 작물과 같음:
#   빛 9 이상, 주변 4칸 안에 물(또는 비)이 있어 젖은 경작지면 빨리, 같은 작물을 줄지어 심으면 빨리,
#   뼛가루로 1단계 (저절로 7단계 자랄 때마다 한 번, 상점에서 산 뼛가루는 안 됨).
#   플레이어 근처(시뮬레이션 거리)에서만 자람.
# max-age = 성장 단계 수 (밀 = 7, 젖은 경작지에서 약 24분). stages = 모양 수 (models/<작물>_0 ~ _(stages-1), 마지막은 다 익었을 때만).
# 다시 열리는 작물(regrow)은 max-age 8~14: 처음 27~48분, 그 뒤 4~7단계마다. 24분에 한 칸 값: 다시 열림 23~37G, 다시 심음 14~21G.
# 다 익은 작물을 우클릭하거나 때리면 수확하고 바로 다시 심음: regrow 가 있으면 그 단계로 돌아가 다시 열리고,
#   없으면 수확물 중 씨앗 하나(없으면 가방의 씨앗 하나, 그것도 없으면 그냥)로 다시 심음. 덜 자란 작물을 때리면 씨앗으로 돌아옴.
# harvest 의 첫 줄이 주 수확물 (농부의 "하나 더" 대상). height = 다 자란 키 (블록).

tomato:
  name: "토마토"
  seed: tomato_seeds
  stages: 5
  max-age: 8
  regrow: 4
  height: 1.0
  harvest:
    - { item: tomato, min: 2, max: 4 }
    - { item: tomato_seeds, min: 0, max: 1 }

