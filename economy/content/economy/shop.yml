# 관리자 상점 /상점: 구매 · 판매 → 카테고리 → 품목. 시세 /시세
# 판매(sell): 플레이어가 상점에 팔 때. 매입가는 사람마다 따로: P = base × max(floor, (1 + S/Q)^(-curve-exponent)) × 배수
#   (수요 고시·품귀·폭락·고가 매입상), S = 그 사람이 그 물건을 판 양 (매시간 hourly-recovery 만큼, 매일 05시에 daily-decay 만큼
#   줄어듦), Q = q × depth (접속 인원과 무관). 내가 판 만큼 내 값만 내려가고, 다른 사람이 판 것은 내 값에 영향 없음.
#   cap = 1인 하루 판매 한도(선택).
#   많이 팔수록 계속 조금씩 싸짐 (벽처럼 멈추지 않음): S = Q 에서 기준가의 71%, 3Q 50%, 8Q 33%, 15Q 에서야 floor 25%.
#   depth 를 올리면 덜 떨어지고, curve-exponent 를 올리면 더 빨리 떨어짐.
#   시세판·24시간 변화·/시세(콘솔)는 시장가 = base × 배수 (최근 안 판 사람이 받는 값)
#   q 는 기준가 구간으로 정함 (모든 판매 줄 같은 규칙): 3G 미만 128 · 6G 미만 64 · 15G 미만 32 · 50G 미만 16 · 150G 미만 8
#   · 500G 미만 4 · 1000G 미만 2 · 그 위 1. 커스텀 작물은 하루 한도 없음 (밭에서 나는 만큼 다 팔림, 곡선 바닥 25% 와 소득세가 위를 누름).
#   cap 이 있는 것은 다이아몬드(32)·네더라이트 파편(4)
# 작물 값(2026-11): 농부가 한 시간에 줍는 양(약 300묶음)에 맞춰 개당 값을 낮춤. 그 작물을 쓰는 레시피·의뢰는 개수를 그만큼 늘림(값 그대로)
# 구매(buy): 플레이어가 상점에서 살 때 (고정가). 장비와 고급 재료는 팔지 않음: 플레이어끼리 거래.
# 카테고리는 화면 한 줄: 판매 7개까지, 구매 9개까지 (상인 행렬 자리 포함, 짝수 개면 가운데 칸을 비우고 양쪽으로 나눔).
# 카테고리 = name, icon(아이템 id), items.
# 아무리 많이 팔아도 이 아래로는 안 내려감 (기준가의 25%: 15Q 넘게 팔아야 닿음)
floor: 0.25
daily-decay: 0.5
# 하락 완만함: q(1인 적정량) 에 곱함. 6 = 한 사람이 q 의 6배를 팔면 그 사람 값이 기준가의 71% (q 만 팔면 93%)
depth: 6
# 하락 모양: (1 + S/Q) 의 -0.5 제곱. 처음엔 완만하고, 많이 팔수록 손해가 커지지만 멈추지는 않음
curve-exponent: 0.5
# 하루 중에도 회복: 매시간 각자 판 양(S)이 이 비율만큼 줄어듦 (0.12 = 약 5시간 반이면 절반)
hourly-recovery: 0.12
# 판매 소득세 (누진): 그날(05시부터) 상점에 판 금액 중 over 를 넘는 부분에만 rate. 적게 파는 사람은 안 냄
#   예) 하루 20,000G 판매 → 세금 0 · 50,000G → 2,000G · 80,000G → 7,000G · 150,000G → 26,000G
income-tax:
  - { over: 30000, rate: 0.10 }
  - { over: 60000, rate: 0.20 }
  - { over: 100000, rate: 0.30 }

