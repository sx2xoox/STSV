# 관리자 상점 /상점: 구매 · 판매 → 카테고리 → 품목. 시세 /시세
# 판매(sell): 플레이어가 상점에 팔 때. 가격 P = max(floor·base, base·e^(-S/Q)), Q = q × 오늘 접속 인원,
#   S = 오늘 서버 전체가 판 양 (매일 05시에 daily-decay 만큼 줄어듦). cap = 1인 하루 판매 한도(선택).
# 구매(buy): 플레이어가 상점에서 살 때 (고정가). 장비와 고급 재료는 팔지 않음: 플레이어끼리 거래.
# 카테고리는 한쪽에 7개까지 (화면 한 줄, 구매는 상인 행렬 자리 포함). 카테고리 = name, icon(아이템 id), items.
floor: 0.35
daily-decay: 0.5

