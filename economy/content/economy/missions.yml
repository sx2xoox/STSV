# 미션 /미션: 사람마다 따로 뽑히는 일일(매일 05시)·주간(월요일 05시) 목표. 의뢰(물건 납품)와 달리 "활동" 목표.
# 한 번에 count 개: 지금 직업이 있으면 그 직업 미션(job) 1개 + 나머지는 누구나 미션(job 없음).
#   일일의 누구나 미션은 "평소 안 하던 일" (버스 · 하역 · 도감 · 직거래 · 낚시대회 · 거래소 …): 서버 구경 안내 겸, 싫으면 다시 뽑기.
#   같은 group 은 한 번에 하나만 (group 을 안 쓰면 stat 이 group).
#   min-level: 가장 높은 직업 레벨이 이만큼은 돼야 뽑힘 (버스 · 하역처럼 처음엔 못 하는 일)
# bands: 직업 미션의 단계. 그 직업 레벨이 from 이상이면 목표 × goal, 골드 · 경험치 × reward (그 단계의 10~15분 일).
#   이름의 {goal} 이 단계에 맞는 목표로 바뀜. 미션을 받을 때의 레벨로 정해짐 (도중에 레벨이 올라도 그대로)
# stat = 세는 기록. 미션을 받은 순간부터 늘어난 만큼 셈 (그전 기록은 안 셈). 쓸 수 있는 기록:
#   ores_mined 광석 캐기 · crops_harvested 작물 수확 · animals_bred 동물 번식 · fish_caught 낚시 · rare_finds 발견품(광부 원석, 어부 희귀 어획)
#   made_miner/made_farmer/made_fisher/made_blacksmith/made_cook/made_alchemist 그 직업 기계로 만든 수 · machine_made 아무 직업 기계
#   job_xp 직업 경험치 (미션 보상 경험치는 안 셈) · shop_sold 상점에 판 개수 · shop_income 상점 판매 수입(G) · requests_done 주민의 부탁
#   stock_trades 주식 거래(한 번에 500G 이상만) · market_sold 거래소에서 팔린 수 (100G·상점 시세 이상, 같은 구매자는 하루 1번: trade.yml credit) · playtime 플레이 시간(초) · mob_kills 몹 처치 · blocks_broken · blocks_placed
#   people_met 버스 손님을 목적지까지 태워 줌(인물 도감의 만남) · people_new 인물 도감에 새 사람 · dock_sales 하역장에 판 번 · codex_new 도감에 새로 등록
#   trades_direct 직거래 (한쪽이 100G 이상 건넨 것만, 같은 상대는 하루 1번) · tournaments 낚시대회에서 한 마리 이상 낚은 대회
# 보상: gold, xp (끝냈을 때 직업의 경험치), items ["아이디 x개수"] (인벤토리가 차면 우편함), stamps 도장 (stamps.yml). 다 끝내면 bonus.
#   kind 의 stamps = 미션마다의 기본 도장 (미션에 stamps 를 쓰면 그것)
# rerolls: 기간마다 미션을 다른 것으로 바꿀 수 있는 횟수 (/미션 에서 우클릭). 다 쓰면 도장 가게의 다시 뽑기권. weight: 클수록 자주 뽑힘 (기본 10)

daily:
  count: 3
  rerolls: 1
  stamps: 0
  bonus: { gold: 400, xp: 50, stamps: 1 }
  bands:
    - { from: 1, goal: 1, reward: 1 }
    - { from: 10, goal: 1.6, reward: 1.5 }
    - { from: 20, goal: 2.4, reward: 2 }
    - { from: 31, goal: 3.5, reward: 3 }
  missions:
    # 광부
    ores:        { name: "광석 {goal}개 캐기", stat: ores_mined, goal: 64, unit: "개", job: miner, icon: iron_ore, gold: 150, xp: 40 }
    gem_bench:   { name: "세공대에서 {goal}개 만들기", stat: made_miner, goal: 6, unit: "개", job: miner, group: machine, icon: economy:ruby, gold: 150, xp: 40 }
    xp_miner:    { name: "광부 경험치 {goal} 모으기", stat: job_xp, goal: 150, job: miner, icon: experience_bottle, gold: 150 }
    # 농부
    harvest:     { name: "작물 {goal}개 수확", stat: crops_harvested, goal: 160, unit: "개", job: farmer, icon: wheat, gold: 150, xp: 40 }
    breed:       { name: "동물 {goal}마리 번식", stat: animals_bred, goal: 10, unit: "마리", job: farmer, icon: wheat, gold: 150, xp: 40, weight: 6 }
    mill:        { name: "가공대에서 {goal}개 만들기", stat: made_farmer, goal: 8, unit: "개", job: farmer, group: machine, icon: economy:chili_powder, gold: 150, xp: 40 }
    xp_farmer:   { name: "농부 경험치 {goal} 모으기", stat: job_xp, goal: 150, job: farmer, icon: experience_bottle, gold: 150 }
    # 어부
    fish:        { name: "물고기 {goal}마리 낚기", stat: fish_caught, goal: 15, unit: "마리", job: fisher, icon: cod, gold: 150, xp: 40 }
    fish_bench:  { name: "손질대에서 {goal}개 만들기", stat: made_fisher, goal: 6, unit: "개", job: fisher, group: machine, icon: economy:fish_meat, gold: 150, xp: 40 }
    xp_fisher:   { name: "어부 경험치 {goal} 모으기", stat: job_xp, goal: 150, job: fisher, icon: experience_bottle, gold: 150 }
    # 대장장이
    forge:       { name: "대장간에서 {goal}개 만들기", stat: made_blacksmith, goal: 4, unit: "개", job: blacksmith, group: machine, icon: economy:iron_plate, gold: 150, xp: 40 }
    xp_smith:    { name: "대장장이 경험치 {goal} 모으기", stat: job_xp, goal: 150, job: blacksmith, icon: experience_bottle, gold: 150 }
    # 요리사
    kitchen:     { name: "조리대에서 {goal}개 만들기", stat: made_cook, goal: 6, unit: "개", job: cook, group: machine, icon: economy:kimchi, gold: 150, xp: 40 }
    xp_cook:     { name: "요리사 경험치 {goal} 모으기", stat: job_xp, goal: 150, job: cook, icon: experience_bottle, gold: 150 }
    # 연금술사
    still:       { name: "증류기에서 {goal}개 만들기", stat: made_alchemist, goal: 4, unit: "개", job: alchemist, group: machine, icon: economy:makgeolli, gold: 150, xp: 40 }
    xp_alchemist: { name: "연금술사 경험치 {goal} 모으기", stat: job_xp, goal: 150, job: alchemist, icon: experience_bottle, gold: 150 }
    # 누구나: 평소 안 하던 일 (한 번씩 해 보기)
    bus:         { name: "버스 손님 5명 목적지까지 태워 주기", stat: people_met, goal: 5, unit: "명", group: bus, icon: minecart, gold: 150, xp: 40, min-level: 15, weight: 8 }
    people:      { name: "인물 도감에 새 사람 1명 등록", stat: people_new, goal: 1, unit: "명", group: bus, icon: player_head, gold: 150, xp: 40, min-level: 15, weight: 6 }
    dock:        { name: "하역장에 짐 한 번 팔기", stat: dock_sales, goal: 1, unit: "번", icon: chest_minecart, gold: 150, xp: 40, min-level: 10, weight: 6 }
    codex:       { name: "도감에 새 물건 2개 등록", stat: codex_new, goal: 2, unit: "개", icon: book, gold: 150, xp: 40 }
    trade:       { name: "다른 사람과 직거래 한 번 (100G 이상)", stat: trades_direct, goal: 1, unit: "번", icon: emerald, gold: 150, xp: 40, weight: 6 }
    tournament:  { name: "낚시대회에서 한 마리 이상 낚기", stat: tournaments, goal: 1, unit: "번", icon: fishing_rod, gold: 150, xp: 40, weight: 8 }
    market:      { name: "거래소에서 물건 한 번 팔기", stat: market_sold, goal: 1, unit: "번", icon: gold_nugget, gold: 150, xp: 40, weight: 6 }
    requests:    { name: "주민의 부탁 1건 들어주기", stat: requests_done, goal: 1, unit: "건", icon: writable_book, gold: 150, xp: 40 }
    stocks:      { name: "주식 한 번 거래 (500G 이상)", stat: stock_trades, goal: 1, unit: "번", icon: paper, gold: 120, xp: 30, weight: 5 }

