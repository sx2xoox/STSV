# 직업 /직업. 지금 직업은 하나, 레벨은 직업마다 따로 저장 (바꿨다 돌아와도 그대로).
# 바꾸기는 7일에 한 번 1,000G (처음 고르는 건 무료). 효과는 지금 직업의 것만 받음.
#
# 레벨 1~30. 레벨 n 이 되는 누적 경험치 = a(n-1)² + b(n-1)  → Lv2 100, Lv10 3,780, Lv20 15,580, Lv30 35,380
# Lv30 이후 경험치는 계속 쌓여 직업 순위(숙련)가 됩니다.
max-level: 30
xp-curve: { a: 40, b: 60 }
change-cost: 1000
change-days: 7

# 효과 표의 [Lv1 값, Lv30 값] 은 그 사이를 레벨에 따라 고르게 올라감.
# 직업 기계에서 받는 효과(machine:)는 그 기계를 지금 직업이 같은 사람이 돌릴 때만:
#   speed   레벨당 시간 단축          extra   결과 +1 확률 (level 부터)
#   double  결과 두 배(2인분) 확률     save    재료 하나 아끼는 확률
#   fast    시간 배수 (level 부터)     aging   숙성 레시피 시간 배수
#   sell    그 기계 생산품을 상점에 팔 때 매입가 보너스 (level 부터)
# 직업 기계 경험치: 만든 물건 기준가 5G 당 1 (machines.yml 의 xp-per-gold)

jobs:
  miner:
    name: "광부"
    color: "#9fb4c8"
    icon: minecraft:iron_pickaxe
    machine: gem_bench
    description:
      - "광석 추가 드롭 1 → 30% (섬세한 손길 제외)"
      - "보석 원석 발견 2 → 8% (직업이 아니면 1%)"
      - "Lv10 세공 결과 +1 (15%) · Lv20 재료 절약 15%"
      - "Lv30 세공품 매입가 +20%"
    extra: [0.01, 0.30]          # 광석 드롭 +1 확률
    finds:
      chance: [0.02, 0.08]       # 원석 발견 확률
      outsider: 0.01             # 다른 직업일 때
      drops:                     # 광석 -> 나올 수 있는 원석
        redstone_ore: [economy:rough_ruby]
        deepslate_redstone_ore: [economy:rough_ruby]
        iron_ore: [economy:rough_ruby]
        deepslate_iron_ore: [economy:rough_ruby]
        lapis_ore: [economy:rough_sapphire]
        deepslate_lapis_ore: [economy:rough_sapphire]
        diamond_ore: [economy:rough_sapphire]
        deepslate_diamond_ore: [economy:rough_sapphire]
    machine-bonus:
      extra: { level: 10, chance: 0.15 }
      save: { level: 20, chance: 0.15 }
      sell: { level: 30, bonus: 0.20 }
    xp:
      break: { coal_ore: 1, deepslate_coal_ore: 1, copper_ore: 1, deepslate_copper_ore: 1, iron_ore: 2, deepslate_iron_ore: 2,
               gold_ore: 3, deepslate_gold_ore: 3, redstone_ore: 2, deepslate_redstone_ore: 2, lapis_ore: 3, deepslate_lapis_ore: 3,
               diamond_ore: 10, deepslate_diamond_ore: 10, emerald_ore: 10, deepslate_emerald_ore: 10,
               nether_gold_ore: 1, nether_quartz_ore: 1, ancient_debris: 20 }
      find: 5

  farmer:
    name: "농부"
    color: "#8bc34a"
    icon: minecraft:iron_hoe
    machine: mill
    description:
      - "다 자란 작물 수확량 +0.1 × 레벨 (Lv10 = +1)"
      - "Lv10 주변 작물 성장 가속"
      - "Lv20 가공 결과 +1 (15%)"
      - "Lv30 3×3 한 번에 수확"
    harvest-per-level: 0.1
    growth: { level: 10, chance: 0.05, radius: 6 }   # 10초마다 주변 작물이 한 단계 자랄 확률
    area-harvest: 30
    machine-bonus:
      extra: { level: 20, chance: 0.15 }
    xp:
      harvest: { wheat: 0.5, carrots: 0.5, potatoes: 0.5, beetroots: 0.5, nether_wart: 0.5, cocoa: 0.5, melon: 0.5, pumpkin: 1,
                 economy:tomato: 2, economy:chili: 2, economy:strawberry: 2, economy:onion: 2, economy:garlic: 2, economy:cabbage: 3,
                 economy:rice: 2, economy:soybean: 2, economy:corn: 3, economy:green_onion: 2, economy:radish: 3, economy:lettuce: 2,
                 economy:cucumber: 2, economy:grape: 3, economy:eggplant: 2, economy:zucchini: 2, economy:muskmelon: 4 }
      breed: 3

  fisher:
    name: "어부"
    color: "#4fc3f7"
    icon: minecraft:fishing_rod
    machine: fish_bench
    description:
      - "희귀 어획 5 → 15% (직업이 아니면 1%)"
      - "Lv10 손질 결과 +1 (15%)"
      - "Lv20 진주·참다랑어·철갑상어 두 마리씩"
      - "Lv30 손질품 매입가 +20%"
    finds:
      chance: [0.05, 0.15]
      outsider: 0.01
      pool: { economy:red_seabream: 50, economy:pearl: 25, economy:bluefin_tuna: 15, economy:sturgeon: 10 }
      double: { level: 20, items: [economy:pearl, economy:bluefin_tuna, economy:sturgeon] }
    machine-bonus:
      extra: { level: 10, chance: 0.15 }
      sell: { level: 30, bonus: 0.20 }
    xp:
      catch: 3
      find: 10

  blacksmith:
    name: "대장장이"
    color: "#ff8a65"
    icon: minecraft:anvil
    machine: forge
    description:
      - "재료 절약 5 → 30% (대장간, 도구·갑옷 제작)"
      - "Lv10 대장간 결과 +1 (15%)"
      - "Lv20 대장간 시간 절반"
      - "Lv30 대장간 생산품 매입가 +20%"
    save: [0.05, 0.30]
    machine-bonus:
      extra: { level: 10, chance: 0.15 }
      fast: { level: 20, factor: 0.5 }
      sell: { level: 30, bonus: 0.20 }
    xp:
      craft: { iron_pickaxe: 4, iron_axe: 4, iron_shovel: 2, iron_hoe: 2, iron_sword: 4, iron_helmet: 5, iron_chestplate: 8,
               iron_leggings: 7, iron_boots: 4, diamond_pickaxe: 10, diamond_axe: 10, diamond_shovel: 5, diamond_hoe: 5,
               diamond_sword: 8, diamond_helmet: 12, diamond_chestplate: 18, diamond_leggings: 16, diamond_boots: 10,
               shield: 3, bow: 2, crossbow: 3, fishing_rod: 1, shears: 1, bucket: 1, anvil: 8 }
      smith: 30

  cook:
    name: "요리사"
    color: "#ffb74d"
    icon: minecraft:cooked_beef
    machine: kitchen
    description:
      - "조리 시간 레벨당 -1%"
      - "Lv10 2인분 (15%)"
      - "Lv20 재료 절약 15%"
      - "Lv30 요리 매입가 +20%"
    machine-bonus:
      speed: 0.01
      double: { level: 10, chance: 0.15 }
      save: { level: 20, chance: 0.15 }
      sell: { level: 30, bonus: 0.20 }
    xp:
      smelt: { cooked_beef: 1, cooked_porkchop: 1, cooked_chicken: 1, cooked_mutton: 1, cooked_rabbit: 1, cooked_cod: 1,
               cooked_salmon: 1, baked_potato: 0.5, dried_kelp: 0.2 }
      craft: { bread: 0.5, cake: 5, pumpkin_pie: 2, rabbit_stew: 3, beetroot_soup: 2, mushroom_stew: 1, cookie: 0.3, golden_carrot: 2 }

  alchemist:
    name: "연금술사"
    color: "#ba68c8"
    icon: minecraft:brewing_stand
    machine: still
    description:
      - "증류 시간 레벨당 -1%"
      - "Lv10 증류 결과 +1 (15%)"
      - "Lv20 숙성 시간 절반"
      - "Lv30 술·향수 매입가 +20%"
    machine-bonus:
      speed: 0.01
      extra: { level: 10, chance: 0.15 }
      aging: { level: 20, factor: 0.5 }
      sell: { level: 30, bonus: 0.20 }
    xp:
      brew: 4
