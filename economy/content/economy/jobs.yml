# 직업 /직업. 지금 직업은 하나, 레벨은 직업마다 따로 저장 (바꿨다 돌아와도 그대로).
# 바꾸기는 언제든 (기다릴 필요 없음). 값은 바꿀 직업의 내 레벨에 따라 change-cost (처음 고르는 건 무료). 효과는 지금 직업의 것만 받음.
#
# 레벨 1~30. 레벨 n 이 되는 누적 경험치 = a(n-1)² + b(n-1)  → Lv2 100, Lv10 3,780, Lv20 15,580, Lv30 35,380
# Lv30 이후 경험치는 계속 쌓여 직업 순위(숙련)가 됩니다.
max-level: 30
xp-curve: { a: 40, b: 60 }
# 직업 변경 비용: 바꿀 "새 직업"의 내 레벨 -> 골드. 점 사이는 고르게 (Lv5 = 1,444G, Lv15 = 2,500G, Lv25 = 4,000G)
#   숫자 하나만 쓰면 레벨과 상관없이 그 값
change-cost:
  1: 1000
  10: 2000
  20: 3000
  30: 5000
change-days: 0                 # 바꾼 뒤 다시 바꾸기까지 기다리는 날 수 (0 = 바로)

# 효과 표의 [Lv1 값, Lv30 값] 은 그 사이를 레벨에 따라 고르게 올라감.
# 직업 기계에서 받는 효과(machine-bonus)는 그 기계를 지금 직업이 같은 사람이 돌릴 때만. 결과·재료 효과는 한 개마다 따로 굴려서
# 모든 레시피가 같은 비율로 늘어남 (재료가 4개든 1개든 레시피 사이 효율 순서는 레벨이 올라도 그대로):
#   speed   레벨당 시간 단축          extra   결과 한 개마다 +1 확률 (level 부터)
#   double  결과 두 배(2인분) 확률     save    재료 한 개마다 아끼는 확률 (level 부터)
#   fast    시간 배수 (level 부터)     aging   숙성 레시피 시간 배수
#   yield   결과 한 개마다 +1 확률을 더함 (level 부터, extra 와 합쳐 한 번 굴림)
# 직업 기계 경험치: 만든 물건 기준가 5G 당 1 (machines.yml 의 xp-per-gold)

jobs:
  miner:
    name: "광부"
    color: "#9fb4c8"
    icon: minecraft:iron_pickaxe
    machine: gem_bench
    description:
      - "광석 추가 드롭 5 → 60% (섬세한 손길 제외)"
      - "보석 원석 발견 3 → 12% (직업이 아니면 1%) · 특별 재료(운철·수정 원석)를 자주 얻음"
      - "Lv10 세공 결과 하나마다 15% 확률로 +1 · Lv20 재료 하나마다 15% 확률로 아낌"
      - "Lv30 세공 결과 +1 확률 15% → 35%"
    extra: [0.05, 0.60]          # 광석 드롭 +1 확률
    finds:
      chance: [0.03, 0.12]       # 원석 발견 확률
      outsider: 0.01             # 다른 직업일 때
      drops:                     # 광석 -> 나올 수 있는 원석
        redstone_ore: [economy:rough_ruby]
        deepslate_redstone_ore: [economy:rough_ruby]
        iron_ore: [economy:rough_ruby]
        deepslate_iron_ore: [economy:rough_ruby]
        lapis_ore: [economy:rough_sapphire]
        deepslate_lapis_ore: [economy:rough_sapphire]
        diamond_ore: [economy:rough_sapphire]
        deepslate_diamond_ore: [economy:rough_sapphire]
    machine-bonus:
      extra: { level: 10, chance: 0.15 }
      save: { level: 20, chance: 0.15 }
      yield: { level: 30, chance: 0.20 }
    xp:
      break: { coal_ore: 1, deepslate_coal_ore: 1, copper_ore: 1, deepslate_copper_ore: 1, iron_ore: 2, deepslate_iron_ore: 2,
               gold_ore: 3, deepslate_gold_ore: 3, redstone_ore: 2, deepslate_redstone_ore: 2, lapis_ore: 3, deepslate_lapis_ore: 3,
               diamond_ore: 10, deepslate_diamond_ore: 10, emerald_ore: 10, deepslate_emerald_ore: 10,
               nether_gold_ore: 1, nether_quartz_ore: 1, ancient_debris: 20 }
      find: 5

  farmer:
    name: "농부"
    color: "#8bc34a"
    icon: minecraft:iron_hoe
    machine: mill
    description:
      - "커스텀 작물 수확량 +20 → 80% · 바닐라 작물 +1 → 3개 (같은 밭이면 누구보다 많이)"
      - "Lv10 한 줄(1×3) 한 번에 수확 · Lv10 주변 작물 성장 가속"
      - "Lv20 3×3 한 번에 수확 · Lv20 가공 결과 하나마다 15% 확률로 +1"
      - "수확 때 특별 재료(산삼·황금 이삭·누에고치)를 자주 얻음: 다른 직업에게 팔기"
    harvest-bonus: [1, 3]       # 바닐라 작물: 수확 한 번에 더 나오는 개수 [Lv1, Lv30] (소수는 확률)
    harvest-pct: [0.2, 0.8]       # 커스텀 작물: 주 수확물 한 개마다 하나 더 나올 확률 [Lv1, Lv30]
    growth: { level: 10, chance: 0.05, radius: 6 }   # 10초마다 주변 작물이 한 단계 자랄 확률
    row-harvest: 10                 # 이 레벨부터 한 줄(1×3: 바라보는 방향의 양옆)을 한 번에 수확
    area-harvest: 20                # 이 레벨부터 3×3 을 한 번에 수확
    machine-bonus:
      extra: { level: 20, chance: 0.15 }
      yield: { level: 30, chance: 0.20 }
    xp:
      harvest: { wheat: 0.5, carrots: 0.5, potatoes: 0.5, beetroots: 0.5, nether_wart: 0.5, cocoa: 0.5, melon: 0.5, pumpkin: 1,
                 economy:tomato: 2, economy:chili: 2, economy:strawberry: 2, economy:onion: 3, economy:garlic: 3, economy:cabbage: 3,
                 economy:rice: 3, economy:soybean: 3, economy:corn: 4, economy:green_onion: 3, economy:radish: 3, economy:lettuce: 2,
                 economy:cucumber: 2, economy:grape: 3, economy:eggplant: 2, economy:zucchini: 2, economy:muskmelon: 2.5 }
      breed: 3

  fisher:
    name: "어부"
    color: "#4fc3f7"
    icon: minecraft:fishing_rod
    machine: fish_bench
    description:
      - "희귀·전설 입질 6 → 22% (직업이 아니면 1%) · 특별 재료(붉은 산호·용연향·전복)를 자주 얻음"
      - "입질 대기 시간 10 → 50% 줄어듦"
      - "초록 구간 레벨당 +1%, Lv10 하트 +1, Lv20 크기 +10%"
      - "Lv10 손질 결과 하나마다 15% 확률로 +1"
      - "Lv20 진주·참다랑어·철갑상어 두 마리씩 · 손질 재료 하나마다 15% 확률로 아낌"
      - "Lv30 손질 결과 +1 확률 15% → 35%"
    bite: [0.10, 0.50]           # 입질 대기 시간 줄어드는 비율
    finds:
      chance: [0.06, 0.22]
      outsider: 0.01
      double: { level: 20, items: [economy:pearl, economy:bluefin_tuna, economy:sturgeon] }
    machine-bonus:
      extra: { level: 10, chance: 0.15 }
      save: { level: 20, chance: 0.15 }
      yield: { level: 30, chance: 0.20 }
    xp:
      catch: 3
      find: 10

  blacksmith:
    name: "대장장이"
    color: "#ff8a65"
    icon: minecraft:anvil
    machine: forge
    description:
      - "도구·갑옷 제작 재료 절약 5 → 30%"
      - "Lv10 대장간 결과 하나마다 15% 확률로 +1"
      - "Lv20 대장간 시간 절반 · 재료 하나마다 15% 확률로 아낌"
      - "Lv30 대장간 결과 +1 확률 15% → 35%"
    save: [0.05, 0.30]            # 도구·갑옷 제작 때만 (대장간은 아래 machine-bonus 의 save)
    machine-bonus:
      extra: { level: 10, chance: 0.15 }
      fast: { level: 20, factor: 0.5 }
      save: { level: 20, chance: 0.15 }
      yield: { level: 30, chance: 0.20 }
    xp:
      craft: { iron_pickaxe: 4, iron_axe: 4, iron_shovel: 2, iron_hoe: 2, iron_sword: 4, iron_helmet: 5, iron_chestplate: 8,
               iron_leggings: 7, iron_boots: 4, diamond_pickaxe: 10, diamond_axe: 10, diamond_shovel: 5, diamond_hoe: 5,
               diamond_sword: 8, diamond_helmet: 12, diamond_chestplate: 18, diamond_leggings: 16, diamond_boots: 10,
               shield: 3, bow: 2, crossbow: 3, fishing_rod: 1, shears: 1, bucket: 1, anvil: 8 }
      smith: 30

  cook:
    name: "요리사"
    color: "#ffb74d"
    icon: minecraft:cooked_beef
    machine: kitchen
    description:
      - "조리 시간 레벨당 -1%"
      - "Lv10 2인분 (15%)"
      - "Lv20 재료 하나마다 15% 확률로 아낌"
      - "Lv30 요리 하나마다 20% 확률로 +1"
    machine-bonus:
      speed: 0.01
      double: { level: 10, chance: 0.15 }
      save: { level: 20, chance: 0.15 }
      yield: { level: 30, chance: 0.20 }
    xp:
      smelt: { cooked_beef: 1, cooked_porkchop: 1, cooked_chicken: 1, cooked_mutton: 1, cooked_rabbit: 1, cooked_cod: 1,
               cooked_salmon: 1, baked_potato: 0.5, dried_kelp: 0.2 }
      craft: { bread: 0.5, cake: 5, pumpkin_pie: 2, rabbit_stew: 3, beetroot_soup: 2, mushroom_stew: 1, cookie: 0.3, golden_carrot: 2 }

  alchemist:
    name: "연금술사"
    color: "#ba68c8"
    icon: minecraft:brewing_stand
    machine: still
    description:
      - "증류 시간 레벨당 -1%"
      - "Lv10 증류 결과 하나마다 15% 확률로 +1"
      - "Lv20 숙성 시간 절반"
      - "Lv30 증류 결과 +1 확률 15% → 35%"
    machine-bonus:
      speed: 0.01
      extra: { level: 10, chance: 0.15 }
      aging: { level: 20, factor: 0.5 }
      yield: { level: 30, chance: 0.20 }
    xp:
      brew: 4

# 특별 재료: 누구나 얻을 수 있지만 그 직업이면 훨씬 자주 (레벨이 오를수록 더). 관리자 상점은 사지 않음: 플레이어끼리 거래해서
# 다른 직업 기계의 비싼 레시피에 씀. from = harvest (다 자란 작물 하나 수확, 바닐라·커스텀) · catch (낚시로 한 마리) · break (광석 블록
# 하나, 섬세한 손길 제외). chance = [Lv1, Lv30] 그 직업일 때 한 번마다의 확률 (사이는 고르게), outsider = 다른 직업일 때.
# value = 거래 참고가 (G): 이 재료를 쓰는 레시피의 기준가 계산과 도감·설명에 쓰임 (BalanceTest).
specials:
  economy:wild_ginseng: { job: farmer, from: harvest, chance: [0.000104, 0.003125], outsider: 0.000026, value: 160 }   # 산삼
  economy:golden_ear: { job: farmer, from: harvest, chance: [0.000238, 0.007143], outsider: 0.00006, value: 70 }   # 황금 이삭
  economy:silk_cocoon: { job: farmer, from: harvest, chance: [0.000278, 0.008333], outsider: 0.000069, value: 60 }   # 누에고치
  economy:red_coral: { job: fisher, from: catch, chance: [0.002593, 0.033333], outsider: 0.000648, value: 90 }   # 붉은 산호
  economy:ambergris: { job: fisher, from: catch, chance: [0.000897, 0.011538], outsider: 0.000224, value: 260 }   # 용연향
  economy:abalone: { job: fisher, from: catch, chance: [0.005833, 0.075], outsider: 0.001458, value: 40 }   # 전복
  economy:meteoric_iron: { job: miner, from: break, chance: [0.033333, 0.111111], outsider: 0.008333, value: 180 }   # 운철
  economy:rough_crystal: { job: miner, from: break, chance: [0.133333, 0.444444], outsider: 0.033333, value: 45 }   # 수정 원석
