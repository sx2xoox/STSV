# ───────────────────────────────────────────────────────────────────────────────
# 수상한 선글라스 남자 (운영자 문서: docs/admin/버스_비밀_의뢰.md · 플레이어용 README 에는 일부러 적지 않음)
# 하루 times 번 (from ~ to 시, 한국 시각) 아무 정류장에 stay 분 동안 기다림. 태운 버스 기사에게 미션 1~5 중 하나
# (기사가 직접 얻지 못한 쪽지의 미션을 고름). 성공하면 팁 tip G (쪽지를 다 가졌으면 × all-notes-tip, 요원이면 × agent-tip)
# + 그 미션의 쪽지 (처음일 때만). give-up 분 안에 못 하면 사라짐. 4번 미션은 window 초 사이에 목적지에 서야 함.
secret:
  enabled: true
  type: shades
  from: 10
  to: 23
  times: [1, 2]
  stay: 40
  give-up: 15
  tip: [1000, 3000]
  all-notes-tip: 2.0
  agent-tip: 2.0
  window: [420, 450]
  # 최종 미션: hour:minute 부터 minutes 분 동안 (오전 · 오후 무관: 3 이면 03:33 과 15:33 둘 다), 노선 첫 정류장(터미널 쪽)에 선 버스에서 honk-window 초 안에 경적 honks 번.
  # ??? 가 폐쇄된 정류장 좌표만 말해 줌 (repeat 초마다 다시, /버스 에도): 출발 자리에서 직선 distance 블록의 국도 점
  # (쪽지 숫자와 플레이어로 정해짐; 그런 점이 없으면 가장 가까운 거리의 점 + 서버 로그 경고). 탄 뒤 time-limit 분 안에 도착.
  # 그 정류장 10칸 안에 멈추면 그가 내려 서류 가방을 둠: case-range 칸 안에서 우클릭 → 번호 (쪽지 숫자 1→5 순서) 입력,
  # attempts 번 틀리면 실패. 도착 뒤 wait 분 안에 못 열면 실패.
  final:
    hour: 3
    minute: 33
    minutes: 2
    honks: 3
    honk-window: 5
    distance: [5000, 8000]
    time-limit: 45
    repeat: 60
    wait: 10
    attempts: 3
    case-range: 6
    money: 1000000
    vehicle: stsv:agent_sedan
    cosmetics: [stsv:agent_sunglasses, stsv:agent_earpiece, stsv:agent_coat]
    title: economy:secret_agent
  # 비밀 의뢰 (최종을 마친 요원만): 일주일에 한 번, 버스를 세운 정류장에서 chance 확률로 (그 사람에게만 보임)
  # 직선 distance 블록 떨어진 정류장까지 급정거 · 부딪힘 없이 → reward G
  weekly:
    distance: [1000, 2000]
    reward: [100000, 300000]
    chance: 0.25
  # 쪽지 1~5 (미션 1~5): 이름, 최종 수수께끼 한 줄, 뒷면 숫자 (1→5 순서로 읽은 숫자 다섯 개 = 서류 가방 번호, 폐쇄된 정류장 자리도 정함)
  notes:
    - {name: "…침묵", line: "3시 33분", number: 4}
    - {name: "빈 버스", line: "종점 터미널", number: 7}
    - {name: "되돌아가는 길", line: "경적을", number: 1}
    - {name: "정확히 7분", line: "세 번", number: 9}
    - {name: "같은 곳, 세 번", line: "울려라", number: 2}
  # 목적지 수수께끼: 노선에서 그 정류장만 가진 특성이면 이 말, 아니면 이름을 거꾸로 (reversed)
  riddles:
    sea: 갈매기가 우는 곳
    mountain: 다람쥐가 넘는 고개
    field: 허수아비가 지키는 들판
    forest: 도토리가 떨어지는 숲
    village: 느티나무 그늘 아래
    port: 등대 불빛이 닿는 곳
    reversed: "'{name}'"
  talk:
    mission1: ["말은 독이지. 내릴 때까지 한 마디도 하지 말게. {riddle}.", "쉿. {riddle}. 조용히.", "{riddle}. 가는 동안 침묵.", "입은 닫게. {riddle}."]
    mission2: ["아무도 태우지 말게. {riddle}.", "오늘 이 버스엔 나뿐이야. {riddle}.", "{riddle}. 합승은 사절이네.", "{riddle}. 다른 손님은 없네."]
    mission3: ["왔던 길로… 두 정거장.", "뒤를 돌아보게. 두 정거장.", "두 정거장, 되돌아가게.", "온 길로 두 정거장. 그뿐이야."]
    mission4: ["7분. {riddle}.", "{riddle}. 7분.", "{riddle}. 정확히 7분 뒤에.", "7분. 어긋나지 말게. {riddle}."]
    mission5: ["{a}, {b}, 그리고 다시 {a}.", "{a}. {b}. {a}. 순서대로.", "{a}에서 {b}, 다시 {a}.", "{a}… {b}… 그리고 {a}."]
    step: ["…", "흠.", "…그래.", "…계속."]
    early: ["아직.", "…서두르지 말게.", "…너무 일러.", "…기다리게."]
    success: ["…좋아.", "자네, 괜찮군.", "…수고했네.", "…쓸 만하군."]
    fail: ["…다음에 보지.", "…유감이군.", "…없던 일로 하지."]
    final-board: ["…기다렸네. 가지. 목적지는 묻지 말고.", "드디어군. 출발하게.", "…시간 맞춰 왔군. 가지."]
    final-coord: ["…{coord}. 거기로.", "{coord}. 지체 말게.", "…{coord}. 서두르게."]
    final-repeat: ["…{coord}.", "{coord}. 잊지 말게.", "…{coord}. 서둘러.", "{coord}. 기억하게."]
