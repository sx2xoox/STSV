# ───────────────────────────────────────────────────────────────────────────────
# 수상한 선글라스 남자 (운영자 문서: docs/admin/버스_비밀_의뢰.md · 플레이어용 README 에는 일부러 적지 않음)
# 하루 times 번 (from ~ to 시, 한국 시각) 아무 정류장에 stay 분 동안 기다림. 태운 버스 기사에게 미션 1~5 중 하나
# (기사가 직접 얻지 못한 쪽지의 미션을 고름). 성공하면 팁 tip G (쪽지를 다 가졌으면 × all-notes-tip, 요원이면 × agent-tip)
# + 그 미션의 쪽지 (처음일 때만). give-up 분 안에 못 하면 사라짐. 4번 미션은 window 초 사이에 목적지에 서야 함.
secret:
  enabled: true
  type: shades
  from: 10
  to: 23
  times: [1, 2]
  stay: 40
  give-up: 15
  tip: [1000, 3000]
  all-notes-tip: 2.0
  agent-tip: 2.0
  window: [420, 450]
  # 최종 미션: hour:minute 부터 minutes 분 동안, 노선 첫 정류장(터미널 쪽)에 선 버스에서 honk-window 초 안에 경적 honks 번.
  # ??? 가 폐쇄된 정류장 좌표만 말해 줌 (repeat 초마다 다시, /버스 에도): 출발 자리에서 직선 distance 블록의 국도 점
  # (쪽지 숫자와 플레이어로 정해짐; 그런 점이 없으면 가장 가까운 거리의 점 + 서버 로그 경고). 탄 뒤 time-limit 분 안에 도착.
  # 그 정류장 10칸 안에 멈추면 그가 내려 서류 가방을 둠: case-range 칸 안에서 우클릭 → 번호 (쪽지 숫자 1→5 순서) 입력,
  # attempts 번 틀리면 실패. 도착 뒤 wait 분 안에 못 열면 실패.
  final:
    hour: 3
    minute: 33
    minutes: 2
    honks: 3
    honk-window: 5
    distance: [5000, 8000]
    time-limit: 45
    repeat: 60
    wait: 10
    attempts: 3
    case-range: 6
    money: 1000000
    vehicle: stsv:agent_sedan
    cosmetics: [stsv:agent_sunglasses, stsv:agent_earpiece, stsv:agent_coat]
    title: economy:secret_agent
  # 비밀 의뢰 (최종을 마친 요원만): 일주일에 한 번, 버스를 세운 정류장에서 chance 확률로 (그 사람에게만 보임)
  # 직선 distance 블록 떨어진 정류장까지 급정거 · 부딪힘 없이 → reward G
  weekly:
    distance: [1000, 2000]
    reward: [100000, 300000]
    chance: 0.25
  # 쪽지 1~5 (미션 1~5): 이름, 최종 수수께끼 한 줄, 뒷면 숫자 (1→5 순서로 읽은 숫자 다섯 개 = 서류 가방 번호, 폐쇄된 정류장 자리도 정함)
  notes:
    - {name: "…침묵", line: "새벽 3시 33분", number: 4}
    - {name: "빈 버스", line: "종점 터미널", number: 7}
    - {name: "되돌아가는 길", line: "경적을", number: 1}
    - {name: "정확히 7분", line: "세 번", number: 9}
    - {name: "같은 곳, 세 번", line: "울려라", number: 2}
  # 목적지 수수께끼: 노선에서 그 정류장만 가진 특성이면 이 말, 아니면 이름을 거꾸로 (reversed)
  riddles:
    sea: 갈매기가 우는 곳
    mountain: 다람쥐가 넘는 고개
    field: 허수아비가 지키는 들판
    forest: 도토리가 떨어지는 숲
    village: 느티나무 그늘 아래
    port: 등대 불빛이 닿는 곳
    reversed: "'{name}'"
  talk:
    mission1: ["말은 독이지. 내릴 때까지 한 마디도 하지 말게. {riddle}.", "쉿. {riddle}. 조용히."]
    mission2: ["아무도 태우지 말게. {riddle}.", "오늘 이 버스엔 나뿐이야. {riddle}."]
    mission3: ["왔던 길로… 두 정거장.", "뒤를 돌아보게. 두 정거장."]
    mission4: ["7분. {riddle}.", "{riddle}. 7분."]
    mission5: ["{a}, {b}, 그리고 다시 {a}.", "{a}. {b}. {a}. 순서대로."]
    step: ["…", "흠."]
    early: ["아직.", "…서두르지 말게."]
    success: ["…좋아.", "자네, 괜찮군.", "…수고했네."]
    fail: ["…다음에 보지."]
    final-board: ["…기다렸네. 가지. 목적지는 묻지 말고.", "드디어군. 출발하게."]
    final-coord: ["…{coord}. 거기로."]
    final-repeat: ["…{coord}.", "{coord}. 잊지 말게."]
    final-timeout: ["…시간이 다 됐군."]
    final-case: ["가방을 열어 보게. 번호는… 자네가 이미 알고 있을 텐데."]
    final-wrong: ["…실망이군."]
    final-done: ["자네, 쓸모 있군."]
    weekly: ["이걸 {stop}까지. 흔들리면 곤란해.", "{stop}. 조심히."]

# 손님 종류: weight 비율, fare 운임 배수, mood 감점 배수, slow 타고 내리는 시간 배수,
# far 먼 곳만 감(블록), tip-mood 이 기분 아래면 팁 없음, rush 출퇴근 시간 가중치 배수, late 늦으면 기분 감점(분당)
# tags: 정류장 특성별 비율 배수 (여러 특성이면 가장 큰 것), hours: [from, to] 이 시간(한국 시각)에만 나옴,
# weekend: 주말 비율 배수, market: 장날 비율 배수, luggage: 보따리 수하물 운임 (G), pair: 둘이 같이 타고 내림,
# wander: 엉뚱한 정류장에서 내릴 확률, turn: 급회전 감점 배수, to-end: 가는 쪽 끝 정류장으로만, doze: 졸 확률 (기본 0.15)
# gifts: 선물 (아이템 키, 개수), talk: 말풍선 대사 (없는 상황은 default 대사)
