# 마을버스 (README "마을버스", docs/plans/마을버스_승객운송_기획안.md)
# 국도 위 정류장에서 주민 손님(마네킹)을 태워 다른 정류장에 내려 주면 운임을 받음.

# 버스로 치는 탈것 (코어 아이템 키)
# 버스는 타는 사람 수로 나뉨: 소형 버스 (손님 4) · 마을버스 (손님 8) · 리무진 관광버스 (손님 16)
vehicles: [stsv:mini_bus, stsv:village_bus, stsv:limousine_bus]
# 버스 종류별 규칙 (없는 버스는 모든 손님): min-road 이 도로 거리(블록) 넘는 손님만, only 이 손님 종류만, fare 운임 배수
buses: {}
# 버스 렌트 (/버스 렌트): 정류장 근처에서 서버의 소형 버스를 빌림 · 운임의 share 만 기사 몫 (나머지는 수수료)
# 시간 제한 없음 · /버스 반납 또는 내린 뒤 return-after 초가 지나면 반납
rental:
  vehicle: stsv:mini_bus
  share: 0.4
  return-after: 60
  range: 20

fare:
  base: 100            # 운임 = base + 도로 거리(블록) × per-block, 손님 종류 · 기분 배수
  per-block: 0.4
  # 정해진 시간 = 도로 거리 ÷ on-time-speed + on-time-grace 초. 그 안에 내려 주면 팁 (운임 × tip)
  on-time-speed: 6
  on-time-grace: 30
  tip: 0.15
  # 기분 배수: 기분이 이 값 이상이면 이 배수 (위에서부터)
  mood:
    - {at: 90, factor: 1.2}
    - {at: 70, factor: 1.0}
    - {at: 40, factor: 0.8}
    - {at: 0, factor: 0.5}
  # 하루 받는 운임 곡선 (사람마다, 05시 초기화): 오늘 받은 운임이 upto 까지는 rate (-1 = 끝까지).
  # 지금은 상한 없음 (언제나 100%). 다시 걸려면 예: [{upto: 100000, rate: 1.0}, {upto: -1, rate: 0.5}]
  daily:
    - {upto: -1, rate: 1.0}
  # 같은 두 정류장 사이를 repeat-window 분 안에 repeat-free 번 넘게 오가면 그 구간 손님 가중치 × repeat-factor
  repeat-window: 30
  repeat-free: 2
  repeat-factor: 0.5

mood:
  start: 80
  jolt: -5             # 급정거: jolt-from 블록/초 넘게 달리다 jolt-window 틱 안에 멈춤 (멀리서 천천히 세우면 괜찮음)
  jolt-from: 6
  jolt-window: 30
  bump: -10            # 부딪힘
  turn: -3             # 급회전 (turn-speed 블록/초 넘게 달리며 한 틱에 turn-degrees 도 넘게 꺾음)
  turn-speed: 6
  turn-degrees: 3
  smooth-stop: 2       # 정류장에 부드럽게 섬
  cooldown: 20         # 같은 감점은 이 틱 안에 한 번만

stops:
  waiting-max: 6       # 정류장마다 기다리는 손님 최대 (자동 정류장은 이 값, 관리자 정류장은 설치할 때 크기와 이 값 중 큰 쪽)
  refill-minutes: 2    # 손님 한 명이 새로 차오르는 데 걸리는 분 (시간대 배수로 나눔)
  # 시간대 배수 (한국 시각, from 시 ~ to 시 전)
  hours:
    - {from: 7, to: 9, factor: 2.0}
    - {from: 17, to: 19, factor: 2.0}
    - {from: 1, to: 6, factor: 0.5}
  show-range: 64       # 버스가 이만큼 안에 오면 손님이 정류장에 나타남
  hide-after: 30       # 버스가 떠나고 이 초가 지나면 손님 정리
  board-ticks: 10      # 한 명 타고 내리는 데 걸리는 틱 (할머니는 slow 배)
  # 자동 정류장 (/관리자 정류장 자동): 국도 길 점을 따라
  auto:
    start-skip: 60     # 출발 터미널 출구 직진 구간 (터미널 마당에서 떨어지게)
    end-before: [40, 60]   # 하역장 입구 앞 이 사이 칸
    every: 700         # 그 사이 이만큼마다 (7천 칸 길에 10곳쯤)
    apart: 250         # 다른 정류장과 이만큼은 떨어짐
    junction-clear: 150   # 갈림길 앞뒤 금지 구간
  bay:
    length: 24         # 버스 베이 길이 (비탈 6 · 서는 곳 12 · 비탈 6)
    width: 3           # 갓길 바깥으로 더 포장하는 폭
    stop-reach: 7      # 베이 가운데에서 이만큼 안에 서야 문이 열림

# 정류장 특성: 지을 때 주변을 보고 자동으로 붙음 (표지판에 이름). 손님 종류마다 특성별 비율 (types.*.tags)
#   mountain 산 (산 바이옴 · 높은 곳), sea 바다 (물이 많거나 바다 · 강 · 해변), field 들판 (평원 · 사바나),
#   forest 숲, village 마을 (근처 플레이어 땅), port 항구 (하역장 300칸 안)
tags:
  mountain: 산
  sea: 바다
  field: 들판
  forest: 숲
  village: 마을
  port: 항구

# 자동 정류장 이름: 정류장 특성에 맞는 이름에서 아직 안 쓴 것을 하나 고름 (특성이 없거나 다 쓰면 any).
# 하역장 입구 앞 정류장은 "<하역장> 앞" 그대로. /관리자 정류장 이름짓기 로 이미 있는 자동 정류장 이름도 바꿈
names:
  mountain: [다람쥐 고개, 솔방울 쉼터, 산딸기 오솔길, 메아리 언덕, 부엉이 고개, 약수터 앞, 구름 고개, 단풍 쉼터]
  sea: [갈매기 쉼터, 조개껍질 앞, 파도소리 정류장, 소라 마을, 모래알 해변, 꽃게 삼거리, 돌고래 쉼터, 바닷바람 언덕]
  field: [해바라기 들, 허수아비 앞, 민들레 들판, 보리밭 삼거리, 메뚜기 마을, 개구리 논둑, 고추잠자리 들, 원두막 앞]
  forest: [도토리 숲길, 딱따구리 쉼터, 버섯 마을, 반딧불 숲, 산토끼 오솔길, 솔바람 숲, 다람쥐 숲길]
  village: [느티나무 아래, 구멍가게 앞, 빨래터 앞, 평상 마을, 강아지 골목, 장독대 앞, 우물가 앞, 꽃밭 마을]
  port: [등대 앞, 뱃고동 정류장, 그물 마을, 어부네 앞, 닻 삼거리]
  any: [토끼풀 마을, 몽글몽글 언덕, 콩닥콩닥 정류장, 노을 쉼터, 무지개 삼거리, 별빛 정거장, 고양이 쉼터, 꽃잎 마을,
        달팽이 앞, 솜사탕 언덕, 고구마 마을, 참새 방앗간, 햇살 쉼터, 오리 연못, 복숭아 마을, 감나무 아래, 호박 마을, 몽실 언덕]

# 5일장: every 일마다, 이 특성 정류장에 장이 섬 (types.*.market 배수, 보따리 손님)
market:
  every: 5
  tags: [field, village]
# 소풍날: 하루에 정류장 한 곳에 학생 단체가 기다림 (한국 시각 from ~ to 시). 4명씩 팀 (events.picnic 에서 더 정함)
picnic:
  from: 9
  to: 12
  students: 12
# 환승: 노선 2개 넘게 지나는 정류장에서 내린 손님이 이 확률로 다른 노선 버스를 기다림 (탈 때 "환승입니다", 운임 +transfer-bonus)
transfer: 0.25
transfer-bonus: 0.2
# 졸음: 탄 지 after 초가 지나면 types.*.doze 확률로 졺 (머리 까딱 · Zzz). 조는 손님은 내릴 곳에서 miss 확률로 깨지 못하고 지나침
doze:
  after: 90
  miss: 0.4
# 지나친 정류장: 내릴 곳을 passed 칸 넘게 지나치면 "여기서 내려요!" 기분 missed-mood, 다음 정류장에서 내림
passed: 15
missed-mood: -10
# 비 오는 날 팁 배수 더하기, 눈 오는 날 급정거 감점 배수
rain-tip: 0.2
snow-jolt: 0.5
# 말풍선: 버스마다 이 틱에 한 번까지 (기사 32칸 안에서만 보임)
talk-cooldown: 60
# 선물: types.*.gifts 가 있는 손님이 기분 gift-mood 넘게 내리면 gift-chance 확률로 하나를 줌
gift-chance: 0.35
gift-mood: 90

# 줄 서기 · 기다리는 동작: 손님은 온 순서대로 줄을 섬 (맨 앞 = 버스 문 쪽, 베이와 대기소 사이에 gap 칸 간격 · 비 오면 지붕 밑),
# 버스가 notice 칸 안에 오면 다 같이 버스를 봄. 그 전에는 idle-every 틱마다 종류별 동작 (idle: 손님 종류 -> 동작):
#   sit 의자에 앉음 (앉은 자리는 줄 순서 그대로) · phone 고개 숙여 폰 · fidget 길 쪽을 힐끔, 몸을 들썩, 시계 봄 · hop 콩콩 뜀
#   (없는 종류는 가끔 두리번)
queue:
  gap: 0.8
  notice: 24
  idle-every: 30
  idle: {grandma: sit, haenyeo: sit, student: phone, nurse: phone, couple: phone, office: fidget, courier: fidget, kinder: hop,
         mom: sit, youtuber: phone, rider: fidget, chatty: fidget}
# 기다림 짜증: grace 분 넘게 기다린 손님은 탈 때 기분이 낮음 (full 분이면 floor 까지, 사이는 고르게; 원래는 mood.start).
# every 초마다 give-up 분 넘게 기다린 손님 가운데 가장 오래 기다린 한 명이 give-up-chance 확률로 걸어감 (talk give-up)
patience:
  grace: 3
  full: 15
  floor: 55
  give-up: 20
  give-up-chance: 0.25
  every: 20
# 버스 도착 안내판 (표지판: 노선마다 이쪽으로 오는 가장 가까운 버스 · 약 몇 분 (도로 거리 ÷ fare.on-time-speed) · 기사) 과
# 노선도 판 (대기소 뒷벽: 지나는 노선의 정류장 차례, 이 정류장 앞뒤 around 곳씩). refresh 초마다, 불러와진 정류장만
board:
  refresh: 3
  lines: 4
  around: 2

# ───────────────────────────────────────────────────────────────────────────────
# 이벤트 (README "마을버스" 이벤트). 보상은 모두 팀 · 운행 · 정류장 · 솜씨마다 고정 (손님 머릿수로 늘지 않음:
# 소형 버스든 리무진이든 똑같이 벎). 시간은 한국 시각. 렌트 버스는 이벤트 보상도 rental.share 만 내 몫.
events:
  # 단체 손님: 이벤트 손님은 size 명씩 팀 (한 팀은 한 정류장으로 감, 이름표 밑에 "단체 1팀" 같은 색).
  # 버스 한 대는 이벤트 팀을 한 번에 한 팀만 태움 (남는 자리는 보통 손님). 팀이 다 같이 탈 자리가 있어야 탐.
  # 팀 전원을 목적지에 내려 주면 bonus G (운임과 따로), 모두 정해진 시간 안이면 on-time G 더
  team:
    size: 4
    bonus: 800
    on-time: 400
    colors: ["#ffd166", "#7cc4ff", "#ff9ec8", "#9fd36b", "#c59bff", "#ff8a5c"]
  # 출근 대란: 평일(times; 주말 weekend-times) from ~ to 시 사이 한 번, 마을(tags) 정류장에 회사원 count 명 (팀마다 노선 앞쪽
  # 다른 목적지). deadline 시까지 내려 주면 팀 보너스, 늦은 팀은 보너스 없음 · 탄 손님 기분 late-mood
  rush:
    enabled: true
    type: office
    from: 7
    to: 8
    deadline: 9
    count: 12
    tags: [village]
    times: 1
    weekend-times: 0
    bonus: 1000
    on-time: 500
    late-mood: -15
    talk:
      board: ["9시까지 꼭이요!", "기사님 부탁드려요, 지각하면 큰일나요!", "출근 출근!"]
      cheer: ["시계 좀 봐… 아직 괜찮아", "팀장님보다 먼저 가야 돼"]
  # 야구 끝: 하루 times 번 (주말 weekend-times 번) from ~ to 시 사이, 마을 · 항구 정류장에 야구팬 count 명 (팀마다 목적지).
  # win-chance 로 이긴 날 (팀 보너스 × win-bonus, 탈 때 기분 + win-mood), 아니면 진 날 (기분 감점 × lose-mood)
  ballgame:
    enabled: true
    type: fan
    from: 12
    to: 23
    count: [8, 12]
    tags: [village, port]
    times: 1
    weekend-times: 2
    win-chance: 0.5
    win-bonus: 1.5
    win-mood: 10
    lose-mood: 1.5
    talk:
      win: ["이겼다! 최강!", "오늘 끝내기 홈런 봤어요?!", "기사님 오늘 기분 최고예요!"]
      lose: ["하… 9회에 뒤집히다니", "내일은 이긴다…", "말 걸지 마세요…"]
      cheer: ["♪ 오오오~ 승리를 위하여~", "♪ 안타 안타 쳐줘요~", "최강! 최강!"]
  # 소풍날 (위 picnic 의 from · to · students 를 그대로 씀): 하루 한 번, 학생 단체 (alt-chance 로 유치원생 소풍)
  picnic:
    enabled: true
    type: student
    alt: kinder
    alt-chance: 0.3
    talk:
      board: ["소풍 간다~!", "선생님 저 창가요!"]
      cheer: ["♪ 리리리 자로 끝나는 말은~", "김밥 언제 먹어요?"]
  # 특급 손님: 정류장에 손님이 새로 올 때 chance 확률로 한 명 (서버에 한 번에 max 명까지, 버스마다 한 번에 한 명).
  # 금색 이름. 성공하면 bonus G (운임과 따로) · 전체 공지. time: 정해진 시간 × 이 배수 안에 (0 = 제한 없음),
  # min-mood: 내릴 때 기분 이상, hit: 급정거 · 부딪힘마다 보너스에서 뺌, fail-fare: 실패하면 운임 배수, min-road: 이만큼 넘게 가는 곳만
  special:
    enabled: true
    chance: 0.02
    max: 3
    kinds:
      patient:
        name: 응급 환자
        type: resident
        weight: 1
        bonus: 3000
        time: 0.7
        hit: 500
        min-road: 300
        talk: ["으윽… 병원으로 빨리요…", "기사님, 살살… 빨리요…"]
      celebrity:
        name: 연예인
        type: vip
        weight: 1
        bonus: 4000
        min-mood: 90
        min-road: 300
        talk: ["쉿, 저 알아보셔도 모른 척해 주세요~", "편하게 가고 싶어요"]
      examinee:
        name: 수험생
        type: student
        weight: 1
        bonus: 2000
        time: 1.0
        fail-fare: 0
        min-road: 300
        talk: ["시험 늦으면 안 돼요!", "수험표… 수험표 챙겼지?"]
  # 외딴 정류장 구조: 손님이 기다리는데 버스가 after 분 넘게 안 온 정류장 (가장 오래된 한 곳) 표지판에 "기다리다 지친 손님!" · 공지.
  # 처음 와서 손님을 태운 버스에 base + per-minute × 분 (최대 cap) G
  rescue:
    enabled: true
    after: 15
    base: 500
    per-minute: 50
    cap: 2500
  # 안전 운행 연속: 급정거 · 부딪힘 없이 손님이 타거나 내린 정류장 수 (같은 정류장 연달아는 한 번). every 곳마다
  # base G, 다음엔 step 씩 더 (최대 cap). 급정거 · 부딪힘이면 0으로
  streak:
    enabled: true
    every: 5
    base: 300
    step: 100
    cap: 1000
  # 노선 완주: 한 노선을 한 방향으로 첫 정류장부터 끝 정류장까지 하나도 빼지 않고 차례로 서면 정류장 수 × per-stop G (min-stops 곳 넘게, 최대 cap)
  course:
    enabled: true
    min-stops: 4
    per-stop: 150
    cap: 3000
  # 분실물: 손님이 내린 정류장에서 chance 확률로 (한 정류장에 하나까지) 물건을 두고 내림 → 기사 인벤토리로.
  # expire 분 안에 그 정류장 베이에 서면 자동으로 돌려주고 reward G. 지나면 쓸모없음. 한 사람이 max-held 개까지. 팔 수 없음
  lost:
    enabled: true
    chance: 0.06
    expire: 30
    reward: 600
    max-held: 2
    things:
      - {name: 지갑, item: minecraft:leather}
