# 최근 30번 쓴 원인은 다시 뽑지 않고, 같은 회사에 같은 머리말이 연달아 붙지 않습니다. 실적 발표도 같은 문구를 씁니다.
# {company} 는 회사 이름, 문구는 얼마든지 더하고 고쳐도 됩니다 (/관리자 리로드).

