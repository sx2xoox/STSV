# 인물 도감 (README "인물 도감", /도감 인물 또는 /도감 화면의 [인물 도감] 단추)
# 인물 한 명 = 한 칸. 지금은 마을버스 손님 종류(bus.yml types) 하나가 인물 하나: 이름 · 색 · 얼굴(스킨) · 언제 어디서 오는지는
# bus.yml 에서 읽고, 여기에는 소개 글과 도감 규칙만 둠. bus.yml 에서 weight 0 인 종류(??? 처럼 숨은 비밀로만 오는 사람)와
# never 의 사람은 도감에 나오지 않음.
# 만남: 버스로 목적지까지 태워 줌 (공정 운행: 그 길을 버스가 다 몰고 왔을 때만; 커플 · 신혼부부 · 유치원생 둘은 한 번).
# 칸마다 사람별로: 만난 횟수 · 처음 만난 날 · 보통 모습 등록 · 별난 모습 등록 (bus.yml shiny) · 만난 곳 도장 (places).
# 안 만난 칸은 "???" 그림자와 어디서 만날지 귀띔 (정류장 특성 · 시간대 · 달 · 주말 · 장날; hint 로 직접 쓸 수도 있음).
# milestones: 만난 횟수가 이만큼이 될 때마다 intro 가 한 줄씩 열림 (그래서 intro 는 milestones 수만큼).
# titles: all = 모든 인물의 보통 모습, shiny = 모든 인물의 별난 모습 (이때만 서버 전체에 짧은 알림)
milestones: [1, 10, 50]
never: [shades]
titles:
  all: economy:people_all
  shiny: economy:people_shiny_all
# 만난 곳 도장 (id: 이름). 나중에 식당 · 의뢰 · 잔치 같은 곳이 생기면 여기에 더함
places:
  bus: 버스
people:
  resident:
    intro: ["이 동네 토박이. 아무 정류장에서나 버스를 기다린다.", "장바구니에는 늘 대파가 꽂혀 있다. 단골 가게가 다섯 곳.", "사실 버스 기사 이름을 다 외우고 있다. 당신 이름도."]
  student:
    intro: ["등하교 시간이면 정류장이 시끌벅적해진다.", "버스 카드에 붙인 스티커는 매주 바뀐다.", "장래 희망 칸에 '버스 기사'라고 쓴 적이 있다. 비밀이다."]
  grandma:
    intro: ["장날이면 보따리를 이고 버스를 기다리는 할머니.", "버스에 타면 꼭 기사에게 밥은 먹었냐고 묻는다.", "주머니엔 늘 사탕이 있다. 기사님 몫으로 하나 더."]
  office:
    intro: ["커피 한 잔과 함께 출퇴근하는 회사원.", "버스에서 메일 답장을 다 쓴다. 오타는 많다.", "언젠가 이 동네에 작은 카페를 여는 게 꿈이다."]
  tourist:
    intro: ["바다와 산을 찾아온 여행자. 먼 곳으로만 간다.", "사진첩의 절반은 정류장 표지판 사진이다.", "이 마을이 좋아서 세 번째 다시 왔다."]
  vip:
    intro: ["어쩌다 시골 버스를 탄 높으신 분.", "투덜대지만 버스를 탈 때마다 몰래 웃는다.", "어릴 적 이 마을에서 자랐다. 아무에게도 말하지 않았다."]
  farmer:
    intro: ["들판 정류장의 단골. 수하물은 늘 채소.", "날씨는 하늘만 봐도 안다. 대부분 맞는다.", "제일 좋은 고구마는 기사님 몫으로 따로 둔다."]
  hiker:
    intro: ["산 정류장에서 새벽부터 기다리는 등산객.", "등산화 끈은 꼭 두 번 묶는다.", "백 개의 봉우리에 올랐다. 다음 목표는 이 동네 뒷산 전부."]
  fisher:
    intro: ["바다와 항구를 오가는 낚시꾼.", "놓친 물고기는 매번 조금씩 커진다.", "진짜 대어를 낚으면 기사님께 회 한 접시를 약속했다."]
  soldier:
    intro: ["주말이면 휴가 나와 종점까지 가는 군인.", "버스 창밖을 보며 집 생각에 잠긴다.", "전역하는 날도 이 버스를 탈 거라고 했다."]
  couple:
    intro: ["늘 둘이 함께 타고 같이 내리는 커플.", "자리가 하나면 서로 앉으라고 한참 실랑이한다.", "언젠가 결혼식 날도 이 버스로 가고 싶다고 했다."]
  drunk:
    intro: ["밤늦게 비틀거리며 버스를 타는 아저씨.", "가끔 엉뚱한 정류장에서 내리지만 늘 집은 잘 찾아간다.", "사실 술이 약하다. 한 잔이면 이렇게 된다."]
  courier:
    intro: ["마을 곳곳에 택배를 나르는 기사.", "택배 상자 모서리만 봐도 무게를 안다.", "명절엔 하루에 삼백 집을 돈다. 버스는 유일한 휴식."]
  kinder:
    intro: ["선생님 손을 잡고 둘이서 타는 유치원생.", "버스 벨을 누르는 게 제일 큰 소원이다.", "커서 버스 기사가 되겠다고 매일 말한다."]
  camper:
    intro: ["주말에 숲과 바다로 떠나는 캠핑족.", "배낭 안에는 의자 두 개와 마시멜로가 있다.", "별이 제일 잘 보이는 자리를 알고 있다. 기사님께만 알려 준다."]
  haenyeo:
    intro: ["바다 정류장의 해녀. 물질 가는 길이다.", "숨을 2분 넘게 참는다. 버스가 늦어도 끄떡없다.", "물속에서 본 것들을 이야기해 주면 시간 가는 줄 모른다."]
  fan:
    intro: ["경기 날이면 유니폼 입고 타는 야구팬.", "이긴 날과 진 날의 표정이 완전히 다르다.", "응원가 가사를 다 외운다. 상대 팀 것도."]
  nurse:
    intro: ["아침 일찍 병원으로 가는 간호사.", "버스에서 조는 게 하루 중 유일한 잠이다.", "환자들은 이 간호사가 오면 이상하게 덜 아프다고 한다."]
  chatty:
    intro: ["타자마자 이야기를 시작하는 수다쟁이 아줌마.", "동네 소식은 이 분이 제일 빠르다.", "가끔 기사님 칭찬도 동네방네 퍼뜨린다."]
  motionsick:
    intro: ["버스만 타면 얼굴이 하얘지는 아저씨.", "부드럽게 몰아 주면 진심으로 고마워한다.", "멀미약을 늘 두 개 챙긴다. 하나는 옆 사람 몫."]
  mom:
    intro: ["아기를 업고 타는 엄마.", "아기가 울면 버스 안이 다 조용해진다.", "아기의 첫 단어가 '빵빵'이었다고 한다."]
  dogwalker:
    intro: ["강아지 바둑이와 함께 타는 할아버지.", "바둑이는 버스에서 짖지 않는다. 거의.", "할머니가 살아 계실 적엔 셋이 같이 탔다."]
  santa:
    intro: ["12월에만 나타나는 산타 할아버지.", "선물 보따리 안이 늘 꽉 차 있다. 어떻게?", "썰매가 고장 나서 버스를 탄다는 소문이 있다."]
  ghost:
    intro: ["새벽 두 시에서 네 시 사이에만 보이는 손님.", "운임은 이상한 조각으로 낸다.", "오래전에 놓친 마지막 버스를 아직 기다리는지도 모른다."]
  rider:
    intro: ["시간에 쫓기는 배달 라이더.", "늦으면 화를 내지만 제시간이면 팁이 두둑하다.", "헬멧 안쪽에 가족사진을 붙여 두었다."]
  monk:
    intro: ["산 정류장에서만 만날 수 있는 스님.", "흔들려도 화내는 법이 없다.", "내리며 빌어 준 복은 다음 손님에게 닿는다고 한다."]
  youtuber:
    intro: ["버스 안에서도 카메라를 켜는 유튜버.", "기분 좋게 내리면 별 다섯 개 리뷰를 남긴다.", "구독자는 아직 87명. 그중 하나가 기사님이면 좋겠단다."]
  market:
    intro: ["장날이면 보따리를 들고 타는 시장 아줌마.", "나물 다듬는 손이 버스에서도 쉬지 않는다.", "기분 좋은 날엔 떡이나 나물을 한 줌 쥐여 준다."]
  uncle:
    intro: ["기사에게 동네 소식을 전하는 아저씨.", "평상에 앉아 있으면 동네 사람이 다 지나간다.", "젊을 적엔 이 길을 자전거로 넘나들었다."]
  univ:
    intro: ["이어폰을 끼고 꾸벅꾸벅 조는 대학생.", "과제 마감은 늘 버스 안에서 시작된다.", "졸업하면 이 동네에 남을지 고민 중이다."]
  worker:
    intro: ["새벽과 저녁에 타는 공사장 인부.", "옷의 흙먼지를 털고 타는 걸 잊지 않는다.", "이 동네 다리 몇 개는 이 분 손으로 놓였다."]
  kid:
