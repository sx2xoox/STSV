  chicken:
    intro: ["닭을 품에 안고 타는 할머니.", "급정거하면 닭이 날아오른다. 꼬꼬댁!", "닭 이름은 '꼬순이'. 달걀을 매일 하나씩 낳는다."]
  tardy:
    intro: ["늘 뛰어와서 '기사님 빨리요!' 하는 지각생.", "알람을 다섯 개 맞춰도 늦는다.", "제시간에 도착한 날은 일기에 쓴다."]
  interview:
    intro: ["면접 보러 가며 자기소개를 연습하는 청년.", "부드럽게 몰면 말이 술술 풀린다.", "합격하면 첫 월급으로 기사님께 음료를 사 주겠단다."]
  yeot:
    intro: ["가위 소리와 함께 타는 엿장수.", "가위 장단을 들으면 옆 사람 기분이 좋아진다.", "엿 가락 하나로 동네 아이들을 다 웃긴다."]
  traveler:
    intro: ["서툰 한국말로 길을 묻는 외국인 여행객.", "가끔 엉뚱한 곳에 내리지만 그것도 여행이란다.", "고향 친구들에게 이 버스를 자랑하는 엽서를 썼다."]
  phone:
    intro: ["버스 안에서 쩌렁쩌렁 통화하는 남자.", "통화 상대는 대부분 어머니다.", "목소리가 커서 그렇지, 하는 말은 다 다정하다."]
  rude:
    intro: ["반말부터 하는 막무가내 아저씨.", "운전이 마음에 안 들면 운임을 깎는다.", "사실 칭찬에 약하다. 아주 많이."]
  dodger:
    intro: ["가끔 뒷문으로 슬쩍 내리는 얌체 청년.", "들키면 머리를 긁적이며 웃는다.", "언젠가 밀린 운임을 다 내겠다고 다짐했다. 언젠가."]
  prankster:
    intro: ["벨만 누르고 안 내리는 장난꾸러기 꼬마.", "장난을 치고 나면 꼭 기사님 눈치를 본다.", "제일 친한 친구가 버스 벨이라고 한다."]
  spread:
