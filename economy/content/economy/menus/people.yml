# /도감 인물: 인물 도감 (people.yml). 가운데 = 인물 한 명에 한 칸 (버스 손님 종류마다). 안 만난 사람은 ??? 그림자와 만날 곳 귀띔.
# 일반 인물 · 별난 인물은 따로 모으는 두 도감 (탭). 위 오른쪽 S = 탭 바꾸기 (이름 · 설명은 messages.yml people.switch-*), 아래 = 물건 도감으로
# 자리표시자: {have} 일반 인물 수 · {shiny} 별난 인물 수 · {all} 인물 수 · {tab} 지금 탭 이름 · {tab_have} 지금 탭의 수
people:
  title: "<#f0e2b0>인물 도감 <#b9a6d6>· {tab} <#b9a6d6>{tab_have}/{all}"
  rows: 6
  background: economy:gui/people
  layout:
    - "I.......S"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "P.X...M.N"
  list: L
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<white>인물 도감 <gray>{have}/{all} <#ffe08a>✦{shiny}/{all}"
    S:
      action: "people:shiny"
      material: AMETHYST_SHARD
      name: "<#ffe08a>✦ 별난 인물 보기"
      lore: ["<gray>일반 인물 · 별난 인물 탭 바꾸기"]
    M:
      action: "people:items"
      material: CHEST
      name: "<yellow>물건 도감으로"
      lore: ["<gray>상점에 파는 물건 도감"]
    P:
      action: page:prev
      icon: stsv:gui/prev
      material: ARROW
      name: "<yellow>◀ 이전 페이지"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/prev_off, material: GRAY_DYE, name: "<dark_gray>◀ 첫 페이지" }
    N:
      action: page:next
      icon: stsv:gui/next
      material: ARROW
      name: "<yellow>다음 페이지 ▶"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/next_off, material: GRAY_DYE, name: "<dark_gray>마지막 페이지 ▶" }
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
