# 직업 기계 창. 칸 위치는 플러그인 고정: 줄 k(0~4) = 재료 9(k+1)+1~3, 상태 9(k+1)+5, 결과 9(k+1)+7 (5번째 줄은 4강).
# 위: 레시피 목록(0), 결과 전부 받기(2), 기계 정보(4), 닫기(6), 강화(8). 여기서는 제목·배경·버튼 모양만
machine:
  title: "<#f0e2b0>{machine}"
  rows: 6
  background: economy:gui/machine
  # 그림 생성기용: 이 글자 칸은 버튼이 아니라 물건 칸 모양으로 그림, flow = 줄 사이 빈칸에 화살표
  inset: "IO"
  flow: true
  layout:
    - "R.C.N.X.U"
    - ".III.S.O."
    - ".III.S.O."
    - ".III.S.O."
    - ".III.S.O."
    - ".III.S.O."
  buttons:
    R: { action: "", material: AIR, name: " " }
    N: { action: "", material: AIR, name: " " }
    U: { action: "", material: AIR, name: " " }
    S: { action: "", material: AIR, name: " " }
    C: { action: "", material: AIR, name: " " }
    X: { action: "", material: AIR, name: " " }
    I: { action: "", material: AIR, name: " " }
    O: { action: "", material: AIR, name: " " }

# 기계 레시피 목록: 줄의 상태 칸을 누르면 열림. 클릭 = 그 줄에 고정, 맨 앞 '자동' = 넣은 재료로 알아서.
# 위 탭 = 강화 단계(기본·1강·2강·3강·4강): 그 단계에서 새로 열리는 레시피만 보임. 한 화면 36칸, 넘치면 ◀ ▶
machine_recipes:
  title: "<#f0e2b0>{machine} 레시피 <#b9a6d6>· {tab}{lane_text}"
  rows: 6
  background: economy:gui/machine_recipes
  layout:
    - "0.1.2.3.4"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "P..BIX..N"
  list: L
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<white>{machine} · {tier}"
      lore: ["{pick_hint}", "<gray>잠긴 레시피는 강화로 열림", "<dark_gray>시간: 이 기계·내 직업 기준"]
    "0": { action: "machine:tab:0", material: COPPER_INGOT, name: "<white>기본 레시피" }
    "1": { action: "machine:tab:1", material: IRON_INGOT, name: "<white>1강 레시피" }
    "2": { action: "machine:tab:2", material: GOLD_INGOT, name: "<white>2강 레시피" }
    "3": { action: "machine:tab:3", material: DIAMOND, name: "<white>3강 레시피" }
    "4": { action: "machine:tab:4", material: NETHERITE_INGOT, name: "<white>4강 레시피" }
    B:
      action: "machine:back"
      icon: economy:gui/back
      material: ARROW
      name: "<white>기계로 돌아가기"
    P:
      action: page:prev
      icon: stsv:gui/prev
      material: ARROW
      name: "<yellow>◀ 이전 페이지"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/prev_off, material: GRAY_DYE, name: "<dark_gray>◀ 첫 페이지" }
    N:
      action: page:next
      icon: stsv:gui/next
      material: ARROW
      name: "<yellow>다음 페이지 ▶"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/next_off, material: GRAY_DYE, name: "<dark_gray>마지막 페이지 ▶" }
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
