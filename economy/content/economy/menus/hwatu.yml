# 도박장 칩 창 (/화투방 칩 · 도박장 환전 창구의 현장 소장 우클릭, README "도박장", 수치는 hwatu.yml). 배경은 우편함 것을 그대로 씀
# 위 = 내 칩, 가운데 = 전적 · 도박장으로, 아래 = 칩 사기 · 바꾸기. 판은 도박장 테이블에 앉아서 함 (이 창에는 없음)
# 자리표시자: {chips} {chips_gold} {bought} {buy_left} {daily_buy} {net} {loss_cap} {buy_price} {cash_price} {rake} {hours} {turn} {balance}
#            {rest} (쉬어 가기 한 줄: 한도가 0 이면 "제한 없음" 문구) {age} (계정 나이 한 줄: 0 이면 "새 계정도 바로") — 문구는 messages.yml hwatu.rest-* · age-*
hwatu:
  title: "<#f0e2b0>도박장 <#b9a6d6>· 칩 {chips}"
  rows: 6
  background: economy:gui/mail
  layout:
    - "....I...."
    - "........."
    - "..H...W.."
    - "........."
    - "bcd...efg"
    - "R..M.X..Q"
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: GOLD_NUGGET
      name: "<white>내 칩 <#e8c15a>{chips}칩"
      lore:
        - "<gray>바꾸면 {chips_gold} <dark_gray>(1칩 = {cash_price} G)"
        - "<gray>오늘 산 칩 <white>{bought}</white> / {daily_buy} <dark_gray>· 오늘 {net}칩"
        - "<gray>잔액 {balance}"
        - ""
        - "<gray>칩은 골드로만 사고 골드로만 바꿔요."
        - "<dark_gray>아이템이 아니라 계정에 쌓이는 숫자 (잃어버릴 일 없음)"
    H:
      action: "hwatu:record"
      icon: economy:gui/ledger
      material: PAPER
      name: "<white>내 전적 <dark_gray>(최근 8판)"
    W:
      action: "hwatu:hall"
      icon: stsv:gui/info
      material: OAK_DOOR
      name: "<#e8c15a>도박장으로"
      lore: ["<gray>테이블 의자에 앉으면 그 판에 앉아요", "<dark_gray>/화투방"]
    b:
      action: "hwatu:buy:10"
      icon: economy:gui/buy_1
      material: GOLD_NUGGET
      name: "<green>칩 10개 사기"
      lore: ["<gray>1칩 = {buy_price} G", "<dark_gray>오늘 더 살 수 있는 칩 {buy_left}", "<dark_gray>정확히: /화투방 사기 <칩>"]
    c:
      action: "hwatu:buy:100"
      icon: economy:gui/buy_10
      material: GOLD_INGOT
      name: "<green>칩 100개 사기"
      lore: ["<gray>1칩 = {buy_price} G", "<dark_gray>오늘 더 살 수 있는 칩 {buy_left}"]
    d:
      action: "hwatu:buy:1000"
      icon: economy:gui/buy_100
      material: GOLD_BLOCK
      name: "<green>칩 1,000개 사기"
      lore: ["<gray>1칩 = {buy_price} G", "<dark_gray>오늘 더 살 수 있는 칩 {buy_left}"]
    e:
      action: "hwatu:cash:10"
      icon: economy:gui/sell_1
      material: IRON_NUGGET
      name: "<gold>칩 10개 바꾸기"
      lore: ["<gray>1칩 → {cash_price} G <dark_gray>(나머지는 사라짐)", "<dark_gray>정확히: /화투방 바꾸기 <칩|전부>"]
    f:
      action: "hwatu:cash:100"
      icon: economy:gui/sell_10
      material: IRON_INGOT
      name: "<gold>칩 100개 바꾸기"
      lore: ["<gray>1칩 → {cash_price} G <dark_gray>(나머지는 사라짐)"]
    g:
      action: "hwatu:cash:all"
      icon: economy:gui/sell_100
      material: IRON_BLOCK
      name: "<gold>칩 전부 바꾸기"
      lore: ["<gray>{chips}칩 → {chips_gold}", "<dark_gray>판에 건 칩은 판이 끝난 뒤"]
    R:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<white>도박장 규칙"
      lore:
        - "<gray>플레이어끼리만 겨뤄요 (서버는 상대하지 않음)"
        - "<gray>판마다 자릿세 <white>{rake}%</white>는 사라져요"
        - "<gray>내 차례 {turn}초: 넘기면 섯다는 낼 것이 있으면 다이, 없으면 콜"
        - "<gray>테이블 의자에 앉으면 그 판에 앉고, 일어나면 나감"
        - "<gray>판 도중에 일어나면 다이 (건 칩은 판에 남음)"
        - "<gray>차례를 놓치면 다음 판부터 쉬어요 (자리 앞 준비 버튼)"
        - "{age}"
    M:
      action: ""
      icon: economy:gui/ledger
      material: PAPER
      name: "<white>섯다 족보"
      lore:
        - "<gold>38광땡</gold> <gray>> 18광땡 > 13광땡"
        - "<gray>> 장땡(10) > 9땡 … 1땡"
        - "<gray>> 알리(1·2) > 독사(1·4) > 구삥(1·9) > 장삥(1·10)"
        - "<gray>> 장사(4·10) > 세륙(4·6) > 갑오(9끗) > … > 1끗 > 망통"
        - "<light_purple>땡잡이</light_purple> <gray>3광+7열끗: 1~9땡을 잡음 (아니면 망통)"
        - "<light_purple>암행어사</light_purple> <gray>4열끗+7열끗: 18·13광땡을 잡음 (아니면 1끗)"
        - "<light_purple>구사</light_purple> <gray>4·9: 남의 패가 알리 이하면 재경기 (아니면 3끗)"
        - "<light_purple>멍텅구리 구사</light_purple> <gray>4열끗+9열끗: 9땡 이하면 재경기"
        - "<dark_gray>같은 패는 나눠 가짐"
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
    Q:
      action: ""
      icon: stsv:gui/info
      material: CLOCK
      name: "<white>쉬어 가기"
      lore:
        - "{rest}"
        - "<gray>오늘 <white>{net}칩"
        - "<dark_gray>딴 칩 순위는 두지 않아요"
