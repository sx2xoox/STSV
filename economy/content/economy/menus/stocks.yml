# /주식: 위 = 산업 탭, 가운데 = 회사 (클릭하면 회사 화면), 아래 = 정렬·뉴스·도움말
stocks:
  title: "<#f0e2b0>주식 <#b9a6d6>· {tab} <#8f86a6>· {sort}"
  rows: 6
  background: economy:gui/stocks
  layout:
    - "ABCDEFGHM"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "P..SXI..Q"
  list: L
  buttons:
    A: { action: "stock:tab:all", icon: economy:gui/chart, material: PAPER, name: "<white>전체", lore: ["<gray>모든 회사 보기"] }
    B: { action: "stock:tab:mining", icon: economy:ruby, material: PAPER, name: "<#9fb4c8>광업", lore: ["<gray>광업 회사만 보기"] }
    C: { action: "stock:tab:agriculture", icon: economy:rice, material: PAPER, name: "<#8bc34a>농업", lore: ["<gray>농업 회사만 보기"] }
    D: { action: "stock:tab:fisheries", icon: economy:salmon_fillet, material: PAPER, name: "<#4fc3f7>수산", lore: ["<gray>수산 회사만 보기"] }
    E: { action: "stock:tab:steel", icon: economy:steel_ingot, material: PAPER, name: "<#ff8a65>철강", lore: ["<gray>철강 회사만 보기"] }
    F: { action: "stock:tab:food", icon: economy:kimchi, material: PAPER, name: "<#ffb74d>식품", lore: ["<gray>식품 회사만 보기"] }
    G: { action: "stock:tab:pharma", icon: economy:pearl_perfume, material: PAPER, name: "<#ba68c8>제약", lore: ["<gray>제약 회사만 보기"] }
    H:
      action: "stock:tab:mine"
      icon: economy:gui/bag
      material: PAPER
      name: "<aqua>내 주식"
      lore: ["<gray>평가액 <white>{value}", "<gray>손익 {pl}"]
    M:
      action: "stock:news"
      icon: economy:gui/ledger
      material: PAPER
      name: "<gold>최근 뉴스"
      lore: ["<gray>채팅으로 최근 뉴스 10개"]
    P: { action: "page:prev", icon: stsv:gui/prev, material: ARROW, name: "<yellow>◀ 이전 페이지", lore: ["<gray>{page} / {pages}"], off: { icon: stsv:gui/prev_off, material: GRAY_DYE, name: "<dark_gray>◀ 첫 페이지" } }
    X: { action: close, icon: stsv:gui/exit, material: OAK_DOOR, name: "<red>닫기" }
    # 정렬: 누를 때마다 산업순 → 오른 순 → 내린 순 → 많이 산 순 (우클릭은 거꾸로). 아이콘은 지금 정렬에 맞게 바뀜
    S:
      action: "stock:sort:next"
      icon: economy:gui/refresh
      material: COMPASS
      name: "<white>정렬: {sort}"
      lore: ["<gray>클릭: 다음 정렬 · 우클릭: 이전", "<dark_gray>산업순 → 오른 순 → 내린 순 → 많이 산 순"]
    I:
      action: "stock:help"
      icon: stsv:gui/info
      material: BOOK
      name: "<white>주식 안내"
      lore: ["<gray>10분마다 주가가 움직이고, 하루 ±20%까지", "<gray>산 주식은 10분 뒤부터 팔 수 있음, 수수료 1%", "<gray>한 회사 발행량의 30%까지 · 배당은 매주 월요일", "<gray>/주식 <회사> · /주식 알림"]
    Q: { action: "page:next", icon: stsv:gui/next, material: ARROW, name: "<yellow>다음 페이지 ▶", lore: ["<gray>{page} / {pages}"], off: { icon: stsv:gui/next_off, material: GRAY_DYE, name: "<dark_gray>마지막 페이지 ▶" } }

# 회사 화면: 위 두 줄 = 봉 그래프 (제목 글꼴로 그림), 아래 = 기간, 사기, 팔기
stock:
  title: "{graph}<#f0e2b0>{name} <white>{price} {change}"
  rows: 6
  background: economy:gui/stock
  # 그림 생성기용: 위 두 줄에 그래프 판을 그림
  graph: true
  layout:
    - "........."
    - "........."
    - "I..ABC..N"
    - "...123..."
    - "...456..."
    - "R..H.Z..X"
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<white>{name}"
      lore: ["<gray>업종 {industry}", "<gray>변동 {risk}", "", "<gray>현재가 <white>{price}", "<gray>오늘 {change} <dark_gray>(어제 마감 {close} 대비)",
             "<gray>오늘 최저 <white>{low} <gray>· 최고 <white>{high}", "{dividend}", "", "<gray>발행 {shares}주 · 주주들이 가진 수 {held}주", "{halted}"]
    A: { action: "stock:period:m10", icon: economy:gui/period_10, material: CLOCK, name: "<white>10분 <dark_gray>(10분 봉)", lore: ["<gray>지금 그래프: {period}"] }
    B: { action: "stock:period:h24", icon: economy:gui/period_24, material: CLOCK, name: "<white>24시간 <dark_gray>(2시간 봉)", lore: ["<gray>지금 그래프: {period}"] }
    C: { action: "stock:period:d7", icon: economy:gui/period_7, material: CLOCK, name: "<white>7일 <dark_gray>(하루 봉)", lore: ["<gray>지금 그래프: {period}"] }
    N:
      action: ""
      icon: economy:gui/ledger
      material: PAPER
      name: "<gold>최근 뉴스"
      lore: ["{news}"]
    "1": { action: "stock:buy:1", icon: economy:gui/buy_1, material: LIME_DYE, name: "<#ff5f57>1주 사기", lore: ["<gray>{p1} <dark_gray>({fee})"] }
    "2": { action: "stock:buy:10", icon: economy:gui/buy_10, material: LIME_DYE, name: "<#ff5f57>10주 사기", lore: ["<gray>{p10} <dark_gray>({fee})"] }
    "3": { action: "stock:buy:100", icon: economy:gui/buy_100, material: LIME_DYE, name: "<#ff5f57>100주 사기", lore: ["<gray>{p100} <dark_gray>({fee})"] }
    H:
      action: ""
      icon: economy:gui/bag
      material: PAPER
      name: "<aqua>내 주식 {have}주"
      lore: ["<gray>평가액 <white>{value}", "<gray>손익 {pl}", "{mydiv}", "<gray>지금 팔 수 있는 수 {sellable}주 <dark_gray>(산 지 10분 뒤부터)"]
    "4": { action: "stock:sell:1", icon: economy:gui/sell_1, material: RED_DYE, name: "<#4d9bff>1주 팔기", lore: ["<gray>팔 수 있는 {sellable}주 중에서 <dark_gray>({fee})"] }
    "5": { action: "stock:sell:10", icon: economy:gui/sell_10, material: RED_DYE, name: "<#4d9bff>10주 팔기", lore: ["<gray>팔 수 있는 {sellable}주 중에서 <dark_gray>({fee})"] }
    "6": { action: "stock:sell:100", icon: economy:gui/sell_100, material: RED_DYE, name: "<#4d9bff>100주 팔기", lore: ["<gray>팔 수 있는 {sellable}주 중에서 <dark_gray>({fee})"] }
    Z: { action: "stock:sell:all", icon: economy:gui/sell_all, material: REDSTONE, name: "<#4d9bff>전부 팔기", lore: ["<gray>팔 수 있는 {sellable}주 전부"] }
    R: { action: "stock:back", icon: economy:gui/back, material: ARROW, name: "<white>목록으로", lore: ["<gray>회사 목록으로 돌아가기"] }
    X: { action: close, icon: stsv:gui/exit, material: OAK_DOOR, name: "<red>닫기" }
