# 치장·칭호 상점 (과시 소비)
vanity:
  title: "<#f3e3b0>치장·칭호 상점"
  rows: 6
  background: economy:gui/vanity
  layout:
    - "....I...."
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "P..B.X..N"
  list: L
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<white>잔액: {balance}"
      lore: ["<gray>산 치장은 /치장, 칭호는 /칭호 에서."]
    B:
      action: "command:상점"
      icon: economy:gui/back
      material: ARROW
      name: "<yellow>상점으로"
    P:
      action: page:prev
      icon: stsv:gui/prev
      material: ARROW
      name: "<yellow>◀ 이전 페이지"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/prev_off, material: GRAY_DYE, name: "<dark_gray>◀ 첫 페이지" }
    N:
      action: page:next
      icon: stsv:gui/next
      material: ARROW
      name: "<yellow>다음 페이지 ▶"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/next_off, material: GRAY_DYE, name: "<dark_gray>마지막 페이지 ▶" }
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
