# /길라잡이 (길라잡이 책 우클릭, 안내원 우클릭, 통합 메뉴 미션 우클릭): 주제 고르기. 목록은 칸마다 주제 하나 (아이콘, 걸리는 시간,
# 단계 수, 첫 완료 보상, ✔ 완료). 클릭 = 체험관의 그 정거장으로 가서 해 보기. 배경은 우편함과 같은 칸 모양.
guide:
  title: "<#f0e2b0>길라잡이 <#b9a6d6>· 완료 {count}"
  rows: 6
  background: economy:gui/mail
  layout:
    - "....I...."
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "P..A.X..N"
  list: L
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<gold>길라잡이"
      lore: ["<gray>해 보고 싶은 것을 고르면 체험관으로 가서", "<gray>진짜 메뉴 · 기계 · 탈것으로 직접 해 봐요", "<gray>가진 물건은 보관했다가 끝나면 돌려줘요", "",
             "<white>완료 {count} <gray>· 남은 보상 <gold>{left}", "<gray>모두 마치면 칭호 <#8fd16a>[새싹]</#8fd16a> + 치장 하나"]
    A:
      action: "guide:leave"
      icon: economy:gui/back
      material: OAK_DOOR
      name: "<red>그만두기 <gray>(지금: {now})"
      lore: ["<gray>체험관을 나와 원래 자리로", "<gray>가진 물건은 그대로 돌려받아요", "<yellow>우클릭: 지금 주제 처음부터 다시"]
    P:
      action: page:prev
      icon: stsv:gui/prev
      material: ARROW
      name: "<yellow>◀ 이전 페이지"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/prev_off, material: GRAY_DYE, name: "<dark_gray>◀ 첫 페이지" }
    N:
      action: page:next
      icon: stsv:gui/next
      material: ARROW
      name: "<yellow>다음 페이지 ▶"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/next_off, material: GRAY_DYE, name: "<dark_gray>마지막 페이지 ▶" }
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
