# /직업: 두 번 클릭해서 선택. 레벨은 직업마다 따로 남음
jobs:
  title: "<#f0e2b0>직업"
  rows: 4
  background: economy:gui/jobs
  layout:
    - "....I...."
    - "..L.L.L.."
    - "..L.L.L.."
    - "...R.X..."
  list: L
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<white>내 직업: {job} <gray>Lv{level}"
      lore: ["<gray>경험치 <white>{xp} <gray>/ {next}", "<gray>직업마다 레벨 따로 · 최고 Lv{cap}", "<gray>변경 비용 {cost} <dark_gray>(첫 선택 무료)"]
    R:
      action: "command:직업 순위"
      icon: economy:gui/trophy
      material: GOLDEN_HELMET
      name: "<yellow>직업 순위"
      lore: ["<gray>직업별 레벨 순위 <dark_gray>(채팅)"]
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
