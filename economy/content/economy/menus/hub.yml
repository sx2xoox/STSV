# /메뉴, 웅크린 채 F (Shift+F): 통합 메뉴 (경제 서버판). 경제 플러그인이 켜져 있는 동안 코어의 stsv:hub 대신 열림.
# 코어 판(contents/stsv/menus/hub.yml)의 버튼을 모두 담고 경제 기능을 더함.
# 모든 화면이 6줄. 큰 버튼: art(배경에 그릴 아이콘) + label(배경에 쓸 이름)이 있는 버튼은 글자를 직사각형으로 반복해
#   여러 칸을 덮고, 배경에 큰 타일로 그려짐(3줄 높이면 아이콘 2배). 칸에는 보이지 않는 아이템(stsv:gui/blank)이
#   들어가 마우스를 올리면 이름·설명만 뜸. with: "P" = 타일 안에 다른 버튼(내 머리)이 함께 들어감.
# 첫 화면은 카테고리, 누르면 그 카테고리 화면(hub_*). 각 화면의 뒤로(아래 가운데)는 첫 화면으로.
# 버튼 동작: command:<명령어> (플레이어로 실행), close, hub:go:<메뉴> (통합 메뉴의 다른 화면),
#            hub:<왼쪽>|<오른쪽>  각각 run:<명령어> 또는 suggest:<명령어> (닫고 채팅창에 "/명령어 " 넣기 안내)
# 자리표시자: {player} {world} {balance} {title} {points} {cosmetics} {fee} {hotkey} {warmup} {cooldown} {night_vision}
#             경제 {job} {level} {events} {land} {free}
hub:
  title: "<#f0e2b0>통합 메뉴 <#8f86a6>· {world}"
  rows: 6
  background: economy:gui/hub
  layout:
    - "aaapppbbb"
    - "aaapPpbbb"
    - "aaapppbbb"
    - "cccdddeee"
    - "cccdddeee"
    - "cccdddeee"
  buttons:
    a:
      action: "hub:go:economy:hub_travel"
      icon: stsv:gui/blank
      material: COMPASS
      art: stsv:gui/compass
      label: "이동·편의"
      name: "<white>이동 · 편의"
      lore: ["<gray>건축월드 · 야생월드 · 텔레포트", "<gray>야간 투시 · 탈것 · 쓰레기통", "", "<yellow>클릭: 열기"]
    p:
      action: "command:프로필"
      icon: stsv:gui/blank
      material: PAPER
      label: "내 정보"
      with: "P"
      name: "<white>{player}"
      lore: ["<gray>잔액 {balance}", "<gray>직업 <white>{job} <gray>Lv{level} · 땅 <white>{land}", "<gray>칭호 <white>{title} <dark_gray>· <gold>{points}점", "<yellow>클릭: 내 프로필 <dark_gray>· 단축키 {hotkey}"]
    P:
      action: "command:프로필"
      material: PLAYER_HEAD
      name: "<white>{player}"
      lore: ["<gray>잔액 {balance}", "<gray>직업 <white>{job} <gray>Lv{level} · 땅 <white>{land}", "<gray>칭호 <white>{title} <dark_gray>· <gold>{points}점", "<yellow>클릭: 내 프로필 <dark_gray>· 단축키 {hotkey}"]
    b:
      action: "hub:go:economy:hub_trade"
      icon: stsv:gui/blank
      material: CHEST
      art: economy:gui/cart
      label: "거래"
      name: "<white>거래"
      lore: ["<gray>잔액 {balance}", "<gray>상점 · 시세 · 거래소 · 경매", "<gray>직거래 · 우편함 · 송금 · 수표", "", "<yellow>클릭: 열기"]
    c:
      action: "hub:go:economy:hub_work"
      icon: stsv:gui/blank
      material: IRON_PICKAXE
      art: economy:gui/pickaxe
      label: "일·땅"
      name: "<white>일 · 땅"
      lore: ["<gray>직업 <white>{job} <gray>Lv{level} · 땅 <white>{land}", "<gray>미션 · 의뢰 · 도감 · 주식", "<gray>사건 <white>{events}", "", "<yellow>클릭: 열기"]
    d:
      action: "hub:go:economy:hub_style"
      icon: stsv:gui/blank
      material: LEATHER_CHESTPLATE
      art: stsv:gui/dress_up
      label: "꾸미기"
      name: "<white>꾸미기"
      lore: ["<gray>치장 <white>{cosmetics} <gray>· 칭호 <white>{title}", "<gray>뽑기 · 닉네임 · 감정표현", "<gray>투명갑옷 · 후원 상점", "", "<yellow>클릭: 열기"]
    e:
      action: "hub:go:economy:hub_rank"
      icon: stsv:gui/blank
      material: GOLDEN_HELMET
      art: stsv:gui/trophy
      label: "순위·기록"
      name: "<white>순위 · 기록"
      lore: ["<gray>업적 <gold>{points}점", "<gray>명예의 전당 · 주간 순위", "<gray>내 돈 · 부자 순위", "", "<yellow>클릭: 열기"]

