# /메뉴, 웅크린 채 F (Shift+F): 통합 메뉴 (경제 서버판). 경제 플러그인이 켜져 있는 동안 코어의 stsv:hub 대신 열림.
# 코어 판(contents/stsv/menus/hub.yml)의 버튼을 모두 담고 경제 기능을 더함.
# 모양 (theme: hanok, tools/assetgen/hub_hanok.py): 기와 지붕 · 현판(plaque) · 붉은 기둥 · 청사초롱. 배경은 패널 밖까지
#   2배 해상도로 그려짐(frame). 제목 줄은 비우고 이름은 현판에. 모든 화면 6줄, 맨 아래 줄(dock: 5)은 자주 쓰는 버튼
#   9칸 마루(가운데: 첫 화면은 내 머리, 다른 화면은 뒤로). 글자를 직사각형으로 반복한 버튼은 여러 칸을 덮는 카드:
#   scene = 큰 그림 카드(hub_art/scenes, 이름판에 label), art = 작은 카드(아이콘 + label). 칸에는 보이지 않는
#   아이템(stsv:gui/blank)이 들어가 설명만 뜸.
# 버튼 동작: command:<명령어> (플레이어로 실행), hub:go:<메뉴> (통합 메뉴의 다른 화면),
#            hub:<왼쪽>|<오른쪽>  각각 run:<명령어> 또는 suggest:<명령어> (닫고 채팅창에 "/명령어 " 넣기 안내)
# 자리표시자: {player} {world} {balance} {title} {points} {cosmetics} {fee} {hotkey} {warmup} {cooldown} {night_vision}
#             경제 {job} {level} {events} {land} {free}
hub:
  title: ""
  plaque: "통합 메뉴"
  rows: 6
  theme: hanok
  frame: {left: 30, right: 30, top: 20, scale: 2}
  dock: 5
  background: economy:gui/hub
  layout:
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "BYtnPvwmR"
  buttons:
    a:
      action: "hub:go:economy:hub_trade"
      icon: stsv:gui/blank
      material: CHEST
      scene: market
      label: "거래"
      sub: "상점·거래소"
      accent: "#ec6a60"
      name: "<white>거래"
      lore: ["<gray>잔액 {balance}", "<gray>상점 · 시세 · 거래소 · 경매", "<gray>직거래 · 우편함 · 송금 · 수표", "", "<yellow>클릭: 열기"]
    b:
      action: "hub:go:economy:hub_work"
      icon: stsv:gui/blank
      material: IRON_PICKAXE
      scene: mine
      label: "일·땅"
      sub: "직업·미션"
      accent: "#7ec85c"
      name: "<white>일·땅"
      lore: ["<gray>직업 <white>{job} <gray>Lv{level} · 땅 <white>{land}", "<gray>미션 · 의뢰 · 도감 · 주식", "<gray>사건 <white>{events}", "", "<yellow>클릭: 열기"]
    c:
      action: "hub:go:economy:hub_style"
      icon: stsv:gui/blank
      material: LEATHER_CHESTPLATE
      scene: boutique
      label: "꾸미기"
      sub: "치장·칭호"
      accent: "#ba84f0"
      name: "<white>꾸미기"
      lore: ["<gray>치장 <white>{cosmetics} <gray>· 칭호 <white>{title}", "<gray>뽑기 · 닉네임 · 감정표현", "<gray>투명갑옷 · 후원 상점", "", "<yellow>클릭: 열기"]
    P:
      action: "hub:run:프로필|run:돈"
      material: PLAYER_HEAD
      name: "<white>{player}"
      lore: ["<gray>위치 <white>{world}", "<gray>잔액 {balance}", "<gray>직업 <white>{job} <gray>Lv{level} · 땅 <white>{land}", "<gray>칭호 <white>{title} <dark_gray>· <gold>{points}점", "<yellow>클릭: 내 프로필", "<yellow>우클릭: 잔액 <dark_gray>· 단축키 {hotkey}"]
    B:
      action: "command:건축월드"
      icon: stsv:gui/blank
      material: BRICKS
      art: hub:build
      name: "<white>건축월드로"
      lore: ["<gray>땅을 사서 집 짓는 곳", "<dark_gray>{warmup}초 가만히"]
    Y:
      action: "hub:run:야생월드|run:rtp"
      icon: stsv:gui/blank
      material: OAK_SAPLING
      art: hub:wild
      name: "<white>야생월드로"
      lore: ["<gray>자원 채집 · 보호 없음 · 가끔 초기화", "<gold>지옥·엔드: 죽어도 아이템 유지", "<yellow>우클릭: 다른 무작위 위치 <dark_gray>(야생월드에서)", "<dark_gray>{warmup}초 가만히 · 재사용 {cooldown}초"]
    t:
      action: "hub:suggest:tpa|suggest:tpahere"
      icon: stsv:gui/blank
      material: ENDER_PEARL
      art: hub:tp
      name: "<white>텔레포트 요청"
      lore: ["<gray>상대가 수락하면 이동", "<yellow>클릭: 가기 <dark_gray>· /tpa", "<yellow>우클릭: 내 쪽으로 부르기"]
    n:
      action: "command:야간투시"
      icon: stsv:gui/blank
      material: ENDER_EYE
      art: hub:night
      name: "<white>야간 투시 <gray>· {night_vision}"
      lore: ["<gray>죽거나 나가도 유지", "<yellow>클릭: 켜기·끄기"]
    v:
      action: "command:탈것"
      icon: stsv:gui/blank
      material: MINECART
      art: hub:vehicle
      name: "<white>내 탈것"
      lore: ["<gray>내 탈것 목록", "<dark_gray>양도 · 함께 쓸 사람: /탈것"]
    w:
      action: "command:ㅆ"
      icon: stsv:gui/blank
      material: CAULDRON
      art: hub:trash
      name: "<white>쓰레기통"
      lore: ["<gray>넣고 닫으면 사라짐", "<dark_gray>탈것·지게는 돌려받음 · /ㅆ"]
    m:
      action: "hub:go:economy:hub_minigame"
      icon: stsv:gui/blank
      material: GOLDEN_HORSE_ARMOR
      art: hub:minigame
      name: "<white>미니게임"
      lore: ["<gray>심심할 때 한 판 · 서킷 카트 레이스", "<gray>{circuit_status}", "", "<yellow>클릭: 고르기"]
    R:
      action: "hub:go:economy:hub_rank"
      icon: stsv:gui/blank
      material: GOLDEN_HELMET
      art: hub:rank
      name: "<white>순위 · 기록"
      lore: ["<gray>업적 <gold>{points}점", "<gray>명예의 전당 · 주간 순위 · 부자 순위", "", "<yellow>클릭: 열기"]

