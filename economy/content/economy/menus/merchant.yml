# 상인 행렬 (사건) 한정 상품
merchant:
  title: "<#f3e3b0>상인 행렬"
  rows: 4
  background: economy:gui/merchant
  layout:
    - "....I...."
    - ".LLLLLLL."
    - ".LLLLLLL."
    - "...B.X..."
  list: L
  buttons:
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<light_purple>상인 행렬"
      lore: ["<gray>선착순 한정 상품입니다."]
    B:
      action: "command:상점"
      icon: economy:gui/back
      material: ARROW
      name: "<yellow>상점으로"
    X:
      action: close
      icon: stsv:gui/exit
      material: OAK_DOOR
      name: "<red>닫기"
