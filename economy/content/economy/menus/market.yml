  background: economy:gui/market_order_pick
  layout:
    - "....F...."
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "LLLLLLLLL"
    - "P...B...N"
  list: L
  buttons:
    F:
      action: "order:pick:search"
      icon: economy:gui/search
      material: SPYGLASS
      name: "<white>검색"
      lore: ["<gray>이름·분류로 찾기 (채팅창에 입력)", "<gray>지금: <white>{search} <dark_gray>({count}종)", "<dark_gray>우클릭: 검색 지우기"]
    B:
      action: "order:pick:back"
      icon: economy:gui/back
      material: ARROW
      name: "<white>주문 화면으로"
      lore: ["<gray>고르지 않고 돌아가기"]
    P:
      action: page:prev
      icon: stsv:gui/prev
      material: ARROW
      name: "<yellow>◀ 이전 페이지"
      lore: ["<gray>{page} / {pages}"]
    N:
      action: page:next
      icon: stsv:gui/next
      material: ARROW
      name: "<yellow>다음 페이지 ▶"
      lore: ["<gray>{page} / {pages}"]
