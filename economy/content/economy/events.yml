# 사건. 한 번에 하나만 일어나고, 끝나고 chain.gap-hours 시간 뒤에 다음 사건이 저절로 일어남.
# 다음 사건은 weight 에 따라 뽑고, 바로 전과 같은 종류는 뽑지 않음.
# 다음 사건이 새벽(night-from ~ night-to 시)에 시작하게 되면 long-hours 시간 이상인 사건만 뽑음.
# chain: false 인 사건은 저절로 일어나지 않음 (/관리자 사건 시작 으로만).
# hours = 지속 시간, color = 보스바 색 (pink, blue, red, green, yellow, purple, white), detail = 보스바 설명
# jobs = 이 사건 동안 그 직업들의 효과가 multiplier 배
chain:
  gap-hours: 6
  night-from: 1
  night-to: 9
  long-hours: 24

events:
  shortage:
    name: "품귀"
    hours: 24
    color: green
    weight: 3
    multiplier: 3.0      # 중간 가격대 품목 하나의 매입가 배수 (수요 고시·다른 사건 품목은 고르지 않음)
  crash:
    name: "시장 폭락"
    hours: 24
    color: red
    weight: 2
    multiplier: 0.5      # 최근 가장 많이 팔린 품목의 매입가 배수 (수요 고시·다른 사건 품목은 고르지 않음)
  harvest:
    name: "풍년"
    hours: 24
    color: green
    weight: 3
    jobs: [farmer, fisher]
    multiplier: 2
    detail: "농부·어부 효과 2배"
  mining_boom:
    name: "광산 호황"
    hours: 6
    color: blue
    weight: 3
    jobs: [miner, blacksmith]
    multiplier: 2
    detail: "광부·대장장이 효과 2배"
  tax_audit:
    name: "세무 조사"
    hours: 24
    color: yellow
    weight: 1
    tax-multiplier: 2
    donation-min: 5000
    donation-title: economy:patron
    detail: "오늘 재산세 2배 · /기부 5,000G 이상이면 칭호"
  merchant:
    name: "상인 행렬"
    hours: 2
    color: purple
    weight: 2            # 상점의 상인 행렬 칸에 shop.yml merchant 상품
  urgent_order:
    name: "긴급 납품"
    hours: 3
    color: pink
    weight: 3
    target-value: 3000   # 기준가로 이만큼어치를 주문 (16 ~ 512개)
    min: 16
    max: 512
    top: 2.0             # 첫 납품은 기준가 2배, 마지막은 1배: 빨리 낼수록 비쌈. /납품
    bottom: 1.0
  premium_buyer:
    name: "고가 매입상"
    hours: 2
    color: pink
    weight: 3
    min-items: 2         # 품목 2~3개를 시세의 multiplier 배로, 품목마다 stock 개까지
    max-items: 3
    multiplier: 2
    stock: 64
  fee_free:
    name: "수수료 면제"
    hours: 6
    color: white
    weight: 2
    detail: "거래소·경매·송금 수수료 0%"
  # 보류: 저절로 일어나지 않습니다 (관리자가 시험용으로만)
  world_boss:
    name: "월드 보스"
    hours: 1
    color: purple
    chain: false
    boss: executioner
    start-price: 1000
    reward-1: 3000
    reward-2: 2000
    reward-3: 1000
