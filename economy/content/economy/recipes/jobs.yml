# 직업 기계 조합법 (누구나). 생산품은 조합대가 아니라 직업 기계에서 만듭니다 (machines.yml).

gem_bench:
  type: shaped
  pattern: ["IGI", "PTP", "P P"]
  keys: { I: minecraft:iron_ingot, G: minecraft:grindstone, P: "#minecraft:planks", T: minecraft:crafting_table }
  result: economy:gem_bench

mill:
  type: shaped
  pattern: ["LHL", "SGS", "SSS"]
  keys: { L: "#minecraft:logs", H: minecraft:hopper, G: minecraft:grindstone, S: minecraft:smooth_stone }
  result: economy:mill

fish_bench:
  type: shaped
  pattern: ["III", "PBP", "P P"]
  keys: { I: minecraft:iron_ingot, B: minecraft:barrel, P: "#minecraft:planks" }
  result: economy:fish_bench

forge:
  type: shaped
  pattern: ["BBB", "BFB", "IAI"]
  keys: { B: minecraft:bricks, F: minecraft:blast_furnace, I: minecraft:iron_block, A: minecraft:anvil }
  result: economy:forge

kitchen:
  type: shaped
  pattern: ["IPI", "CSB", "CCC"]
  keys: { I: minecraft:iron_ingot, P: minecraft:cauldron, C: minecraft:bricks, S: minecraft:smoker, B: minecraft:barrel }
  result: economy:kitchen

still:
  type: shaped
  pattern: ["CGC", "CBC", "KFK"]
  keys: { C: minecraft:copper_block, G: minecraft:glass, B: minecraft:brewing_stand, K: minecraft:bricks, F: minecraft:furnace }
  result: economy:still

press:
  type: shaped
  pattern: ["PLP", "CHC", "CCC"]
  keys: { P: minecraft:piston, L: "#minecraft:logs", H: minecraft:hopper, C: minecraft:cobblestone }
  result: economy:press

# 통발·가두리 (어부): 물속에 놓는 가구 (fish.yml trap · pen)
fish_trap:
  type: shaped
  pattern: ["ISI", "SRS", "ISI"]
  keys: { I: minecraft:iron_ingot, S: minecraft:string, R: minecraft:fishing_rod }
  result: economy:fish_trap

fish_pen:
  type: shaped
  pattern: ["LBL", "SCS", "LBL"]
  keys: { L: "#minecraft:logs", B: minecraft:iron_block, S: minecraft:string, C: minecraft:barrel }
  result: economy:fish_pen
