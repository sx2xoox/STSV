# 주식 /주식. 가상 회사 42개 (산업 6개 × 7개). 주가는 10분마다 움직임:
#   회사 고유의 흔들림(volatility) + 산업 지수(서버 활동·사건, sensitivity 배) + 제자리로 돌아가는 힘 + 가끔 회사 뉴스
# 하루 변동은 전날 종가(05시) 기준 ±limit. 닿으면 서버 공지 (상한가·하한가).
# 조작 방지: 서버 활동은 매일 05시에 하루치를 한 번만 반영하고, 그 산업 주식을 가진 사람의 활동은 빼고 셈.
#   최근 7일 평균보다 얼마나 많았나로만 보고, 산업 지수는 하루 activity-cap 까지만 움직임.
# 이름·회사·성격은 여기서 고치고 /관리자 리로드. 관리자가 명령어로 바꾼 값(가격, 상장, 성격)은 저장소에 남아 이 파일보다 우선합니다.

settings:
  tick-minutes: 10        # 주가가 움직이는 간격
  limit: 0.20             # 하루 상하한가 ±20%
  holding-cap: 0.30       # 한 사람이 회사 하나의 발행 주식 중 가질 수 있는 몫
  fee: 0.01               # 사고팔 때 수수료 1% (첫 매수는 무료)
  sell-wait-minutes: 10   # 산 주식은 10분 뒤부터 팔 수 있음
  news-per-day: 5         # 하루 평균 회사 뉴스 수 (±5~10%)
  activity-cap: 0.03      # 서버 활동으로 산업 지수가 하루 움직이는 최대치
  activity-scale: 0.03    # 평소(7일 평균)의 2배 활동 = +3%
  reversion-days: 3       # 주가가 기준 가치로 반쯤 돌아오는 데 걸리는 날
  base-reversion-days: 30 # 기준 가치가 처음 값으로 반쯤 돌아오는 데 걸리는 날
  dividend-share: 0.15    # 매주(월요일 05시) 지난주 사라진 돈(세금·수수료 등)의 15%를 배당으로 나눔
  min-invested: 1000      # 주간 주식왕 집계: 그 주에 이만큼 이상 투자한 사람만
  alerts: [0.10, 0.20]    # 내 주식이 산 값보다 ±10%, ±20% 움직이면 알림 (/주식 알림 으로 끄고 켬)
  event-shock: 0.02       # 사건이 산업 지수를 움직이는 크기 (품귀 +, 폭락 -, 풍년·광산 호황 +)

# risk: 1 = 대형 안정주, 2 = 보통, 3 = 소형 급등락주 (volatility·shares·dividend 기본값)
risk:
  1: { volatility: 0.0017, shares: 10000, dividend: 1.0 }
  2: { volatility: 0.0040, shares: 5000, dividend: 0.5 }
  3: { volatility: 0.0085, shares: 2000, dividend: 0.0 }

