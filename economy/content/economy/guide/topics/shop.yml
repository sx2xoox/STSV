name: "상점·시세"
icon: minecraft:emerald
minutes: 2
order: 6
station: shop
about: "물건 사고팔기, 내 매입가 보기"
reward: { money: 2200 }
items:
  - { item: economy:ruby, amount: 2 }
steps:
  - text: "/상점 을 쳐서 관리자 상점을 여세요"
    say: "/상점 이라고 쳐 보세요"
    detail: "상점에서는 도구 · 기계 · 씨앗 · 탈것을 사고, 캔 것 · 기른 것 · 만든 것을 팔아요."
    goal: { type: menu, menu: economy:shop }
