# 주민의 부탁 /의뢰 (README "주민의 부탁")
# 매일 05시 단계(tiers)마다 daily-count 건을 pool 에서 뽑음 (weight 클수록 자주). 같은 단계 사람은 같은 부탁을 봄.
# 부탁마다 의뢰인 = 인물 도감의 주민 한 명 (버스 손님 종류; 숨은 비밀의 손님은 안 나옴)과 한 줄 사연 (stories: 주민마다, 없으면 default).
# 보상 = 관리자 상점 기준가(없으면 value) × 개수 × 그 단계의 multiplier + 도장. 한 사람은 하루 per-player 건까지.
# job 이 있으면 그 직업인 사람에게 xp 도 줌. from-day 일차(서버를 처음 연 날 = 1일차)부터 나옴. tier = 그 부탁이 나오는 단계 (기본 1).
# 그 단계의 부탁이 모자라면 아래 단계 것으로 채움.
daily-count: 6
per-player: 3
reward-multiplier: 1.3
# 단계: 가장 높은 직업 레벨이 from 이상이면 그 단계. 신규(1단계)는 1세대 물건, 고참(4단계)은 4강 · 4세대 물건을 찾는 주민을 만남.
# 신규에게는 지금처럼 돈이 의미 있으니 1.3배 그대로, 고참에게는 돈 대신 도장 (상점가 그대로 + 도장)
# stamps = 부탁 하나의 도장, stamps-daily = 부탁으로 받는 도장은 하루 이만큼까지
tiers:
  - { from: 1, multiplier: 1.3, stamps: 1 }
  - { from: 10, multiplier: 1.3, stamps: 1 }
  - { from: 20, multiplier: 1.15, stamps: 1 }
  - { from: 31, multiplier: 1.0, stamps: 2 }
stamps-daily: 2

# 친밀도: 그 주민의 부탁을 들어주면 오름 (인물 도감 그 사람 칸에 보임). gifts = 그만큼이 되면 한 번 받는 작은 선물
bond:
  request: 1
  chain-step: 1
  master: 5
  gifts:
    5:  { items: ["minecraft:cookie x8"] }
    20: { items: ["minecraft:cake x1"], stamps: 2 }
    50: { items: ["minecraft:experience_bottle x16"], stamps: 5 }

# 명인 의뢰: 주 1건 (월요일 05시), tier 이상인 고참만. 그 단계 pool 에서 하나를 골라 개수 = 그 물건의 max × amount.
# 보상 = 기준가 × 개수 × multiplier + 도장 stamps + 친밀도, 그리고 인물 도감의 그 주민 칸에 "단골 일꾼"으로 이름이 남음 (최근 regulars 명)
master:
  tier: 4
  amount: 3
  multiplier: 1.0
  stamps: 8
  regulars: 5

# 이어지는 주간 의뢰: 한 주에 하나, 세 단계 (앞 단계를 끝내야 다음이 열림). 여러 직업의 물건이라 혼자 다 만들거나 거래소에서 삼
# (고참이 신규의 물건을 사는 길). 단계 보상 = 기준가 × 개수 × reward-multiplier + 도장 step-stamps, 다 끝내면 도장 done-stamps 더.
# 목록을 차례대로 돌아가며 씀 (1주차 = 첫 줄). person = 부탁하는 주민 (bus.yml 손님 종류)
chain-stamps: { step: 1, done: 3 }
chains:
  - name: "잔치 준비"
    person: grandma
    steps:
      - { item: economy:rice, amount: 32, text: "손주 돌잔치를 열려고 하네. 우선 쌀부터 모아 주겠나?" }
      - { item: economy:hobakjeon, amount: 12, text: "쌀은 됐고, 손님상에 올릴 호박전을 부쳐 주게." }
      - { item: economy:makgeolli, amount: 6, text: "마지막으로 어른들 드릴 막걸리 몇 병만 부탁하네." }
  - name: "바닷가 축제"
    person: haenyeo
    steps:
      - { item: economy:fish_meat, amount: 24, text: "바닷가 축제에 회를 낼 거예요. 생선살부터 부탁해요." }
      - { item: economy:iron_pan, amount: 3, text: "전 부칠 철판이 모자라요. 대장간 솜씨 좀 빌려 줘요." }
      - { item: economy:fish_platter, amount: 8, text: "이제 한 상 차려야죠. 모둠 생선 접시를 부탁해요." }
  - name: "겨울 채비"
    person: uncle
    steps:
      - { item: coal, amount: 96, text: "올겨울은 춥다더라. 아궁이에 넣을 석탄부터 좀 구해 줘." }
      - { item: economy:iron_plate, amount: 6, text: "난로 덮개가 다 녹슬었어. 철판 몇 장만 두드려 줘." }
      - { item: economy:kimchi, amount: 8, text: "김장 끝나면 동네에 돌릴 김치가 필요해." }
  - name: "소풍 도시락"
    person: kinder
    steps:
      - { item: economy:strawberry, amount: 48, text: "선생님이랑 소풍 가요! 딸기 많이 많이요!" }
      - { item: economy:gyeranmari, amount: 8, text: "도시락에 계란말이가 꼭 있어야 해요!" }
      - { item: economy:sikhye, amount: 6, text: "목마를 때 마실 식혜도요! 시원한 걸로요!" }
  - name: "공사장 새참"
    person: worker
    steps:
      - { item: iron_ingot, amount: 32, text: "다리 보수에 쓸 철이 모자라. 철 주괴 좀 구해 주게." }
      - { item: economy:jeyuk, amount: 8, text: "일꾼들 새참으로 제육볶음이 최고지." }
      - { item: economy:flower_tea, amount: 6, text: "일 끝나고 마실 꽃잎 차 몇 잔이면 다들 좋아할 거야." }

