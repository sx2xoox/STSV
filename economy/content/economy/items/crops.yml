  lore: ["<gray>관리자 상점. 경작지나 화분에 심기. 수확 뒤 다시 열림."]
  texture: chili_seeds

strawberry_seeds:
  material: paper
  name: "<#8bc34a>딸기 씨앗"
  lore: ["<gray>관리자 상점. 경작지나 화분에 심기. 수확 뒤 다시 열림, 해충에 약함."]
  texture: strawberry_seeds

tomato:
  material: paper
  name: "<#8bc34a>토마토"
  lore: ["<gray>요리 재료. 품질 ★이 높을수록 비싸게 팔림."]
  texture: tomato

chili_pepper:
  material: paper
  name: "<#8bc34a>고추"
  lore: ["<gray>요리 재료. 품질 ★이 높을수록 비싸게 팔림."]
  texture: chili_pepper

strawberry:
  material: paper
  name: "<#8bc34a>딸기"
  lore: ["<gray>요리 재료. 품질 ★이 높을수록 비싸게 팔림."]
  texture: strawberry

pesticide:
  material: paper
  name: "<#ba68c8>살충제"
  lore: ["<gray>해충이 생긴 작물에 우클릭."]
  texture: pesticide

watering_can:
  material: paper
  name: "<#ff8a65>물뿌리개"
  lore: ["<gray>물에 대고 우클릭: 채우기 (16번)", "<gray>작물에 우클릭: 물 주기."]
  texture: watering_can
  max-stack: 1

copper_watering_can:
  material: paper
  name: "<#ff8a65>구리 물뿌리개"
  lore: ["<gray>물에 대고 우클릭: 채우기 (48번)", "<gray>작물에 우클릭: 물 주기. 3×3 한 번에."]
  texture: copper_watering_can
  max-stack: 1

sprinkler:
  material: paper
  name: "<#ff8a65>스프링클러"
  lore: ["<gray>주변 5×5 작물에 늘 물을 줌", "<dark_gray>대장장이 Lv2 생산품"]
  model: sprinkler
  max-stack: 16
  furniture:
    cells: [[0, 0, 0]]
    behavior: stsv:sprinkler

planter_pot:
  material: paper
  name: "<#8bc34a>화분"
  lore: ["<gray>씨앗을 들고 우클릭: 심기 (실내 재배)", "<dark_gray>농부 Lv1 생산품"]
  model: planter_pot
  max-stack: 16
  furniture:
    cells: [[0, 0, 0]]
    behavior: stsv:crop_pot
