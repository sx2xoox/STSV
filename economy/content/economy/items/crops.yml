# 작물 관련 아이템: 씨앗, 수확물, 물뿌리개, 살충제, 스프링클러, 화분
# 작물 정의는 crops/crops.yml

golden_wheat_seeds:
  material: paper
  name: "<#8bc34a>황금 밀 씨앗"
  lore: ["<gray>Lv2 농부가 밀을 수확할 때 가끔. 경작지에 심기 (농부 Lv2)."]
  texture: golden_wheat_seeds

honey_potato_seed:
  material: paper
  name: "<#8bc34a>꿀 씨감자"
  lore: ["<gray>Lv2 농부가 감자를 수확할 때 가끔. 경작지에 심기 (농부 Lv2)."]
  texture: honey_potato_seed

ruby_carrot_seed:
  material: paper
  name: "<#8bc34a>루비 당근 씨앗"
  lore: ["<gray>Lv2 농부가 당근을 수확할 때 가끔. 경작지에 심기 (농부 Lv2)."]
  texture: ruby_carrot_seed

tomato_seeds:
  material: paper
  name: "<#8bc34a>토마토 씨앗"
