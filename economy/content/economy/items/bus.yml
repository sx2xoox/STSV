# 주인이 끝내 안 온 사인볼 (기한이 지나면 사인볼이 이걸로 바뀜): 기사가 가지는 기념품
lost_signedball_keepsake:
  material: paper
  name: "<#ffd166>사인볼 (기념품)"
  lore: ["<gray>주인이 끝내 찾으러 오지 않은 야구팬의 사인볼", "<dark_gray>기념품 · 팔 수 없음"]
  texture: lost_signedball_keepsake
  max-stack: 1

