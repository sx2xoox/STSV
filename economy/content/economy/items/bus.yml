# 마을버스 분실물 (bus.yml events.lost.kinds): 손님이 버스에 두고 내린 물건. 버스 기사만 얻음 (손님이 내릴 때), 다른 곳에서는 안 나옴.
# 이름 · 설명은 줄 때 BusModule 이 손님 종류 · 돌려줄 정류장 · 남은 시간으로 바꿔 씀 (아래 name 은 기본값). 상점 구매품 표시라 팔 수 없음.
# 아이콘: tools/assetgen/bus_lost_icons.py
