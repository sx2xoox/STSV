# 장신구 (/장신구): 모든 장신구의 바탕 아이템 하나. 효과·등급·수치·강화·레벨은 아이템 안의 데이터 (economy:acc), 이름 · 설명 · 모습(economy:acc/<효과>)은
# 플러그인이 다시 그림. 예전 acc_<칸>_<등급> 20개는 없앰 (가지고 있던 장신구는 접속할 때 · 가방을 열 때 이 아이템으로 바뀜)

accessory:
  material: paper
  name: "<white>장신구"
  max-stack: 1
  texture: accessory

# 상점·하역장이 사지 않음 (거래소·경매·직거래는 됨). 아이콘: tools/assetgen/accessory_art.py

# 장신구 상자 (상점 100,000): 우클릭으로 열기. 조각 30개를 들고 우클릭하면 상자 하나
acc_box:
  material: paper
  name: "<#ffd36b>장신구 상자"
  lore: ["<gray>우클릭: 열기 (효과는 고르게, 등급은 C 78% · B 18% · A 3.6% · S 0.4%)"]
  texture: acc_box

acc_fragment:
  material: paper
  name: "<#c58cff>장신구 조각"
  lore: ["<gray>30개를 들고 우클릭: 장신구 상자 하나", "<dark_gray>용궁 상자에서 나옴 · 상점 안 삼"]
  texture: acc_fragment

# 용궁 상자 (장신구 "용궁 보물"로 낚시 중에): 우클릭으로 열기
dragon_chest:
  material: paper
  name: "<#7fd8ff>용궁 상자"
  lore: ["<gray>우클릭: 열기", "<dark_gray>장신구 조각 · 단련석 · 보석 가루 · 전복 · 붉은 산호 · 희귀 물고기 · 드물게 장신구"]
  texture: dragon_chest
