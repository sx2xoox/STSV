# 장신구 상자 (상점 100,000): 우클릭으로 열기. 조각 30개를 들고 우클릭하면 상자 하나
acc_box:
  material: paper
  name: "<#ffd36b>장신구 상자"
  lore: ["<gray>우클릭: 열기 (효과는 고르게, 등급은 보통 78% · 진품 18% · 명품 3.6% · 국보 0.4%)"]
  texture: acc_box

acc_fragment:
  material: paper
  name: "<#c58cff>장신구 조각"
  lore: ["<gray>30개를 들고 우클릭: 장신구 상자 하나", "<dark_gray>용궁 상자에서 나옴 · 상점 안 삼"]
  texture: acc_fragment

