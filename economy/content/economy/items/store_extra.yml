# 편의점 2차 (README "편의점" · docs/plans/편의점_기획안.md §7 §13): 플레이어가 편의점에서 사는 진짜 음식 · 내 가게 권리증.
# items/store.yml (가구 · 표시용 상품, 에셋 담당) 은 건드리지 않고 그 모델을 다시 씀 (새 모델이 생기면 model 만 바꿈).
# 음식: 편의점에서 플레이어 손님이 계산하면 받음 (store.yml players.food). 상점이 사지도 팔지도 않음.
#   컵라면은 뜨거운 물을 부어야 먹을 수 있음: 편의점 온수기를 들고 우클릭 → *_hot (store.yml players.hot)
# 권리증: 상점 탈것 칸에서 팜 (shop.yml). 내 땅에서 들고 우클릭하면 그 등급의 가게가 지어짐 (store.yml own.tiers)

# ── 내 가게 권리증 ──────────────────────────────────────────────────────────────────
store_license_alley:
  material: paper
  name: "<#1f9d55><b>GS26 골목점 권리증"
  lore: ["<gray>내 가게 · 손님 2명까지 · 상품 12종", "<gray>내 땅에서 들고 우클릭 → 그 자리에 가게 (17×17칸)", "<gray>윗 등급으로 바꾸면 지금 등급 값을 돌려받음", "<dark_gray>값 500,000 G · 철거하면 권리증으로 돌아옴"]
  model: store_license_alley
  max-stack: 1

store_license_standard:
