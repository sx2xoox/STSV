# 편의점 2차 (README "편의점" · docs/plans/편의점_기획안.md §13): 내 가게 권리증 · 근무자가 받는 음식 몇 가지.
# items/store.yml (가구 · 표시용 상품, 에셋 담당) 은 건드리지 않고 그 모델을 다시 씀 (새 모델이 생기면 model 만 바꿈).
# 플레이어는 편의점에서 물건을 사지 않음 (손님은 NPC 만). 음식은 근무자에게 주는 것만 남김: 사탕 (진상 · 장면의 선물, store.yml gifts),
#   폐기 삼각김밥 (폐기 버릴 때 하나, store.yml waste.food), 바나나우유 (다른 곳의 보상). 상점이 사지도 팔지도 않음.
# 권리증: 상점 탈것 칸에서 팜 (shop.yml). 내 땅에서 들고 우클릭하면 그 등급의 가게가 지어짐 (store.yml own.tiers)

# ── 내 가게 권리증 ──────────────────────────────────────────────────────────────────
store_license_alley:
  material: paper
  name: "<#1f9d55><b>GS26 골목점 권리증"
  lore: ["<gray>손님 2명 · 상품 12종 · 17×17칸", "<gray>내 땅에서 우클릭", "<dark_gray>500,000 G"]
  model: store_license_alley
  max-stack: 1

store_license_standard:
  material: paper
  name: "<#1f9d55><b>GS26 표준점 권리증"
  lore: ["<gray>손님 4명 · 상품 22종 · 17×17칸", "<gray>내 땅에서 우클릭", "<dark_gray>1,500,000 G"]
  model: store_license_standard
  max-stack: 1

store_license_large:
  material: paper
  name: "<#1f9d55><b>GS26 대형점 권리증"
  lore: ["<gray>손님 6명 · 상품 33종 · 17×17칸", "<gray>내 땅에서 우클릭", "<dark_gray>3,000,000 G"]
  model: store_license_large
  max-stack: 1

# ── 음식 (근무자가 받는 것) ─────────────────────────────────────────────────────────────
store_food_banana_milk:
  material: paper
  name: "<white>바나나우유"
  lore: ["<gray>단지 모양 바나나우유", "<dark_gray>GS26 편의점"]
  model: store_item_banana_milk
  food:
    nutrition: 3
    saturation: 2.4
    animation: drink

store_food_candy:
  material: paper
  name: "<white>사탕"
  lore: ["<gray>할머니가 쥐여 주던 그 사탕", "<dark_gray>GS26 편의점"]
  model: store_item_candy
  food:
    nutrition: 1
    saturation: 0.2
    always-eat: true
    seconds: 0.8

store_food_waste:
  material: paper
  name: "<white>폐기 삼각김밥"
  lore: ["<gray>유통기한이 막 지난 것", "<dark_gray>GS26 편의점"]
  model: store_item_samgak_tuna
  food:
    nutrition: 5
    saturation: 3.0
