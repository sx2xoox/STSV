  name: "<#1f9d55><b>GS26 대형점 권리증"
  lore: ["<gray>내 가게 · 손님 6명까지 · 상품 33종", "<gray>내 땅에서 들고 우클릭 → 그 자리에 가게 (17×17칸)", "<gray>윗 등급으로 바꾸면 지금 등급 값을 돌려받음", "<dark_gray>값 3,000,000 G · 철거하면 권리증으로 돌아옴"]
