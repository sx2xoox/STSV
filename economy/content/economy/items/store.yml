# 편의점 알바 (docs/plans/편의점_기획안.md §15 작업 계약): the GS26 store's furniture, goods and props.
# 모델: tools/assetgen/models/store.py (python3 tools/assetgen/store_assets.py), 미리보기: docs/previews/store_assets.png
# 아무도 갖지 않음 (상점이 사지도 팔지도 않음): 편의점 건설이 가구를 놓고, 근무 로직이 나머지를 ItemDisplay 로 띄움.
# 관리자는 /give 로 놓을 수 있음.
#
# 칸 · 좌석 약속 (가구, core furniture):
#   - 앞 = -z (모델 북쪽). 모델 +x = 앞에서 보아 왼쪽. 칸 [x, y, z] 는 기준 칸 (0, 0, 0) 에서의 칸 (가구를 돌리면 함께 돎).
#   - 3×1 (계산대 · 담배장 · 시식대 · 파라솔): x -1..1. 2×1 (냉장 · 냉동): x 0..1. 1×3 (진열대): z -1..1, 양쪽 (-x · +x) 이 손님 쪽.
#     5×1 (간판): x -2..2. 높이 2 = y 0..1.
#   - 벽에 붙는 것 (담배장 · 냉장 · 전자레인지 · 온수기 · 시식대 · 간판): 등 = +z 쪽 칸 끝에 벽.
#   - 좌석 순서 = 로직의 자리 번호: 시식대 0 1 2 = x -1 0 1 (모두 +z 창 쪽을 봄, facing 180),
#     파라솔 0 = x -1 (탁자 +x 를 봄, facing 90), 1 = x +1 (facing -90). facing: 0 = -z, 90 = +x, 180 = +z.
#   - 막힘(barrier)은 모델이 칸을 30% 넘게 채울 때만 (좌석 칸은 비움).
#   - 계산대 위 자리 (모델 px, 기준 칸 x 0..16 · z 0..16 · 바닥 y 0): 손님 물건 놓는 매트 x -14..2, z 2..12, 윗면 y 15.25 /
#     손님 쪽 화면 (텍스트 표시 자리) 면 x 1.5..8, y 19.5..24.5, z 1.5 (-z 를 봄) / POS 화면은 점원 쪽 (+z) /
#     카드 단말기 x 19..23, z 2.5..9 (자판 면이 손님 쪽 -z 를 보고 뒤끝이 들림) / 봉투 걸이 x -15.5..-11.5 (점원 쪽 +z 밖).
#   - POS 모니터 화면 (점원이 읽음. 대기 화면: 위 1 px 초록 띠 말고는 빈 검은 칸 → 합계 · 거스름돈 TextDisplay 자리):
#     판 x 9..17 (폭 8 px = 0.5칸), 면을 따라 높이 5.5 px (0.34칸), 아래 끝 (y 19.69, z 11.46) · 위 끝 (y 24.77, z 9.36).
#     가운데 (13, 22.23, 10.41). 면의 바깥 방향 (0, 0.383, 0.924) = 점원 쪽 (+z) 을 보며 22.5° 위로 (윗변이 점원에게서 멀어지게
#     뒤로 누움: 모델 x 축 -22.5° 회전, 축 (13, 19.5, 11)). 글자 칸 (초록 띠 아래): 폭 7 px · 면을 따라 3.9 px, 가운데 (13, 21.94, 10.53).
#     블록 단위 (기준 칸 원점): 글자 칸 가운데 (0.8125, 1.371, 0.658), 법선 위와 같음, 글자는 면에서 0.01칸 앞으로.
#   - 현금 트레이 (손님 쪽, 낸 돈 · 거스름돈을 쌓는 자리): 접시 안쪽 x 10.5..15.5, z 2.5..6, 바닥 y 15.5 → 가운데 (13, 15.5, 4.25)
#     = 블록 (0.8125, 0.969, 0.266). 지폐 (7 × 3.5 px) 는 0.55배면 접시 안에 들어감, 같은 권종은 y +0.004칸씩 쌓기.
#   - 시식대 상판: 윗면 y 14 (0.875칸), 깊이 z 12..16 (칸 안 0.75..1.0, 창 쪽 +z), 너비 x -16..32 (세 칸) → 컵은 각 칸 가운데,
#     y 0.875, 칸 안 z 0.875 (상판 가운데).
#
# 표시 전용 (ItemDisplay, 변환 없음 = 모델의 (8, 8, 8) 이 위치, 앞 = 북 -z):
#   상품 · 상자 · 봉투 · 엎지른 음료 · 빈 컵라면 · 카드 · 지폐 · 동전: 바닥 = 위치 (모델 y 8), 가운데 정렬.
#   버튼 · 스캐너: 위치 = 가운데. 상품은 손님 손에 쥘 때 (thirdperson_righthand) 주먹에 똑바로 섬.
#   조끼 store_vest: 가슴 칸에 입으면 economy:store_vest 갑옷 층 (초록 조끼 · 이름표, assets/economy/equipment/store_vest.json).
#
# 3차 (§16 새 모델, 미리보기 docs/previews/store_assets_3.png): 발주 단말기 store_order_tablet (가구 1×1, 계산대 옆), 신분증
#   store_id_card (바닥 = 위치, 북쪽에서 읽음; 글씨 칸 = 모델 px x 7.2..10.8 · z 6.5..8.7, 윗면 y 8.25: 이름 · 생년은
#   TextDisplay 로 얹음), 점장 조끼 store_vest_manager · 야간 조끼 store_vest_night (가슴 칸, store_vest 와 같은 방식).
#   권리증 모델 store_license_alley · standard · large 는 아이템이 items/store_extra.yml 에 있음 (model: 만 여기 모델).
#
# §17 행동을 눈으로 (미리보기 docs/previews/store_assets_4.png, models/store_action.py · store_goods.py):
#   손에 드는 것 store_held_* (주손에 잠깐; 3인칭은 서 있는 플레이어 (팔 18° 앞) 기준, 1인칭 따로):
#     mop 대걸레 (손잡이 비스듬히, 걸레가 발 앞 바닥에) · box_<snack|noodle|daily|meal|drink> 가슴 앞에 안은 배송 상자 ·
#     jug 온수기 물통 (손잡이로 늘어뜨림) · waste_bag 폐기 봉지 (매듭으로) · tray 치운 컵 쟁반 (허리 높이 수평) ·
#     pda 발주기 (화면이 얼굴 쪽) · id 받아 든 신분증 (앞면이 근무자 쪽, 1인칭에서 크게).
#   가구 상태 (기본과 같은 칸 · 기준점, 모델만 바꿔 끼움): store_microwave_open (문이 왼쪽 경첩으로 90° 열려 칸 앞 -z 로
#     6.75 px 나옴, 안 불 켜짐) · _run (창 안 노란 불, 도시락) · _done (불 꺼짐, 김, End) / store_kettle (가득) · _low · _empty
#     (수위 창, 빨간 등) / store_order_tablet_<snack|noodle|daily|meal|drink> (그 묶음을 고르는 화면) · _sent (발주 완료) /
#     store_hanger_empty (빈 옷걸이, 모자는 남음). 모두 앞면 = -z: 근무자에게 보이려면 앞면이 근무 통로 쪽을 보게 놓을 것.
#   사물: store_spill (1단계, 컵 옆) → store_spill_2 → store_spill_3 (닦을수록 작아짐, 바닥 = 위치) · store_wet_sign (미끄럼 주의
#     A자 간판, 바닥 = 위치, 폭 10 · 높이 13.5 px) · store_box_<kind>_open (store_box 와 같은 칸 · 크기, 날개 4장이 밖으로 접힘,
#     안에 상품) · store_trash_cup (store_item_ramen_red 와 같은 치수의 빈 컵, 뚜껑이 뒤로 젖혀 섬).
#   상품 33종은 다시 깎음 (같은 표시 약속 · 비슷한 크기; 우산은 9.6 px 로 줄여 매트 안에 들어감).
#   버튼 store_btn_reset ("다시": 쥔 돈을 0 으로). 버튼 뒷면은 앞과 같은 색 (손님 쪽에서 검은 판이 아님).

