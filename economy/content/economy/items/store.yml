# 편의점 알바 (docs/plans/편의점_기획안.md §15 작업 계약): the GS26 store's furniture, goods and props.
# 모델: tools/assetgen/models/store.py (python3 tools/assetgen/store_assets.py), 미리보기: docs/previews/store_assets.png
# 아무도 갖지 않음 (상점이 사지도 팔지도 않음): 편의점 건설이 가구를 놓고, 근무 로직이 나머지를 ItemDisplay 로 띄움.
# 관리자는 /give 로 놓을 수 있음.
#
# 칸 · 좌석 약속 (가구, core furniture):
#   - 앞 = -z (모델 북쪽). 모델 +x = 앞에서 보아 왼쪽. 칸 [x, y, z] 는 기준 칸 (0, 0, 0) 에서의 칸 (가구를 돌리면 함께 돎).
#   - 3×1 (계산대 · 담배장 · 시식대 · 파라솔): x -1..1. 2×1 (냉장 · 냉동): x 0..1. 1×3 (진열대): z -1..1, 양쪽 (-x · +x) 이 손님 쪽.
#     5×1 (간판): x -2..2. 높이 2 = y 0..1.
#   - 벽에 붙는 것 (담배장 · 냉장 · 전자레인지 · 온수기 · 시식대 · 간판): 등 = +z 쪽 칸 끝에 벽.
#   - 좌석 순서 = 로직의 자리 번호: 시식대 0 1 2 = x -1 0 1 (모두 +z 창 쪽을 봄, facing 180),
#     파라솔 0 = x -1 (탁자 +x 를 봄, facing 90), 1 = x +1 (facing -90). facing: 0 = -z, 90 = +x, 180 = +z.
#   - 막힘(barrier)은 모델이 칸을 30% 넘게 채울 때만 (좌석 칸은 비움).
#   - 계산대 위 자리 (모델 px, 기준 칸 x 0..16 · z 0..16 · 바닥 y 0): 손님 물건 놓는 매트 x -14..2, z 2..12, 윗면 y 15.25 /
#     손님 쪽 화면 (텍스트 표시 자리) 면 x 1.5..8, y 19.5..24.5, z 1.5 (-z 를 봄) / POS 화면은 점원 쪽 (+z) /
#     카드 단말기 x 19..23, z 2.5..9 / 봉투 걸이 x -15.5..-11.5 (점원 쪽 +z 밖).
#
# 표시 전용 (ItemDisplay, 변환 없음 = 모델의 (8, 8, 8) 이 위치, 앞 = 북 -z):
#   상품 · 상자 · 봉투 · 엎지른 음료 · 빈 컵라면 · 카드 · 지폐 · 동전: 바닥 = 위치 (모델 y 8), 가운데 정렬.
#   버튼 · 스캐너: 위치 = 가운데. 상품은 손님 손에 쥘 때 (thirdperson_righthand) 주먹에 똑바로 섬.
#   조끼 store_vest: 가슴 칸에 입으면 economy:store_vest 갑옷 층 (초록 조끼 · 이름표, assets/economy/equipment/store_vest.json).

