# 적재 무게: 탈것 짐칸에 실을 때 물건 1개의 무게 (README "적재 무게"). 묶음은 개수만큼 (연마 진주 64개 = 0.32 × 64 = 20.6).
# 탈것마다 실을 수 있는 무게(payload)는 코어 content/stsv/items/vehicles*.yml 의 cargo.payload (기차는 vehicle.payload).
# 넣으려는 물건이 payload 를 넘으면 짐칸이 받지 않음 (쉬프트 클릭은 들어가는 만큼만). 셜커 상자·번들은 안에 든 것까지 셈
# (상자 자체는 원재료 무게, 안에 든 것은 그것의 무게).
#
# 진짜 무게는 하역장이 사는 것(완제품 = 직업 기계 레시피 결과 ∩ 상점 판매, README "하역장")만.
# 그 밖의 모든 것(작물·씨앗·잡은 물고기·광석·원석·보석 원석·원목·나무·돌·흙·바닐라 블록·전리품·바닐라 도구와 갑옷 ...)은
# raw (64개 한 묶음 = 1). 그래서 원재료는 짐칸 칸 수가 한계이고 (리어카 135칸 = 작물 135묶음 = 135, payload 150 안),
# 무게는 하역장 장사(완제품)에서만 한계가 됨. 레시피 재료로도 쓰이는 중간재(밀가루·세공한 보석·강철 괴 ...)도 하역장이 사므로 완제품.
#
# 물건 하나의 무게는 처음 맞는 것:
#   1. items  물건 하나씩 따로 정한 값 (완제품만, DockTest 가 확인. 원재료에 무게를 주려면 그 테스트도 고칠 것)
#   2. 완제품  기본 매입가 ÷ finished-value-per-weight. 기본 매입가 = 상점 기준가 × 기본 docks.price-ratio (0.9).
#              하역장마다 따로 정한 매입가는 쓰지 않음: 어느 하역장으로 가든 무게는 같음. 아주 싼 것도 0.001 보다 가볍지 않음.
#   3. raw    완제품이 아닌 모든 것 (원재료)
#
# 의도: 완제품은 무게 1 에 모두 약 500 G. 비싼 것은 무겁고 싼 것은 가벼워서, 탈것의 payload P 로 한 번에 실어 갈 수 있는
# 값은 물건과 상관없이 최대 약 P × 500 G (배달 오토바이 60 = 30,000 G, 1톤 트럭 1000 = 500,000 G, 탑차 2500 = 1,250,000 G).
# 싼 완제품은 한 개가 아주 가벼워서 무게보다 칸 수가 먼저 찰 수 있음.
finished-value-per-weight: 500
raw: 0.015625     # 1/64: 원재료 64개 한 묶음 = 1

# 물건마다 따로 정한 무게 (완제품만). 비워 두면 모두 위 규칙대로. 쓰는 법: economy:jeweled_crown: 0.5
items: {}
