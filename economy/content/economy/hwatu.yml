# 화투방 /화투방 (README "화투방"). 플레이어끼리만 겨룸 (서버가 상대하는 게임 없음). 판마다 자릿세가 사라져서 언제나 돈이 빠져나가는 곳.
# 칩은 계정에 쌓이는 숫자 (아이템 아님). 골드로만 사고 골드로만 바꿈: 별 · 후원과는 어느 쪽으로도 잇지 않음.

chips:
  buy-price: 100        # 1칩을 살 때 골드
  cash-price: 95        # 1칩을 골드로 바꿀 때 (차이 5 G 는 사라짐). buy-price 이하여야 함
  daily-buy: 0          # 하루(05시 기준)에 살 수 있는 칩. 0 = 제한 없음 (다시 걸려면 예: 5000 = 50만 G)

rake-percent: 5         # 자릿세: 판(모인 칩)의 이만큼, 올림. 사라짐 (나눠 떨어지지 않는 칩도 사라짐)
daily-loss-cap: 0       # 하루에 잃은 칩(잃은 것 - 딴 것)이 이만큼이 되면 그날(05시까지)은 판에 못 앉음 (입장 · 환전은 됨). 0 = 제한 없음 (예: 3000)
min-account-hours: 0    # 처음 들어온 지 이 시간이 안 된 계정은 칩을 사거나 앉을 수 없음 (부계정 돈 옮기기 방지). 0 = 제한 없음 (예: 24)
test-chips: 100000      # /관리자 화투방 시험: 시험 판에서 자리마다 주는 시험용 칩 (진짜 칩이 아님, 모자라면 판 시작 때 다시 채움)

timers:
  turn: 20              # 내 차례 (섯다 다이·콜·레이즈, 홀짝 고르기). 넘기면 섯다는 낼 것이 있으면 다이, 없으면 콜 / 홀짝은 아무거나
  start: 10             # 두 사람 이상 앉으면 첫 판까지
  reveal: 3             # 주사위 · 홀짝 주사위를 굴리는 시간
  result: 6             # 결과를 보여 주는 시간 (그다음 바로 다음 판)

# 방: 판돈(ante, 칩)으로 셋. 앉으려면 한 판이 가져갈 수 있는 만큼만 칩이 있으면 됨 (홀짝 · 주사위 = 판돈, 섯다 = 판돈 + 레이즈 전부(재경기 포함)):
# 그래야 판 도중에 칩이 모자라는(음수가 되는) 일이 없음
rooms:
  - { id: beginner, name: "초보방", ante: 10 }
  - { id: normal, name: "일반방", ante: 100 }
  - { id: high, name: "큰손방", ante: 500 }

games:
  holjjak: { name: "홀짝", max: 2 }                      # 1:1. 먼저 하는 사람이 홀·짝을 부르고 주사위 하나
  dice: { name: "주사위", max: 6, dice: 2 }               # 2~6명. 주사위 2개 합이 가장 큰 사람 (같으면 나눔)
  sutda: { name: "섯다", max: 6, max-raises: 2, replays: 1 }   # 2~6명. 레이즈 = 판돈만큼, 한 판에 두 번까지. 구사 재경기는 한 판에 한 번까지
