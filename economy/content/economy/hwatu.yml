# 도박장 · 화투방 (README "도박장"). /화투방 = 도박장으로 이동. 플레이어끼리만 겨룸 (서버가 상대하는 게임 없음). 판마다 자릿세가 사라져서 언제나 돈이 빠져나가는 곳.
# 칩은 계정에 쌓이는 숫자 (아이템 아님). 골드로만 사고 골드로만 바꿈: 별 · 후원과는 어느 쪽으로도 잇지 않음.

chips:
  buy-price: 100        # 1칩을 살 때 골드
  cash-price: 95        # 1칩을 골드로 바꿀 때 (차이 5 G 는 사라짐). buy-price 이하여야 함
  daily-buy: 0          # 하루(05시 기준)에 살 수 있는 칩. 0 = 제한 없음 (다시 걸려면 예: 5000 = 50만 G)

rake-percent: 5         # 자릿세: 판(모인 칩)의 이만큼, 내림 (5% 면 20칩 안 되는 판은 자릿세 없음: 1칩 판돈의 작은 판을 깎아 먹지 않게). 사라짐 (나눠 떨어지지 않는 칩도 사라짐)
hand-limit-antes: 100   # 한도: 한 사람이 한 판에 넣을 수 있는 칩 = 판돈 × 이만큼 (판돈 · 두 바퀴 · 구사 재경기 모두 합쳐). 넘는 삥 · 따당 · 하프는 한도까지만, 다 차면 콜 · 다이만. 0 = 제한 없음
daily-loss-cap: 0       # 하루에 잃은 칩(잃은 것 - 딴 것)이 이만큼이 되면 그날(05시까지)은 판에 못 앉음 (입장 · 환전은 됨). 0 = 제한 없음 (예: 3000)
min-account-hours: 0    # 처음 들어온 지 이 시간이 안 된 계정은 칩을 사거나 앉을 수 없음 (부계정 돈 옮기기 방지). 0 = 제한 없음 (예: 24)
test-chips: 100000      # /관리자 도박장 시험: 시험 판에서 자리마다 주는 시험용 칩 (진짜 칩이 아님, 모자라면 판 시작 때 다시 채움)

timers:
  turn: 20              # 내 차례 (섯다 삥·체크·콜·따당·하프·다이, 홀짝 고르기). 넘기면 섯다는 낼 것이 있으면 다이, 없으면 체크 / 홀짝은 아무거나
  start: 10             # 두 사람 이상 앉으면 첫 판까지
  roll: 10              # 주사위 · 홀짝 [굴리기] 를 누를 시간 (내 차례). 넘기면 대신 굴림 (차례를 놓친 것: 다음 판은 쉼, [준비])
  reveal: 3             # 다 굴린 뒤 주사위를 보여 주는 시간 (그다음 결과)
  result: 6             # 결과를 보여 주는 시간 (그다음 바로 다음 판)

# 방: 판돈(ante, 칩)으로 셋. 앉으려면: 홀짝 · 주사위 = 판돈, 섯다 = 판돈 × sit-antes.
# 섯다는 올리는 횟수에 제한이 없지만 한 판에 넣는 칩은 한도(판돈 × hand-limit-antes: 초보방 100 · 일반방 1,000 · 큰손방 10,000칩)까지.
# 칩이 모자라면 가진 만큼만 걸고 올인 (사이드 판): 한 판이 가진 칩보다 많이 가져가는 일은 없음 (칩은 음수가 안 됨)
rooms:
  - { id: beginner, name: "초보방", ante: 1 }
  - { id: normal, name: "일반방", ante: 10 }
  - { id: high, name: "큰손방", ante: 100 }

games:
  holjjak: { name: "홀짝", max: 2 }                      # 1:1. 먼저 하는 사람이 홀·짝을 부르고 [굴리기] 로 사발을 흔들어 주사위 하나
  dice: { name: "주사위", max: 6, dice: 2 }               # 2~6명. 시계 방향 차례대로 [굴리기] 로 컵을 흔들어 주사위 2개, 합이 가장 큰 사람 (같으면 나눔)
  sutda: { name: "섯다", max: 6, sit-antes: 3, replays: 1 }   # 2~6명. 한 장 → 베팅 → 한 장 더 → 베팅 → 패 공개. 삥 · 체크 · 콜 · 따당 · 하프 · 다이 (올리는 횟수 제한 없음, 한 판 한도까지, 올인 · 사이드 판).
                                                             # sit-antes: 앉는 데 드는 칩 = 판돈 × 이만큼 (3 = 판돈 · 삥 · 따당 받기). 구사 재경기는 한 판에 한 번까지

# 도박장 건물 안 테이블 (README "도박장"). 테이블 = 코어 가구 economy:gamble_table_round (6자리) · gamble_table_duel (2자리)
hall:
  top: { round: 0.88, duel: 0.77 }   # 테이블 윗면 높이 (가구가 선 블록 바닥에서, 블록). 패 · 칩 · 버튼이 여기 놓임
  big-pot: 1000         # 판(칩)이 이만큼 이상이면 큰 판: 건물 안 효과 · 알림 + 화이트보드 "오늘의 큰 판"
  board-lines: 5        # 화이트보드에 적는 큰 판 수 (05시에 새로)
  radius: 40            # 큰 판 알림 · 효과가 닿는 거리 (블록)
  bots: true            # 시험 판의 봇을 의자에 앉은 마네킹으로 (false = 빈 의자 위 이름표만)
  boss-skin: "economy:entity/bus/site_boss"   # 칩 환전 창구 현장 소장 스킨 (버스 손님과 같은 방식)
