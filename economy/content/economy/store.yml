# 편의점 알바 (README "편의점", docs/plans/편의점_기획안.md) — 1차: 서버가 지은 직영점 (GS26) 에서 알바.
# 2차 (이 파일 아래쪽): 내 가게 3등급 · 신분증 · 진상 응대 12종 · 폐기 · 청소 · 온수 · 날씨 수요. 장면은 store_scenes.yml
# 카운터 뒤 옷걸이를 우클릭하면 근무 시작 (조끼 · 스캐너), 다시 우클릭하면 퇴근 (정산). 자리 비움 shift.afk 초면 자동 퇴근.
# 손님은 마을버스 손님 종류 그대로 (bus.yml types: 이름 · 스킨 · 별난 손님). 여기에는 편의점에 오는 종류 · 취향 · 대사 · 보수만.
# 모든 시각은 게임 시간 (마인크래프트 하루 20분: 06시 = 하루의 시작).

# ── 보수 맞추기 (마을버스 렌트와 비슷한 시간당 수입) ────────────────────────────────────────────────
# 버스 렌트(소형, 운임의 40%): docs/plans/마을버스_3차_수입_기획안.md 표의 "렌트 소형 시간당 약 1.5만" (80 + 0.3 운임 때) ×
#   지금 운임(100 + 도로 0.4, 약 1.3배) ≈ 시간당 약 2만 G.
# 편의점: 손님 간격 spawn.every 20~45초 (평균 32.5초) × 하루의 때 배수 (아래 times 의 every 를 하루 길이로 가중 평균 ≈ 1.15)
#   → 손님이 오는 대로 다 받으면 시간당 약 95명. 실제로 한 사람이 스캔 · 계산 · 진열 · 데우기를 하며 받는 손님은 시간당 약 65~75명
#   (빈 진열대 · 오래 기다리다 나간 손님은 돈 0, ★1).
# 손님 한 명 (몫 떼기 전): base 450 + 팁 (기분 90↑ 250 · 70↑ 150 · 40↑ 50, 평균 약 140) + 정확 60 (실수 없이) ≈ 650 G,
#   퇴근 평점 보너스 (★4.5↑ 15% · ★4↑ 10% · ★3↑ 5%) 평균 약 +10% → 약 715 G.
# 70명 × 715 G ≈ 50,000 G × 직영점 몫 0.4 = 시간당 약 20,000 G (버스 렌트와 같은 자리). 2차의 "내 가게" (몫 100%) 는 약 5만 = 소형 버스.
# 거스름돈을 더 준 것은 pay.overpay-rate 로 바꿔 퇴근 때 뺌 (1,000원 더 주면 100 G).

pay:
  share: 0.4           # 직영점 알바의 몫 (나머지는 본사)
  base: 450            # 손님 한 명 계산해 보내면 (G)
  # 팁: 나갈 때 기분이 at 이상이면 g (위에서부터), × 손님 종류의 bus.yml tip (할머니 2배 …, 최대 tip-cap 배)
  tip:
    - {at: 90, g: 250}
    - {at: 70, g: 150}
    - {at: 40, g: 50}
    - {at: 0, g: 0}
  tip-cap: 2
  accuracy: 60         # 거스름돈 실수 없이 보낸 손님마다
  # 퇴근 평점 보너스: 근무 평균 ★ 이 at 이상이면 번 돈 × (1 + bonus)
  rating:
    - {at: 4.5, bonus: 0.15}
    - {at: 4.0, bonus: 0.10}
    - {at: 3.0, bonus: 0.05}
  # 손님 한 명의 ★: 나갈 때 기분이 at 이상이면 (그냥 나간 손님은 ★1)
  stars:
    - {at: 90, stars: 5}
    - {at: 75, stars: 4}
    - {at: 55, stars: 3}
    - {at: 35, stars: 2}
  overpay-rate: 0.1    # 거스름돈을 더 준 1원마다 이만큼 G 를 보수에서 뺌

# 계산: card 확률로 카드 손님 (단말기 우클릭), 나머지는 현금. 현금 손님은 round-up 확률로 1,000원 단위로 맞춰 내고
# 아니면 금액을 넘는 가장 작은 지폐 한 장. manual: false 면 거스름돈은 계산대가 알아서 (버튼 없음)
cash:
  manual: true
  card: 0.6
  round-up: 0.3
  bills: [1000, 5000, 10000, 50000]
  change: [50000, 10000, 5000, 1000, 500, 100]

# 데워 주세요: 이 상품을 산 손님의 chance 가 부탁. 전자레인지 우클릭 → seconds 초 뒤 "띵" → 다시 우클릭해서 꺼내 줌.
# 띵 하고 forget 초 안에 안 꺼내면 탐 (기분 mood.burnt). 결제를 마친 손님은 계산대를 비우고 통로 쪽에서 기다림 (한 번에 한 명):
# wait 초 안에 전자레인지를 안 돌리면 "그냥 주세요" 하고 그대로 가져감 (기분 sour)
warm:
  items: [dosirak, hotbar]
  chance: 0.5
  seconds: 20
  forget: 20
  wait: 45
  sour: -10

# 줄 · 계산대에서 기다림: grace 초까지는 그대로, full 초에 floor 까지 떨어짐 (bus.yml 손님 종류의 mood 배수만큼 빨리/느리게).
# give-up 초 넘게 기다리면 화내고 나감
patience:
  grace: 20
  full: 90
  floor: 20
  give-up: 120

# 손님: every 초에 한 명 (× 하루의 때 times.*.every), 안에 max-inside 명까지 (줄 포함), speed 걷는 빠르기 (칸/틱)
spawn:
  every: [20, 45]
  max-inside: 6
  queue: 5
  speed: 0.16

shift:
  afk: 180             # 이 초 동안 움직이지도 누르지도 않으면 자동 퇴근
  away: 30             # 가게에서 24칸 넘게 이 초 동안 떠나 있으면 자동 퇴근

# 기분: 처음 start, 거스름돈 딱 맞음 exact, 덜 줌 short, 더 줌 over (손님은 좋아함), 찾던 물건이 빔 empty (한 번에),
# 데운 걸 받음 warmed, 태움 burnt
mood:
  start: 80
  exact: 5
  short: -25
  over: 5
  empty: -15
  warmed: 5
  burnt: -25

# 배송 트럭: 게임 시각 hours 마다 창고 문 앞에 상자 (빈 진열대 · 덜 찬 진열대마다 하나). 근무 중일 때 옴
delivery:
  hours: [7, 19]

recognize-at: 10       # 버스로 이만큼 넘게 태운 손님 종류는 "어, 기사님 아니세요?"
shiny-chance: -1       # 별난 손님 확률 (-1 = bus.yml shiny.chance 그대로)

# ── 진열대 (진열 상태: 2/3 넘게 = full, 조금이라도 = half, 0 = empty 모델로 바뀜) ─────────────────────────
# box: 이 진열대를 채우는 배송 상자 (economy:store_box_<box>). 냉동고 · 계산대 물건은 떨어지지 않음
shelves:
  snack: {capacity: 14, box: snack}
  noodle: {capacity: 12, box: noodle}
  daily: {capacity: 10, box: daily}
  meal: {capacity: 12, box: meal}
  fridge: {capacity: 18, box: drink}

