# ══════════════════════════════════════════════════════════════════════════════════════════════
# 2차 (기획안 §5 §6 §7 §13): 내 가게 · 신분증 · 진상 응대 · 폐기 · 청소 · 온수 · 날씨 수요
# ══════════════════════════════════════════════════════════════════════════════════════════════

# ── 내 가게 (기획안 §13): 상점 탈것 칸에서 권리증을 사서 내 땅에서 들고 우클릭 → 그 자리에 가게가 지어짐 ─────────────
# 한 사람 한 가게. 가게 터 (17×17칸, 서 있는 곳에서 보는 쪽으로) 가 모두 내가 주인인 땅 안이어야 함.
# 윗 등급 권리증을 쓰면 지금 등급 값을 돌려받고 (= 차액만 냄) 더 크게 다시 지음. 닫힌 가게의 옷걸이를 주인이 웅크리고 우클릭 → 채팅의 [철거] (권리증으로 돌아옴. 근무 중엔 안 됨).
# 보수는 100% 내 몫. 손님 한 명 = base + 계산한 금액(원) × margin + 팁 + 정확 (몫 떼기 전, 1차 와 같은 팁 · 정확 · 평점 보너스).
#   max-inside: 안에 손님 몇 명까지 · items: 손님마다 더 사는 개수 · products: 파는 상품 (all = 전부) · without: 없는 가구
# 시간당 (1차 의 어림 그대로: 기분 약 80, 평점 보너스 10%):
#   골목점: 손님 2명까지라 시간당 약 55명 × (550 + 팁 150 + 정확 60) × 1.1 ≈ 4.6만  (소형 버스 50만: 3~4만 → 일감 섞어 5~7만)
#   표준점: 약 62명 × (450 + 3개 × 약 1,750원 × 0.1 + 150 + 60) × 1.1 ≈ 8.1만    (마을버스 150만: 4~6만 → 8~11만)
#   대형점: 약 62명 × (450 + 3개 × 약 2,050원 × 0.18 + 150 + 60) × 1.1 ≈ 12만     (리무진 300만: 5~8만 → 11~15만)
#   (StoreRulesTest 가 같은 계산으로 확인. 직영점 알바 = 약 2만, 렌트 버스와 같은 자리)
own:
  tiers:
    alley:
      name: 골목점
      price: 500000
      license: economy:store_license_alley
      max-inside: 2
      items: 0
      base: 550
      margin: 0
      # 계산대 1 · 진열대 2 (도시락 · 과자) · 냉장 1. 시식대 · 온수기 · 전자레인지 · 냉동고 없음
      without: [shelf_noodle, shelf_daily, fridge_1, fridge_2, freezer, eatbar, kettle, microwave]
      products: [samgak_tuna, samgak_bibim, samgak_bulgogi, chips, jelly, candy, chocolate, banana_milk, coffee_can, water, soda, gum]
    standard:
      name: 표준점
      price: 1500000
      license: economy:store_license_standard
      max-inside: 4
      items: 1
      base: 450
      margin: 0.1
      # 진열대 4 · 냉장 2 · 시식대 · 전자레인지 · 온수기 · 냉동고
      without: [fridge_2]
      products: [samgak_tuna, samgak_bibim, samgak_bulgogi, chips, jelly, candy, chocolate, banana_milk, coffee_can, water, soda, gum,
                 ramen_red, ramen_mild, ramen_big, dosirak, tissue, umbrella, battery, ice_bar, hangover, lottery]
    large:
      name: 대형점
      price: 3000000
      license: economy:store_license_large
      max-inside: 6
      items: 1
      base: 450
      margin: 0.18
      # 전부: 술 · 담배 · 즉석 조리 (핫바 · 구운 계란) 같은 비싼 상품까지
      without: []
      products: all

# ── 신분증 (기획안 §5): items 를 든 어려 보이는 손님 → 계산대 위 [신분증 확인] [판매] [거절] ─────────────────
# 신분증의 해로 연 나이 age 살이 넘으면 성인. 형 · 언니 신분증 (sibling) 은 해는 성인이지만 사진이 다른 얼굴 → 거절이 맞음.
# 미성년자에게 팔면 벌금 fine G (보수에서), 미성년자를 거절하면 bonus G, 성인을 괜히 거절하면 기분 refused-adult.
# kinds: young 어려 보여서 물어볼 확률 · minor 그중 진짜 미성년자 · sibling 미성년자가 형 신분증을 낼 확률 · tries 평소 안 사는데 사 보는 확률
id:
  items: [soju, beer, cigarette]
  age: 19
  fine: 3000
  bonus: 300
  refused-adult: -35
  refused-minor: -10
  kinds:
    student: {young: 1, minor: 1, sibling: 0.5, tries: 0.08}
    tardy: {young: 1, minor: 1, sibling: 0.3, tries: 0.04}
    univ: {young: 0.6, minor: 0.15, sibling: 0, tries: 0}
    soldier: {young: 0.5, minor: 0, sibling: 0, tries: 0.1}
    couple: {young: 0.25, minor: 0, sibling: 0, tries: 0}
  names: [김민준, 이서연, 박지호, 최수아, 정우진, 강하은, 조현우, 윤지민, 장도윤, 임채원, 한지훈, 오유나]
  talk:
    ask: ["이거요…", "이것도 같이 계산이요"]
    show: ["여기요…", "아 신분증이요? 네 여기요", "…여기요"]
    sold: ["감사합니다~", "네~ 수고하세요"]
    sold-minor: ["헉 감사합니다!", "앗싸… 아니 감사합니다!"]
    refused-minor: ["아… 네…", "그냥 이것만 할게요", "형한테 혼나겠다…"]
    refused-adult: ["저 스물다섯인데요?!", "제가 그렇게 어려 보여요? …칭찬이죠?", "아 진짜, 신분증 보여 드릴까요?!"]

# ── 근무자가 받는 음식 (진상 응대 · 장면의 선물): 상품 -> 음식 아이템 (items/store_extra.yml) ─────────────────────
# 플레이어는 편의점에서 물건을 사지 않음 (손님은 NPC 만, 진열대 · 계산대는 근무자만). 할머니가 쥐여 주는 사탕 같은 것만 여기.
gifts:
  candy: economy:store_food_candy

# ── 폐기 (기획안 §5): place 진열대에서 근무 every 초마다 하나씩 유통기한이 지남 (빨간 딱지, most 개까지) ──────────────
# 손님이 집으면 항의 (기분 complain). 근무자가 그 진열대를 우클릭하면 폐기를 들고 → 폐기 바구니 우클릭으로 버림.
# 버릴 때 하나는 내 것 (food: 알바의 낙). 공시생은 폐기를 "몰래 하나 더" 받고 싶어 함 (진상 exam)
waste:
  place: meal
  every: 240
  most: 3
  complain: -15
  food: economy:store_food_waste

# ── 청소 · 온수 (기획안 §5) ─────────────────────────────────────────────────────────────────────
# 음료를 꺼낸 손님이 spill 확률로 통로에 쏟음 (messy 종류는 그 배). 엎지른 곳 · 시식대에 남긴 컵 하나마다 들어오는 손님 기분 mood
# (most 개까지). 대걸레 통을 우클릭해 대걸레를 들고 → 쏟은 곳을 바라보고 우클릭. 컵은 그냥 바라보고 우클릭.
# 온수기: 컵 water 잔. 컵라면 손님이 한 잔씩 씀, 비면 실망 (dry). 근무자가 온수기를 우클릭하면 가득.
# 컵라면 손님은 eat 확률로 시식대에서 eat-seconds 초 먹고 감, cup 확률로 컵을 두고 감
mess:
  spill: 0.03
  messy: {kid: 3, drunk: 3, prankster: 3}
  mood: -6
  most: 3
  water: 8
  dry: -12
  eat: 0.5
  eat-seconds: [15, 30]
  cup: 0.5

# ── 날씨 · 달력 (기획안 §6): 비 오면 우산, 여름엔 아이스크림 (가게에 있을 때만), 장날 (버스 달력) 엔 손님 market 배 ─────────
demand:
  rain: {chance: 0.35, items: {umbrella: 1}}
  summer: {months: [6, 7, 8], chance: 0.3, items: {ice_bar: 2, ice_cone: 1}}
  market: 1.5

# ── 진상 응대 12종 (기획안 §6 표) ─────────────────────────────────────────────────────────────────
# 손님 머리 위 (계산대에선 손님과 근무자 사이, 매트 위) 에 버튼 2~3개 → 바라보고 우클릭. 정답이 하나가 아님: 그 손님의 기분 · 같이 있는 사람에 따라 다름.
#   good: 좋은 응대 보너스 (G) · catch: 슬쩍 손님 잡기 · parcel: 택배 접수 · hangover: 취객에게 숙취해소제
#   lottery: 즉석복권 큰 당첨 big · 작은 당첨 small 확률 · ghost: 새벽 (1~5시) 1초마다 빈 문 종이 울릴 확률
# list.<종류>: kind 버스 손님 종류 (bus.yml), chance 그 손님이 올 때 이 진상일 확률, buttons 버튼 글씨, talk 대사
troubles:
  good: 150
  catch: 300
  parcel: 300
  hangover: 400
  lottery: {big: 0.03, small: 0.2}
  ghost: 0.003
  list:
    banmal:   # 반말 아저씨: "야, 그거." 어떤 건지 말을 안 함. 기분 좋을 때 반말 지적은 통하지만 아니면 나가 버림
      kind: rude
      chance: 0.6
      buttons: {ask: "어떤 걸로 드릴까요?", scold: "반말은 좀…", guess: "(아무거나 집어 준다)"}
      talk:
        start: ["야, 그거.", "어이, 그거 하나.", "그거 줘, 그거. 빨리."]
        ask: ["…아까 그 파란 거.", "저거.", "…그래, 저거 말이야."]
        scold-ok: ["…주세요. 됐지?", "흠, 그거 주시오.", "…알았어, 알았다고."]
        scold-bad: ["뭐? 장사를 이따위로 해?!", "어린 게 어디서! 안 사!"]
        guess-ok: ["…어, 그거 맞네.", "그래, 그거."]
        guess-bad: ["이거 말고!", "아니 그거 말고 저거!", "눈치가 없어, 눈치가."]
    refund:   # 환불 손님: 영수증 없이 먹다 남은 걸 환불해 달라 함. 들어주면 그 값은 내 돈
      kind: complainer
      chance: 0.5
      buttons: {refuse: "죄송하지만 안 돼요", refund: "(환불해 준다)"}
      talk:
        start: ["이거 먹다 보니 맛이 이상해요. 환불해 줘요", "영수증? 그런 걸 누가 챙겨요. 환불이요", "반 먹었는데 별로라서요. 돈 돌려줘요"]
        refuse-ok: ["…규정이 그렇다니 할 수 없죠", "흥, 다음부턴 맛있는 걸 갖다 놔요", "알았어요, 알았어"]
        refuse-bad: ["본사에 전화할 거예요!", "이 가게 리뷰 다 쓸 거야!", "이런 데서 사지 마세요!"]
        refund: ["진작 이렇게 하지. 수고해요", "어머 친절하네~ 단골 할게요", "그래요, 그래야지"]
    credit:   # 외상 건달: "장부에 달아 놔~". 할머니 · 경찰 · 씨름 선수가 가게에 있으면 알아서 얌전히 계산
      kind: thug
      chance: 0.5
      buttons: {firm: "외상은 안 됩니다", allow: "(이번만 달아 준다)"}
      talk:
        start: ["형님은 외상이지? 장부에 달아 놔~", "어이 알바, 이번 달은 장부에 적어 둬~", "다음에 줄게, 응?"]
        behave: ["…카드 여기 있습니다", "계산하겠습니다…"]
        firm-ok: ["…쳇, 형님이 낸다 내", "알바가 깡이 있네~ 계산해"]
        firm-bad: ["에이, 안 사! 형님 간다", "다음에 보자고~"]
        allow: ["역시 알바가 뭘 아네~ 형님이 기억할게", "크~ 이 동네 인심 좋다"]
    steal:    # 슬쩍 손님: 고르는 척 주머니에 넣음. 나가기 전에 웅크리고 클릭하면 "…계산할게요". 남을 의심하면 상처 (손님마다 한 번만 의심할 수 있음)
      kind: dodger
      chance: 0.5
      buttons: {}
      talk:
        start: ["…", "흠흠.", "휘이~ 휘~"]
        caught: ["…계산할게요", "아, 이거요? 계, 계산하려고 했어요", "…죄송합니다"]
        wrong: ["네? 제가요?! 뭘 훔쳐요!", "주머니 뒤집어 볼까요?! 기분 나쁘네"]
    drunk:    # 취객: 계산하고 시식대에 엎드려 잠듦 (시식대 있는 가게만). 깨우기 / 숙취해소제 건네기 (팁). 오래 두면 들어오는 손님 기분 ↓
      kind: drunk
      chance: 0.6
      buttons: {wake: "손님, 일어나세요~", hangover: "(숙취해소제를 건넨다)"}
      talk:
        start: ["딱 오 분만… 쿨…", "여기가… 우리 집 식탁인가… 쿨…", "…쿨… 쿨…"]
        wake-ok: ["어… 미안혀~ 딸꾹, 갈게~", "어이쿠, 내가 잤어? 고마워~", "집에 가야지~"]
        wake-bad: ["으응… 오 분만 더…", "왜 깨워~ 꿈에서 장가갔는디~"]
        hangover: ["크~ 이거여 이거! 알바생 최고여~", "살았다~ 딸꾹, 이건 팁이여~", "정신이 번쩍 드네~"]
        self: ["…여기 어디여? 딸꾹", "어이쿠, 집에 가야지~"]
    kid:      # 100원 모자란 초등학생: 동전을 세어 보다 100원 모자람. 깎아 주면 큰 호감 (100원은 내 돈)
      kind: kid
      chance: 0.4
      buttons: {discount: "100원 깎아 줄게", refuse: "하나 빼고 사자"}
      talk:
        start: ["…100원이 모자라요", "어… 100원이 없어요…", "엄마가 준 돈이 이게 다인데…"]
        discount: ["우와! 감사합니다아!", "다음에 꼭 100원 갖다드릴게요!", "최고예요! 히히"]
        refuse: ["힝… 이거 뺄게요…", "…네에"]
    grandma:  # 할머니: 지갑을 한참 찾음. 기다려 드리면 사탕 하나 쥐여 줌
      kind: grandma
      chance: 0.5
      buttons: {wait: "천천히 하세요~", hurry: "할머니, 뒤에 줄이…"}
      talk:
        start: ["아이고 지갑이 어디 갔노… 잠깐만", "여 있는 줄 알았는데", "젊은이, 쪼매만 기다려 봐라잉"]
        wait: ["아이고 착하다. 이 사탕 하나 묵어", "기다려 줘서 고맙데이. 이거 받아라", "복 받을 끼다"]
        hurry: ["아이고 미안타, 늙은이가 굼떠서…", "미안하데이", "알았다 알았다, 퍼뜩 할게"]
    tourist:  # 외국인 관광객: 손짓으로 물건을 찾음 → 맞는 진열대를 가리키기 (버튼 = 진열대 이름)
      kind: traveler
      chance: 0.5
      buttons: {}
      talk:
        start: ["이거… 어디… 있어요?", "Excuse me… 이거… where?", "이거, 이거요!"]
        right: ["오! 감사합니다! Thank you!", "찾았어요! 친절해요!", "와, 알바생 최고예요!"]
        wrong: ["음… 여기 아니에요…", "Oh… 다른 데 있었어요"]
        self: ["괜찮아요, 찾을게요!", "음… 저쪽인가?"]
    exam:     # 공시생: 삼각김밥 하나를 오래 고르다 폐기 시간에 맞춰 옴. 폐기가 있으면 [몰래 하나 더]
      kind: univ
      chance: 0.3
      buttons: {give: "(폐기 하나 몰래 챙겨 준다)", decline: "규정상 안 돼요"}
      talk:
        start: ["혹시… 폐기 남는 거 있어요…?", "…시험이 두 달 남았거든요", "오늘도 독서실 갑니다… 혹시 폐기…"]
        give: ["감사합니다… 합격하면 꼭 다시 올게요", "…힘이 나네요", "이걸로 오늘 버팁니다!"]
        none: ["아, 오늘은 없구나… 괜찮아요", "그쵸, 아직 시간이 안 됐죠…"]
        decline: ["그쵸, 규정이니까요… 죄송해요", "네… 괜히 물어봤네요"]
    parcel:   # 택배 맡기는 사람: 상자를 맡김 (무게 재고 접수)
      kind: resident
      chance: 0.25
      buttons: {accept: "접수해 드릴게요", refuse: "택배는 안 받아요"}
      talk:
        start: ["택배 하나 맡길게요~ 친정에 김치 보내요", "이거 편의점 택배 되죠? 무거워요~", "접수요~"]
        accept: ["고마워요~ 김치 국물 안 새게 잘 쌌어요", "아유 다행이다~ 수고해요", "내일 도착하겠죠? 고마워요~"]
        refuse: ["어머, 여기 택배 안 돼요? 들고 왔는데…", "아유 무거운데… 우체국 가야겠네"]
    lottery:  # 복권 손님: 즉석복권을 그 자리에서 긁음 → 당첨이면 가게가 들썩
      kind: uncle
      chance: 0.5
      buttons: {cheer: "축하드려요!", cheer-none: "다음엔 될 거예요!", shrug: "(못 본 척)"}
      talk:
        start: ["어디 보자…", "이번엔 된다, 이번엔…", "알바도 봐 봐, 기운 좀 줘"]
        big: ["…어? 어어?! 이거 당첨이여!!", "됐다!! 됐어!! 오만 원!!", "이, 이거 1등 맞지?!"]
        small: ["오, 천 원 됐네! 본전이다", "허허, 한 장 더 사라는 거구먼", "작게나마 됐다~"]
        none: ["…꽝이네", "에이, 오늘도 꽝이여"]
        cheer-big: ["알바도 고생했어! 이거 받아!", "오늘은 내가 쏜다! 다들 하나씩 골라!", "허허허, 이 가게가 명당이여!"]
        cheer-small: ["고마워, 다음엔 큰 거 된다~", "허허, 기분 좋네", "본전이면 됐지 뭐"]
        cheer-none: ["그려, 다음엔 되겄지", "허허, 말이라도 고맙네", "내일 또 올게, 내일은 된다"]
        shrug-big: ["…축하 한마디 안 해 주나?", "쳇, 같이 좋아해 줄 줄 알았는데"]
        shrug-small: ["뭐, 본전이지", "흠"]
        shrug-none: ["…쯧, 무심하긴", "말이라도 좀 해 주지"]
    ghost:    # 새벽 유령 손님: 문 종만 울리고 아무도 없음 (분위기만)
      kind: ghost
      chance: 0
      buttons: {}
      talk:
        start: ["……"]   # (쓰이지 않음: 유령 종은 글 없이 종 · 불빛만)

# ══ 3차 + 보완안 (기획안 §8 · §9 · §16): 경력 · 야간 · 발주 · 단골 메뉴 · 2인 근무 · 남의 가게 알바 · 버스 연동 · 러시 · 스캔 단축 · 하루 이벤트 ══
# 숫자는 모두 store.yml 에서만 바꿈. G 는 "몫 떼기 전" (직영점은 그 40%, 내 가게는 100%) 이라고 적은 곳만 몫을 뗌.

# ── 경력 (§8): 받은 손님 수 (근무한 모든 가게 합) 로 오름. 한 번 오르면 내려가지 않음. 오르면 본인에게만 알림 ──────────
# 알바 = 야간 근무 · 선임 = 발주 · 점장 대리 = 폐기 할인 스티커 · 2인 근무의 계산 자리 · 점장 = 칭호 · 점장 조끼 · 간판 아래 "이달의 점장"
career:
  ranks:
    trainee: {name: 수습, at: 0}
    parttime: {name: 알바, at: 50}
    senior: {name: 선임, at: 300}
    deputy: {name: 점장 대리, at: 800}
    manager: {name: 점장, at: 2000}
  title: economy:store_manager          # 점장이 되면 (titles/titles.yml)
  vest-manager: economy:store_vest_manager
  vest-night: economy:store_vest_night  # 야간 근무 (야간 시각에 출근) 에 입는 조끼 (점장 조끼보다 먼저)
  # 스캔 단축 (보완안): 스캐너 한 번에 찍는 개수. 단골 (그 손님 종류를 regulars.at 번 넘게 받음) 의 장바구니는 한 번에 전부 (묶음 스캔)
  scan: {trainee: 1, parttime: 1, senior: 2, deputy: 2, manager: 3}

# ── 야간 근무 (알바부터): 게임 시각 from ~ to 에 출근하면 야간 근무 (야간 조끼). 그 시각에 받은 손님은 보수 × pay ────────────
# 수습은 야간에 출근할 수 없음. boost: 야간 근무 중 이 손님 종류가 이만큼 더 자주 (취객 · 새벽 손님)
night:
  rank: parttime
  from: 20
  to: 6
  pay: 1.3
  boost: {drunk: 1.6, nurse: 1.5, rider: 1.3, worker: 1.3, ghost: 1.5}

# ── 폐기 할인 스티커 (점장 대리부터): 폐기를 집은 손님이 항의하지 않고 반값 스티커로 사 감 (기분 +mood, 보너스 bonus G 몫 떼기 전) ──
sticker:
  rank: deputy
  mood: 3
  bonus: 40

# ── 발주 (선임부터, §8): 계산대 옆 발주 단말기 (store_order_tablet) 우클릭 = 내일 (다음 게임 하루) 힘줄 묶음을 하나씩 넘겨 봄,
# 웅크리고 우클릭 = 그걸로 발주. 다음 날 그 가게의 "오늘 잘 나가는 것" 이 발주와 같으면 그날 그 묶음 상품이 팔릴 때마다 hit G,
# 첫 손님 때 first G 한 번. 다르면 miss G 만 (잃는 돈 없음). 근무 중이 아니어도 발주할 수 있음 (퇴근하며).
# 그날 잘 나가는 것 (위에서부터 먼저): 비 = rain · 장날 = market · 여름 달 (demand.summer.months) = cold · 주말 = night · 그 밖 = snack
order:
  rank: senior
  hit: 60
  miss: 15
  first: 600
  groups:
    rain: {name: 우산 · 따끈한 것, products: [umbrella, coffee_cup, ramen_red, ramen_mild, ramen_big, hotbar]}
    market: {name: 도시락 · 생활용품, products: [dosirak, samgak_tuna, samgak_bibim, samgak_bulgogi, tissue, battery, bandage]}
    cold: {name: 음료 · 아이스크림, products: [ice_bar, ice_cone, soda, ion_drink, water, coffee_can]}
    night: {name: 술 · 안주, products: [soju, beer, hangover, egg, chips, shrimp]}
    snack: {name: 과자 · 간식, products: [choco_snack, jelly, chocolate, candy, banana_milk, gum]}

# ── 단골 메뉴 (§4): 같은 사람 종류를 at 번 넘게 받으면, 그 손님은 chance 로 아무것도 안 고르고 "늘 먹던 걸로" 라고만 함 →
# 그 사람의 메뉴 (menu) 가 있는 진열대 · 냉장고 · 냉동고를 근무자가 우클릭하면 꺼내 줌 (기분 +mood, 팁 × tip). 틀린 곳이면 기분 wrong (한 번만)
# 과 함께 메뉴 이름을 말해 줌. hint 초 동안 못 찾아도 말해 줌. 그 진열대가 비어 있으면 "늘 먹던 걸로" 손님은 오지 않고, 그새 다 팔렸으면
# 다음에 온다며 그냥 감 (놓친 손님 아님). 처음 맞히면 인물 도감 그 사람 칸에 "단골 메뉴: …" 가 적힘 (근무자마다)
regulars:
  at: 5
  chance: 0.3
  mood: 15
  tip: 2
  wrong: -6
  hint: 20
  menu:
    resident: tissue
    student: banana_milk
    grandma: candy
    office: coffee_can
    tourist: water
    vip: coffee_cup
    farmer: ion_drink
    hiker: chocolate
    fisher: ramen_red
    soldier: choco_snack
    couple: ice_cone
    drunk: ramen_big
    courier: ion_drink
    nurse: coffee_cup
    chatty: shrimp
    rider: hotbar
    youtuber: jelly
    uncle: egg
    univ: ramen_red
    worker: coffee_can
    kid: jelly
    tardy: samgak_tuna
    traveler: water
    rude: soda
    thug: soda
    ghost: ice_bar
    monk: water
    police: coffee_can
    camper: ramen_mild
    market: samgak_bibim
    complainer: water
    dodger: chips
    prankster: choco_snack
    gentleman: coffee_cup
    phone: ion_drink
    wrestler: dosirak
    bride: chocolate
  talk:
    ask: ["늘 먹던 걸로요.", "늘 먹던 거요~", "그거요, 늘 먹던 걸로!", "아시죠? 늘 먹던 걸로."]
    hint: ["…{item}요. 늘 먹던 거.", "에이, {item}! 맨날 사 가잖아요~", "{item}요…"]
    right: ["역시! 기억하시네요~", "와, 말 안 해도 아시네!", "이 맛에 여기 온다니까요"]
    wrong: ["아니 그거 말고요…", "어… 그건 아닌데?"]
    none: ["없네요, 다음에 올게요", "아, 다 나갔구나… 다음에요"]

# ── 2인 근무 (§8 · §13): 근무 중인 가게의 옷걸이를 다른 사람이 우클릭하면 둘째로 출근 (직영점 · two 등급의 내 가게).
# 첫째 = 계산 (손님마다 보수), 둘째 = 진열 (진열 · 폐기 · 청소 · 컵 · 온수 한 번마다 보수 + 손님이 계산할 때마다 assist).
# 점장 대리 이상이 둘째로 오고 첫째가 그보다 아래면 계산 자리를 맡음. 근무자가 웅크리고 옷걸이 우클릭 = 둘이 자리 바꾸기.
# 첫째가 퇴근하면 둘째가 계산을 이어받음. 모두 G 몫 떼기 전, 할 때마다 바로 받음.
# 남의 가게 알바 (§13): 내 가게가 아닌 가게 옷걸이 우클릭 = 알바 지원 → 주인의 채팅에 지원자 이름과 [채용] [거절] (주인이 없을 때
# 지원하면 접속했을 때 알림). 받아 준 알바는 그 가게에서 혼자서도 근무: 보수의 hired-share, 그때마다 주인에게 owner-cut 이 바로 (접속 안 해도)
staff:
  two: [large]
  hired-share: 0.4
  owner-cut: 0.2
  restock: 600
  chore: 250
  assist: 100
  busy: 0.8          # 둘이 근무하면 손님 간격 × 이것 (더 붐빔)

# ── 버스 연동 (§9) ─────────────────────────────────────────────────────────────────────────────
# radius 칸 안에 버스 정류장이 있는 가게: 계산하고 나간 손님은 carry 확률로 그 정류장에 기다리는 손님이 됨 (산 봉투를 들고, 정류장마다 most 명까지).
# 계산대 손님이 ask 확률로 "다음 버스 언제 와요?" → [버스 알려 주기] 를 누르면 지금 운행 중인 가장 가까운 버스 기사 이름 (없으면 없다고).
# 편의점에서 greet-at 번 넘게 받은 종류의 손님은 그 사람이 운전하는 버스에 타며 알아봄 (반대로 버스는 recognize-at, 위)
bus-link:
  radius: 24
  carry: 0.5
  most: 3
  ask: 0.06
  ask-mood: 6
  greet-at: 10
  talk:
    ask: ["저기, 다음 버스 언제 와요?", "혹시 버스 언제 오는지 아세요?", "버스 놓쳤나… 다음 거 언제 와요?"]
    driver: ["아, {driver} 기사님 버스요? 고마워요!", "{driver} 기사님이 오신대요? 얼른 가야지~", "오, {driver} 기사님! 그분 운전 잘하시던데"]
    none: ["지금은 운행 중인 버스가 없대요… 걸어가야겠다", "버스가 없어요? 에휴, 택시 타야지", "아… 오늘은 버스가 안 다니나 보네요"]
    greet: ["어? 편의점 알바생 아니에요? 운전도 해요?", "어머, 편의점 그분이시네! 버스도 하세요?", "알바생이 운전도 해요? 대단하시다~"]

# ── 러시 타임 (보완안): 게임 시각 windows 마다 (출근 · 하교) 손님이 몰려옴 (간격 × every). seconds 초 안에 target 명을
# 보내면 bonus G (몫 떼기 전) + 팡파레. 화면에 "러시!". 한 창마다 한 번
rush:
  windows: [[7, 9], [16, 18]]
  every: 0.35
  target: 8
  seconds: 150
  bonus: 1500

# ── 하루 이벤트 (보완안): 근무 중 check 초마다 굴려 가끔 하나 (한 가게에 게임 하루 per-day 번까지)
# 정전: 불이 꺼지고 seconds 초 (카드 단말기 먹통 → 현금만, 손님 기분 mood). 뒷벽 차단기 (레버) 우클릭 = 바로 복구 (fix G 몫 떼기 전)
# 수학여행: 학생 min ~ max 명이 gap 초 간격으로 우르르 (가게 안 인원 제한은 그대로)
# 본사 점검: 점검원이 seconds 초 동안 진열대 · 폐기 · 바닥을 봄 → 점수 (100 에서 빈 진열대 -15, 폐기 -10, 어지른 곳 -10, 빈 온수기 -10, 쌓인 상자 -5)
#   pass 이상 = 평점 보너스 good G, fail 미만 = 벌금 fine G
events:
  check: 60
  per-day: 1
  outage: {chance: 0.03, seconds: 60, mood: -5, fix: 200}
  group: {chance: 0.03, min: 8, max: 12, gap: [1, 3], kinds: [student]}
  inspect: {chance: 0.02, seconds: 120, skin: "economy:entity/bus/hq_inspector", kind: office, good: 1500, fine: 800, pass: 70, fail: 40}
  talk:
    outage: ["어? 불 나갔어요?", "깜깜해!", "카드 돼요? …안 되겠네", "정전이에요?"]
    restored: ["오, 불 들어왔다", "휴~ 밝다", "다행이다~"]
    group: ["얘들아 편의점이다!!", "선생님 몰래 빨리빨리!", "야 나 젤리 사 줘!", "줄 서, 줄!"]
    inspect-good: ["음.", "좋네요."]
    inspect-bad: ["여기 비었네요.", "바닥이… 흠.", "폐기가 그대로네요."]
