# ── 하루의 때 (게임 시각 from 시 ~ to 시 전). every: 손님 간격 배수 (작을수록 붐빔), boost: 이 종류가 이만큼 더 자주 ─────────
times:
  dawn: {from: 1, to: 6, every: 2.2, boost: {ghost: 6, nurse: 3, drunk: 2, rider: 2, worker: 1.5}}
  morning: {from: 6, to: 9, every: 0.6, boost: {office: 3, student: 3, tardy: 4, worker: 2, nurse: 1.5, police: 1.5}}
  day: {from: 9, to: 16, every: 1.0, boost: {grandma: 3, resident: 2, market: 3, chatty: 2, courier: 2, tourist: 2, farmer: 2, hiker: 2, monk: 1.5}}
  evening: {from: 16, to: 20, every: 0.7, boost: {student: 3, kid: 3, univ: 2, office: 1.5, fisher: 1.5, camper: 1.5}}
  night: {from: 20, to: 1, every: 1.0, boost: {drunk: 4, couple: 3, rider: 2, univ: 1.5, thug: 2, youtuber: 1.5}}

# ── 기본 대사 (손님 종류에 그 상황 대사가 없을 때) ──────────────────────────────────────────────────
# enter 들어올 때 · browse 고를 때 · pay 계산대에 올려놓을 때 · wait 오래 기다릴 때 · thanks 나갈 때 · angry 화나서 나갈 때
# empty 찾는 게 없을 때 · warm 데워 달라 · short 거스름돈이 모자람 · over 더 받음 · recognize 버스 기사를 알아봄
# card · cash 낼 때 한마디 · burnt 탄 도시락 · warmed 데운 걸 받음
talk:
  enter: ["안녕하세요~", "계세요~?"]
  browse: ["음… 뭐 먹지", "이거 1+1인가?", "신상 나왔네?", "어디 있더라…"]
  pay: ["이거 계산이요~", "이것만 할게요", "계산해 주세요!", "여기요~"]
  wait: ["저기요… 계산이요", "줄이 안 줄어드네…", "언제 되지…"]
  thanks: ["감사합니다~", "수고하세요~", "안녕히 계세요~", "또 올게요!"]
  angry: ["아 됐어요, 다른 데 갈게요", "너무 오래 걸리네!", "여기 다시는 안 와요!"]
  empty: ["어, 다 떨어졌네…", "진열대가 텅 비었잖아", "없어요? 아쉽다…", "이거 언제 들어와요?"]
  warm: ["이거 데워 주세요~", "전자레인지 좀 돌려 주세요!", "따뜻하게 해 주실 수 있어요?"]
  short: ["저기요, 거스름돈이 모자란데요?", "덜 주셨어요!", "어? 이게 다예요?"]
  over: ["어… 더 주셨는데? 감사합니다~", "오늘 운 좋네! 히히", "어 이거 많은데… 뭐 감사요!"]
  recognize: ["어, 기사님 아니세요?", "어? 버스 기사님이 여기 계시네!", "기사님! 오늘은 계산대 지키시네요?"]
  card: ["카드요~", "찍을게요~"]
  cash: ["현금이요~", "여기 있어요"]
  burnt: ["이거… 탔잖아요!", "도시락이 숯이 됐네…", "아 냄새… 다 탔어요"]
  warmed: ["앗 뜨거, 감사합니다!", "따끈따끈하네~", "잘 먹을게요!"]
  # 2차: dry 온수기 물이 없음 · expired 유통기한 지난 걸 집음 · messy 바닥이 더러움 (들어올 때)
  dry: ["어? 뜨거운 물이 안 나오네…", "온수기 물이 없어요?", "컵라면을 생으로 먹으라고요?"]
  expired: ["이거 유통기한 지났잖아요!", "어? 빨간 딱지 붙은 거네…", "폐기를 진열해 놓으면 어떡해요"]
  messy: ["어머, 바닥이 끈적끈적하네", "여기 뭐 쏟았나 봐요", "청소 좀 하지…"]
  # unwarmed 데워 달랬는데 한참 안 데워 줌
  unwarmed: ["…그냥 주세요", "바쁘시네요, 그냥 갈게요", "됐어요, 차가운 대로 먹죠 뭐"]

# ── 손님 (bus.yml 손님 종류만, weight 0 인 숨은 손님은 안 됨) ──────────────────────────────────────
# weight 오는 비율, items [최소, 최대] 고르는 개수 (5개까지), likes 좋아하는 상품 (taste 확률로 여기서, 아니면 아무거나),
# hours [from, to] 이 게임 시각에만, talk 상황별 자기 대사 (없으면 기본 대사)
customers:
  resident:
    weight: 14
    likes: {tissue: 2, egg: 2, water: 2, chips: 2, ramen_mild: 2, battery: 1, umbrella: 1, ice_bar: 1}
    taste: 0.6
    talk:
      enter: ["안녕하세요~ 오늘도 왔어요", "대파는… 없겠지?"]
      browse: ["휴지가 다 떨어졌더라고", "건전지가 어디 있더라~", "애들 간식이나 좀 살까"]
      pay: ["이것 좀 계산해 줘요", "이거 얼마예요?"]
      wait: ["아이고 줄 길다…", "빨래 걷으러 가야 되는데", "천천히 해요, 천천히~"]
      thanks: ["수고해요~ 또 올게", "고마워요, 단골 할게요", "밥 챙겨 먹으면서 해요~"]
      angry: ["에휴, 그냥 시장 가야겠다", "동네 가게가 이래서야…", "다음에 올게요, 바빠서"]
  student:
    weight: 14
    items: [1, 3]
    likes: {samgak_tuna: 4, samgak_bulgogi: 3, jelly: 4, banana_milk: 3, ramen_red: 3, choco_snack: 2, soda: 2}
    hours: [6, 22]
    talk:
      enter: ["안녕하세요오~", "야 편의점 가자 편의점!", "삼김 사러 왔어요!"]
      browse: ["참치마요 남았나?", "아 용돈 얼마 남았지…", "젤리 신상 나왔대!", "매운 거 vs 안 매운 거…"]
      pay: ["이거요! 학생 할인 돼요?", "계산이요~ 빨리요 종 쳐요!"]
      card: ["카드 되죠?"]
      wait: ["아 학원 늦는데ㅠ", "언제 끝나요오…", "줄 실화냐…", "삼김 식겠다…"]
      thanks: ["감사합니다!", "안녕히 계세요~", "내일 또 올게요!", "땡큐요~"]
      angry: ["헐 그냥 갈래요", "학원 늦어서 안 돼요ㅠ", "다른 편의점 가야지…"]
      recognize: ["헐 버스 기사님?!", "기사님 여기서 알바해요? 대박", "어 우리 버스 기사님이다!"]
  grandma:
    weight: 10
    items: [1, 2]
    likes: {candy: 5, tissue: 3, egg: 3, banana_milk: 2, bandage: 2}
    hours: [6, 21]
    talk:
      enter: ["아이고 여가 뭐 이리 밝노", "젊은이, 여 사탕 있나?"]
      browse: ["이게 다 뭐꼬… 글씨가 쪼매해서", "손주 줄 사탕 하나 사야제", "계란은 어디 있노~"]
      pay: ["이거 얼마고? 천천히 해요", "지갑이 어디 갔노… 아 여 있다"]
      card: ["카드 이거 우째 하노…"]
