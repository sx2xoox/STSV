# 장신구 (/장신구): 칸 6개 (반지 2 · 목걸이 · 귀걸이 · 허리띠 · 팔찌). docs/plans/장신구_시스템_기획안.md
# 얻을 때 등급 범위 안에서 수치가 무작위로 정해짐 (굴림 0~1). 실제 효과 = 범위 안의 값 × 강화 누적 배수.
# 효과의 max = "S 최상위 +10" 목표치: S 최대값 = max ÷ 강화 끝 배수(1.6), 등급 범위는 그 비율(grades.range).
# ranges 가 있는 효과는 등급마다 범위를 직접 적음(가방 줄 수, 자석 반경 등).

grades:
  common:     { name: "C", color: "#e8e8e8", range: [0.10, 0.22], subs: [20], refine: 15000, refine-items: { economy:gem_dust: 2 }, reroll: 40000, enhance: 0.2, box: 0.78, drop: 0.85 }
  fine:       { name: "B", color: "#5ab0ff", range: [0.20, 0.40], subs: [10, 30], refine: 60000, refine-items: { economy:gem_dust: 4, economy:tempering_stone: 2 }, reroll: 100000, enhance: 0.4, box: 0.18, drop: 0.13 }
  masterwork: { name: "A", color: "#c58cff", range: [0.38, 0.65], subs: [10, 20, 30], refine: 250000, refine-items: { economy:gem_dust: 6, economy:tempering_stone: 6 }, reroll: 250000, enhance: 1.0, box: 0.036, drop: 0.018, announce-perfect: true }
  treasure:   { name: "S", color: "#ffd36b", range: [0.62, 1.00], subs: [10, 20, 30], sub-floor: 0.5, refine: 800000, refine-items: { economy:gem_dust: 10, economy:tempering_stone: 15 }, reroll: 600000, enhance: 3.0, box: 0.004, drop: 0.002, announce: true, announce-perfect: true }

refines: 3                 # 장신구마다 제련 횟수
reroll-step: 0.20          # 옵션 변경: 같은 장신구에서 할 때마다 값 +20% (누적)
sub-size: 0.2              # 부가 옵션 크기: 그 효과 S 범위 × 0.2

# 강화 (값·단련석은 A 기준, 등급의 enhance 배수를 곱함). add = 그 단계가 더하는 효과(강화 전 값 기준, 더하기)
enhance:
  item: economy:tempering_stone
  charm: economy:guard_charm      # 보호 부적: 하락을 한 번 막음
  drop-from: 6                    # 이 단계부터 실패하면 한 단계 하락
  steps:
    - { add: 0.015, cost: 17000, stones: 1, chance: 0.95 }
    - { add: 0.025, cost: 30000, stones: 2, chance: 0.90 }
    - { add: 0.035, cost: 50000, stones: 3, chance: 0.82 }
    - { add: 0.045, cost: 85000, stones: 4, chance: 0.72 }
    - { add: 0.055, cost: 135000, stones: 6, chance: 0.62 }
    - { add: 0.065, cost: 210000, stones: 8, chance: 0.52 }
    - { add: 0.075, cost: 340000, stones: 11, chance: 0.43 }
    - { add: 0.085, cost: 550000, stones: 15, chance: 0.34 }
    - { add: 0.095, cost: 850000, stones: 20, chance: 0.26 }
    - { add: 0.105, cost: 1350000, stones: 27, chance: 0.19 }
  # 레벨이 강화 상한을 풂: 이 레벨 미만이면 이 단계까지만
  level-caps: { 1: 3, 10: 6, 20: 10 }

# 레벨: Lv n 누적 경험치 = curve × (n-1)². 경험치는 그 효과의 활동(activity)으로, activities 의 값 × 횟수
levels:
  max: 30
  curve: 100
activities:
  mine: 1            # 광석·돌 캐기 한 번
  harvest: 1         # 작물 수확 한 번
  fish: 8            # 물고기 한 마리
  wood: 1            # 원목 한 개
  dig: 1             # 흙·모래·자갈 한 개
  walk: 0.01         # 걸은 거리 1칸
  drive: 0.01        # 운전한 거리 1칸
  machine: 6         # 내가 재료를 넣은 줄이 한 번 완성
  dock: 0.002        # 하역장 판매 1G
  request: 25        # 의뢰 하나
  box: 300           # 장신구 상자·용궁 상자 하나 (감정사의 눈: Lv10 상자 27개, Lv20 약 120개)
  refine: 25         # 강화·제련·옵션 변경 한 번
  jobxp: 0.4         # 직업 경험치 1
  pickup: 0.2        # 아이템 줍기 한 번

# 장신구 상자 (상점 100,000): 효과는 고르게, 등급은 grades.box. 조각 30개 = 상자 1개
box:
  item: economy:acc_box
  fragment: economy:acc_fragment
  fragments: 30
# 활동 중 장신구가 떨어질 확률 (한 번마다, 등급은 grades.drop). 시간당 약 0.3개
drops:
  mine: 0.0005
  harvest: 0.0004
  fish: 0.0025
  kill: 0.003
  machine: 0.004
# 용궁 상자 (용궁 보물): 하나 열 때 나오는 것 (weight 비율)
dragon-chest:
  item: economy:dragon_chest
  loot:
    - { weight: 60, item: economy:acc_fragment, min: 1, max: 3 }
    - { weight: 20, item: economy:tempering_stone, min: 1, max: 2 }
    - { weight: 5, item: economy:gem_dust, min: 2, max: 4 }
    - { weight: 5, item: economy:abalone, min: 1, max: 2 }
    - { weight: 5, item: economy:red_coral, min: 1, max: 1 }
    - { weight: 4.5, fish: rare }
    - { weight: 0.5, accessory: true }

# 효과. slot: ring · necklace · earring · belt · bracelet. max = S 최상위 +10 목표치 (분수: 3.0 = +300%, 1.0 = 100%, 곱하기 효과는 더하는 몫: ×2 = 1.0)
# desc: 장신구 효과 화면(/장신구 효과)에 보이는 한 줄 설명. format: {v} 자리에 값 (pct = ×100 %, factor = ×(1+v), flat = 숫자). cap: 이 값을 넘지 않음. activity: 레벨 경험치. sub: false = 부가 옵션으로 안 나옴
effects:
  mining_speed:    { name: "채굴 속도", desc: "블록을 캐는 속도가 빨라짐", slot: ring, max: 3.0, format: pct, sign: "+", activity: mine }
  vein_burst:      { name: "광맥 폭발", desc: "광석을 캘 때 이 확률로 이어진 같은 광석을 한꺼번에 캠 (최대 32개)", slot: ring, max: 1.0, format: pct, cap: 1.0, activity: mine }
  harvest_wind:    { name: "풍년 바람", desc: "다 익은 작물을 수확할 때 이 확률로 둘레 작물도 같이 수확", slot: ring, max: 1.0, format: pct, cap: 1.0, activity: harvest }
  master_hand:     { name: "장인의 손", desc: "기계 결과물 하나마다 이 확률로 +1 (직업 보너스와 따로 굴림)", slot: ring, max: 0.5, format: pct, activity: machine }
  rich_vein:       { name: "풍부한 광맥", desc: "광석 +1 (광부 보너스)이 나올 때 이 확률로 하나 더", slot: ring, max: 0.7, format: pct, cap: 1.0, activity: mine }
  magnet:          { name: "자석", desc: "이 거리 안에 떨어진 아이템이 나에게 끌려옴", slot: ring, format: flat, unit: "칸", ranges: { common: [2, 3], fine: [3, 4], masterwork: [4, 6.5], treasure: [6.2, 10] }, activity: pickup, sub: false }
  blessing:        { name: "대장장이의 축복", desc: "장신구 강화 실패로 단계가 떨어질 때 이 확률로 막음", slot: ring, max: 0.5, format: pct, cap: 1.0, activity: refine }
  bite:            { name: "손맛", desc: "낚시 입질까지 기다리는 시간이 줄어듦", slot: necklace, max: 0.6, format: pct, sign: "−", cap: 0.9, activity: fish }
  dragon_treasure: { name: "용궁 보물", desc: "물고기를 낚을 때 이 확률로 용궁 상자를 함께 낚음", slot: necklace, max: 0.25, format: pct, cap: 1.0, activity: fish }
  full_net:        { name: "만선", desc: "흔함 · 보통 물고기를 낚을 때 이 확률로 한 마리 더", slot: necklace, max: 1.0, format: pct, cap: 1.0, activity: fish }
  rare_find:       { name: "귀한 발견", desc: "특별 재료(산삼 · 운철 · 붉은 산호 등)가 나올 확률이 이만큼 커짐", slot: necklace, max: 2.0, format: factor, activity: jobxp }
  appraiser:       { name: "감정사의 눈", desc: "장신구 상자 · 드롭에서 A · S 등급이 나올 확률이 이만큼 커짐", slot: necklace, max: 1.0, format: factor, activity: box }
  remote_machine:  { name: "원격 기계", desc: "/원격기계: 이 거리 안의 내 기계 결과물을 멀리서 받음", slot: necklace, format: flat, unit: "칸", ranges: { common: [50, 50], fine: [100, 100], masterwork: [250, 250], treasure: [-1, -1] }, activity: machine, sub: false, enhance: false }
  focus:           { name: "장인의 집중", desc: "기계 작업이 끝날 때 이 확률로 그 줄의 다음 작업이 절반 시간", slot: earring, max: 0.8, format: pct, cap: 1.0, activity: machine }
  machine_haste:   { name: "기계 가속", desc: "내 기계의 작업 시간이 줄어듦", slot: earring, max: 0.4, format: pct, sign: "−", cap: 0.8, activity: machine }
  timber:          { name: "벌목 회오리", desc: "통나무를 벨 때 이 확률로 나무 한 그루가 한꺼번에 베어짐", slot: earring, max: 1.0, format: pct, cap: 1.0, activity: wood }
  quake:           { name: "땅울림", desc: "흙 · 돌 등을 팔 때 이 확률로 둘레 3×3 을 같이 팜", slot: earring, max: 1.0, format: pct, cap: 1.0, activity: dig }
  vein_sight:      { name: "광맥 투시", desc: "웅크리면 이 거리 안의 광석이 벽 너머로 빛나 보임 (나에게만)", slot: earring, format: flat, unit: "칸", ranges: { common: [6, 8], fine: [8, 12], masterwork: [12, 19], treasure: [19, 30] }, activity: mine, sub: false }
  refine_hand:     { name: "제련의 손", desc: "제련할 때 이 확률로 두 번 굴려 높은 쪽을 가짐", slot: earring, max: 1.0, format: pct, cap: 1.0, activity: refine }
  move_speed:      { name: "이동 속도", desc: "걷는 속도가 빨라짐", slot: belt, max: 0.7, format: pct, sign: "+", activity: walk }
  vehicle_speed:   { name: "탈것 가속", desc: "내가 운전하는 탈것이 빨라짐 (서킷 카트 · 빌린 탈것 제외)", slot: belt, max: 0.6, format: pct, sign: "+", activity: drive }
  cargo:           { name: "짐 더 싣기", desc: "내 탈것에 더 많이 실음", slot: belt, max: 0.25, format: pct, sign: "+", activity: drive }
  bag:             { name: "가방", desc: "/가방 이 생김. 이 줄 수만큼 칸 (한 줄 9칸)", slot: belt, format: flat, unit: "줄", ranges: { common: [6, 8], fine: [7, 14], masterwork: [13, 22], treasure: [21, 34] }, cap: 54, activity: pickup, sub: false }
  fortune_find:    { name: "행운의 발견", desc: "채굴 · 수확 · 낚시 등을 하다 장신구가 떨어질 확률이 이만큼 커짐", slot: belt, max: 2.0, format: factor, activity: jobxp }
  dock_bonus:      { name: "하역 웃돈", desc: "하역장에서 받는 돈이 늘어남", slot: bracelet, max: 0.2, format: pct, sign: "+", activity: dock }
  abundance:       { name: "풍작", desc: "수확 보너스(+)가 나올 때 그 하나마다 이 확률로 하나 더", slot: bracelet, max: 0.7, format: pct, cap: 1.0, activity: harvest }
  thrift:          { name: "알뜰한 손", desc: "기계가 재료를 쓸 때 아끼지 못한 재료를 이 확률로 한 번 더 아낌 (같은 줄 연속은 안 됨)", slot: bracelet, max: 0.7, format: pct, cap: 1.0, activity: machine }
  request_bonus:   { name: "의뢰 웃돈", desc: "의뢰 보상 돈이 늘어남", slot: bracelet, max: 1.0, format: pct, sign: "+", activity: request }
  craft_learning:  { name: "장인의 배움", desc: "직업 경험치를 더 받음", slot: bracelet, format: pct, sign: "+", ranges: { common: [0.05, 0.15], fine: [0.13, 0.32], masterwork: [0.30, 0.70], treasure: [0.65, 1.25] }, activity: jobxp }

# 칸 (장신구 창에 놓이는 순서)
slots: [ring, ring, necklace, earring, belt, bracelet]
slot-names: { ring: "반지", necklace: "목걸이", earring: "귀걸이", belt: "허리띠", bracelet: "팔찌" }

# 장신구 순위 (/순위 장신구): 끼고 있는 장신구 점수의 합. 하나의 점수 = 등급 점수 × 강화 배수 × (0.5 + 0.5 × 범위 안 위치)
#   (위치 0 = 범위 맨 아래, 1 = 맨 위·완벽). 빼 둔 장신구는 세지 않음
ranking: { common: 1, fine: 3, masterwork: 10, treasure: 40 }
