    # 2026-11: 어종별 손질을 이것으로 바꿈 (예전 손질감은 shop.yml 의 예전 물건으로 팔 수만 있음). 같은 등급 안에서 값이 비슷한
    # 물고기끼리 묶어 개수만 다름. 크기가 큰 희귀·전설은 그대로 파는 쪽이 나을 수 있음 (재료 칸에서는 크기가 지워짐)
