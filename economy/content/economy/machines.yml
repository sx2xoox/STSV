    - { in: { "#economy:fish_common": 2 }, out: economy:fish_meat, seconds: 30 }   # 생선살 15G x 1 = 15G
    - { in: { "#economy:fish_uncommon_low": 2 }, out: economy:fine_fish_meat, seconds: 60 }   # 고급 생선살 28G x 1 = 28G
    - { in: { "#economy:fish_uncommon": 4 }, out: economy:fine_fish_meat, amount: 3, seconds: 216 }   # 고급 생선살 28G x 3 = 84G
    - { in: { "#economy:fish_uncommon_high": 1 }, out: economy:fine_fish_meat, seconds: 60 }   # 고급 생선살 28G x 1 = 28G
    - { in: { "#economy:fish_rare_1": 2 }, out: economy:prime_fish_meat, amount: 3, seconds: 180, tier: 1 }   # 특선 생선살 46G x 3 = 138G
    - { in: { "#economy:fish_rare_2": 1 }, out: economy:prime_fish_meat, amount: 2, seconds: 132, tier: 1 }   # 특선 생선살 46G x 2 = 92G
    - { in: { "#economy:fish_rare_3": 2 }, out: economy:prime_fish_meat, amount: 5, seconds: 312, tier: 1 }   # 특선 생선살 46G x 5 = 230G
    - { in: { "#economy:fish_rare_4": 1 }, out: economy:prime_fish_meat, amount: 3, seconds: 177, tier: 1 }   # 특선 생선살 46G x 3 = 138G
    - { in: { "#economy:fish_rare_5": 4 }, out: economy:prime_fish_meat, amount: 15, seconds: 930, tier: 1 }   # 특선 생선살 46G x 15 = 690G
    - { in: { "#economy:fish_legend_1": 1 }, out: economy:treasure_fish_meat, amount: 3, seconds: 540, tier: 2 }   # 진귀한 생선살 216G x 3 = 648G
    - { in: { "#economy:fish_legend_2": 1 }, out: economy:treasure_fish_meat, amount: 5, seconds: 780, tier: 2 }   # 진귀한 생선살 216G x 5 = 1080G
    - { in: { "#economy:fish_legend_3": 1 }, out: economy:treasure_fish_meat, amount: 6, seconds: 1080, tier: 2 }   # 진귀한 생선살 216G x 6 = 1296G
    - { in: { economy:pearl: 1 }, out: economy:polished_pearl, seconds: 180, tier: 2 }   # 연마 진주 179G

