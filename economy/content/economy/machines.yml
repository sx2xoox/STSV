    - { in: { gold_ingot: 2 }, out: economy:gold_ring, seconds: 355 }   # 금반지 70G
    - { in: { diamond: 1 }, out: economy:cut_diamond, seconds: 140, tier: 1 }   # 세공 다이아몬드 90G
