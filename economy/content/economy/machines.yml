    name: "씨앗"
    items: [wheat_seeds, beetroot_seeds, melon_seeds, pumpkin_seeds, torchflower_seeds, pitcher_pod,
            economy:tomato_seeds, economy:chili_seeds, economy:strawberry_seeds, economy:onion_seeds, economy:cabbage_seeds,
            economy:rice_seeds, economy:corn_seeds, economy:green_onion_seeds, economy:radish_seeds, economy:lettuce_seeds,
