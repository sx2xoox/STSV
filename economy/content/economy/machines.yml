  compostables:
    name: "묘목·잎·풀·썩은 것"
    items: ["#saplings", "#leaves", short_grass, tall_grass, fern, large_fern, dead_bush, vine, kelp, seagrass,
            rotten_flesh, poisonous_potato, spider_eye]
  stones:
    name: "돌"
    items: ["#stone_crafting_materials", andesite, diorite, granite, tuff, netherrack]
  dirts:
    name: "흙"
    items: [dirt, coarse_dirt, rooted_dirt]

upgrade:
  cost: [10000, 40000, 100000]   # 1강, 2강, 3강 (돈이 빠지는 곳: 3강까지 한 대 150,000G)
  # 같은 종류의 직업 기계를 같은 단계로 또 강화하면: 그 사람이 전에 산 수 × 50% 를 더함 (두 번째 대 1.5배, 세 번째 2배...)
  # 기계를 여러 대 두는 것도 돈이 빠지는 곳. 압착기는 해당 없음. 0 = 끔
  repeat: 0.5
  level: [10, 20, 30]          # 설치한 사람의 그 직업 레벨
  lanes: [1, 2, 3, 4]          # 기본, 1강, 2강, 3강 (기계마다 'lanes:' 로 따로: 대장간·조리대·증류기는 0강부터 2줄)
  speed: [0, 0.15, 0.30, 0.50]
xp-per-gold: 0.2               # 그 직업인 운영자: 생산품 기준가(상점) 5G 당 경험치 1

