# 직업 기계 (가구) 6종 + 공용 기계 압착기. 누구나 설치하고 쓸 수 있음. 그 기계의 직업인 사람이 돌리면 직업 레벨에 따라 빨라지고,
# 경험치와 직업 효과(jobs.yml machine-bonus)를 받음. 재료를 넣은 사람이 그 줄의 운영자.
# 줄(lane): 재료 칸 3개 + 결과 칸 1개. 레시피를 고르지 않으면 넣은 재료로 알아서 고름 (같은 재료로 되는 게 여럿이면 목록 앞쪽).
# 강화는 설치한 사람만: 그 직업 레벨과 골드가 필요. 강화하면 줄이 늘고 빨라지고 새 레시피와 새 모습. 회수해도 강화는 유지.
#
# 레시피: in = { 재료: 개수 } (3종류까지, '#logs' 처럼 태그도 됨), out, amount, seconds (기본 속도의 시간),
#   '#economy:white_fish' 처럼 아래 어종 묶음도 됨
#   tier = 열리는 강화 단계 (0 기본 ~ 3), aging = 숙성 (연금술사 Lv20 숙성 절반 대상)
#   숙성은 10분 이상, 오래 걸리는 만큼 많이 나옴: 재료값을 빼고 1분에 원재료만 3~10G, 기계 생산품을 쓰면 12~25G
#   (재료값의 배율: 기계 생산품 숙성 2.6~3.6배, 원재료만 숙성은 그 기계의 가장 낮은 것 이하, 없으면 3배 이하)
#   "원재료만으로" 물건: 다른 기계의 생산품 없이 밭·광산·바다에서 난 것만으로 만드는 물건 (기계 하나로 되는 대신 효율은 낮음)
#   자동 선택은 줄에 든 재료 '종류'로 고르므로, 같은 기계에서 재료 종류가 똑같은 레시피는 되도록 두지 않음
# effect: 작동 중 파티클·소리, at = 모델 좌표 (16 = 한 칸, 바닥 y 0)

# 묶음: 레시피 재료에 '#economy:<묶음>' 으로 쓰면 묶음 안의 것은 아무거나 됨. 어종 묶음(낚시 물고기 fish.yml)과 압착기 묶음.
# 값이 비슷한 물고기끼리만 묶음: 가장 비싼 것을 넣어도 1.2배 이상 (크기가 큰 희귀 물고기는 파는 쪽이 이득일 수 있음).
# 크기가 붙은 희귀 물고기를 재료 칸에 넣으면 크기가 지워져(가장 작은 크기 값, 매입가 70%) 같은 종류끼리 쌓임.
groups:
  white_fish:
    name: "필렛감 생선"
    items: [cod, economy:sandfish, economy:goby, economy:damselfish, economy:cavefish]
  blue_fish:
