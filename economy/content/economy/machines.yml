    - { in: { coal: 8 }, out: economy:coke, seconds: 100 }   # 코크스 60G
    - { in: { copper_ingot: 8 }, out: economy:copper_plate, seconds: 78 }   # 구리판 48G
    - { in: { economy:rough_ruby: 4 }, out: economy:ruby, amount: 4, seconds: 225, tier: 1 }   # 루비 35G
    - { in: { economy:rough_sapphire: 4 }, out: economy:sapphire, amount: 4, seconds: 450, tier: 1 }   # 사파이어 76G
