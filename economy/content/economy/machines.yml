    - { in: { gold_ingot: 8, economy:ruby_ring: 2, economy:pearl_necklace: 1 }, out: economy:jeweled_crown, seconds: 1080, tier: 3 }   # 보석 왕관 2836G
    # ── 추가 (원석·광물만으로: 다른 기계를 거치지 않음) ──
    - { in: { emerald: 1 }, out: economy:cut_emerald, seconds: 60 }   # 세공 에메랄드 36G
