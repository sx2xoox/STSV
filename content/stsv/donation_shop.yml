# 후원 상점 (/후원): 후원 재화로 사는 상품. 재화는 관리자가 입금을 확인하고 /관리자 후원 지급 <플레이어> <수량> 으로 줌.
#
# 지킬 것 (마인크래프트 서버 운영 규정):
#   - 꾸미기 위주로 팖. 게임에서 유리해지는 것 (돈, 장비, 경험치, 땅, 더 빠른 탈것) 은 넣지 않음.
#     예외: 무한 폭죽 (겉날개로 나는 중에 쏘면 로켓처럼 밀어 줌) 은 서버 주인이 정해서 넣은 것 (지인 서버).
#   - 망토나 망토처럼 보이는 것은 팔지 않음.
#   - 재화는 현금으로 되돌리거나 다른 서버로 옮길 수 없음. 이름을 마인코인과 헷갈리게 짓지 않음.
#   - 값은 사기 전에 보여 주고 (이 상점 화면), 구매 내역을 볼 수 있게 함 (/후원 내역).
#   - 공식 Minecraft 제품이 아니라는 안내를 둠 (아래 notice).
#
# 상품 = id: { name, price (재화), description (상점 칸의 설명: 한 줄 또는 여러 줄 목록), once: true 면 한 번만 살 수 있음,
#              item: 커스텀 아이템 id (인벤토리로 지급. 탈것은 산 사람에게 귀속됨), items: [id, ...] 여러 개를 한 번에 (묶음 상품),
#              unlocks: [종류:id, ...] 산 사람이 영구히 가지는 것 (아이템이 아니라 계정에 남음. 이것만 있는 상품은 한 번만 살 수 있음)
#                  banner:<테마>        칭호 배너 (/칭호 의 칭호 배너 화면에서 장착)   테마 id: /관리자 해금 종류
#                  emote:<감정표현>     감정표현 (/감정표현 휠에 놓고 씀)
#              commands: [콘솔이 실행할 명령어, ...] ({player} = 산 사람의 이름),
#              icon: 상점 칸의 그림을 따로 정할 때 (커스텀 아이템 id, 리소스팩 아이템 모델 "stsv:gui/star", 또는 바닐라 아이템 이름) }
#   item(s) · unlocks · commands 중 하나는 있어야 하고 여럿이어도 됨. 관리자 명령어로 줄 수 있는 것은 commands 로 무엇이든 팔 수 있음:
#     치장      commands: ["관리자 치장 지급 {player} stsv:butterfly_wings"]
#     칭호      commands: ["관리자 칭호 지급 {player} <칭호 id>"]
# 분류 = id: { name, icon (탭 그림: 리소스팩 아이템 모델 또는 바닐라 아이템 이름), products: [상품 id, ...] }. 화면의 탭은 일곱 개까지.
# 값을 고치거나 상품을 더하고 /관리자 리로드. 이미 산 사람의 내역에는 영향 없음.
# 환불 (/관리자 후원 환불 <내역 번호>) 은 값을 돌려주고 unlocks 로 준 것을 도로 가져감 (아이템 · commands 로 준 것은 관리자가 따로).
#
# 별 1개 = 100원 (입금 1,000원마다 별 10개를 지급). 아래 값은 이 기준: 300★ = 30,000원, 250★ = 25,000원, 50★ = 5,000원, 30★ = 3,000원.
# 칭호 배너 · 감정표현 · 스킨북 · 무한 폭죽의 값은 임시로 넣은 것: 서버 주인이 정하면 됨. 안내문의 입금 방법 · 문의처도 서버 주인이 채워야 함.

currency:
  name: "별"
  symbol: "★"

# 상점 맨 위에 보이는 안내 (한 줄씩). 입금 방법 · 문의처를 여기에 적음
notice:
  - "<gray>후원은 서버 운영비에 쓰입니다. 후원 방법과 문의는 서버 공지를 확인해 주세요."
  - "<gray>별 1개 = <white>100원</white>. 입금이 확인되면 관리자가 별을 지급합니다."
  - "<gray>상품은 <white>꾸미기</white>가 중심입니다. 무한 폭죽은 겉날개 비행을 밀어 줍니다."
  - "<dark_gray>이 서버는 공식 Minecraft 제품이 아니며, Mojang 또는 Microsoft 의 승인을 받거나 관련되어 있지 않습니다."

