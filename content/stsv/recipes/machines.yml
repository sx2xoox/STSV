smelter:
  type: shaped
  pattern:
    - "BCB"
    - "SFS"
    - "BPB"
  keys:
    B: minecraft:bricks
    C: minecraft:iron_chain
    S: stsv:steel_ingot
    F: minecraft:blast_furnace
    P: stsv:copper_plate
  result: stsv:smelter

knight_sword:
  type: shaped
  pattern: [" S", " S", "B "]
  keys: { S: stsv:steel_ingot, B: minecraft:copper_ingot }
  result: stsv:knight_sword

steel_helmet:
  type: shaped
  pattern: ["SSS", "S S"]
  keys: { S: stsv:steel_ingot }
  result: stsv:steel_helmet

steel_chestplate:
  type: shaped
  pattern: ["S S", "SSS", "SSS"]
  keys: { S: stsv:steel_ingot }
  result: stsv:steel_chestplate

steel_leggings:
  type: shaped
  pattern: ["SSS", "S S", "S S"]
  keys: { S: stsv:steel_ingot }
  result: stsv:steel_leggings

steel_boots:
  type: shaped
  pattern: ["S S", "S S"]
  keys: { S: stsv:steel_ingot }
  result: stsv:steel_boots
