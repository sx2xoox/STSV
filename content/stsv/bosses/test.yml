# 보스 정의. /stsv boss spawn <id>
#
# 판정(체력, 이동, 충돌)은 보이지 않는 철 골렘이 맡고, 겉모습은 관절(bone)마다 하나씩 띄운 3D 모델이 맡습니다.
# 좌표는 모델 단위(16 = 1블록), 원점 = 발밑 가운데, 앞 = -z(북쪽). 관절 모델(.bbmodel)은 회전 중심(pivot)이
# (8, 8, 8)에 오도록 만듭니다 (tools/assetgen 이 이 파일의 pivot 을 읽어서 그렇게 생성합니다).
#
# 회전 방향 (도, X Y Z 순서):  팔/다리 앞으로 = +X,  몸 앞으로 숙이기 = -X,  고개 들기 = +X,
#                              오른팔(+x 쪽) 바깥으로 = +Z,  왼팔 바깥으로 = -Z
# 애니메이션 키프레임: { 틱: [x, y, z] }  사이는 부드럽게 이어집니다.

test_golem:
  name: "<#ff9a3c><b>테스트 골렘</b>"
  health: 800
  armor: 8
  speed: 0.2            # 이동 속도 (철 골렘 기본 0.25)
  melee-damage: 9       # 기본 주먹 (철 골렘처럼 위로 띄움)
  scale: 1.4            # 판정 크기 = 철 골렘(1.4 x 2.7블록)의 배율
  bar-color: YELLOW
  bar-range: 48         # 이 거리 안의 플레이어에게 보스바 표시
  leash: 40             # 소환 위치에서 이 거리보다 멀어지면 돌아가서 체력 회복
  think: 20             # 몇 틱마다 패턴을 고를지
  global-cooldown: 50   # 패턴 사이 최소 간격(틱)

  model:
    bones:
      body:      { model: stsv:model/test_golem_body,      pivot: [0, 26, 0] }
      head:      { model: stsv:model/test_golem_head,      pivot: [0, 47, -1],  parent: body, look: true }
      arm_r:     { model: stsv:model/test_golem_arm_r,     pivot: [17, 43, 0],  parent: body }
      forearm_r: { model: stsv:model/test_golem_forearm_r, pivot: [18, 30, 0],  parent: arm_r }
      arm_l:     { model: stsv:model/test_golem_arm_l,     pivot: [-17, 43, 0], parent: body }
      forearm_l: { model: stsv:model/test_golem_forearm_l, pivot: [-18, 30, 0], parent: arm_l }
      leg_r:     { model: stsv:model/test_golem_leg_r,     pivot: [7, 20, 0] }
      leg_l:     { model: stsv:model/test_golem_leg_l,     pivot: [-7, 20, 0] }
    # 손 위치 (던지는 바위를 쥐는 곳): 관절과 그 관절 기준 좌표
    sockets:
      hand_r: { bone: forearm_r, at: [18, 8, -2] }

  animations:
    idle:
      length: 60
      loop: true
      bones:
        body:      { rot: { 0: [0, 0, 0], 30: [-2, 0, 0], 60: [0, 0, 0] }, pos: { 0: [0, 0, 0], 30: [0, -0.5, 0], 60: [0, 0, 0] } }
        head:      { rot: { 0: [0, 0, 0], 30: [3, 0, 0], 60: [0, 0, 0] } }
        arm_r:     { rot: { 0: [0, 0, 4], 30: [3, 0, 6], 60: [0, 0, 4] } }
        arm_l:     { rot: { 0: [0, 0, -4], 30: [3, 0, -6], 60: [0, 0, -4] } }
        forearm_r: { rot: { 0: [10, 0, 0], 30: [14, 0, 0], 60: [10, 0, 0] } }
        forearm_l: { rot: { 0: [10, 0, 0], 30: [14, 0, 0], 60: [10, 0, 0] } }
    walk:
      length: 30
      loop: true
      sounds: { 0: entity.iron_golem.step, 15: entity.iron_golem.step }
      bones:
        body:      { rot: { 0: [-5, 3, 0], 15: [-5, -3, 0], 30: [-5, 3, 0] }, pos: { 0: [0, 0, 0], 7: [0, -1, 0], 15: [0, 0, 0], 22: [0, -1, 0], 30: [0, 0, 0] } }
        leg_r:     { rot: { 0: [24, 0, 0], 15: [-24, 0, 0], 30: [24, 0, 0] } }
        leg_l:     { rot: { 0: [-24, 0, 0], 15: [24, 0, 0], 30: [-24, 0, 0] } }
        arm_r:     { rot: { 0: [-20, 0, 4], 15: [20, 0, 4], 30: [-20, 0, 4] } }
        arm_l:     { rot: { 0: [20, 0, -4], 15: [-20, 0, -4], 30: [20, 0, -4] } }
        forearm_r: { rot: { 0: [15, 0, 0], 30: [15, 0, 0] } }
        forearm_l: { rot: { 0: [15, 0, 0], 30: [15, 0, 0] } }
    # 등장: 고개를 숙인 채 꺼져 있다가 화면이 켜지며 일어섬
    spawn:
      length: 50
      sounds: { 0: block.beacon.activate, 28: entity.iron_golem.repair }
      bones:
        body:      { rot: { 0: [-30, 0, 0], 22: [-30, 0, 0], 38: [6, 0, 0], 50: [0, 0, 0] } }
        head:      { rot: { 0: [-35, 0, 0], 26: [-35, 0, 0], 40: [12, 0, 0], 50: [0, 0, 0] } }
        arm_r:     { rot: { 0: [-5, 0, 2], 22: [-5, 0, 2], 38: [20, 0, 25], 50: [0, 0, 4] } }
        arm_l:     { rot: { 0: [-5, 0, -2], 22: [-5, 0, -2], 38: [20, 0, -25], 50: [0, 0, -4] } }
        forearm_r: { rot: { 0: [0, 0, 0], 38: [30, 0, 0], 50: [10, 0, 0] } }
        forearm_l: { rot: { 0: [0, 0, 0], 38: [30, 0, 0], 50: [10, 0, 0] } }
    # 기본 주먹 (철 골렘의 근접 공격과 함께)
    punch:
      length: 16
      bones:
        body:      { rot: { 0: [0, 0, 0], 5: [0, 14, 0], 9: [-10, -16, 0], 16: [0, 0, 0] } }
        arm_r:     { rot: { 0: [0, 0, 4], 5: [-40, 0, 12], 9: [95, 0, -4], 16: [0, 0, 4] } }
        forearm_r: { rot: { 0: [10, 0, 0], 5: [70, 0, 0], 9: [0, 0, 0], 16: [10, 0, 0] } }
    # 내려찍기: 두 팔을 머리 위로 들었다가 땅을 침 (22틱에 판정)
    slam:
      length: 42
      sounds: { 2: entity.iron_golem.repair, 22: entity.generic.explode }
      bones:
        body:      { rot: { 0: [0, 0, 0], 14: [12, 0, 0], 20: [14, 0, 0], 23: [-24, 0, 0], 34: [-22, 0, 0], 42: [0, 0, 0] }, pos: { 20: [0, 0, 0], 23: [0, -3, 0], 34: [0, -3, 0], 42: [0, 0, 0] } }
        head:      { rot: { 0: [0, 0, 0], 14: [10, 0, 0], 23: [-12, 0, 0], 34: [-10, 0, 0], 42: [0, 0, 0] } }
        arm_r:     { rot: { 0: [0, 0, 4], 14: [168, 0, -8], 20: [176, 0, -10], 23: [42, 0, 0], 34: [40, 0, 0], 42: [0, 0, 4] } }
        arm_l:     { rot: { 0: [0, 0, -4], 14: [168, 0, 8], 20: [176, 0, 10], 23: [42, 0, 0], 34: [40, 0, 0], 42: [0, 0, -4] } }
        forearm_r: { rot: { 0: [10, 0, 0], 14: [24, 0, 0], 23: [0, 0, 0], 34: [0, 0, 0], 42: [10, 0, 0] } }
        forearm_l: { rot: { 0: [10, 0, 0], 14: [24, 0, 0], 23: [0, 0, 0], 34: [0, 0, 0], 42: [10, 0, 0] } }
        leg_r:     { rot: { 20: [0, 0, 0], 23: [-8, 0, 0], 34: [-8, 0, 0], 42: [0, 0, 0] } }
        leg_l:     { rot: { 20: [0, 0, 0], 23: [-8, 0, 0], 34: [-8, 0, 0], 42: [0, 0, 0] } }
    # 돌진: 몸을 숙이고 팔을 뒤로 젖힌 채 (20~36틱) 앞으로 달림
    charge:
      length: 50
      sounds: { 0: entity.ravager.roar, 20: entity.ravager.step, 24: entity.ravager.step, 28: entity.ravager.step, 32: entity.ravager.step }
      bones:
        body:      { rot: { 0: [0, 0, 0], 18: [-26, 0, 0], 36: [-30, 0, 0], 44: [-6, 0, 0], 50: [0, 0, 0] } }
        head:      { rot: { 0: [0, 0, 0], 18: [20, 0, 0], 36: [22, 0, 0], 50: [0, 0, 0] } }
        arm_r:     { rot: { 0: [0, 0, 4], 18: [-52, 0, 18], 36: [-56, 0, 22], 50: [0, 0, 4] } }
        arm_l:     { rot: { 0: [0, 0, -4], 18: [-52, 0, -18], 36: [-56, 0, -22], 50: [0, 0, -4] } }
        forearm_r: { rot: { 0: [10, 0, 0], 18: [20, 0, 0], 50: [10, 0, 0] } }
        forearm_l: { rot: { 0: [10, 0, 0], 18: [20, 0, 0], 50: [10, 0, 0] } }
        leg_r:     { rot: { 0: [0, 0, 0], 18: [-14, 0, 0], 22: [34, 0, 0], 26: [-30, 0, 0], 30: [34, 0, 0], 34: [-30, 0, 0], 38: [0, 0, 0] } }
        leg_l:     { rot: { 0: [0, 0, 0], 18: [14, 0, 0], 22: [-30, 0, 0], 26: [34, 0, 0], 30: [-30, 0, 0], 34: [34, 0, 0], 38: [0, 0, 0] } }
    # 바위 던지기: 오른손에 바위를 들어 올렸다가 (24틱에) 던짐
    throw:
      length: 40
      sounds: { 6: block.stone.break, 23: entity.witch.throw }
      bones:
        body:      { rot: { 0: [0, 0, 0], 16: [10, 22, 0], 24: [-16, -20, 0], 32: [-8, -8, 0], 40: [0, 0, 0] } }
        head:      { rot: { 0: [0, 0, 0], 16: [8, -15, 0], 24: [0, 12, 0], 40: [0, 0, 0] } }
        arm_r:     { rot: { 0: [0, 0, 4], 16: [200, 0, 10], 24: [60, 0, 0], 32: [40, 0, 0], 40: [0, 0, 4] } }
        forearm_r: { rot: { 0: [10, 0, 0], 16: [45, 0, 0], 24: [0, 0, 0], 40: [10, 0, 0] } }
        arm_l:     { rot: { 0: [0, 0, -4], 16: [-30, 0, -20], 24: [30, 0, -10], 40: [0, 0, -4] } }
    # 2페이즈 진입: 팔을 벌리고 포효
    roar:
      length: 50
      sounds: { 8: entity.ravager.roar, 12: entity.warden.sonic_boom }
      bones:
        body:      { rot: { 0: [0, 0, 0], 12: [14, 0, 0], 40: [16, 0, 0], 50: [0, 0, 0] } }
        head:      { rot: { 0: [0, 0, 0], 12: [28, 0, 0], 40: [28, 0, 0], 50: [0, 0, 0] } }
        arm_r:     { rot: { 0: [0, 0, 4], 12: [30, 0, 72], 40: [32, 0, 76], 50: [0, 0, 4] } }
        arm_l:     { rot: { 0: [0, 0, -4], 12: [30, 0, -72], 40: [32, 0, -76], 50: [0, 0, -4] } }
        forearm_r: { rot: { 0: [10, 0, 0], 12: [40, 0, 0], 40: [40, 0, 0], 50: [10, 0, 0] } }
        forearm_l: { rot: { 0: [10, 0, 0], 12: [40, 0, 0], 40: [40, 0, 0], 50: [10, 0, 0] } }
    # 쓰러짐 (마지막 자세에서 멈춘 뒤 폭발)
    death:
      length: 60
      sounds: { 0: entity.iron_golem.death, 38: block.anvil.land }
      bones:
        body:      { rot: { 0: [0, 0, 0], 16: [12, 0, 6], 38: [-62, 0, 8] }, pos: { 16: [0, 0, 0], 38: [0, -12, -4] } }
        head:      { rot: { 0: [0, 0, 0], 16: [20, 0, 0], 38: [-40, 0, 10] } }
        arm_r:     { rot: { 0: [0, 0, 4], 16: [20, 0, 30], 38: [70, 0, 10] } }
        arm_l:     { rot: { 0: [0, 0, -4], 16: [20, 0, -30], 38: [60, 0, -16] } }
        forearm_r: { rot: { 0: [10, 0, 0], 38: [0, 0, 0] } }
        forearm_l: { rot: { 0: [10, 0, 0], 38: [0, 0, 0] } }
        leg_r:     { rot: { 0: [0, 0, 0], 38: [-70, 0, 0] }, pos: { 16: [0, 0, 0], 38: [0, 2, 0] } }
        leg_l:     { rot: { 0: [0, 0, 0], 38: [-80, 0, 0] }, pos: { 16: [0, 0, 0], 38: [0, 2, 0] } }

  # 패턴. range = 대상과의 거리 조건(블록). 판정 틱은 애니메이션에 맞춤
  skills:
    slam:
      type: slam
      animation: slam
      cooldown: 140
      range: [0, 7]
      hit-tick: 22
      forward: 2.5       # 보스 앞 몇 블록이 중심인지
      radius: 5
      damage: 12
      knockback: 1.3
    charge:
      type: charge
      animation: charge
      cooldown: 200
      range: [6, 22]
      start-tick: 20
      end-tick: 36
      speed: 0.85        # 틱당 블록
      width: 1.6
      damage: 10
      knockback: 1.8
    throw:
      type: throw
      animation: throw
      cooldown: 160
      range: [5, 26]
      pickup-tick: 8
      release-tick: 24
      flight-ticks: 22
      model: stsv:model/test_golem_rock
      radius: 3.5
      damage: 9
      knockback: 1.0

  # 체력이 below 아래로 내려가면 한 번: 애니메이션 + 모델 교체 + 강화
  phases:
    - below: 0.5
      animation: roar
      message: "<red><b>테스트 골렘이 폭주합니다!</b>"
      bar-color: RED
      speed-multiplier: 1.3
      cooldown-multiplier: 0.65
      shockwave: { radius: 7, knockback: 1.2 }
      models:
        body: stsv:model/test_golem_body_alert
        head: stsv:model/test_golem_head_alert

  # 처치에 참여한(피해를 준) 모두에게 주는 칭호 (titles/*.yml)
  title: stsv:golem_breaker
  drops:
    - { item: stsv:test_material, amount: [4, 8] }
    - { item: stsv:test_fuel, amount: [2, 4] }
    - { item: stsv:tomato_voucher, amount: 1, chance: 0.25 }
