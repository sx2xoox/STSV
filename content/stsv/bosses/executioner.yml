        leg_r:     { rot: { 0: [-10, 0, 0], 18: [-40, 0, 0], 44: [-85, 0, 0] }, pos: { 26: [0, 0, 0], 44: [0, 1, 0] } }
        leg_l:     { rot: { 0: [12, 0, 0], 18: [50, 0, 0], 44: [-70, 0, 0] }, pos: { 26: [0, 0, 0], 44: [0, 1, 0] } }

  # ----------------------------------------------------------------------------------------------
  # 패턴. 거리 단위는 블록, 틱은 각 애니메이션 기준.
  #   sequence = 단계(step)를 이어서 재생. 단계마다:
  #     chance      이 단계로 이어질 확률 (실패하면 패턴 끝)       min-phase  이 페이즈부터만
  #     if          caught / missed (잡기 결과에 따라)
  #     track-until 이 틱까지 대상을 향해 돌아섬 (turn = 틱당 최대 각도)
  #     hold        tick 에서 min~max 틱 동안 멈춤(지연 공격). 풀리기 glint 틱 전에 칼이 번쩍임
  #     move        from~to 틱 동안 앞으로 이동 (speed = 틱당 블록)
  #     leap        from~to 틱 동안 대상 위치로 도약. track-until 까지 착지점이 대상을 따라감
  #     hits        tick(~until) 판정. shape: cone(range, arc) / circle(radius, forward) / line(range, width) / held
  #                 guard-break = 막아도 방패가 풀림,  unblockable = 방패 무시
  #     waves       바닥을 따라 퍼지는 충격파 고리: 점프해서 넘어야 함
  #     flash       [시작, 끝] 틱 동안 손이 붉게 빛남 (막을 수 없는 공격 예고)
  #     grab        tick 에 잡기 판정 → 결과는 다음 단계의 if 로
  #     held        잡은 플레이어를 socket 에 붙들고 있음. 그동안 보스가 최대 체력의 rescue 만큼 맞으면 놓침(구출)
  #     sectors     보스 주변을 count 조각으로 나눠 safe 개만 안전. show~hide 동안 안전 구역 표시, tick 에 폭발
  #   when: behind (대상이 등 뒤) / above (대상이 3블록 이상 위) / heal (대상이 음식, 물약을 먹으려 할 때 즉시)
  # ----------------------------------------------------------------------------------------------
  skills:
    # 2~4타 연속 베기. 몇 타에서 끝날지 매번 다름, 마지막 내려찍기는 박자가 무작위로 늦음
    combo:
      type: sequence
      cooldown: 36
      range: [0, 5]
      steps:
        - animation: slash_a
          track-until: 8
          turn: 14
          move: { from: 6, to: 11, speed: 0.32 }
          hits: [ { tick: 9, until: 11, shape: cone, range: 4.6, arc: 170, damage: 9, knockback: 0.6 } ]
        - animation: slash_b
          chance: 0.8
          track-until: 5
          turn: 16
          move: { from: 4, to: 9, speed: 0.32 }
          hits: [ { tick: 7, until: 9, shape: cone, range: 4.7, arc: 170, damage: 9, knockback: 0.6 } ]
        - animation: overhead
          chance: 0.6
          track-until: 12
          turn: 9
          hold: { tick: 12, min: 2, max: 24, glint: 4 }
          hits: [ { tick: 17, shape: line, range: 4.4, width: 1.3, damage: 14, knockback: 1.0, guard-break: true } ]
          waves: [ { tick: 17, forward: 3.8, speed: 0.5, max: 9, width: 0.7, damage: 7, min-phase: 1 } ]
        - animation: spin
          min-phase: 1
          chance: 0.7
          hits: [ { tick: 9, until: 13, shape: circle, radius: 5, damage: 10, knockback: 1.3 } ]

    # 단독 지연 내려찍기: 칼을 든 채 대상을 계속 노려보다가(최대 2.5초) 번쩍이는 순간 내려침
    delayed:
      type: sequence
      cooldown: 110
      range: [0, 7]
      steps:
        - animation: overhead
          track-until: 12
          turn: 7
          hold: { tick: 12, min: 12, max: 50, glint: 5 }
          move: { from: 13, to: 17, speed: 0.45 }
          hits: [ { tick: 17, shape: line, range: 4.4, width: 1.4, damage: 16, knockback: 1.2, guard-break: true } ]
          waves: [ { tick: 17, forward: 3.8, speed: 0.45, max: 10, width: 0.7, damage: 8 } ]

    # 멀어지면 도약해서 내려찍기. 착지점은 공중에서도 따라오다가 마지막 0.3초 전에 고정
    leap:
      type: sequence
      cooldown: 120
      range: [8, 28]
      steps:
        - animation: leap
          track-until: 6
          turn: 30
          leap: { from: 8, to: 26, height: 6, track-until: 20, marker-from: 16, marker-radius: 3 }
          hits: [ { tick: 26, shape: circle, forward: 1.8, radius: 2.8, damage: 14, knockback: 1.2, guard-break: true } ]
          waves:
            - { tick: 26, forward: 1.8, speed: 0.45, max: 10, width: 0.7, damage: 8 }
            - { tick: 31, forward: 1.8, speed: 0.32, max: 8, width: 0.7, damage: 8, min-phase: 1 }

    # 기둥 위 같은 높은 곳으로 피하면 바로 도약
    leap_up:
      type: sequence
      when: above
      cooldown: 80
      range: [0, 20]
      steps:
        - animation: leap
          track-until: 6
          turn: 30
          leap: { from: 8, to: 26, height: 7, track-until: 22, marker-from: 16, marker-radius: 3 }
          hits: [ { tick: 26, shape: circle, forward: 1.8, radius: 2.8, damage: 14, knockback: 1.4, guard-break: true } ]

    # 잡기: 손이 붉게 빛나면 막을 수 없음. 잡히면 들어 올렸다가 내리꽂음 (동료가 때리면 구출)
    grab:
      type: sequence
      cooldown: 170
      range: [0, 4.5]
      steps:
        - animation: grab
          track-until: 9
          turn: 12
          flash: [0, 12]
          move: { from: 8, to: 12, speed: 0.5 }
          grab: { tick: 12, range: 3.2, arc: 80 }
        - animation: grab_slam
          if: caught
          held: { socket: hand_l, until: 26, rescue: 0.06 }
          hits: [ { tick: 26, shape: held, damage: 18, knockback: 1.6, up: 0.9, unblockable: true } ]
          waves: [ { tick: 26, forward: 1.6, speed: 0.4, max: 6, width: 0.7, damage: 6 } ]
        - animation: grab_miss
          if: missed

    # 뒤를 오래 잡으면 빠른 회전 베기
    spin_back:
      type: sequence
      when: behind
      cooldown: 60
      range: [0, 5]
      steps:
        - animation: spin
          hits: [ { tick: 9, until: 13, shape: circle, radius: 5, damage: 10, knockback: 1.3 } ]

    # 회복 응징: 근처에서 음식/물약을 먹으려 하면 즉시 찌르며 돌진
    punish_heal:
      type: sequence
      when: heal
      cooldown: 80
      range: [0, 16]
      steps:
        - animation: thrust
          track-until: 7
          turn: 40
          move: { from: 6, to: 14, speed: 1.15 }
          hits: [ { tick: 8, until: 14, shape: cone, range: 4.8, arc: 50, damage: 12, knockback: 1.2 } ]

    # 처형장 (마지막 페이즈): 바닥이 8조각으로 나뉘고 2조각만 안전. 안전 구역은 잠깐만 보이고 사라짐 → 기억해야 함
    execution:
      type: sequence
      min-phase: 2
      cooldown: 520
      range: [0, 40]
      steps:
        - animation: plant
          sectors: { show: 20, hide: 44, tick: 65, count: 8, safe: 2, radius: 20, damage: 30 }

  phases:
    - below: 0.6
      animation: roar
      message: "<#ff8a3d><b>처형자의 검이 달아오릅니다.</b> <gray>(연속 베기가 길어지고, 내려찍기에 충격파가 따라옵니다)"
      bar-color: RED
      speed-multiplier: 1.12
      cooldown-multiplier: 0.8
      shockwave: { radius: 6, knockback: 1.1 }
      models:
        sword: stsv:model/executioner_sword_lit
        sword_tip: stsv:model/executioner_sword_tip_lit
    - below: 0.25
      animation: roar
      message: "<red><b>\"처형을 시작한다.\"</b>"
      cooldown-multiplier: 0.8
      shockwave: { radius: 7, knockback: 1.3 }
      then: execution
      models:
        head: stsv:model/executioner_head_alert

  # 처치에 참여한(피해를 준) 모두에게 주는 칭호 (titles/*.yml)
  title: stsv:executioner_slayer
  drops:
    - { item: stsv:test_material, amount: [8, 14] }
    - { item: stsv:test_fuel, amount: [4, 8] }
    - { item: stsv:eggplant_voucher, amount: 1, chance: 0.5 }
