        body:      { rot: { 0: [-4, -12, 0], 14: [14, 0, 0], 20: [-30, 0, 0], 70: [-30, 0, 0], 84: [-4, -12, 0] }, pos: { 0: [0, -1, 0], 14: [0, 0, 0], 20: [0, -7, 0], 70: [0, -7, 0], 84: [0, -1, 0] } }
        head:      { rot: { 0: [4, 12, 0], 14: [-10, 0, 0], 20: [20, 0, 0], 60: [34, 0, 0], 70: [24, 0, 0], 84: [4, 12, 0] } }
        cape:      { rot: { 0: [-3, 0, 0], 20: [-8, 0, 0], 64: [-8, 0, 0], 66: [-50, 0, 0], 76: [-12, 0, 0], 84: [-3, 0, 0] } }
        arm_r:     { rot: { 0: [25, 0, 10], 14: [170, 0, -10], 20: [60, 0, 0], 70: [60, 0, 0], 84: [25, 0, 10] } }
        forearm_r: { rot: { 0: [35, 0, 0], 14: [30, 0, 0], 20: [0, 0, 0], 70: [0, 0, 0], 84: [35, 0, 0] } }
        sword:     { rot: { 0: [50, 0, 0], 14: [40, 0, 0], 20: [30, 0, 0], 70: [30, 0, 0], 84: [50, 0, 0] } }
        arm_l:     { rot: { 0: [12, 0, -12], 14: [165, 0, 15], 20: [55, 0, 10], 70: [55, 0, 10], 84: [12, 0, -12] } }
        forearm_l: { rot: { 0: [25, 0, 0], 20: [0, 0, 0], 70: [0, 0, 0], 84: [25, 0, 0] } }
        leg_r:     { rot: { 0: [-10, 0, 0], 20: [-40, 0, 0], 70: [-40, 0, 0], 84: [-10, 0, 0] } }
        leg_l:     { rot: { 0: [12, 0, 0], 20: [50, 0, 0], 70: [50, 0, 0], 84: [12, 0, 0] } }
    # 페이즈 전환: 칼을 하늘로 치켜들고 포효
    roar:
      length: 50
      sounds: { 8: entity.warden.roar, 12: entity.ravager.roar }
      bones:
        body:      { rot: { 0: [-4, -12, 0], 12: [16, 0, 0], 40: [18, 0, 0], 50: [-4, -12, 0] } }
        head:      { rot: { 0: [4, 12, 0], 12: [32, 0, 0], 40: [32, 0, 0], 50: [4, 12, 0] } }
        cape:      { rot: { 0: [-3, 0, 0], 12: [-40, 0, 0], 40: [-30, 0, 0], 50: [-3, 0, 0] } }
        arm_r:     { rot: { 0: [25, 0, 10], 12: [162, 0, 22], 40: [166, 0, 22], 50: [25, 0, 10] } }
        forearm_r: { rot: { 0: [35, 0, 0], 12: [10, 0, 0], 50: [35, 0, 0] } }
        sword:     { rot: { 0: [50, 0, 0], 12: [10, 0, 0], 50: [50, 0, 0] } }
        arm_l:     { rot: { 0: [12, 0, -12], 12: [30, 0, -70], 40: [32, 0, -74], 50: [12, 0, -12] } }
        forearm_l: { rot: { 0: [25, 0, 0], 12: [30, 0, 0], 50: [25, 0, 0] } }
    # 쓰러짐: 무릎 꿇고 앞으로 엎어짐
    death:
      length: 64
      sounds: { 0: entity.wither_skeleton.death, 22: block.anvil.land, 44: block.netherite_block.fall }
      bones:
        body:      { rot: { 0: [-4, -12, 0], 18: [-20, -8, 0], 26: [-24, -8, 0], 44: [-80, -6, 0] }, pos: { 0: [0, -1, 0], 18: [0, -7, 0], 26: [0, -7, 0], 44: [0, -14, -6] } }
