# 보스: 처형자. 체력이 아니라 패턴으로 어려운 보스.
# 겉모습: 검게 그을린 판금 갑옷, 핏빛 휘장과 망토, 금 장식, 서늘하게 빛나는 눈 (분노하면 핏빛)
# 형식과 좌표/회전 규칙은 test.yml 맨 위 주석 참고. 검 관절은 팔의 연장선(아래쪽)으로 만들어져 있어서
#   sword 회전 0 = 팔과 일직선,  +X = 칼끝을 앞으로 듦
executioner:
  name: "<#c4313f><b>처형자</b>"
  health: 520
  armor: 12
  speed: 0.27
  melee-damage: 0       # 철 골렘 기본 주먹 없음: 모든 공격은 패턴
  scale: 1.3
  bar-color: RED
  bar-range: 56
  leash: 48
  think: 6              # 자주 판단: 쉴 틈이 적음
  global-cooldown: 14

  model:
    bones:
      body:      { model: stsv:model/executioner_body,      pivot: [0, 23, 0] }
      head:      { model: stsv:model/executioner_head,      pivot: [0, 45, -0.5], parent: body, look: true }
      cape:      { model: stsv:model/executioner_cape,      pivot: [0, 44, 5.5],  parent: body }
      arm_r:     { model: stsv:model/executioner_arm_r,     pivot: [10.5, 41, 0], parent: body }
      forearm_r: { model: stsv:model/executioner_forearm_r, pivot: [11, 31, 0],   parent: arm_r }
      sword:     { model: stsv:model/executioner_sword,     pivot: [11, 19.5, 0], parent: forearm_r }
      sword_tip: { model: stsv:model/executioner_sword_tip, pivot: [11, -4, 0],   parent: sword }
      arm_l:     { model: stsv:model/executioner_arm_l,     pivot: [-10.5, 41, 0], parent: body }
      forearm_l: { model: stsv:model/executioner_forearm_l, pivot: [-11, 31, 0],  parent: arm_l }
      leg_r:     { model: stsv:model/executioner_leg_r,     pivot: [4.5, 21, 0] }
      leg_l:     { model: stsv:model/executioner_leg_l,     pivot: [-4.5, 21, 0] }
    sockets:
      hand_l: { bone: forearm_l, at: [-11, 17, -3] }
      blade:  { bone: sword_tip, at: [11, -20, 0] }

  # ----------------------------------------------------------------------------------------------
  # 애니메이션. 기본 자세 = 칼을 앞으로 겨눈 경계 자세 (몸은 오른쪽으로 살짝 틀고, 고개는 정면)
  # ----------------------------------------------------------------------------------------------
  animations:
    idle:
      length: 50
      loop: true
      bones:
        body:      { rot: { 0: [-4, -12, 0], 25: [-6, -12, 0], 50: [-4, -12, 0] }, pos: { 0: [0, -1, 0], 25: [0, -1.5, 0], 50: [0, -1, 0] } }
        head:      { rot: { 0: [4, 12, 0], 25: [6, 12, 0], 50: [4, 12, 0] } }
        cape:      { rot: { 0: [-3, 0, 0], 25: [-6, 0, 0], 50: [-3, 0, 0] } }
        arm_r:     { rot: { 0: [25, 0, 10], 25: [27, 0, 11], 50: [25, 0, 10] } }
        forearm_r: { rot: { 0: [35, 0, 0] } }
        sword:     { rot: { 0: [50, 0, 0], 25: [47, 0, 0], 50: [50, 0, 0] } }
        arm_l:     { rot: { 0: [12, 0, -12] } }
        forearm_l: { rot: { 0: [25, 0, 0] } }
        leg_r:     { rot: { 0: [-10, 0, 0] } }
        leg_l:     { rot: { 0: [12, 0, 0] } }
    walk:
      length: 24
      loop: true
      sounds: { 0: block.netherite_block.step, 12: block.netherite_block.step }
      bones:
        body:      { rot: { 0: [-8, -8, 0], 12: [-8, -16, 0], 24: [-8, -8, 0] }, pos: { 0: [0, -1, 0], 6: [0, -2, 0], 12: [0, -1, 0], 18: [0, -2, 0], 24: [0, -1, 0] } }
