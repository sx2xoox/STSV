        cape:      { rot: { 0: [-14, 0, 0], 6: [-18, 0, 0], 12: [-14, 0, 0], 18: [-18, 0, 0], 24: [-14, 0, 0] } }
        arm_r:     { rot: { 0: [25, 0, 10], 12: [32, 0, 10], 24: [25, 0, 10] } }
        forearm_r: { rot: { 0: [35, 0, 0] } }
        sword:     { rot: { 0: [50, 0, 0] } }
        arm_l:     { rot: { 0: [-15, 0, -8], 12: [25, 0, -8], 24: [-15, 0, -8] } }
