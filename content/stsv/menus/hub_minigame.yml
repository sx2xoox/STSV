# 통합 메뉴 · 미니게임 (/미니게임): 게임 고르기, 서킷 (카트 레이스). README "미니게임 · 서킷"
# 모양은 hub.yml 과 같음 (theme: hanok). 아래 줄(dock)은 hub.yml 의 다른 화면과 같음.
# 자리표시자 (코어 미니게임 모듈): {circuit_status} 지금 대기 · 레이스 인원, {track_<id>_state} 그 트랙 상태,
#   {track_<id>_best} 트랙 최고 기록, {track_<id>_mine} 내 최고 기록 (id: village, canyon, glacier, forest, city)
hub_minigame:
  title: ""
  plaque: "미니게임"
  rows: 6
  theme: hanok
  frame: {left: 30, right: 30, top: 20, scale: 2}
  dock: 5
  background: stsv:gui/hub_minigame
  layout:
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "BYtnXvwhs"
  buttons:
    a:
      action: "hub:go:stsv:hub_circuit"
      icon: stsv:gui/blank
      material: GOLDEN_HORSE_ARMOR
      scene: circuit
      label: "서킷"
      sub: "카트 레이스"
      accent: "#ffd36b"
      name: "<white>서킷 <gray>· 카트 레이스"
      lore: ["<gray>트랙 5개 · 카트 5종", "<gray>{circuit_status}", "", "<yellow>클릭: 열기"]
    b:
      action: "hub:go:stsv:hub_minigame"
      icon: stsv:gui/blank
      material: GRAY_DYE
      scene: soon
      label: "준비 중"
      sub: "다음 게임"
      accent: "#8f86a6"
      name: "<gray>준비 중"
      lore: ["<dark_gray>다음 미니게임이 들어올 자리"]
    c:
      action: "hub:go:stsv:hub_minigame"
      icon: stsv:gui/blank
      material: GRAY_DYE
      scene: soon
      label: "준비 중"
      sub: "다음 게임"
      accent: "#8f86a6"
      name: "<gray>준비 중"
      lore: ["<dark_gray>다음 미니게임이 들어올 자리"]
    B:
      action: "command:건축월드"
      icon: stsv:gui/blank
      material: BRICKS
      art: hub:build
      name: "<white>건축월드로"
      lore: ["<gray>땅을 사서 집 짓는 곳", "<dark_gray>{warmup}초 가만히"]
    Y:
      action: "hub:run:야생월드|run:rtp"
      icon: stsv:gui/blank
      material: OAK_SAPLING
      art: hub:wild
      name: "<white>야생월드로"
      lore: ["<gray>자원 캐는 곳 · 보호 없음", "<gray>지옥 · 엔드는 포털로", "<yellow>우클릭: 다른 무작위 위치 <dark_gray>(야생월드에서)", "<dark_gray>{warmup}초 가만히 · 재사용 {cooldown}초"]
    t:
      action: "hub:suggest:tpa|suggest:tpahere"
      icon: stsv:gui/blank
      material: ENDER_PEARL
      art: hub:tp
      name: "<white>텔레포트 요청"
      lore: ["<gray>상대가 수락하면 이동", "<yellow>클릭: 가기 <dark_gray>· /tpa", "<yellow>우클릭: 내 쪽으로 부르기"]
    n:
      action: "command:야간투시"
      icon: stsv:gui/blank
      material: ENDER_EYE
      art: hub:night
      name: "<white>야간 투시 <gray>· {night_vision}"
      lore: ["<gray>죽거나 나가도 유지", "<yellow>클릭: 켜기·끄기"]
    v:
      action: "command:탈것"
      icon: stsv:gui/blank
      material: MINECART
      art: hub:vehicle
      name: "<white>내 탈것"
      lore: ["<gray>내 탈것 목록", "<dark_gray>양도 · 함께 쓸 사람: /탈것"]
    w:
      action: "command:ㅆ"
      icon: stsv:gui/blank
      material: CAULDRON
      art: hub:trash
      name: "<white>쓰레기통"
      lore: ["<gray>넣고 닫으면 사라짐", "<dark_gray>탈것·지게는 돌려받음 · /ㅆ"]
    h:
      action: "command:사이드바"
      icon: stsv:gui/blank
      material: PAPER
      art: hub:sidebar
      name: "<white>사이드바 켜기·끄기"
      lore: ["<gray>오른쪽 정보 패널", "<dark_gray>위치·크기: /사이드바"]
    s:
      action: "command:후원"
      icon: stsv:gui/blank
      material: NETHER_STAR
      art: hub:star
      name: "<white>후원 상점"
      lore: ["<gray>후원 재화(별)로 사는 꾸미기"]
    X:
      action: "hub:go:stsv:hub"
      icon: stsv:gui/blank
      material: ARROW
      art: hub:back
      name: "<white>뒤로"
      lore: ["<gray>통합 메뉴 첫 화면"]

