# /뽑기: 치장 뽑기. 위 = 분류 탭 (옷장과 같은 탭, 이름 옆 = 모은 수/나오는 수), 가운데 = 그 분류에서 나오는 치장
# (등급순 → 이름순, 가진 것은 그대로, 없는 것은 등급 색 '?' 카드, 확률은 보여 주지 않음),
# 아래 = 페이지 · 뒤로 · 1회 뽑기 · 안내 · 10회 뽑기 · 옷장.
# 동작: gacha:pull:1 (1회), gacha:pull:multi (묶음), gacha:back (연 곳으로, 없으면 닫기), gacha:tab:<탭>. 뽑기는 두 번 눌러야 함.
# 자리표시자: {balance} {single} {multi} {count} {discount} {floor} {owned} {total} {confirm_single} {confirm_multi}
#             {tab} · {n_<탭>} = "모은 수/나오는 수"
# 가격·확률·천장: contents/stsv/gacha.yml
gacha:
  title: "<#f0e2b0>치장 뽑기 <#b9a6d6>· {tab} <#8f86a6>· {owned}/{total}"
  rows: 6
  background: stsv:gui/gacha
  tabs: "ACDEFGHKM"
  layout:
    - "ACDEFGHKM"
    - ".LLLLLLL."
    - ".LLLLLLL."
    - ".LLLLLLL."
    - ".LLLLLLL."
    - "PBO.I.TWN"
  list: L
  buttons:
    A:
      action: "gacha:tab:all"
      icon: stsv:gui/tab_all
      material: ARMOR_STAND
      name: "<white>전체 <gray>{n_all}"
      lore: ["<gray>뽑기에서 나오는 모든 치장"]
    B:
      action: "gacha:back"
      icon: stsv:gui/back
      material: ARROW
      name: "<yellow>뒤로"
      lore: ["<gray>연 곳으로 (없으면 닫기)"]
    C:
      action: "gacha:tab:head"
      icon: stsv:gui/tab_head
      material: LEATHER_HELMET
      name: "<white>머리 <gray>{n_head}"
    D:
      action: "gacha:tab:above"
      icon: stsv:gui/tab_above
      material: GLOWSTONE_DUST
      name: "<white>머리 위 <gray>{n_above}"
    E:
      action: "gacha:tab:shoulder"
      icon: stsv:gui/tab_shoulder
      material: FEATHER
      name: "<white>어깨 <gray>{n_shoulder}"
    F:
      action: "gacha:tab:back"
      icon: stsv:gui/tab_back
      material: ELYTRA
      name: "<white>등 <gray>{n_back}"
    G:
      action: "gacha:tab:tail"
      icon: stsv:gui/tab_tail
      material: RABBIT_FOOT
      name: "<white>꼬리 <gray>{n_tail}"
    H:
      action: "gacha:tab:pet"
      icon: stsv:gui/tab_pet
      material: BONE
      name: "<white>펫 <gray>{n_pet}"
    K:
      action: "gacha:tab:trail"
      icon: stsv:gui/tab_trail
      material: BLAZE_POWDER
      name: "<white>발자취 <gray>{n_trail}"
    M:
      action: "gacha:tab:kill"
      icon: stsv:gui/tab_kill
      material: IRON_SWORD
      name: "<white>처치 효과 <gray>{n_kill}"
    O:
      action: "gacha:pull:1"
      icon: stsv:gui/gacha
      material: SNOWBALL
      name: "<white>1회 뽑기 <dark_gray>· <gold>{single}"
      lore:
        - "<gray>나오는 치장 중 하나가 나옵니다."
        - "<gray>이미 가진 치장이면 <white>교환권</white>으로 (팔 수 있음)"
        - ""
        - "<gray>잔액: {balance}"
        - "{confirm_single}"
    T:
      action: "gacha:pull:multi"
      icon: stsv:gui/gacha
      material: SNOWBALL
      name: "<white>{count}회 뽑기 <dark_gray>· <gold>{multi}"
      lore:
        - "<gray>{count}번 한꺼번에 ({discount}% 할인)"
        - "<gray>{floor}<gray> 이상 하나는 반드시 나옵니다."
        - "<gray>이미 가진 치장이면 <white>교환권</white>으로 (팔 수 있음)"
        - ""
        - "<gray>잔액: {balance}"
        - "{confirm_multi}"
    I:
      action: ""
      icon: stsv:gui/info
      material: BOOK
      name: "<gold>치장 뽑기"
      lore:
        - "<gray>모은 치장: <white>{owned_all}/{total_all}"
        - ""
        - "<gray>위 탭: 부위별로 나오는 치장 (일반 · 희귀 · 영웅)."
        - "<gray>밝은 치장 = 가진 것, <dark_gray>어두운 '?' 카드<gray> = 아직 없는 것"
        - "<gray>새 치장은 바로 내 것이 되고, /치장 에서 입습니다."
        - "<gray>이미 가진 치장은 <white>교환권</white>으로 나옵니다:"
        - "<gray>  거래소에서 팔거나, 친구에게 주거나, 우클릭해 등록."
        - "<gray>영웅 치장이 나오면 서버 전체에 알립니다."
        - "<gold>전설 치장</gold><gray>은 뽑기에 없습니다 (주간 순위 1위 · 상인 행렬)."
    W:
      action: "command:치장"
      icon: stsv:gui/dress_up
      material: LEATHER_CHESTPLATE
      name: "<white>치장 (옷장)"
      lore: ["<gray>가진 치장 입어 보기"]
    P:
      action: page:prev
      icon: stsv:gui/prev
      material: ARROW
      name: "<yellow>◀ 이전 페이지"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/prev_off, material: GRAY_DYE, name: "<dark_gray>◀ 첫 페이지" }
    N:
      action: page:next
      icon: stsv:gui/next
      material: ARROW
      name: "<yellow>다음 페이지 ▶"
      lore: ["<gray>{page} / {pages}"]
      off: { icon: stsv:gui/next_off, material: GRAY_DYE, name: "<dark_gray>마지막 페이지 ▶" }
