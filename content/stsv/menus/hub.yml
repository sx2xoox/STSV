# /메뉴, 웅크린 채 F (Shift+F): 통합 메뉴. 코어 기능만 있는 판.
# 경제 서버가 있으면 contents/economy/menus/hub.yml (이 메뉴의 모든 버튼 + 경제 기능)이 대신 열림.
# 모양 (theme: hub, stsv_assets/menu_theme.py hub_background): 모든 화면 6줄. 위 5줄은 카드, 맨 아래 줄(dock: 5)은
#   자주 쓰는 버튼 9칸 바(가운데: 첫 화면은 내 머리, 다른 화면은 뒤로). art(배경에 그릴 아이콘)가 있는 버튼은
#   글자를 직사각형으로 반복해 여러 칸을 덮는 카드: 4줄 이상이면 큰 카드(맨 윗줄에 label, 아이콘 2배, accent 색,
#   아래에 sub), 작으면 작은 카드(아이콘 + label). 칸에는 보이지 않는 아이템(stsv:gui/blank)이 들어가 설명만 뜸.
# 버튼 동작: command:<명령어> (플레이어로 실행), hub:go:<메뉴> (통합 메뉴의 다른 화면),
#            hub:<왼쪽>|<오른쪽>  각각 run:<명령어> 또는 suggest:<명령어> (닫고 채팅창에 "/명령어 " 넣기 안내)
# 자리표시자: {player} {world} {balance} {title} {points} {cosmetics} {fee} {hotkey} {warmup} {cooldown} {night_vision}
hub:
  title: "<#f0e2b0>통합 메뉴 <#8f86a6>· {world}"
  rows: 6
  theme: hub
  dock: 5
  background: stsv:gui/hub
  layout:
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "aaabbbccc"
    - "BYtnPvwhs"
  buttons:
    a:
      action: "hub:go:stsv:hub_money"
      icon: stsv:gui/blank
      material: GOLD_INGOT
      art: stsv:gui/coins
      label: "돈"
      sub: "잔액·송금"
      accent: "#f2c24c"
      name: "<white>돈"
      lore: ["<gray>잔액 {balance}", "<gray>송금 · 수표", "", "<yellow>클릭: 열기"]
    b:
      action: "hub:go:stsv:hub_style"
      icon: stsv:gui/blank
      material: LEATHER_CHESTPLATE
      art: stsv:gui/dress_up
      label: "꾸미기"
      sub: "치장·칭호"
      accent: "#ba84f0"
      name: "<white>꾸미기"
      lore: ["<gray>치장 <white>{cosmetics} <gray>· 칭호 <white>{title}", "<gray>뽑기 · 닉네임 · 감정표현", "<gray>투명갑옷 · 후원 상점", "", "<yellow>클릭: 열기"]
    c:
      action: "hub:go:stsv:hub_rank"
      icon: stsv:gui/blank
      material: GOLDEN_HELMET
      art: stsv:gui/trophy
      label: "순위·기록"
      sub: "업적·명예"
      accent: "#e0b04a"
      name: "<white>순위·기록"
      lore: ["<gray>업적 <gold>{points}점", "<gray>명예의 전당 · 부자 순위", "", "<yellow>클릭: 열기"]
    P:
      action: "hub:run:프로필|run:돈"
      material: PLAYER_HEAD
      name: "<white>{player}"
      lore: ["<gray>위치 <white>{world}", "<gray>잔액 {balance}", "<gray>칭호 <white>{title} <dark_gray>· <gold>{points}점", "<yellow>클릭: 내 프로필", "<yellow>우클릭: 잔액 <dark_gray>· 단축키 {hotkey}"]
    B:
      action: "command:건축월드"
      icon: stsv:gui/blank
      material: BRICKS
      art: stsv:gui/house
      name: "<white>건축월드로"
      lore: ["<gray>땅을 사서 집 짓는 곳", "<dark_gray>{warmup}초 가만히"]
    Y:
      action: "hub:run:야생월드|run:rtp"
      icon: stsv:gui/blank
      material: OAK_SAPLING
      art: stsv:gui/pine
      name: "<white>야생월드로"
      lore: ["<gray>자원 캐는 곳 · 보호 없음", "<gray>지옥 · 엔드는 포털로", "<yellow>우클릭: 다른 무작위 위치 <dark_gray>(야생월드에서)", "<dark_gray>{warmup}초 가만히 · 재사용 {cooldown}초"]
    t:
      action: "hub:suggest:tpa|suggest:tpahere"
      icon: stsv:gui/blank
      material: ENDER_PEARL
      art: stsv:gui/pearl
      name: "<white>텔레포트 요청"
      lore: ["<gray>상대가 수락하면 이동", "<yellow>클릭: 가기 <dark_gray>· /tpa", "<yellow>우클릭: 내 쪽으로 부르기"]
    n:
      action: "command:야간투시"
      icon: stsv:gui/blank
      material: ENDER_EYE
      art: stsv:gui/night_vision
      name: "<white>야간 투시 <gray>· {night_vision}"
      lore: ["<gray>죽거나 나가도 유지", "<yellow>클릭: 켜기·끄기"]
    v:
      action: "command:탈것"
      icon: stsv:gui/blank
      material: MINECART
      art: stsv:gui/don_car
      name: "<white>내 탈것"
      lore: ["<gray>내 탈것 목록", "<dark_gray>양도 · 함께 쓸 사람: /탈것"]
    w:
      action: "command:ㅆ"
      icon: stsv:gui/blank
      material: CAULDRON
      art: stsv:gui/trash
      name: "<white>쓰레기통"
      lore: ["<gray>넣고 닫으면 사라짐", "<dark_gray>탈것·지게는 돌려받음 · /ㅆ"]
    h:
      action: "command:사이드바"
      icon: stsv:gui/blank
      material: PAPER
      art: stsv:gui/ledger
      name: "<white>사이드바 켜기·끄기"
      lore: ["<gray>오른쪽 정보 패널", "<dark_gray>위치·크기: /사이드바"]
    s:
      action: "command:후원"
      icon: stsv:gui/blank
      material: NETHER_STAR
      art: stsv:gui/star
      name: "<white>후원 상점"
      lore: ["<gray>후원 재화(별)로 사는 꾸미기"]

