# /메뉴, 웅크린 채 F (Shift+F): 통합 메뉴. 코어 기능만 있는 판.
# 경제 서버가 있으면 contents/economy/menus/hub.yml (이 메뉴의 모든 버튼 + 경제 기능)이 대신 열림.
# 모든 화면이 6줄. 큰 버튼: art(배경에 그릴 아이콘) + label(배경에 쓸 이름)이 있는 버튼은 글자를 직사각형으로 반복해
#   여러 칸을 덮고, 배경에 큰 타일로 그려짐(3줄 높이면 아이콘 2배). 칸에는 보이지 않는 아이템(stsv:gui/blank)이
#   들어가 마우스를 올리면 이름·설명만 뜸. with: "P" = 타일 안에 다른 버튼(내 머리)이 함께 들어감.
# 첫 화면은 카테고리, 누르면 그 카테고리 화면(hub_*). 각 화면의 뒤로(아래 가운데)는 첫 화면으로.
# 버튼 동작: command:<명령어> (플레이어로 실행), close, hub:go:<메뉴> (통합 메뉴의 다른 화면),
#            hub:<왼쪽>|<오른쪽>  각각 run:<명령어> 또는 suggest:<명령어> (닫고 채팅창에 "/명령어 " 넣기 안내)
# 자리표시자: {player} {world} {balance} {title} {points} {cosmetics} {fee} {hotkey} {warmup} {cooldown} {night_vision}
hub:
  title: "<#f0e2b0>통합 메뉴 <#8f86a6>· {world}"
  rows: 6
  background: stsv:gui/hub
  layout:
    - "aaapppbbb"
    - "aaapPpbbb"
    - "aaapppbbb"
    - "cccssseee"
    - "cccssseee"
    - "cccssseee"
  buttons:
    a:
      action: "hub:go:stsv:hub_travel"
      icon: stsv:gui/blank
      material: COMPASS
      art: stsv:gui/compass
      label: "이동·편의"
      name: "<white>이동 · 편의"
      lore: ["<gray>건축월드 · 야생월드 · 텔레포트", "<gray>야간 투시 · 탈것 · 쓰레기통", "", "<yellow>클릭: 열기"]
    p:
      action: "command:프로필"
      icon: stsv:gui/blank
      material: PAPER
      label: "내 정보"
      with: "P"
      name: "<white>{player}"
      lore: ["<gray>위치 <white>{world}", "<gray>잔액 {balance}", "<gray>칭호 <white>{title} <dark_gray>· <gold>{points}점", "<yellow>클릭: 내 프로필 <dark_gray>· 단축키 {hotkey}"]
    P:
      action: "command:프로필"
      material: PLAYER_HEAD
      name: "<white>{player}"
      lore: ["<gray>위치 <white>{world}", "<gray>잔액 {balance}", "<gray>칭호 <white>{title} <dark_gray>· <gold>{points}점", "<yellow>클릭: 내 프로필 <dark_gray>· 단축키 {hotkey}"]
    b:
      action: "hub:go:stsv:hub_money"
      icon: stsv:gui/blank
      material: GOLD_INGOT
      art: stsv:gui/coins
      label: "돈"
      name: "<white>돈"
      lore: ["<gray>잔액 {balance}", "<gray>송금 · 수표", "", "<yellow>클릭: 열기"]
    c:
      action: "hub:go:stsv:hub_style"
      icon: stsv:gui/blank
      material: LEATHER_CHESTPLATE
      art: stsv:gui/dress_up
      label: "꾸미기"
      name: "<white>꾸미기"
      lore: ["<gray>치장 <white>{cosmetics} <gray>· 칭호 <white>{title}", "<gray>뽑기 · 닉네임 · 감정표현", "<gray>투명갑옷 · 후원 상점", "", "<yellow>클릭: 열기"]
    s:
      action: "command:후원"
      icon: stsv:gui/blank
      material: NETHER_STAR
      art: stsv:gui/star
      label: "후원 상점"
      name: "<white>후원 상점"
      lore: ["<gray>후원 재화(별)로 사는 꾸미기"]
    e:
      action: "hub:go:stsv:hub_rank"
      icon: stsv:gui/blank
      material: GOLDEN_HELMET
      art: stsv:gui/trophy
      label: "순위·기록"
      name: "<white>순위 · 기록"
      lore: ["<gray>업적 <gold>{points}점", "<gray>명예의 전당 · 부자 순위", "", "<yellow>클릭: 열기"]

