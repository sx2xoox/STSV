# 감정표현 (/감정표현, 관리자 테스트 기능): 플레이어의 스킨을 입은 관절 인형이 하는 동작. README "감정표현".
# 동작은 전부 이 파일의 숫자: 새 감정표현은 아래 emotes: 에 하나 더 적고 /관리자 리로드 (코드 수정 없음).
# 고친 뒤 미리보기: python3 -I tools/assetgen/emotes.py --preview --fixture  → docs/previews/emote_<id>.png
# (--fixture 는 플러그인 테스트가 맞춰 보는 숫자 plugin/src/test/fixtures/emote/rig.json 도 다시 씀)
#
# ------------------------------------------------------------------------------------------------
# 인형: 스킨 1픽셀 = 1칸 (키 32칸 = 1.875블록). 발 사이 바닥이 (0, 0, 0),
#   x = 인형의 왼쪽(+) · 오른쪽(-),  y = 위(+),  z = 앞(+) · 뒤(-)
# 관절 (괄호 = 도는 중심):
#   root (바닥) ─┬─ hips 골반 (허리 0,16,0) ── thigh_l / thigh_r 허벅지 (±2,12,0) ── shin_l / shin_r 정강이 (무릎 ±2,6,0)
#                └─ chest 가슴 (허리 0,16,0) ─┬─ head 머리 (목 0,24,0)
#                                             └─ arm_l / arm_r 팔 (어깨 ±5,22,0, 팔꿈치 없음)
#   골반과 가슴은 따로 돎 (골반만 흔들어도 윗몸은 그대로)
# 각도 [pitch, yaw, roll] (도):
#   pitch +  위쪽이 앞으로 숙여짐 (가슴: 허리 숙이기, 머리: 끄덕이기. 팔·다리처럼 아래로 뻗은 것은 끝이 뒤로 감)
#   yaw   +  왼쪽으로 돎
#   roll  +  위쪽이 인형의 오른쪽으로 기욺 (골반이면 왼쪽 엉덩이가 올라감)
# 위치 [x, y, z] (칸):
#   root              몸 전체를 옮김 (y 를 내리면 주저앉음)
#   root_rot          몸 전체를 돌림 [pitch, yaw, roll]
#   foot_l / foot_r   발바닥 중심을 선 자세에서 얼마나 옮길지 (legs: planted 일 때만)
#   knee_l / knee_r   무릎이 향하는 쪽 (legs: planted 일 때만, 기본 [0, 0, 1] = 앞)
# 좌우 한 번에: arms, thighs, shins, feet, knees 는 왼쪽 값을 적으면 오른쪽은 거울처럼 (yaw · roll · x 의 부호 반대)
#
# 감정표현마다:
#   name        플레이어가 치는 이름 (/감정표현 <이름>)
#   length      한 바퀴 길이 (틱, 1초 = 20틱). step 의 배수
#   step        몇 틱마다 자세를 보낼지 (그 사이는 클라이언트가 이어 줌). 한 번에 20도 넘게 도는 관절이 있으면 안 됨
#               (인형의 면이 하나씩 따로 움직여서, 크게 돌면 상자 모서리가 잠깐 벌어짐: 플러그인 테스트가 확인).
#               움직이는 관절의 면만 보내므로 가만히 있는 관절이 많을수록 패킷이 적음
#   loop        true = 멈출 때까지 되풀이 (웅크리기, /감정표현 그만, config.yml emotes.max-seconds), false = 한 번 하고 끝
#   legs        planted = 발을 foot_* 자리에 붙여 두고 다리는 알아서 굽힘 (thigh · shin 각도는 쓰지 않음)
#               free    = thigh · shin 각도대로
#   camera      지켜보는 카메라: around = 인형 앞에서 왼쪽으로 몇 도 돌아간 곳 (180 = 바로 뒤), up = 눈높이보다 몇 도 위,
#               distance = 거리 (블록). 벽에 막히면 다른 쪽으로 가거나 가까이 당김
#   pose        모든 장면의 바탕 자세
#   keyframes   장면: at = 틱 (0 이상 length 미만, 올라가는 순서) 과 바탕 자세에서 바꿀 것.
#               ease = 앞 장면에서 이 장면으로 오는 빠르기: linear(기본) · sine(천천히-빨리-천천히) · in(점점 빨리) · out(점점 천천히)
#   props       인형이 지니는 작은 표시 (없어도 됨): 한 가지 색의 작은 그림이 관절 하나에 붙어 같이 움직이고 인형이 보는 쪽을 봄.
#               joint 관절 (head, chest, arm_l ...), at [x, y, z] 그림의 가운데 (선 자세 기준, 칸), size 그림 한 칸의 크기 (칸),
#               color "#rrggbb", pixels 그림의 줄 (위부터, '#' = 칠한 칸, 그 밖 = 빈 칸. 16 x 16 칸까지)
# ------------------------------------------------------------------------------------------------

emotes:
  # 트월킹: 다리를 벌리고 무릎을 굽힌 채 허리를 깊이 숙이고 손은 무릎 쪽에, 골반만 위아래로 튕김 (1초에 3번쯤).
  # 12틱에 두 번 튕기며 골반이 왼쪽 · 오른쪽으로 번갈아 실림. 윗몸은 가만히 (보내는 것은 골반과 다리의 면뿐)
  twerk:
    name: "트월킹"
    length: 12
    step: 1
    loop: true
    legs: planted
    camera: { around: 150, up: 14, distance: 3.6 }
    pose:
      root: [0, -4.0, -0.6]
      chest: [52, 0, 0]
      head: [-62, 0, 0]
      arms: [-44, 0, -4]
      feet: [3.4, 0, 1.2]
      knees: [0.6, 0, 1]
    keyframes:
      - { at: 0, ease: sine, hips: [12, 0, 0] }
      - { at: 3, ease: sine, hips: [46, 0, -7] }
      - { at: 6, ease: sine, hips: [12, 0, 0] }
      - { at: 9, ease: sine, hips: [46, 0, 7] }

  # L을 가져가: 오른손을 이마에 대고 (이마에 노란 L 표시) 제자리에서 통통 뛰며 다리를 번갈아 옆으로 참
  take_l:
    name: "L을 가져가"
    length: 16
    step: 1
    loop: true
    legs: free
    camera: { around: 25, up: 8, distance: 3.8 }
    # 이마의 L: 머리에 붙어 같이 움직이는 노란 표시 (손가락을 그릴 수 없는 인형이라 글자로 보여 줌)
    props:
      - { joint: head, at: [1.2, 30.2, 8.4], size: 0.9, color: "#ffd640", pixels: ["##...", "##...", "##...", "##...", "#####", "#####"] }
    pose:
      arm_r: [-158, 0, -40]
      arm_l: [0, 0, 22]
      head: [4, 0, 0]
    keyframes:
      - { at: 0, ease: sine, root: [0, 0, 0], root_rot: [0, 0, 0], thigh_l: [0, 0, 0], thigh_r: [0, 0, 0], shin_l: [0, 0, 0], shin_r: [0, 0, 0], arm_l: [0, 0, 22] }
      - { at: 4, ease: sine, root: [-1.0, 2.0, 0], root_rot: [0, 0, -7], thigh_l: [-12, 0, 46], shin_l: [18, 0, 0], thigh_r: [0, 0, 5], shin_r: [0, 0, 0], arm_l: [0, 0, 40] }
      - { at: 8, ease: sine, root: [0, 0, 0], root_rot: [0, 0, 0], thigh_l: [0, 0, 0], thigh_r: [0, 0, 0], shin_l: [0, 0, 0], shin_r: [0, 0, 0], arm_l: [0, 0, 22] }
      - { at: 12, ease: sine, root: [1.0, 2.0, 0], root_rot: [0, 0, 7], thigh_r: [-12, 0, -46], shin_r: [18, 0, 0], thigh_l: [0, 0, -5], shin_l: [0, 0, 0], arm_l: [0, 0, 8] }

  # 인사: 허리를 깊이 숙였다가 일어남 (한 번)
  bow:
    name: "인사"
    length: 40
    step: 1
    loop: false
    legs: free
    camera: { around: 40, up: 10, distance: 3.6 }
    pose: {}
    keyframes:
      - { at: 0, chest: [0, 0, 0], head: [0, 0, 0], root: [0, 0, 0], arms: [0, 0, 3] }
      - { at: 12, ease: sine, chest: [72, 0, 0], head: [14, 0, 0], root: [0, 0, -1.6], arms: [-58, 0, 3] }
      - { at: 24, ease: linear, chest: [72, 0, 0], head: [14, 0, 0], root: [0, 0, -1.6], arms: [-58, 0, 3] }
      - { at: 36, ease: sine, chest: [0, 0, 0], head: [0, 0, 0], root: [0, 0, 0], arms: [0, 0, 3] }

  # 디스코: 오른팔로 하늘을 찌르고 왼쪽 아래로 내리기를 되풀이, 골반은 박자에 맞춰 좌우로
  disco:
    name: "디스코"
    length: 32
    step: 1
    loop: true
    legs: planted
    camera: { around: 20, up: 8, distance: 3.8 }
    pose:
      feet: [2.6, 0, 0]
      arm_l: [0, 0, 28]
    keyframes:
      - { at: 0, ease: sine, arm_r: [0, 0, -150], hips: [0, 0, -9], root: [-0.8, -0.6, 0], chest: [0, -8, 4], head: [-10, -18, 0] }
      - { at: 8, ease: sine, arm_r: [-30, 0, -60], hips: [0, 0, 0], root: [0, -1.6, 0], chest: [6, 0, 0], head: [0, 0, 0] }
      - { at: 16, ease: sine, arm_r: [-40, 0, 34], hips: [0, 0, 9], root: [0.8, -0.6, 0], chest: [10, 10, -4], head: [14, 18, 0] }
      - { at: 24, ease: sine, arm_r: [-30, 0, -60], hips: [0, 0, 0], root: [0, -1.6, 0], chest: [6, 0, 0], head: [0, 0, 0] }

  # 만세: 웅크렸다가 두 팔을 번쩍 들고 뛰어오름
  cheer:
    name: "만세"
    length: 24
    step: 1
    loop: true
    legs: free
    camera: { around: 25, up: 8, distance: 4.0 }
    pose: {}
    keyframes:
      - { at: 0, ease: sine, root: [0, -1.5, 0], thighs: [-24, 0, 0], shins: [48, 0, 0], arms: [-95, 0, 8], chest: [10, 0, 0], head: [6, 0, 0] }
      - { at: 6, ease: in, root: [0, 0, 0], thighs: [0, 0, 0], shins: [0, 0, 0], arms: [-140, 0, 12], chest: [0, 0, 0], head: [-6, 0, 0] }
      - { at: 10, ease: out, root: [0, 4.5, 0], thighs: [6, 0, 6], shins: [10, 0, 0], arms: [-172, 0, 20], chest: [-6, 0, 0], head: [-16, 0, 0] }
      - { at: 14, ease: in, root: [0, 0, 0], thighs: [0, 0, 0], shins: [0, 0, 0], arms: [-150, 0, 14], chest: [0, 0, 0], head: [-4, 0, 0] }
      - { at: 19, ease: out, root: [0, -1.5, 0], thighs: [-24, 0, 0], shins: [48, 0, 0], arms: [-115, 0, 8], chest: [10, 0, 0], head: [6, 0, 0] }
