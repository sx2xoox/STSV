# ─────────────────────────────────────────────────────────────────────────────────────────────
#  [치장 뽑기] /뽑기 · 상점 구매 → 치장 뽑기 · /치장 · 통합 메뉴
#  돈을 내고 pool 의 치장 중 하나를 무작위로 얻음. 이미 가진 치장(같은 뽑기에서 먼저 나온 것 포함)은
#  그 치장의 교환권(아이템)으로 줌: 거래소에서 사고팔거나, 없는 사람이 우클릭해 등록.
#  확률은 플레이어에게 보여 주지 않음 (이 파일은 관리자만 봄). 고친 뒤 /관리자 리로드.
#
#  한 번 뽑을 때: 먼저 등급을 weights 비율로 고르고(풀에 없는 등급은 빠짐), 그 등급 안에서 치장을 똑같은 확률로.
#    지금 풀: 일반 12 · 희귀 14 · 영웅 12종 → 치장 하나의 확률 = 일반 56%/12 = 4.67%, 희귀 32%/14 = 2.29%, 영웅 12%/12 = 1.00%
#  천장(pity): 영웅 없이 (pulls - 1)번 연속이면 다음 한 번은 영웅. 사람마다 DB(cosmetic_gacha)에 저장, 뽑기를 넘어 이어짐.
#  10회 뽑기: 앞 9번에 희귀 이상이 없으면 10번째는 희귀 이상(희귀:영웅 = 32:12)에서.
#  전설은 절대 나오지 않음 (주간 순위 1위 · 상인 행렬 전용). pool 에 넣어도 빠지고 경고가 뜸.
#
#  가격의 근거 (예전 상점가와 맞춤): 특정 치장 하나를 얻을 때까지 드는 돈의 기댓값
#    = 한 번 값 ÷ 그 치장의 확률 (천장 포함, 10회 = 한 번에 540)
#    일반 600 ÷ 4.65% ≈ 12,900 (10회 11,600)   예전 12,000~15,000
#    희귀 600 ÷ 2.28% ≈ 26,300 (10회 23,700)   예전 25,000
#    영웅 600 ÷ 1.02% ≈ 58,700 (10회 52,800)   예전 45,000~50,000
#  그 사이에 나온 다른 치장·교환권은 덤 (교환권은 팔 수 있음). 돈은 사라짐(돈 회수처).
#  전부 모으기(38종): 10회 뽑기로 평균 약 310번 ≈ 167,000.  더 많이 회수하려면 price 를 올리면 됨.
# ─────────────────────────────────────────────────────────────────────────────────────────────

price:
  single: 600         # 1회
  multi-count: 10     # 묶음 뽑기 횟수
  multi: 5400         # 10회 (10% 할인)

weights:              # 등급 비율 (합이 100일 필요는 없음)
  common: 56
  rare: 32
  epic: 12

pity:
  pulls: 30           # 영웅 없이 29번 연속이면 30번째는 영웅 (0 = 끔)
  rarity: epic

multi-guarantee: rare # 10회 뽑기에 이 등급 이상 하나는 반드시

# 하루에 뽑을 수 있는 횟수 (0 = 제한 없음). 돈 회수처이고, 중복은 교환권으로 남아 손해가 아니며,
# 뽑기 버튼은 두 번 눌러야 해서 실수로 돈이 나가지 않음 → 기본은 제한 없음
daily-limit: 0

broadcast-from: epic  # 이 등급 이상이 나오면 서버 전체에 알림

# 나오는 치장 (전에 상점에서 팔던 38종 그대로). 교환권(voucher: { cosmetic: ... })이 있는 치장만 들어감.
# 업적 보상 펫(두더지·아기 양·수달·부엉이)과 전설 7종은 넣지 않음
