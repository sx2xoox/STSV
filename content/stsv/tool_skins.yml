# 도구 스킨 (/스킨): 도구의 겉모습만 바꾸는 스킨. 시리즈로 나옴. 가진 스킨을 /스킨 에서 켜 두면
# 그 종류의 도구를 손에 들 때마다 그 모습이 됨 (재질 · 내구도 · 인챈트 · 성능은 그대로, 다른 사람이 들면 원래 모습).
# 스킨은 계정에 남음: 도구가 부서져도 스킨은 그대로. 주는 법: 후원 상점 (donation_shop.yml 의 unlocks: ["tool_skin:<id>"]),
# /관리자 해금 지급 <플레이어> 도구스킨 <id|전체>
#
# series:
#   <시리즈 id>:
#     name: 화면에 보이는 시리즈 이름
#     skins:
#       <스킨 id>: { name, tool: sword | pickaxe | shovel | axe | hoe | fishing_rod, model: 리소스팩 아이템 모델 (assets/<ns>/items/<이름>.json) }
# 스킨 id 는 시리즈가 달라도 겹치면 안 됨. 새 시리즈는 모델을 만들고 (tools/assetgen/models/toy_tools.py 참고) 여기에 더한 뒤 /관리자 리로드.
# 커스텀 아이템 (직업 도구 등) 과 스킨북으로 스킨을 입힌 도구에는 입혀지지 않음.

series:
  toy:
    name: "장난감 시리즈"
    skins:
      toy_sword:       { name: "장난감 검", tool: sword, model: "stsv:toy_sword" }
      toy_pickaxe:     { name: "장난감 곡괭이", tool: pickaxe, model: "stsv:toy_pickaxe" }
      toy_shovel:      { name: "장난감 삽", tool: shovel, model: "stsv:toy_shovel" }
      toy_axe:         { name: "장난감 도끼", tool: axe, model: "stsv:toy_axe" }
      toy_hoe:         { name: "장난감 괭이", tool: hoe, model: "stsv:toy_hoe" }
      toy_fishing_rod: { name: "장난감 낚싯대", tool: fishing_rod, model: "stsv:toy_fishing_rod" }
