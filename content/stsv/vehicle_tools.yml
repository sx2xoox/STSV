# 작업기: 탈것이 진짜 농기계·고깃배처럼 일함 (README "작업기", 플러그인 dev.stsv.core.vehicle.VehicleTools).
# 운전석에서 Ctrl(달리기 키) = 다음 작업기 (멈춰 있을 때만, 짐칸을 보는 사람이 없을 때). 그대로 → 작업기 1 → 2 ... → 그대로.
# 단 작업기는 탈것에 모델로 보이고(움직이는 부품: 로터리 날, 수확기 릴, 진압 롤러, 그물 드럼), 탈것마다 기억됨 (재시작해도 그대로,
# 아이템으로 회수하면 처음 모습으로).
#
# 탈것 아이템 id 마다:
#   base           작업기 없이 처음 모습의 이름 (Ctrl 순서의 처음)
#   tools          작업기들 (Ctrl 순서)
#     id           a-z 0-9 _ (DB 에 저장되는 이름: 바꾸면 그 작업기를 단 탈것은 처음 모습으로)
#     name         이름 (MiniMessage)
#     kind         till  = 지나가는 줄의 잔디·흙·흙길을 밭(farmland)으로 (위에 공기나 풀·고사리만 있을 때: 작물·꽃·블록은 그대로)
#                  sow   = 지나가는 빈 밭에 짐칸의 씨앗을 심음 (짐칸의 맨 앞 씨앗부터: 바닐라 씨앗과 경제 서버 작물 씨앗)
#                  harvest = 지나가는 다 자란 작물을 손으로 우클릭 수확하듯 거둬 짐칸으로 (다시 심음, 칸·적재 무게 안에서)
#                  net   = 바다 위를 천천히(speed 이하) 가는 동안 가끔 그 물의 흔한·보통 물고기 하나가 어창으로 (경제 서버)
#                  cover = 짐칸 덮개 (모양만: 덮은 동안 짐은 안 보임). 벗기면 앞쪽으로 접혀 있음
#     unit         매달리는 칸: 0 = 끄는 쪽 (트랙터, 배, 트럭), 1 = 첫 트레일러 ...
#     replaces     true = 그 트레일러 자리를 대신함 (트레일러 몸체·짐은 안 보이고 그 짐칸은 못 엶: 짐은 그대로 남음)
#     wheels       (replaces) true = 그 트레일러의 바퀴는 그대로 보임 (쟁기는 달구지 바퀴에 매달림)
#     model, at, scale   작업기 모델과 위치 [오른쪽, 위, 앞] (그 칸 기준, 블록), 배율 (몸체처럼 절반으로 그린 것은 2)
#     parts        움직이는 부품: model, at, axis (x 가로축 / z 세로축), scale,
#                  spin: pto  = 운전하는 사람이 있는 동안 rate 도/틱 돎 (- = 반대로)
#                        roll = 땅에서 굴러감 (radius 반지름, 블록)
#     work         작업하는 줄: at 가운데 (그 칸 기준), width 너비 (블록). 한 블록에 한 번씩
#     speed        단 동안의 최고 속도 (블록/초, 탈것 속도보다 크면 탈것 그대로)
#     net.seconds  (net) 평균 몇 초에 한 마리 (낚싯대보다 훨씬 느리게)
#     cover.fold, cover.ticks  (cover) 벗겼을 때 접힌 길이의 비율, 덮고 벗기는 데 걸리는 틱
#   shutter        탑차 뒤 셔터: model (셔터 판, 위 끝이 기준), inside (열린 문 안쪽 모습), at, scale, rolled (말려 올라간 길이 비율), ticks
#                  짐칸을 열면(하역장 판매 화면도) 올라가고, 달리기 시작하면 내려옴
#
# 작업기는 운전하는 사람이 블록을 바꿀 수 있는 곳에서만 일함: 불러온 청크, 스폰 보호 밖, 도로·하역장·터미널 밖 (경제 서버),
# 그리고 그 칸에 블록을 놓을 수 있을 때 (내 땅·구성원인 땅·야생월드: 남의 땅·서버 땅·주인 없는 건축월드는 안 됨).
# 한 틱에 바꾸는 블록 수와 서버가 바쁠 때 쉬기는 config.yml vehicles.tools.

# ------------------------------------------------------------------------------------------------
# 소달구지: 달구지 ↔ 쟁기 (한 줄 갈기)
# ------------------------------------------------------------------------------------------------
ox_cart:
  base: "<#d0a05e>달구지"
  tools:
    - id: plough
      name: "<#c9a36a>쟁기"
      kind: till
      unit: 1
      replaces: true
      wheels: true
      model: ox_plough
      scale: 2
      work: { at: [0, 0, -0.5], width: 1 }
      speed: 2.5

# ------------------------------------------------------------------------------------------------
# 경운기: 짐칸 ↔ 로터리 (두 줄 갈기, 날이 돎)
# ------------------------------------------------------------------------------------------------
power_tiller:
  base: "<#e06439>짐칸"
  tools:
    - id: rotary
      name: "<#e06439>로터리"
      kind: till
      unit: 1
      replaces: true
      wheels: false
      model: tiller_rotary
      scale: 2
      parts:
        - { model: tiller_rotary_tines, at: [0, 0.40625, 0], axis: x, spin: pto, rate: 24 }
      work: { at: [0, 0, 0], width: 2 }
      speed: 3

# ------------------------------------------------------------------------------------------------
# 트랙터: 트레일러만 → 로터리 (세 줄 갈기) → 파종기 (세 줄 심기, 씨앗은 트레일러 짐칸) → 수확기 (세 줄 거두기, 트레일러로)
# ------------------------------------------------------------------------------------------------
tractor_trailer:
  base: "<#f28023>트레일러만"
  tools:
    - id: rotary
      name: "<#f28023>로터리"
      kind: till
      unit: 0
      model: tractor_rotary
      scale: 2
      parts:
        - { model: tractor_rotary_tines, at: [0, 0.40625, -2.3125], axis: x, spin: pto, rate: 26 }
      work: { at: [0, 0, -2.3125], width: 3 }
      speed: 3.5
    - id: seeder
      name: "<#5b8fd6>파종기"
      kind: sow
      unit: 0
      model: tractor_seeder
      scale: 2
      parts:
        - { model: tractor_seeder_roller, at: [0, 0.21875, -2.8125], axis: x, spin: roll, radius: 0.21875 }
      work: { at: [0, 0, -2.4375], width: 3 }
      speed: 4
    - id: harvester
      name: "<#f2c14e>수확기"
      kind: harvest
      unit: 0
      model: tractor_header
      scale: 2
      parts:
        - { model: tractor_header_reel, at: [0, 1.0, 2.46875], axis: x, spin: pto, rate: -9 }
      work: { at: [0, 0, 2.75], width: 3 }
      speed: 3.5

# ------------------------------------------------------------------------------------------------
# 통통배: 그물 끌기 (바다에서 천천히: 45초쯤에 한 마리, 흔한·보통 물고기만)
# ------------------------------------------------------------------------------------------------
fishing_boat:
  base: "<#7fc3e6>그물 걷음"
  tools:
    - id: trawl
      name: "<aqua>그물 끌기"
      kind: net
      unit: 0
      model: boat_trawl
      scale: 3
      parts:
        - { model: boat_net_drum, at: [0, 1.71875, -2.28125], axis: x, spin: pto, rate: 6 }
      speed: 3
      net: { seconds: 45 }

# ------------------------------------------------------------------------------------------------
# 연안 어선: 그물 끌기 (통통배보다 자주: 30초쯤에 한 번). 고물의 빨간 갤로스와 그물 드럼
# ------------------------------------------------------------------------------------------------
coastal_boat:
  base: "<#8fd0c0>그물 걷음"
  tools:
    - id: trawl
      name: "<aqua>그물 끌기"
      kind: net
      unit: 0
      model: coastal_trawl
      at: [0, 0, -3.375]
      scale: 2
      parts:
        - { model: boat_net_drum, at: [0, 1.859375, -3.109375], axis: x, spin: pto, rate: 6 }
      speed: 3
      net: { seconds: 30 }

# ------------------------------------------------------------------------------------------------
# 트롤 어선: 트롤 그물 (가장 자주: 18초쯤에 한 번). 제 갠트리에 와이어를 걸고 그물 드럼이 돎
# ------------------------------------------------------------------------------------------------
trawler:
  base: "<#5f86c8>그물 걷음"
  tools:
    - id: trawl
      name: "<aqua>트롤 그물"
      kind: net
      unit: 0
      model: trawler_trawl
      at: [0, 0, -4.75]
      scale: 2.5
      parts:
        - { model: boat_net_drum, at: [0, 3.0, -4.296875], axis: x, spin: pto, rate: 6 }
      speed: 3
      net: { seconds: 18 }

# ------------------------------------------------------------------------------------------------
# 1톤 트럭: 방수포 덮개 (모양만)
# ------------------------------------------------------------------------------------------------
light_truck:
  base: "<#8fb4e0>덮개 걷음"
  tools:
    - id: tarp
      name: "<#5f8f5a>방수포 덮개"
      kind: cover
      unit: 0
      model: truck_tarp
      at: [0, 0, 0.75]
      scale: 2.5
      cover: { fold: 0.12, ticks: 14 }

# ------------------------------------------------------------------------------------------------
# 탑차: 뒤 셔터 (짐칸을 열면 올라가고 달리면 내려옴)
# ------------------------------------------------------------------------------------------------
box_truck:
  shutter:
    model: box_truck_shutter
    inside: box_truck_doorway
    at: [0, 2.875, -3.25]
    scale: 2.5
    rolled: 0.08
    ticks: 14
