# 서킷 레이스 카트 (미니게임 · 서킷, README "미니게임 · 서킷"). 레이스 동안만 있는 탈것: 아이템으로 나오지 않음
# (/관리자 지급 으로 줄 수는 있지만 서킷 밖에서 쓸 일 없음). 레이스용 수치 (무게 · 부스터 · 고를 수 있는 색) 는
# circuit/karts.yml. 설정 설명은 vehicles.yml 맨 위. 모델: tools/assetgen/models/karts.py
# 다섯 카트 모두 몸집은 같고 (길이 2.2 · 폭 1.5블록) 성격만 다름: 속도 / 가속 / 드리프트 / 무게 / 장난감(욕조)

kart_storm:
  material: paper
  name: "<#e23a2e>스톰"
  lore:
    - "<gray>서킷 카트 · 최고 속도형"
    - "<dark_gray>레이스 동안만 탐"
  model: kart_storm
  icon: kart_storm_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 18.5
    over-cap: true
    drift: { angle: 30, min-speed: 6, build: 105, recover: 150, turn: 1.5, drag: 1.4 }
    reverse-speed: 4
    acceleration: 5.5
    brake: 15
    coast: 2.2
    turn-rate: 84
    turn-speed: 4
    step-height: 1.0
    size: [2.2, 1.5, 1.0]
    click-height: 0.6
    wheel: kart_wheel
    wheel-radius: 0.28
    wheels:
      - { at: [-0.625, 0.28, 0.69], steer: true }
      - { at: [0.625, 0.28, 0.69], steer: true }
      - { at: [-0.625, 0.28, -0.69] }
      - { at: [0.625, 0.28, -0.69] }
    seats:
      - { at: [0, 0.28, -0.31] }
    engine: { sound: stsv:vehicle.sports_car.engine, volume: 0.45, idle-volume: 0.18, idle-pitch: 0.7, top-pitch: 2.0, segment-ticks: 10 }

