# 후원 상점 전용 치장: 세 세트, 다섯 가지씩 (모델: tools/assetgen/models/cosmetics_donation.py).
# 뽑기에 나오지 않고 교환권도 없음 (cosmetic.exclusive: donation). 세트를 모두 걸치면 cosmetic_sets.yml 의 보너스 고리가 돈다.
# 청룡 · 은하수의 모델 조각은 어두운 데서도 밝게 보이고 (glow), 대부분 움직인다 (motion). 아기 오리 가족은 빛나지 않는 낮의 세트.
# 발자취 · 오라의 모델은 메뉴 카드 그림.

