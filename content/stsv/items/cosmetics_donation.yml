# ---------------------------------------------------------------------------------------------
azure_pearl_cloud:
  material: paper
  name: "<gradient:#c8f6ff:#3d8bff>청룡의 여의주</gradient>"
  lore: ["<gray>구름 위에 뜬 여의주가 푸른 불꽃 속에서 돈다", "<#7fd8ff>청룡 세트 (1/5)"]
