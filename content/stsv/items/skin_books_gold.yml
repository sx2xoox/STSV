# 골드 스킨북: 경제 상점 (economy shop.yml 의 '도구' 분류) 에서 골드로 삼. 쓰는 법은 skin_books.yml 과 같음.
# 후원 스킨과 달리 효과(fx)는 없음. 모델: tools/assetgen/models/skinset_<id>.py

# ---- 목각 시리즈 ----

woodcraft_sword_skin:
  material: paper
  name: "<#d9a86c>스킨북: 목각 검"
