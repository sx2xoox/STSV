  icon: kickboard_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 8
    reverse-speed: 1.5
    acceleration: 2.6
    brake: 7
    coast: 1.0
    turn-rate: 100
    turn-speed: 2
    step-height: 1.0
    size: [1.25, 0.5, 1.2]
    click-height: 1.0
    lean: 10
    wheel: wheel_kickboard
    wheel-radius: 0.15625
    wheels:
      - { at: [0, 0.15625, 0.53125], steer: true }
      - { at: [0, 0.15625, -0.5625] }
    seats:
      - { at: [0, 0.85, -0.06] }
    horn: { sound: stsv:vehicle.cargo_bicycle.horn, release: stsv:vehicle.cargo_bicycle.horn_end, volume: 1.1,
            vanilla: block.note_block.bell, pitch: 1.8, times: 2, gap: 3 }
