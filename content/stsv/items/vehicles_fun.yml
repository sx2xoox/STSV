# 특별 탈것: 재미로 타는 탈것 10가지 (관리자만: /관리자 아이템목록 의 '탈것' 탭, /관리자 지급). 상점·뽑기·레시피에는 없음.
# 킥보드 · 스카이콩콩 · 보드 · 빗자루 · 바나나보트 · 세그웨이 · 장난감 오리 · 썰매 · 풍선 의자 · 로데오 황소.
# 하나씩 지워도 되게 따로따로 (아이템 하나 + 그 모델들). 위치·속도·크기·좌석·바퀴의 뜻은 vehicles.yml 맨 위 설명과 같음.
# 킥보드·세그웨이·스카이콩콩·보드는 서서 탐: 타는 사람은 숨고 그 사람 스킨의 인형이 발판 위에 서서 움직임에 맞춰 자세를 잡음
# (감정표현 인형, config.yml emotes.enabled 가 켜져 있어야 함. 꺼져 있으면 앉아서 탐).
#
# fun: 특별 탈것만의 움직임 (없으면 보통 탈것, 다른 탈것은 그대로. 플러그인 FunSpec · FunPhysics · FunView)
#   hop          스카이콩콩: 타고 있으면 계속 콩콩 뜀. 내려앉기 직전(window 틱 안)이나 닿을 때 스페이스를 누르면 다음 점프가
#                gain 만큼 높아짐 (max 블록까지), 안 누르면 decay 만큼 낮아짐 (base 까지). sound 내려앉는 소리. 타는 동안 낙하 피해 없음
#   ollie        보드: 땅에서 스페이스 = height 블록 뛰며 보드가 spin 도 돎 (보이는 것만), sound 뛰는 소리
#   hover        빗자루·풍선 의자: 아래 땅(물 위면 물 위) 에서 높이를 지켜 떠 다님. 타면 start 블록까지 떠오르고, 스페이스 = 올라감
#                (climb 블록/초, max 까지), Ctrl 또는 발밑(아래)을 보면 내려감 (sink 블록/초, min 까지). 아무도 안 타면 땅에 내려앉음.
#                땅에서 max 보다 높이 갈 수 없음: 낭떠러지 밖으로 나가면 같이 내려감. pop: true = 화살·눈덩이 등에 맞으면 풍선이
#                터져 천천히 내려옴 (땅에 5초 있으면 다시 부풀어 오름)
#   toss         바나나보트: min-speed 블록/초 이상에서 min-turn 도/초 이상 급하게 꺾으면 운전자 뒤 사람이 틱마다 chance 확률로 물에 빠짐
#                (빠르고 급할수록 더, 탄 지 3초 안에는 안 빠짐)
#   surface      썰매: 눈(snow)·얼음(ice)·그 밖(other)에서의 최고 속도 비율, downhill 내리막 기울기 1 에서 더 빨라지는 비율
#   buck         로데오 황소: start 처음 세기 (0~1), growth 1초마다 세지는 양, launch 떨어질 때 튕겨 나가는 세기.
#                A·D 로 균형을 잡다가 (황소가 도는 쪽 키) 균형을 잃으면 떨어지고 버틴 시간 · 최고 기록이 나옴 (플레이어마다 저장)
#   amphibious   장난감 오리: 물 위에 draft 블록 잠겨 떠서 speed 로 헤엄치고, 땅에서는 land-speed 로 뒤뚱뒤뚱 걸음
#   pivot        세그웨이: 서 있어도 A·D 로 제자리에서 돎.  tilt: 빨라질 때 앞으로, 브레이크에 뒤로 기우는 각도 (도)
#   waddle       오리가 땅에서 걸을 때 좌우로 뒤뚱거리는 각도 (도)
#   toot         스페이스를 누를 때마다 한 번 나는 소리 (sound, volume, pitch: 오리의 꽥!)
#   roll         굴러갈 때 몇 블록마다 나는 소리 (key, volume, pitch, every): 작은 바퀴 소리, 썰매 방울
#   look-steer   A·D 대신 타는 사람이 보는 쪽으로 돎 (스카이콩콩, 풍선 의자)
#   trail        움직일 때 남기는 파티클: glitter (반짝이) · snow (눈가루, 눈·얼음 위에서) · bubbles (물방울, 물 위에서)
#   part         따로 움직이는 모델 (model, at 위치, scale 배율): 날뛰는 황소, 흔들리는 풍선 다발
#   stand        서서 탐: kind (kick · segway · pogo · skate: 자세), deck 발판 높이 (블록). 좌석은 발판 + 0.6 (눈높이가 선 키)
#   tip          킥보드: speed 블록/초 이상에서 ticks 틱 동안 끝까지 꺾으면 옆으로 넘어지고 사람은 굴러떨어짐
#   bail         보드: speed 이상에서 꺾으면서 알리를 착지하면 chance 확률로 꽈당 (보드만 혼자 굴러감)
#   dizzy        세그웨이: 제자리에서 돌면 점점 빨라져 spin-up 배까지, ticks 틱 돌면 어지러워 내림 (멀미)
#   crash        썰매: speed 블록/초 이상으로 벽에 부딪히면 뒤집히고 탄 사람은 앞으로 날아감
#   heel         바나나보트: 꺾을 때 바깥쪽으로 roll 도까지 기울고 출렁이며, 탄 사람도 같이 쏠림 (기울수록 잘 빠짐)
#   hop.overload 스카이콩콩: 높이 뛰는 중 올라갈 때 스페이스를 마구 누르면 스프링이 튕겨 사람이 하늘로 날아감
#   hover.free   풍선 의자: 땅에서의 높이 제한 없이 천천히 자유 비행 (월드 꼭대기까지)
#   toot.combo   오리: 빨리 연달아 누르면 음이 올라가고 여섯 번째에 오리가 뜀
# 모델 tools/assetgen/models/vehicles_fun.py, 아이콘 vehicle_icons_fun.py, 미리보기 python3 vehicle_preview_fun.py → docs/previews/vehicles_fun.png

