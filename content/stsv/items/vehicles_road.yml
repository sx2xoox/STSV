# 탈것 세대 사다리 · 도로 탈것 (관리자만: /관리자 아이템목록 의 '탈것' 탭, /관리자 지급). 상점·뽑기·레시피에는 없음.
# 1세대 리어카 → 2세대 짐자전거 → 3세대 배달 오토바이 → 4세대 1톤 트럭 · 소형 화물 밴 → 5세대 탑차 · 특수: 사륜 오토바이
# 설정은 vehicles.yml 맨 위 설명과 같음 (속도·크기·좌석·바퀴·경적·엔진·짐칸). 여기에만 있는 것:
#   lean          두 바퀴 탈것이 방향을 틀 때 안쪽으로 기우는 각도 (도, 다 꺾고 turn-speed 이상일 때). 몸체·바퀴·짐·페달이 함께 기욺
#   spinners      바퀴와 함께 도는 부품 (model, at 위치 = 축, ratio 바퀴 한 바퀴에 몇 바퀴: 짐자전거 페달 0.5)
#   all-terrain   true = 모래·자갈·눈·진흙·영혼 모래에서 느려지지 않음 (다른 탈것은 모래·자갈·눈·진흙 75%, 영혼 모래 50%)
#   cargo.slots   9 의 배수 (한 쪽 45칸, 마지막 쪽은 일부만: 27 = 작은 상자 한 칸, 54 = 45 + 9). stages 가 없으면 닫힌 짐칸 (짐이 안 보임)
# 모델 tools/assetgen/models/vehicles_road.py, 아이콘 vehicle_icons_road.py, 소리 sounds.py (ROAD), 미리보기 vehicle_preview_road.py

cargo_bicycle:
  material: paper
  name: "<#6fae7e>짐자전거"
  lore:
    - "<gray>2세대 · 앞 바구니와 뒤 짐받이가 달린 튼튼한 자전거. 1인승."
    - "<gray>짐칸 27칸 · 최고 속도 6.5블록/초 · 엔진 없이 조용함"
    - "<dark_gray>땅에 우클릭: 세우기 · 우클릭: 타기"
    - "<dark_gray>W·S 앞뒤, A·D 방향, 스페이스: 벨, 웅크리기: 내리기"
    - "<dark_gray>웅크리고 뒤 짐받이 우클릭: 짐칸 열기"
    - "<dark_gray>웅크리고 앞쪽 우클릭: 아이템으로 회수 (주인, 짐칸이 비어 있어야 함)"
  model: cargo_bicycle
  icon: cargo_bicycle_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 6.5
    reverse-speed: 1.2
    acceleration: 2.0
    brake: 7
    coast: 1.5
    turn-rate: 90
    turn-speed: 2
    step-height: 1.0
    size: [2.2, 0.6, 1.25]
    click-height: 1.1
    lean: 8
    wheel: wheel_bicycle
    wheel-radius: 0.375
    wheels:
      - { at: [0, 0.375, 0.625], steer: true }
      - { at: [0, 0.375, -0.625] }
    spinners:
      - { model: bicycle_crank, at: [0, 0.34375, 0.09375], ratio: 0.5 }
    seats:
      - { at: [0, 1.24, -0.23] }
    horn: { sound: stsv:vehicle.cargo_bicycle.horn, release: stsv:vehicle.cargo_bicycle.horn_end, volume: 1.2,
            vanilla: block.note_block.bell, pitch: 1.6, times: 2, gap: 3 }
    engine: { sound: stsv:vehicle.cargo_bicycle.engine, volume: 0.15, idle-volume: 0, idle-pitch: 0.6, top-pitch: 1.6, segment-ticks: 10 }
    cargo:
      slots: 27
      payload: 20          # 적재 무게 (economy weights.yml 의 무게로, README '적재 무게')
      behind: -0.1
      at: [0, 0.75, 0]
      stages: [cargo_bicycle_cargo_1, cargo_bicycle_cargo_2, cargo_bicycle_cargo_3, cargo_bicycle_cargo_4]

