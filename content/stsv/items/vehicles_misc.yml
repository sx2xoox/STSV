    - "<dark_gray>물을 보고 우클릭: 띄우기 · 우클릭: 타기"
    - "<dark_gray>W·S 앞뒤, A·D 방향, 웅크리기: 내리기 · 탄 채로 낚시 가능 (셋이 같이)"
    - "<dark_gray>웅크리고 뒤쪽(고물) 우클릭: 짐칸 열기"
    - "<dark_gray>웅크리고 앞쪽 우클릭: 아이템으로 회수 (주인, 짐칸이 비어 있어야 함)"
