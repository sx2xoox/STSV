# 차도 수레도 아닌 탈것: 통통배(물 위에서만) · 지게(입는 짐 지게). 관리자만: /관리자 아이템목록 의 '탈것' 탭, /관리자 지급.
# 상점·뽑기·레시피에는 없음 (VehicleContentTest). 위치·설정의 뜻은 vehicles.yml 맨 위 설명과 같음.
#
# 통통배 (fishing_boat): vehicle 에 water: 가 있으면 배 (물 위에서만 움직임, 플러그인 BoatPhysics)
#   water.draft        물 위에 떠 있을 때 용골이 물에 잠기는 깊이 (블록). 모델의 흘수선과 맞춤 (0.375 = 6px)
#   water.nudge-speed  땅에 걸렸을 때(물이 빠졌을 때, 얕은 물가) 물 쪽으로만 밀 수 있는 속도 (블록/초, 0 = 못 움직임)
#   water.rock         물결에 흔들리는 정도 (1 = 잔잔하게, 0 = 흔들리지 않음). 보이는 모습만 흔들림
#   water.exhaust      운전하는 동안 연기가 퐁퐁 나는 굴뚝 끝 위치 [오른쪽, 위, 앞] (빼면 연기 없음)
#   wheels             배는 바퀴 대신 프로펠러 (길이 방향으로 돎). wheel-radius 가 클수록 천천히 돎
#   cargo              뒤 갑판의 어창 (behind 보다 뒤를 웅크리고 우클릭하면 열림). 짐: 생선 상자·그물·부표 → 가득 차면 방수포

fishing_boat:
  material: paper
  name: "<#7fc3e6>통통배"
  lore:
    - "<gold>특수</gold> <dark_gray>· <gray>나무로 짠 작은 고깃배. 조타실, 통통통 굴뚝, 그물 더미."
    - "<gray>3인승 · 물 위 최고 속도 7블록/초 · 어창 270칸 (6쪽)"
    - "<gray>물 위에서만: 물가(땅)에서 멈추고 올라가지 않음, 용암·폭포·거품 기둥 앞에서 멈춤"
    - "<gray>얼음 위에서는 미끄러지고, 물이 빠지면 물 쪽으로만 천천히 밀 수 있음"
    - "<dark_gray>물을 보고 우클릭: 띄우기 · 우클릭: 타기 · 스페이스: 뱃고동"
    - "<dark_gray>W·S 앞뒤, A·D 방향, 웅크리기: 내리기 · 탄 채로 낚시 가능"
    - "<dark_gray>웅크리고 뒤 갑판 우클릭: 어창 열기"
    - "<dark_gray>웅크리고 앞쪽 우클릭: 아이템으로 회수 (주인, 어창이 비어 있어야 함)"
    - "<gold>작업기</gold> <gray>운전석에서 Ctrl (멈춰서): 그물 끌기 (바다를 천천히 가면 가끔 물고기가 어창으로)"
  model: fishing_boat
  icon: fishing_boat_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 7
    reverse-speed: 2.5
    acceleration: 1.6
    brake: 4
    coast: 1.2
    turn-rate: 48
    turn-speed: 2.5
    step-height: 0
    size: [5.0, 2.0, 2.5]
    click-height: 1.3
    wheel: boat_propeller
    wheel-radius: 1.2
    wheels:
      - { at: [0, 0.1875, -2.09375] }
    seats:
      - { at: [0, 1.0, -0.28] }
      - { at: [-0.42, 1.03, 1.06] }
      - { at: [0.42, 1.03, 1.06] }
    horn: { sound: stsv:vehicle.fishing_boat.horn, release: stsv:vehicle.fishing_boat.horn_end, volume: 1.6,
            vanilla: block.note_block.didgeridoo, pitch: 0.6, times: 1 }
    engine: { sound: stsv:vehicle.fishing_boat.engine, volume: 0.45, idle-volume: 0.3, idle-pitch: 0.6, top-pitch: 1.35, segment-ticks: 10 }
    water:
      draft: 0.375
      nudge-speed: 1.0
      rock: 1.0
      exhaust: [0.40625, 2.85, -0.8125]
    cargo:
      slots: 270
      payload: 800          # 적재 무게 (economy weights.yml 의 무게로, README "적재 무게")
      behind: -0.6
      at: [0, 0.8125, -1.640625]
      stages: [boat_catch_1, boat_catch_2, boat_catch_3, boat_catch_4]

# 지게 (jige): 놓는 탈것이 아니라 입는 것. 가슴 칸(갑옷 자리)에 입으면 등에 지게가 보이고 짐을 넣을 수 있음 (플러그인 JigeModule).
#   jige.slots     짐 칸 수 (9 의 배수, 최대 54 = 큰 상자 한 개 화면)
#   jige.slowdown  지고 있는 동안 걸음이 이만큼 느려짐 (0.1 = 10%)
#   jige.stages    등에 보이는 모습: 빈 지게, 그다음 차는 정도에 따라 (나뭇단 몇 개 / 더 많이 / 가득 + 거적)
#   jige.offset    등에 보이는 위치를 옮김 [x 오른쪽, y 위, z 뒤] (픽셀)
#   짐은 아이템에 들어가지 않고 DB 에 지게 번호로 저장됨. 아이템을 복사해도 먼저 입은 하나만 짐을 열 수 있음.
jige:
  material: paper
  name: "<#d9b07a>지게"
  lore:
    - "<gold>1세대</gold> <dark_gray>· <gray>소나무로 짠 A자 지게. 등에 지고 짐을 나름."
    - "<gray>짐 54칸 · 지고 있는 동안 걸음 10% 느리게"
    - "<gray>가슴 칸(갑옷 자리)에 입음: 그동안 겉날개·가슴 갑옷은 못 입음"
    - "<dark_gray>입기: 우클릭 또는 가슴 칸에 넣기 · 짐 열기: 웅크리고 빈손 우클릭 또는 /지게"
    - "<dark_gray>짐은 이 지게에 묶여 있어서 벗어도 그대로, 다시 입으면 나옴"
    - "<dark_gray>죽어도 떨어뜨리지 않음 (짐도 그대로)"
  model: jige
  icon: jige_icon
  max-stack: 1
  equipment: { slot: chest, asset: stsv:jige }
  jige:
    slots: 54
    slowdown: 0.1
    payload: 30          # 적재 무게 (economy weights.yml 의 무게로, README "적재 무게")
    stages: [jige, jige_load_1, jige_load_2, jige_load_3]
    offset: [0, 0, 0]
