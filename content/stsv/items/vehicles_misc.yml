    - "<yellow>물을 보고 우클릭: 띄우기 · 우클릭: 타기"
    - "<yellow>웅크리고 우클릭: 짐칸(뒤) · 회수(앞)"
  model: raft
  icon: raft_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 3.5
    reverse-speed: 1.5
    acceleration: 1.2
    brake: 3
    coast: 1.0
    turn-rate: 55
    turn-speed: 1.5
    step-height: 0
    size: [3.4, 1.9, 0.9]
    click-height: 0.8
    wheel: raft_scull
    wheel-radius: 0.5
    wheels:
      - { at: [0, 0.65625, -1.4375] }
    seats:
      - { at: [0, 0.75, -0.46875] }
      - { at: [0, 0.5, 0.65625] }
    water:
      draft: 0.1875
      nudge-speed: 1.5
      rock: 1.2
    cargo:
      slots: 27
      payload: 40           # 적재 무게 (economy weights.yml 의 무게로, README "적재 무게")
      behind: -0.75
      at: [0, 0.46875, -0.96875]
      stages: [raft_catch_1, raft_catch_2, raft_catch_3, raft_catch_4]

