# 차도 수레도 아닌 탈것: 통통배(물 위에서만) · 지게(입는 짐 지게). 관리자만: /관리자 아이템목록 의 '탈것' 탭, /관리자 지급.
# 상점·뽑기·레시피에는 없음 (VehicleContentTest). 위치·설정의 뜻은 vehicles.yml 맨 위 설명과 같음.
#
# 통통배 (fishing_boat): vehicle 에 water: 가 있으면 배 (물 위에서만 움직임, 플러그인 BoatPhysics)
#   water.draft        물 위에 떠 있을 때 용골이 물에 잠기는 깊이 (블록). 모델의 흘수선과 맞춤 (0.375 = 6px)
#   water.nudge-speed  땅에 걸렸을 때(물이 빠졌을 때, 얕은 물가) 물 쪽으로만 밀 수 있는 속도 (블록/초, 0 = 못 움직임)
#   water.rock         물결에 흔들리는 정도 (1 = 잔잔하게, 0 = 흔들리지 않음). 보이는 모습만 흔들림
#   water.exhaust      운전하는 동안 연기가 퐁퐁 나는 굴뚝 끝 위치 [오른쪽, 위, 앞] (빼면 연기 없음)
#   wheels             배는 바퀴 대신 프로펠러 (길이 방향으로 돎). wheel-radius 가 클수록 천천히 돎
#   cargo              뒤 갑판의 어창 (behind 보다 뒤를 웅크리고 우클릭하면 열림). 짐: 생선 상자·그물·부표 → 가득 차면 방수포

raft:
  material: paper
  name: "<#c9a36a>뗏목"
  lore:
    - "<gray>1세대 · 통나무를 엮은 뗏목. 뒤의 노를 저어 감. 멍석 자리, 생선 말리는 덕장, 등불."
    - "<gray>2인승 · 물 위 최고 속도 3.5블록/초 · 어롱(고기 바구니) 27칸 · 엔진 없이 조용함"
    - "<gray>물 위에서만: 물가(땅)에서 멈추고 올라가지 않음, 용암·폭포·거품 기둥 앞에서 멈춤"
    - "<dark_gray>물을 보고 우클릭: 띄우기 · 우클릭: 타기"
    - "<dark_gray>W·S 앞뒤, A·D 방향, 웅크리기: 내리기 · 탄 채로 낚시 가능 (둘이 같이)"
    - "<dark_gray>웅크리고 뒤쪽 바구니 우클릭: 어롱 열기"
    - "<dark_gray>웅크리고 앞쪽 우클릭: 아이템으로 회수 (주인, 어롱이 비어 있어야 함)"
    - "<gold>그물</gold> <gray>배를 세우거나 천천히 가면 손그물이 저절로 내려가 물고기가 어롱으로 (60초쯤에 한 마리)"
    - "<gray>한 자리에서 4마리까지: 다 잡으면 48블록 넘게 옮겨야 다시 잡힘"
  model: raft
  icon: raft_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 3.5
    reverse-speed: 1.5
    acceleration: 1.2
    brake: 3
    coast: 1.0
    turn-rate: 55
    turn-speed: 1.5
    step-height: 0
    size: [3.4, 1.9, 0.9]
    click-height: 0.8
    wheel: raft_scull
    wheel-radius: 0.5
    wheels:
      - { at: [0, 0.65625, -1.4375] }
    seats:
      - { at: [0, 0.75, -0.46875] }
      - { at: [0, 0.5, 0.65625] }
    water:
      draft: 0.1875
      nudge-speed: 1.5
      rock: 1.2
    cargo:
      slots: 27
      payload: 40           # 적재 무게 (economy weights.yml 의 무게로, README "적재 무게")
      behind: -0.75
      at: [0, 0.46875, -0.96875]
      stages: [raft_catch_1, raft_catch_2, raft_catch_3, raft_catch_4]

rowboat:
