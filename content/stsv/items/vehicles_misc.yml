# 지게 (jige): 놓는 탈것이 아니라 입는 것. 가슴 칸(갑옷 자리)에 입으면 등에 지게가 보이고 짐을 넣을 수 있음 (플러그인 JigeModule).
#   jige.slots     짐 칸 수 (9 의 배수, 최대 54 = 큰 상자 한 개 화면)
#   jige.slowdown  지고 있는 동안 걸음이 이만큼 느려짐 (0.1 = 10%)
#   jige.stages    등에 보이는 모습: 빈 지게, 그다음 차는 정도에 따라 (나뭇단 몇 개 / 더 많이 / 가득 + 거적)
#   jige.offset    등에 보이는 위치를 옮김 [x 오른쪽, y 위, z 뒤] (픽셀)
#   짐은 아이템에 들어가지 않고 DB 에 지게 번호로 저장됨. 아이템을 복사해도 먼저 입은 하나만 짐을 열 수 있음.
jige:
  material: paper
  name: "<#d9b07a>지게"
  lore:
    - "<gold>1세대</gold> <dark_gray>· <gray>소나무로 짠 A자 지게. 등에 지고 짐을 나름."
    - "<gray>짐 54칸 · 지고 있는 동안 걸음 10% 느리게"
    - "<gray>가슴 칸(갑옷 자리)에 입음: 그동안 겉날개·가슴 갑옷은 못 입음"
    - "<dark_gray>입기: 우클릭 또는 가슴 칸에 넣기 · 짐 열기: 웅크리고 빈손 우클릭 또는 /지게"
    - "<dark_gray>짐은 이 지게에 묶여 있어서 벗어도 그대로, 다시 입으면 나옴"
    - "<dark_gray>죽어도 떨어뜨리지 않음 (짐도 그대로)"
  model: jige
  icon: jige_icon
  max-stack: 1
  equipment: { slot: chest, asset: stsv:jige }
  jige:
    slots: 54
    slowdown: 0.1
    payload: 30          # 적재 무게 (economy weights.yml 의 무게로, README "적재 무게")
    stages: [jige, jige_load_1, jige_load_2, jige_load_3]
    offset: [0, 0, 0]
