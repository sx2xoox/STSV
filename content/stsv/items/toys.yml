# 놀잇감: 보여 주기만 하는 아이템 (게임에서 유리해지는 것 없음). 후원 상점 (donation_shop.yml) 또는 /관리자 지급.
#
# 무한 폭죽 (infinite_firework): 우클릭하면 폭죽이 올라가고 아이템은 줄지 않음 (플러그인 PartyFireworkModule, config.yml party-firework).
#   - 폭죽은 색 · 모양이 쏠 때마다 다르고, 아무에게도 피해를 주지 않음
#   - 로켓이 아니라서 겉날개를 밀어 주지 않음 (나는 중 · 탈것 · 헤엄치는 중에는 쏠 수 없음), 한 번 쏘면 잠깐 기다림
#   - 손에 든 모습은 리소스팩의 3D 모델 stsv:party_firework (tools/assetgen/models/toys.py). 아이템 id 를 모델과 같은 이름으로 짓지 말 것
#     (팩이 같은 파일을 두 번 쓰게 됨)

infinite_firework:
  material: paper
  name: "<#ffd257>무한 폭죽"
  lore:
    - "<gray>줄무늬 로켓 세 발이 꽂힌 장난감 발사기."
    - "<gray>쏴도 줄지 않습니다. 쏠 때마다 색과 모양이 달라집니다."
    - "<dark_gray>우클릭: 폭죽 쏘기 (잠깐 기다렸다 다시)"
    - "<dark_gray>보여 주기만 합니다: 피해 없음, 겉날개로 나는 중에는 쏠 수 없음"
  item-model: stsv:party_firework
  max-stack: 1
