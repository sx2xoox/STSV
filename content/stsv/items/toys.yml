# 놀잇감. 후원 상점 (donation_shop.yml) 또는 /관리자 지급.
#
# 무한 폭죽 (infinite_firework): 우클릭하면 폭죽이 올라가고 아이템은 줄지 않음 (플러그인 PartyFireworkModule, config.yml party-firework).
#   - 겉날개로 나는 중에 쏘면 로켓처럼 밀어 줌 (세기 boost-power, 다시 쏘기까지 flight-cooldown-seconds). 이 아이템의 쓸모
#   - 폭죽은 색 · 모양이 쏠 때마다 다르고, 아무에게도 피해를 주지 않음 (나는 사람 몸에서 터져도)
#   - 손에 든 것은 로켓 아이템이 아니라 종이 (바닥에 놓이거나 줄지 않게): 미는 로켓은 플러그인이 따로 만듦
#   - 손에 든 모습은 리소스팩의 3D 모델 stsv:party_firework (tools/assetgen/models/toys.py). 아이템 id 를 모델과 같은 이름으로 짓지 말 것
#     (팩이 같은 파일을 두 번 쓰게 됨)

infinite_firework:
  material: paper
  name: "<#ffd257>무한 폭죽"
  lore:
    - "<gray>줄무늬 로켓 세 발이 꽂힌 장난감 발사기."
    - "<gray>쏴도 줄지 않습니다. 쏠 때마다 색과 모양이 달라집니다."
    - "<gray>겉날개로 나는 중에 쏘면 <white>로켓처럼 밀어 줍니다</white>."
    - "<dark_gray>우클릭: 폭죽 쏘기 (잠깐 기다렸다 다시) · 피해 없음"
  item-model: stsv:party_firework
  max-stack: 1
