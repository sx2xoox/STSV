# 장식 가구 (일관성 테스트로 만든 모델)

potted_plant:
  material: paper
  name: "<#6fae4f>화분 나무"
  lore:
    - "<gray>테라코타 화분에 심은 작은 관목."
  model: potted_plant
  max-stack: 16
  furniture:
    cells: [[0, 0, 0]]
    solid: true

chair:
  material: paper
  name: "<#c08a5a>안락의자"
  lore:
    - "<gray>누빔 쿠션을 얹은 원목 의자."
  model: chair
  max-stack: 16
  furniture:
    cells: [[0, 0, 0]]
    solid: true

crystal_shrine:
  material: paper
  name: "<gradient:#c58cff:#ff8ce6>마력 수정 제단</gradient>"
  lore:
    - "<gray>스스로 빛나는 수정이 박힌 석재 제단."
  model: crystal_shrine
  max-stack: 1
  furniture:
    cells: [[0, 0, 0], [0, 1, 0]]
    solid: true
    brightness: 12
