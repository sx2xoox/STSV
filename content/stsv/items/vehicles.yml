      - { at: [0.8125, 0.375, 1.375], steer: true }
      - { at: [-0.8125, 0.375, -1.4375] }
      - { at: [0.8125, 0.375, -1.4375] }
    seats:
      - { at: [-0.44, 0.16, -0.19] }
