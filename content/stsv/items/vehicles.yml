    cargo:
      slots: 27
      behind: -0.75
      at: [0, 0.6, -1.0]
      payload: 100          # 적재 무게 (economy weights.yml 의 무게로, README '적재 무게')

# 리어카: 타는 것이 아니라 끄는 탈것 (seats 없음). 우클릭 = 손잡이 잡기 / 놓기, 웅크리기 = 놓기.
#   pull.hitch             끄는 사람이 서는 곳 (가운데 = 바퀴 축에서 앞으로 몇 블록)
#   pull.slowdown          끄는 동안 걷는 속도를 이만큼 줄임 (0.4 = 40% 느리게). 달리기는 안 됨
#   pull.release-distance  리어카가 걸려 끄는 사람이 손잡이에서 이만큼 멀어지면 저절로 놓침 (블록)
#   pull.rest-tilt         아무도 잡지 않으면 손잡이 쪽으로 이만큼 기울어 손잡이 끝이 땅에 닿음 (도)
#   pull.sound             굴러갈 때 작은 소리 (key 소리, volume 크기, pitch 음높이, every 몇 블록마다). 빼면 소리 없음
#   cargo.slots            짐칸 칸 수 (9 의 배수, 한 쪽 45칸, 최대 810)
#   cargo.payload          적재 무게 (실을 수 있는 무게, 없으면 칸 수 × 2)
hand_cart:
  material: paper
  name: "<#d3a86a>리어카"
  lore:
    - "<gray>1세대 · 짐을 나르는 나무 손수레. 바퀴 둘, 긴 손잡이."
    - "<gray>짐칸 보관함 135칸 (3쪽) · 타지 않고 끌고 다님"
    - "<dark_gray>땅에 우클릭: 세우기 · 우클릭: 손잡이 잡기 / 놓기"
    - "<dark_gray>끄는 동안 걸음이 느려지고 달릴 수 없음 · 웅크리기: 놓기"
    - "<dark_gray>웅크리고 짐칸 우클릭: 짐칸 열기 (놓은 뒤)"
    - "<dark_gray>웅크리고 손잡이 우클릭: 아이템으로 회수 (주인, 짐칸이 비어 있어야 함)"
  model: hand_cart
  icon: hand_cart_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    step-height: 1.0
    size: [2.3, 1.65, 1.25]
    click-height: 1.2
    wheel: wheel_handcart
    wheel-radius: 0.375
    wheels:
      - { at: [-0.71875, 0.375, 0] }
      - { at: [0.71875, 0.375, 0] }
    pull:
      hitch: 1.9
      slowdown: 0.4
      release-distance: 4
      rest-tilt: 16
      sound: { key: block.wood.step, volume: 0.12, pitch: 0.6, every: 1.8 }
    cargo:
      slots: 135
      payload: 150          # 적재 무게 (economy weights.yml 의 무게로, README '적재 무게')
      behind: 1.2
      at: [0, 0.875, 0]
      stages: [hand_cart_cargo_1, hand_cart_cargo_2, hand_cart_cargo_3, hand_cart_cargo_4]
