# 탈것 세대 사다리: 1세대 리어카 · 4세대 1톤 트럭 (2·3·5세대와 특수는 vehicles_road.yml). 경찰차·골프 카트·컨버터블 스포츠카는 이벤트 탈것 (세대 없음).
# 탈것 (리어카만 경제 서버 상점의 '탈것' 분류에서 팖: 가격은 economy shop.yml. 나머지는 관리자만: /관리자 아이템목록 의 '탈것' 탭, /관리자 지급). 뽑기·레시피에는 없음.
# 땅에 우클릭 = 내 방향으로 세우기 · 우클릭 = 타기 · 웅크리고 우클릭 = 아이템으로 회수 (주인·관리자)
# 1톤 트럭은 웅크리고 짐칸을 우클릭하면 짐칸(보관함)이 열림. 짐칸에 물건이 있으면 회수할 수 없음.
# 리어카(hand_cart)는 타지 않고 끔: 맨 아래 설명. 주인이 /탈것 권한 <플레이어> 로 허락한 사람도 운전·끌기·짐칸을 쓸 수 있음.
#
# vehicle 설정 (블록 단위, 위치는 [오른쪽, 위, 앞] = 탈것 기준)
#   body-scale     몸체 모델을 보여 줄 배율 (모델이 너무 커서 절반 크기로 그려 둔 것을 2배로)
#   speed          최고 속도 (블록/초, 서버 설정 vehicles.max-speed 를 넘지 않음)
#   reverse-speed  후진 최고 속도
#   acceleration   가속 (블록/초²), brake = 브레이크, coast = 아무 키도 안 누를 때 줄어드는 정도
#   turn-rate      방향을 트는 빠르기 (도/초). turn-speed (블록/초) 보다 느리면 그만큼 천천히 돌고, 서 있으면 돌지 않음
#   step-height    그대로 올라갈 수 있는 턱 높이 (1 = 한 블록, 반 블록·계단은 부드럽게)
#   size           [길이, 너비, 높이] 블록과 부딪히는 크기
#   click-height   우클릭으로 잡히는 높이 (타고 있는 사람의 시야를 가리지 않게 지붕보다 낮게)
#   wheel          바퀴 모델, wheel-radius 바퀴 반지름 (굴러가는 빠르기)
#   wheels         바퀴 위치. steer: true = 앞바퀴 (조향 각도가 보임)
#   over-cap       true = 서버 상한(config.yml vehicles.max-speed)을 넘어 자기 speed 까지 냄 (speed 20 이하. 스포츠카)
#   seats          좌석 위치 (앉는 면의 높이). 첫 번째가 운전석
#   horn           경적 (운전 중 스페이스를 누르고 있는 동안): sound 누르는 동안의 소리, release 뗄 때 끝소리 (둘 다 리소스팩 소리,
#                  tools/assetgen/sounds.py 가 만듦), volume (1 = 16블록쯤까지 들림, 1.5 = 24블록).
#                  config.yml vehicles.horn.custom-sound: false 일 때만: vanilla 바닐라 소리, pitch 음높이,
#                  times 누를 때마다 몇 번 울릴지 (2 = 빵빵), gap 그 사이 틱
#   engine         운전 중 엔진 소리 (리소스팩 소리, 짧은 조각을 이어서 틀어 줌): sound, volume 달릴 때 크기 (1 이하, 16블록까지),
#                  idle-volume 서 있을 때 크기 (0 = 조용), idle-pitch 서 있을 때 음높이, top-pitch 최고 속도 때 음높이 (0.5 ~ 2),
#                  segment-ticks 소리 조각 하나의 길이 (틱, 음높이 1 기준. sounds.py 의 ENGINE_PERIOD 와 같아야 함)
#   lights         경광등 (운전 중 Ctrl = 사이렌 켜기·끄기): dark 꺼진 모델, flash 모델들 (번갈아 보임), at 위치
#   cargo          짐칸 (보관함): slots 칸 수 (9 의 배수, 한 쪽 45칸: 450 = 10쪽, 최대 810), stages 짐 모델 (차는 정도: 1~25% / ~50% / ~75% / 그 이상),
#                  at 짐 모델 위치, behind = 이 앞 위치보다 뒤를 웅크리고 우클릭하면 짐칸이 열림

police_car:
  material: paper
  name: "<#6f93e8>경찰차"
  lore:
    - "<gray>흰 바탕에 파란 띠를 두른 순찰차. 4인승."
    - "<gray>최고 속도 9블록/초 · 스페이스: 경적 · Ctrl: 사이렌"
    - "<dark_gray>땅에 우클릭: 세우기 · 우클릭: 타기"
    - "<dark_gray>W·S 앞뒤, A·D 방향, 웅크리기: 내리기"
    - "<dark_gray>웅크리고 우클릭: 아이템으로 회수 (주인)"
  model: police_car
  icon: police_car_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 10
    reverse-speed: 3.5
    acceleration: 3.0
    brake: 9
    coast: 2
    turn-rate: 72
    turn-speed: 3
    step-height: 1.0
    size: [4.6, 1.9, 1.65]
    click-height: 1.1
    wheel: wheel_road
    wheel-radius: 0.344
    wheels:
      - { at: [-0.8125, 0.344, 1.4375], steer: true }
      - { at: [0.8125, 0.344, 1.4375], steer: true }
      - { at: [-0.8125, 0.344, -1.4375] }
      - { at: [0.8125, 0.344, -1.4375] }
    seats:
      - { at: [-0.45, 0.28, 0.15] }
      - { at: [0.45, 0.28, 0.15] }
      - { at: [-0.45, 0.28, -0.7] }
      - { at: [0.45, 0.28, -0.7] }
    horn: { sound: stsv:vehicle.police_car.horn, release: stsv:vehicle.police_car.horn_end, volume: 1.5,
            vanilla: block.note_block.didgeridoo, pitch: 1.4, times: 1 }
    engine: { sound: stsv:vehicle.police_car.engine, volume: 0.35, idle-volume: 0.16, idle-pitch: 0.6, top-pitch: 1.45, segment-ticks: 10 }
    lights:
      dark: police_lightbar_off
      flash: [police_lightbar_a, police_lightbar_b]
      at: [0, 1.656, -0.281]
    # 트렁크 (웅크리고 차 뒤쪽을 우클릭): 작은 짐칸, 짐은 안 보임
    cargo:
      slots: 27
      behind: -1.3
      at: [0, 0.6, -1.8]
      payload: 100          # 적재 무게 (economy weights.yml 의 무게로, README '적재 무게')

# 이벤트 한정 · 컨버터블 스포츠카: 지붕 없는 2인승. 짐칸 없음 (실용성 없음), 가장 빠르고 가장 빨리 가속함
