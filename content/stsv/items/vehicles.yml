      - { at: [0.4375, 0.76, -0.21875] }         # 동승자: 사이드카 안
    plates:
      - { at: [-0.40625, 0.578, -1.2656], back: true, width: 0.26, height: 0.12 }
    horn: { sound: stsv:vehicle.delivery_scooter.horn, release: stsv:vehicle.delivery_scooter.horn_end, volume: 1.5,
