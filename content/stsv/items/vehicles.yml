hyper_car:
  material: paper
  name: "<#5ca5f7>하이퍼카"
  lore:
    - "<gold>후원 한정</gold> <gray>· 2인승 미드십 쿠페"
    - "<white>14블록/초 <gray>· 짐칸 없음"
    - "<dark_gray>W·S·A·D 운전 · 웅크리기: 내리기"
    - "<dark_gray>스페이스: 경적 · Ctrl+A·D: 드리프트"
    - "<yellow>우클릭: 세우기 · 타기"
    - "<yellow>웅크리고 우클릭: 회수"
  model: hyper_car
  icon: hyper_car_icon
  max-stack: 1
  vehicle:
    body-scale: 2
    speed: 14
    over-cap: true
    drift: { angle: 30, min-speed: 6, build: 100, recover: 160, turn: 1.5, drag: 1.5 }
    reverse-speed: 4
    acceleration: 7.0
    brake: 15
    coast: 2.5
    turn-rate: 80
    turn-speed: 4
    step-height: 1.0
    size: [4.6, 2.0, 1.4]
    click-height: 0.9
    wheel: wheel_hyper
    wheel-radius: 0.375
    wheels:
      - { at: [-0.8125, 0.375, 1.375], steer: true }
      - { at: [0.8125, 0.375, 1.375], steer: true }
      - { at: [-0.8125, 0.375, -1.4375] }
      - { at: [0.8125, 0.375, -1.4375] }
    seats:
      - { at: [-0.34, 0.05, -0.1] }
      - { at: [0.34, 0.05, -0.1] }
    # 움직이는 부품 (몸체와 같은 자리에 그린 모델을 경첩 hinge 둘레로 turn 도 돌리거나 slide 만큼 밀어 냄).
    #   when / slide-when: door = 그 좌석(seats)에 타고 내릴 때 잠깐 열림, speed = 최고 속도의 from 비율에서 다 나옴(절반부터 시작),
    #   brake = 달리다 브레이크(반대 페달)를 밟는 동안, engine = 시동이 걸려 있는 동안. ticks = 다 움직이는 데 걸리는 틱.
    movers:
      # 문: 앞 위 모서리를 축으로 위로 열림 (시저 도어)
      - { model: hyper_car_door_l, hinge: [-0.84, 0.72, 0.81], axis: [1, 0, 0], turn: -62, when: door, seats: [0], ticks: 9 }
      - { model: hyper_car_door_r, hinge: [0.84, 0.72, 0.81], axis: [1, 0, 0], turn: -62, when: door, seats: [1], ticks: 9 }
      # 윙: 빨라지면 올라오고(slide), 브레이크를 밟으면 앞 모서리를 축으로 세워짐(에어 브레이크)
      - { model: hyper_car_wing, hinge: [0, 0.86, -1.94], axis: [1, 0, 0], turn: -38, when: brake, slide: [0, 0.19, 0], slide-when: speed, from: 0.6, ticks: 6 }
    # 이름 번호판: 주인의 닉네임 (at = 판의 가운데, back = 뒤쪽 판, width 안에 들어가게 글자 크기를 맞춤)
    plates:
      - { at: [0, 0.27, 2.3125], width: 0.4, height: 0.1 }
      - { at: [0, 0.22, -2.3125], back: true, width: 0.6, height: 0.11 }
    horn: { sound: stsv:vehicle.hyper_car.horn, release: stsv:vehicle.hyper_car.horn_end, volume: 1.5,
            vanilla: block.note_block.didgeridoo, pitch: 1.8, times: 1 }
    engine: { sound: stsv:vehicle.hyper_car.engine, volume: 0.55, idle-volume: 0.2, idle-pitch: 0.5, top-pitch: 2.0, segment-ticks: 10 }

