# ─────────────────────────────────────────────────────────────────────────────────────────────
#  [치장] 보유해야 입을 수 있음. 교환권 우클릭 / 상점 구매 → 보유 → /치장 에서 착용
#  rarity: common(일반) / rare(희귀) / epic(영웅) / legendary(전설)
#  slot: head(머리) / above(머리 위) / shoulder(어깨) / back(등) / tail(꼬리). 부위마다 하나씩 착용
#    머리: 투구 칸은 그대로 두고 다른 사람에게 보이는 머리만 바뀜
#    나머지: 플레이어를 따라다니는 모델. offset: [오른쪽, 위, 뒤] 픽셀(1/16칸), scale: 크기, bob: 둥실둥실
# ─────────────────────────────────────────────────────────────────────────────────────────────
