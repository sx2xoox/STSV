# ──────────────────────────────────────────────────────────────────
#  치장 C 묶음: 허리 8종, 발자취 3종, 처치 효과 3종, 오라 8종 (모두 치장 뽑기) + 각각의 교환권
#  형식은 cosmetics.yml / cosmetic_vouchers.yml 과 같음.
#    허리(waist): 허리띠 높이에 붙는 모델 (config.yml cosmetics.anchors.waist), 몸을 따라 돎
#    오라(aura): 가만히 서 있으면 몸 주위를 도는 파티클 고리. count = 고리의 점 수, spread = 반지름(칸),
#                height = 발에서의 높이 (0.1 = 바닥 고리, 1 = 가슴 높이)
#  모델: tools/assetgen/models/cosmetics_batch_c.py · 교환권 그림: tools/assetgen/voucher_art_batch_c.py
# ──────────────────────────────────────────────────────────────────

