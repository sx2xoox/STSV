# STSV 코어 설정

resource-pack:
  # 리소스팩을 자동으로 만들어서 접속한 플레이어에게 보냅니다.
  enabled: true
  # 26.3 = 97 (서버 버전을 올리면 이 숫자도 올려야 합니다)
  pack-format: 97
  required: true
  prompt: "<gradient:#ffb35c:#ff6a3d>STSV</gradient> <gray>서버 전용 리소스팩이 필요합니다."
  # 내장 웹서버로 리소스팩을 배포합니다. public-url은 플레이어가 접속할 수 있는 주소여야 합니다.
  host:
    enabled: true
    bind: 0.0.0.0
    port: 8163
    public-url: "http://localhost:8163"
  # 내장 웹서버 대신 외부 주소를 쓸 때 (host.enabled: false 일 때 사용)
  external-url: ""

furniture:
  # 가구를 부술 때 아이템을 돌려줄지 (크리에이티브 제외)
  drop-on-break: true
  # 가구가 보이는 최대 거리 배율 (1.0 = 기본)
  view-range: 1.0
  # 가구 모델이 뒤돌아 보이면 180으로 바꾸세요 (충돌 블록 위치는 그대로입니다)
  display-yaw-offset: 0
  # 가구를 들고 있으면 설치될 위치를 미리 보여줍니다 (본인에게만 보임, 초록=설치 가능 / 빨강=불가)
  preview: true

editor:
  # /stsv recipe create 에서 네임스페이스 없이 id 를 쓰면 이 콘텐츠 팩에 저장됩니다
  namespace: stsv

cosmetics:
  # 치장을 본인 3인칭(F5) 화면에도 보여줍니다
  show-to-self: true
  # true: OP(권한 stsv.cosmetic.*)는 모든 치장을 보유한 것으로 취급 (테스트용). 실제 운영은 false
  op-owns-all: false
  # 옷장 시점: 마네킹까지 거리(블록). 미리보기 때 메뉴가 닫히므로 마네킹은 화면 가운데에 보입니다
  wardrobe-distance: 3.2
  # 옷장 메뉴 (큰 상자 54칸, 칸 번호 0~53: 위에서부터 줄마다 0~8, 9~17, ...)
  # 치장이 칸 수보다 많으면 페이지가 나뉩니다.
  menu:
    # 전용 UI 배경: 기본 콘텐츠 팩의 폰트 글리프(assets/stsv/font/wardrobe.json, textures/gui/wardrobe.png).
    # 제목 맨 앞에 붙어서 상자 화면 전체를 덮습니다. 바닐라 상자 화면을 쓰려면 "" 로
    #   \uf801 = 8칸 왼쪽으로, \ue000 = 배경(176x222), \uf802 = 제목 글자 위치로 되돌아감
    background: "<white><font:stsv:wardrobe>\uf801\ue000\uf802</font></white>"
    title: "<#f0e2b0>옷장 <#b9a6d6>· 보유 {owned}/{total}"
    # 배경 그림의 칸 위치와 맞춰야 합니다 (tools/assetgen/gui.py 의 COSMETIC_SLOTS, BUTTONS)
    cosmetic-slots: [10, 11, 12, 13, 14, 15, 16,
                     19, 20, 21, 22, 23, 24, 25,
                     28, 29, 30, 31, 32, 33, 34,
                     37, 38, 39, 40, 41, 42, 43]
    slots: { prev: 45, take-off: 47, info: 49, exit: 51, next: 53 }
    # 버튼 아이콘을 리소스팩 모델(stsv:gui/prev 등)로 표시. false 면 바닐라 아이템(화살, 방벽 ...)
    custom-icons: true
    # 빈 칸을 유리판으로 채움 (배경을 끈 경우에 켜면 보기 좋음)
    filler: false
