# STSV 코어 설정

resource-pack:
  # 리소스팩을 자동으로 만들어서 접속한 플레이어에게 보냅니다.
  enabled: true
  # 26.3 = 97 (서버 버전을 올리면 이 숫자도 올려야 합니다)
  pack-format: 97
  required: true
  prompt: "<gradient:#ffb35c:#ff6a3d>STSV</gradient> <gray>서버 전용 리소스팩이 필요합니다."
  # 게임 기본 글꼴(채팅, 아이템 이름·설명, 메뉴 제목, 표지판, 스코어보드)의 한글을 픽셀 글꼴 Neo둥근모로 바꿉니다.
  # 바닐라 한글과 같은 방식(16px 글자를 8px 줄에)이라 줄 간격·굵게·그림자는 그대로. 영문·숫자·기호는 마인크래프트 그대로.
  # false = 바닐라 글꼴
  default-font: true
  # 리소스팩을 서버가 직접 배포합니다.
  host:
    enabled: true
    # same-port: 마인크래프트 접속 포트로 함께 배포합니다. 포트를 따로 열거나 주소를 적을 필요가 없습니다 (기본)
    # separate-port: 아래 port 로 따로 배포합니다. 서버 앞에 Velocity/BungeeCord 같은 프록시나
    #                TCPShield 같은 디도스 방어가 있으면 이쪽을 쓰고, 그 포트를 외부에 열어야 합니다
    mode: same-port
    # separate-port 전용
    bind: 0.0.0.0
    port: 8163
    # 비워 두면 플레이어가 접속할 때 입력한 주소를 그대로 씁니다.
    # 접속 주소로 서버에 바로 닿지 않을 때만 적으세요 (예: 포트포워딩으로 외부 포트와 서버 포트가 다를 때)
    # 예: "http://mc.example.com:25565"  (localhost 는 무시됩니다)
    public-url: ""
  # 서버가 배포하지 않고 외부 주소를 쓸 때 (host.enabled: false 일 때 사용)
  external-url: ""

# 통합 메뉴 (/메뉴): 모든 플레이어 기능을 한곳에. 모양은 contents/stsv/menus/hub.yml
# (경제 서버가 있으면 contents/economy/menus/hub.yml 이 대신 열림)
hub:
  # 웅크린 채 F(손 바꾸기 키) = 통합 메뉴. 그냥 F 는 그대로 손 바꾸기
  hotkey: true
  # 처음 접속했을 때 한 번만 Shift+F 안내
  join-tip: true

# 건축월드 / 야생월드. 인벤토리는 두 월드가 함께 씀
worlds:
  # 건축월드: 땅을 사서 짓는 곳 (경제 서버: 내 땅에서만 블록을 부수고 놓을 수 있음). 비우면 서버 기본 월드(level-name)
  build-world: ""
  # 건축월드 평화로움: 적대 몹(좀비·크리퍼·팬텀·슬라임 등)이 생기지 않고, 들어온 적대 몹은 사라짐 (자연 스폰, 스포너, 습격, 순찰대 모두).
  # 난이도는 그대로라 배고픔은 줄어듦. 관리자의 명령어·스폰알 소환은 그대로. 야생월드와 그 지옥·엔드는 영향 없음
  build-peaceful: true
  # 야생월드: 보호 없는 자원 월드. 없으면 서버가 켜질 때 새로 만듦 (일반 지형, 새 시드). 비우면 야생월드 없음
  # 초기화: /관리자 야생초기화 (안의 플레이어를 건축월드로 보낸 뒤 새 시드로 다시 만듦)
  wild-world: wild
  # 야생월드의 지옥·엔드: 비우면 "<wild-world>_nether", "<wild-world>_the_end". 없으면 켜질 때 야생월드와 같은 시드로 만듦
  # 야생월드의 지옥 포털 -> 야생 지옥 (좌표 1/8, 바닐라처럼 포털을 찾거나 만듦), 엔드 포털 -> 야생 엔드 (드래곤, 관문, 엔드 시티 그대로)
  # 건축월드의 포털은 어디로도 가지 않음 (지옥 포털에 불도 안 붙음). 서버 기본 지옥·엔드(<level-name>_nether, _the_end)는
  # 쓰지 않음: 거기서 접속하거나 되살아나면 야생월드 스폰으로. 지우지는 않음 (바닐라 포털에 필요, README 참고)
  # 야생월드를 비우면(wild-world: "") 야생 지옥·엔드도 없고 포털은 모두 바닐라대로
  wild-nether: ""
  wild-end: ""
  # 죽어도 아이템과 경험치가 남는 월드 (keepInventory 게임 규칙을 켬, 켜질 때와 그 월드를 불러올 때마다).
  # build = 건축월드, wild = 야생월드, nether = 야생 지옥, end = 야생 엔드. 목록에 없는 월드의 규칙은 건드리지 않음
  # (빼도 이미 켜진 규칙은 그대로: 끄려면 그 월드에서 /gamerule keep_inventory false)
  keep-inventory: [nether, end]
  # /건축월드, /야생월드: 이 시간(초) 동안 가만히 있어야 이동 (움직이거나 피해를 입으면 취소). 관리자는 바로
  # 건축월드로 = 그 월드의 마지막 위치 (없으면 스폰)
  travel-warmup-seconds: 3
  # 야생월드로 = 매번 무작위 위치 (스폰에서 min-distance ~ radius 블록, 월드 경계 안, 물·용암·나뭇잎·선인장 위는 피함)
  wild-random:
    radius: 5000
    min-distance: 300
    # 준비된 자리(아래 wild-spots)가 없을 때 안전한 자리를 이만큼 찾아보고 없으면 이동하지 않음
    tries: 12
    # 야생월드로 다시 가려면 기다려야 하는 시간(초). 정찰용 반복 이동 방지. 관리자는 없음
    cooldown-seconds: 60
  # /야생월드 렉 방지: 서버가 한가할 때 안전한 자리를 미리 찾아 두고(주변 3x3 청크까지 미리 만들어 둠) /야생월드 는 그중 하나로 바로 보냄.
  # 한 번에 청크 하나씩만, TPS·틱 시간이 괜찮을 때만, 청크마다 쉬면서. 서버를 껐다 켜도 남음 (plugins/STSV/data/wild-spots.txt)
  # 상태: /관리자 야생스팟 (또는 /관리자 보고서). 서버 쪽 설정(시야 거리, Chunky 미리 생성)은 README "야생월드 렉 줄이기"
  wild-spots:
    # 미리 찾아 둘 자리 수 (0 = 끔: 이동할 때마다 그 자리에서 찾음)
    pool: 24
    # 청크 하나를 만들고 다음 청크까지 쉬는 시간(초)
    interval-seconds: 2
    # /관리자 야생스팟 채우기 <개수> 로 빠르게 채울 때의 쉬는 시간(초). 이때도 한 번에 하나씩, 서버가 바쁘면 쉼
    fast-interval-seconds: 0.25
    # 1분 평균 TPS 가 이보다 낮거나, 평균 틱 시간(ms)이 이 이상이면 청크를 만들지 않고 기다림
    min-tps: 19
    max-mspt: 40
    # 자리 주변을 미리 만들어 둘 청크 반경 (1 = 3x3, 0 = 그 청크만)
    arrival-chunk-radius: 1
    # 준비된 자리가 없을 때: 이미 만들어진 청크를 먼저 살펴보고, 새 지형은 이 개수까지만 만들어 봄 (못 찾으면 이동하지 않음)
    fallback-generate-tries: 2

# 엘리베이터: 이 블록 위에서 점프 = 같은 줄(세로)의 위쪽 다음 엘리베이터 블록 위로, 웅크리기 = 아래쪽으로. 모든 월드.
# 도착할 블록 위 두 칸이 비어 있어야 함(아니면 건너뛰고 그다음 것). 날기·겉날개·탈것·관전 중에는 동작하지 않음
elevator:
  enabled: true
  # 엘리베이터 블록 (마인크래프트 블록 이름, 올라설 수 있는 블록)
  block: BONE_BLOCK
  # 위·아래로 찾는 최대 거리(블록)
  max-distance: 32
  # 한 번 탄 뒤 다시 탈 수 있을 때까지(초). 점프 키를 누르고 있어도 연달아 올라가지 않게
  cooldown-seconds: 0.5

# 텔레포트 요청: /텔포 <플레이어> (그 사람에게 가기), /텔포여기 <플레이어> (내 쪽으로 부르기), /수락, /거절, /텔포취소, /텔포차단
# 수락하면 이동하는 사람이 worlds.travel-warmup-seconds 동안 가만히 있어야 이동 (움직이거나 피해를 입으면 취소). 관리자는 바로
tpa:
  # 요청이 사라지기까지(초)
  timeout-seconds: 60
  # 텔레포트 요청으로 이동한 뒤, 요청한 사람이 다음 요청을 보낼 수 있을 때까지(초). 관리자는 없음
  cooldown-seconds: 30
  # 한 사람이 요청을 보낸 뒤 다음 요청(다른 사람에게, 또는 /tpa ↔ /tpahere 바꾸기)을 보낼 수 있을 때까지(초). 요청·알림음 도배 방지. 관리자는 없음
  request-gap-seconds: 5

furniture:
  # 가구를 부술 때 아이템을 돌려줄지 (크리에이티브 제외)
  drop-on-break: true
  # 가구·작물·기계가 보이는 거리 전체에 곱하는 배율 (1.0 = 아래 display.view-distance 그대로)
  view-range: 1.0
  # 가구 모델이 뒤돌아 보이면 180으로 바꾸세요 (충돌 블록 위치는 그대로입니다)
  display-yaw-offset: 0
  # 가구를 들고 있으면 설치될 위치를 미리 보여줍니다 (본인에게만 보임, 초록=설치 가능 / 빨강=불가)
  preview: true
  # 충돌(투명 방벽) 블록을 둘 칸: 모델이 그 칸을 이 비율 이상 채울 때만 (0.30 = 30%, 1/4블록 단위로 계산)
  # 방벽이 없는 칸도 가구 자리라 블록·물·피스톤 등은 들어갈 수 없습니다. 0 이면 예전처럼 모든 칸에 방벽
  barrier-fill: 0.30

# 3D 모델(가구·작물·기계 = 디스플레이 엔티티)을 플레이어 화면에 얼마나 그릴지. 프레임(FPS)에 가장 큰 영향.
# 블록은 청크 단위로 한 번 구워 두고 그리지만, 모델은 매 프레임 하나씩 따로 그립니다. 작물 수천 개가 보이는 큰 농장 근처에서
# 프레임이 떨어지는 이유. 주변에 몇 개가 그려지는지: /관리자 보고서 주변 [반경]
# 바꾼 뒤 /관리자 리로드 하면 이미 설치된 것에도 적용됩니다 (청크를 다시 불러올 때도).
display:
  # 이 거리(블록)보다 멀면 그리지 않음. 플레이어 비디오 설정 '엔티티 거리' 100% 기준 (50% = 절반, 200% = 두 배까지).
  # 0 = 바닐라 기본 64. 서버 spigot.yml 의 entity-tracking-range.display (기본 128) 보다 멀리는 보내지도 않음
  view-distance:
    # 작물: 수가 가장 많고 작음. 32블록 밖의 작물은 화면에서 몇 픽셀이라 잘 티가 나지 않음
    crops: 32
    # 1칸짜리 소품 (방석, 다기 세트, 분재 등)
    small-furniture: 32
    # 2칸 이상 가구 (고타츠, 도리이, 다다미 등)
    large-furniture: 48
    # 직업 기계 등 작동하는 가구 (크고 눈에 띄어 예전과 같은 64)
    machines: 64
    # 경제 서버 국도의 방향 표지판 (모델과 글씨): 크고 몇 개 없으며 멀리서 읽혀야 함
    road-signs: 96
  # 모델 크기를 클라이언트에 알려서, 화면 밖(뒤쪽·옆)에 있는 모델은 그리지 않게 함. 보이는 모습은 같음.
  # false = 예전처럼 화면 밖의 것도 늘 그림 (모델이 화면 가장자리에서 잘려 보이는 일이 있을 때만)
  frustum-culling: true
  # 기계의 도는 부품(바퀴, 맷돌, 나사): 이 거리(블록) 안에 플레이어가 없으면 멈춰 둠 (기계 작동은 그대로). 0 = 늘 돌림
  animate-range: 32

# 커스텀 작물(토마토, 옥수수 등)을 어떻게 그릴지
crops:
  # blocks = 진짜 블록으로 (기본). 리소스팩이 트립와이어(실) 블록의 상태마다 작물 단계 모양을 그림 (같은 작물도 네 방향 중 무작위로 돌아감).
  #          엔티티가 없어 큰 농장 근처도 프레임이 거의 안 떨어짐. 실(string)은 블록으로 설치할 수 없게 됨 (다른 쓰임은 그대로).
  #          Paper 설정 config/paper-global.yml 의 block-updates.disable-tripwire-updates: true 를 꼭 켜세요 (README).
  # entities = 예전처럼 아이템 디스플레이 + 클릭 상자 엔티티 (display.view-distance.crops 가 이때만 쓰임).
  # 바꾸면 서버를 다시 시작하세요 (/관리자 리로드 로는 안 바뀜). 심어 둔 작물은 그대로: 청크를 불러올 때 새 방식으로 바뀜.
  render: blocks
  # blocks 일 때, 작물이 아닌 트립와이어(전에 설치한 실, 정글 사원 함정, 새로 만들어지는 지형의 것)를 청크마다 한 번 어떻게 할지:
  # air = 없앰 (기본. 작물로 잘못 보일 일이 없음), string = 평범한 실 한 조각 모양으로 바꿈 (이어진 모양은 사라짐, 부수면 실이 나옴)
  stray-tripwire: air

# 탈것 (경찰차, 1톤 트럭, 골프 카트: contents/stsv/items/vehicles.yml 에서 탈것마다 속도·크기·좌석). 바꾼 뒤 /관리자 리로드
vehicles:
  # 최고 속도 상한 (블록/초). 탈것의 speed 가 더 커도 이 값까지만. 너무 빠르면 청크를 불러오는 것이 따라가지 못해 끊겨 보임
  # (탈것 설정에 over-cap: true 가 있는 탈것은 이 값을 넘어 자기 speed 까지 냄: 컨버터블 스포츠카 14)
  max-speed: 10
  # 탈것과 타고 있는 사람이 틱(0.05초) 사이를 이어서 움직이는 틱 수 (1~5). 2 = 부드럽고 반응도 빠름, 3 = 더 부드럽지만 조금 늦게 따라옴
  smoothing-ticks: 2
  # 이 거리(블록)까지 보임 (플레이어 비디오 설정 '엔티티 거리' 100% 기준)
  view-distance: 96
  # 움직이는 동안 위치를 DB에 저장하는 간격(초). 멈추면 바로 저장. 서버가 갑자기 꺼져도 마지막으로 저장된 자리에 있음
  save-seconds: 5
  # 경찰차 사이렌 (운전 중 Ctrl(달리기 키)을 누를 때마다 켜고 끔: 경광등이 빨강·파랑으로 깜빡이고 소리가 남. 내리면 꺼짐)
  siren:
    # false = 경광등만 깜빡이고 소리는 안 냄
    sound-enabled: true
    sound: block.note_block.bit
    # 1 = 16블록쯤까지 들림 (2 = 32블록)
    volume: 1.4
    # 두 음을 번갈아 (왱-왱)
    pitch-high: 1.6
    pitch-low: 1.2
    # 한 음의 길이 (틱)
    interval: 8
    # 경광등 색이 바뀌는 간격 (틱)
    flash-ticks: 4
  # 경적: 운전 중 스페이스를 누르고 있는 동안 울리고, 떼면 곧 멈춤 (짧게 누르면 짧게 "빵"). 소리는 탈것마다 vehicles.yml 의 horn
  horn:
    # true = 리소스팩의 STSV 경적 소리 (누르는 동안 이어서 울리고 떼면 끝소리). false = 바닐라 소리 (vehicles.yml 의 horn.vanilla, 누를 때마다 한 번)
    custom-sound: true
    # 짧게 눌러도 이만큼은 울림 (틱, 4 = 0.2초)
    min-ticks: 4
    # 계속 누르고 있어도 이 시간(초)이 지나면 멈춤. 다시 울리려면 스페이스를 뗐다가 눌러야 함 (최대 5 = 소리 파일 길이)
    max-hold-seconds: 5
    # 멈춘 뒤 다시 울릴 수 있을 때까지 (틱, 6 = 0.3초). 연타해도 1초에 두 번쯤만 울림
    cooldown: 6
  # 운전 중 엔진 소리 (리소스팩 소리, 탈것마다 vehicles.yml 의 engine). 빠를수록 음이 높아지고, 서 있으면 작게 (골프 카트는 조용)
  engine:
    # false = 엔진 소리 없음
    enabled: true
    # 소리 크기 배율 (탈것마다의 크기 × 이 값, 0 ~ 2). 16블록까지 들림
    volume: 1.0
  # 작업기 (쟁기·로터리·파종기·수확기: README "작업기", 탈것마다는 contents/stsv/vehicle_tools.yml)
  tools:
    # 모든 탈것을 합쳐 한 틱에 작업기가 바꾸는 블록 수 (갈기·심기·수확 하나씩). 0 = 작업기가 일하지 않음
    blocks-per-tick: 24
    # 서버가 바쁠 때 쉬기: 평균 틱 시간(MSPT, 밀리초)이 이 값 이상이면 그 틱엔 쉬고, 이 값의 80% 이상이면 절반만. 0 = 늘 진행
    max-mspt: 40

editor:
  # /관리자 레시피 생성 에서 네임스페이스 없이 id 를 쓰면 이 콘텐츠 팩에 저장됩니다
  namespace: stsv

cosmetics:
  # true: OP(권한 stsv.cosmetic.*)는 모든 치장을 보유한 것으로 취급 (테스트용). 실제 운영은 false
  op-owns-all: false
  # /치장 시점: 마네킹까지 거리(블록). 미리보기 때 메뉴가 닫히므로 마네킹은 화면 가운데에 보입니다
  wardrobe-distance: 3.2
  # 치장 메뉴의 모양(칸 배치, 버튼, 배경 그림)은 contents/stsv/menus/wardrobe.yml 에 있습니다
  # 머리 위 / 어깨 / 등 / 꼬리 치장이 붙는 자리. 플레이어 머리 꼭대기(키 1.8칸 지점)에서 [왼쪽, 위, 앞] 블록 단위
  # (모델은 이 자리에 맞춰 만들어져 있음. 서버 전체에서 조금씩 옮기고 싶을 때만 바꾸세요)
  anchors:
    above: [0, 0.10, 0]
    shoulder: [0.38, -0.39, 0]
    back: [0, -0.62, -0.12]
    tail: [0, -1.02, -0.12]

# 저장소: 치장 보유, 플레이어 기록 등 월드와 별개로 남는 데이터
database:
  # sqlite = 플러그인 폴더의 파일 하나 (설정 불필요) / mysql = 여러 서버가 같은 데이터를 공유 (MariaDB 도 가능)
  type: sqlite
  sqlite-file: data/stsv.db
  mysql:
    host: localhost
    port: 3306
    database: stsv
    user: stsv
    password: ""
    pool-size: 6

# 부계정 금지: 한 IP에 한 계정. 그 IP로 처음 접속한 계정이 주인이 되고, 같은 IP의 다른 계정은 접속할 때 거절됩니다.
# 관리자(OP)와 /관리자 부계정 허용 <플레이어> 로 허용한 계정(같은 집에 사는 가족 등)은 검사하지 않고, IP의 주인도 되지 않습니다.
# 켤 때 이미 접속해 있던 사람은 그대로 두고, 그다음 접속부터 IP마다 처음 접속하는 계정이 주인이 됩니다.
# IP는 그대로 저장하지 않고 서버 비밀값(plugins/STSV/data/alt-secret.txt)으로 만든 해시만 저장합니다
# (MySQL을 여러 서버가 함께 쓰면 이 파일을 모든 서버에 같게 복사하세요). IPv6는 앞 64비트(한 집의 네트워크) 기준.
# 프록시(Velocity/BungeeCord)나 TCPShield 뒤에 있으면 실제 IP가 전달되도록 설정해야 합니다(아니면 모두 같은 IP로 보임).
alts:
  enabled: true
  # 이 기간(일) 동안 주인이 그 IP로 접속하지 않으면 IP가 풀려 다음 계정이 주인이 됨 (0 = 풀리지 않음)
  expire-days: 30
  # 이 컴퓨터·내부망(127.0.0.1, 192.168.x.x 등)에서의 접속은 검사하지 않음 (같은 공유기로 테스트할 때)
  ignore-local: true

# 플레이어 기록 (월드와 별개로 남음). 콘텐츠 기간: /관리자 기간 시작 <id> <이름> ~ /관리자 기간 종료
profiles:
  # 칭호를 채팅 이름 앞, 탭 목록 이름 앞에 표시
  title-in-chat: true
  # 채팅 한 줄 모양. {title} 칭호(없으면 빈칸), {name} 닉네임, {message} 내용. 나머지는 MiniMessage
  # 바닐라처럼 <이름> 으로 쓰려면: "{title}<{name}> {message}"
  chat-format: "{title}{name} <gray>»</gray> {message}"
  title-in-tab: true
  # /프로필 에 보여줄 통계 (순서대로)
  shown-stats: [playtime, mob_kills, player_kills, deaths, blocks_broken, blocks_placed]
  # 콘텐츠 기간이 끝날 때 명예의 전당에 남길 부문과 인원
  hall-of-fame: [playtime, mob_kills, player_kills, deaths]
  hall-size: 3

# 칭호 배너 (관리자 테스트 기능): 칭호와 닉네임을 움직이는 판에 담아 채팅 · 탭 목록 · 머리 위에 표시.
# /칭호 → '칭호 배너' 탭 (OP 또는 권한 stsv.title.banner 만 보임). 테마: 화염, 번개, 네온, 혈월, 프리즘
title-banners:
  enabled: true
  # 배너는 가진 사람만 씀 (후원 상점에서 사거나 /관리자 해금 지급 <플레이어> 배너 <id>). 관리자(OP · stsv.title.banner)는 전부 씀.
  # true = /칭호 의 칭호 배너 화면을 모두에게 보여 줌 (없는 배너는 잠긴 채 내 이름으로 미리보기), false = 배너를 가진 사람에게만
  show-locked: true
  # shader = 리소스팩의 글자 셰이더가 장면을 넘김 (채팅·탭 목록·머리 위 모두, 서버 부담 없음).
  #          셰이더를 쓰지 않는 클라이언트(OptiFine, Iris 셰이더 등)는 첫 장면으로 멈춰 보임
  # server = 셰이더 없이 서버가 머리 위 배너와 탭 목록을 장면마다 다시 보냄 (채팅은 멈춤)
  # static = 움직이지 않음
  # 바꾼 뒤 /관리자 리로드 (리소스팩을 다시 만들어 보냄). 마인크래프트 업데이트로 셰이더가 깨지면 static 으로
  animation: shader
  # server 모드에서 장면을 넘기는 간격 (틱, 1틱 = 50ms)
  server-frame-ticks: 2
  # 어디에 보일지
  chat: true
  tab: true
  name-tag: true
  # 머리 위 배너 크기 (0.5 = 배너 판 높이가 바닐라 이름표 한 줄 높이, 1 = 그 두 배)
  name-tag-size: 0.5

# 후원 상점 (/후원): 후원 재화로 꾸미기 상품을 사는 곳. 재화는 관리자가 입금을 확인하고 /관리자 후원 지급 <플레이어> <수량> 으로 줌
# (지금은 수동: 결제 연동 없음). 상품 · 가격 · 재화 이름 · 안내문은 contents/stsv/donation_shop.yml. 장부와 내역은 DB 에 남음 (README "후원 상점")
donation:
  # false = /후원 을 막음 (장부는 그대로, 관리자 명령어는 계속 됨)
  enabled: true

# 감정표현 (관리자 테스트 기능): /감정표현 <이름> 을 치면 내 스킨을 입은 관절 인형이 그 자리에서 동작을 하고,
# 나는 그 모습을 카메라로 지켜봄 (웅크리기 또는 /감정표현 그만 = 끝). OP 또는 권한 stsv.emote 만.
# 동작은 contents/stsv/emotes.yml (README "감정표현")
emotes:
  enabled: true
  # 한 번에 가장 오래 할 수 있는 시간 (초). 지나면 저절로 끝남
  max-seconds: 30
  # 끝난 뒤 다시 하기까지 기다리는 시간 (초, 0 = 없음)
  cooldown-seconds: 3
  # 이 거리 (블록) 안의 플레이어에게만 인형을 보냄 (인형은 글자 표시 엔티티 60~100개: 멀리까지 보낼수록 패킷이 많음)
  view-distance: 48
  # 보는 방식. body = 내 몸으로: 인형이 내 몸에 붙어 같이 움직이고 나는 평소처럼 걷고 둘러봄 (내 모습은 F5 로 봄)
  #           camera = 예전 방식: 인형은 제자리에 서고 나는 카메라에 붙어 지켜봄 (움직일 수 없음)
  view: body
  # 퀵 키: 제자리에서 Ctrl + Shift (달리기 키와 웅크리기 키를 함께) 를 누르면 감정표현 휠이 열림
  quick-key: true
  # 누구나 할 수 있는 감정표현 (emotes.yml 의 id). 나머지는 가진 사람만: 후원 상점, /관리자 해금 지급 <플레이어> 감정표현 <id>
  # 관리자(OP · stsv.emote.all)는 전부 함
  free: [bow]

# 무한 폭죽: 우클릭하면 폭죽이 올라가고 아이템은 줄지 않음. 겉날개로 나는 중에 쏘면 로켓처럼 밀어 줌. 폭죽에 맞아도 피해 없음
party-firework:
  enabled: true
  # 이 커스텀 아이템이 무한 폭죽 (contents/stsv/items/toys.yml)
  item: "stsv:infinite_firework"
  # 땅에서 한 번 쏜 뒤 다시 쏘기까지 (초)
  cooldown-seconds: 2.0
  # 겉날개로 나는 중에 쏘면 밀어 줌 (false = 나는 중에는 쏠 수 없음)
  boost: true
  # 밀어 주는 세기: 그만큼의 화약을 넣은 로켓과 같음 (1 ~ 3, 클수록 오래 밂)
  boost-power: 1
  # 나는 중에 다시 쏘기까지 (초)
  flight-cooldown-seconds: 1.0


# 화면 표시 (HUD): 오른쪽 사이드바, 체력·배고픔·방어 바, 화면 아래 안내 문구
hud:
  # pack = 리소스팩으로 그린 사이드바 패널(아이콘, 한글)과 체력바 (스코어보드를 쓰지 않아 다른 플러그인의 스코어보드·팀과 충돌 없음)
  # scoreboard = 예전 스코어보드 사이드바와 바닐라 하트 (리소스팩이 꺼져 있으면 자동으로 이쪽)
  # 바꾼 뒤 /관리자 리로드 하면 리소스팩도 다시 만들어 보냄
  mode: pack
  # 사이드바를 새로 그리는 간격 (틱)
  refresh-ticks: 20
  # 안내 문구(액션바)가 떠 있는 시간 (초)
  flash-seconds: 3
  sidebar:
    enabled: true
    # 기본 패널 위치 (GUI 픽셀, 보통 크기). 서버는 플레이어의 화면 크기를 알 수 없고 보스바 제목은 화면 가운데를 기준으로 그려지므로
    # right = 화면 가운데에서 패널 오른쪽 끝까지 (패널은 오른쪽 끝에 맞춰 왼쪽으로 늘어남).
    # 기본 212 = 16:9 화면의 자동 GUI 크기(720p·1440p·4K 모두 GUI 폭 427)에서 화면 오른쪽 끝에 딱 붙는 자리.
    # 플레이어는 /사이드바 위치 로 마우스를 움직여 자기 화면에 맞게 옮기고 휠로 크기(작게·보통·크게)를 바꿀 수 있음
    right: 212
    # y = 화면 맨 위에서 패널 위쪽 끝까지 (기본 54 = 상태 효과 아이콘 두 줄 아래).
    # 마우스로는 화면 맨 위부터 이 높이 조금 아래까지 한 줄씩 옮길 수 있음 (줄이 적은 패널일수록 더 아래까지)
    y: 54
    # 패널 최대 폭 (보통 크기 기준, 작게·크게는 글자 크기에 맞춰 줄고 늚. 넘는 줄은 두 줄로 고르게 나뉘고, 그래도 넘치면 … 로 줄임)
    max-width: 132
    # 최대 줄 수 (제목 제외, 크게는 최대 6줄). 줄이 늘면 패널을 둘 수 있는 높이마다 글꼴이 하나씩 늘어
    # 클라이언트 메모리가 줄당 약 0.8MB 늘어남 (기본 7줄: HUD 전체 약 9.4MB)
    max-rows: 7
    # 패널을 싣는 보스바 색. 리소스팩이 이 색의 보스바 막대를 투명하게 만듦 (다른 플러그인이 같은 색 보스바를 쓰면 그 막대도 안 보임)
    boss-bar-color: white
    # 줄마다 왼쪽 아이콘 (줄 id: coin, job, mission, event, star, clock, heart, food, armor). 없는 줄은 아이콘 없이
    icons:
      economy: coin
      eco-job: job
      eco-mission: mission
      eco-event: event
  health:
    # 바닐라 하트·배고픔·방어·공기 방울·탈것 하트 대신 숫자가 옆에 붙은 칸 나뉜 바 (독·시듦·동상 색, 흡수, 포화,
    # 피해·회복 순간 깜빡임). 끄면 바닐라 하트 그대로
    enabled: true
    # 방어 수치 바 (방어구를 입었을 때만, 하트 위 줄)
    armor: true
    # 바뀐 것이 없어도 이 간격(틱)마다 다시 보냄 (다른 플러그인이 액션바를 덮어써도 돌아오도록, 10 이상)
    resend-ticks: 20

# 돈 (단위 G, 정수). 잔액과 모든 거래 기록은 저장소에 남음 (월드와 별개)
economy:
  # 처음 접속한 플레이어가 받는 돈
  start-balance: 500
  # 송금 수수료 (0.02 = 2%, 최소 1G). 수수료는 사라짐 (돈 줄이기)
  transfer-fee: 0.02
  # 이 금액 이상 송금 / 수표 발행은 같은 명령을 한 번 더 입력해야 실행 (오타 방지)
  confirm-over: 10000
  # 수표 최소 금액
  cheque-min: 100
  # 오른쪽 사이드바에 잔액 표시
  hud: true

# 닉네임: /닉네임 <이름>. 마인크래프트 계정 이름에는 한글을 쓸 수 없어 서버가 대신 보여 주는 이름입니다.
# 채팅(이름에 마우스를 올리면 실제 이름), 접속·퇴장·사망·발전 과제 메시지, 탭 목록, 머리 위 이름, /프로필, 순위, 거래소·경매, 땅, 텔포 등
# 플레이어 이름이 나오는 곳에 모두 닉네임이 나옵니다. 플레이어를 적는 명령어(/텔포, /송금, /거래, /땅 초대 ...)는 닉네임도 받습니다.
# 저장소(database)에 남고 /관리자 초기화 경제·기록 으로 지워지지 않습니다. 관리: /관리자 닉네임 설정|해제|색|목록|정보
nicknames:
  enabled: true
  # 글자 수 (한글 한 글자 = 1). 한글·영문·숫자만, 띄어쓰기·기호·색 코드는 안 됨. 다른 사람의 닉네임(대소문자 무시)이나 실제 계정 이름과 같으면 안 됨
  min-length: 2
  max-length: 8
  # 처음 정하는 닉네임은 무료, 그다음부터 바꿀 때마다 이 금액(G). 해제는 무료
  change-cost: 5000
  # true: 경제 서버 플러그인(STSV-Economy)이 없는 서버에서는 닉네임 바꾸기·색이 모두 무료
  free-without-economy-plugin: true
  # 닉네임을 바꾼 뒤 다시 바꿀 수 있을 때까지(시간). 0 = 기다리지 않음. 관리자 명령은 상관없음
  cooldown-hours: 0
  # 닉네임에 들어가면 안 되는 말 (대소문자 무시, 포함되면 거절). 예:
  # banned-words: [관리자, 운영자, admin]
  banned-words: []
  # 머리 위 이름을 닉네임으로: 바닐라 이름표는 플레이어마다 만든 팀(stsv_n_<이름>)으로 숨기고 글자 디스플레이로 그림.
  # 웅크리면 흐려지고 벽 너머로 안 보임, 투명·관전·사망 중에는 안 보임, 자기 자신에게는 안 보임.
  # 다른 플러그인이 이미 팀에 넣은 플레이어는 건드리지 않음 (그 사람은 바닐라 이름표에 실제 이름). false = 바닐라 이름표 그대로
  name-tag: true
  # 머리 위 이름의 높이 (히트박스 꼭대기에서 블록)
  name-tag-height: 0.25
  # 탭 목록에서 닉네임 뒤에 실제 이름도 회색으로
  tab-real-name: false
  # 닉네임 색: /닉네임 색 (색 고르기 메뉴), /닉네임 색 #RRGGBB, /닉네임 색 #RRGGBB #RRGGBB (그라데이션), /닉네임 색 기본
  # 닉네임이 없어도 실제 이름에 색을 쓸 수 있음. 색은 이름과 따로 저장됨
  colors:
    enabled: true
    # 한 가지 색으로 바꾸는 값(G). first-free: true 면 처음 고르는 한 가지 색은 무료
    cost: 10000
    first-free: false
    # 그라데이션(두 색)으로 바꾸는 값(G)
    gradient-cost: 30000
    # 최소 밝기 (0~1, 사람 눈 기준 밝기). 채팅·탭 목록 배경이 어두워 이보다 어두운 색은 거절 (기본 0.35: 순수한 파랑, 짙은 회색, 검정 계열 거절)
    min-brightness: 0.35
    # 메뉴의 한 가지 색, 이름: "#RRGGBB" (메뉴 네 줄 = 36개)
    palette:
      벚꽃: "#ffb7c5"
      장미: "#ff5c7a"
      딸기: "#ff4d6d"
      산호: "#ff7f6a"
      다홍: "#ff6b3d"
      노을: "#ff9a5c"
      귤: "#ffa53d"
      호박: "#ffbf47"
      금빛: "#ffd36a"
      레몬: "#fff07a"
      연두: "#c8f07a"
      새싹: "#9be15d"
      풀잎: "#5fd068"
      민트: "#7ff0c8"
      에메랄드: "#3fd6a0"
      청록: "#36d1c4"
      하늘: "#8fd3ff"
      바다: "#4aa8ff"
      파랑: "#5b8cff"
      남색: "#6c7bff"
      라벤더: "#b9a6ff"
      보라: "#a97bff"
      포도: "#9b6bff"
      자두: "#d46bff"
      분홍: "#ff8ad8"
      솜사탕: "#ffc4ee"
      복숭아: "#ffc1a1"
      모래: "#e8d2a0"
      갈색: "#c8946a"
      초콜릿: "#b07a56"
      은빛: "#c9d1dc"
      구름: "#f2f5ff"
      하양: "#ffffff"
      잿빛: "#9aa0a8"
      얼음: "#c4f1ff"
      번개: "#e6ff4d"
    # 메뉴의 그라데이션, 이름: ["첫 글자 색", "끝 글자 색"] (메뉴 한 줄 = 9개)
    gradients:
      노을빛: ["#ffb347", "#ff5e8a"]
      오로라: ["#7ff0c8", "#b9a6ff"]
      바닷속: ["#8fd3ff", "#3f7bff"]
      벚꽃길: ["#ffd1dc", "#ff7aa8"]
      불꽃: ["#ffd36a", "#ff4d4d"]
      숲속: ["#c8f07a", "#3fbf6a"]
      꿈결: ["#ffc4ee", "#a8d8ff"]
      은하수: ["#b9a6ff", "#ff8ad8"]
      황금빛: ["#fff07a", "#ffa53d"]
