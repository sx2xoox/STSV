# STSV 코어 설정

resource-pack:
  # 리소스팩을 자동으로 만들어서 접속한 플레이어에게 보냅니다.
  enabled: true
  # 26.3 = 97 (서버 버전을 올리면 이 숫자도 올려야 합니다)
  pack-format: 97
  required: true
  prompt: "<gradient:#ffb35c:#ff6a3d>STSV</gradient> <gray>서버 전용 리소스팩이 필요합니다."
  # 내장 웹서버로 리소스팩을 배포합니다. public-url은 플레이어가 접속할 수 있는 주소여야 합니다.
  host:
    enabled: true
    bind: 0.0.0.0
    port: 8163
    public-url: "http://localhost:8163"
  # 내장 웹서버 대신 외부 주소를 쓸 때 (host.enabled: false 일 때 사용)
  external-url: ""

furniture:
  # 가구를 부술 때 아이템을 돌려줄지 (크리에이티브 제외)
  drop-on-break: true
  # 가구가 보이는 최대 거리 배율 (1.0 = 기본)
  view-range: 1.0
  # 가구 모델이 뒤돌아 보이면 180으로 바꾸세요 (충돌 블록 위치는 그대로입니다)
  display-yaw-offset: 0
  # 가구를 들고 있으면 설치될 위치를 미리 보여줍니다 (본인에게만 보임, 초록=설치 가능 / 빨강=불가)
  preview: true

editor:
  # /stsv recipe create 에서 네임스페이스 없이 id 를 쓰면 이 콘텐츠 팩에 저장됩니다
  namespace: stsv

cosmetics:
  # 치장을 본인 3인칭(F5) 화면에도 보여줍니다
  show-to-self: true
  # true: OP(권한 stsv.cosmetic.*)는 모든 치장을 보유한 것으로 취급 (테스트용). 실제 운영은 false
  op-owns-all: false
  # 옷장 시점: 마네킹까지 거리(블록). 미리보기 때 메뉴가 닫히므로 마네킹은 화면 가운데에 보입니다
  wardrobe-distance: 3.2
  # 옷장 메뉴의 모양(칸 배치, 버튼, 배경 그림)은 contents/stsv/menus/wardrobe.yml 에 있습니다

bosses:
  # 보스 모델이 보이는 거리 배율 (1.0 = 기본 엔티티 거리). 큰 보스는 멀리서도 보이게
  view-range: 2.0
  # 보스 모델이 판정보다 위/아래로 떠 보이면 조정 (블록, 위 = +)
  rider-offset-adjust: 0.0

# 저장소: 치장 보유, 플레이어 기록 등 월드와 별개로 남는 데이터
database:
  # sqlite = 플러그인 폴더의 파일 하나 (설정 불필요) / mysql = 여러 서버가 같은 데이터를 공유 (MariaDB 도 가능)
  type: sqlite
  sqlite-file: data/stsv.db
  mysql:
    host: localhost
    port: 3306
    database: stsv
    user: stsv
    password: ""
    pool-size: 6

# 플레이어 기록 (월드와 별개로 남음). 콘텐츠 기간: /stsv period start <id> <이름> ~ /stsv period end
profiles:
  # 칭호를 채팅 이름 앞, 탭 목록 이름 앞에 표시
  title-in-chat: true
  title-in-tab: true
  # /프로필 에 보여줄 통계 (순서대로)
  shown-stats: [playtime, mob_kills, player_kills, deaths, boss_kills, blocks_broken, blocks_placed]
  # 콘텐츠 기간이 끝날 때 명예의 전당에 남길 부문과 인원
  hall-of-fame: [playtime, mob_kills, player_kills, boss_kills, deaths]
  hall-size: 3

