name: STSV
version: '${version}'
main: dev.stsv.core.STSVPlugin
api-version: '26.3'
description: STSV 스트리머 서버 공통 코어 (콘텐츠 팩, 메뉴, 저장소, 기록, 경제, 리소스팩)
authors: [STSV]
softdepend: [Vault]
# database drivers, downloaded by the server from Maven Central on first start
libraries:
  - org.xerial:sqlite-jdbc:3.47.1.0
  - com.zaxxer:HikariCP:6.2.1
  - org.mariadb.jdbc:mariadb-java-client:3.5.1
commands:
  관리자:
    description: STSV 관리 명령어 (/관리자 도움말). 콘텐츠 플러그인의 관리 명령어도 여기에 모임
    aliases: [관리, stsv]
    usage: /관리자 <지급|아이템목록|목록|정보|레시피|연료|스킨|치장|보스|기간|칭호|통계|경제|보고서|초기화|리로드|리소스팩|...>
    permission: stsv.admin
  치장:
    description: 치장 입기·미리보기 (어디서나, 마네킹으로 보여 줌)
    aliases: [옷장, wardrobe, cosmetic]
    usage: /치장
    permission: stsv.wardrobe
  칭호:
    description: 가진 칭호 장착·해제, 아직 없는 칭호와 얻는 법
    aliases: [title, titles]
    usage: /칭호 [이름|해제]
    permission: stsv.profile
  업적:
    description: 업적 (쉬움 ~ 매우 어려움), 달성 보상 받기
    aliases: [achievements, achievement]
    usage: /업적 [순위]
    permission: stsv.profile
  프로필:
    description: 프로필 (기록, 칭호)
    aliases: [profile]
    usage: /프로필 [플레이어]
    permission: stsv.profile
  명예의전당:
    description: 명예의 전당
    aliases: [hall]
    usage: /명예의전당 [기간]
    permission: stsv.profile
  돈:
    description: 잔액 보기, 부자 순위
    aliases: [money, balance]
    usage: /돈 [플레이어|순위]
    permission: stsv.economy
  송금:
    description: 다른 플레이어에게 돈 보내기
    aliases: [pay]
    usage: /송금 <플레이어> <금액>
    permission: stsv.economy
  수표:
    description: 돈을 수표 아이템으로 꺼내기
    aliases: [cheque]
    usage: /수표 <금액>
    permission: stsv.economy
  메뉴:
    description: 통합 메뉴 (모든 기능을 한곳에서). 웅크린 채 F(Shift+F)로도 열림
    aliases: [menu, 통합메뉴]
    usage: /메뉴
    permission: stsv.menu
  건축월드:
    description: 건축월드로 이동 (땅을 사서 짓는 곳, 내 땅에서만 블록 변경)
    aliases: [build, 건축]
    usage: /건축월드
    permission: stsv.travel
  야생월드:
    description: 야생월드로 이동 (자원 채집용, 보호 없음, 가끔 초기화됨)
    aliases: [wild, 야생]
    usage: /야생월드
    permission: stsv.travel
  야간투시:
    description: 야간 투시 켜기·끄기 (켜 두면 접속을 끊거나 죽어도 유지)
    aliases: [nightvision, nv]
    usage: /야간투시
    permission: stsv.nightvision
permissions:
  stsv.nightvision:
    description: /야간투시
    default: true
  stsv.menu:
    description: 통합 메뉴 (/메뉴, Shift+F)
    default: true
  stsv.travel:
    description: /건축월드, /야생월드
    default: true
  stsv.economy:
    description: 돈, 송금, 수표
    default: true
  stsv.profile:
    description: 프로필, 명예의 전당 보기
    default: true
  stsv.wardrobe:
    description: 치장 (/치장) 사용
    default: true
  stsv.cosmetic.*:
    description: 모든 치장 사용 가능
    default: op
  stsv.admin:
    description: STSV 관리 명령어 사용
    default: op
