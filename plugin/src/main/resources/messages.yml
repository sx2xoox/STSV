  amount: "<gold>{amount} G</gold>"
  # 사이드바 줄: 탭(\t) 앞 = 이름, 뒤 = 값 (리소스팩 패널에서 값이 오른쪽 끝에 붙음)
  hud: "<gray>잔액\t{balance}"
  balance: "<gray>잔액: </gray>{balance}"
  balance-other: "<white>{player}</white><gray>의 잔액: </gray>{balance}"
  top-header: "<gold><b>부자 순위</b>"
  top-line: " <gray>{rank}.</gray> <white>{player}</white> <dark_gray>-</dark_gray> {balance}"
  not-found: "<red>그런 플레이어를 찾을 수 없습니다."
  not-number: "<red>금액은 1 이상의 정수로 입력하세요."
