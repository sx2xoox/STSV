  achievement-points: "<gray>업적 점수: <gold>{points}점 <dark_gray>({done}/{total})"
  achievements-name: "<gold>업적 · {points}점"
  achievements-done: "<gray>달성 <white>{done}/{total}"
  achievements-tier: "<dark_gray> · </dark_gray>{color}{tier} <gray>{done}/{total}"
  achievements-recent: "<gray>최근 달성:"
  achievements-click: "<yellow>클릭: /업적 <dark_gray>(내 업적)"

hall:
  header: "<gold><b>명예의 전당</b> <gray>{period}"
  category: "<yellow>{stat}"
