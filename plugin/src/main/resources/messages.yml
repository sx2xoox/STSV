# 플레이어에게 보이는 문구. MiniMessage 형식, {이름} 은 자리표시자.
# 이 파일을 고친 뒤 /관리자 리로드 하면 바로 적용됩니다. 지운 줄은 기본 문구로 돌아갑니다.

prefix: "<gradient:#ffb35c:#ff6a3d><b>STSV</b></gradient> <dark_gray>»</dark_gray> "

common:
  players-only: "<red>플레이어만 사용할 수 있습니다."
  none: "없음"

wardrobe:
  enter-first: "<red>먼저 /치장 을 입력하세요."
  dismount: "<red>탈것에서 내린 뒤 사용하세요."
  not-ground: "<red>땅에 서 있을 때 사용하세요."
  in-water: "<red>물이나 용암 밖에서 사용하세요."
  burning: "<red>불이 꺼진 뒤 사용하세요."
  in-combat: "<red>전투 중에는 쓸 수 없습니다. <gray>(피해를 입고 10초 뒤부터)"
  not-now: "<red>지금은 쓸 수 없습니다."
  no-room: "<red>앞쪽 공간이 부족합니다. 앞쪽 {blocks}칸이 트인 곳에서 사용하세요."
  took-off: "<gray>벗었습니다: </gray>{cosmetic}"
  wearing: "<green>착용: </green>{cosmetic}"
  wearing-replace: "<green>착용: </green>{cosmetic} <gray>({old} 대신)"
  # 없는 치장을 눌렀을 때 (마네킹에 입혀 보기만 하고 얻는 곳 안내): 얻는 곳마다
  locked-hint:
    gacha: "<gray>🔒 아직 없는 치장 · <white>치장 뽑기</white>에서 얻을 수 있어요 <dark_gray>(Shift+클릭: 뽑기 열기)"
    achievement: "<gray>🔒 아직 없는 치장 · <white>업적 보상</white>으로 얻을 수 있어요 <dark_gray>(/업적)"
    limited: "<gray>🔒 아직 없는 치장 · <gold>한정</gold> <white>주간 순위 1위 · 상인 행렬</white>에서만 얻어요"
    other: "<gray>🔒 아직 없는 치장 · 입혀 보기만 할 수 있어요"
  # 미리보기 화면 제목: 위 = 치장 이름, 아래 = 상태 + 안내
  title: "<gold>치장"
  hint: "<gray>웅크리기: 메뉴"
  state-none: "<gray>치장 없음"
  state-worn: "<green>✔ 착용 중"
  state-removed: "<gray>벗음"
  state-locked: "<red>🔒 미보유 · 미리보기"
  subtitle: "{state} <dark_gray>|</dark_gray> {hint}"
  left: "<green>착용 중인 치장: </green>{cosmetic} <gray>(F5로 확인. 투구 칸과는 별개)"
  left-self-hint: "<gray>머리 위·어깨·등·꼬리 치장은 다른 사람에게 보입니다. 내 화면에도 보려면 /치장 → <white>내 화면에 표시"
  # 탭 (부위 이름은 cosmetic.slot)
  tab-all: "전체"
  tab-worn: "착용 중"
  # 보기 버튼 (전부 → 가진 것만 → 없는 것만)
  view:
    all: "전부"
    owned: "가진 것만"
    missing: "없는 것만"
  view-on: "<white>▶ {view}"
  view-off: "<dark_gray>  {view}"
  take-off-all: "모든 치장 벗기"
  take-off-slot: "{slot} 치장 벗기"
  self-on: "<green>켜짐"
  self-off: "<gray>꺼짐"
  self-turned-on: "<green>내 화면에 표시: 켜짐 <gray>(1인칭에서도 보일 수 있어요)"
  self-turned-off: "<gray>내 화면에 표시: 꺼짐 <dark_gray>(다른 사람에게는 그대로 보임)"
  # 메뉴의 치장 설명
  lore-rarity: "{color}◆ {rarity} <dark_gray>· <gray>{slot}"
  lore-worn: ["<green>✔ 착용 중", "<gray>클릭: <white>벗기"]
  lore-owned: ["<green>보유 중", "<gray>클릭: <white>착용"]
  lore-replaces: "<dark_gray>(지금 착용 중인 {cosmetic} 대신)"
  # 없는 치장: 어두운 '?' 카드 (테두리·물음표 = 등급 색), 이름은 회색
  locked-name: "<dark_gray>{cosmetic}"
  lore-locked: ["<red>🔒 아직 없음"]
  lore-source: "<gray>얻는 곳: {source}"
  source:
    gacha: "<white>치장 뽑기 <gray>(/뽑기)"
    achievement: "<white>업적 보상 <gray>(/업적)"
    limited: "<gold>한정 <gray>(주간 순위 1위 · 상인 행렬)"
    other: "<white>특별 보상"
  lore-obtain: "<dark_gray>{obtain}"
  lore-locked-click: "<gray>클릭: <white>마네킹에 입혀 보기"
  lore-locked-gacha: "<gray>Shift+클릭: <white>치장 뽑기 열기"

cosmetic:
  voucher-unknown: "<red>이 교환권의 치장을 찾을 수 없습니다. 관리자에게 알려주세요."
  already-owned: "<yellow>이미 가지고 있는 치장입니다."
  got-title: "{color}<b>새 치장 획득!</b>"
  got-subtitle: "{cosmetic} <dark_gray>·</dark_gray> {color}{rarity}"
  got: "<green>치장 </green>{cosmetic}<green> 을(를) 얻었습니다. /치장 에서 입어보세요."
  slot:
    head: "머리"
    above: "머리 위"
    shoulder: "어깨"
    back: "등"
    tail: "꼬리"
    pet: "펫"
    trail: "발자취"
    kill: "처치 효과"

# 치장 뽑기 (/뽑기). 확률은 플레이어에게 보이지 않음 (contents/stsv/gacha.yml)
gacha:
  unavailable: "<red>지금은 치장 뽑기를 쓸 수 없습니다."
  busy: "<yellow>뽑기 결과를 보여 주는 중입니다."
  not-enough: "<red>돈이 부족합니다 <gray>({price} 필요)"
  daily-limit: "<red>오늘은 더 뽑을 수 없습니다 <gray>(하루 {limit}회, 남은 횟수 {left})"
  dropped: "<yellow>인벤토리가 가득 차서 교환권 {count}장을 발밑에 떨어뜨렸습니다. <gray>(나만 주울 수 있음)"
  confirm-click: "<yellow>클릭: 뽑기"
  confirm-again: "<gold><b>한 번 더 클릭하면 뽑습니다</b>"
  lore-new: ["<red>🔒 아직 없음 <dark_gray>· <white>나오면 바로 내 치장"]
  lore-owned: ["<green>보유 중 <dark_gray>· <gray>또 나오면 <white>교환권", "<dark_gray>교환권은 거래소에서 사고팔 수 있음"]
  # 뽑는 장면 (제목 / 부제목)
  roll-title: "<#f0e2b0>치장 뽑기{dots}"
  roll-hint: "{color}✦ ✦ ✦"
  counter: "<dark_gray>{n}/{of} · </dark_gray>"
  reveal-title: "{color}{cosmetic}"
  reveal-new: "{counter}{color}{rarity} <dark_gray>· <green>새 치장!"
  reveal-duplicate: "{counter}{color}{rarity} <dark_gray>· <yellow>중복 → 교환권"
  summary-title: "<#f0e2b0>뽑기 끝!"
  summary-subtitle: "<green>새 치장 {new}개 <dark_gray>· <yellow>교환권 {vouchers}장"
  result: "<gold>치장 뽑기 {count}회: </gold><green>새 치장 {new}개</green><gray>, </gray><yellow>교환권 {vouchers}장"
  result-new: " <dark_gray>-</dark_gray> {color}[{rarity}] {cosmetic} <green>새 치장"
  result-duplicate: " <dark_gray>-</dark_gray> {color}[{rarity}] {cosmetic} <yellow>교환권 <gray>(인벤토리)"
  wear-hint: "<gray>새 치장은 <white>/치장</white> 에서 입어 보세요."
  broadcast: "<white>{player}</white><gray> 님이 치장 뽑기에서 </gray>{color}[{rarity}] {cosmetic}<gray> 을(를) 뽑았습니다!"

achievement:
  done-title: "{color}<b>업적 달성!</b>"
  done: "<gold>업적 달성: </gold>{color}{name} <dark_gray>({tier} · {points}점)"
  claim-hint: "<yellow><u>[/업적 에서 보상 받기]</u>"
  broadcast: "<white>{player}</white><gray> 님이 </gray>{color}[{tier}]<gray> 업적 </gray>{color}{name}<gray> 을(를) 달성했습니다!"
  waiting: "<yellow>받지 않은 업적 보상이 {count}개 있습니다. <u>[/업적]</u>"
  loading: "<gray>업적 기록을 불러오는 중입니다. 잠시 뒤 다시 입력하세요."
  not-done: "<red>아직 달성하지 않은 업적입니다."
  already-claimed: "<gray>이미 받은 보상입니다."
  no-room: "<red>인벤토리에 빈칸이 {count}칸 필요합니다."
  claimed: "<green>보상 받음: </green>{color}{name} <dark_gray>→</dark_gray> {rewards}"
  nothing-to-claim: "<gray>받을 보상이 없습니다."
  reward-title: "<white>칭호 {title}"
  reward-cosmetic: "<white>치장 {cosmetic}"
  reward-special: "<light_purple>특별 보상"
  # 분류 화면
  category-progress: "<gray>달성 <white>{done}/{total} <dark_gray>{bar}"
  category-tier: "<dark_gray> · </dark_gray>{color}{tier} <gray>{done}/{total}"
  category-waiting: "<yellow>받을 보상 {count}개"
  category-click: "<dark_gray>클릭: 업적 보기"
  # 업적 설명
  secret-name: "<dark_gray>???"
  secret-description: "숨겨진 업적. 달성하면 보입니다."
  lore-tier: "{color}◆ {tier} <dark_gray>· <gray>{points}점"
  lore-progress: "<gray>진행 <white>{bar} <gray>{have} / {goal}"
  lore-done: "<green>✔ 달성 <dark_gray>({date})"
  lore-rewards: "<gray>보상:"
  lore-count: "<dark_gray>달성한 사람 {count}명"
  lore-claim: "<yellow>클릭: 보상 받기"
  lore-claimed: "<dark_gray>보상 받음"
  # 업적 순위 (/업적 순위)
  rank-header: "<gold><b>업적 순위</b> <gray>(점수: 쉬움 10 · 보통 25 · 어려움 50 · 매우 어려움 100)"
  rank-line: " <gray>{rank}.</gray> <white>{player}</white> <dark_gray>-</dark_gray> <gold>{points}점</gold> <dark_gray>({done}개)"
  rank-mine: " <dark_gray>…</dark_gray> <gray>내 순위 {rank}위 · {points}점"
  rank-empty: "<gray>아직 업적을 달성한 사람이 없습니다."

skin:
  not-applicable: "<red>이 스킨을 적용할 수 없는 아이템입니다."
  no-book: "<red>스킨북이 인벤토리에 없습니다."
