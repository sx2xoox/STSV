# 플레이어에게 보이는 문구. MiniMessage 형식, {이름} 은 자리표시자.
# 이 파일을 고친 뒤 /관리자 리로드 하면 바로 적용됩니다. 지운 줄은 기본 문구로 돌아갑니다.

prefix: "<gradient:#ffb35c:#ff6a3d><b>STSV</b></gradient> <dark_gray>»</dark_gray> "

common:
  players-only: "<red>플레이어만 사용할 수 있습니다."
  none: "없음"

wardrobe:
  enter-first: "<red>먼저 /치장 을 입력하세요."
  dismount: "<red>탈것에서 내린 뒤 사용하세요."
  not-ground: "<red>땅에 서 있을 때 사용하세요."
  in-water: "<red>물이나 용암 밖에서 사용하세요."
  burning: "<red>불이 꺼진 뒤 사용하세요."
  in-combat: "<red>전투 중에는 쓸 수 없습니다. <gray>(피해를 입고 10초 뒤부터)"
  not-now: "<red>지금은 쓸 수 없습니다."
  no-room: "<red>앞쪽 공간이 부족합니다. 앞쪽 {blocks}칸이 트인 곳에서 사용하세요."
  took-off: "<gray>벗었습니다: </gray>{cosmetic}"
  wearing: "<green>착용: </green>{cosmetic}"
  wearing-replace: "<green>착용: </green>{cosmetic} <gray>({old} 대신)"
  # 없는 치장을 눌렀을 때 (마네킹에 입혀 보기만 하고 얻는 곳 안내): 얻는 곳마다
  locked-hint:
    gacha: "<gray>🔒 아직 없는 치장 · <white>치장 뽑기</white>에서 얻을 수 있어요 <dark_gray>(Shift+클릭: 뽑기 열기)"
    achievement: "<gray>🔒 아직 없는 치장 · <white>업적 보상</white>으로 얻을 수 있어요 <dark_gray>(/업적)"
    limited: "<gray>🔒 아직 없는 치장 · <gold>한정</gold> <white>주간 순위 1위 · 상인 행렬</white>에서만 얻어요"
    other: "<gray>🔒 아직 없는 치장 · 입혀 보기만 할 수 있어요"
  # 미리보기 화면 제목: 위 = 치장 이름, 아래 = 상태 + 안내
  title: "<gold>치장"
  hint: "<gray>웅크리기: 메뉴"
  state-none: "<gray>치장 없음"
  state-worn: "<green>✔ 착용 중"
  state-removed: "<gray>벗음"
  state-locked: "<red>🔒 미보유 · 미리보기"
  subtitle: "{state} <dark_gray>|</dark_gray> {hint}"
  left: "<green>착용 중인 치장: </green>{cosmetic} <gray>(F5로 확인. 투구 칸과는 별개)"
  left-self-hint: "<gray>머리 위·어깨·등·꼬리 치장은 다른 사람에게 보입니다. 내 화면에도 보려면 /치장 → <white>내 화면에 표시"
  # 탭 (부위 이름은 cosmetic.slot)
  tab-all: "전체"
  tab-worn: "착용 중"
  # 보기 버튼 (전부 → 가진 것만 → 없는 것만)
  view:
    all: "전부"
    owned: "가진 것만"
    missing: "없는 것만"
  view-on: "<white>▶ {view}"
  view-off: "<dark_gray>  {view}"
  take-off-all: "모든 치장 벗기"
  take-off-slot: "{slot} 치장 벗기"
  self-on: "<green>켜짐"
  self-off: "<gray>꺼짐"
  self-turned-on: "<green>내 화면에 표시: 켜짐 <gray>(1인칭에서도 보일 수 있어요)"
  self-turned-off: "<gray>내 화면에 표시: 꺼짐 <dark_gray>(다른 사람에게는 그대로 보임)"
