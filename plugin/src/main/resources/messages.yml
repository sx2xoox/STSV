# /관리자 보고서 주변 [반경]: 관리자 주변의 3D 모델(디스플레이 엔티티)과 클릭 상자(상호작용 엔티티)를 종류별로 셈.
# "보이는 거리 안" = 그 자리에 선 플레이어(엔티티 거리 100%)가 그리는 수 (화면 밖은 클라이언트가 건너뜀), 면 = 그 모델들의 면 수 합
models:
  usage: "<red>/관리자 보고서 주변 [반경] <gray>(블록, 기본 {radius}, 최대 {max} · 게임 안에서만)"
  title: "<gold>주변 {radius}블록 안의 3D 모델 <gray>({world} {x}, {y}, {z})"
  line: " <gray>{name} <white>{count}</white>개 <dark_gray>· <gray>보이는 거리 안 <white>{drawn}</white>개, 면 <white>{faces}</white>{nobox}"
  no-box: " <dark_gray>(화면 밖에서도 그림 {count}개)"
  line-hit: " <gray>{name} <white>{count}</white>개 <dark_gray>(그리지 않음, 클릭용)"
